[project]
name = "infx"
version = "0.1.0"
description = "Configuration, workflow, and result tooling for InferenceX"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
]

[project.scripts]
infx = "infx.cli:main"

[project.optional-dependencies]
recipes = ["jinja2==3.1.6", "marshmallow==4.3.1", "marshmallow-dataclass==8.7.1", "requests==2.34.2", "rich==15.0.0", "ruamel.yaml==0.19.1"]
workflows = ["codeowners==0.9.0", "PyGithub==2.10.0", "GitPython==3.2.1"]
results = ["psycopg2-binary==2.9.13", "tabulate==0.10.0"]

[dependency-groups]
test = [
    "aiohttp==3.14.5",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "packaging==26.3",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "torch==2.15.0",
    "transformers==5.22.1",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "PT12H"
cache-keys = [{ file = "pyproject.toml" }, { file = "infx/**" }]

[tool.uv.build-backend]
module-root = "."
# The test suite lives beside the package but is not shipped in the wheel.
wheel-exclude = ["infx/tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
