# AgentX replay of the SemiAnalysis CC traces (062126 corpus), same as
# agentx-cc-062126.yaml, with sampling pinned to the model's generation_config
# defaults (top_p 0.95, temperature 1.0). The stock sglang engine applies these
# via sampling_defaults='model' when the request omits them; a dynamo frontend
# in front may inject its own defaults instead. Pinning them in the endpoint
# extra makes both stacks sample identically regardless of frontend behavior.
# Used by serving/glm53-w4afp8-dynamo-agentx-topp95.yaml for the 1:1 A/B rerun.
schemaVersion: "2.0"
benchmark:
  scenario: inferencex-agentx-mvp
  unsafeOverride: true
  endpoint:
    type: chat
    path: /v1/chat/completions
    streaming: true
    useServerTokenCount: true
    extra:
      top_p: 0.95
      temperature: 1.0
  datasets:
  - name: main
    type: public
    dataset: semianalysis_cc_traces_weka_062126
    entries: 393
    randomSeed: 42
    traceIdleGapCapSeconds: 300.0
    maxContextLength: 262144
  phases:
  - name: profiling
    kind: profiling
    type: concurrency
    duration: 3600.0
    gracePeriod: 30.0
    failedRequestThreshold: 0.1
    trajectoryStartMinRatio: 0.25
    trajectoryStartMaxRatio: 0.75
    warmupRequestsPerLane: 10
    agenticWarmupGracePeriod: 1800.0
  artifacts:
    sliceDuration: 1.0
  tokenizer:
    trustRemoteCode: true
  runtime:
    statsInterval: 30.0
randomSeed: 42
