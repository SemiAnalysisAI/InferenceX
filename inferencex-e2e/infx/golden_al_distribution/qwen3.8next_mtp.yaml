# Source GitHub Actions run: https://github.com/SemiAnalysisAI/InferenceX/actions/runs/33034290269
# Acceptance Length (AL) reference values measured with SPEED-Bench.
# dataset: coding | output_len: 4096
# thinking_on : temp 1.0 top_p 0.95 top_k 20 presence_penalty 0.0 | chat_template_kwargs: {"enable_thinking": true}
# thinking_off: temp 0.7 top_p 0.8 top_k 20 presence_penalty 1.5 | chat_template_kwargs: {"enable_thinking": false}
# Measured on qwen3.8-flash-next-fp8 (B300, vLLM native MTP), per num_speculative_tokens.
# Auto-generated by benchmarks/single_node/speedbench/qwen3.8next_fp4_b300_vllm.sh (speedbench-al.yml).
#
# key = num_speculative_tokens (MTP level); value = golden AL
qwen3.8-flash-next-fp8:
  thinking_on:
    1: 1.65
    2: 2.06
    3: 2.32
    4: 2.47
    5: 2.59
    6: 2.66

# SPEED-Bench client settings of this collection; the acceptance-length gate replays them
# (README.md#collection-settings).
collection:
  concurrency: 64
  renderer: chat_template
  modes:
    thinking_on:
      chat_template_kwargs: {enable_thinking: true}
      sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, presence_penalty: 0.0, repetition_penalty: 1.0}
