source_run: https://github.com/SemiAnalysisAI/InferenceX/actions/runs/41121037354
# Acceptance Length (AL) reference values measured with SPEED-Bench.
# dataset: coding | temperature: 1.0 | top_p: 0.95 | top_k: 40 | output_len: 4096
# thinking_on chat_template_kwargs: {"thinking_mode": "enabled"}
# thinking_off chat_template_kwargs: {"thinking_mode": "disabled"}
# Measured on minimax-m3 (B300, vLLM EAGLE3), per num_speculative_tokens.
# draft: Inferact/MiniMax-M3-EAGLE3-GQA
# speculative-config extras: {"rejection_sample_method": "block"}
# Auto-generated by benchmarks/single_node/speedbench/minimaxm3_fp4_b300_vllm_gqa_block_rejection_sample_method.sh (speedbench-al.yml).
#
# key = num_speculative_tokens (EAGLE3 level); value = golden AL
minimax-m3:
  thinking_on:
    1: 1.79
    2: 2.37
    3: 2.76
    4: 3.01
    5: 3.20
    6: 3.36
    7: 3.52
    8: 3.51
  thinking_off:
    1: 1.83
    2: 2.44
    3: 2.93
    4: 3.25
    5: 3.55
    6: 3.66
    7: 3.78
    8: 3.89

# SPEED-Bench client settings of this collection; the acceptance-length gate replays them
# (README.md#collection-settings).
collection:
  renderer: chat_template
  modes:
    thinking_on:
      chat_template_kwargs: {thinking_mode: enabled}
      sampling: {temperature: 1.0, top_p: 0.95, top_k: 40, repetition_penalty: 1.0}
    thinking_off:
      chat_template_kwargs: {thinking_mode: disabled}
      sampling: {temperature: 1.0, top_p: 0.95, top_k: 40, repetition_penalty: 1.0}
