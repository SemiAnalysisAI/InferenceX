source_run: https://github.com/SemiAnalysisAI/InferenceX/actions/runs/41288481245
# Acceptance Length (AL) reference values measured with SPEED-Bench.
# dataset: coding | temperature: 1.0 | top_p: 0.95 | output_len: 4096
# thinking_on chat_template_kwargs: {"reasoning_effort": "max"} (the chat template's default effort)
# Measured on glm-5.3-flash (FP8, B300, vLLM MTP, TP8, concurrency 1), per num_speculative_tokens.
#
# key = num_speculative_tokens (MTP level); value = golden AL
glm-5.3-flash:
  thinking_on:
    1: 1.86
    2: 2.52
    3: 3.00
    4: 3.35
    5: 3.60
    6: 3.79
    7: 3.93
    8: 3.99

# SPEED-Bench client settings of this collection; the acceptance-length gate replays them
# (README.md#collection-settings).
collection:
  renderer: chat_template
  modes:
    thinking_on:
      chat_template_kwargs: {reasoning_effort: max}
      sampling: {temperature: 1.0, top_p: 0.95, repetition_penalty: 1.0}
