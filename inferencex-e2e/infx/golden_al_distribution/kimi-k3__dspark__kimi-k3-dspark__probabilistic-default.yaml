source_run: https://github.com/SemiAnalysisAI/InferenceX/actions/runs/41121033716
# Acceptance Length (AL) reference values measured with SPEED-Bench.
# dataset: coding | top_p: 0.95 | output_len: 4096
# thinking_on: temperature=1.0, chat_template_kwargs: {"thinking": true}
# thinking_off: temperature=0.6, chat_template_kwargs: {"thinking": false}
# Measured on kimi-k3 (B300, vLLM DSpark, draft: Inferact/Kimi-K3-DSpark), per num_speculative_tokens.
# speculative-config extras: {"draft_sample_method": "probabilistic"}
# Auto-generated by benchmarks/single_node/speedbench/kimik3_fp4_b300_vllm_probabilistic_sample_method.sh (speedbench-al.yml).
#
# key = num_speculative_tokens (DSpark level); value = golden AL
kimi-k3:
  thinking_on:
    1: 1.86
    2: 2.48
    3: 2.96
    4: 3.24
    5: 3.53
    6: 3.69
    7: 3.84
    8: 3.98
  thinking_off:
    1: 1.89
    2: 2.62
    3: 3.10
    4: 3.41
    5: 3.92
    6: 4.07
    7: 4.22
    8: 4.62

# SPEED-Bench client settings of this collection; the acceptance-length gate replays them
# (README.md#collection-settings).
collection:
  renderer: chat_template
  modes:
    thinking_on:
      chat_template_kwargs: {thinking: true}
      sampling: {temperature: 1.0, top_p: 0.95, repetition_penalty: 1.0}
    thinking_off:
      chat_template_kwargs: {thinking: false}
      sampling: {temperature: 0.6, top_p: 0.95, repetition_penalty: 1.0}
