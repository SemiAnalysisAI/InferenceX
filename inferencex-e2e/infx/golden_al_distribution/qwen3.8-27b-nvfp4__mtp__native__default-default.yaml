  renderer: chat_template
  modes:
    thinking_on:
      chat_template_kwargs: {enable_thinking: true}
      sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, presence_penalty: 0.0, repetition_penalty: 1.0}
