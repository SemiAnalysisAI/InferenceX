# Pattern: synthetic search grid, full 24-scenario ladder (ISL {8k,32k,64k,128k} x OSL {512,1k} x cache {0,50,90}).
# Qwen3.8-27B-FP8 (hybrid GDN), SGLang v0.5.23, 1xH200. Winning fixed-CCU config (run 40993666854, TPM 1.28M at c64)
# with max-running-requests raised to 256 and hicache 64 GB/rank; ctx 1M via the Qwen model card's YaRN recipe.
# AIPerf adaptive search finds the max concurrency under the default SLO (TTFT avg < 8s, ITL p90 < 50ms) per scenario.
name: qwen38-fp8-eagle-v0523-sweep-1gpu
runner: h200-hcm
image: lmsysorg/sglang:v0.5.23
model: Qwen/Qwen3.8-27B-FP8
gpus: 1
precision: fp8
env:
  FLASHINFER_CUDA_ARCH_LIST: "12.0f"
  SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"
serve: |
  python3 -m sglang.launch_server
  --model-path Qwen/Qwen3.8-27B-FP8
  --trust-remote-code
  --kv-cache-dtype fp8_e4m3
  --mem-fraction-static 0.85
  --attention-backend fa3
  --chunked-prefill-size 8192
  --max-prefill-tokens 16384
  --json-model-override-args '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
  --context-length 1000000
  --max-running-requests 256
  --speculative-algorithm EAGLE --speculative-num-steps 3
  --speculative-eagle-topk 1 --speculative-num-draft-tokens 4
  --enable-linear-replayssm-spec
  --mamba-full-memory-ratio 1.5
  --schedule-policy dfs-weight
  --enable-hierarchical-cache --hicache-size 64
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder
  --enable-metrics --enable-cache-report
scenario: synthetic
workload:
  isl: [8k, 32k, 64k, 128k]
  osl: ['512', 1k]
  cache: [0, 50, 90]
  search: true
conc: 1
