# Pattern: synthetic workload at fixed concurrency, engine-bump arm. Qwen3.8-27B-FP8 (hybrid GDN), 1xH200.
# Same serve config as qwen38-fp8-eagle-isl8k-c90-c64mr-base (mr64, fp32 state, ratio 1.5, chunk 8k) with the
# image bumped lmsysorg/sglang:v0.5.19 -> v0.5.23 (adds QSA prefill KV gathering fuse #41933, hybrid Mamba
# extend without host syncs, fused EAGLE acceptance prep). Isolates the engine gain at fixed conc 64.
name: qwen38-fp8-eagle-isl8k-c90-c64-v0523-base
runner: h200-hcm
image: lmsysorg/sglang:v0.5.23
model: Qwen/Qwen3.8-27B-FP8
gpus: 1
precision: fp8
env:
  FLASHINFER_CUDA_ARCH_LIST: "12.0f"
serve: |
  python3 -m sglang.launch_server
  --model-path Qwen/Qwen3.8-27B-FP8
  --trust-remote-code
  --kv-cache-dtype fp8_e4m3
  --mem-fraction-static 0.85
  --attention-backend flashinfer
  --chunked-prefill-size 8192
  --max-prefill-tokens 16384
  --context-length 262144
  --max-running-requests 64
  --speculative-algorithm EAGLE --speculative-num-steps 3
  --speculative-eagle-topk 1 --speculative-num-draft-tokens 4
  --enable-linear-replayssm-spec
  --mamba-full-memory-ratio 1.5
  --schedule-policy dfs-weight
  --enable-hierarchical-cache --hicache-size 24
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder
  --enable-metrics --enable-cache-report
scenario: synthetic
workload: {isl: [8k], osl: [1k], cache: [90], search: false}
conc: [64]
