clusters:
  h100-cw:
    gpus-per-node: 8
    available-cpu-dram-mib: 1_998_848
    arch: x86_64
    scheduler: slurm
    slurm:
      partition: h100
      exclusive: false
      gres: "gpu:h100:{gpus}"
      volumes:
        hf-hub-cache: {path: /mnt/vast/gharunner/hf-hub-cache}
      squash:
        dir: /mnt/vast/gharunner/squash
        visibility: shared
        import: compute
        lock-timeout-s: 600
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        gpus-per-node-directive: false
        single-node-exclusive: false
  h100-dsxe:
    gpus-per-node: 8
    available-cpu-dram-mib: 1_915_904
    arch: x86_64
    models:
      entries:
        DeepSeek-V4.1-Flash: {root: data-models, dir: DeepSeek-V4.1-Flash}
        MiniMax-M3-MXFP8: {root: data-models, dir: MiniMax-M3-MXFP8}
        Muse-Spark-Open-816B-A42B-NVFP4: {root: data-models, dir: Muse-Spark-Open-816B-A42B-NVFP4}
        Qwen3.5-397B-A17B-FP8: {root: data-models, dir: Qwen3.5-397B-A17B-FP8}
    scheduler: slurm
    slurm:
      partition: batch_1
      account: benchmark
      exclusive: false
      gres: "gpu:{gpus}"
      volumes:
        hf-hub-cache: {path: /data/home/sa-gha-runner/gharunners/hf-hub-cache}
        aiperf-cache: {path: /data/home/sa-gha-runner/gharunners/ai-perf-cache}
        data-models: {path: /data/models}
      squash:
        dir: /data/home/sa-gha-runner/gharunners/squash
        visibility: shared
        import: compute
        lock-timeout-s: 600
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        single-node-models: staged
  h200-dgxc:
    gpus-per-node: 8
    available-cpu-dram-mib: 1_471_356
    arch: x86_64
    models:
      entries:
        DeepSeek-R1-0528: {root: models, dir: DeepSeek-R1-0528}
        GLM-5.2-FP8: {root: models, dir: GLM-5.2-FP8}
        DeepSeek-V4-Pro-0813: {root: hf-hub-cache, dir: DeepSeek-V4-Pro}
        Kimi-K3: {root: hf-hub-cache, dir: Kimi-K3}
        Muse-Spark-Open-816B-A42B-NVFP4: {root: hf-hub-cache, dir: Muse-Spark-Open-816B-A42B-NVFP4}
        Qwen3.5-397B-A17B-FP8: {root: hf-hub-cache, dir: Qwen3.5-397B-A17B-FP8}
    scheduler: slurm
    slurm:
      partition: main
      account: sa-shared
      exclusive: false
      gres: "gpu:{gpus}"
      volumes:
        hf-hub-cache: {path: /models/gharunners/hf-hub-cache}
        aiperf-cache: {path: /home/sa-shared/gharunners/ai-perf-cache}
        models: {path: /models}
      squash:
        dir: /data/containers
        visibility: shared
        import: compute
        lock-timeout-s: 1800
        framework-dirs:
          dynamo-sglang:
            key-style: plus
            import: unchecked
            model-prefixes:
              dsv4: {key-style: plus}
              glm5.2: {dir: /data/gharunners/containers}
          dynamo-trt: {key-style: plus-strip-nvcr, import: unchecked}
          vllm: {dir: /data/gharunners/containers, import: unchecked}
        helper-dirs:
          nginx: {key-style: plus, import: unchecked}
          dcgm-exporter: {dir: /data/gharunners/containers}
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        fabric:
          socket-ifname: [eth0]
        job-tag: h200
        gpus-per-node-directive: true
        segment-directive: false
        container-aliases: [dynamo-trtllm, dynamo-sglang, dynamo-vllm, latest]
        nginx-aliases: [nginx-sqsh]
        volume-mounts:
          aiperf-cache: /aiperf_mmap_cache
          hf-hub-cache: /hf_hub_cache
        power-exporter-port: 9401
  b200-nscale:
    gpus-per-node: 8
    available-cpu-dram-mib: 2_047_536
    arch: x86_64
    models:
      download-root: writable-models
      entries:
        DeepSeek-R1-0528: {root: scratch, dir: DeepSeek-R1-0528}
        DeepSeek-R1-0528-NVFP4-v2: {root: scratch, dir: DeepSeek-R1-0528-NVFP4-v2}
        DeepSeek-R1-0528-FP4-V2: {root: scratch, dir: DeepSeek-R1-0528-NVFP4-v2}
        deepseek-r1-fp4: {root: scratch, dir: DeepSeek-R1-0528-NVFP4-v2}
        DeepSeek-V4-Pro: {root: scratch, dir: DeepSeek-V4-Pro}
        DeepSeek-V4-Pro-0813: {root: scratch, dir: DeepSeek-V4-Pro-0813}
        DeepSeek-V4-Pro-NVFP4: {root: scratch, dir: DeepSeek-V4-Pro-NVFP4}
        GLM-5.2-FP8: {root: scratch, dir: GLM-5.2-FP8}
        GLM-5.2-NVFP4: {root: scratch, dir: GLM-5.2-NVFP4}
        Kimi-K3: {root: scratch, dir: Kimi-K3}
        MiniMax-M3-MXFP8: {root: scratch, dir: MiniMax-M3-MXFP8}
        MiniMax-M3-NVFP4: {root: scratch, dir: MiniMax-M3-NVFP4}
        MiniMax-M3.1-Flash: {root: data-models, dir: MiniMax-M3.1-Flash}
        Muse-Spark-Open-816B-A42B-NVFP4: {root: data-models, dir: Muse-Spark-Open-816B-A42B-NVFP4}
        Qwen3.5-397B-A17B-FP8: {root: scratch, dir: Qwen3.5-397B-A17B-FP8}
        Qwen3.5-397B-A17B-NVFP4: {root: scratch, dir: Qwen3.5-397B-A17B-NVFP4}
        Qwen3.5-397B-A17B-NVFP4-V2: {root: scratch, dir: Qwen3.5-397B-A17B-NVFP4-V2}
        Qwen3.8-Flash-Next-NVFP4: {root: scratch, dir: Qwen3.8-Flash-Next-NVFP4}
    scheduler: slurm
    slurm:
      partition: batch_1
      account: benchmark
      exclusive: true
      gres: "gpu:{gpus}"
      volumes:
        hf-home: {path: ~/.cache/huggingface}
        hf-hub-cache: {path: /data/home/sa-shared/gharunners/hf-hub-cache}
        aiperf-cache: {path: /data/home/sa-shared/gharunners/aiperf-cache}
        scratch: {path: /scratch/models, visibility: node-local}
        data-models: {path: /data/models, visibility: shared}
        writable-models: {path: /data/home/sa-shared/gharunners/models}
      squash:
        dir: /data/home/sa-shared/containers
        visibility: shared
        import: submit-host
        lock-timeout-s: 3600
        lock-file: locks-dir
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        fabric:
          rdma-devices: [mlx5_0, mlx5_1, mlx5_2, mlx5_3, mlx5_4, mlx5_5, mlx5_10, mlx5_11]
          rdma-device-ports: [mlx5_0:1, mlx5_1:1, mlx5_2:1, mlx5_3:1, mlx5_4:1, mlx5_5:1, mlx5_10:1,
                              mlx5_11:1]
          rdma-gid-index: 3
        job-tag: b200
        default-time-limit: "4:00:00"
        single-node-models: staged
        container-aliases: [dynamo-vllm, dynamo-sglang, dynamo-trtllm, sglang-v0.5.11-cu130]
        nginx-aliases: [nginx-sqsh]
        agentic-volume-mounts:
          aiperf-cache: /aiperf_mmap_cache
          hf-hub-cache: /hf_hub_cache
        power-exporter-port: 9401
