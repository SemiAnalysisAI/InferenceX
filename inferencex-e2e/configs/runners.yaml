clusters:
  h100-cw:
    gpus-per-node: 8
    available-cpu-dram-mib: 1_998_848
    arch: x86_64
    scheduler: slurm
    slurm:
      partition: h100
      exclusive: false
      gres: "gpu:h100:{gpus}"
      volumes:
        hf-hub-cache: {path: /mnt/vast/gharunner/hf-hub-cache}
      squash:
        dir: /mnt/vast/gharunner/squash
        visibility: shared
        import: compute
        lock-timeout-s: 600
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        gpus-per-node-directive: false
        single-node-exclusive: false
  h100-dgxc:
    gpus-per-node: 8
    available-cpu-dram-mib: 2_063_837
    arch: x86_64
    models:
      entries:
        DeepSeek-R1-0528: {root: lustre-models, dir: dsr1-fp8}
    scheduler: slurm
    slurm:
      partition: hpc-gpu-1
      account: customer
      exclusive: false
      gres: "gpu:{gpus}"
      volumes:
        hf-hub-cache: {path: /mnt/nfs/sa-shared/gharunners/hf-hub-cache}
        aiperf-cache: {path: /mnt/nfs/sa-shared/gharunners/ai-perf-cache}
        lustre-models: {path: /mnt/nfs/lustre/models}
      squash:
        dir: /mnt/nfs/lustre/containers
        visibility: shared
        import: pre-staged
        framework-dirs:
          dynamo-trt: {dir: /mnt/nfs/sa-shared/containers, key-style: plus-strip-nvcr}
        helper-dirs:
          nginx: {import: unchecked}
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        job-tag: h100
        default-time-limit: "6:00:00"
        dist-timeout-s: 1800
        gpus-per-node-directive: true
        segment-directive: false
        container-aliases: [dynamo-trtllm, dynamo-sglang, latest]
        nginx-aliases: [nginx-sqsh]
        uv-cache-root: /mnt/nfs/sa-shared/.uv
  h200-cw:
    gpus-per-node: 8
    available-cpu-dram-mib: 1_998_848
    arch: x86_64
    scheduler: slurm
    slurm:
      partition: h200
      exclusive: false
      gres: "gpu:h200:{gpus}"
      volumes:
        hf-hub-cache: {path: /mnt/vast/gharunner/hf-hub-cache}
        aiperf-cache: {path: /mnt/vast/gharunner/ai-perf-cache}
      squash:
        dir: /mnt/vast/gharunner/squash
        visibility: shared
        import: compute
        lock-timeout-s: 600
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        gpus-per-node-directive: false
        single-node-exclusive: false
  h200-dgxc:
    gpus-per-node: 8
    available-cpu-dram-mib: 1_471_356
    arch: x86_64
    models:
      entries:
        DeepSeek-R1-0528: {root: models, dir: DeepSeek-R1-0528}
        GLM-5.2-FP8: {root: models, dir: GLM-5.2-FP8}
        DeepSeek-V4-Pro-0813: {root: hf-hub-cache, dir: DeepSeek-V4-Pro}
        Kimi-K3: {root: hf-hub-cache, dir: Kimi-K3}
        Qwen3.5-397B-A17B-FP8: {root: hf-hub-cache, dir: Qwen3.5-397B-A17B-FP8}
    scheduler: slurm
    slurm:
      partition: main
      account: sa-shared
      exclusive: false
      gres: "gpu:{gpus}"
      volumes:
        hf-hub-cache: {path: /models/gharunners/hf-hub-cache}
        aiperf-cache: {path: /home/sa-shared/gharunners/ai-perf-cache}
        models: {path: /models}
      squash:
        dir: /data/containers
        visibility: shared
        import: compute
        lock-timeout-s: 1800
        framework-dirs:
          dynamo-sglang:
            key-style: plus
            import: unchecked
            model-prefixes:
              dsv4: {key-style: plus}
              glm5.2: {dir: /data/gharunners/containers}
          dynamo-trt: {key-style: plus-strip-nvcr, import: unchecked}
          vllm: {dir: /data/gharunners/containers, import: unchecked}
        helper-dirs:
          nginx: {key-style: plus, import: unchecked}
          dcgm-exporter: {dir: /data/gharunners/containers}
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        job-tag: h200
        gpus-per-node-directive: true
        segment-directive: false
        container-aliases: [dynamo-trtllm, dynamo-sglang, dynamo-vllm, latest]
        nginx-aliases: [nginx-sqsh]
        volume-mounts:
          aiperf-cache: /aiperf_mmap_cache
          hf-hub-cache: /hf_hub_cache
  b200-cw:
    gpus-per-node: 8
    arch: x86_64
    scheduler: slurm
    slurm:
      partition: b200
      exclusive: false
      gres: "gpu:b200:{gpus}"
      volumes:
        hf-hub-cache: {path: /tmp/gharunner/hf-hub-cache, visibility: node-local}
      squash:
        dir: /tmp/gharunner/squash
        visibility: node-local
        import: all-nodes
        lock-timeout-s: 600
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
        gpus-per-node-directive: false
        single-node-exclusive: false
  b200-nb:
    gpus-per-node: 8
    arch: x86_64
    env:
      UCX_NET_DEVICES: eth0
    scheduler: slurm
    slurm:
      partition: main
      exclusive: true
      gres: "gpu:{gpus}"
      volumes:
        hf-hub-cache: {path: /mnt/data/gharunners/hf-hub-cache}
      srt-slurm:
        extra:
          default_gpu_exporter:
            container_image: nvcr.io#nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
            port: 9401
            command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
        network-interface: ""
  b200-nscale:
    gpus-per-node: 8
    available-cpu-dram-mib: 2_063_920
