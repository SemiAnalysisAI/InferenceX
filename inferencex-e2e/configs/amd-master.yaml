# MI355X FP8 AgentX via ATOM with MTP (3 draft tokens), TP4 only, following the
# standalone recipe (ROCm/ATOM PR 2592). CONC 1-40 serve off the GPU prefix
# cache; CONC 48-80 add the LMCache DRAM tier at 363 GB per rank (253 GB KV +
# 110 GB GDN state), within the TP4 share at dram-utilization 1.0.
qwen3.5-fp8-mi355x-atom-agentic-mtp:
  image: rocm/atom-dev:nightly_202610181506
  model: Qwen/Qwen3.5-397B-A17B-FP8
  model-prefix: qwen3.5
  runner: cluster:mi355x-amds
  precision: fp8
  framework: atom
  multinode: false
  srt-recipe-dir: qwen3.5/atom/mi355x-fp8-mtp
  scenarios:
    agentic-coding:
    - dram-utilization: 1.0
      search-space:
      - { tp: 4, ep: 1, kv-offloading: none, conc-list: [1, 4, 8, 16, 24, 32, 40], spec-decoding: mtp, srt-recipe: agentic.yaml }
      - { tp: 4, ep: 1, kv-offloading: dram, kv-offload-backend: { name: lmcache, version: "0.5.6.dev139+gf22dec28" }, conc-list: [48, 56, 64, 80], spec-decoding: mtp, srt-recipe: agentic.yaml }

qwen3.5-fp8-mi355x-sglang-disagg:
  image: lmsysorg/sglang:v0.5.16-rocm720-mi35x
  model: Qwen/Qwen3.5-397B-A17B-FP8
  model-prefix: qwen3.5
  runner: cluster:mi355x-amds
  precision: fp8
  framework: sglang-disagg
  router: { name: sglang-router, version: "0.3.2" }
  kv-p2p-transfer: mori
  multinode: true
  disagg: true
  srt-recipe-dir: qwen3.5/sglang/mi355x-fp8/8k1k
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # The srt-slurm recipe owns the complete c8-c128 sweep in one Slurm
      # allocation so model initialization is paid once instead of per point.
      # 1P+1D TP4P+TP8D/EP1 remains the current baseline: TP4 prefill saves
      # four GPUs without changing the TP8 decode service.
      # dp-attn intentionally false: with --enable-dp-attention +
      # --moe-a2a-backend mori, sglang auto-promotes moe_ep_size=tp_size,
      # but is_deepep_class_backend() excludes MoRI, so
      # num_shared_slots stays at the global value (1) and the
      # (num_experts - num_shared_slots) % moe_ep_size assertion in
      # fused_moe_triton/layer.py fires for Qwen3.5 (512 routed + 1 shared).
      - spec-decoding: "none"
        conc-list: [8, 16, 32, 64, 128]
        srt-recipe: disagg-1p1d-p-tp4-d-tp8.yaml
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=0"

