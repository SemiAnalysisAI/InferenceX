# DeepSeek-V4.1-Flash AgentX on MI300X (gfx942), a copy of the validated MI355X vLLM
# arm (run 34710937012) on the same ROCm nightly. gfx942 is not in the upstream
# hardware table (h100, h200, b200, gb200, gb300, mi350x); TP8 rather than TP4
# because a 192 GB card must hold its share of the 511 GB checkpoint, the
# GPU-resident Engram tables and a 1M-context KV pool. Native five-token DSpark,
# golden AL 3.51 for throughput, real block verification for evals, adaptive
# verification off on ROCm.
dsv41flash-fp4-mi300x-vllm-agentic-dspark:
  image: vllm/vllm-openai-rocm:nightly-rocm100-3df4ae153eb385e27b52f26c81f8edb9e20b9984
  model: deepseek-ai/DeepSeek-V4.1-Flash
  model-prefix: dsv41flash
  runner: cluster:mi300x-amd
  precision: fp4
  framework: vllm
  multinode: false
  srt-recipe-dir: dsv41flash/vllm/mi300x-fp4-mtp
  scenarios:
    agentic-coding:
    - dram-utilization: 0.60
      search-space:
      # The recipe sets engram cpu_offload per TP: off at TP8 so this curve stays
      # comparable with the validated concurrency 1-32 run, on below TP8 where
      # the tables would not fit beside the checkpoint share on a 192 GB card.
      # vllm-project/vllm#57491 widened the two is_cuda() gates to
      # is_cuda_alike(), so engram_config resolves on gfx942 in this image.
      - { tp: 8, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 2, 4, 8, 16, 32], srt-recipe: agentic.yaml }
      # TP4 halves the GPUs per server. With the Engram tables in pinned host
      # memory the resident weights are ~81 GiB per rank.
      - { tp: 4, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 2, 4, 8, 16, 32], srt-recipe: agentic.yaml }
      # No TP2 arm on this SKU. Measured in run 35671005506: at TP2 the resident
