# MI355X FP8 AgentX, TP4 only. The grid follows the TP4 band of the B200 FP8
# AgentX arm so the two SKUs are directly comparable point for point, with the
# HiCache band extended to concurrency 80 to reach into the throughput end that
# the host-DRAM tier makes available. TP2 is out of reach: the ~400 GB FP8
# checkpoint leaves too little KV headroom there for the 256k-capped AgentX
# corpus.
qwen3.5-fp8-mi355x-sglang-agentic-mtp:
  image: lmsysorg/sglang-rocm:v0.5.20-rocm720-mi35x-20260929
  model: Qwen/Qwen3.5-397B-A17B-FP8
  model-prefix: qwen3.5
  runner: cluster:mi355x-amds
  precision: fp8
  framework: sglang
  multinode: false
  srt-recipe-dir: qwen3.5/sglang/mi355x-fp8-mtp
  scenarios:
    agentic-coding:
    # CONC 64-80 HiCache pools take the 3 TB policy share per GPU.
    - dram-utilization: 1.0
      search-space:
      - { tp: 4, ep: 1, spec-decoding: mtp, kv-offloading: none, conc-list: [1, 4, 8, 12, 14], srt-recipe: agentic.yaml }
      - { tp: 4, ep: 1, spec-decoding: mtp, kv-offloading: dram, kv-offload-backend: { name: hicache }, conc-list: [16, 18, 20, 22, 24, 28, 32, 36, 40, 48, 56, 64, 72, 80], srt-recipe: agentic.yaml }

