# Native single-node benchmarks, and multi-node benchmarks on a cluster without a
# power-exporter-port, inherit the GPU exporter from the cluster record. The binder sets
# `required` from REQUIRE_POWER, and on a multi-node point from the row's `power` field.
telemetry:
  enabled: true
  storage_subdir: power
  # Cold AMD exporter image pulls can outlast srtctl's default readiness timeout.
  startup_timeout_seconds: 300
