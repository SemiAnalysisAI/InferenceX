# Merged under the fragment of every multi-node benchmark point on a cluster with a
# power-exporter-port. The launcher adds the port and stages the dcgm-exporter image; the binder
# sets `required` from the row's `power` field.
telemetry:
  enabled: true
  collect_interval_ms: 1000
  storage_subdir: power
  startup_timeout_seconds: 120
  request_timeout_seconds: 2
  dcgm_exporter:
    container_image: dcgm-exporter
    command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof.csv"
