      - spec-decoding: "mtp"
        conc-list: [658]
        # https://github.com/NVIDIA/srt-slurm/blob/sa-submission-q2-2026/recipes/trtllm/b200-fp4/8k1k/mtp/ctx5_gen2_dep8_batch32_eplb0_mtp3.yaml
        srt-recipe: disagg-variants.yaml:override_5p2d_dep8_b32_mtp3
        prefill:
          num-worker: 5
