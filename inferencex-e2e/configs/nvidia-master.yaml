# H200 AgentX arm for DeepSeek-V4.1-Flash. Upstream marks h200 verified and says
# the GB200 NVL4 TP4 layout becomes TP8 on 8-GPU nodes, so this is TP8.
# `precision: fp4` labels the checkpoint's MXFP4 routed experts, as on the
# Blackwell and MI355X arms; Hopper has no FP4 tensor cores, so the MXFP4
# experts run through the upconverting MoE path. The H100 arm is deferred: the
# sparse attention indexer allocates a [max-num-batched-tokens, max-model-len]
# buffer at startup, which is 16 GiB at 1M context and does not fit 80 GB
# alongside the weights. Tracked separately.
dsv41flash-fp4-h200-vllm-agentic-dspark:
  image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
  model: deepseek-ai/DeepSeek-V4.1-Flash
  model-prefix: dsv41flash
  runner: cluster:h200-dgxc
  precision: fp4
  framework: vllm
  multinode: false
  srt-recipe-dir: dsv41flash/vllm/h200-fp4-mtp
  scenarios:
    agentic-coding:
    - dram-utilization: 0.80
      search-space:
      # 8x141 GB holds the 511 GB checkpoint minus the UVA-offloaded Engram
      # tables, so the KV cache stays GPU-resident across the full range.
      - { tp: 8, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 2, 4, 8, 16, 32, 64, 128], srt-recipe: agentic.yaml }
      # TP4 doubles the per-GPU share to ~99 GiB of weights on each 141 GB H200
      # with the Engram tables offloaded, leaving ~15 GiB of KV per GPU (~17M
      # tokens across the four ranks, about 3x the pool that served c1-c128 on
      # B200 TP2). The script caps batched tokens and the scheduler batch on
      # this arm so the sparse-attention indexer buffer does not consume it.
      - { tp: 4, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 2, 4, 8, 16, 32, 64, 128], srt-recipe: agentic.yaml }

