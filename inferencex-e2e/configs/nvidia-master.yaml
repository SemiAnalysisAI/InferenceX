# GLM-5.2 B300 NVFP4 AgentX with EAGLE/MTP speculative decoding, following the
# AgentX speculative-decoding policy in docs/MODELS.md. SGLang EAGLE runs off
# GLM-5.2's built-in nextn head (eagle-topk 1): K=5 / 6 draft tokens at
# c1/c4/c8/c20, K=3 / 4 draft tokens elsewhere. The connector selects golden
# AL 3.61 or 2.99 respectively from infx/golden_al_distribution/glm-5.2-fp8__mtp__native__default-default.yaml
# for thinking_on; evals retain real verification. The pinned nightly includes FlashInfer
# 0.6.18's BF16 TRTLLM MoE allocation fix for small-batch Blackwell execution
# in GLM-5.2's unquantized EAGLE draft head.
#
# Higher concurrencies sample the throughput curve nearer 95 P90 tokens/s/user
# while preserving the cookbook low-latency arm (TP8, fp8 KV, cutedsl bf16 GEMM).
# HiCache host-DRAM offload is required because the working set outgrows HBM
