dsr1-fp4-b200-dynamo-trt:
  image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post1
  model: deepseek-r1-fp4
  model-prefix: dsr1
  runner: cluster:b200-nscale
  precision: fp4
  framework: dynamo-trt
  router: { name: dynamo-router, version: "0.8.1.post1" }
  kv-p2p-transfer: nixl
  multinode: true
  disagg: true
  srt-recipe-dir: dsr1/trtllm/b200-fp4/8k1k
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - spec-decoding: "mtp"
        conc-list: [90]
        # https://github.com/NVIDIA/srt-slurm/blob/sa-submission-q2-2026/recipes/trtllm/b200-fp4/8k1k/mtp/ctx1_gen1_dep8_batch8_eplb0_mtp3.yaml
        srt-recipe: disagg-variants.yaml:override_1p1d_dep8_b8_mtp3
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      - spec-decoding: "mtp"
        conc-list: [66]
        # https://github.com/NVIDIA/srt-slurm/blob/sa-submission-q2-2026/recipes/trtllm/b200-fp4/8k1k/mtp/ctx1_gen3_tep8_batch16_eplb0_mtp3.yaml
        srt-recipe: disagg-variants.yaml:override_1p3d_tep8_b16_mtp3
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
        decode:
          num-worker: 3
          tp: 8
          ep: 8
          dp-attn: false
      - spec-decoding: "mtp"
        conc-list: [6]
        # https://github.com/NVIDIA/srt-slurm/blob/sa-submission-q2-2026/recipes/trtllm/b200-fp4/8k1k/mtp/ctx1_gen5_tep8_batch1_eplb0_mtp3.yaml
        srt-recipe: disagg-variants.yaml:override_1p5d_tep8_b1_mtp3
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
        decode:
          num-worker: 5
          tp: 8
          ep: 8
          dp-attn: false
      - spec-decoding: "mtp"
        conc-list: [10, 15, 30, 60]
        # https://github.com/NVIDIA/srt-slurm/blob/sa-submission-q2-2026/recipes/trtllm/b200-fp4/8k1k/mtp/ctx1_gen5_tep8_batch8_eplb0_mtp3.yaml
        srt-recipe: disagg-variants.yaml:override_1p5d_tep8_b8_mtp3
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
        decode:
          num-worker: 5
          tp: 8
          ep: 8
          dp-attn: false
      - spec-decoding: "mtp"
        conc-list: [548]
        # https://github.com/NVIDIA/srt-slurm/blob/sa-submission-q2-2026/recipes/trtllm/b200-fp4/8k1k/mtp/ctx3_gen1_dep8_batch64_eplb0_mtp3.yaml
        srt-recipe: disagg-variants.yaml:override_3p1d_dep8_b64_mtp3
        prefill:
          num-worker: 3
          tp: 4
          ep: 4
          dp-attn: true
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      - spec-decoding: "mtp"
        conc-list: [1096, 1691]
        # https://github.com/NVIDIA/srt-slurm/blob/sa-submission-q2-2026/recipes/trtllm/b200-fp4/8k1k/mtp/ctx5_gen1_dep8_batch192_eplb0_mtp1.yaml
        srt-recipe: disagg-variants.yaml:override_5p1d_dep8_b192_mtp1
