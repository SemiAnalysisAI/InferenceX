version: 1

# Higher scores run first. Scores are uncapped and remain human-readable in
# `ci-job-<score>-<hash>` workflow labels; `ci-attempt-<run-attempt>` prevents
# stale runner labels from matching partial reruns.
base-score: 1.0

adjustments:
  # Preserve business priority as the primary key, then prefer smaller Slurm
  # allocations within an otherwise identical class.
  additional-node: -0.001
  event:
    push: 2.0
  multi-node: 0.25
  agentic: 0.1
  eval-only: 0.0
  checklist-complete: 0.25
  precision:
    fp4: 0.1
  spec-decoding:
    mtp: 0.1
    eagle: 0.1
    eagle3: 0.1
  framework-prefix:
    sglang: 1.5
    mori-sglang: 1.5
    vllm: 1.5
    dynamo-sglang: 1.5
    dynamo-vllm: 1.5
  model-prefix:
    dsv41flash: 0.5
    kimik3: 0.5
    glm5.2: 0.5
    dsv4: 0.25
    minimaxm3: 0.25
    qwen3.5: 0.1
    qwen3.8next: 0.05
    dsr1: 0.05

# Jobs from PRs classified as patching upstream engine/runtime source run last.
patchwork-score: 0.0
