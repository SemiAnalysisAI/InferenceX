# custom-agentic family: LiveKit Agents voice-agent traces of customer 111868 on Gemma-4-31B
# (Green-Lab/2026-10-16-111868-agentic-traces, synthetic text with logged lengths/cache/timing;
# vmonitor-gateway-datasets spec 0004). V1.1 = the V1 trace with dial warm-ups, restricted to the
# 671 rooms with >= 4 real requests (12,279 requests + 601 warm-ups): the 503 one-request rooms and the
# 43 rooms with 2-3 requests are dropped, so concurrency counts real calls as the customer does.
# Dial warm-up (trace.v1.1-append-ideal-warm.jsonl, rows copied from the V1 warm trace): before each room's
# first request, the same prompt minus its last 64 tokens with max_tokens 1, same session; the real first
# turn starts 3000 ms after the warm-up returns (70 rooms too short to warm). aiperf TTFT includes the warm-ups.
# No request cap: lanes recycle rooms (fresh cache-bust marker per play) for the whole duration.
schemaVersion: "2.0"
benchmark:
  scenario: inferencex-agentx-mvp
  unsafeOverride: true
  endpoint:
    type: chat
    path: /v1/chat/completions
    streaming: true
    useServerTokenCount: true
  datasets:
  - name: livekit-111868-v1.1-warm
    type: file
    format: mooncake_trace
    path: ${IX_CUSTOM_DATASET_FILE}
    entries: 671
    randomSeed: 42
    traceIdleGapCapSeconds: 300.0
    # mooncake_trace defaults to sequential: lanes would replay room-0001, -0002, ... in file
    # (chronological) order and a run covers only the first ~150 rooms. Shuffle = seeded random
    # permutation of all 671 rooms per pass.
    sampling: shuffle
  phases:
  - name: profiling
    kind: profiling
    type: concurrency
    duration: 1200.0
    gracePeriod: 30.0
    failedRequestThreshold: 0.1
    trajectoryStartMinRatio: 0.25
    trajectoryStartMaxRatio: 0.75
    warmupRequestsPerLane: 10
    agenticWarmupGracePeriod: 1800.0
  artifacts:
    sliceDuration: 1.0
  tokenizer:
    trustRemoteCode: true
  runtime:
    statsInterval: 30.0
randomSeed: 42
