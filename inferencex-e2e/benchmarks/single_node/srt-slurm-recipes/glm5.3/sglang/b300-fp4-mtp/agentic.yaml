# Throughput arm: MLA-family, so every TP rank holds complete per-token KV and
# the host pool is an absolute 300 GB/rank; the DSA indexer pool rides on top
# (about 69 GB/rank), about 2.95 TB per node in total.
override_c22:
  roles:
    agg:
      args:
        enable-hierarchical-cache: true
        hicache-size: 300
        hicache-write-policy: write_back
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
  benchmark:
    env:
      CONC: '22'
      KV_OFFLOADING: dram

