override_c22:
  roles:
    agg:
      args:
        enable-hierarchical-cache: true
        # GB per rank; each TP rank holds full MLA KV. The DSA indexer pool adds
        # about 69 GB/rank, about 2.95 TB of host DRAM per node in total.
        hicache-size: 300
        hicache-write-policy: write_back
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
  benchmark:
    env:
      CONC: '22'
      KV_OFFLOADING: dram

