# GLM-5.3 FP8 TP8 AgentX with resident MTP or native UMBP offloading.
base:
  schema: 2
  name: glm5.3-fp8-mi300x-sglang-agentic
  model:
    path: hf:zai-org/GLM-5.3
    container: lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261005@sha256:a4d60e7ef7645aefb1c52a77dcb32970440454bc359a1baff03711fcd0501613
    precision: fp8
  resources:
    gpu_type: mi300x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  health_check:
    interval_seconds: 5
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.3
        revision: aca966e4e02791568aa6a4ced368624b3d897f42
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        dsa-prefill-backend: tilelang
        dsa-decode-backend: tilelang
        dsa-topk-backend: sgl-kernel
        kv-cache-dtype: fp8_e4m3
        page-size: 64
        # AgentX synthetic replay carries no tool schema.
        reasoning-parser: glm45
        context-length: 1048576
        chunked-prefill-size: 32768
        mem-fraction-static: 0.85
        watchdog-timeout: 3600
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: "1"
        SGLANG_TIMEOUT_KEEP_ALIVE: "1800"
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: zai-org/GLM-5.3
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_BENCHMARK_GRACE_PERIOD: "1800"
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache

zip_override_tp8_mtp_concurrency:
  roles:
    agg:
      args:
        max-running-requests: [4, 4, 6, 8]
        cuda-graph-max-bs-decode: [4, 4, 8, 8]
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
  benchmark:
    env:
      CONC: ["1", "2", "3", "4"]
      KV_OFFLOADING: none

override_tp8_umbp_c8:
  services: &umbp_services
    - name: umbp
      type: generic
      placement:
        node: agg
      start: before_workers
      critical: true
      inherit_discovery_env: false
      command:
        - /sgl-workspace/mori/python/mori/umbp_standalone_server
        - unix:///logs/umbp.sock
      env:
        UMBP_DRAM_CAPACITY: "519000000000"
        UMBP_DRAM_USE_HUGEPAGES: "0"
        UMBP_SSD_ENABLED: "0"
        MORI_UMBP_LOG_LEVEL: info
      preamble: |
        export LD_LIBRARY_PATH="/sgl-workspace/mori/python/mori:${LD_LIBRARY_PATH}"
      readiness:
        log:
          pattern: host memory registered for GPU access
        timeout_seconds: 5400
        interval_seconds: 1
  roles: &umbp_roles
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mori
        hicache-storage-backend-extra-config: '{"standalone_startup_timeout_ms":120000}'
      env:
        UMBP_STANDALONE_ADDRESS: unix:///logs/umbp.sock
  benchmark:
    env:
      CONC: "8"
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: "519"

override_tp8_umbp_c16:
  services: *umbp_services
  roles: *umbp_roles
  benchmark:
    env:
      CONC: "16"
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: "519"
