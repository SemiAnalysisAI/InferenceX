base:
  schema: 2
  name: glm5.3-fp8-mi300x-sglang-agentic
  resources:
    gpu_type: mi300x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  # A node without the 704 GB snapshot downloads it first: 80 min at the 9 GB/min seen for concurrent pulls here, plus 10 min to load.
  health_check:
    interval_seconds: 10
    max_attempts: 900
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.3
        revision: aca966e4e02791568aa6a4ced368624b3d897f42
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        dsa-prefill-backend: tilelang
        dsa-decode-backend: tilelang
        dsa-topk-backend: torch
        kv-cache-dtype: fp8_e4m3
        # GLM-5.3 emits the GLM-4.7 tool-call format.
        tool-call-parser: glm47
        reasoning-parser: glm45
        context-length: 1048576
        # 32k chunks exhausted GPU memory in the indexer top-k on long contexts and stall decode for a whole chunk.
        chunked-prefill-size: 8192
        mem-fraction-static: 0.82
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        watchdog-timeout: 1800
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # gfx942 uses portable top-k instead of CUDA-header JIT kernels.
        SGLANG_DSA_FUSE_TOPK: 'false'
        SGLANG_OPT_USE_TOPK_V2: 'false'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      # Long responses admitted near the end of the window can take minutes to drain.
      AIPERF_BENCHMARK_GRACE_PERIOD: '1800'

# Sub-agent requests arrive in bursts: at CONC 1 a cap of 2 left requests queued while KV usage peaked at 31%, so admission is 4x CONC with a floor of 8.
override_tp8_c1:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp8_c2:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: none

override_tp8_c3:
  roles:
    agg:
      args:
        max-running-requests: 12
        cuda-graph-max-bs-decode: 12
  benchmark:
    env:
      CONC: '3'
      KV_OFFLOADING: none

# Six sessions overflow the 1.28M-token GPU pool (55-67% prefix hits, 85 min warmup), so CONC 4 and up use the host tier; admission is 2x CONC.
override_tp8_c4_hicache:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
        enable-hierarchical-cache: true
        hicache-host-memory-fraction: 0.60
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: dram

override_tp8_c5_hicache:
