base:
  schema: 2
  name: glm5.3-fp8-mi355x-sglang-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.3
        trust-remote-code: true
        kv-cache-dtype: fp8_e4m3
        tensor-parallel-size: 8
        expert-parallel-size: 1
        dcp-size: 1
        attention-backend: dsa
        dsa-prefill-backend: triton
        dsa-decode-backend: triton
        fp8-gemm-backend: auto
        context-length: 1048576
        cuda-graph-backend-prefill: breakable
        cuda-graph-backend-decode: full
        max-running-requests: 80
        cuda-graph-max-bs-decode: 80
        random-seed: 42
        tool-call-parser: glm47
        reasoning-parser: glm45
        # 32k chunks interleave decode between prefill chunks and keep per-chunk
        # activation headroom low enough for 0.85.
        chunked-prefill-size: 32768
        mem-fraction-static: 0.85
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        # The gfx950 monokernel serves verify steps of one or two running requests.
        enable-amd-monokernel: true
        watchdog-timeout: 1800
        enable-cache-report: true
        enable-metrics-for-all-schedulers: true
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # The DSA indexer uses the precompiled HIP Top-K op.
        SGLANG_OPT_USE_TOPK_V2: 'false'
        SGLANG_DSA_FUSE_TOPK: 'true'
        SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND: python
        SGLANG_USE_AITER: '1'
        HSA_ENABLE_SDMA: '0'
        SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D: '1'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_tp8_c1:
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp8_c2:
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: none

override_tp8_c4:
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none
