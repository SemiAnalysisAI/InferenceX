# GLM-5.3 FP8 on MI325X. Native EAGLE uses the committed K3 golden curve.
base:
  schema: 2
  name: glm5.3-fp8-mi325x-sglang-agentic-mtp-fp8kv
  model:
    path: hf:zai-org/GLM-5.3
    container: lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261005@sha256:a4d60e7ef7645aefb1c52a77dcb32970440454bc359a1baff03711fcd0501613
    precision: fp8
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  health_check:
    interval_seconds: 10
    max_attempts: 540
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.3
        revision: aca966e4e02791568aa6a4ced368624b3d897f42
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        dsa-prefill-backend: tilelang
        dsa-decode-backend: tilelang
        dsa-topk-backend: sgl-kernel
        kv-cache-dtype: fp8_e4m3
        # AgentX WEKA replays raw messages without structured tools; no tool parser.
        reasoning-parser: glm45
        context-length: 1048576
        max-total-tokens: 1048576
        chunked-prefill-size: 16384
        mem-fraction-static: 0.85
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        watchdog-timeout: 1800
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: zai-org/GLM-5.3
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_BENCHMARK_GRACE_PERIOD: '1800'

override_tp8_c2:
  roles:
    agg:
      args: &natural_kv_args
        # Let the native allocator use the remaining HBM within the 0.85 budget.
        max-total-tokens: null
        max-running-requests: 4
        cuda-graph-max-bs-decode: 4
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: none

override_tp8_c3:
  roles:
    agg:
      args: *natural_kv_args
  benchmark:
    env:
      CONC: '3'
      KV_OFFLOADING: none

override_tp8_c4:
  roles:
    agg:
      args: *natural_kv_args
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none

# Same engine geometry as the qualified October 1 TP4 C3 control, new stock image.
override_tp4_c3:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-total-tokens: null
        chunked-prefill-size: 8192
        mem-fraction-static: 0.92
        max-running-requests: 6
        cuda-graph-max-bs-decode: 6
  benchmark:
    env:
      CONC: '3'
      KV_OFFLOADING: none
