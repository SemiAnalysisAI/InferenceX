# Matched STP reference and native UMBP offload comparison on MI325X.
base:
  schema: 2
  name: glm5.3-fp8-mi325x-sglang-agentic-stp
  model:
    path: hf:zai-org/GLM-5.3
    container: lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261001@sha256:8190c29f67bdb65f41e0254efc72e60daa5117b7212e86a46aad5bf4b145f1b4
    precision: fp8
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  health_check:
    interval_seconds: 10
    max_attempts: 540
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.3
        revision: aca966e4e02791568aa6a4ced368624b3d897f42
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        dsa-prefill-backend: tilelang
        dsa-decode-backend: tilelang
        dsa-topk-backend: torch
        kv-cache-dtype: bfloat16
        page-size: 64
        tool-call-parser: glm47
        reasoning-parser: glm45
        context-length: 1048576
        max-total-tokens: 1048576
        chunked-prefill-size: 16384
        mem-fraction-static: 0.85
        watchdog-timeout: 1800
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        SGLANG_DSA_FUSE_TOPK: 'false'
        SGLANG_OPT_USE_TOPK_V2: 'false'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: zai-org/GLM-5.3
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_BENCHMARK_GRACE_PERIOD: '1800'

override_tp8_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp8_umbp_c1:
  services:
    - name: umbp
      type: generic
      placement:
        node: agg
      start: before_workers
      critical: true
      inherit_discovery_env: false
      command:
        - /sgl-workspace/mori/python/mori/umbp_standalone_server
        - unix:///logs/umbp.sock
      env:
        UMBP_DRAM_CAPACITY: '513000000000'
        UMBP_DRAM_USE_HUGEPAGES: '0'
        UMBP_SSD_ENABLED: '0'
        MORI_UMBP_LOG_LEVEL: info
      preamble: |
        export LD_LIBRARY_PATH="/sgl-workspace/mori/python/mori:${LD_LIBRARY_PATH}"
      readiness:
        log:
          pattern: host memory registered for GPU access
        timeout_seconds: 5400
        interval_seconds: 1
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mori
        hicache-storage-backend-extra-config: '{"standalone_startup_timeout_ms":120000}'
      env:
        UMBP_STANDALONE_ADDRESS: unix:///logs/umbp.sock
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '513'
