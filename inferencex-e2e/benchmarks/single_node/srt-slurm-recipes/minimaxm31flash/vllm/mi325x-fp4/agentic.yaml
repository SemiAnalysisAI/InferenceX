base:
  schema: 2
  name: minimaxm31flash-fp4-mi325x-vllm-agentic
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Cold loads of the 240 GB checkpoint can take the full
  # VLLM_ENGINE_READY_TIMEOUT_S.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      args:
        served-model-name: amd/MiniMax-M3.1-Flash-Quark-MXFP4
        tensor-parallel-size: 4
        # Reserve headroom for allocations after memory profiling.
        gpu-memory-utilization: 0.85
        language-model-only: true
        trust-remote-code: true
        reasoning-parser: minimax_m3
        tool-call-parser: minimax_m3
        enable-auto-tool-choice: true
        # MSA sparse/index cache needs 128-token blocks.
        block-size: 128
        # The NVFP4 KV cache and NVFP4 index cache need gfx950; on gfx942 the
        # Triton sparse attention and indexer serve an FP8 cache.
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        # The AITER MXFP4 kernels that run on gfx942 do not take the export's
        # uninterleaved SwiGLU expert layout; the unfused Triton kernel does,
        # with the MXFP4 expert weights as stored and BF16 activations.
        moe-backend: triton_unfused
        disable-hybrid-kv-cache-manager: true
        enable-prefix-caching: true
        max-model-len: 1048576
        max-num-batched-tokens: 32768
        # With VLLM_USE_BREAKABLE_CUDAGRAPH, graphs cover decode, prefill and
        # mixed steps up to 2048 tokens.
        compilation-config: '{"max_cudagraph_capture_size":2048}'
        # One renderer thread queues short AgentX turns behind long prompt
        # renders; eight render them in parallel.
        renderer-num-workers: 8
        enable-prompt-tokens-details: true
        disable-uvicorn-access-log: true
      env:
        # The export's recommended MoE setup: AITER MoE, and the MXFP8 shared
        # expert stays a separate MLP (no shared-expert fusion).
        VLLM_ROCM_USE_AITER: '1'
        VLLM_ROCM_USE_AITER_MOE: '1'
        VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: '0'
        VLLM_USE_BREAKABLE_CUDAGRAPH: '1'
        DEBUG_HIP_DYNAMIC_QUEUES: '0'
        DEBUG_HIP_IGNORE_STREAM_PRIORITY: '0'
        PYTHONHASHSEED: '0'
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# Admission is 2x CONC. Batch-sharded sampling splits the sampler across the
# TP ranks; vLLM refuses it when max-num-seqs is below the TP size, so c1 runs
# without it. Throughput runs replace block rejection with the golden
# acceptance length.
zip_override_tp4_dspark7:
  roles:
    agg:
      args:
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"TRITON_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        max-num-seqs: [2, 4, 8, 16, 32]
        enable-batch-sharded-sampling: [null, true, true, true, true]
  benchmark:
    env:
      CONC: ['1', '2', '4', '8', '16']

# The c32 working set outgrows the 6.2M-token FP8 GPU KV cache, so
# SimpleCPUOffloadConnector (eager) keeps about 8.2M tokens in 800 GB of host
# memory (dram-utilization 0.662 of the TP4 lane). An eager tier copies every
# block the GPU computes, so one no larger than the GPU cache never holds a
# block the GPU has evicted.
zip_override_tp4_offload:
  roles:
    agg:
      args:
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"TRITON_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        max-num-seqs: 64
        enable-batch-sharded-sampling: true
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":800000000000,"lazy_offload":false,"cpu_lru_eviction":true}}'
  benchmark:
    env:
      CONC: ['32']
      KV_OFFLOADING: 'dram'
