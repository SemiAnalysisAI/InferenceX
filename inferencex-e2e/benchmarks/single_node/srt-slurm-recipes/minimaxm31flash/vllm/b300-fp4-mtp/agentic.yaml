base:
  schema: 2
  name: minimaxm31flash-fp4-b300-vllm-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Cold loads of the 250 GB checkpoint from the hub cache run past half an hour.
  health_check:
    interval_seconds: 5
    max_attempts: 1440
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        language-model-only: true
        trust-remote-code: true
        reasoning-parser: minimax_m3
        tool-call-parser: minimax_m3
        enable-auto-tool-choice: true
        # MSA sparse/index cache needs 128-token blocks.
        block-size: 128
        # The checkpoint is QAT-trained for an NVFP4 KV cache.
        kv-cache-dtype: nvfp4
        attention-config: '{"indexer_kv_dtype":"nvfp4","use_prefill_query_quantization":true}'
        disable-hybrid-kv-cache-manager: true
        enable-prefix-caching: true
        gpu-memory-utilization: 0.92
        max-model-len: 1048576
        max-num-batched-tokens: 16384
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        disable-uvicorn-access-log: true
        stream-interval: 20
      env:
        VLLM_FLOAT32_MATMUL_PRECISION: high
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
        VLLM_CHAT_TEMPLATE_RENDER_TIMEOUT: '600'
        VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

zip_override_tp4:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-num-seqs: [2, 8, 16, 32]
        max-num-batched-tokens: 32768
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256,320,384,448,512,576,640,704,768,832,896,960,1024,1536,2048,3072,4096,6144,8192]}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASH_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      env:
        VLLM_USE_SIMPLE_KV_OFFLOAD: '0'
  benchmark:
    env:
      CONC: ['1', '4', '8', '16']

