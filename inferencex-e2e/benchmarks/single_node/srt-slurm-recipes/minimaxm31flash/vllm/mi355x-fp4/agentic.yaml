base:
  schema: 2
  name: minimaxm31flash-fp4-mi355x-vllm-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Cold loads of the 240 GB checkpoint can take the full
  # VLLM_ENGINE_READY_TIMEOUT_S.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: amd/MiniMax-M3.1-Flash-Quark-MXFP4
        tensor-parallel-size: 4
        # Reserve headroom for allocations after memory profiling.
        gpu-memory-utilization: 0.85
        language-model-only: true
        trust-remote-code: true
        reasoning-parser: minimax_m3
        tool-call-parser: minimax_m3
        enable-auto-tool-choice: true
        # MSA sparse/index cache needs 128-token blocks.
        block-size: 128
        # The checkpoint is QAT-trained for an NVFP4 KV cache; decode indexer
        # scoring splits across TP ranks by context.
        kv-cache-dtype: nvfp4
        attention-config: '{"indexer_kv_dtype":"nvfp4","indexer_decode_cp":true}'
        # The export's MXFP4 experts load as stored (W4A4).
        moe-backend: aiter
        disable-hybrid-kv-cache-manager: true
        enable-prefix-caching: true
        max-model-len: 1048576
        max-num-batched-tokens: 32768
        # Two microbatches overlap each one's TP all-reduces with the other's
        # compute on prefill steps from 16384 tokens and decode steps from 32768.
        enable-dbo: true
        dbo-prefill-token-threshold: 16384
        dbo-decode-token-threshold: 32768
        # With VLLM_USE_BREAKABLE_CUDAGRAPH, graphs cover decode, prefill and
        # mixed steps up to 2048 tokens.
        compilation-config: '{"max_cudagraph_capture_size":2048}'
        # One renderer thread queues short AgentX turns behind long prompt
        # renders; eight render them in parallel.
        renderer-num-workers: 8
        enable-prompt-tokens-details: true
        disable-uvicorn-access-log: true
      env:
        # The export's recommended MoE setup: AITER MoE, and the MXFP8 shared
        # expert stays a separate MLP (no shared-expert fusion).
        VLLM_ROCM_USE_AITER: '1'
        VLLM_ROCM_USE_AITER_MOE: '1'
        VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: '0'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_BREAKABLE_CUDAGRAPH: '1'
        # ROCm 10 HIP otherwise can put the DBO communication stream on the
        # same hardware queue as compute, which serializes their kernels.
        DEBUG_HIP_DYNAMIC_QUEUES: '0'
        DEBUG_HIP_IGNORE_STREAM_PRIORITY: '0'
        PYTHONHASHSEED: '0'
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# Native zip expansion creates one variant per concurrency. TP4 is the
# upstream MI355X layout; admission is 2x CONC. Throughput runs replace block
# rejection with the golden acceptance length.

# c1-c16: DSpark 7 with the KV cache on the GPUs. Batch-sharded sampling
# splits the sampler across the TP ranks; vLLM refuses it when max-num-seqs is
# below the TP size, so c1 runs without it.
zip_override_tp4_dspark7:
  roles:
    agg:
      args:
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"TRITON_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        max-num-seqs: [2, 4, 8, 16, 32]
        enable-batch-sharded-sampling: [null, true, true, true, true]
  benchmark:
    env:
      CONC: ['1', '2', '4', '8', '16']

# c32-c64: the working set outgrows the GPU KV cache, so
# SimpleCPUOffloadConnector (eager) keeps about 24M tokens in 1349 GB of host
# memory (dram-utilization 0.9 of the TP4 lane). LRU eviction drops the least
# recently used prefixes from their tail, so a hot session's chain stays
# whole. c64 runs DSpark 3 at 0.90 memory utilization.
zip_override_tp4_offload:
  roles:
    agg:
      args:
        gpu-memory-utilization: [0.85, 0.9]
        speculative-config:
          - '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"TRITON_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","num_speculative_tokens":3,"attention_backend":"TRITON_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        max-num-seqs: [64, 128]
        enable-batch-sharded-sampling: true
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":1349000000000,"lazy_offload":false,"cpu_lru_eviction":true}}'
  benchmark:
    env:
      CONC: ['32', '64']
      KV_OFFLOADING: 'dram'
      TOTAL_CPU_DRAM_GB: '1349'
