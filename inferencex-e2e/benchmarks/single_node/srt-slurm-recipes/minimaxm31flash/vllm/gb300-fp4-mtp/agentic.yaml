zip_override_dep4:
  frontend:
    type: vllm-router
    args:
      policy: consistent_hash
      prometheus-host: 127.0.0.1
      prometheus-port: 18000
      request-timeout-secs: 14400
      disable-retries: true
  setup_script: vllm-router.sh
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 1
        data-parallel-size: 4
        enable-expert-parallel: true
        max-num-seqs: [32, 48, 64]
        # Golden AL 2.88. FlashInfer PrimiTS drafter, per the vLLM blog's GB300 runs.
        speculative-config: '{"method":"dspark","num_speculative_tokens":3,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: ['64', '96', '128']
