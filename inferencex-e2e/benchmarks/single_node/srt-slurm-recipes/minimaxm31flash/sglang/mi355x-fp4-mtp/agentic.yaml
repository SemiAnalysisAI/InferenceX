# The cookbook's High-Throughput cell (HiCache) crashes on MI355X with this image: the
# first prefill's HiCache write backup hits a HIP illegal memory access with either a
# fixed hicache-size or hicache-ratio 1.5. Concurrency 48 and 64 run the Low-Latency
# cell GPU-resident instead, like the vLLM MI355X recipe's TP4 c64.

override_tp4_c48:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        chunked-prefill-size: 32768
        max-running-requests: 96
        cuda-graph-max-bs-decode: 96
        mem-fraction-static: 0.8
  benchmark:
    env:
      CONC: '48'
      KV_OFFLOADING: none

