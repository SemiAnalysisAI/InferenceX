base:
  schema: 2
  name: minimaxm31flash-fp4-mi355x-sglang-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  # Cold loads of the 250 GB checkpoint plus graph capture outlast the default.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      # Serve flags follow the cookbook's MI355X cells at
      # https://docs.sglang.io/cookbook/autoregressive/MiniMax/MiniMax-M3.1.
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        trust-remote-code: true
        reasoning-parser: minimax-m3
        tool-call-parser: minimax-m3
        # Seven-token DSpark, the bundled draft's dspark_block_size. Throughput runs
        # switch to synthetic acceptance at the golden acceptance length.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 7
        speculative-use-block-verification: true
        cuda-graph-backend-prefill: breakable
        tokenizer-worker-num: 8
        watchdog-timeout: 3600
        enable-metrics: true
        fp8-gemm-backend: aiter
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        SGLANG_USE_AITER: '1'
        # Recompute the sparse index top-k in every layer (SGLang's ROCm default 2 shares
        # one selection across each pair of sparse layers).
        SGLANG_MINIMAX_M3_INDEX_TOPK_FREQ: '1'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# TP4 Low-Latency cell. The scheduler batch is 2x CONC (AgentX subagent fan-out),
# capped at the cookbook's 128; the decode graph batch matches it.

override_tp4_c1:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        chunked-prefill-size: 32768
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
        mem-fraction-static: 0.8
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

