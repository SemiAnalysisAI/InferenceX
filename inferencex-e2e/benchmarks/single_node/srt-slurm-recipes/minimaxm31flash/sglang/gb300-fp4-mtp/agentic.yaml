base:
  schema: 2
  name: minimaxm31flash-fp4-gb300-sglang-agentic
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  # Cold loads of the 250 GB checkpoint plus JIT MSA kernel builds and graph capture outlast the default.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      # Serve flags follow the cookbook's GB300 cells at
      # https://docs.sglang.io/cookbook/autoregressive/MiniMax/MiniMax-M3.1.
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        trust-remote-code: true
        reasoning-parser: minimax-m3
        tool-call-parser: minimax-m3
        # Seven-token DSpark, the bundled draft's dspark_block_size. Throughput runs
        # switch to synthetic acceptance at the golden acceptance length.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 7
        speculative-use-block-verification: true
        cuda-graph-backend-prefill: breakable
        tokenizer-worker-num: 8
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        FMHA_SM100_ALLOW_JIT: '1'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# TP4 Balanced cell (TRT-LLM routed MoE). The scheduler batch is 2x CONC (AgentX
# subagent fan-out), capped at the cookbook's 128; the decode graph batch matches it.

zip_override_tp4:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        moe-runner-backend: flashinfer_trtllm_routed
        chunked-prefill-size: 32768
        max-running-requests: [2, 8, 16, 32, 64]
        cuda-graph-max-bs-decode: [2, 8, 16, 32, 64]
        mem-fraction-static: 0.8
  benchmark:
    env:
      CONC: ['1', '4', '8', '16', '32']
      KV_OFFLOADING: none

# TP4 at conc 64 with L2 HiCache: the Balanced layout at the cookbook's 128 scheduler and
# decode graph batch, spilling KV to host DRAM at 180 GB per rank.

override_tp4_hicache_c64:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        moe-runner-backend: flashinfer_trtllm_routed
        chunked-prefill-size: 32768
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        mem-fraction-static: 0.8
        enable-hierarchical-cache: true
        hicache-size: 180
        hicache-write-policy: write_back
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: dram

# High-Throughput cell: TP4 with EP4 (MegaMoE). The scheduler batch and decode graph
# batch are the cookbook's 128. Above conc 32 L2 HiCache spills KV to host DRAM; the
# per-rank pool keeps all four ranks inside the node's 920,000 MiB step memory cap.

override_tp4_ep4_c32:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 4
        chunked-prefill-size: 32768
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        mem-fraction-static: 0.8
      env:
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '32768'
  benchmark:
    env:
      CONC: '32'
      KV_OFFLOADING: none

override_tp4_ep4_hicache_c64:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 4
        chunked-prefill-size: 32768
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        mem-fraction-static: 0.8
        enable-hierarchical-cache: true
        hicache-size: 175
        hicache-write-policy: write_back
      env:
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '32768'
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: dram

override_tp4_ep4_hicache_c128:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 4
        chunked-prefill-size: 32768
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        mem-fraction-static: 0.8
        enable-hierarchical-cache: true
        hicache-size: 175
        hicache-write-policy: write_back
      env:
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '32768'
  benchmark:
    env:
      CONC: '128'
      KV_OFFLOADING: dram
