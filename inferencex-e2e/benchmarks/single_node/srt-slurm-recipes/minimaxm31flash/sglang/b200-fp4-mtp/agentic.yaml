# TP2 with L2 HiCache: two-GPU engines with 210 GB per rank, inside their share of
# the node's offload DRAM, and the same 16384 prefill chunk as TP4. The scheduler batch is 2x CONC and the decode graph batch matches it.

zip_override_tp2_hicache:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        moe-runner-backend: flashinfer_trtllm_routed
        chunked-prefill-size: 16384
        max-running-requests: [32, 48, 64]
        cuda-graph-max-bs-decode: [32, 48, 64]
        mem-fraction-static: 0.85
        enable-hierarchical-cache: true
        hicache-size: 210
        hicache-write-policy: write_back
  benchmark:
    env:
      CONC: ['16', '24', '32']
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '536'
