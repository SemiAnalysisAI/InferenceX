# TP4 with L2 HiCache. The 16384 prefill chunk halves the prefill graph and activation
# footprint, which leaves room for the 0.85 static pool. The scheduler batch is 1.5x CONC
# and the decode graph batch matches it; each rank's 260 GB host pool fits the 1073 GB share.

override_tp4_dram_c24:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        moe-runner-backend: flashinfer_trtllm_routed
        chunked-prefill-size: 16384
        max-running-requests: 36
        cuda-graph-max-bs-decode: 36
        mem-fraction-static: 0.85
        enable-hierarchical-cache: true
        hicache-size: 260
        hicache-write-policy: write_back
  benchmark:
    env:
      CONC: '24'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1073'

