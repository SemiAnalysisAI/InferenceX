# High-Throughput cell: TP8 with attention DP2 and EP8 (MegaMoE). The scheduler
# batch is 2x CONC up to the cookbook's 256, and each of the two attention-DP
# ranks captures decode graphs for half of it.

override_tp8_ep8_c64:
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 8
        attn-dp-size: 2
        enable-dp-lm-head: true
        expert-parallel-size: 8
        chunked-prefill-size: 65536
        max-running-requests: 128
        cuda-graph-max-bs-decode: 64
        cuda-graph-max-bs-prefill: 16384
        mem-fraction-static: 0.75
      env:
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '32768'
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: none

