base:
  schema: 2
  name: minimaxm31flash-fp4-b300-sglang-agentic-tp2-spf-interval
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  # Cold loads of the 250 GB checkpoint plus JIT MSA kernel builds and graph capture outlast the default.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 2
      # Serve flags follow the cookbook's B300 cells at
      # https://docs.sglang.io/cookbook/autoregressive/MiniMax/MiniMax-M3.1.
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        trust-remote-code: true
        reasoning-parser: minimax-m3
        tool-call-parser: minimax-m3
        # Seven-token DSpark, the bundled draft's dspark_block_size. Throughput runs
        # switch to synthetic acceptance at the golden acceptance length.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 7
        speculative-use-block-verification: true
        # FP8 draft KV, as vLLM's DSpark drafter uses; bf16 costs ~10 GB of HBM per rank.
        speculative-draft-kv-cache-dtype: fp8_e4m3
        cuda-graph-backend-prefill: breakable
        tokenizer-worker-num: 8
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        FMHA_SM100_ALLOW_JIT: '1'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# Below conc 48 a decode interval of 32 keeps throughput while lifting interactivity.
# 2x CONC (AgentX subagent fan-out); the decode graph batch matches it.
zip_override_tp2_spf_interval32:
  roles:
    agg:
      args:
        tensor-parallel-size: 2
        moe-runner-backend: flashinfer_trtllm_routed
        chunked-prefill-size: 8192
        max-running-requests: [40, 48, 56, 64, 72, 80]
        cuda-graph-max-bs-decode: [40, 48, 56, 64, 72, 80]
        mem-fraction-static: 0.92
        enable-hierarchical-cache: true
        hicache-size: 370
        hicache-write-policy: write_back
        schedule-policy: shortest-prefill-first
        prefill-decode-interval: 32
        stream-interval: 20
  benchmark:
    env:
      CONC: ['20', '24', '28', '32', '36', '40']
      KV_OFFLOADING: dram

# Around conc 48-52 a shorter interval keeps the queue from building.
override_tp2_c48_spf_interval24:
  roles:
    agg:
      args:
        tensor-parallel-size: 2
        moe-runner-backend: flashinfer_trtllm_routed
        chunked-prefill-size: 8192
