name: dsv4-fp4-b200-vllm-agentic_tp2dp4_c64
schema: 2
resources:
  gpu_type: b200
  gpus_per_node: 8
frontend:
  type: vllm-router
  enable_multiple_frontends: false
  args:
    disable-retries: true
    policy: consistent_hash
    prometheus-host: 127.0.0.1
    prometheus-port: 18000
    request-timeout-secs: 14400
observability:
  enabled: false
  tachometer:
    enabled: false
engine:
  type: vllm
  connector: null
health_check:
  interval_seconds: 10
  max_attempts: 720
roles:
  agg:
    nodes: 1
    workers: 1
    args:
      attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
      block-size: 256
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[7,14,21,28,35,42,49,56,63,70,77,84,91,98,105,112,119,126,133,140,147,154,161,168,175,182,189,196,203,210,217,224],"mode":0}'
      data-parallel-size: 4
      disable-uvicorn-access-log: true
      enable-auto-tool-choice: true
      enable-cumem-allocator: true
      enable-ep-weight-filter: true
      enable-expert-parallel: true
      gpu-memory-utilization: 0.9
      kv-cache-dtype: fp8
      kv-cache-memory-bytes: 37580963840
      kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":241500000000,"enable_cross_layers_blocks":"true","lazy_offload":false}}'
      long-prefill-token-threshold: 512
      max-model-len: 1048576
      max-num-batched-tokens: 8416
      max-num-seqs: 32
      moe-backend: deep_gemm_mega_moe
      no-disable-hybrid-kv-cache-manager: true
      no-enable-flashinfer-autotune: true
      numa-bind: true
      prefill-schedule-interval: 16
      reasoning-parser: deepseek_v4
      served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
      speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.77}'
      tensor-parallel-size: 2
      tokenizer-mode: deepseek_v4
      tool-call-parser: deepseek_v4
      trust-remote-code: true
    env:
      PYTHONHASHSEED: '42'
      PYTHONNOUSERSITE: '1'
      PYTORCH_ALLOC_CONF: expandable_segments:True
      TORCH_CUDA_ARCH_LIST: '10.0'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
      VLLM_FLOAT32_MATMUL_PRECISION: high
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
      VLLM_RPC_TIMEOUT: '600000'
      VLLM_USE_RUST_FRONTEND: '1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
    gpus: 8
benchmark:
  env:
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
    AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: '1'
setup_script: vllm-router.sh
