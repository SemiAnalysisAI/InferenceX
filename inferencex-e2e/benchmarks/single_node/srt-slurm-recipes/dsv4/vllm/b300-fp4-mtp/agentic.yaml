override_dep8_c64:
  frontend:
    type: vllm-router
    args:
      policy: consistent_hash
      prometheus-host: 127.0.0.1
      prometheus-port: 18000
      request-timeout-secs: 14400
      disable-retries: true
  setup_script: vllm-router-0.1.14.sh
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 1
        data-parallel-size: 8
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        moe-backend: deep_gemm_amxf4_mega_moe
        prefill-schedule-interval: 16
        long-prefill-token-threshold: 512
        kv-cache-memory-bytes: 107000000000
        max-num-batched-tokens: 8304
        gpu-memory-utilization: 0.92
        max-num-seqs: 16
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,7,12,14,18,21,24,28,30,35,36,42,48,49,54,56,60,63,66,70,72,77,78,84,90,91,96,98,105,112]}'
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":356125000000,"enable_cross_layers_blocks":"true","lazy_offload":false}}'
      env:
        PYTORCH_ALLOC_CONF: 'expandable_segments:True'
        PYTHONHASHSEED: '42'
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2849'
      AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: '1'

