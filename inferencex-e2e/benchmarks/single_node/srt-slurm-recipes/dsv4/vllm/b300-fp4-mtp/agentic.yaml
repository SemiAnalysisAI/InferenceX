# DeepSeek-V4-Pro-0813 AgentX on B300 with vLLM DSpark (six draft tokens).
# TP points are GPU-resident; DEP8 offloads KV to host DRAM through
# SimpleCPUOffloadConnector.
base:
  schema: 2
  name: dsv4-fp4-b300-vllm-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4-Pro-0813
    container: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-20ebb28
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  # --numa-bind pins each rank to its GPU's socket, which needs every host CPU.
  sbatch_directives:
    cpus-per-task: "192"
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        numa-bind: true
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        no-disable-hybrid-kv-cache-manager: true
        kv-cache-dtype: fp8
        block-size: 256
        max-model-len: 1048576
        attention-config: '{"indexer_kv_dtype":"mxfp4","backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true}'
        # Throughput runs switch to synthetic rejection at the golden acceptance length.
        speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}'
        disable-uvicorn-access-log: true
        tokenizer-mode: deepseek_v4
        tool-call-parser: deepseek_v4
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v4
      env:
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
        VLLM_DSV4_MEGA_FP8_COMBINE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        PYTHONNOUSERSITE: '1'
        VLLM_FLOAT32_MATMUL_PRECISION: high
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Pro-0813
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. Target verification uses 7 tokens per sequence and
# DSpark drafting 6, so decode graphs capture both shapes up to max-num-seqs.
# TP points admit CONC sequences with the FlashInfer all-reduce and add
# piecewise shapes for mixed prefill/decode batches. DEP8 runs one
# data-parallel rank per GPU behind a consistent-hash vLLM Router (turns of one
# conversation share a rank), admits 2x CONC across the ranks with MegaMoE
# experts, keeps eager offload so block hashes agree across ranks, pins KV
# cache bytes per concurrency tier, and sizes its token budget to the 8192-token
# prefill budget plus one verification step per sequence, rounded up to a
# multiple of eight. DRAM points split TOTAL_CPU_DRAM_GB GB across the ranks.

override_tp8_c1:
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 8
        data-parallel-size: 1
        disable-custom-all-reduce: true
        gpu-memory-utilization: 0.95
        max-num-seqs: 1
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,7,100,200,300,400,500]}'
      env:
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: 'auto'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

