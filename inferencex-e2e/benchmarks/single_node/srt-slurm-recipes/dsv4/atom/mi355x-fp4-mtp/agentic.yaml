        MORI_SHMEM_HEAP_SIZE: 16G
        ATOM_MEGA_MASK_PAD_ROWS: '1'
        ATOM_MEGA_DECODE_MTPR: '512'
        AITER_MEGA_FIXED_SLOT_MAX_MTPR: '1023'
        ATOM_EPLB_MAX_REBALANCES: '2'
  benchmark:
    env:
