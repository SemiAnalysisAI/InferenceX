override_dep8_c32:
  frontend: &dep8_frontend
    type: sglang-router
    args:
      policy: consistent_hashing
      request-id-headers: x-correlation-id
      dp-aware: true
      connect-timeout-secs: 900
      request-timeout-secs: 14400
      disable-health-check: true
      disable-circuit-breaker: true
      # A transient router-to-engine send failure would otherwise abort the run.
      retry-max-retries: 8
      retry-initial-backoff-ms: 500
      retry-max-backoff-ms: 10000
      retry-backoff-multiplier: 2
  roles:
    agg:
      args:
        <<: &dep8_args
          moe-runner-backend: null
          data-parallel-size: 8
          tokenizer-worker-num: 8
          enable-prefill-delayer: true
          prefill-decode-interval: 32
          enable-mixed-chunk: true
          schedule-policy: shortest-prefill-first
          enable-dp-attention: true
          enable-dp-lm-head: true
          enable-dp-attention-local-control-broadcast: true
          incremental-streaming-output: true
          stream-interval: 20
          expert-parallel-size: 8
          moe-a2a-backend: megamoe
          enable-w4a4-mxfp4-megamoe: true
          enable-deepseek-v4-fp4-indexer: true
          chunked-prefill-size: 65536
          cuda-graph-max-bs-decode: 544
          swa-full-tokens-ratio: 0.075
          enable-hierarchical-cache: true
          hicache-ratio: 2
          hicache-write-policy: write_back
          hicache-io-backend: direct
          hicache-mem-layout: page_first_direct
          skip-server-warmup: true
        max-running-requests: 64
        mem-fraction-static: 0.84
      env: &dep8_env
        SGLANG_ENABLE_DP_SPEC_PREFILL_COORDINATION: '1'
        SGLANG_RAGGED_VERIFY_MODE: static
        # Covers the 8192-token per-rank prefill budget.
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '8320'
  benchmark:
    env:
      <<: &dep8_client
        AIPERF_HTTP_X_SMG_ROUTING_KEY_FROM_CORRELATION_ID: 'true'
        KV_OFFLOADING: dram
        TOTAL_CPU_DRAM_GB: '2849'
      CONC: '32'
override_dep8_c64:
  frontend: *dep8_frontend
  roles:
    agg:
      args:
        <<: *dep8_args
        max-running-requests: 128
        mem-fraction-static: 0.84
      env: *dep8_env
  benchmark:
