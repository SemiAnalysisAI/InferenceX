# Update B300 DSV4 performance with DSpark.
base:
  schema: 2
  name: dsv4-fp4-b300-sglang-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4-Pro-0813
    container: lmsysorg/sglang:dev-cu13-nightly-0929@sha256:497d6ce4887830aad5382242b79c5cfc15faefa0bbb970b4580041d8b131775b
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        tensor-parallel-size: 8
        moe-runner-backend: flashinfer_mxfp4
        disable-flashinfer-autotune: true
        mem-fraction-static: 0.88
        swa-full-tokens-ratio: 0.1
        allow-auto-truncate: true
        chunked-prefill-size: 8192
        tool-call-parser: deepseekv4
        reasoning-parser: deepseek-v4
        chat-template: /infmax-workspace/benchmarks/single_node/chat_templates/deepseek_v4_thinking.jinja
        watchdog-timeout: 1800
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 6
        speculative-num-steps: 1
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
        attention-backend: dsv4
        page-size: 256
        disable-shared-experts-fusion: true
        enable-metrics: true
        enable-cache-report: true
      env:
        SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: '1'
        PYTHONNOUSERSITE: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
        SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
        SGLANG_OPT_USE_JIT_NORM: '1'
        SGLANG_OPT_USE_JIT_INDEXER_METADATA: '1'
        SGLANG_OPT_USE_TOPK_V2: '1'
        SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: '1'
        # Triton compiles with the image's CUDA ptxas.
        TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Pro-0813
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-running-requests: 2
        cuda-graph-max-bs-decode: 4
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

