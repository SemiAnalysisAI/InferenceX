base:
  schema: 2
  name: dsr1-fp8-h200-trt-8k1k
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: trtllm_serve
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: trtllm
    served_model_name: deepseek-ai/DeepSeek-R1-0528
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        cuda_graph_config:
          enable_padding: true
          max_batch_size: 128
        print_iter_log: true
        kv_cache_config:
          dtype: fp8
          free_gpu_memory_fraction: 0.75
          enable_block_reuse: false
        stream_interval: 10
        moe_config:
          backend: CUTLASS
        trust_remote_code: true
        backend: pytorch
        max_seq_len: 9472
        max_num_tokens: 8320
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        pipeline_parallel_size: 1
        enable_iter_perf_stats: false
        return_perf_metrics: false
      env:
        PYTHONNOUSERSITE: '1'
zip_override_tp8_ep8:
  roles:
    agg:
      args:
        enable_attention_dp: false
  benchmark:
    env:
      CONC: ['4', '8', '16', '32']
zip_override_tp8_ep8_dpa:
  roles:
    agg:
      args:
        enable_attention_dp: true
        attention_dp_config:
          batching_wait_iters: 0
          enable_balance: true
          timeout_iters: 60
  benchmark:
    env:
      CONC: ['64']
