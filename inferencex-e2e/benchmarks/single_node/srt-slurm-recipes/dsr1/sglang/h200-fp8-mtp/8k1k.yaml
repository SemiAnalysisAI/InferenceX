base:
  schema: 2
  name: dsr1-fp8-h200-sglang-mtp-8k1k
  model:
    path: hf:deepseek-ai/DeepSeek-R1-0528
    container: lmsysorg/sglang:v0.5.19-cu130
    precision: fp8
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        trust-remote-code: true
        tensor-parallel-size: 8
        data-parallel-size: 1
        expert-parallel-size: 1
        disable-radix-cache: true
        max-running-requests: 256
        cuda-graph-max-bs: 256
        chunked-prefill-size: 32768
        max-prefill-tokens: 32768
        mem-fraction-static: 0.82
        attention-backend: flashinfer
        stream-interval: 10
        decode-log-interval: 1
        speculative-algorithm: EAGLE
        speculative-num-steps: 2
        speculative-num-draft-tokens: 3
        speculative-eagle-topk: 1
        served-model-name: deepseek-ai/DeepSeek-R1-0528
        enable-metrics: false
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
        TORCH_CUDA_ARCH_LIST: '9.0'
        PYTHONNOUSERSITE: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: deepseek-ai/DeepSeek-R1-0528
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'true'
zip_override_concurrency:
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64']
