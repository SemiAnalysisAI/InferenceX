base:
  schema: 2
  name: dsr1-fp8-mi355x-sglang-8k1k
  model:
    path: hf:deepseek-ai/DeepSeek-R1-0528
    container: lmsysorg/sglang:v0.5.21-rocm720-mi35x@sha256:eccce4c0c3a359c9501096699a37c5483d6fc3a5f0cfd4a2ff06164bde05a745
    precision: fp8
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        attention-backend: aiter
        tensor-parallel-size: 4
        trust-remote-code: true
        chunked-prefill-size: 196608
        mem-fraction-static: 0.8
        disable-radix-cache: true
        num-continuous-decode-steps: 8
        max-prefill-tokens: 196608
        kv-cache-dtype: fp8_e4m3
        cuda-graph-max-bs-decode: 32
        data-parallel-size: 1
        expert-parallel-size: 1
        served-model-name: deepseek-ai/DeepSeek-R1-0528
        enable-metrics: false
      env:
        SGLANG_USE_AITER: '1'
        RCCL_MSCCL_ENABLE: '0'
        ROCM_QUICK_REDUCE_QUANTIZATION: INT4
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: deepseek-ai/DeepSeek-R1-0528
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'false'
zip_override_tp4_ep1:
  roles:
    agg:
      args:
        # On ROCm 7.2, SGLang routes the TP4 gate_up_proj (N=9216, K=7168) to AITER's
        # bpreshuffle CK-tile GEMM, which rejects tensors of 2^31 bytes or more; cap the
        # prefill batch so its bf16 output stays below that limit.
        chunked-prefill-size: 98304
        max-prefill-tokens: 98304
        cuda-graph-max-bs-decode: [32, 64]
  benchmark:
    env:
      CONC: ['32', '64']
zip_override_tp8_ep1:
  roles:
    agg:
      gpus: 8
      args:
        cuda-graph-max-bs-decode: [4, 8, 16, 32, 64]
        tensor-parallel-size: 8
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64']
