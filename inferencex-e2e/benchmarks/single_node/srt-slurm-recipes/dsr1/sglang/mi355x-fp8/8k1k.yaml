base:
  schema: 2
  name: dsr1-fp8-mi355x-sglang-8k1k
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        attention-backend: aiter
        tensor-parallel-size: 4
        trust-remote-code: true
        chunked-prefill-size: 196608
        mem-fraction-static: 0.8
        disable-radix-cache: true
        num-continuous-decode-steps: 8
        max-prefill-tokens: 196608
        kv-cache-dtype: fp8_e4m3
        cuda-graph-max-bs-decode: 32
        data-parallel-size: 1
        expert-parallel-size: 1
        served-model-name: deepseek-ai/DeepSeek-R1-0528
        enable-metrics: false
      env:
        SGLANG_USE_AITER: '1'
        RCCL_MSCCL_ENABLE: '0'
        ROCM_QUICK_REDUCE_QUANTIZATION: INT4
zip_override_tp4_ep1:
  roles:
    agg:
      args:
        cuda-graph-max-bs-decode: [32, 64]
        # AITER CK bpreshuffle rejects the TP4 dense gate_up GEMM (N=9216, K=7168) at 8k prefill.
        fp8-gemm-backend: triton
  benchmark:
    env:
      CONC: ['32', '64']
zip_override_tp8_ep1:
  roles:
    agg:
      gpus: 8
      args:
        cuda-graph-max-bs-decode: [4, 8, 16, 32, 64]
        tensor-parallel-size: 8
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64']
