base:
  schema: 2
  name: dsr1-fp8-mi355x-sglang-mtp-8k1k
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        attention-backend: aiter
        tensor-parallel-size: 8
        expert-parallel-size: 1
        trust-remote-code: true
        chunked-prefill-size: 196608
        mem-fraction-static: 0.8
        disable-radix-cache: true
        num-continuous-decode-steps: 8
        max-prefill-tokens: 196608
        kv-cache-dtype: fp8_e4m3
        cuda-graph-max-bs: 4
        max-running-requests: 4
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        data-parallel-size: 1
        enable-metrics: false
      env:
        SGLANG_USE_AITER: '1'
        SGLANG_AITER_MLA_PERSIST: '1'
        SGLANG_ENABLE_SPEC_V2: '1'
        RCCL_MSCCL_ENABLE: '0'
        ROCM_QUICK_REDUCE_QUANTIZATION: INT4
zip_override_concurrency:
  roles:
    agg:
      args:
        cuda-graph-max-bs: [4, 8, 16, 32, 64]
        max-running-requests: [4, 8, 16, 32, 64]
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64']
