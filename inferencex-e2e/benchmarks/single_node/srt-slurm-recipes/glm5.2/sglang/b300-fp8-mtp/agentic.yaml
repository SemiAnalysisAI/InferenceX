# GLM-5.2 FP8 AgentX on B300 with SGLang EAGLE off the checkpoint's nextn
# head: the low-latency TP8 arm (fp8 KV, cutedsl bf16 GEMM). HiCache spills
# evicted prefixes to host DRAM; without it the working set outgrows HBM past
# c8 and the radix hit rate collapses.
base:
  schema: 2
  name: glm5.2-fp8-b300-sglang-agentic
  model:
    path: hf:zai-org/GLM-5.2-FP8
    container: lmsysorg/sglang:nightly-dev-cu13-20260908-20ca564b
    precision: fp8
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.2-FP8
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        kv-cache-dtype: fp8_e4m3
        bf16-gemm-backend: cutedsl
        max-prefill-tokens: 8192
        quantization: fp8
        # GLM-5.2 emits the GLM-4.7 tool-call format.
        tool-call-parser: glm47
        reasoning-parser: glm45
        chunked-prefill-size: 8192
        mem-fraction-static: 0.85
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        # MLA-family: every TP rank holds complete per-token KV, so the host
        # pool is an absolute 270 GB/rank; the DSA indexer pool rides on top.
        enable-hierarchical-cache: true
        hicache-size: 270
        hicache-write-policy: write_back
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        watchdog-timeout: 1800
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # Keep FlashInfer, Triton and JIT caches allocation-local.
        SGLANG_CACHE_DIR: /tmp/sglang-cache
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: zai-org/GLM-5.2-FP8
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2399'

# One variant per point: admission is 2x CONC and the graph batch matches it,
# capped at 64.
override_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs: 2
  benchmark:
    env:
      CONC: '1'

override_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs: 8
  benchmark:
    env:
      CONC: '4'

override_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs: 16
  benchmark:
    env:
      CONC: '8'

override_c12:
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs: 24
  benchmark:
    env:
      CONC: '12'

override_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs: 32
  benchmark:
    env:
      CONC: '16'
