# GLM-5.2 NVFP4 on H200, 8k1k, SGLang. Shape follows the cookbook's H200
# "balanced" cell without MTP (TP8 with 8-way DP attention, mem-fraction 0.85,
# chunked prefill 32768, 256 running requests) on the ~433 GB NVFP4 checkpoint.
# Hopper has no FP4 tensor cores, so NVFP4 experts run on Marlin (BF16
# activations), TP-sharded without DeepEP. The checkpoint leaves attention in
# BF16, and DP attention replicates it (~29 GB/GPU) beside ~50 GB of experts:
# that is what OOMed 80 GB H100s in create_weights; 141 GB H200 holds it.
base:
  schema: 2
  name: glm5.2-fp4-h200-sglang-8k1k
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: nvidia/GLM-5.2-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 8
        # Cookbook --attn-dp-size 8; spelled the pre-#41818 way so the
        # matrix's DP_ATTENTION check reads it.
        data-parallel-size: 8
        enable-dp-attention: true
        expert-parallel-size: 1
        quantization: modelopt_fp4
        moe-runner-backend: marlin
        kv-cache-dtype: fp8_e4m3
        # Hopper DSA decode backend used by the GLM-5.2 H200 AgentX recipes.
        dsa-decode-backend: flashmla_kv
        # Breakable prefill CUDA graphs replay flashmla_kv with a mismatched
        # split count on mixed-length eval prompts ("num_splits must have shape
        # (b+1)"); as in glm5.3flash-fp8-h200, only decode graphs stay enabled.
        cuda-graph-backend-prefill: disabled
        chunked-prefill-size: 32768
        mem-fraction-static: 0.85
        max-running-requests: 256
        watchdog-timeout: 1800
        enable-metrics: false
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_RADIX_FORCE_MISS: '1'
        # Keep FlashInfer/Triton/JIT caches off the shared home.
        SGLANG_CACHE_DIR: /tmp/sglang-cache

# Decode graphs sized to the request concurrency (no larger than the 256 cap).
zip_override_dep8:
  roles:
    agg:
      args:
        cuda-graph-max-bs-decode: [8, 16, 32, 64, 128, 256]
  benchmark:
    env:
      CONC: ['8', '16', '32', '64', '128', '256']
