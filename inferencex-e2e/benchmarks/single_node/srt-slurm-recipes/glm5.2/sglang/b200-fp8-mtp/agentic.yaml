base:
  schema: 2
  name: glm5.2-fp8-b200-sglang-agentic
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.2-FP8
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        kv-cache-dtype: fp8_e4m3
        bf16-gemm-backend: cutedsl
        quantization: fp8
        # GLM-5.2 emits the GLM-4.7 tool-call format; glm45 leaves calls as raw text.
        tool-call-parser: glm47
        reasoning-parser: glm45
        speculative-algorithm: EAGLE
        speculative-num-steps: 5
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 6
        watchdog-timeout: 1800
        enable-metrics: true
        weight-loader-prefetch-checkpoints: true
        weight-loader-drop-cache-after-load: false
        model-loader-extra-config: '{"enable_multithread_load":true}'
      env:
        PYTHONNOUSERSITE: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        # Keep FlashInfer/Triton/Inductor/JIT caches off the shared home.
        SGLANG_CACHE_DIR: /tmp/sglang-cache
        # Outlast AIPerf's pooled keep-alive connections.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_EXTRA_INPUTS: '{"chat_template_kwargs":{"enable_thinking":true}}'

override_c1:
  roles:
    agg:
      args:
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        mem-fraction-static: 0.83
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
        speculative-num-steps: 6
        speculative-num-draft-tokens: 7
        enable-hierarchical-cache: true
        hicache-ratio: 0.75
        hicache-write-policy: write_back
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1717'

override_c4:
  roles:
    agg:
      args:
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        mem-fraction-static: 0.88
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
        enable-hierarchical-cache: true
        # MLA ranks hold full per-token KV: 169 GB x 8 plus the DSA indexer pool
        # (~1,662 GB) fits the 1,717 GB budget.
        hicache-size: 169
        hicache-write-policy: write_through
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1717'

