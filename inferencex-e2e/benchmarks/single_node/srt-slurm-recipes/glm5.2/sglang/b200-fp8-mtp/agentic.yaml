override_c16:
  roles:
    agg:
      args:
        # MLA KV is replicated per TP rank; DCP8 shards it so the working set
        # stays in HBM without host offload.
        dcp-size: 8
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        mem-fraction-static: 0.88
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        # Hold prefills until min(0.5 x running, prefill-max-requests) are queued,
        # at most max-delay-ms, so they interrupt decode together.
        enable-prefill-delayer: true
        prefill-max-requests: 2
        prefill-delayer-max-delay-ms: 800
        prefill-delayer-max-delay-passes: 32
        prefill-delayer-queue-min-ratio: 0.5
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: none

