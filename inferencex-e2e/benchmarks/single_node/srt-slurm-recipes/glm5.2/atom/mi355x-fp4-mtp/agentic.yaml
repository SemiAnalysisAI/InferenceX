base:
  schema: 2
  name: glm5.2-fp4-mi355x-atom-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: atomesh
    container_image: rocm/atom-dev@sha256:1bb1909ada9e3d178e315a3f89d041c05c7e90e7cc32de8d507ff5ab4cd4702c
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: atom
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: amd/GLM-5.2-MXFP4
        gpu-memory-utilization: 0.95
        enable_prefix_caching: true
        # model.layers.78 is the MTP head, shipped in BF16; excluding it keeps
        # online ptpc_fp8 quantization off the draft while experts stay MXFP4.
        online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","model.layers.[0-9].mlp.*expert*","model.layers.[1-6][0-9].mlp.*expert*","model.layers.7[0-7].mlp.*expert*","model.layers.78.*"]}'
        max-num-batched-tokens: 16384
        kv_cache_dtype: fp8
        index_cache_dtype: fp4
        block-size: 64
        method: mtp
      env:
        PYTHONNOUSERSITE: '1'
        AITER_QUICK_REDUCE_QUANTIZATION: INT4
        AITER_USE_FLYDSL_MOE_SORTING: '1'
        # GLM-5.2 mono decode is on by default in ATOM; only TP4 C1/C2 run it.
        ATOM_MONO_ENABLE: '0'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'atom:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# One variant per point. Admission is 2x CONC, except TP4 C1/C2, which admit
# exactly CONC with graphs captured up to it. TP4 C1/C2 run mono decode at
# three draft tokens; C4/C8 draft five and C10 four on the production path. The
# DCP4 arm shards the decode KV, adds the LMCache DRAM tier at 256 GiB per rank
# (1024 GiB, 1099.5 GB per server, within the 1109 GB TP4 share at
# dram-utilization 0.74) and drafts four tokens, three at C48.
override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        max-num-seqs: 1
        cudagraph-capture-sizes: '[1]'
        num-speculative-tokens: 3
      env:
        ATOM_MONO_ENABLE: '1'
  benchmark:
    env:
      CONC: '1'

override_tp4_c2:
  roles:
    agg:
      gpus: 4
      args:
        max-num-seqs: 2
        cudagraph-capture-sizes: '[1,2]'
        num-speculative-tokens: 3
      env:
        ATOM_MONO_ENABLE: '1'
  benchmark:
    env:
      CONC: '2'

