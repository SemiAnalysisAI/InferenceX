override_tp4_dcp4_c16_lmcache:
  roles:
    agg:
      gpus: 4
      args:
        decode-context-parallel-size: 4
        max-num-seqs: 32
        cudagraph-capture-sizes: '[1,2,4,8,12,16,20,24,28,32]'
        num-speculative-tokens: 4
        extra-kv-connectors: &lmcache_offload
          - kv_connector: lmcache_offload
            kv_role: offload
      env: &dcp_lmcache_env
        # DCP sparse prefill builds the group's query heads locally.
        ATOM_DCP_PREFILL_QREP: '1'
        PYTHONHASHSEED: '0'
        LMCACHE_LOCAL_CPU: 'True'
        LMCACHE_NUMA_MODE: auto
        LMCACHE_MAX_LOCAL_CPU_SIZE: '256'
        LMCACHE_CHUNK_SIZE: '256'
        OFFLOAD_MIN_LOAD_TOKENS: '8192'
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1109'

override_tp4_dcp4_c24_lmcache:
