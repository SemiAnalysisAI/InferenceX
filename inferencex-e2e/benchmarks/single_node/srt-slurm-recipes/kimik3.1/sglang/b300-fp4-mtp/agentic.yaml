base:
  schema: 2
  name: kimik3.1-fp4-b300-sglang-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        weight-loader-prefetch-checkpoints: true
        model-loader-extra-config: '{"enable_multithread_load": true}'
        kv-cache-dtype: fp8_e4m3
        page-size: 64
        # Week-1 AgentX precision rules require FP32 KDA recurrent state.
        mamba-ssm-dtype: float32
        mamba-radix-cache-strategy: extra_buffer
        mamba-track-interval: 256
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        mem-fraction-static: 0.85
        reasoning-parser: kimi_k3
        tool-call-parser: kimi_k3
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Kimi-K3.1-Dflash2-Preview
        speculative-draft-attention-backend: cutedsl_mla
        speculative-draft-kv-cache-dtype: fp8_e4m3
        speculative-use-block-verification: true
        # Without ReplaySSM DFLASH keeps one KDA state per draft token and the KV pool collapses.
        enable-linear-replayssm-spec: true
        # 8 x 230 GB leaves room for the DSA indexer and KDA host pools beside hicache-size
        # inside the 2249 GB TOTAL_CPU_DRAM_GB budget.
        enable-hierarchical-cache: true
        hicache-size: 230
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        mamba-max-states-per-path: 1
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  # ~1.56 TB of MXFP4 shards plus graph capture can outlast the default.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2249'

# One variant per point; admission is 2x CONC. DFLASH's speculative-num-draft-tokens is the
# verification width, the drafts plus one: 7 drafts through c8, 6 at c16, then 5 and 4 as the
# verify rows grow with the batch. The connector selects each variant's golden AL.
override_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
        speculative-num-draft-tokens: 8
  benchmark:
    env:
      CONC: '1'

override_c2:
  roles:
    agg:
      args:
        max-running-requests: 4
        cuda-graph-max-bs-decode: 4
        speculative-num-draft-tokens: 8
  benchmark:
    env:
      CONC: '2'

override_c4:
