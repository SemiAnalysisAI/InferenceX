override_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        speculative-num-draft-tokens: 7
  benchmark:
    env:
      CONC: '16'

# DCP8 shards the TP-replicated MLA KV across the eight ranks; EP2 speeds up the decode
# down-projection (the cookbook's B300 High-Concurrency cell).
override_dcp8_c24:
  roles:
    agg:
      args:
        expert-parallel-size: 2
        dcp-size: 8
        dcp-comm-backend: fi_a2a
        max-running-requests: 48
        cuda-graph-max-bs-decode: 48
        speculative-num-draft-tokens: 6
      env:
        SGLANG_DCP_PUSH_COMBINE_MAX_ROWS: '1536'
        SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB: '32768'
  benchmark:
    env:
      CONC: '24'

