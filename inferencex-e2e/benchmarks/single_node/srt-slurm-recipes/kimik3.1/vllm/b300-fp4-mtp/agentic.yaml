base:
  schema: 2
  name: kimik3.1-fp4-b300-vllm-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # ~1.56 TB of MXFP4 shards may take the full VLLM_ENGINE_READY_TIMEOUT_S.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        tensor-parallel-size: 8
        # Shards the MLA latent and indexer-key caches across the TP group: ~7x the KV tokens of plain TP8.
        decode-context-parallel-size: 8
        trust-remote-code: true
        language-model-only: true
        load-format: fastsafetensors
        enable-auto-tool-choice: true
        tool-call-parser: kimi_k3
        reasoning-parser: kimi_k3
        kv-cache-dtype: fp8
        # The K3.1 week-1 precision policy requires an FP32 KDA recurrent state.
        mamba-ssm-cache-dtype: float32
        enable-prefix-caching: true
        max-num-batched-tokens: 16384
        gpu-memory-utilization: 0.9
        stream-interval: 10
        disable-uvicorn-access-log: true
        # TOTAL_CPU_DRAM_GB split across the 8 TP ranks.
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":281125000000,"lazy_offload":false}}'
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        PYTHONUNBUFFERED: '1'
        # Identical prefixes must hash to identical block keys run-to-run.
        PYTHONHASHSEED: '42'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2249'

# Admission is 2x CONC. The decode graphs cover max-num-seqs x (1 + draft tokens);
# throughput runs replace block rejection with the golden acceptance length.
zip_override_dspark5:
  roles:
    agg:
      args:
        max-num-seqs: [2, 4, 8, 16]
        max-cudagraph-capture-size: [12, 24, 48, 96]
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: ['1', '2', '4', '8']

zip_override_dspark4:
  roles:
    agg:
      args:
        max-num-seqs: [32, 48]
        max-cudagraph-capture-size: [160, 240]
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: ['16', '24']

zip_override_dspark3:
  roles:
    agg:
      args:
        max-num-seqs: [64, 80, 96]
        max-cudagraph-capture-size: [256, 320, 384]
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: ['32', '40', '48']

zip_override_dspark2:
  roles:
    agg:
      args:
        max-num-seqs: [112, 140]
        max-cudagraph-capture-size: [336, 420]
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":2,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: ['56', '70']
