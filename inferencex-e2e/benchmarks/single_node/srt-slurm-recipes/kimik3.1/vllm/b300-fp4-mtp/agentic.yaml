base:
  schema: 2
  name: kimik3.1-fp4-b300-vllm-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Loading ~1.56 TB of MXFP4 shards plus the latency_specialized decode JIT can take
  # most of VLLM_ENGINE_READY_TIMEOUT_S.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        tensor-parallel-size: 8
        # Shards the MLA latent and indexer-key caches across the TP group: ~7x the KV tokens of plain TP8.
        decode-context-parallel-size: 8
        dcp-comm-backend: a2a
        cp-kv-cache-interleave-size: 1
        trust-remote-code: true
        language-model-only: true
        load-format: fastsafetensors
        enable-auto-tool-choice: true
        tool-call-parser: kimi_k3
        reasoning-parser: kimi_k3
        kv-cache-dtype: fp8
        # The DSpark draft layers run TOKENSPEED_MLA (speculative-config); min_split_kv bounds its split-KV workspace.
        attention-config: '{"indexer_kv_dtype":"mxfp4","tokenspeed_mla_min_split_kv":32}'
        # The K3.1 week-1 precision policy requires an FP32 KDA recurrent state.
        mamba-ssm-cache-dtype: float32
        # KDA verify replays the accepted prefix instead of keeping one state per draft token.
        use-replayssm: true
        no-enable-flashinfer-autotune: true
        enable-prefix-caching: true
        max-num-batched-tokens: 16384
        gpu-memory-utilization: 0.9
        stream-interval: 10
        disable-uvicorn-access-log: true
        # TOTAL_CPU_DRAM_GB split across the 8 TP ranks.
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":281125000000,"lazy_offload":false}}'
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        PYTHONUNBUFFERED: '1'
        # Identical prefixes must hash to identical block keys run-to-run.
        PYTHONHASHSEED: '42'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
        # The specialized decode runs on the V2 model runner.
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_DIRECT_DCP_A2A: '1'
        VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
        VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: '0'
        VLLM_USE_NCCL_SYMM_MEM: '0'
        VLLM_ENABLE_GEMM_RS: '0'
        TOKENSPEED_MLA_FP16_PARTIALS: '0'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2249'

# Admission is 2x CONC up to c8, then near the decode graphs. The fused Kimi-K3 decode
# (decode_backend latency_specialized) captures steps of up to 64 rows on B300: its wider-step
# MoE launches 152 CTAs that must all be co-resident, more than a B300 holds. A step above the
# captured sizes runs eager at about 10x the graphed step time, so admission stays near the 64-row cap.
# FULL_DECODE_ONLY graphs; throughput runs replace block rejection with the golden acceptance length.

override_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[5,10]}'
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","revision":"6a2ef20a05efe88aabbf9ecaa12d020c3b0edf94","attention_backend":"TOKENSPEED_MLA","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: '1'

override_c4:
  roles:
    agg:
      args:
        max-num-seqs: 8
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[5,10,15,20,25,30,35,40]}'
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","revision":"6a2ef20a05efe88aabbf9ecaa12d020c3b0edf94","attention_backend":"TOKENSPEED_MLA","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: '4'

override_c8:
  roles:
    agg:
      args:
        max-num-seqs: 16
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[5,10,15,20,25,30,35,40,45,50,55,60]}'
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","revision":"6a2ef20a05efe88aabbf9ecaa12d020c3b0edf94","attention_backend":"TOKENSPEED_MLA","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: '8'

override_c16:
  roles:
    agg:
      args:
        max-num-seqs: 20
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64]}'
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","revision":"6a2ef20a05efe88aabbf9ecaa12d020c3b0edf94","attention_backend":"TOKENSPEED_MLA","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: '16'
