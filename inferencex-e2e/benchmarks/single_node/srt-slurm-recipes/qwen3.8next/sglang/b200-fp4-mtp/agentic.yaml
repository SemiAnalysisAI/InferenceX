base:
  schema: 2
  name: qwen3.8next-fp4-b200-sglang-agentic
  resources:
    gpu_type: b200
    gpus_per_node: 8
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 1
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        NO_COLOR: '1'
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        # Explicitly disable the prohibited draft precision conversion path.
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
      args:
        served-model-name: RadixArk/Qwen3.8-Flash-Next-NVFP4
        trust-remote-code: true
        quantization: modelopt_fp4
        context-length: 262144
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        attention-backend: trtllm_mha
        linear-attn-prefill-backend: flashinfer
        linear-attn-decode-backend: flashinfer
        linear-attn-verify-backend: triton
        # SM100+ flashinfer linear-attn decode requires a bf16 SSM state.
        mamba-ssm-dtype: bfloat16
        # 180 GB HBM: keeps ~27 GiB outside the static pool for 16k-token prefill and decode graphs.
        mem-fraction-static: 0.85
        max-running-requests: 64
        page-size: 64
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        moe-runner-backend: flashinfer_trtllm
        moe-a2a-backend: none
        disable-shared-experts-fusion: true
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        speculative-moe-runner-backend: flashinfer_trtllm
        enable-linear-replayssm-spec: true
        cuda-graph-backend-prefill: disabled
        cuda-graph-backend-decode: full
        cuda-graph-max-bs-decode: 64
        kv-cache-dtype: bfloat16
        speculative-draft-kv-cache-dtype: bfloat16
        ple-offload-embedding: true
        ple-offload-backend: pinned
        enable-metrics: true
        enable-cache-report: true
        reasoning-parser: auto
        scheduler-recv-interval: 1
        decode-log-interval: 10
        stream-interval: 20
        watchdog-timeout: 1800
        random-seed: 35
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_c1:
  roles:
    agg:
      args:
        # Without 3 and 5-7, those batches replay the padded batch-4 and batch-8 graphs.
        cuda-graph-bs-decode: [1, 2, 3, 4, 5, 6, 7, 8, 16, 24, 32, 40, 48, 56, 64]
        # One tokenizer worker stalls in-flight outputs while it tokenizes a 100k-token prompt.
        tokenizer-worker-num: 6
        # A third fan-out subagent queues instead of decoding at batch 3 beside two.
        max-running-requests: 2
  benchmark:
    env:
      CONC: '1'
      # Native single-node binding verifies these against the generated point.
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'

override_c2:
  roles:
    agg:
      args:
        cuda-graph-bs-decode: [1, 2, 3, 4, 5, 6, 7, 8, 16, 24, 32, 40, 48, 56, 64]
        tokenizer-worker-num: 6
        # Fan-out subagents queue instead of widening the decode batch past 2.
        max-running-requests: 2
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'

override_c4:
  roles:
    agg:
      args:
        cuda-graph-bs-decode: [1, 2, 3, 4, 5, 6, 7, 8, 16, 24, 32, 40, 48, 56, 64]
        tokenizer-worker-num: 6
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'

override_c8:
  roles:
    agg:
      args:
        cuda-graph-bs-decode: [1, 2, 3, 4, 5, 6, 7, 8, 16, 24, 32, 40, 48, 56, 64]
        tokenizer-worker-num: 6
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'

override_c16:
  roles:
    agg:
      args: &hicache_args
        mamba-radix-cache-strategy: extra_buffer_lazy
        mamba-track-interval: 256
        # extra_buffer_lazy reserves 4 slots (56 MiB each) per request; 320 clears the 64 cap.
        max-mamba-cache-size: 320
        cuda-graph-bs-decode: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64]
        enable-hierarchical-cache: true
        # One combined target/draft KV + Mamba host pool, 1 GB under TOTAL_CPU_DRAM_GB.
        hicache-size: 213
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
        tokenizer-worker-num: 1
  benchmark:
    env:
      CONC: '16'
      TOTAL_CPU_DRAM_GB: '214'
      KV_OFFLOADING: dram

override_c24:
  roles:
    agg:
      args: *hicache_args
  benchmark:
    env:
      CONC: '24'
      TOTAL_CPU_DRAM_GB: '214'
      KV_OFFLOADING: dram

override_c32:
  roles:
    agg:
      args: *hicache_args
  benchmark:
    env:
      CONC: '32'
      TOTAL_CPU_DRAM_GB: '214'
      KV_OFFLOADING: dram
