base:
  schema: 2
  name: qwen3.8next-fp4-b200-sglang-agentic
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 1
      args:
        served-model-name: RadixArk/Qwen3.8-Flash-Next-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        # Quantization is read from the checkpoint.
        linear-attn-prefill-backend: flashinfer
        linear-attn-decode-backend: flashinfer
        # Flashinfer linear-attn decode on SM100+ requires a bfloat16 state.
        mamba-ssm-dtype: bfloat16
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        reasoning-parser: auto
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        enable-metrics: true
        enable-cache-report: true
      env:
        TORCH_CUDA_ARCH_LIST: '10.0'
        PYTHONNOUSERSITE: '1'
        NCCL_NVLS_ENABLE: '1'
        SGL_ENABLE_JIT_DEEPGEMM: 'false'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. NEXTN resets an unset admission cap to 48, so it is
# explicit at every point.
override_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 32
        mem-fraction-static: 0.8
  benchmark:
    env:
      CONC: '8'

override_tp2_c8:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
        mem-fraction-static: 0.8
  benchmark:
    env:
      CONC: '8'

override_dram_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        cuda-graph-backend-prefill: disabled
        mem-fraction-static: 0.85
        kv-cache-dtype: fp8_e4m3
        mamba-radix-cache-strategy: extra_buffer_lazy
        max-mamba-cache-size: 320
        speculative-num-steps: 2
        speculative-num-draft-tokens: 3
        enable-hierarchical-cache: true
        hicache-size: 200
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '214'

override_dram_c24:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        cuda-graph-backend-prefill: disabled
        mem-fraction-static: 0.85
        kv-cache-dtype: fp8_e4m3
        mamba-radix-cache-strategy: extra_buffer_lazy
        max-mamba-cache-size: 320
        speculative-num-steps: 2
        speculative-num-draft-tokens: 3
        prefill-decode-interval: 16
        enable-hierarchical-cache: true
        hicache-size: 200
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
  benchmark:
    env:
      CONC: '24'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '214'

override_dram_c32:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        cuda-graph-backend-prefill: disabled
        mem-fraction-static: 0.85
        kv-cache-dtype: fp8_e4m3
        mamba-radix-cache-strategy: extra_buffer_lazy
        max-mamba-cache-size: 320
        enable-hierarchical-cache: true
        hicache-size: 200
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
  benchmark:
    env:
      CONC: '32'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '214'
