base:
  schema: 2
  name: qwen3.8next-fp8-mi300x-sglang-agentic
  resources:
    gpu_type: mi300x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: Qwen/Qwen3.8-Flash-Next-FP8
        revision: bcd9f01ddc9cff2316eb84281bebcd5b058bddce
        trust-remote-code: true
        data-parallel-size: 1
        attention-backend: aiter
        kv-cache-dtype: auto
        chunked-prefill-size: 16384
        watchdog-timeout: 1200
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        scheduler-recv-interval: 10
        stream-interval: 50
        tokenizer-worker-num: 6
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        # The released AITER has no paged QSA API on gfx942, so the FP8 MoE runs on the Triton runner.
        SGLANG_USE_AITER: '0'
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  benchmark:
    env:
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# Admission and the decode graph batch are 2x CONC. With EAGLE, SGLang reserves 15% of the
# static budget for the draft model, so TP2 needs 0.95 to fit weights, hybrid state and KV.
override_tp2_ep2_c1:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        mem-fraction-static: 0.95
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp2_ep2_c2:
  roles:
