base:
  schema: 2
  name: qwen3.8next-fp8-h200-sglang-agentic
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      args:
        served-model-name: Qwen/Qwen3.8-Flash-Next-FP8
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 4
        data-parallel-size: 1
        mem-fraction-static: 0.85
        chunked-prefill-size: 8192
        linear-attn-prefill-backend: flashinfer
        linear-attn-decode-backend: flashinfer
        mamba-ssm-dtype: float32
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        reasoning-parser: auto
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'

override_tp2_c1:
  roles:
    agg:
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2  # decode graphs cover the full admission, so no decode step runs eager
  benchmark:
    env:
      CONC: '1'

override_tp2_c8:
  roles:
    agg:
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
        enable-linear-replayssm-spec: true
  benchmark:
    env:
      CONC: '8'

override_tp2_c12:
  roles:
    agg:
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 24
        cuda-graph-max-bs-decode: 24
        enable-linear-replayssm-spec: true
  benchmark:
    env:
      CONC: '12'

override_tp2_c14:
  roles:
    agg:
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 28
        cuda-graph-max-bs-decode: 28
        enable-linear-replayssm-spec: true
  benchmark:
    env:
      CONC: '14'

override_tp2_c16:
  roles:
    agg:
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        enable-linear-replayssm-spec: true
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: none

override_tp4_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
  benchmark:
    env:
      CONC: '1'

override_tp4_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
  benchmark:
    env:
      CONC: '8'

# TP2 at 16, 20 and 24 agents with an FP8 (E4M3) KV cache and HiCache host-DRAM
# offload. The rest of the server is the tp2 recipe above. FP8 KV grows the GPU KV
# pool 1.9x (2.10M to 3.96M tokens at c16); HiCache keeps evicted prefixes in host memory
# (50 GB per rank) instead of dropping them. Admission is 2x CONC, as in tp2_c16.
override_tp2_c16_hicache:
  roles:
    agg:
      args: &tp2_hicache_args
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        enable-linear-replayssm-spec: true
        kv-cache-dtype: fp8_e4m3
        enable-hierarchical-cache: true
        hicache-size: 50
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
  benchmark:
    env: &tp2_hicache_client
      KV_OFFLOADING: dram
      CONC: '16'

override_tp2_c20_hicache:
  roles:
    agg:
      args:
        <<: *tp2_hicache_args
        max-running-requests: 40
        cuda-graph-max-bs-decode: 40
  benchmark:
    env:
      <<: *tp2_hicache_client
      CONC: '20'

override_tp2_c24_hicache:
  roles:
    agg:
      args:
        <<: *tp2_hicache_args
        max-running-requests: 48
        cuda-graph-max-bs-decode: 48
  benchmark:
    env:
      <<: *tp2_hicache_client
      CONC: '24'
