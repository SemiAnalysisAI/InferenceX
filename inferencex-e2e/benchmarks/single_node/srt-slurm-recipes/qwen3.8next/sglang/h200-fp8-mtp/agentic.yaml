base:
  schema: 2
  name: qwen3.8next-fp8-h200-sglang-agentic
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: Qwen/Qwen3.8-Flash-Next-FP8
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 4
        data-parallel-size: 1
        mem-fraction-static: 0.85
        chunked-prefill-size: 8192
        linear-attn-prefill-backend: flashinfer
        linear-attn-decode-backend: flashinfer
        mamba-ssm-dtype: float32
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        reasoning-parser: auto
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'

override_tp2_c1:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2  # decode graphs cover the full admission, so no decode step runs eager
  benchmark:
    env:
      CONC: '1'

override_tp2_c8:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
        enable-linear-replayssm-spec: true
  benchmark:
    env:
      CONC: '8'

