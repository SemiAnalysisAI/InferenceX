base:
  schema: 2
  name: qwen3.8next-fp4-b300-sglang-agentic
  identity:
    model:
      revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
    container: {}
  resources:
    gpu_type: b300
    gpus_per_node: 8
  slurm:
    time_limit: '6:00:00'
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 1
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        NO_COLOR: '1'
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        # Explicitly disable the prohibited draft precision conversion path.
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
      args:
        served-model-name: nvidia/Qwen3.8-Flash-Next-NVFP4
        revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
        speculative-draft-model-revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
        trust-remote-code: true
        quantization: modelopt_mixed
        context-length: 262144
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        attention-backend: trtllm_mha
        linear-attn-prefill-backend: flashinfer
        linear-attn-decode-backend: flashinfer
        linear-attn-verify-backend: triton
        mamba-ssm-dtype: bfloat16
        mamba-radix-cache-strategy: extra_buffer_lazy
        mamba-track-interval: 256
        max-mamba-cache-size: 480
        mem-fraction-static: 0.88
        max-running-requests: 96
        page-size: 64
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        moe-runner-backend: flashinfer_trtllm
        moe-a2a-backend: none
        disable-shared-experts-fusion: true
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        speculative-moe-runner-backend: flashinfer_trtllm
        # The native connector injects model-specific golden AL for throughput;
        # quality evaluations use real verification. No manual AL override.
        enable-linear-replayssm-spec: true
        cuda-graph-backend-prefill: disabled
        cuda-graph-backend-decode: full
        cuda-graph-max-bs-decode: 96
        cuda-graph-bs-decode: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96]
        kv-cache-dtype: bfloat16
        speculative-draft-kv-cache-dtype: bfloat16
        enable-hierarchical-cache: true
        # One combined packed target/draft KV + Mamba host-pool budget: 298 of the
        # 299 GB generated allowance, keeping 1 GB of page-alignment headroom.
        hicache-size: 298
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
        ple-offload-embedding: true
        ple-offload-backend: pinned
        enable-metrics: true
        enable-cache-report: true
        reasoning-parser: auto
        tokenizer-worker-num: 1
        scheduler-recv-interval: 1
        decode-log-interval: 10
        stream-interval: 20
        watchdog-timeout: 1800
        random-seed: 35
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      # Native single-node binding verifies these against the generated point.
      TOTAL_CPU_DRAM_GB: '299'
      KV_OFFLOADING: dram

override_c1:
  roles:
    agg:
      args:
        <<: &gpu_only_args
          # null drops the base setting, so SGLang's default applies.
          enable-hierarchical-cache: null
          hicache-size: null
          hicache-io-backend: null
          hicache-mem-layout: null
          hicache-write-policy: null
          mamba-radix-cache-strategy: null
          mamba-track-interval: null
          max-mamba-cache-size: null
          # Dense small sizes: decode batches up to 16 pad by at most one request.
          cuda-graph-bs-decode: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 14, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96]
          tokenizer-worker-num: 6
        max-running-requests: 2
  benchmark:
    env:
      <<: &gpu_only_client
        KV_OFFLOADING: none
        TOTAL_CPU_DRAM_GB: '0'
      CONC: '1'

override_c4:
  roles:
    agg:
      args: *gpu_only_args
  benchmark:
    env:
      <<: *gpu_only_client
      CONC: '4'

override_c8:
  roles:
    agg:
      args: *gpu_only_args
  benchmark:
    env:
      <<: *gpu_only_client
      CONC: '8'

override_c12:
  roles:
    agg:
      args: *gpu_only_args
  benchmark:
    env:
      <<: *gpu_only_client
      CONC: '12'

override_c16:
  roles:
    agg:
      args: *gpu_only_args
  benchmark:
    env:
      <<: *gpu_only_client
      CONC: '16'

override_c32:
  benchmark:
    env:
      CONC: '32'

override_c48:
  benchmark:
    env:
      CONC: '48'
