# Qwen3.8-Flash-Next Quark MXFP4 MoE (MTP experts included), FP8 attention and
# FP8 PLE, AgentX on MI355X via SGLang with native NEXTN MTP. The ~116 GiB
# checkpoint fits on one MI355X, so TP1. The upstream image is used unpatched.
base:
  schema: 2
  name: qwen3.8next-fp4-mi355x-sglang-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 1
      args:
        served-model-name: amd/Qwen3.8-Flash-Next-Quark-MXFP4-AttnFP8-PLEFP8
        tokenizer-path: amd/Qwen3.8-Flash-Next-Quark-MXFP4-AttnFP8-PLEFP8
        trust-remote-code: true
        tensor-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        quantization: quark
        attention-backend: aiter
        page-size: 64
        kv-cache-dtype: auto
        mem-fraction-static: 0.9
        model-loader-extra-config: '{"enable_multithread_load": true}'
        watchdog-timeout: 1200
        chunked-prefill-size: 16384
        mamba-ssm-dtype: bfloat16
        # PLE n-gram table in CPU pinned memory; offload needs the fp8 storage
        # declared up front instead of switched to at load.
        ple-offload-embedding: true
        json-model-override-args: '{"text_config": {"ple_embedding_dtype": "float8_e4m3fn"}}'
        scheduler-recv-interval: 10
        stream-interval: 50
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        # GDN target verify folds each commit through a raw-input window instead
        # of per-draft state snapshots; needs the linear draft chain (topk 1).
        enable-linear-replayssm-spec: true
        tokenizer-worker-num: 6
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        ROCM_QUICK_REDUCE_QUANTIZATION: NONE
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        SGLANG_ENABLE_SPEC_V2: '1'
        AITER_GDR_FLYDSL: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# c1, c2, c4 and c8 run the FlyDSL monokernel (--enable-amd-monokernel) for MTP
# target verify and draft. Its verify writes the per-draft intermediate SSM
# states, so ReplaySSM is off, and its prelude reads the PLE table on the GPU,
# so the table is not offloaded. Admission equals the concurrency. These points
# also set SGLANG_USE_AITER, which the monokernel requires (the image sets it
# too), so they form their own GSM8K eval group. c12 and c16 keep ReplaySSM,
# the PLE offload and 2x CONC admission. Every point uses mem-fraction-static
# as given instead of the aiter backend's 0.85 scaling.
override_c1:
  roles:
    agg:
      args:
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_c2:
  roles:
    agg:
      args:
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: none

override_c4:
  roles:
    agg:
      args:
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 4
        cuda-graph-max-bs-decode: 4
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none

override_c8:
  roles:
    agg:
      args:
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: none

override_c12:
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs-decode: 24
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
  benchmark:
    env:
      CONC: '12'
      KV_OFFLOADING: none

override_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: none

# c24, c48 and c80 keep ReplaySSM and the PLE offload, store the target and draft KV
# caches in FP8 (E4M3), and add HiCache host-DRAM offload with a Mamba state pool
# that tracks a checkpoint every 256 tokens (extra_buffer_lazy). HiCache takes the
# point's 299 GB DRAM share from the matrix generator (hicache-size 200 at c24, 298
# at c48 and c80); TOTAL_CPU_DRAM_GB records it. mem-fraction-static is 0.88, used
# as given. c24 admits 2x CONC; c48 and c80 admit 128 requests.
# c80 caches only the prompt on finish and keeps at most two Mamba states per path.
override_c24:
  roles:
    agg:
      args: &hicache_args
        kv-cache-dtype: fp8_e4m3
        speculative-draft-kv-cache-dtype: fp8_e4m3
        mem-fraction-static: 0.88
        max-running-requests: 48
        cuda-graph-max-bs-decode: 48
        max-mamba-cache-size: 960
        mamba-radix-cache-strategy: extra_buffer_lazy
        mamba-track-interval: 256
        enable-hierarchical-cache: true
        hicache-size: 200
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
      env: &hicache_env
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER_UNIFIED_ATTN: '1'
  benchmark:
    env: &hicache_client
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '299'
      CONC: '24'

override_c48:
  roles:
    agg:
      args:
        <<: *hicache_args
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        max-mamba-cache-size: 720
        hicache-size: 298
      env: *hicache_env
  benchmark:
    env:
      <<: *hicache_client
      CONC: '48'

override_c80:
  roles:
    agg:
      args:
        <<: *hicache_args
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        max-mamba-cache-size: 640
        hicache-size: 298
        # Cache only the prompt on finish; the AgentX replay never re-sends model output.
        strip-thinking-cache: true
        # At most two Mamba states per conversation path; stale interior states skip host write-back.
        mamba-max-states-per-path: 2
      env: *hicache_env
  benchmark:
    env:
      <<: *hicache_client
      CONC: '80'
