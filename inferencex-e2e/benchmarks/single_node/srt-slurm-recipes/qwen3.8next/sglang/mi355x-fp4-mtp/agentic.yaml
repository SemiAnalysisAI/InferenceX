# Qwen3.8-Flash-Next Quark MXFP4 MoE (MTP experts included), FP8 attention and
# FP8 PLE, AgentX on MI355X via SGLang with native NEXTN MTP. The ~116 GiB
# checkpoint fits on one MI355X, so TP1.
base:
  schema: 2
  name: qwen3.8next-fp4-mi355x-sglang-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  # The setup script replaces the image's AITER with the v0.1.29 release wheel (the ROCm 7.14
  # cp312 build, the one whose prebuilt kernels match the image's torch, which is built for
  # HIP 7.15; the ROCm 10.0 and 10.1 wheels fail on any tensor call; FlyDSL 0.4.2 is what
  # that release requires) and patches SGLang with open upstream PRs (sgl-project/sglang
  # #48648, #45196, #48649, #45529, #41683, #41879, #44103, #48090, #50024). It also patches
  # the image's sgl-amd-mono (the monokernel, an editable install at /sgl-workspace/sgl-amd-mono)
  # with the updated Qwen3.8-Flash-Next monokernel of amd-asalykov/sgl-amd-mono, branch
  # asalykov/qfn-mono-tp (afbb25a457009d), which serves TP 1, 2 and 4.
  # The patch files are in patches/ next to this recipe.
  setup_script: qwen3.8next-rocm10-patches.sh
  environment:
    AITER_WHEEL_URL: https://github.com/ROCm/aiter/releases/download/v0.1.29/amd_aiter-0.1.29%2Brocm7.14.manylinux.2.28-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl#sha256=e3e738fbc666cc8ff4f5edc2c98d48bc6736240bfbdc1adc851cc146ad0803b8
    AITER_FLYDSL_VERSION: 0.4.2
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 1
      args:
        served-model-name: amd/Qwen3.8-Flash-Next-Quark-MXFP4-AttnFP8-PLEFP8
        tokenizer-path: amd/Qwen3.8-Flash-Next-Quark-MXFP4-AttnFP8-PLEFP8
        trust-remote-code: true
        tensor-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        quantization: quark
        attention-backend: aiter
        page-size: 64
        kv-cache-dtype: auto
        mem-fraction-static: 0.9
        model-loader-extra-config: '{"enable_multithread_load": true}'
        watchdog-timeout: 1200
        chunked-prefill-size: 16384
        mamba-ssm-dtype: bfloat16
        # PLE n-gram table in CPU pinned memory; offload needs the fp8 storage
        # declared up front instead of switched to at load.
        ple-offload-embedding: true
        json-model-override-args: '{"text_config": {"ple_embedding_dtype": "float8_e4m3fn"}}'
        scheduler-recv-interval: 10
        stream-interval: 50
        reasoning-parser: qwen3
        default-chat-template-kwargs: '{"enable_thinking": false}'
        tool-call-parser: qwen3_coder
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        # GDN target verify folds each commit through a raw-input window instead
        # of per-draft state snapshots; needs the linear draft chain (topk 1).
        enable-linear-replayssm-spec: true
        tokenizer-worker-num: 6
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        ROCM_QUICK_REDUCE_QUANTIZATION: NONE
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        SGLANG_ENABLE_SPEC_V2: '1'
        AITER_GDR_FLYDSL: '1'
        # The FlyDSL QSA sparse decode (sglang#45196) is on whenever SGLANG_USE_AITER
        # is set on gfx950. The GDN prefill (sglang#41879, #44103) runs AITER's
        # FlyDSL causal conv1d and the single fused chunked-prefill kernel
        # (ROCm/aiter#6496), which needs the bf16 SSM state set above.
        SGLANG_USE_AITER: '1'
        SGLANG_AITER_GDN_CONV: '1'
        SGLANG_AITER_GDN_PREFILL: '1'
        SGLANG_AITER_GDN_PREFILL_H: fused
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# c1 and c2 run the FlyDSL monokernel (--enable-amd-monokernel) for MTP target verify
# and draft. Its verify writes the per-draft intermediate SSM states, so ReplaySSM is
# off, and its prelude reads the PLE table on the GPU, so the table is not offloaded.
# Admission equals the concurrency. These points also set SGLANG_USE_AITER, which the
# monokernel requires (the image sets it too), so they form their own GSM8K eval group.
# Every point uses mem-fraction-static as given instead of the aiter backend's 0.85
# scaling. The updated monokernel (patch 10) also runs c1 at TP 2 and TP 4: each rank
# runs its shard and the all-reduces run inside the kernel (attention TP = MoE TP = TP,
# no DP attention, EP 1), so the TP variants only change the GPU count and
# tensor-parallel-size. SGLANG_QWEN35_PACKED_IN_PROJ=0 turns off the packed GDN input
# projection of sglang#50024 (patch 09) at the monokernel points: the monokernel runs the
# decode-sized steps it packs, and it builds a second copy of the projections. Every
# other point keeps it on.
override_c1:
  roles:
    agg:
      args:
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
        SGLANG_QWEN35_PACKED_IN_PROJ: '0'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp2_c1:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
        SGLANG_QWEN35_PACKED_IN_PROJ: '0'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
        SGLANG_QWEN35_PACKED_IN_PROJ: '0'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_c2:
  roles:
    agg:
      args:
        enable-linear-replayssm-spec: null
        ple-offload-embedding: null
        enable-amd-monokernel: true
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
      env:
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_USE_AITER: '1'
        SGLANG_QWEN35_PACKED_IN_PROJ: '0'
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: none

# c12, c24, c48 and c80 keep ReplaySSM and the PLE offload, store the target and draft KV
# caches in FP8 (E4M3), and use a Mamba state pool whose checkpoint interval is 262144
# tokens, so a prompt gets no interior checkpoints (extra_buffer_lazy). mem-fraction-static
# is 0.88, used as given. c12 and c24 admit 2x CONC and serve from GPU KV; c48 and c80
# add HiCache host-DRAM offload and admit 128 requests. HiCache takes the point's 299 GB
# DRAM share from the matrix generator (hicache-size 298); TOTAL_CPU_DRAM_GB records it.
# SGLANG_OPT_QWEN4_FUSED_HC (sglang#48648) fuses the decode-sized hyper-connection
# norm and inject into the mix. The prefill CUDA graph backend is breakable (the AMD
# reference recipes get it from an SGLang default change that this image lacks), which
# captures the GDN prefill on static per-bucket tables; a batch outside the captured
# buckets runs eagerly through the AITER fused prefill. c80 caches only the prompt on
# finish and keeps at most two Mamba states per path.
override_c12:
  roles:
    agg:
      args: &fp8_args
        kv-cache-dtype: fp8_e4m3
        speculative-draft-kv-cache-dtype: fp8_e4m3
        mem-fraction-static: 0.88
        max-running-requests: 24
        cuda-graph-max-bs-decode: 24
        max-mamba-cache-size: 960
        mamba-radix-cache-strategy: extra_buffer_lazy
        mamba-track-interval: 262144
        cuda-graph-backend-prefill: breakable
      env: &fp8_env
        SGLANG_USE_AITER: '1'
        SGLANG_USE_AITER_UNIFIED_ATTN: '1'
        SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: '1'
        SGLANG_OPT_QWEN4_FUSED_HC: '1'
  benchmark:
    env:
      KV_OFFLOADING: none
      CONC: '12'

override_c24:
  roles:
    agg:
      args:
        <<: *fp8_args
        max-running-requests: 48
        cuda-graph-max-bs-decode: 48
      env: *fp8_env
  benchmark:
    env:
      KV_OFFLOADING: none
      CONC: '24'

override_c48:
  roles:
    agg:
      args: &hicache_args
        <<: *fp8_args
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        max-mamba-cache-size: 720
        enable-hierarchical-cache: true
        hicache-size: 298
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_back
      env: *fp8_env
  benchmark:
    env: &hicache_client
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '299'
      CONC: '48'

override_c80:
  roles:
    agg:
      args:
        <<: *hicache_args
        max-mamba-cache-size: 640
        # Cache only the prompt on finish; the AgentX replay never re-sends model output.
        strip-thinking-cache: true
        # At most two Mamba states per conversation path; stale interior states skip host write-back.
        mamba-max-states-per-path: 2
      env: *fp8_env
  benchmark:
    env:
      <<: *hicache_client
      CONC: '80'
