# Qwen3.8-Flash-Next Quark MXFP4 (FP8 PLE) AgentX on MI355X via SGLang with
# native NEXTN MTP. The ~126 GiB checkpoint fits on one MI355X, so TP1.
base:
  schema: 2
  name: qwen3.8next-fp4-mi355x-sglang-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 1
      args:
        served-model-name: amd/Qwen3.8-Flash-Next-Quark-MXFP4-PLEFP8
        tokenizer-path: amd/Qwen3.8-Flash-Next-Quark-MXFP4-PLEFP8
        trust-remote-code: true
        tensor-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        quantization: quark
        attention-backend: aiter
        page-size: 64
        kv-cache-dtype: auto
        mem-fraction-static: 0.9
        model-loader-extra-config: '{"enable_multithread_load": true}'
        watchdog-timeout: 1200
        chunked-prefill-size: 16384
        mamba-ssm-dtype: bfloat16
        scheduler-recv-interval: 10
        stream-interval: 50
        reasoning-parser: qwen3
        default-chat-template-kwargs: '{"enable_thinking": false}'
        tool-call-parser: qwen3_coder
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_USE_AITER: '1'
        SGLANG_USE_AITER_UNIFIED_ATTN: '1'
        AITER_FLYDSL_FORCE: '1'
        ROCM_QUICK_REDUCE_QUANTIZATION: INT8
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        SGLANG_ENABLE_SPEC_V2: '1'
        # FlyDSL GDN causal conv1d and GDN decode/verify kernels; opt-in, "1" only.
        SGLANG_AITER_GDN_CONV: '1'
        SGLANG_AITER_GDN_DECODE: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# One variant per point. Admission is 2x CONC and the decode graph batch is CONC.
override_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 1
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 4
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none

override_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 8
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: none

override_c12:
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs-decode: 12
  benchmark:
    env:
      CONC: '12'
      KV_OFFLOADING: none

override_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 16
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: none
