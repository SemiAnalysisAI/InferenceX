schema: 2
name: h3-sglang-agg-tp2

resources:
  gpu_type: h100

services:
  - name: video-server
    args:
      - --model-view
      - snapshot
      - --
      - /opt/sglang/bin/python3
      - -m
      - evaluator.srt_selected
      - serve
      - --model-type
      - diffusion
      - --model-path
      - "{model_path}"
      - --model-id
      - "{model_id}"
      - --revision
      - "{model_revision}"
      - --model-variant
      - fl2va
      - --num-gpus
      - "{gpus_per_node}"
      - --ulysses-degree
      - "1"
      - --tp-size
      - "2"
      - --encoder-parallel
      - auto
      - --warmup-resolutions
      - 1344x768
      - --disable-conditioning-cache
      - --performance-mode
      - speed
      - --host
      - 0.0.0.0
      - --port
      - "30283"
      - --enable-torch-compile
      - "false"
      - --dit-cpu-offload
      - "false"
    env:
      VIDEO_RUNTIME_REVISION: 297e54fd105e974cdf401e5b4d20253a22c16f90
    readiness:
      timeout_seconds: 1800
