schema: 2
name: h3-sglang-serving-client

resources:
  gpu_type: mi355x

services:
  - name: video-server
    type: generic
    nodes: 1
    critical: true
    start: before_workers
    command: [python3, -m, infx.bench, video, serve]
    args:
      - --model-view
      - snapshot
      - --
      - /opt/venv/bin/python3
      - -m
      - evaluator.srt_selected
      - serve
      - --model-type
      - diffusion
      - --model-path
      - "{model_path}"
      - --model-id
      - "{model_id}"
      - --revision
      - "{model_revision}"
      - --model-variant
      - fl2va
      - --num-gpus
      - "{gpus_per_node}"
      - --ulysses-degree
      - "4"
      - --tp-size
      - "1"
      - --attention-backend
      - aiter
      - --encoder-parallel
      - auto
      - --warmup-resolutions
      - 1344x768
      - --disable-conditioning-cache
      - --performance-mode
      - speed
      - --host
      - 0.0.0.0
      - --port
      - "30283"
      - --enable-torch-compile
      - "false"
      - --dit-cpu-offload
      - "false"
    env:
      PYTHONPATH: /video-package:/infmax-workspace
      PYTHONUNBUFFERED: "1"
      VIDEO_SERVER_PORT: "30283"
      VIDEO_RUNTIME_REVISION: 297e54fd105e974cdf401e5b4d20253a22c16f90
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SGLANG_USE_AITER: "1"
      # The image defaults quick all-reduce to INT8.
      ROCM_QUICK_REDUCE_QUANTIZATION: NONE
    readiness:
      http:
        port: 30283
        path: /health
      timeout_seconds: 1800
      interval_seconds: 5
