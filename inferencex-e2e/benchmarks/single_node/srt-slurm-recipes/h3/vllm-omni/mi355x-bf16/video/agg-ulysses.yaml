schema: 2
name: h3-vllm-omni-agg-ulysses

resources:
  gpu_type: mi355x

services:
  - name: video-server
    # Slurm masks the job's GPUs with ROCR_VISIBLE_DEVICES, and the Ray import in
    # vLLM refuses to start unless HIP_VISIBLE_DEVICES is set too. HIP numbers
    # devices inside that mask, so it is 0..N-1 here.
    preamble: 'export HIP_VISIBLE_DEVICES=$(seq -s, 0 $(( {gpus_per_node} - 1 )))'
    args:
      - --model-view
      - h3-fl2va
      - --
      - vllm
      - serve
      - "{model_path}"
      - --served-model-name
      - "{model_id}"
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "30283"
      - --trust-remote-code
      - --task-type
      - fl2va
      - --num-gpus
      - "{gpus_per_node}"
      - --tensor-parallel-size
      - "1"
      - --usp
      - "{gpus_per_node}"
      - --ring
      - "1"
      - --text-encoder-tp-size
      - "{gpus_per_node}"
      - --vae-patch-parallel-size
      - "{gpus_per_node}"
      - --vae-parallel-mode
      - tile
      - --vae-use-tiling
      # On ROCm, FLASH_ATTN resolves to AITER packed varlen attention.
      - --diffusion-attention-backend
      - FLASH_ATTN
      # H3 reuses AdaLN projection outputs across requests by default; the plan disables
      # cross-request conditioning reuse.
      - --cache-config
      - '{"minimax_h3_adaln_cache": false}'
    env:
      VIDEO_RUNTIME_REVISION: a8576ccb725c4e21cd13c3eb5f9a546b21149d2b
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      OMNI_DIFFUSION_PROMPT_EMBED_CACHE: "0"
      VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"
      VLLM_OMNI_SERVER_STORAGE__PATH: /logs/video/server/storage
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: NONE
    readiness:
      timeout_seconds: 1800
