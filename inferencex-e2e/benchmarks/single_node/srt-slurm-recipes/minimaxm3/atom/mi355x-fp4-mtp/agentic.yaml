      CONC: '2'

# DRAM variants: LMCache's in-process CPU tier with ATOM's segmented LRU and
# all-rank lookup, sized at TOTAL_CPU_DRAM_GB / TP (257 GB) per rank.
# PYTHONHASHSEED keeps every rank's chunk keys identical; without it the
# offload hit rate is zero.
override_tp2_c20_lmcache:
  roles:
    agg:
      gpus: 2
      args:
        max-num-seqs: 40
        extra-kv-connectors:
          - kv_connector: lmcache_offload
            kv_role: offload
      env:
        PYTHONHASHSEED: '0'
        LMCACHE_LOCAL_CPU: 'True'
        LMCACHE_MAX_LOCAL_CPU_SIZE: '257'
        LMCACHE_CHUNK_SIZE: '256'
        LMCACHE_CACHE_POLICY: ATOM_SLRU
        LMCACHE_LOOKUP_SERVER_WORKER_IDS: '0,1'
        ATOM_PREFIX_CACHE_POLICY: slru
        ATOM_PREFIX_CACHE_PROTECTED_RATIO: '0.5'
  benchmark:
    env:
      CONC: '20'
      KV_OFFLOADING: 'dram'
      TOTAL_CPU_DRAM_GB: '515'

override_tp2_c25_lmcache:
  roles:
    agg:
      gpus: 2
      args:
