# MiniMax-M3 MXFP8 AgentX on MI300X with vLLM EAGLE3 (GQA draft). The KV cache
# is GPU-resident, or backed by an LMCache MP DRAM server at the offload point.
base:
  schema: 2
  name: minimaxm3-fp8-mi300x-vllm-agentic
  model:
    path: hf:MiniMaxAI/MiniMax-M3-MXFP8
    container: vllm/vllm-openai-rocm:nightly-0cbac6cd1305f710e12193596b27488397bcb205@sha256:24557f066e617c4ddcc85b555a9111432aa4523b6a3f8a7eb73ef7c5fa5f4185
    precision: fp8
  resources:
    gpu_type: mi300x
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: MiniMaxAI/MiniMax-M3-MXFP8
        tensor-parallel-size: 8
        trust-remote-code: true
        block-size: 128
        gpu-memory-utilization: 0.90
        # MiniMaxM3SparseForConditionalGeneration is not torch-compiled, so
        # without breakable graphs the default FULL_AND_PIECEWISE mode aborts.
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        enable-chunked-prefill: true
        max-num-batched-tokens: 16384
        language-model-only: true
        enable-prefix-caching: true
        attention-backend: TRITON_ATTN
        kv-cache-dtype: fp8
        tool-call-parser: minimax_m3
        reasoning-parser: minimax_m3
        enable-auto-tool-choice: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        stream-interval: 20
        # Three-token EAGLE3; throughput runs replace verification with the
        # golden acceptance length.
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"TRITON_ATTN"}'
      env:
        PYTHONNOUSERSITE: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
        VLLM_ROCM_USE_AITER: '1'
        VLLM_ROCM_USE_AITER_MHA: '0'
        TORCH_BLAS_PREFER_HIPBLASLT: '1'
        NCCL_MIN_NCHANNELS: '112'
        GPU_MAX_HW_QUEUES: '2'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: MiniMaxAI/MiniMax-M3-MXFP8
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# One variant per point. Admission is 2x CONC. The DRAM point runs one
# lmcache-server service on the node with the 8 x 162 GB L1 the per-rank
# servers used to split between them.
override_tp8_c2:
  roles:
    agg:
      args:
        max-num-seqs: 4
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: 'none'

override_tp8_c4:
  roles:
    agg:
      args:
        max-num-seqs: 8
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: 'none'

override_tp8_c6:
  roles:
    agg:
      args:
        max-num-seqs: 12
  benchmark:
    env:
      CONC: '6'
      KV_OFFLOADING: 'none'

override_tp8_c8:
  roles:
    agg:
      args:
        max-num-seqs: 16
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: 'none'

override_tp8_c10:
  roles:
    agg:
      args:
        max-num-seqs: 20
  benchmark:
    env:
      CONC: '10'
      KV_OFFLOADING: 'none'

override_tp8_c16_lmcache:
  # Installs LMCache in the worker container; the service installs its own.
  setup_script: lmcache-mp-rocm.sh
  services:
    - name: lmcache
      type: lmcache-server
      preamble: bash /configs/lmcache-mp-rocm.sh
      # The default probe with more time: the install counts against it.
      readiness:
        http:
          port: 8751
          path: /healthcheck
        timeout_seconds: 900
      args:
        - --l1-size-gb
        - '1296'
        - --l1-init-size-gb
        - '10'
        - --l1-read-ttl-seconds
        - '7200'
        - --chunk-size
        - '256'
        - --max-workers
        - '2'
        - --eviction-policy
        - LRU
        - --supported-transfer-mode
        - lmcache_driven
  roles:
    agg:
      args:
        max-num-seqs: 32
        # The lmcache-mp preset (the node's lmcache-server on port 8750) plus the
        # measured message queue timeout. A KV load that fails once the server
        # falls behind is recomputed rather than failing the request.
        connector: '{"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"lmcache.mp.host":"tcp://localhost","lmcache.mp.port":8750,"lmcache.mp.mq_timeout":6000.0}}'
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: 'dram'
      TOTAL_CPU_DRAM_GB: '1298'
