base:
  schema: 2
  name: minimaxm3-fp4-b300-vllm-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: nvidia/MiniMax-M3-NVFP4
        gpu-memory-utilization: 0.95
        block-size: 128
        language-model-only: true
        enable-prefix-caching: true
        enable-chunked-prefill: true
        no-enable-flashinfer-autotune: true
        reasoning-parser: minimax_m3
        tool-call-parser: minimax_m3
        enable-auto-tool-choice: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}'
        kv-cache-dtype: fp8
        max-num-batched-tokens: 16384
        stream-interval: 20
        trust-remote-code: true
        # Three-token EAGLE3 with the GQA draft head. Throughput uses
        # golden-AL synthetic rejection.
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASHINFER","use_local_argmax_reduction":true}'
      env:
        PYTHONNOUSERSITE: '1'
        VLLM_FLOAT32_MATMUL_PRECISION: high
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. DRAM points give SimpleCPUOffload the whole host budget
# (TOTAL_CPU_DRAM_GB decimal GB) with lazy offload.
override_tp8_c1:
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 8
        max-num-seqs: 2
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,256,512,1024,2048]}'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp4_c20:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-num-seqs: 30
        max-num-active-seqs: 6
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,256,512,1024,2048,3072,4096,5120,6144,7168,8192,10240,12288,14336,16384]}'
  benchmark:
    env:
      CONC: '20'
      KV_OFFLOADING: none

override_tp4_c24:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-num-seqs: 7
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128,132,136,140,144,256,512,1024,2048,2560,3072,3584,4096,5120,6144,7168,8192]}'
      env:
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: mnnvl
  benchmark:
    env:
      CONC: '24'
      KV_OFFLOADING: none

override_tp2_c24_dram:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-num-seqs: 36
        gpu-memory-utilization: 0.92
        attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8","minimax_m3_msa_decode_backend":"cutlass"}'
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128,132,136,140,144,256,512,1024,2048]}'
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":749000000000,"lazy_offload":true}}'
      env:
        VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
  benchmark:
    env:
      CONC: '24'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '749'

override_tp2_c28_dram:
  slurm:
    time_limit: "02:20:00"
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-num-seqs: 36
        gpu-memory-utilization: 0.92
        attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8","minimax_m3_msa_decode_backend":"cutlass"}'
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128,132,136,140,144,256,512,1024,2048]}'
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":749000000000,"lazy_offload":true}}'
      env:
        VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
  benchmark:
    env:
      CONC: '28'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '749'
