base:
  schema: 2
  name: minimaxm3-fp8-h200-vllm-agentic
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: MiniMaxAI/MiniMax-M3-MXFP8
        tensor-parallel-size: 8
        data-parallel-size: 1
        attention-backend: FLASH_ATTN
        linear-backend: humming
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        block-size: 128
        language-model-only: true
        enable-prefix-caching: true
        enable-prompt-tokens-details: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN"}'
        tool-call-parser: minimax_m3
        reasoning-parser: minimax_m3
        enable-auto-tool-choice: true
        trust-remote-code: true
        safetensors-load-strategy: prefetch
      env:
        PYTHONNOUSERSITE: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

override_tp8_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        max-cudagraph-capture-size: 8
        gpu-memory-utilization: 0.95
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

