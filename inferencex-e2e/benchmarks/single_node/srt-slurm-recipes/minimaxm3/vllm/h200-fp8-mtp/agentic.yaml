# MiniMax-M3 MXFP8 AgentX on H200 with vLLM EAGLE3 (the GQA draft head)
# and an FP8 MSA indexer cache.
base:
  schema: 2
  name: minimaxm3-fp8-h200-vllm-agentic
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: MiniMaxAI/MiniMax-M3-MXFP8
        tensor-parallel-size: 8
        data-parallel-size: 1
        attention-backend: FLASH_ATTN
        # Humming for dense MXFP8 linear layers.
        linear-backend: humming
        kv-cache-dtype: fp8
        # Use the FP8 MSA indexer cache supported by this vLLM image.
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        block-size: 128
        language-model-only: true
        enable-prefix-caching: true
        enable-prompt-tokens-details: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        # Three-token EAGLE3 with the GQA draft head. Throughput runs switch to
        # synthetic rejection at the golden acceptance length.
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN"}'
        tool-call-parser: minimax_m3
        reasoning-parser: minimax_m3
        enable-auto-tool-choice: true
        trust-remote-code: true
        # vLLM nightlies from 2026-09-15 lazy-mmap checkpoints on h200-dgxc's VIRTIOFS
        # HF cache ~14x slower and miss the readiness window; stream the shards into
        # page cache with parallel readers first.
        safetensors-load-strategy: prefetch
      env:
        PYTHONNOUSERSITE: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        # Atomic reduction for the Marlin MXFP8 MoE path.
        VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. The scheduler batch is 2x CONC and graph capture covers
# it at four tokens per sequence (three drafts).
override_tp8_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        max-cudagraph-capture-size: 8
        gpu-memory-utilization: 0.95
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

