override_tp8_c6_dram:
  setup_script: vllm-mooncake.sh
  services:
    - name: mooncake-master
      type: mooncake-master
      readiness:
        port: 8700
        timeout_seconds: 900
      preamble: bash /configs/vllm-mooncake.sh
      args:
        - '--eviction_high_watermark_ratio=0.80'
        - '--eviction_ratio=0.10'
      options:
        store_config:
          mode: embedded
          metadata_server: P2PHANDSHAKE
          global_segment_size: 119GB
          local_buffer_size: 4GB
          protocol: rdma
          device_name: ''
          enable_offload: false
  roles:
    agg:
      args:
        max-num-seqs: 12
        max-cudagraph-capture-size: 48
        kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true}}'
      env:
        PYTHONHASHSEED: '0'
        MC_SLICE_SIZE: '1048576'
        MC_WORKERS_PER_CTX: '4'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
  benchmark:
    env:
      CONC: '6'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1731'

