base:
  schema: 2
  name: minimaxm3-fp8-h100-vllm-agentic
  resources:
    gpu_type: h100
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: MiniMaxAI/MiniMax-M3-MXFP8
        tensor-parallel-size: 8
        data-parallel-size: 1
        gpu-memory-utilization: 0.90
        cpu-offload-gb: 26
        attention-backend: TRITON_ATTN
        safetensors-load-strategy: lazy
        kv-cache-dtype: fp8
        block-size: 128
        language-model-only: true
        enable-prefix-caching: true
        enable-prompt-tokens-details: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN"}'
        tool-call-parser: minimax_m3
        reasoning-parser: minimax_m3
        enable-auto-tool-choice: true
        trust-remote-code: true
      env:
        PYTHONNOUSERSITE: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

override_tp8_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        max-cudagraph-capture-size: 8
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

