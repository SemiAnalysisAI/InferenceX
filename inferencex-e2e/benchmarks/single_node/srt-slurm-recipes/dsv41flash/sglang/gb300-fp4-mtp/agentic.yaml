# DeepSeek-V4.1-Flash AgentX on GB300 with SGLang native DSpark. The KV cache
# is GPU-resident.
base:
  schema: 2
  name: dsv41flash-fp4-gb300-sglang-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: lmsysorg/sglang:nightly-dev-cu13-20260929-79cafec0@sha256:0f075735a6bf913a7cc1cd7ece4f526ae8af70fc5b88fdc02d9efe92a61cf3ae
    precision: fp4
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        # Keep active decode requests progressing while long prefixes are queued.
        prefill-decode-interval: 16
        mem-fraction-static: 0.8
        # DSpark is the checkpoint's bundled draft; the block size is its only knob.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        # Admission never exceeds the captured decode graph batch.
        cuda-graph-max-bs-decode: 64
        reasoning-parser: auto
        tool-call-parser: auto
        # Draft passes under long-context load outlast the 1800 s default watchdog.
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # AgentX measures thinking on, the regime of the golden acceptance curve.
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV41_REASONING_EFFORT: high
        SGLANG_DSPARK_OPT_MARKOV_W2_BF16: 'True'
        # Fold DSpark draft sampling into the draft CUDA graph. AUTO leaves it eager
        # for V4.1 TP shards, which left c1 decode launch-bound (~6 ms GPU idle per
        # step in nsys at TP4 c1).
        SGLANG_DSPARK_FOLDED_SAMPLING: '2'
  # Cold weight loads from the shared HF cache plus graph capture outlast
  # srt-slurm's 1800 s default, as they did the legacy one-hour deadline.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. Admission is 2x CONC, capped at the graph batch. SWA
# prefix tails are 64x CONC up to 4096 from c2. TP2 keeps row-sharded Engram
# tables in host DRAM and doubles the prefill chunk from c64; TP2 c128 admits
# 128 requests with a 4-step prefill-decode interval. TP4 uses static ragged
# verify; pure TP4 c1/c2 keep Engram in HBM, while TP4/EP4 from c4 keeps it in
# host DRAM with 4096 SWA tails and a 128 graph batch, 16K chunks and no
# prefill-decode interval, except c64, which runs 8K chunks with a 16-step
# interval. Saturation points get a longer warmup drain.
override_tp2_c1:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        chunked-prefill-size: 4096
        max-running-requests: 2
      env:
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
  benchmark:
    env:
      CONC: '1'
      AGENTIC_WARMUP_GRACE_PERIOD: '1800'

override_tp2_c2:
  roles:
