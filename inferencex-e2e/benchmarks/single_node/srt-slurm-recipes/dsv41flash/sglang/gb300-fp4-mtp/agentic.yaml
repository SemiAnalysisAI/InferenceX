base:
  schema: 2
  name: dsv41flash-fp4-gb300-sglang-agentic
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        # Keep active decode requests progressing while long prefixes are queued.
        prefill-decode-interval: 16
        mem-fraction-static: 0.8
        # DSpark is the checkpoint's bundled draft; the block size is its only knob.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        # Admission never exceeds the captured decode graph batch.
        cuda-graph-max-bs-decode: 64
        reasoning-parser: auto
        tool-call-parser: auto
        tokenizer-backend: fastokens
        # Draft passes under long-context load outlast the 1800 s default watchdog.
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # AgentX measures thinking on, the regime of the golden acceptance curve.
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV41_REASONING_EFFORT: high
        SGLANG_DSPARK_OPT_MARKOV_W2_BF16: 'True'
        # Fold DSpark draft sampling into the draft CUDA graph. AUTO leaves it eager
        # for V4.1 TP shards, which left c1 decode launch-bound (~6 ms GPU idle per
        # step in nsys at TP4 c1).
        SGLANG_DSPARK_FOLDED_SAMPLING: '2'
  # Cold weight loads from the shared HF cache plus graph capture outlast
  # srt-slurm's 1800 s default, as they did the legacy one-hour deadline.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_tp2_c16:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        # auto resolves to MegaAttention, which zero-pads per-rank heads to 64 (2x at TP2, 4x at TP4).
        dsv4-attn-backend: flashmla
        <<: &tp2_bounded_replay
          chunked-prefill-size: 16384
          enable-decoder-swa-bounded-replay: true
          cuda-graph-backend-prefill: disabled
        prefill-decode-interval: 96
        tokenizer-worker-num: 4
        swa-prefix-tails: 1024
        max-running-requests: 32
      env:
        <<: &tp2_env
          SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
          SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
          PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        SGLANG_NUMA_BIND_V2: '0'
  benchmark:
    env:
      CONC: '16'
      AGENTIC_WARMUP_GRACE_PERIOD: '1800'

override_tp2_c32:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        expert-parallel-size: 2
        dsv4-attn-backend: flashmla
        <<: *tp2_bounded_replay
        prefill-decode-interval: 48
        tokenizer-worker-num: 4
        swa-prefix-tails: 2048
        max-running-requests: 64
      env: *tp2_env
  benchmark:
    env:
      CONC: '32'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'

override_dep2_c64:
  frontend: &dep2_frontend
    type: sglang-router
    args:
      policy: cache_aware
      request-id-headers: x-correlation-id
      dp-aware: true
      connect-timeout-secs: 900
      request-timeout-secs: 14400
      disable-health-check: true
      disable-retries: true
  roles:
    agg:
      gpus: 2
      args:
        <<: &dep2_args
          tensor-parallel-size: 2
          data-parallel-size: 2
          expert-parallel-size: 2
          enable-dp-attention: true
          enable-dp-lm-head: true
          enable-dp-attention-local-control-broadcast: true
          load-balance-method: total_requests
          moe-a2a-backend: megamoe
          schedule-policy: shortest-prefill-first
          tokenizer-worker-num: 4
          chunked-prefill-size: 16384
          swa-prefix-tails: 4096
          enable-decoder-swa-bounded-replay: true
        prefill-decode-interval: 24
        max-running-requests: 128
      env: &dep2_env
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_RAGGED_VERIFY_MODE: static
        SGLANG_NUMA_BIND_V2: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  benchmark:
    env:
      <<: &dep2_client
        AIPERF_HTTP_X_SMG_ROUTING_KEY_FROM_CORRELATION_ID: 'true'
        AGENTIC_WARMUP_GRACE_PERIOD: '3600'
      CONC: '64'

override_dep2_c128:
  frontend: *dep2_frontend
  roles:
    agg:
      gpus: 2
      args:
        <<: *dep2_args
        prefill-decode-interval: 16
        mem-fraction-static: 0.85
        max-running-requests: 256
        cuda-graph-max-bs-decode: 128
      env: *dep2_env
  benchmark:
    env:
      <<: *dep2_client
      CONC: '128'

override_dep2_c160:
  frontend: *dep2_frontend
  roles:
    agg:
      gpus: 2
      args:
        <<: *dep2_args
        prefill-decode-interval: 8
        mem-fraction-static: 0.85
        max-running-requests: 256
        cuda-graph-max-bs-decode: 128
        tokenizer-backend: huggingface
      env: *dep2_env
  benchmark:
    env:
      <<: *dep2_client
      CONC: '160'

override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        mem-fraction-static: 0.91
        kv-cache-dtype: fp8_e4m3
        dsv4-attn-backend: flashmla
        moe-a2a-backend: none
        enable-nvidia-megakernel: true
        startup-weight-load-mode: serial
        enable-decoder-swa-bounded-replay: true
        context-length: 1048576
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
        prefill-decode-interval: 16
        schedule-policy: lpm
        swa-prefix-tails: 128
        chunked-prefill-size: 16384
        enable-metrics-for-all-schedulers: true
      env:
        SGLANG_SPEC_TP_SYNC: rng,-dspark-accept-sample
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_NVIDIA_MEGAKERNEL_SLOTS: hop_a,moe,gate,attn,embed,two_shot,markov,draft_lm_head,aux_mean_stats,gate_wide,shared_ll,hop_a_batch2,engram,attn_qkv_a,attn_qkv_a_bf16,index_q_mxfp8_in,attn_indexer,hc_prenorm,hop_b,hop_b_wide,early_trigger,hop_b_start_trigger,draft,draft_moe,draft_gate,draft_tail,draft_post,draft_seam,draft_attn,draft_qfront,draft_wo_a,draft_swapab,draft_qkv_a,draft_prenorm,draft_qkv_a_ll,draft_wo_b_ll,sched_ahead,req_pos_once,kv_before_wait,target_lm_head,hop_b_quad_trigger,lm_head_pinned_tactic
        SGLANG_DSPARK_FUSED_ACCEPT_TAIL: '1'
        SGLANG_DSPARK_DEFER_CONTEXT_KV: '1'
        SGLANG_OPT_DSV41_DSPARK_DRAFT_PREP_FORK: '1'
        SGLANG_OPT_DSV41_DSPARK_POST_FOLD: '1'
        SGLANG_OPT_DSV41_DSPARK_SKIP_PREFILLED_INPUTS: '1'
        SGLANG_OPT_DSV41_DSPARK_ONE_LAUNCH_COMMIT_STAGE: '1'
        SGLANG_OPT_DSV41_DSPARK_PREPARE_INPUTS_ONCE: '1'
        SGLANG_OPT_DSV41_DSPARK_MID_FOLD: '1'
        SGLANG_OPT_DSV41_TARGET_VERIFY_METADATA_GLUE: '1'
        SGLANG_OPT_DSV41_TARGET_METADATA_EARLY: '1'
        SGLANG_OPT_SKIP_GLUED_REPLAY_VIEW: '1'
        SGLANG_OPT_DSV41_POST_FORWARD_CUDA_GRAPH: '1'
        SGLANG_OPT_DSV41_BLOCKWISE_REJECTION: '1'
        SGLANG_OPT_DSV41_SAMPLING_ACCEPT_GRAPH: '1'
        SGLANG_SIMULATE_ACC_GREEDY: '0'
        SGLANG_OPT_DSV41_DSPARK_SIM_DRAW_AHEAD: '1'
        SGLANG_OPT_MXFP4_DEFERRED_FINALIZED_SHAPE: '1'
        SGLANG_OPT_CUDA_GRAPH_FILL_FAST_PATH: '1'
        NCCL_CUMEM_ENABLE: '0'
        NCCL_MNNVL_ENABLE: '0'
  benchmark:
    env:
      CONC: '1'
      AGENTIC_WARMUP_GRACE_PERIOD: '1800'

override_tp4_c4:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        dsv4-attn-backend: flashmla
        chunked-prefill-size: 16384
        prefill-decode-interval: 0
        swa-prefix-tails: 4096
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
      env:
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_RAGGED_VERIFY_MODE: static
  benchmark:
    env:
      CONC: '4'
      AGENTIC_WARMUP_GRACE_PERIOD: '1800'

override_tp4_c16:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        dsv4-attn-backend: flashmla
        chunked-prefill-size: 16384
        prefill-decode-interval: 192
        tokenizer-worker-num: 4
        swa-prefix-tails: 4096
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
      env:
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_NUMA_BIND_V2: '0'
        SGLANG_RAGGED_VERIFY_MODE: static
  benchmark:
    env:
      CONC: '16'
      AGENTIC_WARMUP_GRACE_PERIOD: '1800'

