base:
  schema: 2
  name: dsv41flash-fp4-mi355x-sglang-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 2
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        tensor-parallel-size: 2
        # DSpark is the checkpoint's bundled draft; the block size is its only knob.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        enforce-shared-experts-fusion: true
        fp8-gemm-backend: aiter
        cuda-graph-max-bs-decode: 64
        enable-decoder-swa-bounded-replay: true
        cuda-graph-backend-prefill: disabled
        reasoning-parser: auto
        tool-call-parser: auto
        # Draft passes under long-context load outlast the 1800 s default watchdog.
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # AgentX measures thinking on, the regime of the golden acceptance curve.
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV41_REASONING_EFFORT: high
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_USE_AITER: '1'
        SGLANG_USE_ROCM700A: '0'
        TRITON_HIP_USE_ASYNC_COPY: '0'
        ROCM_QUICK_REDUCE_QUANTIZATION: INT8
        SGLANG_OPT_HIP_OPUS_SPARSE_PREFILL: 'true'
        AITER_BF16_FP8_MOE_BOUND: '0'
        TORCH_BLAS_PREFER_HIPBLASLT: '1'
        HSA_NO_SCRATCH_RECLAIM: '0'
        GPU_MAX_HW_QUEUES: '2'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point; the saturation point gets a longer warmup drain. A longer
# prefill-decode interval trades TTFT for P90 ITL: 192 with lpm up to c8, 96 at c16
# and 32 at c32. amd-master.yaml runs c32 and c64 on the DP2 variants only.
override_tp2_c1:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        mem-fraction-static: 0.70
        chunked-prefill-size: 16384
        prefill-decode-interval: 192
        schedule-policy: lpm
        swa-prefix-tails: 128
        max-running-requests: 2
  benchmark:
    env:
      CONC: '1'

override_tp2_c2:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        mem-fraction-static: 0.70
        chunked-prefill-size: 16384
        prefill-decode-interval: 192
        schedule-policy: lpm
        swa-prefix-tails: 128
        max-running-requests: 4
  benchmark:
    env:
      CONC: '2'

override_tp2_c4:
  roles:
