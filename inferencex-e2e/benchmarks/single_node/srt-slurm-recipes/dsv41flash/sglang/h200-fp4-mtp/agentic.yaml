# DeepSeek-V4.1-Flash AgentX on H200 with SGLang native DSpark, following the
# published vLLM baseline topologies TP4/EP1 and TP8/EP1. The KV cache is
# GPU-resident. https://lmsysorg.mintlify.app/cookbook/autoregressive/DeepSeek/DeepSeek-V4_1
base:
  schema: 2
  name: dsv41flash-fp4-h200-sglang-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: lmsysorg/sglang:nightly-dev-cu13-20260923-06008c17
    precision: fp4
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        data-parallel-size: 1
        expert-parallel-size: 1
        attention-backend: dsv4
        # Native Marlin pads the TP-sharded 2304-wide experts (TP4=576, TP8=288)
        # that the SM90 CUTLASS method rejects; both consume the MXFP4 weights.
        moe-runner-backend: marlin
        # Below the cookbook's 0.8, with a bounded prefill chunk: the sparse
        # attention indexer and DSpark prefill buffers scale with chunk times the
        # 1M context. The default 16384 chunk exhausted HBM on 66k-99k-token
        # prompts, and 8192 OOMed c32 (run 35308550355).
        mem-fraction-static: 0.70
        chunked-prefill-size: 4096
        # Keep active decode requests progressing while long prefixes are queued.
        prefill-decode-interval: 16
        enable-decoder-swa-bounded-replay: true
        # The default 4*max-running-requests retained too few SWA prefix tails:
        # C16 exhausted its 94,976-slot SWA pool while the full pool had room.
        swa-prefix-tails: 1024
        # DSpark is the checkpoint's bundled draft; the block size is its only knob.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        # A verify step above the captured batch runs eagerly and allocates its
        # attention workspace, which OOMed the eval at 128 running requests
        # (run 35306704553), so admission never exceeds the graph batch.
        cuda-graph-max-bs-decode: 64
        reasoning-parser: auto
        tool-call-parser: auto
        # Draft passes under long-context load outlast the 1800 s default watchdog.
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # AgentX measures thinking on, the regime of the golden acceptance curve.
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV41_REASONING_EFFORT: high
        # Move the fp8 Engram tables to row-sharded host memory, freeing ~23 GiB
        # of HBM per GPU. With them on GPU, c128 died at startup (run 35304458924).
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. Admission is 2x CONC, capped at the decode graph batch;
# saturation points carry a larger in-flight working set than the 30-minute
# warmup drain allows.
override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-running-requests: 2
  benchmark:
    env:
      CONC: '1'
      AGENTIC_WARMUP_GRACE_PERIOD: '1800'

