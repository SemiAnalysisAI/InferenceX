base:
  schema: 2
  name: dsv41flash-b200-4gpu-8k256
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: lmsysorg/sglang:nightly-dev-cu13-20260922-582389ce@sha256:0e1b14e302619a42ef5581b87db6804651d4f946301cf543d74a3a1eb1c33b40
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        prefill-decode-interval: 16
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 7
        cuda-graph-max-bs-decode: 1
        reasoning-parser: auto
        tool-call-parser: auto
        watchdog-timeout: 3600
        enable-metrics: true
        tensor-parallel-size: 4
        expert-parallel-size: 4
        data-parallel-size: 1
        moe-runner-backend: flashinfer_mxfp4
        disable-shared-experts-fusion: true
        speculative-num-draft-tokens: 8
        chunked-prefill-size: 8192
        context-length: 16384
        max-running-requests: 1
        mem-fraction-static: 0.8
        swa-prefix-tails: 128
        stream-interval: 1
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV41_REASONING_EFFORT: high
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
      gpus: 4
  benchmark:
    type: custom
    command: python3 /infmax-workspace/research/dsv41/experiment.py --mode both --output
      /logs/research --gpu-count 4
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      ISL: '8192'
      OSL: '256'
      RANDOM_RANGE_RATIO: '1.0'
      USE_CHAT_TEMPLATE: 'true'
      CONC: '1'
override_tp4_c1: {}
