override_dep4_c48:
  frontend:
    type: sglang-router
    args:
      connect-timeout-secs: 900
      disable-health-check: true
      disable-retries: true
      dp-aware: true
      policy: cache_aware
      request-id-headers: x-correlation-id
      request-timeout-secs: 14400
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        data-parallel-size: 4
        expert-parallel-size: 4
        enable-dp-attention: true
        enable-dp-lm-head: true
        enable-dp-attention-local-control-broadcast: true
        load-balance-method: total_requests
        tokenizer-backend: huggingface
        tokenizer-worker-num: 1
        chunked-prefill-size: 65536
        cuda-graph-backend-prefill: disabled
        dsv4-attn-backend: trtllm
        enable-hierarchical-cache: true
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        hicache-ratio: 2
        hicache-write-policy: write_back
        kv-cache-dtype: fp8_e4m3
        max-running-requests: 256
        mem-fraction-static: 0.76
        moe-a2a-backend: megamoe
        moe-runner-backend: flashinfer_mxfp4
        prefill-decode-interval: 128
        schedule-policy: shortest-prefill-first
        swa-prefix-tails: 3072
      env:
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '16384'
        SGLANG_OPT_DSV41_MEGA_MHC_PREFILL: '0'
  benchmark:
    env:
      CONC: '48'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'
      AIPERF_HTTP_X_SMG_ROUTING_KEY_FROM_CORRELATION_ID: 'true'
      KV_OFFLOADING: dram

