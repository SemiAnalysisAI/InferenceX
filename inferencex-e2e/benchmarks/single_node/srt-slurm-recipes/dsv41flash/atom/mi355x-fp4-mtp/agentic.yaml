override_tp2_c64_dtp:
  roles:
    agg:
      gpus: 2
      args:
        # TBO stays off: it does not support SWA bounded replay.
        enable-dp-attention: true
        # ATOM_DP_LB_REQ_EQUIV weights in-flight requests under least_tokens.
        dp-load-balance: least_tokens
      env: &dp_env
        GPU_MAX_HW_QUEUES: '5'
        ATOM_DP_SESSION_AFFINITY: '1'
        ATOM_DP_LB_REQ_EQUIV: '512'
        ATOM_ENABLE_PREFILL_DELAYER: '1'
        ATOM_PREFILL_DECODE_INTERVAL: '10'
  benchmark:
    env:
      CONC: '64'
      # Session affinity keys on the AIPerf session id.
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: '1'

override_tp2_c128_dep:
  roles:
