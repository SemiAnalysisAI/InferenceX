base:
  schema: 2
  name: dsv41flash-fp4-mi325x-vllm-agentic
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        # The upstream recipe's name resolves to the Triton MXFP4 W4A16 kernel
        # on gfx942.
        moe-backend: aiter
        gpu-memory-utilization: 0.9
        # Five-token DSpark with probabilistic drafting. Throughput runs replace
        # block rejection with the golden acceptance length. Adaptive
        # verification stays off: with --monokernel on gfx942 its CUDA graph
        # profile faults at startup until vllm-project/vllm#63816.
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        max-model-len: 1048576
        # Upstream picks 1024 on GPUs with >= 160 GiB, and 2x CONC starves
        # subagent fan-out at low CONC. Graph capture covers 128 x (1 + 5 drafts).
        max-num-seqs: 128
        max-cudagraph-capture-size: 1024
        # The sparse-attention indexer allocates a [batched-tokens, 1M] fp8
        # logits buffer at startup.
        max-num-batched-tokens: 16384
        # Piecewise capture segfaulted on gfx942; capture only full decode
        # graphs and run prefill eagerly.
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        disable-uvicorn-access-log: true
      env:
        VLLM_ROCM_USE_AITER: '1'
        VLLM_ROCM_USE_AITER_MOE: '1'
        AITER_TRITON_LOG_LEVEL: ERROR
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
        OMP_NUM_THREADS: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        PYTHONUNBUFFERED: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. TP2 leaves ~145 GiB of offloaded weights per rank, so it
# halves the indexer buffer, bounds the scheduler at 2x CONC within [16, 256]
# and stops capturing above 512 tokens.
override_tp8_c1:
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 8
        engram-config: '{"cpu_offload":false}'
  benchmark:
    env:
      CONC: '1'

override_tp8_c2:
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 8
        engram-config: '{"cpu_offload":false}'
  benchmark:
    env:
      CONC: '2'

