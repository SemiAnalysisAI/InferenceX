override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        engram-config: '{"cpu_offload":true}'
        # The gfx942 mono decode kernels build for TP4 only (vllm-project/vllm#60731).
        monokernel: true
  benchmark:
    env:
      CONC: '1'

override_tp4_c2:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        engram-config: '{"cpu_offload":true}'
        monokernel: true
  benchmark:
    env:
      CONC: '2'

override_tp4_c4:
