base:
  schema: 2
  name: dsv41flash-fp4-b200-vllm-sharded-c2560
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: vllm/vllm-openai:nightly-ddd6fbca148a867aad1fcab7ec72f582b9977db4
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        engram-config: '{"cpu_offload": true, "dp_shared_memory": true}'
        attention-config: '{"backend": "FLASHMLA_MEGA_ATTN_DSV41", "indexer_kv_dtype":
          "mxfp4", "indexer_sparse_logits": true}'
        kv-cache-dtype: nvfp4_ds_mla
        speculative-config: '{"method": "dspark", "num_speculative_tokens": 5, "draft_sample_method":
          "probabilistic", "rejection_sample_method": "block", "enable_adaptive_verification":
          false}'
        max-model-len: 135424
        disable-uvicorn-access-log: true
        tensor-parallel-size: 1
        enable-expert-parallel: true
        max-num-batched-tokens: 3200
        max-num-scheduled-tokens: 1920
        max-num-seqs: 320
        max-cudagraph-capture-size: 1920
        gpu-memory-utilization: 0.95
        enable-prefix-caching: true
        data-parallel-size: 8
        all2all-backend: allgather_reducescatter
        api-server-count: 8
        enable-scale-out: true
      env:
        VLLM_USE_RUST_FRONTEND: '0'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_MOE_ROUTING_SIMULATION_STRATEGY: uniform_random
        VLLM_SERVER_DEV_MODE: '1'
      gpus: 8
  benchmark:
    type: custom
    command: python3 /infmax-workspace/research/dsv41/vllm_cohort_sweep.py --probe
      --output /logs --gpu-count 8 --dp-size 8 --profile-steps 0 --concurrencies 2560
      --admission-settle-seconds 5 --admission-timeout-seconds 600 --warmup-output-tokens
      64
    env:
      VLLM_COHORT_TOKEN_API: '1'
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      ISL: '131072'
      OSL: '4096'
      CONC: '2560'
      CONC_LIST: '2560'
      RANDOM_RANGE_RATIO: '1.0'
      USE_CHAT_TEMPLATE: 'true'
      VLLM_COHORT_SHARDED_CLIENT: '1'
override_tp8_c2560: {}
