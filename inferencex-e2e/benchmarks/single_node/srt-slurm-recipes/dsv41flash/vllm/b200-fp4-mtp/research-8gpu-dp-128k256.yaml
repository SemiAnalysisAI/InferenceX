base:
  schema: 2
  name: dsv41flash-b200-vllm-8gpu-dp-128k256
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: vllm/vllm-openai:nightly-ddd6fbca148a867aad1fcab7ec72f582b9977db4
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        engram-config: '{"cpu_offload": true, "dp_shared_memory": true}'
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        kv-cache-dtype: fp8
        speculative-config: '{"method": "dspark", "num_speculative_tokens": 5, "draft_sample_method":
          "probabilistic", "rejection_sample_method": "block", "enable_adaptive_verification":
          false}'
        max-model-len: 132352
        disable-uvicorn-access-log: true
        tensor-parallel-size: 1
        enable-expert-parallel: true
        max-num-batched-tokens: 8192
        max-num-seqs: 48
        max-cudagraph-capture-size: 512
        gpu-memory-utilization: 0.85
        enable-prefix-caching: true
        profiler-config: '{"profiler": "torch", "torch_profiler_dir": "/logs/research/vllm-cohort-profiles",
          "torch_profiler_with_stack": false, "torch_profiler_record_shapes": true,
          "ignore_frontend": true, "max_iterations": 8, "detailed_trace_annotation":
          true}'
        data-parallel-size: 8
        all2all-backend: allgather_reducescatter
      env:
        VLLM_USE_RUST_FRONTEND: '0'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_MOE_ROUTING_SIMULATION_STRATEGY: uniform_random
      gpus: 8
  benchmark:
    type: custom
    command: python3 /infmax-workspace/research/dsv41/vllm_cohort.py --output /logs
      --profile-steps 8 --gpu-count 8 --dp-size 8 --result-layout single
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      ISL: '131072'
      OSL: '256'
      CONC: '384'
      CONC_LIST: '384'
      RANDOM_RANGE_RATIO: '1.0'
      USE_CHAT_TEMPLATE: 'true'
override_tp8_c384:
  roles:
    agg:
      args:
        max-num-seqs: 48
        max-cudagraph-capture-size: 512
  benchmark:
    env:
      CONC: '384'
      CONC_LIST: '384'
override_tp8_c1536:
  roles:
    agg:
      args:
        max-num-seqs: 192
        max-cudagraph-capture-size: 2048
  benchmark:
    env:
      CONC: '1536'
      CONC_LIST: '1536'
override_tp8_c2560:
  roles:
    agg:
      args:
        max-num-seqs: 320
        max-cudagraph-capture-size: 2048
  benchmark:
    env:
      CONC: '2560'
      CONC_LIST: '2560'
