# DeepSeek-V4.1-Flash AgentX on GB300 with vLLM native DSpark
# (https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash). Engram weights use
# UVA DRAM; the KV cache is GPU-resident.
base:
  schema: 2
  name: dsv41flash-fp4-gb300-vllm-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: vllm/vllm-openai:nightly-dev-arm64-cu130-52cb02dee06e
    precision: fp4
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Cold loads of the shared-cache checkpoint run past half an hour.
  health_check:
    interval_seconds: 5
    max_attempts: 1440
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        engram-config: '{"cpu_offload":true}'
        # Avoid invalid MXFP8 split-K tactics during DSpark autotune warmup.
        kernel-config: '{"enable_flashinfer_autotune":false}'
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        kv-cache-dtype: fp8
        # Five-token DSpark with probabilistic drafting. Throughput runs replace
        # block rejection with the golden acceptance length.
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        max-model-len: 1048576
        max-num-batched-tokens: 8192
        disable-uvicorn-access-log: true
      env:
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# TP4 probes low concurrency with vLLM's default graph capture sizes.
# Native zip expansion creates one variant per concurrency.
zip_override_tp4:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-num-seqs: [1, 2, 4, 8]
  benchmark:
    env:
      CONC: ['1', '2', '4', '8']

# TP2 keeps its prefill/graph limits and admits CONC sequences per engine.
override_tp2_c4:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-cudagraph-capture-size: 64
        max-num-seqs: 4
  benchmark:
    env:
      CONC: '4'

override_tp2_c8:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-cudagraph-capture-size: 64
        max-num-seqs: 8
  benchmark:
    env:
      CONC: '8'

override_tp2_c16:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-cudagraph-capture-size: 128
        max-num-seqs: 16
  benchmark:
    env:
      CONC: '16'

override_tp2_c32:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-cudagraph-capture-size: 256
        max-num-seqs: 32
  benchmark:
    env:
      CONC: '32'

override_tp2_c64:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        max-cudagraph-capture-size: 512
        max-num-seqs: 64
  benchmark:
    env:
      CONC: '64'

# TEP2 keeps TP2's attention, prefill/graph limits and sequence caps, but shards
# experts across the same two GPUs for a direct TP2 versus TEP2 comparison.
zip_override_tep2:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        data-parallel-size: 1
        enable-expert-parallel: true
        max-cudagraph-capture-size: [64, 128, 256, 512]
        max-num-seqs: [8, 16, 32, 64]
  benchmark:
    env:
      CONC: ['8', '16', '32', '64']

# DEP4 runs TP1 x DP4 with EP4 on four GPUs. MegaAttention uses NVFP4
# compressed KV and MXFP8 SWA for kv-cache-dtype fp8. Keep fixed verification
# for the measured golden curve; adaptive verification is a separate experiment.
# Each DP rank admits 2 x CONC sequences; CONC is deployment-wide.
zip_override_dep4:
  frontend:
    type: vllm-router
    args:
      policy: consistent_hash
      prometheus-host: 127.0.0.1
      prometheus-port: 18000
      request-timeout-secs: 14400
      disable-retries: true
  setup_script: vllm-router-0.1.14.sh
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 1
        data-parallel-size: 4
        max-num-seqs: [32, 64, 96, 128, 192, 256]
        enable-expert-parallel: true
        kernel-config: '{"enable_flashinfer_autotune":false,"moe_backend":"deep_gemm_mega_moe"}'
        attention-config: '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        engram-config: '{"cpu_offload":true,"embedding_across_dp":true}'
  benchmark:
    env:
      CONC: ['16', '32', '48', '64', '96', '128']
