# DeepSeek-V4.1-Flash AgentX on GB300 with vLLM native DSpark
# (https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash). Engram weights use
# UVA DRAM; the KV cache is GPU-resident.
base:
  schema: 2
  name: dsv41flash-fp4-gb300-vllm-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: vllm/vllm-openai:nightly-36768d1bfd39094681cdbc8cb37d4b31c0729c89
    precision: fp4
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Cold loads of the shared-cache checkpoint run past half an hour.
  health_check:
    interval_seconds: 5
    max_attempts: 1440
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        engram-config: '{"cpu_offload":true}'
        # Avoid invalid MXFP8 split-K tactics during DSpark autotune warmup.
        kernel-config: '{"enable_flashinfer_autotune":false}'
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        kv-cache-dtype: fp8
        # Five-token DSpark with probabilistic drafting. Throughput runs replace
        # block rejection with the golden acceptance length.
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        max-model-len: 1048576
        # Piecewise graph capture sizes are multiples of the six-token DSpark
        # verification block, denser for small batches. Each batched-token
        # limit matches the largest captured graph.
        compilation-config: '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
        max-cudagraph-capture-size: 8190
        max-num-batched-tokens: 8192
        disable-uvicorn-access-log: true
      env:
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# TP4 covers low concurrency. CONC <= 4 captures graphs up to 2046 tokens with a
# 2048-token batch budget; higher points keep the base 8190/8192 tier. Engram
# tables use transparent huge pages. AgentX subagents keep up to 3 x CONC
# requests in flight at CONC 1 and under CONC at higher points, so each engine
# admits 2 x CONC sequences, at least 8. Native zip expansion creates one
# variant per concurrency.
zip_override_tp4:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        engram-config: '{"cpu_offload":true,"use_thp":true}'
        max-num-seqs: [8, 8, 16, 32]
        compilation-config:
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
        max-cudagraph-capture-size: [2046, 2046, 8190, 8190]
        max-num-batched-tokens: [2048, 2048, 8192, 8192]
  benchmark:
    env:
      CONC: ['1', '4', '8', '16']

# TP2 covers the middle range with the same graph tiers, sequence caps and
# huge-page Engram tables.
zip_override_tp2:
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        engram-config: '{"cpu_offload":true,"use_thp":true}'
        max-num-seqs: [8, 8, 16, 32, 64]
        compilation-config:
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
        max-cudagraph-capture-size: [2046, 2046, 8190, 8190, 8190]
        max-num-batched-tokens: [2048, 2048, 8192, 8192, 8192]
  benchmark:
    env:
      CONC: ['2', '4', '8', '16', '32']

# DEP2 runs TP1 x DP2 with EP2 on two GPUs, with MegaAttention/MegaMoE and
# Engram embeddings sharded across DP ranks. The consistent-hash router pins
# each conversation to one DP rank. Each DP rank admits CONC sequences, above
# the deployment-wide in-flight peak; CONC is deployment-wide. CONC 128 stops
# graph capture at 2046 tokens.
zip_override_dep2:
  frontend:
    type: vllm-router
    args:
      policy: consistent_hash
      prometheus-host: 127.0.0.1
      prometheus-port: 18000
      request-timeout-secs: 14400
      disable-retries: true
  setup_script: vllm-router-0.1.14.sh
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 1
        data-parallel-size: 2
        max-num-seqs: [16, 32, 48, 64, 128]
        compilation-config:
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
        max-cudagraph-capture-size: [8190, 8190, 8190, 8190, 2046]
        enable-expert-parallel: true
        kernel-config: '{"enable_flashinfer_autotune":false,"moe_backend":"deep_gemm_mega_moe"}'
        attention-config: '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        engram-config: '{"cpu_offload":true,"embedding_across_dp":true}'
  benchmark:
    env:
      CONC: ['16', '32', '48', '64', '128']
