# c128 and c192 offload the Engram tables even at TP=4: resident leaves
# 116K KV tokens per concurrent request at c128, below the 122K at which
# TP=2 c64 collapsed. Offloaded, c128 measured 388K.
override_tp4_c128:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        engram-config: '{"cpu_offload":true}'
        max-cudagraph-capture-size: 2048
        max-num-batched-tokens: 8192
  benchmark:
    env:
      CONC: '128'

override_tp4_c192:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        engram-config: '{"cpu_offload":true}'
        max-cudagraph-capture-size: 2304
        max-num-batched-tokens: 8192
  benchmark:
    env:
      CONC: '192'

