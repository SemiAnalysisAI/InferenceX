# TP=2 buys KV room at c128 and c192 with a 4096 chunk, which measured 260K KV
# tokens per concurrent request at c128 against 23.6K at the upstream 16384.
# 4096 is below 1024 x 6 slots, so max-num-seqs drops to the 2x CONC the
# benchmark actually admits.
