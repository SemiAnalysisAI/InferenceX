# DeepSeek-V4.1-Flash AgentX on MI355X with vLLM native DSpark
# (https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash). The KV cache is
# GPU-resident.
base:
  schema: 2
  name: dsv41flash-fp4-mi355x-vllm-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    # Repinned to the current ROCm 10.0 nightly, which adds
    # vllm-project/vllm#56720 (one-pass dequantize and a gather-sized grid for
    # the compressed K cache), #57947 (fused QSA pre-indexer on the AMD path),
    # #58560 (compressor ring kept out of the null block) and #59794
    # (AITER 0.1.24.post1, which supplies the a4w4 and quick-reduce kernels)
    # on top of #58671 (paged MXFP4 sparse indexer), #58655 (mHC fused Triton
    # seams) and #53492 (sparse MLA Gluon kernel).
    container: vllm/vllm-openai-rocm:nightly-rocm100-21d93d0d8c0e9627900020382bfce4730e61cab7
    precision: fp4
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        # The plain name selects CK MoE; the environment below enables a4w4.
        # aiter_triton_mxfp4_bf16 would force the W4A16 Triton kernel.
        moe-backend: aiter
        gpu-memory-utilization: 0.9
        # Enables vllm-project/vllm#58671's ROCm paged MXFP4 sparse-logits
        # indexer kernel instead of the dense fp8 indexer path.
        attention-config: '{"indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        # Auto-resolution picks 64 (min across backends); force 128, which
        # the indexer and SparseMLA actually prefer.
        block-size: 128
        # Five-token DSpark with probabilistic drafting. Throughput runs replace
        # block rejection with the golden acceptance length. Adaptive
        # verification trims requests on device, which the ROCm DeepSeek-V4
        # indexer does not support.
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        max-model-len: 1048576
        # The ROCm sparse SWA path lacks the replay window clamp; bounded replay
        # memory-faulted at the first prefix hit with a replay start.
        no-swa-bounded-replay: true
        disable-uvicorn-access-log: true
      env:
        VLLM_ROCM_USE_AITER: '1'
        VLLM_ROCM_USE_AITER_MOE: '1'
        # Native DeepSeek-V4.1 a4w4 support from vllm-project/vllm#58819.
        VLLM_ROCM_USE_AITER_MOE_A4W4_DSV4: '1'
        # INT4-quantized quick all-reduce, as in vllm-project/recipes#1061.
        # Quick reduce only takes tensors at or above its built-in threshold,
        # so prefill chunks and the larger DSpark decode steps use it while
        # the smallest decode steps stay on custom all-reduce.
        VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
        AITER_TRITON_LOG_LEVEL: ERROR
        VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA: 'True'
        # DeepseekV41ForCausalLM is not torch-compiled upstream; breakable
        # graphs keep FULL_AND_PIECEWISE capture working.
        VLLM_USE_BREAKABLE_CUDAGRAPH: '1'
        OMP_NUM_THREADS: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_USE_RUST_FRONTEND: '1'
        PYTHONUNBUFFERED: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      # Full-context corpus for this 1M-context recipe.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point, concurrency 1 through 192 on both TP arms. Engram
# tables move to pinned host memory at TP2 always and at TP4 from c128, where
# resident tables leave too little KV. Graph capture covers 2x CONC x (1 + 5
# drafts), which is what the benchmark admits.
#
# The prefill chunk follows two separate rules. From c32 through c64 it is
# capped at 8192 for decode latency: a chunk scheduled alongside a decode step
# stalls every decoding sequence for the length of that chunk, so the cap
# bounds the stall. c1 through c16 keep 16384, where chunked-prefill steps are
# 0 of 596 engine steps at c1 and 5 of 1183 at c16, against 38 of 111 at c64,
# so the cap would only split one prefill into more chunks and cost TTFT with
# no decode tail to protect. At c128 and c192 the chunk instead buys KV room,
# staying at 8192 on TP4 and dropping to 4096 on TP2. Only those TP2 points
# fall below 1024 x 6 token slots, so only they set max-num-seqs explicitly.
override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        engram-config: '{"cpu_offload":false}'
        max-cudagraph-capture-size: 1024
        max-num-batched-tokens: 16384
  benchmark:
    env:
      CONC: '1'

override_tp4_c2:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        engram-config: '{"cpu_offload":false}'
        max-cudagraph-capture-size: 1024
        max-num-batched-tokens: 16384
  benchmark:
    env:
      CONC: '2'

