override_dep8_c192:
  frontend:
    type: vllm-router
    args:
      policy: consistent_hash
      prometheus-host: 127.0.0.1
      prometheus-port: 18000
      request-timeout-secs: 14400
      disable-retries: true
  setup_script: vllm-router.sh
  roles:
    agg:
      gpus: 8
      args:
        attention-config: '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true,"sparse_mla_prefill_workspace_factor":4}'
        compilation-config: '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
        data-parallel-size: 8
        enable-cumem-allocator: true
        enable-expert-parallel: true
        engram-config: '{"cpu_offload":false,"embedding_across_dp":true}'
        kernel-config: '{"enable_flashinfer_autotune":true,"moe_backend":"deep_gemm_mega_moe","sparse_indexer_topk_backend":"deep_select"}'
        kv-cache-memory-bytes: 17179869184
        long-prefill-token-threshold: 8192
        max-num-batched-tokens: 65536
        max-num-seqs: 128
        numa-bind: true
        tensor-parallel-size: 1
      env:
        NCCL_CUMEM_ENABLE: '1'
        PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'
        VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_SERVER_DEV_MODE: '1'
  benchmark:
    env:
      CONC: '192'
      KV_OFFLOADING: 'none'

