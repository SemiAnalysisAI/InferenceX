base:
  schema: 2
  name: dsv41flash-fp4-b300-vllm-agentic-a2b
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        disable-uvicorn-access-log: true
        enable-auto-tool-choice: true
        gpu-memory-utilization: 0.93
        kv-cache-dtype: fp8
        language-model-only: true
        max-cudagraph-capture-size: 8190
        max-model-len: 1048576
        prefill-schedule-interval: 96
        reasoning-parser: deepseek_v41
        # Five-token DSpark with probabilistic drafting. Throughput runs replace
        # block rejection with the golden acceptance length.
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
      env:
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

override_tp4_c16:
  roles:
    agg:
      gpus: 4
      args:
        additional-config: '{"decode_backend":"latency_specialized"}'
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        compilation-config: '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
        engram-config: '{"cpu_offload":true,"use_thp":false}'
        kernel-config: '{"enable_flashinfer_autotune":true}'
        max-num-active-seqs: 3
        max-num-batched-tokens: 8192
        max-num-seqs: 64
        tensor-parallel-size: 4
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: 'none'

override_tp4_c32:
  roles:
    agg:
      gpus: 4
      args:
        additional-config: '{"decode_backend":"latency_specialized"}'
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
