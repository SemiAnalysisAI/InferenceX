base:
  schema: 2
  name: dsv41flash-b300-vllm-4gpu-8k256
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: vllm/vllm-openai:nightly-ddd6fbca148a867aad1fcab7ec72f582b9977db4
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        engram-config: '{"cpu_offload":true}'
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        kv-cache-dtype: fp8
        speculative-config: '{"method": "dspark", "num_speculative_tokens": 7, "draft_sample_method":
          "probabilistic", "rejection_sample_method": "block", "enable_adaptive_verification":
          false}'
        max-model-len: 16384
        max-num-seqs: 16
        disable-uvicorn-access-log: true
        tensor-parallel-size: 4
        enable-expert-parallel: true
        max-num-batched-tokens: 8192
        max-cudagraph-capture-size: 64
        gpu-memory-utilization: 0.85
        no-enable-prefix-caching: true
        profiler-config: '{"profiler": "torch", "torch_profiler_dir": "/logs/research/serving",
          "torch_profiler_with_stack": false, "torch_profiler_record_shapes": true,
          "ignore_frontend": true, "max_iterations": 16, "detailed_trace_annotation":
          true}'
      env:
        VLLM_USE_RUST_FRONTEND: '0'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
      gpus: 4
  benchmark:
    type: custom
    command: python3 /infmax-workspace/research/dsv41/vllm_serving.py --output /logs/research
      --gpu-count 4
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      ISL: '8192'
      OSL: '256'
      CONC: '1'
      RANDOM_RANGE_RATIO: '1.0'
      USE_CHAT_TEMPLATE: 'true'
override_tp4_c1: {}
