base:
  schema: 2
  name: dsv41flash-fp4-b300-vllm-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        kv-cache-dtype: fp8
        # Five-token DSpark with probabilistic drafting. Throughput runs replace
        # block rejection with the golden acceptance length.
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        max-model-len: 1048576
        gpu-memory-utilization: 0.93
        disable-uvicorn-access-log: true
      env:
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# Native zip expansion creates one variant per concurrency.

zip_override_tp4:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        engram-config: '{"cpu_offload":true,"use_thp":true}'
        kernel-config: '{"enable_flashinfer_autotune":true}'
        additional-config: '{"decode_backend":"latency_specialized"}'
        max-num-seqs: [1, 8, 16, 64, 64, 64, 64]
        # Keeps decode batches small; max-num-seqs still sizes the runner and graphs.
        max-num-active-seqs: [null, 1, 2, 3, 4, 6, 8]
        prefill-schedule-interval: [1, 16, 96, 96, 96, 96, 64]
        max-num-batched-tokens: [4096, 4096, 8192, 8192, 8192, 8192, 8192]
        compilation-config:
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
        max-cudagraph-capture-size: [4092, 4092, 8190, 8190, 8190, 8190, 8190]
  benchmark:
    env:
      CONC: ['1', '4', '10', '16', '24', '32', '48']

zip_override_dep8:
  frontend:
    type: vllm-router
    args:
      policy: consistent_hash
      prometheus-host: 127.0.0.1
      prometheus-port: 18000
      request-timeout-secs: 14400
      disable-retries: true
  setup_script: vllm-router.sh
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 1
        data-parallel-size: 8
        enable-expert-parallel: true
        enable-cumem-allocator: true
        enable-ep-weight-filter: true
        attention-config: '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true,"sparse_mla_prefill_workspace_factor":4}'
        engram-config: '{"cpu_offload":false,"embedding_across_dp":true}'
        kernel-config: '{"enable_flashinfer_autotune":true,"moe_backend":"deep_gemm_mega_moe","sparse_indexer_topk_backend":"deep_select"}'
        max-num-seqs: [128, 128, 128, 128, 128, 160, 192]
        prefill-schedule-interval: 96
        max-num-batched-tokens: 65536
        # gpu-memory-utilization sizing reserves this prefill budget's activation peak and leaves too little KV.
        kv-cache-memory-bytes: [17179869184, 17179869184, 34359738368, 85899345920, 68719476736, 103079215104, 120259084288]
        # A cold long prompt on one DP rank would otherwise stall the other ranks' decode for a full budget step.
        long-prefill-token-threshold: 8192
        compilation-config: '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
        max-cudagraph-capture-size: 8190
        # vLLM's automatic mode starts unbound on these hosts, and unbound host threads slow decode at high concurrency.
        numa-bind: true
      env:
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
        NCCL_CUMEM_ENABLE: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  benchmark:
    env:
      CONC: ['224', '256', '384', '544', '768', '1024', '1280']
