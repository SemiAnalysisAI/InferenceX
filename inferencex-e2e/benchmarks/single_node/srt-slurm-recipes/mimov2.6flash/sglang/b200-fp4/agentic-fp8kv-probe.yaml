# Probe: can trtllm_mha serve MiMoV2 with an fp8 KV cache at page size 64?
base:
  schema: 2
  name: mimov2.6flash-fp4-b200-sglang-agentic-fp8kv-probe
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  setup_script: mimov2.6flash-dflash-draft.sh
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: XiaomiMiMo/MiMo-V2.6-Flash-RL
        revision: f657ba2f7d24c9adc5730675baaa2d34de878a49
        trust-remote-code: true
        tensor-parallel-size: 4
        data-parallel-size: 1
        expert-parallel-size: 1
        attention-backend: trtllm_mha
        page-size: 64
        kv-cache-dtype: fp8_e4m3
        moe-runner-backend: flashinfer_mxfp4
        chunked-prefill-size: 16384
        mem-fraction-static: 0.85
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        reasoning-parser: mimo
        tool-call-parser: mimo
        watchdog-timeout: 3600
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  benchmark:
    env:
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_tp4_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 4
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none
