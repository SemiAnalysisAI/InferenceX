# Probe: fp8 KV through Triton DiffKV on vLLM v0.33.0, at the BF16 TP4 c256 point.
base:
  schema: 2
  name: mimov2.6flash-fp4-b200-vllm-agentic-dflash-fp8kv-probe
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Stages the pinned snapshot so the dflash/ draft path below exists.
  setup_script: mimov2.6flash-dflash-draft.sh
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: XiaomiMiMo/MiMo-V2.6-Flash-RL
        # Pinned so the target and the draft path come from the same snapshot.
        revision: f657ba2f7d24c9adc5730675baaa2d34de878a49
        trust-remote-code: true
        # Forced: the auto-picked FLASH_ATTN_DIFFKV raises on fp8 KV for 192/128 heads.
        attention-backend: TRITON_ATTN_DIFFKV
        kv-cache-dtype: fp8
        gpu-memory-utilization: 0.95
        # Largest context the KV pool holds; the uncapped AgentX corpus needs it.
        max-model-len: auto
        max-num-batched-tokens: 16384
        # vLLM's DFlash recipe for this checkpoint captures decode graphs only.
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        reasoning-parser: mimo
        tool-call-parser: mimo
        enable-auto-tool-choice: true
        stream-interval: 20
        disable-uvicorn-access-log: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

override_tp4_c256_dram:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        max-num-seqs: 512
        max-cudagraph-capture-size: 1024
        speculative-config: '{"method":"dflash","model":"/mnt/hf_hub_cache/models--XiaomiMiMo--MiMo-V2.6-Flash-RL/snapshots/f657ba2f7d24c9adc5730675baaa2d34de878a49/dflash","num_speculative_tokens":3}'
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":858000000000,"lazy_offload":true}}'
      env:
        VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
  benchmark:
    env:
      CONC: '256'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '858'
