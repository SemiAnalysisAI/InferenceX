base:
  schema: 2
  name: mimov2.6flash-fp4-b200-vllm-agentic
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: XiaomiMiMo/MiMo-V2.6-Flash-RL
        trust-remote-code: true
        gpu-memory-utilization: 0.95
        # Largest context the KV pool holds; the uncapped AgentX corpus needs it.
        max-model-len: auto
        max-num-batched-tokens: 16384
        reasoning-parser: mimo
        tool-call-parser: mimo
        enable-auto-tool-choice: true
        stream-interval: 20
        disable-uvicorn-access-log: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. Admission is 2x CONC for subagent fan-out and decode
# CUDA graphs cover CONC. TP8 replicates each of the four KV heads across two ranks.

override_tp8_c1:
  roles:
    agg:
      gpus: 8
      args:
        tensor-parallel-size: 8
        max-num-seqs: 2
        max-cudagraph-capture-size: 1
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

