base:
  schema: 2
  name: mimov2.6flash-fp4-b200-vllm-agentic-kvx
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: XiaomiMiMo/MiMo-V2.6-Flash-RL
        revision: f657ba2f7d24c9adc5730675baaa2d34de878a49
        trust-remote-code: true
        tensor-parallel-size: 4
        # No kv-cache-dtype: vLLM v0.31.0's DiffKV backends reject fp8 for MiMoV2's
        # 192/128 K/V head dims.
        gpu-memory-utilization: 0.95
        max-model-len: auto
        max-num-batched-tokens: 16384
        reasoning-parser: mimo
        tool-call-parser: mimo
        enable-auto-tool-choice: true
        stream-interval: 20
        disable-uvicorn-access-log: true
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":858000000000,"lazy_offload":true}}'
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
        VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

override_tp4_c32:
  roles:
    agg:
      args:
        max-num-seqs: 64
        max-cudagraph-capture-size: 32
  benchmark:
    env:
      CONC: '32'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '858'

override_tp4_c64:
  roles:
    agg:
      args:
        max-num-seqs: 128
        max-cudagraph-capture-size: 64
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '858'

override_tp4_c128:
  roles:
    agg:
      args:
        max-num-seqs: 256
        max-cudagraph-capture-size: 128
  benchmark:
    env:
      CONC: '128'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '858'

override_tp4_c256:
  roles:
    agg:
      args:
        max-num-seqs: 512
        max-cudagraph-capture-size: 256
  benchmark:
    env:
      CONC: '256'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '858'
