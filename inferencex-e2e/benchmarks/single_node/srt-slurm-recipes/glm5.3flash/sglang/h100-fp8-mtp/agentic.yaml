base:
  schema: 2
  name: glm5.3flash-fp8-h100-sglang-agentic-mtp
  identity:
    model:
      revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
  resources:
    gpu_type: h100
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: zai-org/GLM-5.3-Flash
        revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
        tokenizer-path: /mnt/hf_hub_cache/models--zai-org--GLM-5.3-Flash/snapshots/46a050bec13002ad29ee795c16e61cf4fa3c4a9c
        tensor-parallel-size: 8
        expert-parallel-size: 8
        mem-fraction-static: 0.70
        dsa-prefill-backend: tilelang
        dsa-decode-backend: tilelang
        kv-cache-dtype: bfloat16
        moe-runner-backend: deep_gemm
        speculative-algorithm: EAGLE
        speculative-num-steps: 5
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 6
        reasoning-parser: auto
        tool-call-parser: auto
        # v0.5.22's default prefill CUDA graph faults on H100 long-context replay (illegal address).
        cuda-graph-backend-prefill: disabled
        watchdog-timeout: 1800
        enable-cache-report: true
        enable-metrics: true
      env:
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
  health_check:
    max_attempts: 720
    interval_seconds: 10
  benchmark:
    env:
      HF_HUB_OFFLINE: ''
      TRANSFORMERS_OFFLINE: ''
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

zip_override_none:
  roles:
    agg:
      args:
        max-running-requests: [2, 4]
        cuda-graph-max-bs-decode: [2, 4]
  benchmark:
    env:
      CONC: ['1', '2']
      KV_OFFLOADING: none

zip_override_hicache:
  roles:
    agg:
      args:
        max-running-requests: [8, 12, 16, 20, 24, 28, 32, 40, 48]
        cuda-graph-max-bs-decode: [8, 12, 16, 20, 24, 28, 32, 40, 48]
        enable-hierarchical-cache: true
        # Leave room for the separate DSA indexer pool within the node's 90% DRAM budget.
        hicache-size: 220
  benchmark:
    env:
      CONC: ['4', '6', '8', '10', '12', '14', '16', '20', '24']
      KV_OFFLOADING: dram
