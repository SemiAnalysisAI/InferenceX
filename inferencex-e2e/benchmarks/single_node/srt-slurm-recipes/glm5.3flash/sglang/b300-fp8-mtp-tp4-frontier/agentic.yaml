base:
  schema: 2
  name: glm5.3flash-fp8-b300-sglang-agentic-mtp-tp4-frontier
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: zai-org/GLM-5.3-Flash
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 1
        kv-cache-dtype: fp8_e4m3
        dsa-prefill-backend: trtllm
        dsa-decode-backend: trtllm
        moe-runner-backend: flashinfer_trtllm
        reasoning-parser: auto
        tool-call-parser: auto
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        mem-fraction-static: 0.85
        max-running-requests: 96
        cuda-graph-max-bs-decode: 96
        speculative-algorithm: EAGLE
        speculative-num-steps: 5
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 6
        watchdog-timeout: 1800
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        SGLANG_CACHE_DIR: /tmp/sglang-cache
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'

override_off_c8:
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: none

override_off_c16:
  benchmark:
    env:
      CONC: '16'
      KV_OFFLOADING: none

override_off_c48:
  benchmark:
    env:
      CONC: '48'
      KV_OFFLOADING: none

override_off_c64:
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: none

override_off_c80:
  benchmark:
    env:
      CONC: '80'
      KV_OFFLOADING: none

override_off_c96:
  benchmark:
    env:
      CONC: '96'
      KV_OFFLOADING: none

override_on_c48:
  roles:
    agg:
      args:
        enable-hierarchical-cache: true
        hicache-host-memory-fraction: 0.65
        hicache-write-policy: write_through
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
  benchmark:
    env:
      CONC: '48'
      KV_OFFLOADING: dram

override_on_c64:
  roles:
    agg:
      args:
        enable-hierarchical-cache: true
        hicache-host-memory-fraction: 0.65
        hicache-write-policy: write_through
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: dram

override_on_c80:
