base:
  schema: 2
  name: glm5.3flash-fp4-gb200-sglang-agentic
  identity:
    model:
      revision: 1d00738646cbb0c6d0a9eb403dac5f366f1473a7
    container: {}
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: nvidia/GLM-5.3-Flash-NVFP4
        revision: 1d00738646cbb0c6d0a9eb403dac5f366f1473a7
        speculative-draft-model-revision: 1d00738646cbb0c6d0a9eb403dac5f366f1473a7
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 1
        quantization: modelopt_fp4
        context-length: 1048576
        dsa-prefill-backend: trtllm
        dsa-decode-backend: trtllm
        kv-cache-dtype: fp8_e4m3
        moe-runner-backend: flashinfer_trtllm
        speculative-algorithm: EAGLE
        speculative-num-steps: 5
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 6
        reasoning-parser: auto
        tool-call-parser: auto
        mem-fraction-static: 0.85
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        watchdog-timeout: 1800
        enable-cache-report: true
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
        SGLANG_GLM_NEXTN_MOE_PTPC: '0'
  benchmark:
    env:
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      KV_OFFLOADING: none

override_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
  benchmark:
    env:
      CONC: '1'

override_c2:
  roles:
    agg:
      args:
        max-running-requests: 4
        cuda-graph-max-bs-decode: 4
  benchmark:
    env:
      CONC: '2'

override_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
  benchmark:
    env:
      CONC: '4'

override_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
  benchmark:
    env:
      CONC: '8'

override_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
  benchmark:
    env:
      CONC: '16'

override_c32:
  roles:
    agg:
      args:
        max-running-requests: 64
        cuda-graph-max-bs-decode: 64
  benchmark:
    env:
      CONC: '32'

override_c64:
