base:
  schema: 2
  name: musespark-fp4-gb200-sglang-agentic
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 4
        quantization: modelopt_fp4
        moe-runner-backend: flashinfer_trtllm
        kv-cache-dtype: fp8_e4m3
        enable-layernorm-sp: true
        enable-megamoe-for-layernorm-sp: true
        # 133 GB of weights per GPU leave the KV pool what prefill graphs would take.
        mem-fraction-static: 0.88
        disable-prefill-cuda-graph: true
        swa-full-tokens-ratio: 0.1
        # DFlash2 verifies 8 tokens per step: the current token plus 7 drafts.
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: fa4
        speculative-num-draft-tokens: 8
        mm-feature-transport: cpu
        enable-hierarchical-cache: true
        hicache-size: 120
        reasoning-parser: muse
        tool-call-parser: muse
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        HF_HUB_OFFLINE: '1'
        SGLANG_FLASHINFER_NVFP4_PER_TOKEN_ACTIVATION: '0'
  # 533 GB of weights load from Lustre before graph capture.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  benchmark:
    env:
      # The gated Hub repo is unreadable to the client; use the staged checkpoint.
      TOKENIZER: /model
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'


override_tp4_c1:
  roles:
    agg:
      args:
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
        mem-fraction-static: 0.95
        disable-prefill-cuda-graph: null
        cuda-graph-backend-prefill: breakable
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        swa-full-tokens-ratio: 0.3
        enable-hierarchical-cache: null
        hicache-size: null
      env:
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '2048'
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: '1'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

