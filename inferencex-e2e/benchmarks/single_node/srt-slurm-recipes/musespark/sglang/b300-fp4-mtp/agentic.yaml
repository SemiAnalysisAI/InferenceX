base:
  schema: 2
  name: musespark-fp4-b300-sglang-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  slurm:
    time_limit: '4:00:00'
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 8
        quantization: modelopt_fp4
        moe-runner-backend: flashinfer_trtllm
        kv-cache-dtype: fp8_e4m3
        attention-backend: trtllm_mha
        page-size: 128
        mem-fraction-static: 0.9
        # c128 admits ~150 agentic requests; DFlash staging breaks past the largest decode graph.
        max-running-requests: 192
        cuda-graph-max-bs-decode: 192
        cuda-graph-backend-prefill: breakable
        swa-full-tokens-ratio: 0.4
        # DFlash2 verifies 8 tokens per step: the current token plus 7 drafts.
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: fa4
        speculative-num-draft-tokens: 8
        speculative-use-block-verification: true
        mm-feature-transport: cpu
        reasoning-parser: muse
        tool-call-parser: muse
        watchdog-timeout: 3600
        enable-metrics: true
        enable-cache-report: true
        tokenizer-worker-num: 4
        enable-http2: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        HF_HUB_OFFLINE: '1'
        OMP_NUM_THREADS: '8'
        TVM_FFI_CUDA_ARCH_LIST: 10.3a
        SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: '1'
        SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND: python
        SGLANG_DFLASH_EAGER_DRAFT_SAMPLER: '1'
  # Cold 533 GB weight loads from shared storage plus graph capture outlast the default.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  benchmark:
    env:
      # The gated Hub repo is unreadable with the job token; tokenize from the staged checkpoint.
      TOKENIZER: /model
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

zip_override_gpu_kv:
  benchmark:
    env:
      CONC: ['1', '2', '4', '8']
      KV_OFFLOADING: none

zip_override_hicache:
  roles:
    agg:
      args:
        enable-layernorm-sp: true
        enable-megamoe-for-layernorm-sp: true
        enable-hierarchical-cache: true
        hicache-size: [120, 216, 216, 216, 216, 216]
      env:
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '8192'
  benchmark:
    env:
      CONC: ['16', '24', '32', '48', '64', '128']
      KV_OFFLOADING: dram
