base:
  schema: 2
  name: musespark-fp4-mi355x-sglang-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: amd/Muse-Spark-Open-816B-A42B-Quark-MXFP4
        attention-backend: aiter
        page-size: 16
        kv-cache-dtype: fp8_e4m3
        mem-fraction-static: 0.85
        max-running-requests: 128
        # DFlash2 verifies 8 tokens per step: the current token plus 7 drafts.
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: triton
        speculative-num-draft-tokens: 8
        reasoning-parser: muse
        tool-call-parser: muse
        watchdog-timeout: 1800
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        SGLANG_USE_AITER: '1'
        SGLANG_USE_AITER_UNIFIED_ATTN: '1'
        MUSE_MOE_BACKEND: flydsl
        # Serve from the pre-seeded shared HF cache with no Hub API calls: every
        # rank's revision lookup otherwise trips the 1000-per-5-min 429 limit
        # when several points start together.
        HF_HUB_OFFLINE: '1'
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_tp4_c8_hicache:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 4
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
        mem-fraction-static: 0.9
        swa-full-tokens-ratio: 0.03
        chunked-prefill-size: 16384
        prefill-decode-interval: 32
        schedule-policy: shortest-prefill-first
        enable-hierarchical-cache: true
        hicache-size: 240
        hicache-write-policy: write_back
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: dram

