        attn-tp-size: 8
        moe-tp-size: 8
        ep-size: 1
        # One persistent launch per decoder layer, serving up to two requests a launch:
        # the running cap is 2 and the other sessions queue.
        decode-monokernel: true
        max-num-seqs: 2
        prefill-decode-interval: 384
