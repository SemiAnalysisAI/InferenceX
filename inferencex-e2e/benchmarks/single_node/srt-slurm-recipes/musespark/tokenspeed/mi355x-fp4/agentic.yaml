base:
  schema: 2
  name: musespark-fp4-mi355x-tokenspeed-agentic-dflash
  identity:
    model:
      revision: c7bc74fd64371315a091bc15f9723882eead0dc1
    container: {}
    frameworks:
      tokenspeed: 0.1.1.post20261117
      tokenspeed-kernel: 0.1.5.post20261117
      tokenspeed-kernel-amd: 0.1.4.post20261117
      tokenspeed-scheduler: 0.1.58
      tokenspeed-engine: 0.1.1.post20261117
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  observability:
    enabled: false
    tachometer:
      enabled: false
  # Weight loading, graph capture and the first kernel compilations.
  health_check:
    max_attempts: 720
    interval_seconds: 10
  frontend:
    type: smg
    enable_multiple_frontends: false
    # srtctl runs SMG directly: these are the gateway settings `ts serve` uses for Muse Spark.
    args:
      reasoning-parser: muse
      tool-call-parser: muse
      parser: symphony
      policy: round_robin
      disable-circuit-breaker: true
      disable-retries: true
      disable-load-monitoring: true
      tokenizer-cache-enable-l0: true
      tokenizer-cache-enable-l1: true
      health-check-timeout-secs: 610
  engine: tokenspeed
  setup_script: tokenspeed-nightly-rocm.sh
  environment:
    TOKENSPEED_WHEEL_URL: https://github.com/lightseekorg/whl/releases/download/tokenspeed-nightly-v0.1.1.post20261117/tokenspeed-0.1.1.post20261117-py3-none-any.whl#sha256=79bbe2fc284d79656a1b6fd2f7b4f01fb105a027075a814ab2e31da8e3d6976f
    TOKENSPEED_KERNEL_WHEEL_URL: https://github.com/lightseekorg/whl/releases/download/tokenspeed-kernel-nightly-v0.1.5.post20261117-rocm72/tokenspeed_kernel-0.1.5.post20261117-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=b0fc80b30f53a6dcb90bf7cfe49d4e69dd2b588842254ef81bf14227a1dad701
    TOKENSPEED_KERNEL_AMD_WHEEL_URL: https://github.com/lightseekorg/whl/releases/download/tokenspeed-kernel-amd-nightly-v0.1.4.post20261117/tokenspeed_kernel_amd-0.1.4.post20261117-py3-none-any.whl#sha256=fc85817b4c34f7bdeb5d3d80d29b9d20a293fff508f1a9c21b11a977df15ad63
    TOKENSPEED_ENGINE_WHEEL_URL: https://github.com/lightseekorg/whl/releases/download/tokenspeed-engine-v0.1.1.post20261117/tokenspeed_engine-0.1.1.post20261117-cp312-abi3-manylinux_2_28_x86_64.whl#sha256=d72fd1649bc5437ee7d3d4e5532a5d9b952e45c6174276bcb111b2a67d722875
    TOKENSPEED_SCHEDULER_VERSION: 0.1.58
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      env:
        PYTHONNOUSERSITE: '1'
        # One HIP queue per graph keeps the two-stream speculative decode graph
        # off the runtime's slow per-node launch path.
        DEBUG_HIP_FORCE_GRAPH_QUEUES: '1'
        DEBUG_HIP_GRAPH_BATCH_SIZE: '1'
        # Serve from the pre-seeded shared HF cache with no Hub API calls.
        HF_HUB_OFFLINE: '1'
      args:
        served-model-name: amd/Muse-Spark-Open-816B-A42B-Quark-MXFP4
        revision: c7bc74fd64371315a091bc15f9723882eead0dc1
        dtype: bfloat16
        quantization: mxfp4
        data-parallel-size: 1
        pipeline-parallel-size: 1
        init-expert-location: trivial
        moe-backend: gluon
        all2all-backend: none
        kv-cache-dtype: fp8_e4m3
        max-model-len: 1048576
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        cudagraph-capture-sizes: [1, 2, 3, 4, 5, 6, 8, 12, 16, 32, 64]
        max-cudagraph-capture-size: 64
        disable-prefill-graph: true
        enable-prefix-caching: true
        gpu-memory-utilization: 0.92
        reasoning-parser: muse
        grammar-backend: xgrammar
        # DFlash2 drafts seven tokens per step; the verify window adds the current token.
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-model-revision: 46c90f412549c472941a68382d91a99e5e6372a0
        speculative-num-steps: 7
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 8
        # Real verification. The connector selects greedy sampling only for synthetic throughput.
        sampling-backend: triton
        enable-speculative-sampling: true
        enable-metrics: true
        metrics-host: 0.0.0.0
  benchmark:
    env:
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'tokenspeed:'

override_tp8_c1:
  roles:
    agg:
      args:
        # Attention TP8; MoE TP8 with EP1 keeps all 256 experts on every GPU.
        attn-tp-size: 8
        moe-tp-size: 8
        ep-size: 1
        # One persistent launch per decoder layer. With one session the running cap is 1.
        decode-monokernel: true
        max-num-seqs: 1
        prefill-decode-interval: 0
        disable-kvstore: true
        kvstore-ratio: 0.0
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

