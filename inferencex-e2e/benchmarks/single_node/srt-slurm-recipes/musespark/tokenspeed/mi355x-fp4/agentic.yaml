        # Attention TP8; MoE TP8 with EP1 keeps all 256 experts on every GPU.
        attn-tp-size: 8
        moe-tp-size: 8
        ep-size: 1
        # Up to eight requests run: steps with one or two take the monokernel, larger
        # steps keep the regular path.
        decode-monokernel: true
        max-num-seqs: 8
        prefill-decode-interval: 256
        disable-kvstore: true
        kvstore-ratio: 0.0
        stream-interval: 20
  benchmark:
