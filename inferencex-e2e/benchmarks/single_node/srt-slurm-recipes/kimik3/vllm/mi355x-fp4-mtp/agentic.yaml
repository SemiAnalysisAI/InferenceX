        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"method":"dspark","attention_backend":"ROCM_AITER_MLA","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        additional-config: '{"kda_prefill_backend":"fused"}'
        quantization-config: '{"targets":{"*in_proj_qkvgfab":"fp8_per_channel"}}'
      env:
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: 'none'

