# Kimi-K3 MXFP4 AgentX on MI355X with vLLM DSpark
# (https://recipes.vllm.ai/moonshotai/Kimi-K3). TP8 only: the 1.56 TB checkpoint
# is ~195 GB per GPU. Every point shards the KV read across all 8 GPUs (dcp8).
# The KV cache is GPU-resident at c1 and c4 and backed by vLLM's
# SimpleCPUOffloadConnector (dram) from the offload c4 point. Three bands, driven
# by kimik3-fp4-mi355x-vllm-agentic-mtp: interactive c1 and c4 (GPU-resident),
# mid c4-c32 and throughput c48-c60 (DRAM offload, DSpark draft with synthetic
# acceptance). The 899 GB DRAM budget splits evenly across the eight ranks.
base:
  schema: 2
  name: kimik3-fp4-mi355x-vllm-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # Weights load for up to VLLM_ENGINE_READY_TIMEOUT_S.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3
        trust-remote-code: true
        moe-backend: auto
        tensor-parallel-size: 8
        gpu-memory-utilization: 0.945
        language-model-only: true
        enable-auto-tool-choice: true
        tool-call-parser: kimi_k3
        reasoning-parser: kimi_k3
        max-model-len: 1048576
        enable-prefix-caching: true
        kv-cache-dtype: fp8
        attention-config: '{"mla_prefill_backend":"ROCM_AITER_FA"}'
        stream-interval: 10
      env:
        # Upstream AMD recipe environment.
        VLLM_ROCM_AITER_MLA_ASM_PADDING: asm
        VLLM_ROCM_USE_AITER: '1'
        SAFETENSORS_FAST_GPU: '1'
        VLLM_ROCM_USE_AITER_MOE_SITUV2: '1'
        AITER_BF16_FP8_MOE_BOUND: '0'
        AITER_FLYDSL_STAGE2_FP8: '1'
        VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
        VLLM_ROCM_QUICK_REDUCE_MIN_SIZE_BYTES_MB: '16'
        # The MI355X nodes report MEC firmware 38, below the 177 that fixes the
        # RCCL memory reclaim issue.
        HSA_NO_SCRATCH_RECLAIM: '1'
        # 2.8 TB of weights off a shared mount takes far longer than the default.
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        PYTHONNOUSERSITE: '1'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1200'
        VLLM_USE_DIRECT_DCP_A2A: '0'
        VLLM_USE_DIRECT_DCP_Q_GATHER: '0'
        VLLM_USE_DIRECT_DCP_KV_GATHER: '0'
        # Route DCP multi-token verify through the AITER ASM round-robin decode.
        VLLM_ROCM_AITER_MLA_DCP_VERIFY: asm
  benchmark:
    env:
      # Long agentic turns against a 1M context are prefill-bound on the server.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. The DSpark draft length descends with concurrency
# (7 at GPU-resident c1 and c4, 5 at offload c4, 4 from c10) and stays at 4 for the throughput
# band; agentic runs replace block rejection with the golden acceptance length
# for that draft length. Graph capture covers every even size up to
# max-num-seqs x (1 + drafts). c1 admits one and c48-c60 admit 2x CONC, which
# never binds. c4-c32 cap admission below the in-flight tail (2 at c4, 6 at c10,
# 10 at c16, 16 at c24, 24 at c32): the slowest decodes run in the largest
# batches, and capping them raises p90 interactivity, while the excess waits
# for a slot (23-41% of arrivals in run 40037005947). Every point
# requests FULL_AND_PIECEWISE; the AMD K3 model has no torch.compile
# submodule, so without breakable graphs vLLM falls back to FULL_DECODE_ONLY.
# The offload points split the 899 GB DRAM budget evenly across the eight ranks;
# identical prefixes must hash to identical block keys on every rank.
# c1 runs vLLM's Kimi-K3 specialized decode (vllm-project/vllm#60683,
# additional-config decode_backend=latency_specialized): pure spec-verify steps of
# at most 8 rows run each MoE layer as FlyDSL MonoKernels; c1 (k=7) verifies 8 rows
# per step. At dcp8 the decode attends with AITER's asm MLA (M1); the fused M1c
# attention is dcp1-only. The kernels need Model Runner V2, no KV connector and BF16 in_proj /
# o_proj / shared-expert weights, so c1 does not quantize online.
# Every point prefills KDA layers with the fused gfx950 chunk kernel
# (additional-config kda_prefill_backend=fused).
override_tp8_c1:
  roles:
    agg:
      args:
        decode-context-parallel-size: 8
        dcp-comm-backend: a2a
        max-num-seqs: 1
        max-num-batched-tokens: 16384
        compilation-config: '{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":16,"custom_ops":["+fused_rms_norm_gated"],"cudagraph_capture_sizes":[2,4,6,8,10,12,14,16]}'
        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"method":"dspark","attention_backend":"ROCM_AITER_MLA","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        additional-config: '{"decode_backend":"latency_specialized","kda_prefill_backend":"fused"}'
      env:
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
        VLLM_USE_V2_MODEL_RUNNER: '1'
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: 'none'

override_tp8_c4:
  roles:
    agg:
      args:
        decode-context-parallel-size: 8
        dcp-comm-backend: a2a
        max-num-seqs: 2
