# Kimi-K3 MXFP4 AgentX on B300 with vLLM: TP8 x DCP8 with TokenspeedMLA and
# Mooncake as the external KV tier. DSpark drafts seven tokens up to CONC 8,
# three at CONC 16 and none above.
base:
  schema: 2
  name: kimik3-fp4-b300-vllm-agentic
  model:
    path: hf:moonshotai/Kimi-K3
    container: vllm/vllm-openai:nightly-dev-x86_64-cu13-3696c77
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # ~1.5 TB of MXFP4 shards may take the full VLLM_ENGINE_READY_TIMEOUT_S.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  # Embedded Mooncake: each TP rank contributes TOTAL_CPU_DRAM_GB / 8 GB. The
  # setup script pins the client, backports load-failure recovery, selects one
  # active Mellanox rail by driver (ibp* or mlx5_*), sets MC_GID_INDEX from the
  # link layer, requires the host mlx5 provider via RDMAV_DRIVERS at
  # /host-usr-lib, and refuses an empty device_name. Master lease is 60s.
  # device_name starts empty; kimik3-b300-mooncake.sh patches it before engines
  # start (srt-slurm's "Wrote mooncake_store_config" line is the pre-patch dump).
  setup_script: kimik3-b300-mooncake.sh
  services:
    - name: mooncake-master
      type: mooncake-master
      preamble: >-
        python3 -m pip install --break-system-packages --quiet --no-cache-dir --no-deps
        --force-reinstall mooncake-transfer-engine-cuda13==0.3.11.post1
      args: ["--eviction_high_watermark_ratio=0.95", "--eviction_ratio=0.10", "--default_kv_lease_ttl=60000"]
      options:
        store_config:
          mode: embedded
          metadata_server: P2PHANDSHAKE
          global_segment_size: 281GB
          local_buffer_size: 4GB
          protocol: rdma
          device_name: ""
          enable_offload: false
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3
        tensor-parallel-size: 8
        decode-context-parallel-size: 8
        dcp-comm-backend: a2a
        max-num-batched-tokens: 16384
        trust-remote-code: true
        language-model-only: true
        enable-auto-tool-choice: true
        tool-call-parser: kimi_k3
        reasoning-parser: kimi_k3
        load-format: fastsafetensors
        moe-backend: auto
        no-enable-flashinfer-autotune: true
        # Keep cuMem/VMM off on this DSXE Mooncake path (LMCache-style caution for
        # VMM buffers). The register_buffer -600 / AddressNotRegistered storm on
        # tip 15820fd2e/1d9c54d was driven by MC_MAX_MR_SIZE=4GiB (removed below),
        # not by cumem alone — pre-MC_MAX_MR tips registered with cumem on.
        enable-prefix-caching: true
        prefix-match-unit: 128
        kv-cache-dtype: fp8
        stream-interval: 10
        attention-backend: TOKENSPEED_MLA
        attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
        disable-uvicorn-access-log: true
        # Do NOT enable compact_group_io on DSXE single-rail Mooncake: tip ee33eeba
        # c8 (run 36838397438) enabled it and immediately stormed TRANSFER_FAIL on
        # compact-group-io-v1 ~25MiB puts (7177 fails), then hung at 0 tok/s until
        # the 1800s sample_tokens cap. Keep max_load_batch_keys=1 after tips
        # 860c1ccf c48 / e51c58f5 c32 DCP PYNCCL _ALLGATHER_BASE hangs under
        # ~98-100% GPU KV. Tip ea88d652 / sweep 36935627690 canary c1 crashed
        # immediately with AssertionError "load_async must be True for better
        # performance" in mooncake store worker get_finished when load_async was
        # false — restore load_async=true (required by this vLLM Mooncake path).
        kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"max_load_batch_keys":1,"enable_offload":false}}'
      env:
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        # Tip 1f837c46 eval-only c8 hung ~8.5m after dcp:0 then failed EP
        # PyNccl ncclCommInitRank with Q_GATHER=0; keep Q gather on. Tip
        # 68cdcc58 c24 (Slurm 6814): with A2A=0 the hang moved to PyNCCL
        # ALLTOALL_BASE in dcp_a2a_lse_reduce (dcp.py:765; last started work:
        # -1) after ~43m serve — direct Q/KV gathers were already active.
        # Enable direct A2A (GB300 DCP8 / B200 stock). load_async must stay true.
        VLLM_USE_DIRECT_DCP_A2A: '1'
        VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
        # Tip bed9f1ce c40 (Slurm 6765): with KV_GATHER=0 the hang is PyNCCL
        # kv_gather _ALLGATHER_BASE (dcp.py:1413; last started work: -1) after
        # ~42m serve / GPU KV ~86-100%, Mooncake failed_keys=0. Re-enable direct
        # KV gather (GB300 DCP8 / B200 Mooncake stock); tip 68cdcc58 confirmed
        # "Using direct symmetric-memory DCP chunked-context KV gather".
        VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_RPC_TIMEOUT: '600000'
        # Mooncake loads can block inside execute_model past the 300s default;
        # c40 on run 36800796192 went silent ~279s then EngineDead at the cap.
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
        VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
        PYTHONNOUSERSITE: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        # Identical prefixes must hash to identical block keys run-to-run.
        PYTHONHASHSEED: '42'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
        MC_STORE_MEMCPY: '1'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_SLICE_SIZE: '1048576'
        # Do NOT set MC_MAX_MR_SIZE on DSXE: tip ee33eeba+ (4GiB) made every rank
        # register_buffer fail (-600) on the ~40GiB KV region, then AddressNotRegistered
        # TRANSFER_FAIL. Pre-MC_MAX_MR tips (c40/c48) registered cleanly without it.
        MC_WORKERS_PER_CTX: '4'
        WITH_NVIDIA_PEERMEM: '0'
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: moonshotai/Kimi-K3
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2249'

# One variant per point. Admission is 2x CONC through CONC 24; CONC 32+ use 1x
# CONC. Tip 031de17bf c56 (Slurm 6848) with A2A/Q/KV all direct, util 0.85, and
# max-num-seqs=112 packed GPU KV to ~99.7% (Running: 1, Waiting: 12, Deferred:
# 12) then hung workers for the full VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=1800 —
# shm_broadcast starvation from 15:28, then TimeoutError: RPC call to
# sample_tokens timed out (no Watchdog / ALLGATHER / ALLTOALL / CUDA OOM; ingest
# nccl_error:16 was init-only ibv_query_port_speed WARN). Tip 861a1512 c32
# (Slurm 6916) repeated the same kill under max-num-seqs=64 (2x): GPU KV pinned
# ~99–100% for tens of minutes, then hung at 0 tok/s (Running: 23, Waiting: 11,
# Deferred: 11) with shm_broadcast starvation from 21:03 through the 1800s
# sample_tokens timeout → EngineDead / ProfileAborted (20 empty streams + 62
# ClientConnectorError after shutdown; ingest nccl_error:16 again init-only).
# Cap CONC 32+ admission so prefix+deferred loads cannot pin the pool before
# decode. CONC 8+ use gpu-memory-utilization 0.85: with
# VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0, tip b70e4260a c48 (Slurm 6737)
# over-allocated GPU KV to 45.2 GiB (vLLM suggested 36.78 GiB once CUDA graphs
# are counted) and OOMed in flashinfer FP4 MoE prepare_moe (~2.89 GiB needed,
# ~2.3 GiB free) ~4m after Application startup. Tip 5ab41690 c8 (Slurm 6877)
# then soft-OOMed at util 0.92 during warmup (CUDACachingAllocator ~3.03 GiB
# alloc with ~1.16 GiB free on ranks 1–7) → empty streamed responses →
# InvalidInferenceResultError / ProfileAborted at 2/11 > 10% (engine stayed
# up; ingest nccl_error:16 again init-only WARN). Keep 0.92 only on c1–c4.
# Graphs capture every size up to max-num-seqs, then the larger powers of two
# to 8192. Throughput runs switch DSpark to synthetic rejection at the golden
# acceptance length; points above CONC 16 do not draft and keep the matrix's
# mtp label.
override_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        gpu-memory-utilization: 0.92
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,64,128,256,512,1024,2048,4096,8192]}'
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"attention_backend":"TOKENSPEED_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: '1'

