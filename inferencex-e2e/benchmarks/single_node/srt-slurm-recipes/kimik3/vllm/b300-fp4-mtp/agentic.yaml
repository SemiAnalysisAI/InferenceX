base:
  schema: 2
  name: kimik3-fp4-b300-vllm-agentic
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # ~1.5 TB of MXFP4 shards may take the full VLLM_ENGINE_READY_TIMEOUT_S.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  # Embedded Mooncake ("GB" is GiB): 8 TP ranks x (256 GiB segment + 4 GiB buffer)
  # = 2233.4 GB stay within TOTAL_CPU_DRAM_GB (2249 GB).
  # The setup script installs the master config's Mooncake and writes the node's
  # first ACTIVE InfiniBand port that mlx5_core drives (ibp* on DSXE, never EFA)
  # into the store config, failing the worker when there is none.
  setup_script: kimik3-b300-mooncake.sh
  # The whole host library directory, for RDMAV_DRIVERS: the host's
  # libibverbs/libmlx5-rdmav<ABI>.so is a relative link to ../libmlx5.so.1.*.
  extra_mount:
    - /usr/lib/x86_64-linux-gnu:/host-usr-lib:ro
  services:
    - name: mooncake-master
      type: mooncake-master
      # The first container import on a node plus the in-container install outlast
      # the default 120 s readiness window.
      readiness:
        port: 8700
        timeout_seconds: 900
      preamble: bash /configs/vllm-mooncake.sh
      args: ["--eviction_high_watermark_ratio=0.95", "--eviction_ratio=0.10"]
      options:
        store_config:
          mode: embedded
          metadata_server: P2PHANDSHAKE
          global_segment_size: 256GB
          local_buffer_size: 4GB
          protocol: rdma
          device_name: ""
          enable_offload: false
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3
        tensor-parallel-size: 8
        decode-context-parallel-size: 8
        dcp-comm-backend: a2a
        max-num-batched-tokens: 16384
        trust-remote-code: true
        language-model-only: true
        enable-auto-tool-choice: true
        tool-call-parser: kimi_k3
        reasoning-parser: kimi_k3
        load-format: fastsafetensors
        moe-backend: auto
        enable-flashinfer-autotune: true
        enable-cumem-allocator: true
        enable-prefix-caching: true
        prefix-match-unit: 128
        kv-cache-dtype: fp8
        # KDA recurrent state only (the DSpark draft is dense MLA). Leave the conv state at
        # SD: FlashInfer's packed KDA spec decode rejects VLLM_SSM_CONV_STATE_LAYOUT=DS on SM10x.
        mamba-ssm-cache-dtype: bfloat16
        stream-interval: 10
        attention-backend: TOKENSPEED_MLA
        attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
        disable-uvicorn-access-log: true
        kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_offload":false}}'
      env:
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        # These default to auto; name them so the measured DCP a2a path runs.
        VLLM_USE_DIRECT_DCP_A2A: '1'
        VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
        VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
        VLLM_RPC_TIMEOUT: '600000'
        # Mooncake loads can block inside execute_model past the 300 s default.
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
        VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
        PYTHONNOUSERSITE: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        # Identical prefixes must hash to identical block keys run-to-run.
        PYTHONHASHSEED: '42'
        # Outlast AIPerf's pooled-connection idle gaps.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
        MC_STORE_MEMCPY: '1'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_SLICE_SIZE: '1048576'
        MC_WORKERS_PER_CTX: '4'
        # The setup script selects only InfiniBand rails, which use GID index 0.
        MC_GID_INDEX: '0'
        # libibverbs appends -rdmav<ABI>.so; on an ABI mismatch it falls back to the image's provider.
        RDMAV_DRIVERS: /host-usr-lib/libibverbs/libmlx5
        WITH_NVIDIA_PEERMEM: '0'
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2249'

# One variant per point. Admission is 2x CONC. Graphs capture (1 + drafts) x
# 1..2x CONC tokens (to 96 at CONC 4, to 252 at CONC 28), then the larger powers
# of two to 8192. Throughput runs switch DSpark to synthetic rejection at the
# golden acceptance length.
override_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        gpu-memory-utilization: 0.92
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,64,128,256,512,1024,2048,4096,8192]}'
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"attention_backend":"TOKENSPEED_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  benchmark:
    env:
      CONC: '1'

