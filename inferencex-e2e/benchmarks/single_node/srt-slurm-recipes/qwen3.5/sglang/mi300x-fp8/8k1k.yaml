base:
  schema: 2
  name: qwen3.5-fp8-mi300x-sglang-8k1k
  resources:
    gpu_type: mi300x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        attention-backend: aiter
        tensor-parallel-size: 8
        data-parallel-size: 1
        trust-remote-code: true
        tokenizer-worker-num: 6
        enable-aiter-allreduce-fusion: true
        cuda-graph-max-bs: 4
        disable-radix-cache: true
        max-prefill-tokens: 32768
        scheduler-recv-interval: 30
        mem-fraction-static: 0.75
        context-length: 9236
        expert-parallel-size: 1
        enable-metrics: false
zip_override_concurrency:
  roles:
    agg:
      args:
        cuda-graph-max-bs: [4, 8, 16, 32, 64]
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64']
