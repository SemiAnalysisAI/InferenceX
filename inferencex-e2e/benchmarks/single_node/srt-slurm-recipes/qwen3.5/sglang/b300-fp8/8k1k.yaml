base:
  schema: 2
  name: qwen3.5-fp8-b300-sglang-8k1k
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        trust-remote-code: true
        tensor-parallel-size: 4
        data-parallel-size: 1
        expert-parallel-size: 1
        enable-symm-mem: true
        disable-radix-cache: true
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: trtllm_mha
        mm-attention-backend: triton_attn
        moe-runner-backend: flashinfer_trtllm
        cuda-graph-max-bs: 4
        max-running-requests: 4
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        tokenizer-path: Qwen/Qwen3.5-397B-A17B-FP8
        context-length: 9236
        enable-metrics: false
      env:
        PYTHONNOUSERSITE: '1'
zip_override_concurrency:
  roles:
    agg:
      args:
        cuda-graph-max-bs: [4, 8, 16, 32, 64, 128, 256]
        max-running-requests: [4, 8, 16, 32, 64, 128, 256]
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
