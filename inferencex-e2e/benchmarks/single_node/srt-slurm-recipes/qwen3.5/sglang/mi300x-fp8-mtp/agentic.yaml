# Qwen3.5 FP8 AgentX on MI300X with SGLang native EAGLE MTP. The KV cache is
# GPU-resident.
base:
  schema: 2
  name: qwen3.5-fp8-mi300x-sglang-agentic
  model:
    path: hf:Qwen/Qwen3.5-397B-A17B-FP8
    container: lmsysorg/sglang-rocm:v0.5.16-rocm720-mi30x-20260730
    precision: fp8
  resources:
    gpu_type: mi300x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  # Loading plus first-request kernel tuning outlasts the 1800 s default:
  # MI300X Qwen3.5 was ready after ~27 minutes (run 36160403972).
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        tokenizer-path: Qwen/Qwen3.5-397B-A17B-FP8
        trust-remote-code: true
        tensor-parallel-size: 8
        data-parallel-size: 1
        attention-backend: aiter
        enable-aiter-allreduce-fusion: true
        mamba-ssm-dtype: bfloat16
        tokenizer-worker-num: 6
        max-prefill-tokens: 32768
        scheduler-recv-interval: 30
        mem-fraction-static: 0.75
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        enable-metrics: true
        enable-cache-report: true
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_ENABLE_SPEC_V2: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: Qwen/Qwen3.5-397B-A17B-FP8
      # 256k-capped corpus: the unfiltered corpus exceeds this model's context.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. AgentX concurrency counts live session trees, so
# admission is 2x CONC; the graph batch is CONC, capped at 64.
override_tp8_ep1_c4:
  roles:
    agg:
      args:
        expert-parallel-size: 1
        cuda-graph-max-bs: 4
        max-running-requests: 8
  benchmark:
    env:
      CONC: '4'

override_tp8_ep1_c16:
  roles:
    agg:
      args:
        expert-parallel-size: 1
        cuda-graph-max-bs: 16
        max-running-requests: 32
  benchmark:
    env:
      CONC: '16'

override_tp8_ep1_c20:
