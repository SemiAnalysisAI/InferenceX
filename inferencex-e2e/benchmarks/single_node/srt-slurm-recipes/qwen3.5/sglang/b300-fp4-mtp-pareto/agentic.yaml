base:
  schema: 2
  name: qwen3.5-fp4-b300-sglang-agentic-pareto
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
        trust-remote-code: true
        data-parallel-size: 1
        enable-symm-mem: true
        quantization: modelopt_fp4
        fp4-gemm-backend: flashinfer_cutlass
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-path: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        speculative-algorithm: NEXTN
        speculative-num-steps: 6
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
        enable-metrics: true
        enable-cache-report: true
        weight-loader-prefetch-checkpoints: true
        weight-loader-prefetch-num-threads: 4
      env:
        TORCH_CUDA_ARCH_LIST: '10.0'
        PYTHONNOUSERSITE: '1'
        NCCL_NVLS_ENABLE: '1'
        SGL_ENABLE_JIT_DEEPGEMM: 'false'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. max-running-requests caps the engine below AgentX admission so the decode batch stays small;
# the CUDA graph batch equals the cap.

override_tp4_ep1_c4_cap1_arf:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        tokenizer-worker-num: 6
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
        cuda-graph-bs-decode:
        - 1
        flashinfer-allreduce-fusion-backend: cutedsl
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none

override_tp4_ep1_c6_cap1_arf:
  roles:
    agg:
      gpus: 4
      args:
