base:
  schema: 2
  name: qwen3.5-fp8-b200-sglang-mtp-8k1k
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        trust-remote-code: true
        tensor-parallel-size: 8
        data-parallel-size: 1
        expert-parallel-size: 1
        enable-symm-mem: true
        disable-radix-cache: true
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        cuda-graph-max-bs-decode: 4
        max-running-requests: 4
        max-prefill-tokens: 32768
        chunked-prefill-size: 32768
        mamba-full-memory-ratio: 0.37
        linear-attn-prefill-backend: flashinfer
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        tokenizer-path: Qwen/Qwen3.5-397B-A17B-FP8
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        context-length: 9236
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        enable-metrics: false
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
        PYTHONNOUSERSITE: '1'
zip_override_tp8_ep1:
  benchmark:
    env:
      CONC: ['4']
zip_override_tp4_ep1:
  roles:
    agg:
      gpus: 4
      args:
        cuda-graph-max-bs-decode: [4, 8, 16, 32, 64, 128, 256]
        max-running-requests: [4, 8, 16, 32, 64, 128, 256]
        scheduler-recv-interval: [10, 30, 30, 30, 30, 30, 30]
        tensor-parallel-size: 4
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
