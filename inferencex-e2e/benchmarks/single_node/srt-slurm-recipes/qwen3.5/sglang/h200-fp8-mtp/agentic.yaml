base:
  schema: 2
  name: qwen3.5-fp8-h200-sglang-agentic
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        trust-remote-code: true
        tensor-parallel-size: 8
        data-parallel-size: 1
        expert-parallel-size: 8
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: flashinfer
        enable-flashinfer-allreduce-fusion: true
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        enable-metrics: true
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_ENABLE_SPEC_V2: '1'

override_gpu_kv:
  benchmark:
    env:
      KV_OFFLOADING: none
# HiCache extends RadixAttention. Hybrid GDN/Mamba allocates one KV and one
# Mamba host pool per rank, 77 GB each (1232 GB across TP8).
override_hicache:
  roles:
    agg:
      args:
        page-size: 64
        enable-hierarchical-cache: true
        hicache-size: 77
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_through_selective
  benchmark:
    env:
      KV_OFFLOADING: dram
# The same HiCache arm with the experts TP-sharded (EP1) on a later nightly.
override_hicache_ep1:
  roles:
    agg:
      args:
        expert-parallel-size: 1
        page-size: 64
        enable-hierarchical-cache: true
        hicache-size: 77
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_through_selective
  benchmark:
    env:
      KV_OFFLOADING: dram
# TP4/EP4 HiCache on half the node: 77 GB per pool, 616 GB across TP4.
override_hicache_tp4_c8:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 4
        mem-fraction-static: 0.92
        page-size: 64
        enable-hierarchical-cache: true
        hicache-size: 77
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_through_selective
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: dram
override_hicache_tp4_c12:
  roles:
    agg:
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 4
        mem-fraction-static: 0.86
        page-size: 64
        enable-hierarchical-cache: true
        hicache-size: 77
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_through_selective
  benchmark:
    env:
      CONC: '12'
      KV_OFFLOADING: dram
# EP1 HiCache arm on the FA3 attention backend, with the EAGLE depth set per concurrency.
override_hicache_ep1_fa3_k5_c4:
  roles:
    agg:
      args:
        expert-parallel-size: 1
        attention-backend: fa3
        speculative-num-steps: 5
        speculative-num-draft-tokens: 6
        page-size: 64
        enable-hierarchical-cache: true
        hicache-size: 77
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_through_selective
  benchmark:
