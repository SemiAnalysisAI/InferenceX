# Qwen3.5-397B-A17B NVFP4 AgentX on B300 with TensorRT-LLM: one aggregated
# TEP8 worker (TP8, MoE EP8) with the checkpoint's native MTP head at draft
# length 6. The AgentX connector sets forced acceptance from the golden curve
# (qwen3.5 MTP, thinking_on, draft 6: AL 4.80), so this recipe does not set it.
#
# Every point uses piecewise CUDA graphs for steps that carry context tokens.
# Two per-concurrency settings sit on top of that base:
#   c4, c8:   TRTLLM-gen MoE and two torch.compile streams
#   c24, c52, c64: TRTLLM-gen MoE and context batching (batch_wait 0.9 / 24)
# Context batching lets several prompts share one context step. At c8 and
# below it adds more first-token wait than it saves end to end.
#
# kv_cache_config.host_cache_size is TRT-LLM's native host KV tier: 128 GiB per
# rank, 1,100 GB per node at TP8. The master config declares it as
# kv-offloading dram with the native backend.
base:
  schema: 2
  name: qwen3.5-fp4-b300-trtllm-agentic
  model:
    path: hf:nvidia/Qwen3.5-397B-A17B-NVFP4
    container: nvcr.io#nvidia/tensorrt-llm/release:1.3.0rc24
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: trtllm_serve
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: trtllm
    served_model_name: nvidia/Qwen3.5-397B-A17B-NVFP4
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        pipeline_parallel_size: 1
        enable_attention_dp: false
        enable_lm_head_tp_in_adp: false
        max_batch_size: 128
        max_num_tokens: 16384
        max_seq_len: 262144
        enable_chunked_prefill: true
        disable_overlap_scheduler: false
        cuda_graph_config:
          enable_padding: true
          batch_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128]
        # Piecewise graphs cover steps with context tokens; decode keeps full graphs.
        torch_compile_config:
          enable_fullgraph: true
          enable_inductor: false
          enable_piecewise_cuda_graph: true
          capture_num_tokens: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
        moe_config:
          backend: CUTEDSL
          use_low_precision_moe_combine: true
        nvfp4_gemm_config:
          allowed_backends: [cutlass, cublaslt, cutedsl, cuda_core]
        kv_cache_config:
          dtype: fp8
          iteration_stats_interval: 20
          free_gpu_memory_fraction: 0.8
          tokens_per_block: 64
          use_kv_cache_manager_v2: true
          enable_block_reuse: true
          block_reuse_config:
            policy: per_conversation
            max_num_turns: 3
          event_buffer_max_size: 0
          host_cache_size: 137438953472
          pool_ratio: [0.8, 0.2]
          mamba_state_config:
            periodic_snapshot_interval: 0
            additional_snapshot_offsets_from_end: [2]
        scheduler_config:
          capacity_scheduler_policy: GUARANTEED_NO_EVICT
        speculative_config:
          decoding_type: MTP
          max_draft_len: 6
        stream_interval: 20
        num_postprocess_workers: 4
        enable_iter_perf_stats: true
        enable_iter_req_stats: false
        print_iter_log: true
        trust_remote_code: true
      env:
        CUDA_SCALE_LAUNCH_QUEUES: 4x
        MIMALLOC_ARENA_RESERVE: '0'
        MIMALLOC_PURGE_DELAY: ''
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TLLM_LOG_LEVEL: INFO
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
  # Piecewise capture to 16384 tokens plus MTP warmup at TP8.
  health_check:
    max_attempts: 540
    interval_seconds: 10
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: nvidia/Qwen3.5-397B-A17B-NVFP4
      # trtllm-serve exposes Prometheus text at /prometheus/metrics.
      AIPERF_SERVER_METRICS_URLS: http://localhost:8000/prometheus/metrics
      # Request-level trtllm_* series come from return_perf_metrics (the
      # trtllm-serve default); per-iteration gauges stay off as measured.
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_
      # trtllm-serve closes idle connections after 5 s (uvicorn keep-alive,
      # fixed in this release); keep the client pool below that so it never
      # reuses a connection the server already closed (ECONNRESET in warmup).
      AIPERF_HTTP_KEEPALIVE_TIMEOUT: '4'
      # Thinking on with Qwen3.5's published sampling, as the golden curve uses.
      AIPERF_EXTRA_INPUTS: '{"chat_template_kwargs":{"enable_thinking":true},"presence_penalty":0,"temperature":0.6,"top_k":20,"top_p":0.95}'
      # 256k-capped corpus, within this model's context.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k

# One variant per point.
# Low concurrency: TRTLLM-gen MoE, and two torch.compile streams.
override_c4:
  roles:
    agg:
      args:
        moe_config:
          backend: TRTLLM
        torch_compile_config:
          max_num_streams: 2
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1100'

override_c8:
  roles:
    agg:
      args:
        moe_config:
          backend: TRTLLM
        torch_compile_config:
          max_num_streams: 2
  benchmark:
    env:
      CONC: '8'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1100'

# Throughput end: TRTLLM-gen MoE and context batching. A context step waits up
# to 24 iterations, or until 90% of max_num_tokens is queued.
override_c24:
  roles:
    agg:
      args:
        moe_config:
          backend: TRTLLM
        batch_wait_max_tokens_ratio: 0.9
        batch_wait_timeout_iters: 24
  benchmark:
    env:
      CONC: '24'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1100'

override_c52:
  roles:
    agg:
      args:
        moe_config:
          backend: TRTLLM
        batch_wait_max_tokens_ratio: 0.9
        batch_wait_timeout_iters: 24
  benchmark:
    env:
      CONC: '52'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1100'

override_c64:
  roles:
    agg:
      args:
        moe_config:
          backend: TRTLLM
        batch_wait_max_tokens_ratio: 0.9
        batch_wait_timeout_iters: 24
  benchmark:
    env:
      CONC: '64'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1100'
