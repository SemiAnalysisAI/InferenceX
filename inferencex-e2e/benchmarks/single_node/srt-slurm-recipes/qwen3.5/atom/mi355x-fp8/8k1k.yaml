base:
  schema: 2
  name: qwen3.5-fp8-mi355x-atom-8k1k
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: atomesh
    container_image: rocm/atom-dev@sha256:f00a9dc588a380038fdad54cd57a956043cb316ddda54ebb1b62a24f8caa343b
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: atom
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 2
      args:
        kv_cache_dtype: fp8
        max-model-len: 10240
        gpu-memory-utilization: 0.9
        trust-remote-code: true
      env:
        OMP_NUM_THREADS: '1'
  benchmark:
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh --trust-remote-code
zip_override_tp2_ep1:
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
zip_override_tp4_ep1:
  roles:
    agg:
      gpus: 4
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
zip_override_tp8_ep1:
  roles:
    agg:
      gpus: 8
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
