base:
  schema: 2
  name: qwen3.5-fp8-mi355x-atom-agentic
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: atomesh
    container_image: rocm/atom-dev@sha256:1bb1909ada9e3d178e315a3f89d041c05c7e90e7cc32de8d507ff5ab4cd4702c
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: atom
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        timeout-keep-alive: 1800
        kv_cache_dtype: fp8
        enable_prefix_caching: true
        max-num-seqs: 1024
        # GDN state checkpoints every 16k prompt tokens, so a shared prefix
        # resumes mid-prompt.
        state-checkpoint-interval-tokens: 16384
        method: mtp
        num-speculative-tokens: 3
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONHASHSEED: '0'
        AITER_LOG_LEVEL: WARNING
        AITER_QUICK_REDUCE_QUANTIZATION: INT4
        ATOM_ENABLE_QK_NORM_ROPE_CACHE_QUANT_FUSION: '1'
        ATOM_PA_FLYDSL: '1'
        ATOM_GDN_STATE_MIDSTEP: '1'
        ATOM_STATE_CHECKPOINT_DEMAND: '0'
        ATOM_STATE_CHECKPOINT_END_MARGIN: '5'
        ATOM_PREFILL_DECODE_INTERVAL: '4'
        ATOM_PREFILL_DELAYER_MAX_QUEUE_MS: '5000'
  benchmark:
    env:
      # Long AgentX stalls exceed AIPerf's 30 s TCP_USER_TIMEOUT default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'atom:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# One variant per point, all TP4. Decode graphs are captured for every batch
# size up to max(8, 2x CONC). From CONC 32 the prefill delayer coalesces longer;
# from CONC 48 LMCache offloads to host DRAM: 253 GB of KV plus 110 GB of GDN
# state per rank, 363 GB x 4 ranks = 1452 GB, within the 1499 GB TP4 share at
# dram-utilization 1.0.
override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        cudagraph-capture-sizes: '[1,2,3,4,5,6,7,8]'
  benchmark:
    env:
      CONC: '1'

