schema: 2
name: wan22-vllm-omni-serving-client-g4

resources:
  gpu_type: b200

services:
  - name: video-server
    type: generic
    nodes: 1
    critical: true
    start: before_workers
    command: [python3, -m, infx.bench, video, serve]
    args:
      - --model-view
      - snapshot
      - --
      - vllm
      - serve
      - "{model_path}"
      - --served-model-name
      - "{model_id}"
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "30283"
      - --num-gpus
      - "{gpus_per_node}"
      # Deployment only: CFG branches on two GPU groups, Ulysses sequence parallelism within each.
      - --tensor-parallel-size
      - "1"
      - --cfg-parallel-size
      - "2"
      - --usp
      - "2"
      - --ring
      - "1"
      - --vae-patch-parallel-size
      - "{gpus_per_node}"
      - --vae-use-tiling
      - --init-timeout
      - "3600"
      - --stage-init-timeout
      - "3600"
    env:
      PYTHONPATH: /video-package:/infmax-workspace
      PYTHONUNBUFFERED: "1"
      VIDEO_SERVER_PORT: "30283"
      VIDEO_RUNTIME_REVISION: 5917730a4b02aedb44d374173cdc1b10484ccd52
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      # The release set reuses each prompt across five seeds; cached text embeddings would skip work.
      OMNI_DIFFUSION_PROMPT_EMBED_CACHE: "0"
      VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"
      VLLM_OMNI_SERVER_STORAGE__PATH: /logs/video/server/storage
    readiness:
      http:
        port: 30283
        path: /health
      timeout_seconds: 3600
      interval_seconds: 5
