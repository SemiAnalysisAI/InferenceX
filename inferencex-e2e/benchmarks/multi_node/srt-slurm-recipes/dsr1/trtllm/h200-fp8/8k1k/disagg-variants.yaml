schema: 2

base:
  sbatch_directives:
    cpus-per-gpu: "16"

  resources:
    gpu_type: "h200"
    gpus_per_node: 8

  engine:
    type: trtllm
    # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
    publish_metrics: false

  roles:
    prefill:
      env:
        UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"
        TRTLLM_ENABLE_PDL: "1"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        NCCL_GRAPH_MIXING_SUPPORT: "0"
      args:
        backend: pytorch
        trust_remote_code: true
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        pipeline_parallel_size: 1
        enable_attention_dp: false
        enable_chunked_prefill: false
        max_batch_size: 2
        max_num_tokens: 16640
        max_seq_len: 8232
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.85
          dtype: fp8
        cache_transceiver_config:
          backend: UCX
          max_tokens_in_buffer: 32768
        moe_config:
          backend: CUTLASS
        cuda_graph_config:
        disable_overlap_scheduler: true
        print_iter_log: true
        stream_interval: 100
        num_postprocess_workers: 4
    decode:
      env:
        UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"
        TRTLLM_ENABLE_PDL: "1"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        NCCL_GRAPH_MIXING_SUPPORT: "0"
      args:
        backend: pytorch
        trust_remote_code: true
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        pipeline_parallel_size: 1
        enable_chunked_prefill: false
        max_seq_len: 9256
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.85
          dtype: fp8
        cache_transceiver_config:
          backend: UCX
          max_tokens_in_buffer: 16384
        moe_config:
          backend: CUTLASS
          use_low_precision_moe_combine: true
        cuda_graph_config:
          enable_padding: true
        disable_overlap_scheduler: false
        print_iter_log: true
        stream_interval: 100
        num_postprocess_workers: 4

  frontend:
    type: "dynamo"
    enable_multiple_frontends: false # For some reason, the H200 cluster doesn't like nginx.

  dynamo:
    install: false
    # The container tag identifies a pre-39d2a68 Dynamo release; the image is not digest-pinned.
    # Use NATS for a recipe prior to Dynamo commit 39d2a68.
    request_plane: "nats"

override_1p7d_tep8_b1_mtp3_c9:
  name: "c1_ctx1_gen7_tep8_batch1_eplb0_mtp3"
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
    decode:
      nodes: 7
      workers: 7
      args:
        enable_attention_dp: false
        max_batch_size: 1
        max_num_tokens: 4
        cuda_graph_config:
          batch_sizes: [1]
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3

