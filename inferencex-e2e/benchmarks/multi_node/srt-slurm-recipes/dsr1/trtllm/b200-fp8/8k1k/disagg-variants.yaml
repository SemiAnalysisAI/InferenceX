schema: 2

base:
  resources:
    gpu_type: "b200"
    gpus_per_node: 8

  engine:
    type: trtllm
    # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
    publish_metrics: false

  roles:
    prefill:
      gpus: 8
      env:
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        OMPI_MCA_coll_ucc_enable: "0"
        TLLM_ALL_RANK_LOG: "1"
        TLLM_LOG_LEVEL: "INFO"
        TRTLLM_ENABLE_PDL: "1"
        TLLM_OVERRIDE_LAYER_NUM: "61"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        UCX_CUDA_IPC_ENABLE_MNNVL: "n"
        UCX_RNDV_SCHEME: "put_zcopy"
      args:
        allreduce_strategy: AUTO
        cache_transceiver_config:
          max_tokens_in_buffer: 8320
        cuda_graph_config:
        disable_overlap_scheduler: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
        max_num_tokens: 8320
        max_seq_len: 8320
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 1
        pipeline_parallel_size: 1
        print_iter_log: true
        tensor_parallel_size: 8
    decode:
      gpus: 8
      env:
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        OMPI_MCA_coll_ucc_enable: "0"
        TLLM_ALL_RANK_LOG: "1"
        TLLM_LOG_LEVEL: "INFO"
        TLLM_OVERRIDE_LAYER_NUM: "61"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        UCX_CUDA_IPC_ENABLE_MNNVL: "n"
        UCX_RNDV_SCHEME: "put_zcopy"
      args:
        allreduce_strategy: AUTO
        cache_transceiver_config:
          max_tokens_in_buffer: 8320
        cuda_graph_config:
          enable_padding: true
        disable_overlap_scheduler: false
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.8
        max_seq_len: 9344
        pipeline_parallel_size: 1
        print_iter_log: true
        stream_interval: 20
        tensor_parallel_size: 8

  benchmark:
    env:
      TOKENIZER: /model

  frontend:
    type: "dynamo"
    enable_multiple_frontends: false

  health_check:
    max_attempts: 360
    interval_seconds: 10

  dynamo:
    # The unversioned container alias does not identify a Dynamo version or hash.
    # Use NATS for a recipe with an unverified Dynamo revision.
    request_plane: "nats"
    install: false

override_1p6d_tp8_b1_mtp3_c8:
  name: ctx1_gen6_tp8_batch8_eplb0_mtp3_8
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        cache_transceiver_config:
          backend: DEFAULT
        enable_attention_dp: true
        kv_cache_config:
          free_gpu_memory_fraction: 0.2
        max_batch_size: 1
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
    decode:
      nodes: 6
      workers: 6
      env:
        TRTLLM_ENABLE_PDL: "1"
      args:
        attention_dp_config:
          enable_balance: true
        cache_transceiver_config:
          backend: DEFAULT
        cuda_graph_config:
          max_batch_size: 1
        enable_attention_dp: false
        max_batch_size: 1
        max_num_tokens: 4
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 1
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3

