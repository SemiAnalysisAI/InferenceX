schema: 2

base:
  resources:
    gpu_type: "gb300"
    gpus_per_node: 4

  engine:
    type: trtllm
    # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
    publish_metrics: false

  roles:
    prefill:
      env:
        TLLM_OVERRIDE_LAYER_NUM: "61"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        TRTLLM_ENABLE_PDL: "1"
      args:
        max_batch_size: 2
        max_num_tokens: 16640
        max_seq_len: 8232
        tensor_parallel_size: 2
        moe_expert_parallel_size: 2
        enable_attention_dp: true
        pipeline_parallel_size: 1
        print_iter_log: true
        cuda_graph_config:
        disable_overlap_scheduler: true
        moe_config:
          backend: TRTLLM
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.6
          dtype: fp8
        cache_transceiver_config:
          max_tokens_in_buffer: 16384
          backend: UCX
    decode:
      env:
        TLLM_OVERRIDE_LAYER_NUM: "61"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        TRTLLM_ENABLE_PDL: "1"
      args:
        pipeline_parallel_size: 1
        max_seq_len: 9256
        cuda_graph_config:
          enable_padding: true
        print_iter_log: true
        kv_cache_config:
          enable_block_reuse: false
          dtype: fp8
        moe_config:
          use_low_precision_moe_combine: true
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        cache_transceiver_config:
          max_tokens_in_buffer: 16384
          backend: UCX
        stream_interval: 100
        num_postprocess_workers: 4

  benchmark:
    env:
      TOKENIZER: /model

  frontend:
    type: "dynamo"
    enable_multiple_frontends: false

  dynamo:
    install: false
    # The unversioned container alias does not identify a Dynamo version or hash.
    # Use NATS for a recipe with an unverified Dynamo revision.
    request_plane: "nats"

  services:
    - name: etcd
      type: etcd
      placement:
        node: dedicated
    - name: nats
      type: nats
      placement:
        node: dedicated

override_1p3d_tep8_b8_eplb0_mtp3:
  name: "ctx1_gen3_tep8_batch8_eplb0_mtp3"
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 2
      args:
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
    decode:
      nodes: 6
      workers: 3
      args:
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        enable_attention_dp: false
        enable_lm_head_tp_in_adp: false
        max_batch_size: 8
        max_num_tokens: 32
        cuda_graph_config:
          batch_sizes:
            - 1
            - 2
            - 4
            - 8
        kv_cache_config:
          free_gpu_memory_fraction: 0.9
        moe_config:
          backend: TRTLLM
        allreduce_strategy: MNNVL
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3

