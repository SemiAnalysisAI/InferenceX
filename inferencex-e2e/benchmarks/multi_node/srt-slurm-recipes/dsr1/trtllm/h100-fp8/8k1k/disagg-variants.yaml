schema: 2

base:
  resources:
    gpu_type: h100
    gpus_per_node: 8

  engine:
    type: trtllm
    # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
    publish_metrics: false

  roles:
    prefill:
      env:
        UCX_CUDA_IPC_ENABLE_MNNVL: n
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP: '1'
        TRTLLM_FORCE_ALLTOALL_METHOD: DeepEP
      args:
        max_batch_size: 1
        max_num_tokens: 8224
        max_seq_len: 8232
        tensor_parallel_size: 16
        moe_expert_parallel_size: 16
        enable_attention_dp: true
        pipeline_parallel_size: 1
        print_iter_log: true
        cuda_graph_config:
        disable_overlap_scheduler: true
        moe_config:
          backend: WIDEEP
          max_num_tokens: 16384
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.3
          dtype: fp8
        cache_transceiver_config:
          backend: UCX
          max_tokens_in_buffer: 8256
    decode:
      env:
        NCCL_NVLS_ENABLE: '0'
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        TLLM_LOG_LEVEL: INFO
        UCX_CUDA_IPC_ENABLE_MNNVL: n
      args:
        tensor_parallel_size: 16
        moe_expert_parallel_size: 16
        pipeline_parallel_size: 1
        max_seq_len: 9256
        cuda_graph_config:
          enable_padding: true
        print_iter_log: true
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.9
          dtype: fp8
        moe_config:
          use_low_precision_moe_combine: true
        cache_transceiver_config:
          max_tokens_in_buffer: 8256
          backend: UCX
        stream_interval: 100
        num_postprocess_workers: 4

  benchmark:
    env:
      TOKENIZER: /model

  frontend:
    type: dynamo
    enable_multiple_frontends: false

  dynamo:
    install: false
    # The container tag identifies a pre-39d2a68 Dynamo release; the image is not digest-pinned.
    # Use NATS for a recipe prior to Dynamo commit 39d2a68.
    request_plane: "nats"

  # Container setup plus loading the weights over NFS outlasts the 30-minute default.
  health_check:
    max_attempts: 360
    interval_seconds: 10

  # etcd and NATS are static binaries from /configs; run them in the small nginx
  # image instead of a ~40 GB copy of the job image each on the head node. The
  # first container step on an H100 node can still take minutes to set up.
  services:
    - name: etcd
      type: etcd
      container: nginx-sqsh
      readiness:
        port: 2379
        timeout_seconds: 1200
    - name: nats
      type: nats
      container: nginx-sqsh
      readiness:
        port: 4222
        timeout_seconds: 1200

override_1p3d_tep16_b1_mtp3:
  name: h100_8k1k_ctx1dep16_gen3tep16_batch1_eplb0_mtp3
  roles:
    prefill:
      nodes: 2
      workers: 1
      args:
        enable_chunked_prefill: true
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
    decode:
      nodes: 6
      workers: 3
      args:
        enable_attention_dp: false
        enable_lm_head_tp_in_adp: false
        max_batch_size: 1
        max_num_tokens: 256
        cuda_graph_config:
          batch_sizes:
            - 1
            - 2
            - 4
        moe_config:
          backend: CUTLASS
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3

