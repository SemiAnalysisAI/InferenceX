schema: 2

base:
  resources:
    gpu_type: "b300"
    gpus_per_node: 8

  engine:
    type: trtllm
    # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
    publish_metrics: false

  roles:
    prefill:
      gpus: 4
      env:
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        OMPI_MCA_coll_ucc_enable: "0"
        TLLM_ALL_RANK_LOG: "1"
        TLLM_LOG_LEVEL: "INFO"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        UCX_CUDA_IPC_ENABLE_MNNVL: "n"
        UCX_MAX_RMA_RAILS: "1"
        UCX_MAX_RNDV_RAILS: "1"
        UCX_RNDV_SCHEME: "put_zcopy"
        OMPI_MCA_btl: "tcp,self"
        OMPI_MCA_pml: "ob1"
        TRTLLM_UCX_INTERFACE: "@fabric.rdma-device-ports"
      args:
        allreduce_strategy: AUTO
        cache_transceiver_config:
          backend: UCX
          max_tokens_in_buffer: 8320
        cuda_graph_config:
          enable_padding: false
        disable_overlap_scheduler: true
        enable_attention_dp: true
        enable_iter_perf_stats: false
        enable_iter_req_stats: false
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.6
        max_batch_size: 8
        max_num_tokens: 8320
        max_seq_len: 8320
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 1
        pipeline_parallel_size: 1
        print_iter_log: true
        tensor_parallel_size: 4
    decode:
      gpus: 8
      env:
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        OMPI_MCA_coll_ucc_enable: "0"
        TLLM_ALL_RANK_LOG: "1"
        TLLM_LOG_LEVEL: "INFO"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        UCX_CUDA_IPC_ENABLE_MNNVL: "n"
        UCX_MAX_RMA_RAILS: "1"
        UCX_MAX_RNDV_RAILS: "1"
        UCX_RNDV_SCHEME: "put_zcopy"
        OMPI_MCA_btl: "tcp,self"
        OMPI_MCA_pml: "ob1"
        TRTLLM_UCX_INTERFACE: "@fabric.rdma-device-ports"
      args:
        allreduce_strategy: AUTO
        cache_transceiver_config:
          backend: UCX
          max_tokens_in_buffer: 8320
        cuda_graph_config:
          enable_padding: true
        disable_overlap_scheduler: false
        enable_iter_perf_stats: false
        enable_iter_req_stats: false
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.8
        max_seq_len: 9344
        moe_config:
          backend: TRTLLM
        pipeline_parallel_size: 1
        print_iter_log: true
        stream_interval: 20
        tensor_parallel_size: 8

  frontend:
    type: "dynamo"
    enable_multiple_frontends: false

  health_check:
    max_attempts: 360
    interval_seconds: 10

  dynamo:
    # The unversioned container alias does not identify a Dynamo version or hash.
    # Use NATS for a recipe with an unverified Dynamo revision.
    request_plane: "nats"
    install: false

override_1p2d_tp8_b16_mtp3_c40:
  roles:
    prefill:
      nodes: 1
      workers: 1
      env:
        TRTLLM_ENABLE_PDL: "1"
      args:
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
    decode:
      nodes: 2
      workers: 2
      env:
        TRTLLM_ENABLE_PDL: "1"
      args:
        cuda_graph_config:
          max_batch_size: 16
        enable_attention_dp: false
        max_batch_size: 16
        max_num_tokens: 80
        moe_expert_parallel_size: 1
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3

