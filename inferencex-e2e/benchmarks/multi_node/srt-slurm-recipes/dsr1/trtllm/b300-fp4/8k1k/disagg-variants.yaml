schema: 2

base:
  resources:
    gpu_type: "b300"
    gpus_per_node: 8

  engine:
    type: trtllm
    # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
    publish_metrics: false

  roles:
    prefill:
      gpus: 2
      env:
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        OMPI_MCA_coll_ucc_enable: "0"
        TLLM_ALL_RANK_LOG: "1"
        TLLM_LOG_LEVEL: "INFO"
        TRTLLM_ENABLE_PDL: "1"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        UCX_CUDA_IPC_ENABLE_MNNVL: "n"
        UCX_MAX_RMA_RAILS: "1"
        UCX_MAX_RNDV_RAILS: "1"
        UCX_RNDV_SCHEME: "put_zcopy"
        OMPI_MCA_btl: "tcp,self"
        OMPI_MCA_pml: "ob1"
        TRTLLM_UCX_INTERFACE: "@fabric.ucx-net-devices"
      args:
        max_batch_size: 2
        max_num_tokens: 16896
        max_seq_len: 8232
        tensor_parallel_size: 2
        moe_expert_parallel_size: 2
        enable_attention_dp: true
        pipeline_parallel_size: 1
        print_iter_log: true
        cuda_graph_config:
        disable_overlap_scheduler: true
        moe_config:
          backend: TRTLLM
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.75
          dtype: fp8
        cache_transceiver_config:
          max_tokens_in_buffer: 8448
          backend: UCX
    decode:
      env:
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        OMPI_MCA_coll_ucc_enable: "0"
        TLLM_ALL_RANK_LOG: "1"
        TLLM_LOG_LEVEL: "INFO"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
        UCX_CUDA_IPC_ENABLE_MNNVL: "n"
        UCX_MAX_RMA_RAILS: "1"
        UCX_MAX_RNDV_RAILS: "1"
        UCX_RNDV_SCHEME: "put_zcopy"
        OMPI_MCA_btl: "tcp,self"
        OMPI_MCA_pml: "ob1"
        TRTLLM_UCX_INTERFACE: "@fabric.ucx-net-devices"
      args:
        pipeline_parallel_size: 1
        max_seq_len: 9256
        cuda_graph_config:
          enable_padding: true
        print_iter_log: true
        kv_cache_config:
          enable_block_reuse: false
          dtype: fp8
        moe_config:
          use_low_precision_moe_combine: true
        cache_transceiver_config:
          max_tokens_in_buffer: 8448
          backend: UCX
        stream_interval: 100
        num_postprocess_workers: 4

  benchmark:
    env:
      TOKENIZER: /model

  frontend:
    type: "dynamo"
    enable_multiple_frontends: false

  dynamo:
    install: false
    # The unversioned container alias does not identify a Dynamo version or hash.
    # Use NATS for a recipe with an unverified Dynamo revision.
    request_plane: "nats"

override_10p1d_dep8_b256_mtp1:
  name: "ctx10_gen1_dep8_batch256_eplb0_mtp1"
  roles:
    prefill:
      nodes: 3
      workers: 10
      args:
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 1
    decode:
      nodes: 1
      workers: 1
      args:
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        enable_attention_dp: true
        enable_lm_head_tp_in_adp: true
        max_batch_size: 256
        max_num_tokens: 512
        cuda_graph_config:
          batch_sizes:
            - 1
            - 2
            - 4
            - 8
            - 16
            - 32
            - 64
            - 128
            - 256
        kv_cache_config:
          free_gpu_memory_fraction: 0.8
        moe_config:
          backend: CUTLASS
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 1

