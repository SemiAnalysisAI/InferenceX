schema: 2

base:
  dynamo:
    request_plane: "nats"
    source:
      pypi: 0.8.1
    # Use NATS for a recipe prior to Dynamo commit 39d2a68.

  frontend:
    type: dynamo
    enable_multiple_frontends: true
    num_additional_frontends: 9
    nginx_container: nginx

  resources:
    gpu_type: "gb200"
    gpus_per_node: 4

  engine: sglang

  roles:
    prefill:
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
        MC_TE_METRIC: "true"
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        MC_FORCE_MNNVL: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
        PYTHONUNBUFFERED: "1"
      args:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        skip-tokenizer-init: true
        trust-remote-code: true
        tp-size: 8
        dp-size: 8
        ep-size: 8
        enable-dp-attention: true
        attention-backend: "trtllm_mla"
        kv-cache-dtype: "fp8_e4m3"
        disable-radix-cache: true
        stream-interval: 50
        max-running-requests: 30000
        context-length: 9300
        watchdog-timeout: 1000000
        disable-shared-experts-fusion: true
        eplb-algorithm: "deepseek"
        disaggregation-mode: "prefill"
        mem-fraction-static: 0.80
        max-total-tokens: 524288
        chunked-prefill-size: 131072
        load-balance-method: "round_robin"
        disable-cuda-graph: true
        moe-a2a-backend: "deepep"
        deepep-mode: "normal"
        ep-dispatch-algorithm: "dynamic"
        moe-dense-tp-size: 1
        enable-dp-lm-head: true
        ep-num-redundant-experts: 32
        deepep-config: "/configs/deepep_config.json"
        disaggregation-bootstrap-port: 30001
        disaggregation-transfer-backend: nixl
    decode:
      workers: 1
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
        MC_TE_METRIC: "true"
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
        SGLANG_DECODE_BOOTSTRAP_TIMEOUT: "1000"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        MC_FORCE_MNNVL: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
        PYTHONUNBUFFERED: "1"
      args:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        skip-tokenizer-init: true
        trust-remote-code: true
        enable-dp-attention: true
        attention-backend: "trtllm_mla"
        kv-cache-dtype: "fp8_e4m3"
        disable-radix-cache: true
        stream-interval: 50
        decode-log-interval: 1000
        max-running-requests: 8192
        context-length: 9300
        watchdog-timeout: 1000000
        disable-shared-experts-fusion: true
        eplb-algorithm: "deepseek"
        disaggregation-mode: "decode"
        mem-fraction-static: 0.82
        chunked-prefill-size: 36864
        moe-a2a-backend: "deepep"
        deepep-mode: "low_latency"
        ep-dispatch-algorithm: "static"
        moe-dense-tp-size: 1
        enable-dp-lm-head: true
        prefill-round-robin-balance: true
        ep-num-redundant-experts: 32
        deepep-config: "/configs/deepep_config.json"
        disaggregation-bootstrap-port: 30001
        disaggregation-transfer-backend: nixl

override_5p1d_p_tp8_ep8_dp8_d_tp32_ep32_dp32_c512x1024x2048x6144:
  name: "gb200-8k1k-fp8-mid-tpt"
  roles:
    prefill:
      nodes: 10
      workers: 5
    decode:
      nodes: 8
      env:
        SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "256"
      args:
        tp-size: 32
        dp-size: 32
        ep-size: 32
        cuda-graph-max-bs: 256

override_6p1d_p_tp8_ep8_dp8_d_tp24_ep24_dp24_c2048x4096x6144:
  name: "gb200-8k1k-fp8-max-tpt"
  roles:
    prefill:
      nodes: 12
      workers: 6
    decode:
      nodes: 6
      env:
        SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "512"
      args:
        tp-size: 24
        dp-size: 24
        ep-size: 24
        cuda-graph-bs: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136, 144, 152, 160,
              168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256, 264, 272, 280, 288, 296, 304, 312, 320, 328, 336,
          344, 352, 360, 368, 376, 384, 416, 448, 480, 512]
        cuda-graph-max-bs: 512
