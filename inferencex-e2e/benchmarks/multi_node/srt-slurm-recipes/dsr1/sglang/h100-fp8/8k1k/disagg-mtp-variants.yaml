schema: 2

base:
  resources:
    gpu_type: "h100"
    gpus_per_node: 8

  dynamo:
    request_plane: "nats"
    source:
      pypi: "0.8.0"

  frontend:
    nginx_container: nginx-sqsh

  engine: sglang

  roles:
    prefill:
      nodes: 2
      workers: 1
      env:
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        SGLANG_ENABLE_SPEC_V2: "1"
      args:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        model-path: "/model/"
        skip-tokenizer-init: true
        trust-remote-code: true
        watchdog-timeout: 1000000
        tp-size: 16
        dp-size: 1
        ep-size: 1
        enable-dp-attention: false
        attention-backend: "flashinfer"
        disable-radix-cache: true
        disaggregation-bootstrap-port: 30001
        disaggregation-mode: "prefill"
        disaggregation-transfer-backend: nixl
        mem-fraction-static: 0.6
        max-prefill-tokens: 2048
        chunked-prefill-size: 2048
        load-balance-method: "round_robin"
        speculative-algorithm: "EAGLE"
        speculative-num-steps: 2
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 3
    decode:
      nodes: 2
      workers: 1
      env:
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        SGLANG_ENABLE_SPEC_V2: "1"
      args:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        model-path: "/model/"
        skip-tokenizer-init: true
        trust-remote-code: true
        watchdog-timeout: 1000000
        tp-size: 16
        attention-backend: "flashinfer"
        disable-radix-cache: true
        stream-interval: 1
        disaggregation-bootstrap-port: 30001
        disaggregation-mode: "decode"
        disaggregation-transfer-backend: nixl
        speculative-algorithm: "EAGLE"
        speculative-num-steps: 2
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 3

  health_check:
    max_attempts: 360
    interval_seconds: 10

  services:
    - name: etcd
      type: etcd
      container: nginx-sqsh
      readiness:
        port: 2379
        timeout_seconds: 1200
    - name: nats
      type: nats
      container: nginx-sqsh
      readiness:
        port: 4222
        timeout_seconds: 1200

  host_setup:
    nodes: workers
    timeout_seconds: 3600
    commands:
      - find /mnt/nfs/lustre/models/dsr1-fp8 -name '*.safetensors' -print0 | xargs -0 -P 16 -n 1 cat > /dev/null

override_1p1d_p_tp16_d_tp16_b128_c1x2x4x8x16x32x64x128:
  roles:
    prefill:
      args:
        max-running-requests: 2
    decode:
      args:
        dp-size: 1
        ep-size: 1
        enable-dp-attention: false
        mem-fraction-static: 0.9
        max-running-requests: 128
        cuda-graph-max-bs: 128

override_1p1d_p_tp16_d_tp16_ep16_dp16_b64_c1x2x4x8x16x32x64:
  roles:
    prefill:
      args:
        max-running-requests: 4
    decode:
      args:
        dp-size: 16
        ep-size: 16
        enable-dp-attention: true
        mem-fraction-static: 0.85
        max-running-requests: 64
        cuda-graph-max-bs: 64
