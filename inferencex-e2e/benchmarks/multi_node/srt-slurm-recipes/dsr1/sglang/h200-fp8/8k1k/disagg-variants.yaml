schema: 2

base:
  frontend:
    nginx_container: nginx

  resources:
    gpu_type: "h200"
    gpus_per_node: 8

  dynamo:
    # Dynamo 0.8.0 was the default when this recipe was written; pin it explicitly.
    # Use NATS for a recipe prior to Dynamo commit 39d2a68.
    request_plane: "nats"
    source:
      pypi: "0.8.0"

  engine: sglang

  roles:
    prefill:
      env:
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      args:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        model-path: "/model/"
        skip-tokenizer-init: true
        trust-remote-code: true
        tp-size: 8
        dp-size: 1
        ep-size: 1
        attention-backend: "flashinfer"
        disable-radix-cache: true
        watchdog-timeout: 1000000
        max-running-requests: 16
        disaggregation-bootstrap-port: 30001
        disaggregation-mode: "prefill"
        disaggregation-transfer-backend: nixl
        load-balance-method: "round_robin"
    decode:
      env:
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      args:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        model-path: "/model/"
        skip-tokenizer-init: true
        trust-remote-code: true
        tp-size: 8
        attention-backend: "flashinfer"
        disable-radix-cache: true
        stream-interval: 10
        watchdog-timeout: 1000000
        disaggregation-bootstrap-port: 30001
        disaggregation-mode: "decode"
        disaggregation-transfer-backend: nixl

override_bs4_1p7d_stp:
  name: "bs4-1p7d-h200-fp8"
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        mem-fraction-static: 0.82
        max-prefill-tokens: 32768
        chunked-prefill-size: 32768
    decode:
      nodes: 7
      workers: 7
      args:
        dp-size: 1
        ep-size: 1
        mem-fraction-static: 0.82
        max-running-requests: 8
        cuda-graph-max-bs: 8

override_bs8_1p6d_stp:
  name: "bs8-1p6d-h200-fp8"
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        mem-fraction-static: 0.82
        max-prefill-tokens: 32768
        chunked-prefill-size: 32768
    decode:
      nodes: 6
      workers: 6
      args:
        dp-size: 1
        ep-size: 1
        mem-fraction-static: 0.82
        max-running-requests: 16
        cuda-graph-max-bs: 16

override_bs16_1p3d_stp:
