schema: 2

base:
  identity:
    container: {}
  dynamo:
    install: true
    source:
      wheel: "1.5.0.dev20260914"
  resources:
    gpu_type: h100
    gpus_per_node: 8
  frontend:
    type: dynamo
    env:
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    args:
      router-mode: kv
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      router-session-affinity-ttl-secs: 3600
      dyn-chat-processor: sglang
      trust-remote-code: true
  engine: sglang
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 16
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        SGLANG_DFLASH_EAGER_DRAFT_SAMPLER: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      args:
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 16
        expert-parallel-size: 16
        quantization: modelopt_fp4
        moe-runner-backend: marlin
        fp4-gemm-backend: marlin
        attention-backend: fa3
        kv-cache-dtype: fp8_e4m3
        mem-fraction-static: 0.965
        chunked-prefill-size: 1024
        swa-full-tokens-ratio: 0.1
        disable-prefill-cuda-graph: true
        enable-hierarchical-cache: true
        hicache-size: 160
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: fa4
        speculative-num-draft-tokens: 8
        mm-feature-transport: cpu
        reasoning-parser: muse
        tool-call-parser: muse
        watchdog-timeout: 3600
        enable-metrics: true
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 64
  sbatch_directives:
    mem: '0'
    exclusive: ''
  srun_options:
    mem: '0'
    container-remap-root: ''
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      TOKENIZER: /model
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'


override_tp16_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2

override_tp16_c2:
  roles:
    agg:
      args:
        max-running-requests: 4
        cuda-graph-max-bs-decode: 4

override_tp16_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8

override_tp16_c8:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
