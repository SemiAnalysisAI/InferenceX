schema: 2

base:
  identity:
    container: {}
  dynamo:
    install: true
    source:
      wheel: "1.5.0.dev20260914"
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: dynamo
    env:
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    args:
      router-mode: kv
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      router-session-affinity-ttl-secs: 3600
      dyn-chat-processor: sglang
      trust-remote-code: true
  engine: sglang
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
      args:
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 8
        quantization: modelopt_fp4
        moe-runner-backend: flashinfer_trtllm
        kv-cache-dtype: fp8_e4m3
        mem-fraction-static: 0.80
        swa-full-tokens-ratio: 0.3
        enable-layernorm-sp: true
        enable-megamoe-for-layernorm-sp: true
        enable-hierarchical-cache: true
        hicache-size: 110
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: fa4
        speculative-num-draft-tokens: 8
        mm-feature-transport: cpu
        reasoning-parser: muse
        tool-call-parser: muse
        watchdog-timeout: 3600
        enable-metrics: true
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 64
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  srun_options:
    mem: '0'
    container-remap-root: ''
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      TOKENIZER: /model
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'


override_tp8_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
        mem-fraction-static: 0.80
        swa-full-tokens-ratio: 0.2
        prefill-decode-interval: 32
        enable-hierarchical-cache: null
        hicache-size: null

override_tp8_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
        mem-fraction-static: 0.83
        swa-full-tokens-ratio: 0.15
        chunked-prefill-size: 32768
        prefill-decode-interval: 64
        enable-hierarchical-cache: null
        hicache-size: null

override_tp8_c24:
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs-decode: 24
        mem-fraction-static: 0.85
        swa-full-tokens-ratio: 0.3
        chunked-prefill-size: 8192
        prefill-decode-interval: 32
        enable-hierarchical-cache: null
        hicache-size: null

override_tp8_c32:
  roles:
    agg:
      args:
        max-running-requests: 48
        cuda-graph-max-bs-decode: 48
        mem-fraction-static: 0.85
        swa-full-tokens-ratio: 0.2
        chunked-prefill-size: 8192
        prefill-decode-interval: 64
        enable-layernorm-sp: false
        enable-megamoe-for-layernorm-sp: false
        hicache-size: 90
        hicache-write-policy: write_through

override_tp8_c48:
  roles:
    agg:
      args:
        max-running-requests: 96
        cuda-graph-max-bs-decode: 96
        mem-fraction-static: 0.80
        swa-full-tokens-ratio: 0.15
        chunked-prefill-size: 32768
        prefill-decode-interval: 32
        schedule-policy: hrrn
        hicache-size: 125
        hicache-write-policy: write_through

override_tp8_c64:
  roles:
    agg:
      args:
        max-running-requests: 96
        cuda-graph-max-bs-decode: 96
        mem-fraction-static: 0.83
        swa-full-tokens-ratio: 0.4
        chunked-prefill-size: 32768
        prefill-decode-interval: 8
        schedule-policy: hrrn
        hicache-size: 120
        hicache-write-policy: write_back
