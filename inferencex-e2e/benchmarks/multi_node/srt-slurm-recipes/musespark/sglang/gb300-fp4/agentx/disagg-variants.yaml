# Layout from ai-dynamo/dynamo recipes/muse-spark-open-816b-a42b/sglang/disagg-gb300-agentic,
# with the single-node GB300 recipe's DFlash2, KV and HiCache settings.
schema: 2

base:
  name: musespark-fp4-gb300-dynamo-sglang-agentx-disagg
  dynamo:
    install: true
    source:
      # The image ships ai-dynamo 1.6.0.dev20260930; install the same build.
      wheel: "1.6.0.dev20260930"
  slurm:
    time_limit: "6:00:00"
  # 533 GB of weights load from shared storage before graph capture.
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      DYN_NATS_REQUEST_TIMEOUT_SECS: "1800"
    args:
      # The Rust preprocessor's Jinja rejects the checkpoint template's generation tag;
      # render chat templates with SGLang as the single-node server does.
      dyn-chat-processor: sglang
      router-mode: kv
      router-session-affinity-ttl-secs: "3600"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine: sglang
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env: &env
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        PYTHONNOUSERSITE: "1"
        PYTHONUNBUFFERED: "1"
        HF_HUB_CACHE: /hf_hub_cache
        SGLANG_TIMEOUT_KEEP_ALIVE: "900"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: NVLINK
        MC_FORCE_MNNVL: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
      args:
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 4
        quantization: modelopt_fp4
        moe-runner-backend: flashinfer_trtllm
        kv-cache-dtype: fp8_e4m3
        mem-fraction-static: 0.85
        swa-full-tokens-ratio: 0.1
        enable-layernorm-sp: true
        enable-megamoe-for-layernorm-sp: true
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: fa4
        speculative-num-draft-tokens: 8
        mm-feature-transport: cpu
        # Prefill keeps the session prefixes; 120 GB of host KV per rank as in the agg recipe.
        enable-hierarchical-cache: true
        hicache-size: 120
        disaggregation-transfer-backend: mooncake
        # Long agentic first turns keep prefill busy; 32k chunks raise prefill throughput.
        chunked-prefill-size: 32768
        max-prefill-tokens: 32768
        watchdog-timeout: 3600
        enable-metrics: true
      kv_events: true
    decode:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args:
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 4
        quantization: modelopt_fp4
        moe-runner-backend: flashinfer_trtllm
        kv-cache-dtype: fp8_e4m3
        # Decode sizes SWA by running requests, so the full pool takes the rest, and the
        # bf16 DFlash2 draft pool matches it token for token; 0.80 runs out of HBM after
        # graph capture.
        mem-fraction-static: 0.75
        swa-full-tokens-ratio: 0.1
        # DFlash2 verifies 8 tokens per step: the current token plus 7 drafts.
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: fa4
        speculative-num-draft-tokens: 8
        mm-feature-transport: cpu
        # Decode keeps no radix cache, so its HiCache tier is the host pool that holds
        # the KV of requests retracted when HBM fills. The draft's host sidecar comes on
        # top of it; 120 GB per rank exceeded free host memory.
        disaggregation-decode-retraction-backup: host_pool
        hicache-size: 64
        disaggregation-transfer-backend: mooncake
        watchdog-timeout: 3600
        enable-metrics: true
      kv_events: true
  sbatch_directives:
    mem: "0"
    exclusive: ""
  srun_options:
    container-remap-root: ""
  benchmark:
    env:
      # The gated Hub repo is unreadable with the job token; tokenize from the staged checkpoint.
      TOKENIZER: /model
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
      AGENTIC_WARMUP_GRACE_PERIOD: "3600"

override_1p1d_c32:
  name: disagg-gb300-1p1d-tp4ep4-c32
  roles:
    decode:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32

