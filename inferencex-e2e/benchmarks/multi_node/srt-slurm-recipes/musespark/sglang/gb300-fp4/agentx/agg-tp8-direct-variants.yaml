schema: 2

base:
  name: musespark-fp4-gb300-sglang-agentx-agg-tp8-direct
  identity:
    model: {}
    container: {}
  environment:
    HF_HUB_OFFLINE: '1'
    HF_HUB_CACHE: /hf_hub_cache
  slurm:
    time_limit: '4:00:00'
  # Cold weight loads plus graph capture outlast the default.
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # Parallel prompt encode calls num_special_tokens_to_add, which the fastokens shim lacks.
        SGLANG_PARALLEL_PROMPT_ENCODE: '0'
        HF_HUB_OFFLINE: '1'
        # Free window-layer slots outside the 2048-token window, so follow-up turns reuse the prefix.
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: '1'
        # One SGLang server over two 4-GPU trays on one NVLink domain (MNNVL).
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      args:
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 8
        quantization: modelopt_fp4
        moe-runner-backend: flashinfer_trtllm
        kv-cache-dtype: fp8_e4m3
        mem-fraction-static: 0.88
        # 46 of 62 layers attend to a 2048-token window; this sizes their KV pool against the full-attention pool.
        swa-full-tokens-ratio: 0.1
        enable-layernorm-sp: true
        enable-megamoe-for-layernorm-sp: true
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-model-revision: 46c90f412549c472941a68382d91a99e5e6372a0
        speculative-draft-attention-backend: fa4
        # DFlash2 verifies 8 tokens per step: the current token plus 7 drafts.
        speculative-num-draft-tokens: 8
        mm-feature-transport: cpu
        reasoning-parser: muse
        tool-call-parser: muse
        # Same token ids as the HF tokenizer, without the per-turn re-encode of the whole conversation.
        tokenizer-backend: fastokens
        watchdog-timeout: 3600
        enable-metrics: true
  sbatch_directives:
    mem: '0'
  srun_options:
    mem: '0'
  benchmark:
    env:
      # The client container has no /model mount; it loads the tokenizer by Hub id.
      HF_HUB_OFFLINE: '0'
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_tp8_c5:
  roles:
    agg:
      args:
        # Larger KV pages for the decode attention kernel.
        page-size: 128
        # Admission cap below the concurrency: fewer requests decode at once, so each step is shorter; the wait shows up in TTFT.
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1

override_tp8_c10:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
        # Decode steps between prefill chunks, so long prompts do not stall running streams.
        prefill-decode-interval: 128
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192

override_tp8_c18:
  roles:
    agg:
      args:
        page-size: 128
        max-running-requests: 3
        cuda-graph-max-bs-decode: 3
        prefill-decode-interval: 32

override_tp8_c32:
  roles:
    agg:
      args:
        page-size: 128
        max-running-requests: 6
        cuda-graph-max-bs-decode: 6
        prefill-decode-interval: 24
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        # Shortest prefill first among queued requests.
        schedule-policy: shortest-prefill-first
