schema: 2

base:
  name: musespark-fp4-gb300-dynamo-trt-agentx-agg
  dynamo:
    install: true
    source:
      wheel: 1.7.0.dev20261102
    request_plane: tcp
  identity:
    frameworks:
      dynamo: 1.7.0.dev20261102
  environment:
    HF_HUB_OFFLINE: '1'
    HF_HUB_CACHE: /hf_hub_cache
    DYN_TOKEN_IDS_AS_BYTES: '1'
    DYN_REQUEST_PLANE_CODEC: msgpack
    DYN_LIFECYCLE_TRACE_ENABLED: '0'
    OTEL_EXPORT_ENABLED: '0'
    PIP_CONFIG_FILE: /dev/null
    PIP_INDEX_URL: https://pypi.org/simple
    PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  services:
  - name: otel-collector
    type: otel-collector
    enabled: false
  health_check:
    max_attempts: 1440
    interval_seconds: 5
    extra_fatal_log_patterns: [Hang detected after \d+ seconds, 'Fatal error detected, initiating shutdown']
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine:
    type: trtllm
    served_model_name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
    publish_metrics: true
    numa_cpu_bind: true
    numa_memory_bind: preferred
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    placement:
      node: head
    args:
      router-mode: kv
    env:
      ETCD_LEASE_TTL: '120'
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
      DYN_TOKENIZER: fastokens
      DYN_TOKENIZER_CACHE_BYTES: '8589934592'
      DYN_REQUEST_PLANE: tcp
      DYN_FRONTEND_ENABLE_KV_EVENTS: '0'
  roles:
    agg:
      env:
        PYTHONNOUSERSITE: '1'
        TQDM_DISABLE: '1'
        HF_HUB_OFFLINE: '1'
        DYN_CUSTOM_JINJA_TEMPLATE: /model/chat_template.jinja
  benchmark:
    placement:
      node: head
    env:
      SERVED_MODEL_NAME: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
      TOKENIZER: /model
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '14400'
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
    colocate_with_frontend: true
  observability:
    enabled: false
    enable_otel: false
    tachometer:
      enabled: false
  sbatch_directives:
    exclusive: ''
    mem: '0'
    no-requeue: ''

override_agg_tep8_b1_c1:
  name: musespark-trt-dynamo-gb300-agg-tep8-b1-c1-dflash7
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        ENROOT_ALLOW_DEV: 'yes'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_ARENA_RESERVE: '0'
        OMP_NUM_THREADS: '1'
        TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
        MPI_UCX_TLS: rc,ud,sm,self
        OMPI_MCA_coll: ^ucc,hcoll
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        TRTLLM_ENABLE_PDL: '1'
        TLLM_PROFILE_LOG_RANKS: '0'
        TRTLLM_HANG_DETECTION_TIMEOUT: '1800'
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        PYTHONNOUSERSITE: '1'
        TRTLLM_LOW_M_GEMM_BACKEND: auto
        TRTLLM_KV_HOST_TIER_DROP_PAGE_CACHE: '1'
        TRTLLM_KV_DEFER_CLOSE: '1'
        TRTLLM_GPU_KEEPALIVE: '1'
        TRTLLM_SKIP_KV_CACHE_ESTIMATION: '1'
      args:
        allreduce_strategy: NCCL
        attn_backend: TRTLLM
        cuda_graph_config:
          enable_padding: true
          batch_sizes: [1]
          max_batch_size: 1
        custom_tokenizer: musespark_open
        disable_mm_encoder: true
        disable_overlap_scheduler: false
        enable_attention_dp: false
        enable_chunked_prefill: true
        kv_cache_config:
          block_reuse_config:
            policy: all_reusable
            swa_endpoint_rewind_tokens: 1024
          dtype: fp8
          enable_block_reuse: true
          enable_partial_reuse: true
          free_gpu_memory_fraction: 0.8
          host_cache_size: 0
          pool_ratio: [0.15, 0.85]
          tokens_per_block: 32
          use_kv_cache_manager_v2: true
          iteration_stats_interval: 20
        max_batch_size: 1
        max_num_tokens: 8192
        max_seq_len: 851968
        modeling_v2: require
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 8
        perf_metrics_max_requests: 100000
        perf_metrics_output_dir: /logs/perf_metrics/agg
        pipeline_parallel_size: 1
        prefill_capture_num_tokens: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 768, 1024, 1280, 1536, 1792, 2048, 2304, 2560,
          2816, 3072, 3584, 4096, 4608, 5120, 5632, 6144, 6656, 7168, 7680, 8192, 8704, 9216, 9728, 10240, 10752, 11264, 11776,
          12288, 12800, 13312, 13824, 14336, 14848, 15360, 15872, 16384]
        prefill_cuda_graph_backend: breakable
        print_iter_log: true
        return_perf_metrics: true
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
        speculative_config:
          decoding_type: DFlash
          max_draft_len: 7
          speculative_model: /hf_hub_cache/models--RadixArk--Muse-Spark-Open-DFlash2/snapshots/46c90f412549c472941a68382d91a99e5e6372a0
          use_rejection_sampling: true
        tensor_parallel_size: 8
        trust_remote_code: true
        enable_tokenization_cache: true
        enable_iter_perf_stats: true
        iter_perf_stats_interval: 20
        stream_interval: 20

