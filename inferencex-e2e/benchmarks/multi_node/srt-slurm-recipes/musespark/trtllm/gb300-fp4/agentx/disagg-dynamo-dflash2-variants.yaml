        TRTLLM_SKIP_KV_CACHE_ESTIMATION: '0'
        TRTLLM_WORKER_DISABLE_GC: '1'
        GLOG_logtostderr: '1'
        WITH_NVIDIA_PEERMEM: '0'
        TRTLLM_STORE_HOST_DONOR_MAX_LENT_GIB: '640'
