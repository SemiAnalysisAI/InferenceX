        TRTLLM_EXECUTOR_THREAD_PIN: '1'
        TRTLLM_MOONCAKE_STORE_SNAPSHOT_STREAM: '1'
        TRTLLM_MOONCAKE_STORE_CHAIN_MEMO_MB: '256'
        LD_PRELOAD: /usr/lib/aarch64-linux-gnu/libtcmalloc_minimal.so.4
        TRTLLM_MOONCAKE_STORE_PROBE_CHUNK: '1024'
        TRTLLM_MOONCAKE_STORE_PGFIX_FAST: '1'
      args:
        allreduce_strategy: NCCL
        attn_backend: TRTLLM
        cache_transceiver_config:
          backend: NIXL
          kv_cache_bounce_size_mb: 1024
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 1048576
          transceiver_runtime: PYTHON
          agent_bounce_buffer_enable: true
          agent_bounce_params:
            max_average_descriptor_size: 4MB
            min_descriptor_count: '1'
        cuda_graph_config:
          enable_padding: true
          max_batch_size: 64
        custom_tokenizer: musespark_open
        disable_mm_encoder: true
        disable_overlap_scheduler: false
        enable_attention_dp: false
        enable_chunked_prefill: true
        kv_cache_config:
          block_reuse_config:
            policy: all_reusable
            swa_endpoint_rewind_tokens: 1024
          dtype: fp8
          enable_block_reuse: true
          enable_partial_reuse: true
          free_gpu_memory_fraction: 0.9
          host_cache_size: 0
          pool_ratio: [0.25, 0.75]
          tokens_per_block: 32
          use_kv_cache_manager_v2: true
          iteration_stats_interval: 20
        max_batch_size: 64
        max_num_tokens: 16384
        max_seq_len: 996672
        modeling_v2: require
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 4
        perf_metrics_max_requests: 100000
        perf_metrics_output_dir: /logs/perf_metrics/ctx
        pipeline_parallel_size: 1
        prefill_capture_num_tokens: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 768, 1024, 1280, 1536, 1792, 2048, 2304, 2560,
