        TRTLLM_SCHED_PREFIX_SKIP_KEY_CACHE: '1'
        TRTLLM_SCHED_PREFIX_SKIP_PRIORITIZE: '1'
        TRTLLM_KV_BOUNCE_NONBLOCKING_STREAMS: '1'
        TRTLLM_KV_TRANSFER_NUM_THREADS: '4'
        TRTLLM_KV_SWA_DEMOTE_ANCHORS: '1'
        TRTLLM_KV_SWA_FORK_ANCHOR: '1'
        NCCL_MIN_NCHANNELS: '64'
        NCCL_MAX_NCHANNELS: '64'
        MUSESPARK_OPEN_EXPERT_PLACEMENT: /configs/musespark-gb300-prefill-expert-placement.json
        TRTLLM_MCB_DIAG: '1'
        GLOG_logtostderr: '1'
        WITH_NVIDIA_PEERMEM: '0'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_TE_METRIC: '1'
        TRTLLM_MOONCAKE_STORE_RESAVE_MIN_TOKENS: '32768'
        TRTLLM_STORE_HOST_DONOR_MAX_LENT_GIB: '640'
        TRTLLM_MCB_LOAD_AHEAD: '1'
        TRTLLM_MOONCAKE_STORE_BATCH_COPY: '1'
        TRTLLM_MOONCAKE_STORE_LOCAL_STORED_SET: '1'
        TRTLLM_MOONCAKE_STORE_LOOKUP_STAGED: '1'
        TRTLLM_MOONCAKE_STORE_LOOKUP_REUSE_MS: '1000'
