        NCCL_MIN_NCHANNELS: '64'
        TLLM_KV_CACHE_MANAGER_V2_KEY_CHAIN_MEMO: '1'
        TLLM_KV_CACHE_MANAGER_V2_LAZY_SLOT_SCRUB: '1'
        TLLM_KV_CACHE_MANAGER_V2_STREAM_ORDERED_EVENTS: '1'
      args:
        allreduce_strategy: NCCL
        attn_backend: TRTLLM
        cache_transceiver_config:
          backend: NIXL
          kv_cache_bounce_size_mb: 1024
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 1048576
          transceiver_runtime: PYTHON
          agent_bounce_buffer_enable: true
          agent_bounce_params:
