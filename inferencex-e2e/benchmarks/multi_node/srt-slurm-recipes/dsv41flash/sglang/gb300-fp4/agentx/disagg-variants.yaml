# AgentX dsv41flash sglang gb300-fp4 recipes (Dynamo frontend + SGLang, DISAGGREGATED
# topology with Mooncake KV transfer): shared settings in base, one override per
# benchmark point. Select one with
# CONFIG_FILE=recipes/dsv41flash/sglang/gb300-fp4/agentx/disagg-variants.yaml:override_<name>.
#
# Prefill and decode are separate TP2/EP2 SGLang workers (two GPUs each) behind the
# Dynamo KV router; with the DSpark draft in PD-disaggregated mode both sides must
# use the same TP, so capacity is added with more TP2 workers: one prefill worker
# feeds one, two or four decode workers (1PxD), which sets the sessions per decode
# worker and with it the interactivity band. Measured on GB300 NVL72 (tokens/s/GPU
# @ P90 interactivity, P90 TTFT):
#   override_1p1d_c8   :  15,724 @ 326.1 tok/s/user, 0.6 s  ( 4 GPUs; GSM8K gate passed)
#   override_1p1d_c16  :  28,810 @ 288.3 tok/s/user, 0.7 s  ( 4 GPUs; GSM8K gate passed)
#   override_1p1d_c64  : 114,682 @ 147.5 tok/s/user, 1.8 s  ( 4 GPUs; GSM8K 0.9742)
#   override_1p1d_c96  : 144,448 @ 132.2 tok/s/user, 4.1 s  ( 4 GPUs; GSM8K gate passed)
#   override_1p2d_c64  :  80,214 @ 202.9 tok/s/user, 2.0 s  ( 6 GPUs, 2 nodes; GSM8K gate pending)
#   override_1p4d_c64  :  49,846 @ 253.9 tok/s/user, 1.9 s  (10 GPUs, 3 nodes; GSM8K gate pending)
# Against the published MI355X ATOM curve at matched P90 interactivity: 1P1D c16 1.53x,
# c64 2.30x, c96 2.72x, 1P2D c64 2.15x, 1P4D c64 1.90x tokens/s/GPU; 1P1D c8 (1.41x)
# extends the curve to 326 tok/s/user. The harness applies the golden acceptance
# length (3.51 at K=5) itself.

schema: 2

base:
  name: dsv41flash-fp4-gb300-dynamo-sglang-agentx-disagg
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: lmsysorg/sglang:nightly-dev-20260928-81f27fb3@sha256:d9e4917808cfaa4b3be033a0c85a3a73d71eb93c17accbfa2ac3e96f551f3a33
    precision: fp4
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4.1-Flash
  dynamo:
    install: true
    source:
      wheel: "1.6.0.dev20260928"
  slurm:
    # c96 AgentX runs take ~2.5 h including the 60 min profiling phase and the gate.
    time_limit: "6:00:00"
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  # Dynamo 1.6 uses the TCP request plane; etcd is the only discovery service needed
  # and runs with the frontend on the prefill node (two nodes total for 1P1D).
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      DYN_NATS_REQUEST_TIMEOUT_SECS: "1800"
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: "3600"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine: sglang
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 2
      env:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        PYTHONNOUSERSITE: "1"
        PYTHONUNBUFFERED: "1"
        HF_HUB_CACHE: /hf_hub_cache
        SGLANG_TIMEOUT_KEEP_ALIVE: "900"
        SGLANG_DEFAULT_THINKING: "1"
        SGLANG_DSV41_REASONING_EFFORT: high
        SGLANG_DSPARK_OPT_MARKOV_W2_BF16: "True"
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
        SGLANG_ENABLE_PREFILL_WAR_READ_DONE: "1"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        MC_FORCE_MNNVL: "1"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        tensor-parallel-size: 2
        expert-parallel-size: 2
        disaggregation-transfer-backend: mooncake
        # Long-context first turns (P90 ISL ~250k tokens): one 16k-token chunk per step.
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        max-running-requests: 64
        swa-prefix-tails: 4096
        mem-fraction-static: 0.85
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        reasoning-parser: auto
        tool-call-parser: auto
        watchdog-timeout: 3600
        enable-metrics: true
        weight-loader-prefetch-checkpoints: true
        weight-loader-drop-cache-after-load: false
        model-loader-extra-config: '{"enable_multithread_load":true}'
      # KV events for the Dynamo KV router; srtctl allocates the ZMQ ports per worker.
      kv_events: true
    decode:
      nodes: 1
      workers: 1
      gpus: 2
      env:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        PYTHONNOUSERSITE: "1"
        PYTHONUNBUFFERED: "1"
        HF_HUB_CACHE: /hf_hub_cache
        SGLANG_TIMEOUT_KEEP_ALIVE: "900"
        SGLANG_DEFAULT_THINKING: "1"
        SGLANG_DSV41_REASONING_EFFORT: high
        SGLANG_DSPARK_OPT_MARKOV_W2_BF16: "True"
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        MC_FORCE_MNNVL: "1"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        tensor-parallel-size: 2
        expert-parallel-size: 2
        disaggregation-transfer-backend: mooncake
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
        mem-fraction-static: 0.85
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        reasoning-parser: auto
        tool-call-parser: auto
        watchdog-timeout: 3600
        enable-metrics: true
        weight-loader-prefetch-checkpoints: true
        weight-loader-drop-cache-after-load: false
        model-loader-extra-config: '{"enable_multithread_load":true}'
      kv_events: true
  sbatch_directives:
    mem: "0"
    exclusive: ""
  srun_options:
    container-remap-root: ""
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: "8000"
      IS_MULTINODE: "true"
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
      AGENTIC_WARMUP_GRACE_PERIOD: "3600"

# 1 prefill TP2/EP2 + 1 decode TP2/EP2 (4 GPUs, 2 nodes). The decode worker alone
# sets the interactivity: 8 sessions give 326 tok/s/user, 16 give 288, 64 give
# 147.5 and 96 give 132; the single prefill worker holds P90 TTFT under 4.1 s up
# to c96 (it saturates between c96 and c128).
override_1p1d_c8:
  name: disagg-gb300-1p1d-tp2ep2-c8
  benchmark:
    env:
      CONC: "8"

override_1p1d_c16:
  name: disagg-gb300-1p1d-tp2ep2-c16
  benchmark:
    env:
      CONC: "16"

# 114,682 tokens/s/GPU @ 147.5 tok/s/user with a 1.8 s P90 TTFT.
override_1p1d_c64:
  name: disagg-gb300-1p1d-tp2ep2-c64
  benchmark:
    env:
      CONC: "64"

# 144,448 tokens/s/GPU @ 132.2 tok/s/user with a 4.1 s P90 TTFT.
override_1p1d_c96:
  name: disagg-gb300-1p1d-tp2ep2-c96
  benchmark:
    env:
      CONC: "96"

# 1 prefill TP2/EP2 + 2 decode TP2/EP2 on one node (6 GPUs, 2 nodes), 32 sessions per
# decode worker: 80,214 tokens/s/GPU @ 202.9 tok/s/user, P90 TTFT 2.0 s. The KV
# router kept the two decode workers evenly loaded without per-worker caps.
override_1p2d_c64:
  name: disagg-gb300-1p2d-tp2ep2-c64
  roles:
    decode:
      workers: 2
      args:
        max-running-requests: 64
        cuda-graph-max-bs-decode: 64
  benchmark:
    env:
      CONC: "64"

# 1 prefill TP2/EP2 + 4 decode TP2/EP2 on two nodes (10 GPUs, 3 nodes), 16 sessions
# per decode worker: 49,846 tokens/s/GPU @ 253.9 tok/s/user, P90 TTFT 1.9 s.
override_1p4d_c64:
  name: disagg-gb300-1p4d-tp2ep2-c64
  roles:
    decode:
      nodes: 2
      workers: 4
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
  benchmark:
    env:
      CONC: "64"
