schema: 2

base:
  name: dsv41flash-fp4-gb300-dynamo-sglang-agentx-agg
  identity:
    model: {}
    frameworks:
      dynamo: "1.7.0.dev20261028"
      sglang: "0.0.0.dev1+gc10e0e177"
  dynamo:
    install: false
    request_plane: tcp
  # gb300-nv serves this model from the Hub; read it from the shared mounted cache.
  environment:
    HF_HUB_CACHE: /hf_hub_cache
  # Tachometer's per-node exporters slow decode steps and add head-node host memory;
  # InferenceX does not read its output.
  observability:
    tachometer:
      enabled: false
  slurm:
    time_limit: "4:00:00"
  # Cold weight loads from the shared HF cache plus graph capture take 15-20 min.
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
    # Disables Dynamo's per-request lifecycle span export; InferenceX does not read it.
    - name: otel-collector
      type: otel-collector
      enabled: false
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      DYN_ROUTER_TEMPERATURE: "0"
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
      DYN_TOKENIZER: "fastokens"
      DYN_TOKENIZER_CACHE: "1"
      DYN_TOKENIZER_CACHE_BYTES: "8000000000"
      DYN_TCP_CHANNEL_BUFFER: "128"
      DYN_TCP_REQUEST_TIMEOUT: "60"
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: "14400"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      env:
        PYTHONNOUSERSITE: "1"
        PYTHONUNBUFFERED: "1"
        # Dynamo 1.7 backend admission rejects turns with 529 once the engine is full;
        # the SGLang scheduler queues them instead.
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: "10000"
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: "10000"
        DYN_BACKEND_ADMISSION_REQUEST_QUEUE_LIMIT: "10000"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        mem-fraction-static: 0.8
        chunked-prefill-size: 16384
        # Admission never exceeds the captured decode graph batch.
        cuda-graph-max-bs-decode: 64
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        reasoning-parser: auto
        tool-call-parser: auto
        watchdog-timeout: 3600
        enable-metrics: true
  sbatch_directives:
    mem: "0"
    exclusive: ""
  srun_options:
    container-remap-root: ""
    # Engram host tables need the node's full memory in every worker step.
    mem: "0"
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      # The client splits this value on whitespace, so it has none.
      AIPERF_EXTRA_INPUTS: '{"chat_template_kwargs":{"reasoning_effort":"high","thinking":true},"temperature":1}'

override_tp4_c1:
  name: dsv41flash-fp4-gb300-dynamo-sglang-agentx-agg-tp4ep1-c1
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        mem-fraction-static: 0.91
        kv-cache-dtype: fp8_e4m3
        dsv4-attn-backend: flashmla
        moe-a2a-backend: none
        enable-nvidia-megakernel: true
        startup-weight-load-mode: serial
        enable-decoder-swa-bounded-replay: true
        context-length: 1048576
        max-running-requests: 1
        cuda-graph-max-bs-decode: 1
        prefill-decode-interval: 16
        schedule-policy: lpm
        swa-prefix-tails: 128
        tokenizer-backend: fastokens
        enable-metrics-for-all-schedulers: true
      env:
        SGLANG_SPEC_TP_SYNC: rng,-dspark-accept-sample
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_NVIDIA_MEGAKERNEL_SLOTS: hop_a,moe,gate,attn,embed,two_shot,markov,draft_lm_head,aux_mean_stats,gate_wide,shared_ll,hop_a_batch2,engram,attn_qkv_a,attn_qkv_a_bf16,index_q_mxfp8_in,attn_indexer,hc_prenorm,hop_b,hop_b_wide,early_trigger,hop_b_start_trigger,draft,draft_moe,draft_gate,draft_tail,draft_post,draft_seam,draft_attn,draft_qfront,draft_wo_a,draft_swapab,draft_qkv_a,draft_prenorm,draft_qkv_a_ll,draft_wo_b_ll,sched_ahead,req_pos_once,kv_before_wait,target_lm_head,hop_b_quad_trigger,lm_head_pinned_tactic
        SGLANG_ENABLE_NV_MEGA_RUNTIME_OPTIMIZATION: "1"
        SGLANG_SIMULATE_ACC_GREEDY: "0"
        SGLANG_OPT_DSV41_DSPARK_SIM_DRAW_AHEAD: "1"
        NCCL_CUMEM_ENABLE: "0"
        NCCL_MNNVL_ENABLE: "0"

override_tp4_c4:
  name: dsv41flash-fp4-gb300-dynamo-sglang-agentx-agg-tp4ep1-c4
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        dsv4-attn-backend: flashmla
        prefill-decode-interval: 0
        swa-prefix-tails: 4096
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
      env:
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank

override_tp4_c16:
  name: dsv41flash-fp4-gb300-dynamo-sglang-agentx-agg-tp4ep1-c16
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        dsv4-attn-backend: flashmla
        prefill-decode-interval: 192
        swa-prefix-tails: 4096
        max-running-requests: 128
        cuda-graph-max-bs-decode: 128
      env:
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
        SGLANG_NUMA_BIND_V2: "0"
