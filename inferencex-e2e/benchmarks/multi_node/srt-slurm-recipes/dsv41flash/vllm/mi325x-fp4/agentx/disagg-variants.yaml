schema: 2

# DeepSeek-V4.1-Flash FP4 MI325X vLLM AgentX, 1P1D NIXL disaggregation.
#
# One prefill worker on 2 GPUs (TP1 + DP2 attention) feeding one TP4 decode worker,
# 6 chips total. Measured against the published mi325x_vllm aggregated frontier on the
# same agentic traces and the same all-chips basis:
#
#   conc  decode cap  engram(D)  tok/s/chip  P90 interactivity  published  ratio
#    128     132      offload      458.51          21.39        off-curve    -
#    128     112      offload      450.78          23.87          354.8    1.27x
#    128     112      VRAM         411.48          32.36          315.8    1.30x
#     64     128      offload      308.29          48.43          249.6    1.23x
#     32      64      offload      192.71          80.52          192.7    1.00x
#
# Interactivity ~80 is the crossover: below conc 32 the fixed 2-chip prefill cost stops
# paying for itself (effective decode concurrency falls to 17 at conc 32, 4 at conc 16).
base:
  name: dsv41flash-fp4-mi325x-vllm-disagg-agentic-dspark
  slurm:
    time_limit: '08:00:00'
  sbatch_directives:
    mem: '0'
  srun_options:
    container-remap-root: ''
    container-writable: ''
    mem: '0'
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  health_check:
    interval_seconds: 10
    max_attempts: 720
  engine:
    type: vllm
    connector: nixl
  frontend:
    type: vllm-router
    enable_multiple_frontends: false
    placement:
      node: head
    args:
      policy: consistent_hash
      vllm-pd-disaggregation: true
      kv-connector: nixl
      intra-node-data-parallel-size: 2
      worker-startup-timeout-secs: 1800
  benchmark:
    placement:
      node: head
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 2
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        tensor-parallel-size: 1
        data-parallel-size: 2
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        reasoning-parser: deepseek_v41
        enable-auto-tool-choice: true
        moe-backend: aiter
        gpu-memory-utilization: 0.95
        max-model-len: 1048576
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        disable-uvicorn-access-log: true
        # Structural, not tuning: with cpu_offload false this 2-GPU prefill OOMs.
        engram-config: '{"cpu_offload":true}'
        # 32768 crashes in warmup with hipErrorLaunchOutOfResources. GSM8K does not
        # catch it because its ~1k-token prompts never build a large prefill batch.
        max-num-batched-tokens: 8192
        max-num-seqs: 64
        max-cudagraph-capture-size: 512
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
      env:
        VLLM_ROCM_USE_AITER: '1'
        VLLM_ROCM_USE_AITER_MOE: '1'
        AITER_TRITON_LOG_LEVEL: ERROR
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        OMP_NUM_THREADS: '1'
        HF_HUB_OFFLINE: '1'
        PYTHONUNBUFFERED: '1'
    decode:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        tensor-parallel-size: 4
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        reasoning-parser: deepseek_v41
        enable-auto-tool-choice: true
        moe-backend: aiter
        gpu-memory-utilization: 0.95
        max-model-len: 1048576
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        disable-uvicorn-access-log: true
        # Inert at these batch sizes (fused paths cap at 32 tokens, ~5.3 dspark
        # requests); kept so the low-concurrency points can use it.
        monokernel: true
        max-num-inflight-kv-loads: 72
        max-async-kv-loads-per-step: 6
        kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
      env:
        VLLM_ROCM_USE_AITER: '1'
        VLLM_ROCM_USE_AITER_MOE: '1'
        AITER_TRITON_LOG_LEVEL: ERROR
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        OMP_NUM_THREADS: '1'
        HF_HUB_OFFLINE: '1'
        PYTHONUNBUFFERED: '1'

