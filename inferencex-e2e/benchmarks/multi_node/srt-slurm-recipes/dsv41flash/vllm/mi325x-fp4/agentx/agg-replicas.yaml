schema: 2
name: dsv41flash-fp4-mi325x-vllm-two-replica-agentic
model:
  path: hf:deepseek-ai/DeepSeek-V4.1-Flash
  container: vllm/vllm-openai-rocm:nightly-81198e97ba7eee2a22540caaa756b7fdddcb4d93@sha256:a401e4f46872dcde77e07ae3d7fa2d3a71b7f2773714316116532e2b39deb179
  precision: fp4
resources:
  gpu_type: mi325x
  gpus_per_node: 8
frontend:
  type: vllm-router
  container_image: vllm/vllm-router@sha256:9321abfa55f5d75d1bfce51a4a9835824ef6a5c73731d6ea65b3fc5402d85354
  enable_multiple_frontends: false
  args:
    policy: consistent_hash
engine:
  type: vllm
  connector: null
health_check:
  interval_seconds: 10
  max_attempts: 360
observability:
  enabled: false
  tachometer:
    enabled: false
environment:
  HF_HUB_CACHE: /hf_hub_cache
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  AITER_TRITON_LOG_LEVEL: ERROR
  VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  OMP_NUM_THREADS: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  VLLM_USE_RUST_FRONTEND: '1'
  PYTHONUNBUFFERED: '1'
  UCX_LOG_LEVEL: info
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 4
    args:
      served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
      tensor-parallel-size: 4
      language-model-only: true
      tokenizer-mode: deepseek_v41
      tool-call-parser: deepseek_v41
      enable-auto-tool-choice: true
      enable-prompt-tokens-details: true
      reasoning-parser: deepseek_v41
      moe-backend: aiter
      gpu-memory-utilization: 0.9
      engram-config: '{"cpu_offload":false}'
      speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
      max-model-len: 1048576
      max-num-seqs: 128
      max-cudagraph-capture-size: 1024
      max-num-batched-tokens: 16384
      no-swa-bounded-replay: true
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      disable-uvicorn-access-log: true
srun_options:
  container-remap-root: ''
  container-writable: ''
sbatch_directives:
  mem: '0'
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/srt_agentic.sh
  env:
    MODEL: deepseek-ai/DeepSeek-V4.1-Flash
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    IS_MULTINODE: 'true'
    CONC: '4'
    KV_OFFLOADING: none
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
    AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
