  name: "dsv41flash-fp4-gb300-dynamo-vllm-agentx-disagg-16p1d-dep2-dep32-c10888"
  roles:
    prefill:
      nodes: 8
      workers: 16
    decode:
      nodes: 8
      gpus: 32
      env:
        VLLM_MAX_ASYNC_KV_ADMITS_PER_STEP: "5"
      args:
        data-parallel-size: 32
        eplb-config: '{"communicator":"symm_mem","num_redundant_experts":32,"window_size":1000,"step_interval":3000,"use_async":true,"log_balancedness":false,"log_balancedness_interval":3000}'
        max-num-seqs: 76
        max-num-batched-tokens: 760
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":456,"cudagraph_capture_sizes":[6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168,174,180,186,192,198,204,210,216,222,228,234,240,246,252,258,264,270,276,282,288,294,300,306,312,318,324,330,336,342,348,354,360,366,372,378,384,390,396,402,408,414,420,426,432,438,444,450,456]}'

