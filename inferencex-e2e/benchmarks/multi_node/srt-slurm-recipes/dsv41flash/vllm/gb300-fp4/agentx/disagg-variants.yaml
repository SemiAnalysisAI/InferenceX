# AgentX dsv41flash vllm gb300-fp4 recipes (Dynamo frontend + vLLM, DISAGGREGATED): shared
# settings in base, one override per benchmark point. Select one with
# CONFIG_FILE=recipes/dsv41flash/vllm/gb300-fp4/agentx/disagg-variants.yaml:override_<name>.
#
# Prefill is DEP2 instances (two per node), decode one DEP16 worker on four nodes. Every
# endpoint is vllm-rs with a native Dynamo sidecar; the frontend routes with the KV router
# and session affinity, fed by prefill KV events. The harness applies the golden
# acceptance length itself.

schema: 2

base:
  name: dsv41flash-fp4-gb300-dynamo-vllm-agentx-disagg
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: "vllm/vllm-openai:nightly-aarch64-dev-20261012-59e75f4"
    precision: fp4
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4.1-Flash
    container:
      image: "vllm/vllm-openai:nightly-aarch64-dev-20261012-59e75f4"
    frameworks:
      dynamo: "1.6.0.dev20261010"
  dynamo:
    install: true
    source:
      wheel: "1.6.0.dev20261010"
    # TCP request plane and ZMQ event plane: no broker hop at high request rates; NATS is not needed.
    request_plane: tcp
    event_plane: zmq
    sidecar: true
    sidecar_args:
      - --grpc-startup-deadline-secs
      - "3600"
      - --dyn-tool-call-parser
      - deepseek_v41
      - --dyn-reasoning-parser
      - deepseek_v41
  environment:
    PYTHONHASHSEED: "0"
  slurm:
    time_limit: "6:00:00"
  health_check:
    max_attempts: 2160
    interval_seconds: 10
  resources:
    gpu_type: "gb300"
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: "kv"
      router-session-affinity-ttl-secs: 14400
      # Every request goes prefill then decode: never let the router prefill locally on a decode rank.
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
    env:
      DYN_ROUTER_TEMPERATURE: "0"
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_LOG: warn
      DYN_TOKENIZER: "fastokens"
      DYN_TOKENIZER_CACHE: "1"
      DYN_TOKENIZER_CACHE_BYTES: "8000000000"
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
      DYN_TCP_CHANNEL_BUFFER: "128"
      DYN_TCP_REQUEST_TIMEOUT: "60"
  engine:
    type: vllm
    connector:
    dp_launch_mode: per_node
  roles:
    prefill:
      gpus: 2
      kv_events: true
      env:
        HF_HUB_CACHE: "/hf_hub_cache"
        HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
        TRANSFORMERS_CACHE: "/hf_hub_cache"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        UCX_TLS: "cuda_copy,cuda_ipc,tcp"
        UCX_CUDA_IPC_ENABLE_MNNVL: "y"
        UCX_MEMTYPE_CACHE: "n"
        UCX_MEMTYPE_REG_WHOLE: "n"
        UCX_RNDV_PIPELINE_ERROR_HANDLING: "y"
        UCX_MODULE_DIR: "/usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx"
        NIXL_UCX_SGL_ENABLE: "1"
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_connector_module_path":"vllm.distributed.kv_transfer.kv_connector.v1.nixl.push_as_nixl","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"],"enforce_handshake_compat":false,"kv_lease_duration":120}},{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":75161927680,"lazy_offload":true}}]}}'
        served-model-name: "deepseek-ai/DeepSeek-V4.1-Flash"
        language-model-only: true
        tokenizer-mode: "deepseek_v41"
        # The Dynamo frontend applies the deepseek_v41 parsers (published by the sidecar); vLLM must not parse too.
        reasoning-parser: None
        kv-cache-dtype: "fp8"
        max-model-len: 1048576
        tensor-parallel-size: 1
        enable-expert-parallel: true
        enable-cumem-allocator: true
        enable-ep-weight-filter: true
        attention-config: '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        engram-config: '{"cpu_offload":true,"embedding_across_dp":true,"use_thp":false}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","enable_adaptive_verification":false}'
        prefill-schedule-interval: 2
        gpu-memory-utilization: 0.95
        data-parallel-size: 2
        kernel-config: '{"enable_flashinfer_autotune":true,"moe_backend":"deep_gemm_mega_moe","sparse_indexer_topk_backend":"deep_select"}'
        compilation-config: '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048],"max_cudagraph_capture_size":2046}'
        max-num-seqs: 64
        max-num-batched-tokens: 16384
        long-prefill-token-threshold: 8192
        prefix-cache-retention-interval: 32768
        numa-bind: true
    decode:
      nodes: 4
      workers: 1
      gpus: 16
      env:
        HF_HUB_CACHE: "/hf_hub_cache"
        HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
        TRANSFORMERS_CACHE: "/hf_hub_cache"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        UCX_TLS: "cuda_copy,cuda_ipc,tcp"
        UCX_CUDA_IPC_ENABLE_MNNVL: "y"
        UCX_MEMTYPE_CACHE: "n"
        UCX_MEMTYPE_REG_WHOLE: "n"
        UCX_RNDV_PIPELINE_ERROR_HANDLING: "y"
        UCX_MODULE_DIR: "/usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx"
        NIXL_UCX_SGL_ENABLE: "1"
        VLLM_MAX_ASYNC_KV_ADMITS_PER_STEP: "4"
      args:
        kv-transfer-config: '{"kv_connector":"NixlConnector","kv_connector_module_path":"vllm.distributed.kv_transfer.kv_connector.v1.nixl.push_as_nixl","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"],"enforce_handshake_compat":false,"kv_lease_duration":120}}'
        served-model-name: "deepseek-ai/DeepSeek-V4.1-Flash"
        language-model-only: true
        tokenizer-mode: "deepseek_v41"
        # The Dynamo frontend applies the deepseek_v41 parsers (published by the sidecar); vLLM must not parse too.
        reasoning-parser: None
        kv-cache-dtype: "fp8"
        max-model-len: 1048576
        tensor-parallel-size: 1
        enable-expert-parallel: true
        enable-cumem-allocator: true
        enable-ep-weight-filter: true
        attention-config: '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
        engram-config: '{"cpu_offload":true,"embedding_across_dp":true,"use_thp":false}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","enable_adaptive_verification":false}'
        prefill-schedule-interval: 2
        gpu-memory-utilization: 0.95
        data-parallel-size: 16
        kernel-config: '{"enable_flashinfer_autotune":true,"moe_backend":"deep_gemm_mega_moe","sparse_indexer_topk_backend":"deep_select"}'
        enable-eplb: true
        eplb-config: '{"communicator":"symm_mem","num_redundant_experts":16,"window_size":1000,"step_interval":3000,"use_async":true,"log_balancedness":true,"log_balancedness_interval":3000}'
        no-enable-prefix-caching: true
        numa-bind: true
        numa-bind-nodes: [0, 0, 1, 1]
  sbatch_directives:
    mem: "0"
    cpus-per-task: "144"
  srun_options:
    container-remap-root: ""
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
      RESULT_DIR: "/logs/agentic"
      PORT: "8000"
      IS_MULTINODE: "true"
      MODEL: "deepseek-ai/DeepSeek-V4.1-Flash"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
      HF_HUB_CACHE: "/hf_hub_cache"

