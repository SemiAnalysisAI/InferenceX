schema: 2
name: "agg-b300-tp4-c8-mtp-kvoffload"

identity:
  model: {}
  container: {}

dynamo:
  # The image's Dynamo 1.6.0.dev20261018 includes ai-dynamo/dynamo#16005, so it
  # registers every DP rank of an attn-dp-size worker.
  install: false

health_check:
  max_attempts: 1440
  interval_seconds: 10

resources:
  gpu_type: "b300"
  gpus_per_node: 8
services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
frontend:
  type: dynamo
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Dynamo-Session-ID
  enable_multiple_frontends: false
  env:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
    DYN_NATS_REQUEST_TIMEOUT_SECS: "1800"
  args:
    router-mode: "kv"
    router-session-affinity-ttl-secs: "3600"

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 4

    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_ENABLE_PREFILL_WAR_READ_DONE: "1"

    args:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro-0813"
      enable-metrics: true
      trust-remote-code: true
      weight-loader-prefetch-checkpoints: true
      stream-interval: 10
      watchdog-timeout: 1000000
      mem-fraction-static: 0.90
      chunked-prefill-size: 8192
      max-prefill-tokens: 8192
      moe-runner-backend: "flashinfer_mxfp4"
      enable-deepseek-v4-fp4-indexer: true
      disable-flashinfer-autotune: true
      max-running-requests: 16
      cuda-graph-max-bs-decode: 16
      scheduler-recv-interval: 30
      dp-size: 1
      tp-size: 4
      ep-size: 1
      speculative-algorithm: DSPARK
      speculative-dspark-block-size: 6
      enable-hierarchical-cache: true
      hicache-ratio: 2.75
      hicache-io-backend: direct
      hicache-mem-layout: page_first_direct

sbatch_directives:
  mem: "0"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  env:
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
