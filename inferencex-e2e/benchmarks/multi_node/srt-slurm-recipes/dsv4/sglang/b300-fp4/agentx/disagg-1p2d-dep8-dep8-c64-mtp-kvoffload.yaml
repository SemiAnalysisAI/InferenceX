schema: 2
name: "disagg-b300-1p2d-dep8-dep8-c64-mtp-kvoffload"

identity:
  model: {}
  container: {}

dynamo:
  # The image's Dynamo 1.6.0.dev20261018 includes ai-dynamo/dynamo#16005, so it
  # registers every DP rank of an attn-dp-size worker.
  install: false

health_check:
  max_attempts: 1440
  interval_seconds: 10

resources:
  gpu_type: b300
  gpus_per_node: 8
services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: nats
    type: nats
    placement:
      node: dedicated
    options:
      max_payload_mb: 32
frontend:
  type: dynamo
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Dynamo-Session-ID
  enable_multiple_frontends: true
  num_additional_frontends: 4
  env:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
    DYN_TCP_REQUEST_TIMEOUT: "60"
  args:
    router-mode: "kv"
    router-session-affinity-ttl-secs: "3600"

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 8
    env:
      SGLANG_ENABLE_PREFILL_WAR_READ_DONE: "1"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
      # EFA transport of the image's Mooncake EFA wheel; every EFA NIC is auto-discovered.
      MOONCAKE_PROTOCOL: efa
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      PYTHONUNBUFFERED: '1'
      SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: '0'
      SGLANG_DG_CACHE_DIR: /configs/deepgemm_cache
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '9216'
      NCCL_CUMEM_ENABLE: '1'
      SGLANG_OPT_RELEASE_PREFILL_SWA: '1'
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
      SGLANG_LOG_FORWARD_ITERS: '1'
      SGLANG_LOG_MS: '1'
      SGLANG_NCCL_ALL_GATHER_IN_OVERLAP_SCHEDULER_SYNC_BATCH: '1'

    args:
      host: 0.0.0.0
      served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
      enable-metrics: true
      model-path: /model/
      trust-remote-code: true
      watchdog-timeout: 86400
      stream-interval: 60
      tp-size: 8
      attn-dp-size: 8
      ep-size: 8
      enable-dp-lm-head: true
      moe-dense-tp-size: 1
      moe-a2a-backend: megamoe
      enable-deepseek-v4-fp4-indexer: true
      disaggregation-transfer-backend: mooncake
      disaggregation-mode: prefill
      load-balance-method: total_tokens
      mem-fraction-static: 0.85
      swa-full-tokens-ratio: 0.02
      max-running-requests: 256
      chunked-prefill-size: 65536
      disable-flashinfer-autotune: true
      model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
      kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
      speculative-algorithm: DSPARK
      speculative-dspark-block-size: 6
      enable-hierarchical-cache: true
      hicache-write-policy: write_back
      hicache-ratio: 3
      hicache-io-backend: direct

  decode:
    nodes: 2
    workers: 2
    gpus: 8

    env:
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
      # EFA transport of the image's Mooncake EFA wheel; every EFA NIC is auto-discovered.
      MOONCAKE_PROTOCOL: efa
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      PYTHONUNBUFFERED: '1'
      SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: '0'
      SGLANG_DG_CACHE_DIR: /configs/deepgemm_cache
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '4096'
      NCCL_CUMEM_ENABLE: '1'
      SGLANG_OPT_RELEASE_PREFILL_SWA: '1'
      SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: '8'
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
      SGLANG_LOG_FORWARD_ITERS: '1'
      SGLANG_LOG_MS: '1'

    args:
      host: 0.0.0.0
      served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
      enable-metrics: true
      model-path: /model/
      trust-remote-code: true
      watchdog-timeout: 86400
      stream-interval: 60
      tp-size: 8
      attn-dp-size: 8
      ep-size: 8
      enable-dp-lm-head: true
      moe-dense-tp-size: 1
      moe-a2a-backend: megamoe
      enable-deepseek-v4-fp4-indexer: true
      disaggregation-transfer-backend: mooncake
      disaggregation-mode: decode
      load-balance-method: total_tokens
      mem-fraction-static: 0.9
      swa-full-tokens-ratio: 0.02
      max-running-requests: 128
      cuda-graph-max-bs-decode: 256
      disable-flashinfer-autotune: true
      model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
      kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5567"}'
      speculative-algorithm: DSPARK
      speculative-dspark-block-size: 6


sbatch_directives:
  mem: "0"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  env:
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
