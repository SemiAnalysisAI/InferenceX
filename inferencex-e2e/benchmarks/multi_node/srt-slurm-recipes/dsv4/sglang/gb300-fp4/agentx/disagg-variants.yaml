schema: 2

base:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-disagg
  identity:
    model: {}
    container: {}
    frameworks:
      dynamo: "1.6.0.dev20261018"
      sglang: "0.0.0.dev1+g3c560089e"
  # The image ships Dynamo 1.6.0.dev20261018.
  dynamo:
    install: false
  # Tachometer's per-node exporters slow decode steps; InferenceX does not read its output.
  observability:
    tachometer:
      enabled: false
  slurm:
    time_limit: "6:00:00"
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: dedicated
    - name: nats
      type: nats
      placement:
        node: dedicated
      options:
        max_payload_mb: 32
    # Disables Dynamo's per-request lifecycle span export; InferenceX does not read it.
    - name: otel-collector
      type: otel-collector
      enabled: false
  frontend:
    type: dynamo
    nginx_session_affinity: true
    nginx_session_affinity_header: X-Dynamo-Session-ID
    enable_multiple_frontends: true
    num_additional_frontends: 4
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    # Paired with decode load-balance-method: total_requests.
    args:
      router-mode: round-robin
      router-replica-sync: true
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine: sglang
  roles:
    prefill:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        PYTHONUNBUFFERED: "1"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
        DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
        SGLANG_LOG_FORWARD_ITERS: "1"
        SGLANG_LOG_MS: "1"
        SGLANG_DEFAULT_THINKING: "1"
        SGLANG_DSV4_REASONING_EFFORT: high
        SGLANG_DSV4_MHC_PREWARM: "1"
        SGLANG_RAGGED_VERIFY_MODE: static
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
        SGLANG_REQUEST_STATE_WAIT_TIMEOUT: "60"
        SGLANG_ENABLE_PREFILL_WAR_READ_DONE: "1"
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: "0"
        SGLANG_JIT_DEEPGEMM_PRECOMPILE: "1"
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        SGLANG_NCCL_ALL_GATHER_IN_OVERLAP_SCHEDULER_SYNC_BATCH: "1"
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "17408"
        SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"
        SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
        SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: "1"
        SGLANG_OPT_USE_ONLINE_COMPRESS: "0"
        SGLANG_PP_LAYER_PARTITION: 8,8,8,8,8,8,7,6
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        MC_FORCE_MNNVL: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_TIMEOUT: "100000"
        NCCL_MNNVL_UUID_QUERY_TIMEOUT: "100000"
        NVSHMEM_REMOTE_TRANSPORT: none
        WITH_NVIDIA_PEERMEM: "0"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        watchdog-timeout: 86400
        stream-interval: 60
        enable-metrics: true
        enable-cache-report: true
        tensor-parallel-size: 1
        pipeline-parallel-size: 8
        moe-a2a-backend: megamoe
        enable-deepseek-v4-fp4-indexer: true
        # W4A4 MegaMoE for the target model; the DSpark draft MoE stays W4A8.
        enable-w4a4-mxfp4-megamoe: true
        no-speculative-enable-w4a4-mxfp4-megamoe: true
        disaggregation-transfer-backend: mooncake
        mem-fraction-static: 0.88
        page-size: 256
        swa-full-tokens-ratio: 0.02
        chunked-prefill-size: 16384
        max-running-requests: 256
        enable-hierarchical-cache: true
        hicache-ratio: 2
        hicache-write-policy: write_back
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        disable-flashinfer-autotune: true
        gc-threshold: [100000, 50, 100]
        gc-warning-threshold-secs: 0.2
        model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
        weight-loader-prefetch-checkpoints: true
        weight-loader-drop-cache-after-load: false
        router-mode: kv
        router-replica-sync: true
        router-session-affinity-ttl-secs: "3600"
        active-decode-blocks-threshold: "None"
        active-prefill-tokens-threshold: "None"
        active-prefill-tokens-threshold-frac: "None"
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 6
        speculative-num-steps: 1
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
      kv_events: true
    decode:
      nodes: 4
      workers: 1
      gpus: 16
      env:
        PYTHONUNBUFFERED: "1"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
        DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
        SGLANG_LOG_FORWARD_ITERS: "1"
        SGLANG_LOG_MS: "1"
        SGLANG_DEFAULT_THINKING: "1"
        SGLANG_DSV4_REASONING_EFFORT: high
        SGLANG_RAGGED_VERIFY_MODE: static
        SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: "8"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
        SGLANG_REQUEST_STATE_WAIT_TIMEOUT: "60"
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: "0"
        SGLANG_JIT_DEEPGEMM_PRECOMPILE: "1"
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
        SGLANG_OPT_DEEPGEMM_MEGA_MOE: "1"
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "4096"
        SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"
        SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
        SGLANG_OPT_USE_ONLINE_COMPRESS: "0"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        MC_FORCE_MNNVL: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_TIMEOUT: "100000"
        NCCL_MNNVL_UUID_QUERY_TIMEOUT: "100000"
        NVSHMEM_REMOTE_TRANSPORT: none
        WITH_NVIDIA_PEERMEM: "0"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        watchdog-timeout: 86400
        stream-interval: 60
        enable-metrics: true
        enable-cache-report: true
        tensor-parallel-size: 16
        data-parallel-size: 16
        expert-parallel-size: 16
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-dense-tp-size: 1
        moe-a2a-backend: megamoe
        enable-deepseek-v4-fp4-indexer: true
        enable-w4a4-mxfp4-megamoe: true
        no-speculative-enable-w4a4-mxfp4-megamoe: true
        disaggregation-transfer-backend: mooncake
        load-balance-method: total_requests
        mem-fraction-static: 0.88
        page-size: 256
        swa-full-tokens-ratio: 0.02
        max-running-requests: 3072
        cuda-graph-max-bs-decode: 256
        disable-flashinfer-autotune: true
        gc-threshold: [100000, 50, 100]
        gc-warning-threshold-secs: 0.2
        model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
        weight-loader-prefetch-checkpoints: true
        weight-loader-drop-cache-after-load: false
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 6
        speculative-num-steps: 1
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
      kv_events: true
  sbatch_directives:
    mem: "0"
    exclusive: ""
  srun_options:
    container-remap-root: ""
  # The replay client shares the etcd/NATS node instead of a worker node.
  benchmark:
    placement:
      node: dedicated
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      # The client splits this value on whitespace, so it has none.
      AIPERF_EXTRA_INPUTS: '{"chat_template_kwargs":{"reasoning_effort":"high","thinking":true},"temperature":1}'
      AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
      AIPERF_DATASET_MMAP_CACHE_ENABLED: "true"
      AGENTIC_WARMUP_GRACE_PERIOD: "3600"

override_1p1d_pp8_dep16_kv:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-disagg-1p1d-pp8-dep16-kv
  frontend:
    args:
      router-mode: kv
  roles:
    decode:
      args:
        load-balance-method: total_tokens

override_1p1d_pp8_dep16_c300:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-disagg-1p1d-pp8-dep16-c300

override_2p1d_pp8_dep16_c720:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-disagg-2p1d-pp8-dep16-c720
  roles:
    prefill:
      nodes: 4
      workers: 2
      args:
        speculative-dspark-block-size: 5
        speculative-num-draft-tokens: 6
    decode:
      args:
        speculative-dspark-block-size: 5
        speculative-num-draft-tokens: 6

override_2p1d_pp8_dep12_c800:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-disagg-2p1d-pp8-dep12-c800
  roles:
    prefill:
      nodes: 4
      workers: 2
      args:
        speculative-dspark-block-size: 5
        speculative-num-draft-tokens: 6
    decode:
      nodes: 3
      gpus: 12
      args:
        tensor-parallel-size: 12
        data-parallel-size: 12
        expert-parallel-size: 12
        speculative-dspark-block-size: 5
        speculative-num-draft-tokens: 6

override_2p1d_pp8_dep8_c880:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-disagg-2p1d-pp8-dep8-c880
  roles:
    prefill:
      nodes: 4
      workers: 2
      args:
        speculative-dspark-block-size: 4
        speculative-num-draft-tokens: 5
    decode:
      nodes: 2
      gpus: 8
      args:
        tensor-parallel-size: 8
        data-parallel-size: 8
        expert-parallel-size: 8
        speculative-dspark-block-size: 4
        speculative-num-draft-tokens: 5
