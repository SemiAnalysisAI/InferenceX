# AgentX dsv4 sglang gb300-fp4 recipes: shared settings in base, one
# override per benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsv4/sglang/gb300-fp4/agentx/disagg-variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: "deepseek-v4-pro-0813"
    container: "dynamo-sglang"
    precision: "fp4"
  identity:
    model:
      repo: "deepseek-ai/DeepSeek-V4-Pro-0813"
    container:
      image: "lmsysorg/sglang:nightly-dev-cu13-20260916-c9a8fba9"
  dynamo:
    install: true
    source:
      wheel: "1.5.0.dev20260914"
  slurm:
    time_limit: "8:00:00"
  health_check:
    max_attempts: 1440
    interval_seconds: 10

  # Tachometer's per-node exporters slow decode steps by a few percent and add
  # host memory on the head node; this ladder is a throughput measurement.
  observability:
    tachometer:
      enabled: false
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: dedicated
    - name: nats
      type: nats
      placement:
        node: dedicated
      options:
        max_payload_mb: 32
    - name: mooncake-master
      type: mooncake-master
      args:
        - --eviction_high_watermark_ratio=0.90
    # Decode ranks use a chunk cache, so their host DRAM only joins the store
    # through standalone stores: four per decode node, so segments stay uniform
    # with prefill's per-rank ones instead of one oversized segment per node.
    - &decode-store
      name: store-decode-0
      type: mooncake-store
      placement:
        node: decode
      args: ["--port", "8800"]
      env:
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 180gb
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      preamble: |
        ulimit -n 1048576
        ulimit -l unlimited
      readiness:
        port: 8800
    - <<: *decode-store
      name: store-decode-1
      args: ["--port", "8801"]
      readiness:
        port: 8801
    - <<: *decode-store
      name: store-decode-2
      args: ["--port", "8802"]
      readiness:
        port: 8802
    - <<: *decode-store
      name: store-decode-3
      args: ["--port", "8803"]
      readiness:
        port: 8803
  frontend:
    type: dynamo
    nginx_session_affinity: true
    nginx_session_affinity_header: X-Dynamo-Session-ID
    enable_multiple_frontends: true
    num_additional_frontends: 4
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    args:
      router-mode: "kv"
      router-session-affinity-ttl-secs: "3600"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine: sglang
  roles:
    prefill:
      env:
        SGLANG_ENABLE_PREFILL_WAR_READ_DONE: "1"
        SGLANG_RAGGED_VERIFY_MODE: "static"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
        SGLANG_DSV4_MHC_PREWARM: '1'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: '0'
        SGLANG_DG_CACHE_DIR: /configs/deepgemm_cache
        SGLANG_JIT_DEEPGEMM_PRECOMPILE: '1'
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV4_REASONING_EFFORT: high
        SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
        SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: '1'
        SGLANG_OPT_USE_DEEPGEMM_MEGA_MOE: '1'
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '17408'
        SGLANG_OPT_USE_ONLINE_COMPRESS: '0'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        MC_FORCE_MNNVL: '1'
        NCCL_TIMEOUT: '100000'
        NCCL_MNNVL_UUID_QUERY_TIMEOUT: '100000'
        SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: '1'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
        DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
        SGLANG_LOG_FORWARD_ITERS: '1'
        SGLANG_LOG_MS: '1'
        SGLANG_REQUEST_STATE_WAIT_TIMEOUT: '60'
        SGLANG_NCCL_ALL_GATHER_IN_OVERLAP_SCHEDULER_SYNC_BATCH: '1'
        MOONCAKE_PROTOCOL: rdma
        # The store only registers host buffers on RDMA; without an explicit list it
        # falls back to NVLink for same-domain peers and aborts at the warmup put.
        MOONCAKE_DEVICE: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 140gb
        MOONCAKE_STANDALONE_STORAGE: '0'
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        WITH_NVIDIA_PEERMEM: '0'
      args:
        host: 0.0.0.0
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        enable-metrics: true
        enable-cache-report: true
        model-path: /model/
        trust-remote-code: true
        watchdog-timeout: 86400
        stream-interval: 60
        tp-size: 8
        dp-size: 8
        ep-size: 8
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-dense-tp-size: 1
        moe-a2a-backend: megamoe
        enable-deepseek-v4-fp4-indexer: true
        enable-w4a4-mxfp4-megamoe: true
        disaggregation-transfer-backend: mooncake
        disaggregation-mode: prefill
        load-balance-method: total_tokens
        # 16k-token chunks per DP rank need ~12 GiB more for the DSV4 indexer.
        mem-fraction-static: 0.8
        page-size: 256
        swa-full-tokens-ratio: 0.02
        chunked-prefill-size: 131072
        disable-flashinfer-autotune: true
        model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
        kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 6
        speculative-num-steps: 1
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mooncake
        hicache-storage-backend-extra-config: '{"enable_group_semantics":true}'
    decode:
      nodes: 4
      workers: 1
      env:
        SGLANG_RAGGED_VERIFY_MODE: "static"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: '0'
        SGLANG_DG_CACHE_DIR: /configs/deepgemm_cache
        SGLANG_JIT_DEEPGEMM_PRECOMPILE: '1'
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV4_REASONING_EFFORT: high
        SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
        SGLANG_OPT_DEEPGEMM_MEGA_MOE: '1'
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '4096'
        SGLANG_OPT_USE_ONLINE_COMPRESS: '0'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        MC_FORCE_MNNVL: '1'
        NCCL_TIMEOUT: '100000'
        NCCL_MNNVL_UUID_QUERY_TIMEOUT: '100000'
        SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: '1'
        SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: '8'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
        DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
        SGLANG_LOG_FORWARD_ITERS: '1'
        SGLANG_LOG_MS: '1'
        SGLANG_REQUEST_STATE_WAIT_TIMEOUT: '60'
        MOONCAKE_PROTOCOL: rdma
        # The store only registers host buffers on RDMA; without an explicit list it
        # falls back to NVLink for same-domain peers and aborts at the warmup put.
        MOONCAKE_DEVICE: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        WITH_NVIDIA_PEERMEM: '0'
      args:
        host: 0.0.0.0
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        enable-metrics: true
        enable-cache-report: true
        model-path: /model/
        trust-remote-code: true
        watchdog-timeout: 86400
        stream-interval: 60
        tp-size: 16
        dp-size: 16
        ep-size: 16
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-dense-tp-size: 1
        moe-a2a-backend: megamoe
        enable-deepseek-v4-fp4-indexer: true
        enable-w4a4-mxfp4-megamoe: true
        disaggregation-transfer-backend: mooncake
        disaggregation-mode: decode
        load-balance-method: total_tokens
        mem-fraction-static: 0.9
        page-size: 256
        swa-full-tokens-ratio: 0.02
        max-running-requests: 3072
        disable-flashinfer-autotune: true
        model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
        kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5567"}'
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 6
        speculative-num-steps: 1
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
  sbatch_directives:
    mem: "0"
    cpus-per-task: "144"
  srun_options:
    mem: "0"
    container-remap-root: ""
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    # The replay client holds ~300 GB of host memory; on the default head node it
    # shares prefill_0's node and OOMs it. Put it on the etcd/nats node instead.
    placement:
      node: dedicated
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: "8000"
      IS_MULTINODE: "true"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
      HF_HUB_CACHE: "/hf_hub_cache"

# Agentic-coding SGLang disaggregated Pareto recipe for DeepSeek-V4-Pro on GB300
# (2P x DEP8 / 4D x DEP16, DSpark K=6 + hierarchical-cache KV offload), tuned for concurrency 480.
#
# Uses the flat single-variant srtctl schema the agentic CI flow expects;
# resources + backend (prefill/decode env + sglang_config) are normalized
# from the Pareto run.
# Concurrency is exported into srt_agentic.sh from the master-config conc-list.
override_1p1d_c480:
  name: "disagg-gb300-2p4d-dep8-dep16-c480-mtp-kvoffload"
  roles:
    prefill:
      nodes: 2
      workers: 1
      gpus: 8
      args:
        max-running-requests: 256
        cuda-graph-max-bs-decode: 256
    decode:
      gpus: 16
      args:
        cuda-graph-max-bs-decode: 256

# Agentic-coding SGLang disaggregated recipe for DeepSeek-V4-Pro on GB300
# (4P x DEP8 / 4D x DEP16, DSpark K=6 + hierarchical-cache KV offload), tuned for concurrency 960.
#
# DEP8-prefill variant aligned with the measured Pareto point: prefill uses
# tp/dp/ep 8, four nodes, and SGLANG_DSV4_MHC_PREWARM=1.
# Concurrency is exported into srt_agentic.sh
# from the master-config conc-list.
override_2p1d_c960:
  name: "disagg-gb300-4p4d-dep8-dep16-c960-mtp-kvoffload"
  roles:
    prefill:
      nodes: 4
      workers: 2
      env:
        OMP_NUM_THREADS: '1'
      args:
        max-running-requests: 256
        cuda-graph-max-bs-decode: 256
    decode:
      env:
        OMP_NUM_THREADS: '1'
        SGLANG_DSV4_MHC_PREWARM: '1'
      args:
        cuda-graph-max-bs-decode: 256

# Agentic-coding SGLang disaggregated Pareto recipe for DeepSeek-V4-Pro on GB300
# (6P x DEP8 / 4D x DEP16, DSpark K=6 + hierarchical-cache KV offload), tuned for concurrency 1440.
#
# Uses the flat single-variant srtctl schema the agentic CI flow expects;
# resources + backend (prefill/decode env + sglang_config) are normalized
# from the Pareto run.
# Concurrency is exported into srt_agentic.sh from the master-config conc-list.
override_3p1d_c1440:
  name: "disagg-gb300-6p4d-dep8-dep16-c1440-mtp-kvoffload"
  roles:
    prefill:
      nodes: 6
      workers: 3
      gpus: 8
      args:
        max-running-requests: 512
        cuda-graph-max-bs-decode: 512
    decode:
      gpus: 16
      args:
        cuda-graph-max-bs-decode: 512

# Agentic-coding SGLang disaggregated Pareto recipe for DeepSeek-V4-Pro on GB300
# (8P x DEP8 / 4D x DEP16, DSpark K=6 + hierarchical-cache KV offload), tuned for concurrency 1920.
#
# Uses the flat single-variant srtctl schema the agentic CI flow expects;
# resources + backend (prefill/decode env + sglang_config) are normalized
# from the Pareto run.
# Concurrency is exported into srt_agentic.sh from the master-config conc-list.
override_4p1d_c1920:
  name: "disagg-gb300-8p4d-dep8-dep16-c1920-mtp-kvoffload"
  frontend:
    nginx_keepalive_timeout: "900s"
    env:
      # AgentX warmup can legitimately keep the single wide decode worker busy
      # for longer than Dynamo's 10-second TCP request-plane default.
      DYN_TCP_REQUEST_TIMEOUT: "60"
  roles:
    prefill:
      nodes: 8
      workers: 4
      gpus: 8
      env:
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
      args:
        max-running-requests: 1024
        cuda-graph-max-bs-decode: 1024
    decode:
      gpus: 16
      env:
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
      args:
        cuda-graph-max-bs-decode: 192
  benchmark:
    env:
      AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
