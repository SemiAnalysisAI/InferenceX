schema: 2

base:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-agg
  identity:
    model: {}
    container: {}
    frameworks:
      dynamo: "1.6.0.dev20261018"
      sglang: "0.0.0.dev1+g3c560089e"
  # The image ships Dynamo 1.6.0.dev20261018.
  dynamo:
    install: false
  # Tachometer's per-node exporters slow decode steps; InferenceX does not read its output.
  observability:
    tachometer:
      enabled: false
  slurm:
    time_limit: "4:00:00"
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
    # Disables Dynamo's per-request lifecycle span export; InferenceX does not read it.
    - name: otel-collector
      type: otel-collector
      enabled: false
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      DYN_NATS_REQUEST_TIMEOUT_SECS: "1800"
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: "3600"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine: sglang
  roles:
    agg:
      workers: 1
      env:
        PYTHONUNBUFFERED: "1"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        SGLANG_DEFAULT_THINKING: "1"
        SGLANG_DSV4_REASONING_EFFORT: high
        SGLANG_RAGGED_VERIFY_MODE: static
        SGLANG_ENABLE_PREFILL_WAR_READ_DONE: "1"
        SGLANG_JIT_DEEPGEMM_PRECOMPILE: "1"
        SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
        SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: "1"
        SGLANG_OPT_USE_ONLINE_COMPRESS: "0"
        SGLANG_OPT_USE_JIT_INDEXER_METADATA: "1"
        SGLANG_OPT_USE_JIT_NORM: "1"
        SGLANG_OPT_USE_TOPK_V2: "True"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        watchdog-timeout: 1000000
        stream-interval: 10
        enable-metrics: true
        enable-cache-report: true
        data-parallel-size: 1
        expert-parallel-size: 1
        moe-runner-backend: flashinfer_mxfp4
        enable-deepseek-v4-fp4-indexer: true
        page-size: 256
        swa-full-tokens-ratio: 0.1
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        max-running-requests: 4
        cuda-graph-max-bs-decode: 4
        scheduler-recv-interval: 30
        disable-flashinfer-autotune: true
        model-loader-extra-config: '{"enable_multithread_load":true}'
        weight-loader-prefetch-checkpoints: true
        weight-loader-drop-cache-after-load: false
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 6
        speculative-num-steps: 1
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
  sbatch_directives:
    mem: "0"
    exclusive: ""
  srun_options:
    container-remap-root: ""
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      # The client splits this value on whitespace, so it has none.
      AIPERF_EXTRA_INPUTS: '{"chat_template_kwargs":{"reasoning_effort":"high","thinking":true},"temperature":1}'
      AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
      AIPERF_DATASET_MMAP_CACHE_ENABLED: "true"
      AGENTIC_WARMUP_GRACE_PERIOD: "3600"

override_tp8_c1:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-agg-tp8-c1
  roles:
    agg:
      nodes: 2
      gpus: 8
      args:
        tensor-parallel-size: 8
        mem-fraction-static: 0.94

override_tp4:
  name: dsv4-fp4-gb300-dynamo-sglang-agentx-agg-tp4
  frontend:
    env:
      DYN_ROUTER_TEMPERATURE: "0"
      DYN_TOKENIZER: fastokens
      DYN_TOKENIZER_CACHE: "1"
      DYN_TOKENIZER_CACHE_BYTES: "8000000000"
    args:
      router-session-affinity-ttl-secs: "14400"
  roles:
    agg:
      nodes: 1
      gpus: 4
      args:
        tensor-parallel-size: 4
        mem-fraction-static: 0.92
