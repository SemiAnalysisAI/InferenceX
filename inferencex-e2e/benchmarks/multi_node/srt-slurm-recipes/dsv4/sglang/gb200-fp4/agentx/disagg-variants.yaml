        tp-size: 16
        dp-size: 16
        ep-size: 16
        mem-fraction-static: 0.85
        hicache-ratio: 2
    decode:
      nodes: 8
      gpus: 32
      env:
        SGLANG_DSV4_MHC_PREWARM: '1'
      args:
