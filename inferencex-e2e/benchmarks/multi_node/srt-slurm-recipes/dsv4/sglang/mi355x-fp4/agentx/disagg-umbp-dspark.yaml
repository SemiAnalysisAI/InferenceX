# DeepSeek-V4-Pro-0813 AgentX on MI355X: 1P1D SGLang disaggregation over MoRI
# with DSpark. Every arm offloads prefill KV to UMBP as a direct external store
# for the unified radix tree (no host cache tier), backed by a 1.5 TB
# hugepage DRAM tier on the prefill node.
base:
  name: mi355x-dsv4-pro-0813-agentx-umbp
  model:
    path: DeepSeek-V4-Pro-0813
    container: lmsysorg/sglang-rocm:v0.5.21-rocm724-mi35x-20261001
    precision: fp4
  slurm:
    time_limit: "08:00:00"
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang-router
    enable_multiple_frontends: false
    args:
      policy: consistent_hashing
      dp-aware: true
      # The agentic PD path ran --decode-policy round_robin before #3428; the
      # port dropped it, which silently applies --policy (consistent_hashing)
      # to decode as well.
      decode-policy: round_robin
      cache-threshold: 0.3
      balance-abs-threshold: 2
      balance-rel-threshold: 1.1
      disable-circuit-breaker: true
      health-failure-threshold: 100
      health-check-timeout-secs: 600
      health-check-interval-secs: 30
  engine: sglang
  # A recipe host_setup replaces the cluster default, so run its fabric, GPU and
  # hugepage-reclaim checks first. Then reserve the UMBP tier's hugepages on the
  # prefill node (the allocation's first node in 1P1D) so the tier never falls
  # back to 4 KiB pages; teardown returns them for the next job.
  host_setup:
    nodes: workers
    timeout_seconds: 1800
    commands:
      - IBDEVICES=rdma0,rdma1,rdma2,rdma3,rdma4,rdma5,rdma6,rdma7 bash "${GITHUB_WORKSPACE}/runners/srt-slurm/hooks/mi355x-amds/setup.sh"
      - >-
        if [[ "$(hostname -s)" == "$(scontrol show hostnames "$SLURM_JOB_NODELIST" | head -n 1)" ]]; then
        page_kb=$(awk '/^Hugepagesize:/ {print $2}' /proc/meminfo);
        pages=$(( (1500000000000 / (page_kb * 1024) + 1) * 102 / 100 ));
        HUGEPAGES_TARGET=$pages HUGEPAGE_GROW_TOLERANCE_PCT=1
        bash "${GITHUB_WORKSPACE}/runners/srt-slurm/hooks/mi355x-amds/hugepage_sanity.sh"; fi
    teardown:
      - HUGEPAGES_TARGET=0 bash "${GITHUB_WORKSPACE}/runners/srt-slurm/hooks/mi355x-amds/hugepage_sanity.sh"
  # The per-allocation /logs mount is shared by the service and prefill
  # containers, so the socket cannot collide with another job's UMBP.
  services:
    - name: umbp
      type: generic
      placement:
        node: prefill
      start: before_workers
      critical: true
      inherit_discovery_env: false
      command:
        - /sgl-workspace/mori/python/mori/umbp_standalone_server
        - unix:///logs/umbp.sock
      env:
        HSA_NO_SCRATCH_RECLAIM: "0"
        GPU_MAX_HW_QUEUES: "5"
        UMBP_DRAM_CAPACITY: "1500000000000"
        UMBP_DRAM_USE_HUGEPAGES: "1"
        UMBP_SSD_ENABLED: "0"
        MORI_UMBP_LOG_LEVEL: info
      preamble: |
        host_gb=$(awk '/^MemTotal:/ {printf "%d", $2 / 1000000}' /proc/meminfo)
        if (( UMBP_DRAM_CAPACITY / 1000000000 > host_gb / 2 )); then
          echo "UMBP capacity exceeds half of host memory" >&2
          exit 1
        fi
        export LD_LIBRARY_PATH="/sgl-workspace/mori/python/mori:${LD_LIBRARY_PATH}"
      readiness:
        # Wait for GPU registration of the tier, not merely a listening socket.
        log:
          pattern: host memory registered for GPU access
        timeout_seconds: 5400
        interval_seconds: 1
  roles:
    prefill:
      nodes: 1
      workers: 1
      env: &environment
        HF_HOME: /hf_hub_cache
        HF_HUB_CACHE: /hf_hub_cache/hub
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache/hub
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONUNBUFFERED: "1"
        PYTHONPATH: /sgl-workspace/aiter
        TORCH_NCCL_BLOCKING_WAIT: "1"
        NCCL_BLOCKING_WAIT: "1"
        NCCL_IB_HCA: rdma3,rdma0,rdma2,rdma1,rdma7,rdma4,rdma6,rdma5
        GLOO_SOCKET_IFNAME: eno0
        NCCL_SOCKET_IFNAME: eno0
        AITER_LOG_LEVEL: ERROR
        HSA_NO_SCRATCH_RECLAIM: "0"
        GPU_MAX_HW_QUEUES: "2"
        SGLANG_AITER_MLA_PERSIST: "0"
        SGLANG_ENABLE_UNIFIED_RADIX_TREE: "1"
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
        SGLANG_MORI_DISPATCH_DTYPE: auto
        SGLANG_MORI_DISPATCH_INTER_KERNEL_SWITCH_THRESHOLD: "4096"
        SGLANG_MORI_RECV_BOUND: "1"
        SGLANG_DEFAULT_THINKING: "1"
        SGLANG_DSV4_REASONING_EFFORT: high
        SGLANG_USE_AITER: "1"
        SGLANG_USE_ROCM700A: "0"
        SGLANG_HACK_FLASHMLA_BACKEND: unified_kv_triton
        SGLANG_OPT_USE_AITER_INDEXER: "true"
        SGLANG_OPT_FP8_WO_A_FUSED_INVROPE: "1"
        SGLANG_OPT_USE_AITER_BATCHED_GEMM: "1"
        AITER_BF16_FP8_MOE_BOUND: "0"
        TORCH_BLAS_PREFER_HIPBLASLT: "1"
        IBDEVICES: rdma3,rdma0,rdma2,rdma1,rdma7,rdma4,rdma6,rdma5
        MORI_RDMA_TC: "104"
        MORI_IO_TC: "104"
        MORI_IO_SQ_BACKOFF_TIMEOUT_US: "500000"
        MORI_IO_QP_MAX_SEND_WR: "32767"
        MORI_IO_QP_MAX_CQE: "32768"
        MORI_IO_QP_MAX_SGE: "2"
        MORI_IO_TC_DISABLE: "0"
        MORI_SHMEM_MODE: ISOLATION
        MORI_EP_LAUNCH_CONFIG_MODE: AUTO
        MORI_APP_LOG_LEVEL: WARNING
        SGLANG_MORI_COMBINE_DTYPE: auto
        SGLANG_MORI_QP_PER_TRANSFER: "4"
        SGLANG_MORI_NUM_WORKERS: "4"
        MORI_MAX_DISPATCH_TOKENS_PREFILL: "8192"
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "16384"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
        SGLANG_HEALTH_CHECK_TIMEOUT: "600"
        SGLANG_ENABLE_SPEC_V2: "1"
        SGLANG_ENABLE_OVERLAP_PLAN_STREAM: "0"
        SGLANG_LOG_MS: "true"
        SGLANG_DISAGGREGATION_NUM_PRE_ALLOCATE_REQS: "32"
        SGLANG_ROUTER_STDOUT_LOGS: "0"
        UMBP_STANDALONE_ADDRESS: unix:///logs/umbp.sock
      args: &server
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        tp-size: 8
        enable-deepseek-v4-fp4-indexer: true
        watchdog-timeout: 3600
        load-balance-method: round_robin
        kv-cache-dtype: fp8_e4m3
        attention-backend: dsv4
        page-size: 256
        swa-full-tokens-ratio: 0.1
        enforce-shared-experts-fusion: true
        tool-call-parser: deepseekv4
        reasoning-parser: deepseek-v4
        disaggregation-transfer-backend: mori
        disaggregation-ib-device: rdma3,rdma0,rdma2,rdma1,rdma7,rdma4,rdma6,rdma5
        tokenizer-worker-num: 8
        stream-interval: 20
        log-level: info
        log-level-http: error
        speculative-algorithm: DSPARK
        speculative-eagle-topk: 1
        speculative-num-steps: 1
        context-length: 1048576
        enable-metrics: true
        disable-cuda-graph: true
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mori
        hicache-storage-backend-extra-config: '{"standalone_startup_timeout_ms":120000}'
        enable-cache-report: true
        # Optimistic prefill (sgl-project/sglang#38978) is wired for the linker only.
        optimistic-prefill-attempts: 2
    decode:
      nodes: 1
      workers: 1
      env:
        <<: *environment
        # Decode runs no UMBP tier; offload is prefill-side.
        UMBP_STANDALONE_ADDRESS: ""
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "128"
        SGLANG_SIMULATE_ACC_METHOD: match-expected
        SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
        SGLANG_SIMULATE_ACC_GREEDY: "0"
      args:
        <<: *server
        disable-cuda-graph: false
        # The anchor carries prefill's UMBP linker flags, which the pre-#3428
        # launcher appended to PREFILL_SERVER_CONFIG alone (server_sglang.sh:
        # "decode does not read this"). Decode runs no UMBP tier -- its
        # UMBP_STANDALONE_ADDRESS is empty above -- so enabling the linker here
        # points it at nothing. false and null both emit no flag at all.
        enable-unified-cache-external-linker: false
        unified-cache-external-linker-backend: null
        hicache-storage-backend-extra-config: null
        enable-cache-report: false
        optimistic-prefill-attempts: null
  sbatch_directives:
    cpus-per-task: "128"
    mem: "0"
  srun_options:
    mem: "0"
    container-writable: ""
    container-remap-root: ""
  health_check:
    max_attempts: 720
    interval_seconds: 5
  benchmark:
    type: custom
    container_image: lmsysorg/sglang-rocm:v0.5.19-rocm720-mi35x-20260907
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      # The MI355X launcher collects results from the job workspace.
      RESULT_DIR: /infmax-workspace/LOGS/agentic
      AGENTIC_OUTPUT_DIR: /infmax-workspace
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache/hub
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_VERBOSITY: error
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126

# One variant per point; each point runs in its own allocation. Admission is
# 2x CONC on both roles. Decode captures graphs up to 2x CONC, or CONC/4 per
# rank under DP attention. DSpark draft length is 6 at c4/c16/c32 (the golden
# AL peak) and 3 above; MoRI decode dispatch scales with it (64 x (draft + 1)).
override_c4:
  roles:
    prefill:
      gpus: 4
      env:
        # Split-K 8 for the HCA (compress ratio 128) decode stream in the
        # unified_kv kernels, over the image default 4. Only c4 sets it.
        SGLANG_MLA_HCA_KV_SPLITS: "8"
      args:
        tp-size: 4
        mem-fraction-static: 0.86
        chunked-prefill-size: 16384
        max-running-requests: 8
        speculative-dspark-block-size: 6
        speculative-num-draft-tokens: 7
    decode:
      gpus: 4
      env:
        SGLANG_MLA_HCA_KV_SPLITS: "8"
        MORI_MAX_DISPATCH_TOKENS_DECODE: "448"
      args:
        tp-size: 4
        mem-fraction-static: 0.86
        max-running-requests: 8
        cuda-graph-bs-decode:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
        speculative-dspark-block-size: 6
        speculative-num-draft-tokens: 7
  benchmark:
    env:
      CONC: '4'

