# MegaMoE prefill on the DP-attention arm, with the fp8 unified KV pool, at
# c384/c512. Prefill moves its MoE off mori dispatch/combine onto Aiter
# MegaMoEv2 (DEP8); decode stays on the EP1 baseline path these arms already
# use, so the two roles differ only in the MoE backend and the memory the mori
# heap takes. Sizing follows c192/c256: admission is 2x CONC on both roles and
# decode captures graphs up to 2x CONC / dp-size.

override_c384:
  frontend:
    args:
      # The gateway's 1800 s default aborts every request still waiting on an
      # overloaded prefill at once, which these two points hit during warmup.
      # An abort that lands mid-RDMA-write strands the mori TransferStatus and
      # wedges that prefill DP's transfers for good (sglang
      # disaggregation/mori/conn.py, _process_transfer_chunk). 14400 matches
      # the single-node agentic recipes.
      request-timeout-secs: 14400
  roles:
    prefill:
      gpus: 8
      env:
        GPU_MAX_HW_QUEUES: "5"
        # Aiter MegaMoEv2 (sgl-project/sglang#35619). The megamoe a2a backend
        # alone only selects the hook; without this flag it falls through to
        # the DeepGEMM path, which has no ROCm kernel. The flag is not
        # backend-local -- schedule_batch.py also keys the SWA eviction cadence
        # off it -- so it stays off the decode role entirely.
        SGLANG_AMD_USE_FLYDSL_MEGA_MOE: "1"
        # Must cover the per-rank prefill chunk: sglang divides
        # chunked-prefill-size by dp-size, i.e. 65536 / 8. Tokens past MTPR
        # silently fall back to fused MoE.
        SGLANG_AMD_FLYDSL_MEGA_MOE_MTPR: "8192"
        SGLANG_AMD_FLYDSL_MEGA_QUANT: a8w4
        # MegaMoEV2 addresses its dispatch/combine buffers through mori's
        # symmetric heap. base's ISOLATION mode builds no heap at all, so every
        # rank logs "Pointer ... is not in symmetric heap [0x0, 0x0)" and then
        # faults on a near-null address in mega_moe_stage1.
        MORI_SHMEM_MODE: STATIC_HEAP
        # hipMalloc'd in full on the first MegaMoE forward, after the KV pool is
        # sized, so every byte comes out of the (1 - mem-fraction-static)
        # headroom whether used or not. MegaMoEV2 places ~0.51 GiB per 1024
        # MTPR in it (mega_moe/flydsl_dispatch_combine_intranode_op.py), i.e.
        # 4.2 GiB at MTPR 8192; mori's 4 GiB default overflows at graph
        # capture. 8G is 1.9x that.
        MORI_SHMEM_HEAP_SIZE: 8G
        # MoE communication belongs to mori under MegaMoE; leaving the DP
        # gatherv / reduce-scatter path on runs two comm schemes at once.
        # Decode, which keeps the baseline MoE path, keeps them set.
        SGLANG_SHARED_EXPERT_TP1: "0"
        SGLANG_DP_SHARED_EXPERT_LOCAL: "0"
        SGLANG_DP_USE_GATHERV: "0"
        SGLANG_DP_USE_REDUCE_SCATTER: "0"
        # Two parallel KV pools -- nope in fp8, rope kept in bf16 -- instead of
        # one bf16 pool, on the unified_kv_triton kernels base selects. The
        # layout only matches those kernels, and both PD peers must agree on it
        # or the handshake fails, so it is set on prefill and decode alike. The
        # DSpark draft worker stays bf16 (kv_cache_configurator.py excludes it).
        SGLANG_DSV4_UNIFIED_KV_FP8: "1"
      args:
        tp-size: 8
        dp-size: 8
        # MegaMoE replaces mori dispatch/combine outright (mori stays only as
        # the shmem bootstrap), so none of the mori EP knobs apply here.
        # Shared-expert fusion stays as base sets it: the image carries
        # sgl-project/sglang#40943, which enables it on the grouped-topk path
        # MegaMoE uses.
        ep-size: 8
        moe-a2a-backend: megamoe
        moe-dense-tp-size: 1
        enable-dp-attention: true
        enable-dp-lm-head: true
        enable-dp-attention-local-control-broadcast: true
        swa-full-tokens-ratio: 0.15
        mem-fraction-static: 0.92
        chunked-prefill-size: 65536
        enable-two-batch-overlap: false
        max-running-requests: 768
        speculative-dspark-block-size: 3
        speculative-num-draft-tokens: 4
    decode:
