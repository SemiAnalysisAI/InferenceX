# AgentX dsv4 vllm gb300-fp4 recipes: shared settings in base, one
# override per benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsv4/vllm/gb300-fp4/agentx/disagg-mtp-variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: "deepseek-v4-pro-0813"
    container: "vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-20ebb28"
    precision: "fp4"
  identity:
    model:
      repo: "deepseek-ai/DeepSeek-V4-Pro-0813"
    container:
      image: "vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-20ebb28"
    frameworks:
      dynamo: "1.6.0.dev20261007"
  dynamo:
    install: true
    source:
      wheel: "1.6.0.dev20261007"
  environment:
    PYTHONHASHSEED: "0"
    WITH_NVIDIA_PEERMEM: "0"
  slurm:
    time_limit: "4:00:00"
  health_check:
    max_attempts: 2160
    interval_seconds: 10
  resources:
    gpu_type: "gb300"
    gpus_per_node: 4
    het_jobs: false
    spread_workers: false
  frontend:
    type: "dynamo"
    placement:
      node: "dedicated"
    enable_multiple_frontends: false
    env:
      ETCD_LEASE_TTL: "120"
      DYN_ROUTER_TEMPERATURE: "0"
      DYN_ROUTER_QUEUE_THRESHOLD: "None"
      DYN_TOKENIZER_CACHE: "1"
      DYN_TOKENIZER_CACHE_BYTES: "8000000000"
      DYN_TOKENIZER: "fastokens"
      DYN_TCP_REQUEST_TIMEOUT: "30"
      DYN_REQUEST_PLANE: "tcp"
      DYN_FRONTEND_ENABLE_KV_EVENTS: "0"
      DYN_LOGGING_JSONL: "false"
      OTEL_EXPORT_ENABLED: "false"
    args:
      router-mode: "kv"
      router-session-affinity-ttl-secs: "14400"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine:
    type: "vllm"
    connector:
    dp_launch_mode: "per_node"
  roles:
    prefill:
      env:
        HF_HUB_CACHE: "/hf_hub_cache"
        HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
        TRANSFORMERS_CACHE: "/hf_hub_cache"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_FLOAT32_MATMUL_PRECISION: "high"
        VLLM_V2_WARMUP_MAX_NUM_SEQS: "20"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
        VLLM_MOONCAKE_STORE_SEND_THREADS: "8"
        VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
        UCX_MEMTYPE_CACHE: "n"
        UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
        UCX_TLS: "rc,cuda_copy"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
        NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
        VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
        VLLM_CONNECTOR_PREFETCH_DEPTH: "0"
        VLLM_DSV4_MEGA_FP8_COMBINE: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        MC_SLICE_SIZE: "1048576"
        MC_WORKERS_PER_CTX: "4"
        MC_STORE_CLIENT_METRIC: "1"
        MC_STORE_CLIENT_METRIC_INTERVAL: "5"
        MC_TE_METRIC: "0"
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "deepseek-ai/DeepSeek-V4-Pro-0813"
        safetensors-load-strategy: "lazy"
        kv-cache-dtype: "fp8"
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-rpc-port: 13345
        enable-cumem-allocator: true
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        max-model-len: 1048576
        long-prefill-token-threshold: 1024
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        gpu-memory-utilization: 0.93
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: "deepseek_v4"
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}'
        moe-backend: "deep_gemm_amxf4_mega_moe"
        numa-bind: true
        numa-bind-nodes: [0, 0, 1, 1]
    decode:
      workers: 1
      env:
        HF_HUB_CACHE: "/hf_hub_cache"
        HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
        TRANSFORMERS_CACHE: "/hf_hub_cache"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_FLOAT32_MATMUL_PRECISION: "high"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
        VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
        UCX_MEMTYPE_CACHE: "n"
        UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
        UCX_TLS: "rc,cuda_copy"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
        NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
        VLLM_DSV4_MEGA_FP8_COMBINE: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        MC_SLICE_SIZE: "1048576"
        MC_WORKERS_PER_CTX: "4"
        MC_STORE_CLIENT_METRIC: "1"
        MC_STORE_CLIENT_METRIC_INTERVAL: "5"
        MC_TE_METRIC: "0"
      args:
        router-mode: "least-loaded"
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"load_async":true,"lookup_async":false,"enable_lookup":false,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "deepseek-ai/DeepSeek-V4-Pro-0813"
        safetensors-load-strategy: "lazy"
        kv-cache-dtype: "fp8"
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-rpc-port: 13345
        enable-cumem-allocator: true
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        max-model-len: 1048576
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        gpu-memory-utilization: 0.9
        stream-interval: 32
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: "deepseek_v4"
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}'
        moe-backend: "deep_gemm_amxf4_mega_moe"
        numa-bind: true
        numa-bind-nodes: [0, 0, 1, 1]
  sbatch_directives:
    mem: "0"
  srun_options:
    container-remap-root: ""
    cpu-bind: "none"
  benchmark:
    type: "custom"
    command: "bash /infmax-workspace/benchmarks/srt_agentic.sh"
    env:
      INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
      RESULT_DIR: "/logs/agentic"
      PORT: "8000"
      IS_MULTINODE: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DATASET_MMAP_CACHE_ENABLED: "false"
      AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
      HF_HUB_CACHE: "/hf_hub_cache"
      WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"

# One DEP4 prefill and one DEP16 decode worker at concurrency 128,
# DSpark K=6 (tuning run 3158854).
override_1p1d_dep4_dep16_c128:
  name: "svf-vllm-disagg-gb300-1p1d-dep4-dep16-c128-mtp-agentic"
  services:
  - name: "etcd"
    type: "etcd"
    placement:
      node: "dedicated"
  - name: "nats"
    type: "nats"
    placement:
      node: "dedicated"
    options:
      max_payload_mb: 32
  - name: "mooncake-master"
    type: "mooncake-master"
    options:
      store_config:
        metadata_server: "P2PHANDSHAKE"
        global_segment_size: "140GB"
        local_buffer_size: "4GB"
        protocol: "rdma"
        device_name: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        mode: "embedded"
        enable_offload: false
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env:
        DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-1p1d-dep4-prefill-c128-{job_id}"
      args:
        data-parallel-size: 4
        max-num-seqs: 256
        max-num-batched-tokens: 8192
    decode:
      nodes: 4
      gpus: 16
      env:
        VLLM_V2_WARMUP_MAX_NUM_SEQS: "16"
        DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-1p1d-dep16-decode-c128-{job_id}"
      args:
        data-parallel-size: 16
        max-num-seqs: 16
        max-num-batched-tokens: 112
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[7,14,21,28,35,42,49,56,63,70,77,84,91,98,105,112],"mode":0}'
        max-cudagraph-capture-size: 112

