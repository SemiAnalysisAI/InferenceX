
schema: 2

base:
  dynamo:
    install: true
    source:
      wheel: "1.2.0.dev20260426"
  setup_script: vllm-container-deps.sh
  slurm:
    time_limit: "8:00:00"
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: "gb300"
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: dedicated
    - name: nats
      type: nats
      placement:
        node: dedicated
      options:
        max_payload_mb: 32
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  engine:
    type: vllm
    connector:
  roles:
    prefill:
      gpus: 4
      env:
        TILELANG_CLEANUP_TEMP_FILES: "1"
        VLLM_USE_NCCL_SYMM_MEM: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        TORCH_SYMMMEM: "NVSHMEM"
      args:
        kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
        served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
        kv-cache-dtype: "fp8"
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-size: 4
        data-parallel-rpc-port: 13345
        enable-expert-parallel: true
        moe-backend: "deep_gemm_mega_moe"
        max-num-batched-tokens: 16384
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        gpu-memory-utilization: 0.9
        enable-ep-weight-filter: true
        no-disable-hybrid-kv-cache-manager: true
        enable-sleep-mode: true
        tokenizer-mode: deepseek_v4
    decode:
      env:
        TILELANG_CLEANUP_TEMP_FILES: "1"
        VLLM_USE_NCCL_SYMM_MEM: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        TORCH_SYMMMEM: "NVSHMEM"
      args:
        kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
        served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
        kv-cache-dtype: "fp8"
        pipeline-parallel-size: 1
        trust-remote-code: true
        block-size: 256
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
        gpu-memory-utilization: 0.9
        stream-interval: 10
        no-disable-hybrid-kv-cache-manager: true
        enable-ep-weight-filter: true
        enable-sleep-mode: true
        tokenizer-mode: deepseek_v4
  sbatch_directives:
    mem: "0"
    cpus-per-task: "72"
  srun_options:
    mem: "0"
    container-remap-root: ""

override_1p6d_dep4_tp4:
  name: "svf-vllm-disagg-gb300-1p6d-dep4-tp4-agentic"
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        attention-config: '{"use_fp4_indexer_cache": true}'
    decode:
      nodes: 6
      workers: 6
      gpus: 4
      args:
        tensor-parallel-size: 4
        all2all-backend: "flashinfer_nvlink_one_sided"
        no-enable-flashinfer-autotune: true

override_4p1d_dep4_dep8_24_c4096:
  name: "svf-vllm-disagg-gb300-4p1d-dep4-dep8-24-c4096-agentic"
  roles:
    prefill:
      nodes: 4
      workers: 4
      env:
        VLLM_LOG_STATS_INTERVAL: "1"
      args:
        safetensors-load-strategy: "prefetch"
    decode:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        VLLM_LOG_STATS_INTERVAL: "1"
      args:
        tensor-parallel-size: 1
        data-parallel-size: 8
        data-parallel-rpc-port: 13345
        enable-expert-parallel: true
        moe-backend: "deep_gemm_mega_moe"
