# AgentX dsv4 vllm gb300-fp4 recipes: shared settings in base, one
# override per benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsv4/vllm/gb300-fp4/agentx/agg-variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: "deepseek-v4-pro-0813"
    container: "vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-20ebb28"
    precision: "fp4"
  identity:
    model:
      repo: "deepseek-ai/DeepSeek-V4-Pro-0813"
    container:
      image: "vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-20ebb28"
    frameworks:
      dynamo: "1.6.0.dev20260923"
  dynamo:
    install: true
    source:
      wheel: "1.6.0.dev20260923"
  environment:
    PYTHONHASHSEED: "0"
    WITH_NVIDIA_PEERMEM: "0"
    EVAL_MAX_MODEL_LEN: "1048576"
    ETCD_LEASE_TTL: "7200"
  slurm:
    time_limit: "4:00:00"
  health_check:
    max_attempts: 2160
    interval_seconds: 10
  resources:
    gpu_type: "gb300"
    gpus_per_node: 4
  services:
  - name: "etcd"
    type: "etcd"
    placement:
      node: "infra"
  - name: "nats"
    type: "nats"
    placement:
      node: "infra"
    options:
      max_payload_mb: 32
  frontend:
    type: "dynamo"
    enable_multiple_frontends: false
    env:
      ETCD_LEASE_TTL: "120"
      DYN_ROUTER_TEMPERATURE: "0"
      DYN_TOKENIZER_CACHE: "1"
      DYN_TOKENIZER_CACHE_BYTES: "8000000000"
      DYN_TOKENIZER: "fastokens"
      DYN_TCP_REQUEST_TIMEOUT: "30"
      DYN_REQUEST_PLANE: "tcp"
      DYN_FRONTEND_ENABLE_KV_EVENTS: "0"
      DYN_LOGGING_JSONL: "false"
      OTEL_EXPORT_ENABLED: "false"
    args:
      router-mode: "kv"
      router-session-affinity-ttl-secs: "14400"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine:
    type: "vllm"
    connector:
  roles:
    agg:
      workers: 1
      env:
        HF_HUB_CACHE: "/hf_hub_cache"
        HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
        TRANSFORMERS_CACHE: "/hf_hub_cache"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_V2_WARMUP_MAX_NUM_SEQS: "16"
        TILELANG_CLEANUP_TEMP_FILES: "1"
        VLLM_USE_NCCL_SYMM_MEM: "0"
        TORCH_SYMMMEM: "NVSHMEM"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_USE_RUST_FRONTEND: "1"
        VLLM_ALLREDUCE_USE_FLASHINFER: "1"
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: "auto"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
        VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
        VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "1024"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        UCX_MEMTYPE_CACHE: "n"
        UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
        UCX_TLS: "rc,cuda_copy"
        NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        NCCL_P2P_LEVEL: "NVL"
      args:
        served-model-name: "deepseek-ai/DeepSeek-V4-Pro-0813"
        kv-cache-dtype: "fp8"
        pipeline-parallel-size: 1
        disable-custom-all-reduce: true
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
        max-model-len: 1048576
        max-num-batched-tokens: 8192
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        cudagraph-metrics: true
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[6,7,12,14,18,21,24,28,30,35,36,42,48,49,54,56,60,63,66,70,72,77,78,84,90,91,96,98,105,112],"mode":0}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}'
        gpu-memory-utilization: 0.9
        stream-interval: 1
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: "deepseek_v4"
        numa-bind: true
  sbatch_directives:
    mem: "0"
  srun_options:
    container-remap-root: ""
    cpu-bind: "none"
  benchmark:
    type: "custom"
    command: "bash /infmax-workspace/benchmarks/srt_agentic.sh"
    env:
      INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
      RESULT_DIR: "/logs/agentic"
      PORT: "8000"
      IS_MULTINODE: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DATASET_MMAP_CACHE_ENABLED: "false"
      AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
      HF_HUB_CACHE: "/hf_hub_cache"
      WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"

# GB300 AgentX aggregate TP8 worker across two nodes at concurrency 1,
# DSpark K=6 (tuning run 3184226).
override_tp8_c1:
  name: "svf-vllm-agg-gb300-tp8-c1-mtp-agentic"
  roles:
    agg:
      nodes: 2
      gpus: 8
      env:
        DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-agg-tp8-c1-mtp-{job_id}"
      args:
        tensor-parallel-size: 8
        max-num-seqs: 1

# GB300 AgentX aggregate TP4 worker on one node at concurrency 1,
# DSpark K=6 (tuning run 3184212).
override_tp4_c1:
  name: "svf-vllm-agg-gb300-tp4-c1-mtp-agentic"
  roles:
    agg:
      nodes: 1
      gpus: 4
      env:
        DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-agg-tp4-c1-mtp-{job_id}"
      args:
        tensor-parallel-size: 4
        max-num-seqs: 1

# GB300 AgentX aggregate TP4 worker on one node at concurrency 2,
# DSpark K=6 (tuning run 3184214).
override_tp4_c2:
  name: "svf-vllm-agg-gb300-tp4-c2-mtp-agentic"
  roles:
    agg:
      nodes: 1
      gpus: 4
      env:
        DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-agg-tp4-c2-mtp-{job_id}"
      args:
        tensor-parallel-size: 4
        max-num-seqs: 2

# GB300 AgentX aggregate TP4 worker on one node at concurrency 4,
# DSpark K=6 (tuning run 3184216).
override_tp4_c4:
  name: "svf-vllm-agg-gb300-tp4-c4-mtp-agentic"
  frontend:
    env:
      DYN_ROUTER_QUEUE_THRESHOLD: "65536"
  roles:
    agg:
      nodes: 1
      gpus: 4
      env:
        DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-agg-tp4-c4-mtp-{job_id}"
      args:
        tensor-parallel-size: 4
        max-num-seqs: 4
