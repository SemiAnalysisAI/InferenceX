# DeepSeek-V4-Pro-0813 (DSpark) FP4 AgentX on GB200 behind the llm-d router
# (srt-slurm frontend.type: llm-d): DEP8 prefill workers over two trays each and one
# DEP8 or DEP16 decode worker. KV moves over NIXL and the prefill workers share prefix
# cache through an embedded Mooncake store. srt-slurm launches each worker as one
# `vllm serve` over its trays that balances its DP ranks itself, so the EPP routes to the
# worker rather than to one rank. Prefill drafts three DSpark tokens like decode: the srt
# launch planner gives both roles the decode role's golden acceptance length.
# VLLM_USE_RUST_FRONTEND is left unset (the Python API server).
# Select one with CONFIG_FILE=recipes/dsv4/vllm/gb200-fp4/agentx/disagg-llm-d.yaml:override_<name>.

schema: 2

base:
  model:
    path: deepseek-v4-pro-0813
    container: quay.io/rh-ee-imarkov/llm-d-nokube-vllm:dspark-0814-nightly@sha256:00742fdd10e572172d49559e44c357a68c388933c74db2c4e819bf61377a6a95
    precision: fp4
  identity:
    model: {repo: deepseek-ai/DeepSeek-V4-Pro-0813}
    container: {image: "quay.io/rh-ee-imarkov/llm-d-nokube-vllm:dspark-0814-nightly@sha256:00742fdd10e572172d49559e44c357a68c388933c74db2c4e819bf61377a6a95"}
  dynamo:
    install: false
  slurm: {time_limit: "8:00:00"}
  health_check: {max_attempts: 2160, interval_seconds: 10}
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  observability:
    enabled: false
    tachometer:
      enabled: false
  services:
    - name: mooncake-master
      type: mooncake-master
      options:
        store_config:
          metadata_server: "P2PHANDSHAKE"
          # Each prefill rank's embedded store: 2/3 of a tray's ~900 GB DRAM over 4 GPUs.
          global_segment_size: "150GB"
          local_buffer_size: "4GB"
          protocol: "rdma"
          device_name: "mlx5_0,mlx5_1,mlx5_3,mlx5_4"
          mode: "embedded"
          enable_offload: false
  frontend:
    type: llm-d
    enable_multiple_frontends: false
    # srtctl adds the file-discovery plugin.
    epp_config:
      plugins:
        - type: prefill-filter
        - type: decode-filter
        - type: inflight-load-producer
        - type: approx-prefix-cache-producer
          parameters:
            autoTune: false
            blockSizeTokens: 256
            maxPrefixTokensToMatch: 1048576
            maxPrefixBlocksToMatch: 4096
            lruCapacityPerServer: 43949
        - type: prefix-cache-affinity-filter
          parameters:
            peakPrefillThroughput: 4783
            maxTTFTPenaltyMs: 30000
        - type: prefix-cache-scorer
        - type: token-load-scorer
          parameters:
            queueThresholdTokens: 3000000
        - type: active-request-scorer
        - type: queue-scorer
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: max-score-picker
          name: prefill-picker
        - type: max-score-picker
          name: decode-picker
      schedulingProfiles:
        - name: prefill
          plugins:
            - pluginRef: prefill-filter
            - pluginRef: prefix-cache-affinity-filter
            - pluginRef: prefix-cache-scorer
              weight: 6
            - pluginRef: token-load-scorer
              weight: 3
            - pluginRef: queue-scorer
              weight: 3
            - pluginRef: prefill-picker
        - name: decode
          plugins:
            - pluginRef: decode-filter
            - pluginRef: active-request-scorer
            - pluginRef: decode-picker
  engine:
    type: vllm
    connector:
  roles:
    prefill:
      gpus: 8
      env:
        PYTHONHASHSEED: "0"
        HF_HUB_CACHE: /hf_hub_cache
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_NCCL_SYMM_MEM: "1"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_DSV4_MEGA_FP8_COMBINE: "1"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "120"
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
        VLLM_USE_DEEP_GEMM: "1"
        VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
        VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
        VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
        FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED: "1"
        VLLM_NO_USAGE_STATS: "1"
        VLLM_LOGGING_LEVEL: INFO
        TQDM_DISABLE: "1"
        TILELANG_CLEANUP_TEMP_FILES: "1"
        TORCH_SYMMMEM: NVSHMEM
        DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
        NVSHMEM_REMOTE_TRANSPORT: "none"
        NVSHMEM_IB_ENABLE_IBGDA: "false"
        NVSHMEM_CUMEM_HANDLE_TYPE: FABRIC
        NVSHMEM_DISABLE_CUDA_VMM: "0"
        UCX_TLS: cuda_copy,cuda_ipc,rc,tcp
        UCX_CUDA_IPC_ENABLE_MNNVL: "y"
        UCX_MEMTYPE_CACHE: "n"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        NCCL_P2P_LEVEL: NVL
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
        VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        MC_STORE_RPC_CLIENT_IO_THREADS: "32"
        MC_TE_RPC_CLIENT_IO_THREADS: "32"
        MC_STORE_CLIENT_METRIC: "1"
        MC_STORE_CLIENT_METRIC_INTERVAL: "5"
        MC_TE_METRIC: "0"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        tensor-parallel-size: 1
        data-parallel-size: 8
        enable-expert-parallel: true
        # NIXL hands KV to decode; the Mooncake store shares prefix cache across prefill ranks.
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false,"kv_lease_duration":1800}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        kv-cache-dtype: fp8
        gpu-memory-utilization: 0.95
        max-num-batched-tokens: 8192
        long-prefill-token-threshold: 1024
        max-num-seqs: 16
        max-model-len: 1048576
        speculative-config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","attention_backend":"FLASHINFER_MLA_SPARSE_DSV4","enable_adaptive_verification":false}'
        enable-cumem-allocator: true
        block-size: 256
        tokenizer-mode: deepseek_v4
        tool-call-parser: deepseek_v4
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v4
        moe-backend: deep_gemm_mega_moe
        enable-ep-weight-filter: true
        no-disable-hybrid-kv-cache-manager: true
        no-enable-flashinfer-autotune: true
        numa-bind: true
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
    decode:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        PYTHONHASHSEED: "0"
        HF_HUB_CACHE: /hf_hub_cache
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_NCCL_SYMM_MEM: "1"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_DSV4_MEGA_FP8_COMBINE: "1"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
        VLLM_USE_DEEP_GEMM: "1"
        VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
        VLLM_NO_USAGE_STATS: "1"
        VLLM_LOGGING_LEVEL: INFO
        TQDM_DISABLE: "1"
        TILELANG_CLEANUP_TEMP_FILES: "1"
        TORCH_SYMMMEM: NVSHMEM
        DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
        NVSHMEM_REMOTE_TRANSPORT: "none"
        NVSHMEM_IB_ENABLE_IBGDA: "false"
        NVSHMEM_CUMEM_HANDLE_TYPE: FABRIC
        NVSHMEM_DISABLE_CUDA_VMM: "0"
        UCX_TLS: cuda_copy,cuda_ipc,rc,tcp
        UCX_CUDA_IPC_ENABLE_MNNVL: "y"
        UCX_MEMTYPE_CACHE: "n"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        NCCL_P2P_LEVEL: NVL
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        tensor-parallel-size: 1
        data-parallel-size: 8
        enable-expert-parallel: true
        kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false,"kv_lease_duration":1800}}'
        kv-cache-dtype: fp8
        gpu-memory-utilization: 0.95
        max-num-batched-tokens: 256
        max-num-seqs: 32
        max-cudagraph-capture-size: 256
        max-model-len: 1048576
        speculative-config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","attention_backend":"FLASHINFER_MLA_SPARSE_DSV4","enable_adaptive_verification":false}'
        enable-cumem-allocator: true
        block-size: 256
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
        tokenizer-mode: deepseek_v4
        tool-call-parser: deepseek_v4
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v4
        moe-backend: deep_gemm_mega_moe
        enable-ep-weight-filter: true
        no-disable-hybrid-kv-cache-manager: true
        no-enable-flashinfer-autotune: true
        numa-bind: true
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
  sbatch_directives: {cpus-per-task: "144", mem: "0"}
  srun_options: {container-remap-root: ""}
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: "8000"
      IS_MULTINODE: "true"
      MODEL: deepseek-ai/DeepSeek-V4-Pro-0813
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"

override_1p1d:
  name: dsv4-gb200-vllm-agentic-dspark-disagg-1p1d-dep8-dep8-llm-d
  roles:
    prefill:
      nodes: 2
      workers: 1

override_2p1d:
  name: dsv4-gb200-vllm-agentic-dspark-disagg-2p1d-dep8-dep16-llm-d
  roles:
    prefill:
      nodes: 4
      workers: 2
    decode:
      nodes: 4
      gpus: 16
      args:
        data-parallel-size: 16
