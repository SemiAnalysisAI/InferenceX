# AgentX dsv4 vllm gb200-fp4 recipes: shared settings in base, one
# override per benchmark configuration.

schema: 2

base:
  identity:
    model: {}
    container: {}
    frameworks:
      dynamo: "1.3.1"
  dynamo:
    install: true
    source:
      pypi: "1.3.1"
  setup_script: vllm-container-deps.sh
  environment:
    ETCD_LEASE_TTL: "7200"
  slurm:
    time_limit: "8:00:00"
  health_check:
    max_attempts: 2160
    interval_seconds: 10
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: kv
      router-reset-states: true
      router-session-affinity-ttl-secs: 14400
      kv-cache-block-size: 256
  engine:
    type: vllm
    connector:
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        HF_HUB_CACHE: /hf_hub_cache
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_RPC_TIMEOUT: "600000"
        VLLM_LOG_STATS_INTERVAL: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
        VLLM_USE_NCCL_SYMM_MEM: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        UCX_MEMTYPE_CACHE: "n"
        UCX_NET_DEVICES: "@fabric.ucx-net-devices"
        UCX_TLS: "rc,cuda_copy"
        NCCL_IB_HCA: "@fabric.nccl-ib-hca"
      args:
        kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        kv-cache-dtype: fp8
        pipeline-parallel-size: 1
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        max-model-len: 1048576
        max-num-batched-tokens: 8192
        trust-remote-code: true
        block-size: 256
        speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
        gpu-memory-utilization: 0.90
        stream-interval: 10
        no-disable-hybrid-kv-cache-manager: true
        kv-cache-metrics: true
        tokenizer-mode: deepseek_v4
  sbatch_directives:
    cpus-per-task: "144"
    mem: "0"
  srun_options:
    container-remap-root: ""
  benchmark:
    env:
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"

override_tp8:
  name: dsv4-gb200-vllm-agentic-mtp-agg-tp8
  roles:
    agg:
      args:
        tensor-parallel-size: 8
        disable-custom-all-reduce: true
        max-num-seqs: 128
        no-enable-flashinfer-autotune: true

override_dep8:
  name: dsv4-gb200-vllm-agentic-mtp-agg-dep8
  engine:
    dp_launch_mode: per_node
  roles:
    agg:
      args:
        tensor-parallel-size: 1
        data-parallel-size: 8
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        moe-backend: deep_gemm_mega_moe
        max-num-seqs: 256
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
