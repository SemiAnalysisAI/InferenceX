schema: 2

base:
  name: kimik3.1-fp4-gb200-dynamo-sglang-agentx-agg
  identity:
    model: {}
    container: {}
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  # The K3.1 image ships its patched Dynamo 1.6.0 for dynamo.sglang.
  dynamo:
    install: false
  # Tachometer's per-node exporters slow decode steps and add host memory;
  # InferenceX does not read its output.
  observability:
    tachometer:
      enabled: false
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    args:
      router-mode: kv
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      router-session-affinity-ttl-secs: '3600'
  engine: sglang
  roles:
    agg:
      nodes: 4
      workers: 1
      gpus: 16
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        PYTHONUNBUFFERED: '1'
        PYTHONNOUSERSITE: '1'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # TP16 spans four trays; the cookbook's GB200 cell disables the per-rank memory check
        # and turns on multi-node NVLink.
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: '0'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        trust-remote-code: true
        tensor-parallel-size: 16
        dcp-size: 16
        expert-parallel-size: 1
        kv-cache-dtype: fp8_e4m3
        # Week-1 K3.1 precision policy: FP32 KDA recurrent state.
        mamba-ssm-dtype: float32
        mem-fraction-static: 0.85
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        weight-loader-prefetch-checkpoints: true
        model-loader-extra-config: '{"enable_multithread_load":true}'
        dyn-reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Kimi-K3.1-Dflash2-Preview
        speculative-draft-kv-cache-dtype: fp8_e4m3
        speculative-draft-attention-backend: cutedsl_mla
        speculative-use-block-verification: true
        # Without ReplaySSM, DFLASH keeps one KDA state per draft token and the KV pool collapses.
        enable-linear-replayssm-spec: true
        enable-hierarchical-cache: true
        hicache-size: 120
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        hicache-write-policy: write_back
        mamba-max-states-per-path: 1
        watchdog-timeout: 3600
        enable-metrics: true
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 64
    # Disables Dynamo's per-request lifecycle span export; InferenceX does not read it.
    - name: otel-collector
      type: otel-collector
      enabled: false
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  srun_options:
    mem: '0'
    container-remap-root: ''

override_tp16_c1:
  name: kimik3.1-fp4-gb200-dynamo-sglang-agentx-agg-tp16-c1-dflash7
  roles:
    agg:
      args:
        speculative-num-draft-tokens: 8
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2

override_tp16_c4:
  name: kimik3.1-fp4-gb200-dynamo-sglang-agentx-agg-tp16-c4-dflash7
  roles:
    agg:
      args:
        speculative-num-draft-tokens: 8
