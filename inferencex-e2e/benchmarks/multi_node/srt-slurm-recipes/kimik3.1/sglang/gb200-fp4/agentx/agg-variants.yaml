override_tp16_c24:
  name: kimik3.1-fp4-gb200-dynamo-sglang-agentx-agg-tp16-c24-dflash5
  roles:
    agg:
      args:
        # Above CONC 8 the verify rows dominate a step: 5 drafts (width 6), the cookbook's
