schema: 2

base:
  identity:
    model: {}
    container: {}
  resources:
    gpu_type: b200
    gpus_per_node: 8
  slurm:
    time_limit: '8:00:00'
  dynamo:
    install: false
  # One aggregate worker serves the public port itself; no router is needed.
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      # One 8xB200 node cannot hold the ~1.56 TB MXFP4 checkpoint.
      nodes: 2
      workers: 1
      gpus: 16
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        PYTHONUNBUFFERED: '1'
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        trust-remote-code: true
        # The SGLang Kimi K3.1 Pro cookbook's two-node B200 layout.
        tp-size: 16
        dcp-size: 16
        mem-fraction-static: 0.85
        weight-loader-prefetch-checkpoints: true
        model-loader-extra-config: '{"enable_multithread_load": true}'
        kv-cache-dtype: fp8_e4m3
        # The K3.1 week-1 precision policy requires FP32 KDA recurrent state.
        mamba-ssm-dtype: float32
        reasoning-parser: kimi_k3
        tool-call-parser: kimi_k3
        # DFLASH verifies the current token plus 7 drafts per step.
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Kimi-K3.1-Dflash2-Preview
        speculative-num-draft-tokens: 8
        speculative-use-block-verification: true
        speculative-draft-kv-cache-dtype: fp8_e4m3
        speculative-draft-attention-backend: cutedsl_mla
        # Without ReplaySSM DFLASH keeps one KDA state per draft token and the KV pool collapses.
        enable-linear-replayssm-spec: true
        watchdog-timeout: 3600
        enable-metrics: true
        enable-cache-report: true
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'
      # SGLang serves the port itself; conversation-aware routing needs a Dynamo frontend.
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
  sbatch_directives:
    mem: '0'
  srun_options:
    mem: '0'
    container-remap-root: ''

# Admission is 2x CONC. Seven drafts through CONC 14; four (the draft's native block of 5)
# from CONC 24, where the verify batch grows with the running requests.
override_tp16_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2

override_tp16_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8

override_tp16_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16

override_tp16_c14:
  roles:
    agg:
      args:
        max-running-requests: 28
        cuda-graph-max-bs-decode: 28

override_tp16_c24:
  roles:
    agg:
      args:
        max-running-requests: 48
        cuda-graph-max-bs-decode: 48
        speculative-num-draft-tokens: 5

override_tp16_c32:
  roles:
    agg:
      args:
        max-running-requests: 64
        cuda-graph-max-bs-decode: 64
        speculative-num-draft-tokens: 5

override_tp16_c48:
  roles:
    agg:
      args:
        max-running-requests: 96
        cuda-graph-max-bs-decode: 96
        speculative-num-draft-tokens: 5

override_tp16_c56:
  roles:
    agg:
      args:
        max-running-requests: 112
        cuda-graph-max-bs-decode: 112
        speculative-num-draft-tokens: 5

override_tp16_c72:
  roles:
    agg:
      args:
        max-running-requests: 144
        cuda-graph-max-bs-decode: 144
        speculative-num-draft-tokens: 5

override_tp16_c80:
  roles:
    agg:
      args:
        max-running-requests: 160
        cuda-graph-max-bs-decode: 160
        speculative-num-draft-tokens: 5

override_tp16_c96_nospec:
  roles:
    agg:
      args:
        max-running-requests: 192
        cuda-graph-max-bs-decode: 192
        speculative-algorithm: null
        speculative-draft-model-path: null
        speculative-num-draft-tokens: null
        speculative-use-block-verification: null
        speculative-draft-kv-cache-dtype: null
        speculative-draft-attention-backend: null
        enable-linear-replayssm-spec: null
