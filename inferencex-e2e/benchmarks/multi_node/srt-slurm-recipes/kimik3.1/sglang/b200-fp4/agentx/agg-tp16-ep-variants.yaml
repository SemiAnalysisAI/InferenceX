schema: 2

base:
  identity:
    model: {}
    container: {}
  resources:
    gpu_type: b200
    gpus_per_node: 8
  slurm:
    time_limit: '8:00:00'
  dynamo:
    install: false
    request_plane: tcp
    event_plane: zmq
  services:
    - name: etcd
      type: etcd
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      DYN_ROUTER_TEMPERATURE: '0'
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
      DYN_TCP_CHANNEL_BUFFER: '128'
      DYN_TCP_REQUEST_TIMEOUT: '60'
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: '14400'
      dyn-chat-processor: sglang
      dyn-preprocess-workers: '4'
      trust-remote-code: true
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      # One 8xB200 node cannot hold the ~1.56 TB MXFP4 checkpoint.
      nodes: 2
      workers: 1
      gpus: 16
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        PYTHONUNBUFFERED: '1'
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        MSCCLPP_HCA_DEVICES: '@fabric.rdma-devices'
        SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB: '32768'
        SGLANG_DCP_PUSH_COMBINE_MAX_ROWS: '1536'
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        trust-remote-code: true
        tp-size: 16
        dcp-size: 8
        ep-size: 4
        enable-mscclpp: true
        mem-fraction-static: 0.85
        load-format: runai_streamer
        model-loader-extra-config: '{"concurrency":16,"distributed":true}'
        weight-loader-drop-cache-after-load: false
        kv-cache-dtype: fp8_e4m3
        # The K3.1 week-1 precision policy requires FP32 KDA recurrent state.
        mamba-ssm-dtype: float32
        mamba-max-states-per-path: 1
        dyn-reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Kimi-K3.1-Dflash2-Preview
        # DFLASH verifies the current token plus 7 drafts per step.
        speculative-num-draft-tokens: 8
        # The golden AL curve was collected with block verification.
        speculative-use-block-verification: true
        speculative-draft-kv-cache-dtype: fp8_e4m3
        speculative-draft-attention-backend: cutedsl_mla
        # Without ReplaySSM DFLASH keeps one KDA state per draft token and the KV pool collapses.
        enable-linear-replayssm-spec: true
        watchdog-timeout: 3600
        enable-metrics: true
        enable-cache-report: true
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      # The client splits this value on whitespace, so it has none.
      AIPERF_EXTRA_INPUTS: '{"chat_template_kwargs":{"thinking":true},"temperature":1,"top_p":0.95}'
  sbatch_directives:
    mem: '0'
  srun_options:
    mem: '0'
    container-remap-root: ''

override_tp16_ep4_dcp8_c1:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
        # Full collections run 10,000x less often than with the default threshold.
        gc-threshold: [700, 10, 100000]

override_tp16_ep4_dcp8_c2:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
        gc-threshold: [700, 10, 100000]

override_tp16_ep4_dcp8_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
        gc-threshold: [700, 10, 100000]

override_tp16_ep2_dcp16_c8:
  roles:
    agg:
      env:
        SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB: null
        SGLANG_DCP_PUSH_COMBINE_MAX_ROWS: null
      args:
        dcp-size: 16
        ep-size: 2
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16

override_tp16_ep4_dcp8_c12:
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs-decode: 24

override_tp16_ep4_dcp8_c16:
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs-decode: 24

override_tp16_ep4_dcp8_c20:
  roles:
    agg:
      args:
        max-running-requests: 28
        cuda-graph-max-bs-decode: 28
        # The verify batch grows with the running requests, so larger points verify fewer tokens per step.
        speculative-num-draft-tokens: 6

override_tp16_ep4_dcp8_c28:
  roles:
    agg:
      args:
        max-running-requests: 28
        cuda-graph-max-bs-decode: 28
        # MSCCL++ verify all-reduces desync TP ranks above 146 tokens per step; 28 x 5 stays under it.
        speculative-num-draft-tokens: 5
