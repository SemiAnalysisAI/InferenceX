schema: 2
name: kimik3.1-fp4-gb300-dynamo-sglang-agentx-disagg-3p1d-p-tp8-d-tp16-dpa2-ep16
identity:
  model: {}
  container: {}
resources:
  gpu_type: gb300
  gpus_per_node: 4
# The K3.1 SGLang image ships no Dynamo.
dynamo:
  install: true
  source:
    # ai-dynamo/dynamo#18124: its frontend loads the kimi_k31 tokenizer and its SGLang args allow DSA DCP decode.
    rev: "4b0850752a7370aa20706095558616488b5cef35"
environment:
  HF_HUB_CACHE: /hf_hub_cache
observability:
  tachometer:
    enabled: false
slurm:
  time_limit: "6:00:00"
health_check:
  max_attempts: 1440
  interval_seconds: 10
services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 64
  - name: otel-collector
    type: otel-collector
    enabled: false
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    DYN_ROUTER_TEMPERATURE: "0"
    DYN_ROUTER_QUEUE_THRESHOLD: None
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE: "1"
    DYN_TOKENIZER_CACHE_BYTES: "8000000000"
  args:
    # The Kimi tokenizer is remote code, so chat templating stays in SGLang.
    dyn-chat-processor: sglang
    dyn-preprocess-workers: 4
    trust-remote-code: true
    router-mode: kv
    active-decode-blocks-threshold: "None"
    active-prefill-tokens-threshold: "None"
    active-prefill-tokens-threshold-frac: "None"
engine: sglang
roles:
  prefill:
    nodes: 6
    workers: 3
    gpus: 8
    env:
      PYTHONUNBUFFERED: "1"
      CUDA_MODULE_LOADING: EAGER
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      MC_FORCE_MNNVL: "1"
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
      SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: "0"
      SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB: "32768"
      SGLANG_DCP_PUSH_COMBINE_MAX_ROWS: "1536"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
      SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION: "0.1"
      SGLANG_NUMA_BIND_V2: "0"
    args:
      served-model-name: moonshotai/Kimi-K3.1-Pro
      trust-remote-code: true
      tensor-parallel-size: 8
      expert-parallel-size: 2
      dcp-size: 8
      dcp-comm-backend: fi_a2a
      kv-cache-dtype: fp8_e4m3
      mamba-ssm-dtype: float32
      page-size: 64
      dsa-prefill-backend: prims_ts
      dsa-decode-backend: prims_ts
      disaggregation-transfer-backend: mooncake
      disaggregation-decode-allocation-policy: early
      chunked-prefill-size: 16384
      max-prefill-tokens: 16384
      schedule-policy: shortest-prefill-first
      mem-fraction-static: 0.88
      mamba-full-memory-ratio: 1.2
      mamba-max-states-per-path: 1
      mamba-radix-cache-strategy: extra_buffer
      mamba-track-interval: 256
      # 120 GB per rank is 480 GB of each 4-GPU tray's host DRAM (dram-utilization 0.5).
      enable-hierarchical-cache: true
      hicache-size: 120
      hicache-write-policy: write_back
      speculative-algorithm: DFLASH
      speculative-draft-model-path: RadixArk/Kimi-K3.1-Dflash2-Preview
      speculative-draft-model-revision: d0d8bc2e3c6d0a195d2e00a49017e71ca8d881f1
      # DFLASH counts the verification width: 4 drafts plus the current token, as decode.
      speculative-num-draft-tokens: 5
      speculative-draft-kv-cache-dtype: fp8_e4m3
      speculative-draft-attention-backend: cutedsl_mla
      router-mode: kv
      router-session-affinity-ttl-secs: "14400"
      router-host-cache-hit-weight: 1
      router-kv-overlap-score-credit: 4
      reasoning-parser: kimi_k3
      dyn-reasoning-parser: kimi_k3
      dyn-tool-call-parser: kimi_k3
      watchdog-timeout: 3600
      enable-metrics: true
      weight-loader-prefetch-checkpoints: true
      model-loader-extra-config: '{"enable_multithread_load":true}'
    kv_events: true
  decode:
    nodes: 4
    workers: 1
    gpus: 16
    env:
      PYTHONUNBUFFERED: "1"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      MC_FORCE_MNNVL: "1"
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
      SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: "0"
      SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB: "32768"
      SGLANG_DCP_PUSH_COMBINE_MAX_ROWS: "1536"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
      NVSHMEM_REMOTE_TRANSPORT: none
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "1536"
    args:
      served-model-name: moonshotai/Kimi-K3.1-Pro
      trust-remote-code: true
      tensor-parallel-size: 16
      attn-dp-size: 2
      enable-dp-lm-head: true
      expert-parallel-size: 16
      # MegaMoE deadlocks with --enable-symm-mem, so symmetric memory stays off.
      moe-a2a-backend: megamoe
      dcp-size: 8
      dcp-comm-backend: fi_a2a
      kv-cache-dtype: fp8_e4m3
      mamba-ssm-dtype: float32
      page-size: 64
      dsa-prefill-backend: prims_ts
      dsa-decode-backend: prims_ts
      disaggregation-transfer-backend: mooncake
      disaggregation-decode-enable-radix-cache: true
      disaggregation-decode-extra-slots: 16
      mem-fraction-static: 0.85
      max-running-requests: 384
      cuda-graph-max-bs-decode: 192
      speculative-algorithm: DFLASH
      speculative-draft-model-path: RadixArk/Kimi-K3.1-Dflash2-Preview
      speculative-draft-model-revision: d0d8bc2e3c6d0a195d2e00a49017e71ca8d881f1
      speculative-num-draft-tokens: 5
      speculative-use-block-verification: true
      speculative-draft-kv-cache-dtype: fp8_e4m3
      speculative-draft-attention-backend: cutedsl_mla
      enable-linear-replayssm-spec: true
      reasoning-parser: kimi_k3
      dyn-reasoning-parser: kimi_k3
      dyn-tool-call-parser: kimi_k3
      watchdog-timeout: 3600
      enable-metrics: true
      weight-loader-prefetch-checkpoints: true
      model-loader-extra-config: '{"enable_multithread_load":true}'
    kv_events: false
sbatch_directives:
  mem: "0"
srun_options:
  mem: "0"
  container-remap-root: ""
benchmark:
  env:
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
    # The client splits this value on whitespace, so it has none.
    AIPERF_EXTRA_INPUTS: '{"temperature":1,"top_p":0.95}'
