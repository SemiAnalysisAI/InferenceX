schema: 2
base:
  identity:
    model: {}
    container: {}
  dynamo:
    install: false
  slurm:
    time_limit: '8:00:00'
  health_check:
    interval_seconds: 10
    max_attempts: 720
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  engine:
    type: vllm
    connector: null
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 16
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_RPC_TIMEOUT: '600000'
        NCCL_CUMEM_ENABLE: '1'
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        PYTHONHASHSEED: '42'
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
        VLLM_USE_DIRECT_DCP_A2A: '1'
        VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
        VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        MC_GID_INDEX: '@fabric.rdma-gid-index'
        MC_STORE_MEMCPY: '1'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_SLICE_SIZE: '1048576'
        MC_WORKERS_PER_CTX: '4'
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
        VLLM_MOONCAKE_STORE_SELECTIVE_LEASE: '1'
        UCX_MEMTYPE_CACHE: n
        UCX_MEMTYPE_REG_WHOLE: n
        UCX_NET_DEVICES: '@fabric.rdma-device-ports'
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        tensor-parallel-size: 8
        pipeline-parallel-size: 2
        decode-context-parallel-size: 8
        trust-remote-code: true
        load-format: fastsafetensors
        moe-backend: auto
        gpu-memory-utilization: 0.92
        max-model-len: 1048576
        kv-cache-dtype: fp8
        mamba-ssm-cache-dtype: float32
        enable-prefix-caching: true
        enable-auto-tool-choice: true
        tool-call-parser: kimi_k3
        reasoning-parser: kimi_k3
        language-model-only: true
        max-num-batched-tokens: 10240
        dcp-comm-backend: a2a
        attention-config: '{"indexer_kv_dtype": "mxfp4"}'
        prefix-match-unit: 128
        kv-transfer-config: '{"kv_connector": "MooncakeStoreConnector", "kv_role":
          "kv_both", "kv_load_failure_policy": "recompute", "kv_connector_extra_config":
          {"load_async": true, "lookup_async": true, "enable_cross_layers_blocks":
          false, "enable_offload": false}}'
  srun_options:
    container-remap-root: ''
    mem: '0'
  telemetry:
    collector_join_timeout_seconds: 12
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
  services:
  - name: mooncake-master
    type: mooncake-master
    args:
    - --default_kv_lease_ttl=60000
    - --eviction_high_watermark_ratio=0.95
    - --eviction_ratio=0.10
    options:
      store_config:
        metadata_server: P2PHANDSHAKE
        global_segment_size: 200GB
        local_buffer_size: 4GB
        protocol: rdma
        device_name: '@fabric.rdma-devices'
        mode: embedded
        enable_offload: false
  sbatch_directives:
    mem: '0'
override_tp8pp2_c1:
  roles:
    agg:
      args:
        max-num-seqs: 1
        speculative-config: '{"model": "Inferact/Kimi-K3.1-Pro-DSpark-preview", "num_speculative_tokens":
          7, "method": "dspark", "draft_sample_method": "probabilistic", "rejection_sample_method":
          "block"}'
        compilation-config: '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes":
          [8]}'
