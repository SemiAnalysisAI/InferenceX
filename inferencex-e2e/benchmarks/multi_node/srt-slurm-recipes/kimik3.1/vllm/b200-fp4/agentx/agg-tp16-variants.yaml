schema: 2

base:
  identity:
    model: {}
    container: {}

  slurm:
    time_limit: "8:00:00"

  health_check:
    interval_seconds: 10
    max_attempts: 720

  resources:
    gpu_type: "b200"
    gpus_per_node: 8

  environment:
    # Identical prefixes must hash to identical block keys run-to-run.
    PYTHONHASHSEED: "0"

  frontend:
    type: vllm
    enable_multiple_frontends: false

  engine:
    type: vllm
    connector:

  roles:
    agg:
      nodes: 2
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_RPC_TIMEOUT: "600000"
        # AIPerf reuses a session's connection across turns; outlast uvicorn's 5 s idle timeout.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "600"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        NCCL_CUMEM_ENABLE: "1"
        HF_HUB_CACHE: "/hf_hub_cache"
        HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
        VLLM_USE_NCCL_SYMM_MEM: "0"
        TOKENSPEED_MLA_FP16_PARTIALS: "0"
        VLLM_ENABLE_GEMM_RS: "0"
      args:
        served-model-name: "moonshotai/Kimi-K3.1-Pro"
        tensor-parallel-size: 16
        decode-context-parallel-size: 16
        cp-kv-cache-interleave-size: 1
        # The two nodes share no NVLink fabric.
        disable-custom-all-reduce: true
        no-enable-flashinfer-autotune: true
        trust-remote-code: true
        language-model-only: true
        load-format: fastsafetensors
        moe-backend: auto
        gpu-memory-utilization: 0.98
        max-model-len: 1048576
        max-num-batched-tokens: 8192
        stream-interval: 10
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"mxfp4"}'
        mamba-ssm-cache-dtype: float32
        enable-prefix-caching: true
        enable-auto-tool-choice: true
        tool-call-parser: kimi_k3
        reasoning-parser: kimi_k3
        speculative-config: '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","revision":"e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":112742379520,"lazy_offload":false}}'

  srun_options:
    container-remap-root: ""

  telemetry:
    collector_join_timeout_seconds: 12

  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"

override_tp16_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[5,10]}'

override_tp16_c4:
  roles:
    agg:
      args:
        max-num-seqs: 8
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[5,10,15,20,25,30,35,40]}'
