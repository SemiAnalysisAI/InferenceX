schema: 2
base:
  name: kimik3.1-fp4-gb200-dynamo-vllm-agentx-disagg-hybrid-tp4
  identity:
    model: {}
    container: {}
    frameworks:
      vllm: 0.1.dev24218+g78e9a0c28
      dynamo: 3dd0744eb72c707d76d4c520ae4dea9e286a4ab6
  dynamo:
    install: true
    source:
      rev: 3dd0744eb72c707d76d4c520ae4dea9e286a4ab6
  environment:
    HF_HUB_CACHE: /hf_hub_cache
  slurm:
    time_limit: 06:00:00
  health_check:
    max_attempts: 720
    interval_seconds: 10
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
  - name: mooncake-master
    type: mooncake-master
    args:
    - --default_kv_lease_ttl=60000
    - --eviction_high_watermark_ratio=0.95
    - --eviction_ratio=0.10
    options:
      store_config:
        metadata_server: P2PHANDSHAKE
        global_segment_size: 160GB
        local_buffer_size: 4GB
        protocol: rdma
        device_name: '@fabric.rdma-devices'
        mode: embedded
        enable_offload: false
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: least-loaded
      router-session-affinity-ttl-secs: 1
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
      DYN_TOKENIZER_CACHE_BYTES: '8589934592'
      DYN_TCP_REQUEST_TIMEOUT: '120'
      DYN_DISABLE_OPENAI_STRICT_SCHEMA_VALIDATION: '1'
  engine:
    type: vllm
    connector: null
    dp_launch_mode: per_node
    set_visible_devices: true
  roles:
    prefill:
      nodes: 4
      workers: 1
      gpus: 16
      env:
        DYN_TCP_REQUEST_TIMEOUT: '120'
        VLLM_USE_DIRECT_DCP_A2A: '1'
        VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
        VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: '0'
        DYN_REQUEST_PLANE: tcp
        ETCD_LEASE_TTL: '600'
        VLLM_RPC_TIMEOUT: '600000'
        TILELANG_CLEANUP_TEMP_FILES: '1'
        VLLM_USE_NCCL_SYMM_MEM: '0'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
        VLLM_MOONCAKE_STORE_SELECTIVE_LEASE: '1'
        MC_SLICE_SIZE: '1048576'
        MC_MAX_MR_SIZE: '4294967296'
        NCCL_P2P_LEVEL: NVL
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        WITH_NVIDIA_PEERMEM: '0'
        NCCL_NET_PLUGIN: none
        UCX_MEMTYPE_REG_WHOLE: n
        UCX_TCP_AF_PRIO: inet
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        VLLM_SSM_CONV_STATE_LAYOUT: DS
        TOKENSPEED_MLA_FP16_PARTIALS: '0'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_ENABLE_GEMM_RS: '0'
        VLLM_WORKER_MULTIPROC_METHOD: spawn
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: '1024'
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: '1024'
        MC_GID_INDEX: '@fabric.rdma-gid-index'
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: moonshotai/Kimi-K3.1-Pro
        prefix-match-unit: 128
        load-format: fastsafetensors
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"mxfp4"}'
        mamba-ssm-cache-dtype: float32
        mamba-cache-dtype: float32
        gpu-memory-utilization: 0.9
        tensor-parallel-size: 4
        data-parallel-size: 4
        data-parallel-rpc-port: 13355
        enable-expert-parallel: true
        moe-backend: deep_gemm_mega_moe
        no-enable-flashinfer-autotune: true
        enable-cumem-allocator: true
        trust-remote-code: true
        max-num-seqs: 128
        max-num-batched-tokens: 8192
        long-prefill-token-threshold: 512
        long-prefill-token-threshold-adaptive: true
        max-cudagraph-capture-size: 8192
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,12,16,20,24,32,40,48,64,80,96,128,160,256,384,512,640,768,896,1024,1152,1280,1408,1536,1664,1792,1920,2048,2304,2560,2816,3072,3328,3584,3840,4096,4608,5120,5632,6144,6656,7168,7680,8192]}'
        stream-interval: 10
        language-model-only: true
        enable-prefix-caching: true
        speculative-config: '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        decode-context-parallel-size: 4
        dcp-comm-backend: a2a
        cp-kv-cache-interleave-size: 1
    decode:
      nodes: 4
      workers: 1
      gpus: 16
      env:
        DYN_TCP_REQUEST_TIMEOUT: '120'
        VLLM_USE_DIRECT_DCP_A2A: '1'
