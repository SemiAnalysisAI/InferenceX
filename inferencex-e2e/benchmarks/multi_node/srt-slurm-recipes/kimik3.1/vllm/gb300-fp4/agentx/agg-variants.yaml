schema: 2

base:
  name: kimik3.1-fp4-gb300-dynamo-vllm-agentx-agg-dcp8
  identity:
    model: {}
    container: {}
    frameworks:
      vllm: "0.23.1rc1.dev7346+gdde0c511f"
      dynamo: "3dd0744eb72c707d76d4c520ae4dea9e286a4ab6"

  # ai-dynamo/dynamo#18124 head: the first Dynamo that registers the kimi_k31 model type.
  dynamo:
    install: true
    source:
      rev: "3dd0744eb72c707d76d4c520ae4dea9e286a4ab6"

  # The DSpark draft is read from the shared Hub cache.
  environment:
    HF_HUB_CACHE: /hf_hub_cache

  slurm:
    time_limit: "04:00:00"

  health_check:
    max_attempts: 720
    interval_seconds: 10

  resources:
    gpu_type: "gb300"
    gpus_per_node: 4

  services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
  - name: mooncake-master
    type: mooncake-master
    args:
    - "--default_kv_lease_ttl=60000"
    - "--eviction_high_watermark_ratio=0.95"
    - "--eviction_ratio=0.10"
    options:
      store_config:
        metadata_server: "P2PHANDSHAKE"
        global_segment_size: "160GB"
        local_buffer_size: "4GB"
        protocol: "rdma"
        device_name: "@fabric.rdma-devices"
        mode: "embedded"
        enable_offload: false

  # The Dynamo frontend and router of disagg-variants.yaml.
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: "least-loaded"
      router-session-affinity-ttl-secs: 1
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
      DYN_TOKENIZER_CACHE_BYTES: "8589934592"
      DYN_TCP_REQUEST_TIMEOUT: "120"
      DYN_DISABLE_OPENAI_STRICT_SCHEMA_VALIDATION: "1"

  engine:
    type: vllm
    connector:
    dp_launch_mode: per_node

  # One TP8 x DCP8 engine serves prefill and decode: the disagg-variants.yaml decode role
  # (TP MoE, latency_specialized decode) with the prefill steps of a chunked-prefill engine.
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        DYN_TCP_REQUEST_TIMEOUT: "120"
        VLLM_USE_DIRECT_DCP_A2A: "1"
        VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
        VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
        VLLM_ALLREDUCE_USE_FLASHINFER: "1"
        VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
        DYN_REQUEST_PLANE: "tcp"
        ETCD_LEASE_TTL: "600"
        VLLM_RPC_TIMEOUT: "600000"
        TILELANG_CLEANUP_TEMP_FILES: "1"
        VLLM_USE_NCCL_SYMM_MEM: "0"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_USE_RUST_FRONTEND: "1"
        VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
        # Lookups lease only the store keys a hit loads.
        VLLM_MOONCAKE_STORE_SELECTIVE_LEASE: "1"
        MC_SLICE_SIZE: "1048576"
        MC_MAX_MR_SIZE: "4294967296"
        NCCL_P2P_LEVEL: "NVL"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        WITH_NVIDIA_PEERMEM: "0"
        NCCL_NET_PLUGIN: "none"
        UCX_MEMTYPE_REG_WHOLE: "n"
        UCX_TCP_AF_PRIO: "inet"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        # The KDA conv state layout the dcp8 decode role runs.
        VLLM_SSM_CONV_STATE_LAYOUT: "DS"
        TOKENSPEED_MLA_FP16_PARTIALS: "0"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_ENABLE_GEMM_RS: "0"
      args:
        # DRAM offload through the Mooncake store only: no NIXL, no P/D.
        kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}'
        served-model-name: "moonshotai/Kimi-K3.1-Pro"
        prefix-match-unit: 128
        load-format: "fastsafetensors"
        kv-cache-dtype: "fp8"
        attention-config: '{"indexer_kv_dtype":"mxfp4"}'
        mamba-ssm-cache-dtype: "float32"
        mamba-cache-dtype: "float32"
        gpu-memory-utilization: 0.95
        tensor-parallel-size: 8
        decode-context-parallel-size: 8
        dcp-comm-backend: "a2a"
        cp-kv-cache-interleave-size: 1
        no-enable-flashinfer-autotune: true
        enable-cumem-allocator: true
        trust-remote-code: true
        stream-interval: 10
        language-model-only: true
        enable-prefix-caching: true
        additional-config: '{"decode_backend":"latency_specialized"}'
        use-replayssm: true
        # A lone prompt prefills in 16384-token chunks (8 of the 2048-token Mamba blocks);
        # next to other requests each prompt's chunk stops at 4096 tokens.
        max-num-batched-tokens: 16384
        long-prefill-token-threshold: 4096
        speculative-config: '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'

  sbatch_directives:
    mem: "0"
    # 72 pins every vLLM worker to socket 0.
    cpus-per-task: "144"
    comment: >-
      '{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very large model will
      take extra loading time."}}'

  srun_options:
    mem: "0"
    container-remap-root: ""

  telemetry:
    collector_join_timeout_seconds: 12

  benchmark:
    placement:
      node: head
    env:
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"

# TP16 x DCP16 aggregated engine with 7 drafts for c=1.
override_agg16_c1:
  roles:
    agg:
      nodes: 4
      gpus: 16
      args: &override_agg16_c1_args
        tensor-parallel-size: 16
        gpu-memory-utilization: 0.90
        decode-context-parallel-size: 16
        speculative-config: '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        max-num-seqs: 1
        max-cudagraph-capture-size: 2048
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[7,8,14,16,28,32,56,64,128,256,512,1024,2048]}'

override_agg16_c1_eval:
  roles:
    agg:
      nodes: 4
      gpus: 16
      args:
        <<: *override_agg16_c1_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
