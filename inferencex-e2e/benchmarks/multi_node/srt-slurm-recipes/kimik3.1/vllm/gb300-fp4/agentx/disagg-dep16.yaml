schema: 2
name: kimik3.1-gb300-disagg-tep8-dep16
resources:
  gpu_type: gb300
  gpus_per_node: 4
health_check:
  max_attempts: 720
  interval_seconds: 10
frontend:
  type: vllm-router
  enable_multiple_frontends: false
  args:
    policy: consistent_hash
    prometheus-host: 127.0.0.1
    prometheus-port: 18000
    request-timeout-secs: 14400
    disable-retries: true
setup_script: vllm-router.sh
engine:
  type: vllm
  connector: null
  dp_launch_mode: per_node
roles:
  prefill:
    nodes: 6
    workers: 3
    gpus: 8
    env: &worker_env
      HF_HOME: /hf_hub_cache
      HF_HUB_CACHE: /hf_hub_cache
      # NIXL moves the KDA short-conv state in three reads, which needs the DS layout.
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_RPC_TIMEOUT: '600000'
      # Outlast the router's pooled connections past Uvicorn's keep-alive.
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
      NCCL_CUMEM_ENABLE: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_NVLS_ENABLE: '1'
      UCX_MEMTYPE_CACHE: 'n'
      UCX_MEMTYPE_REG_WHOLE: 'n'
    args:
      served-model-name: moonshotai/Kimi-K3.1-Pro
      trust-remote-code: true
      language-model-only: true
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      attention-config: '{"indexer_kv_dtype":"mxfp4"}'
      mamba-ssm-cache-dtype: float32
      enable-prefix-caching: true
      stream-interval: 10
      enable-auto-tool-choice: true
      tool-call-parser: kimi_k3
      reasoning-parser: kimi_k3
      tensor-parallel-size: 8
      enable-expert-parallel: true
      moe-backend: deep_gemm_mega_moe
      all2all-backend: flashinfer_nvlink_one_sided
      gpu-memory-utilization: 0.92
      max-num-seqs: 32
      max-num-batched-tokens: 16384
      # 128 GiB of host DRAM per GPU, the upstream recipe's tested GB300 prefill tier.
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda"},{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":137438953472,"lazy_offload":false}}]}}'
      speculative-config: '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","attention_backend":"FLASHINFER_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  decode:
    nodes: 4
    workers: 1
    gpus: 16
    env: *worker_env
    args:
      served-model-name: moonshotai/Kimi-K3.1-Pro
      trust-remote-code: true
      language-model-only: true
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      attention-config: '{"indexer_kv_dtype":"mxfp4"}'
      mamba-ssm-cache-dtype: float32
      enable-prefix-caching: true
      stream-interval: 10
      enable-auto-tool-choice: true
      tool-call-parser: kimi_k3
      reasoning-parser: kimi_k3
      tensor-parallel-size: 1
      data-parallel-size: 16
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      moe-backend: deep_gemm_mega_moe
      all2all-backend: flashinfer_nvlink_one_sided
      gpu-memory-utilization: 0.92
      # 32 sequences per DP rank: 512 slots for 336 trajectories.
      max-num-seqs: 32
      max-num-batched-tokens: 512
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      max-cudagraph-capture-size: 512
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda"}'
      speculative-config: '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","attention_backend":"FLASHINFER_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
sbatch_directives:
  mem: '0'
  cpus-per-task: '72'
srun_options:
  mem: '0'
  container-remap-root: ''
telemetry:
  collector_join_timeout_seconds: 12
benchmark:
  placement:
    node: head
  env:
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
