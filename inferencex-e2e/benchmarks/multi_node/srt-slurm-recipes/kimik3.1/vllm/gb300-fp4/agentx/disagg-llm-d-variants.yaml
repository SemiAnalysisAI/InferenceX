override_1p5d_lpt:
  engine:
    set_visible_devices: true
  roles:
    prefill: &override_1p5d_lpt_prefill
      nodes: 2
      workers: 1
      env:
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      args: &override_1p5d_lpt_prefill_args
        speculative-config: &spec_k4 '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","revision":"e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        prefix-match-unit: 1408
        # Cap a long prompt's chunk at 4096 tokens next to other requests (never below an equal share of the 16384-token budget).
        long-prefill-token-threshold: 4096
        long-prefill-token-threshold-adaptive: true
    decode: &override_1p5d_lpt_decode
      nodes: 10
      workers: 5
      # Opt-in TP8 x DCP8 decode paths of this image (default off) for the 1P5D points: specialized decode
      # steps at 5-40 rows (T8T/T8M/S21/S22/S23), KDA and attention kernels (KDA8/TCS/E32/EXP8), one-pass
      # decode prep (NP1), fused drafter layers (DRF/S31).
      env: &k31_tp8_decode_env
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
        K31_DRF_ATTN: "1"
        K31_DRF_ACT: "1"
        K31_S31MK: "1"
        K31_S31FC: "1"
        K31_S31DG: "1"
        K31_S31AR: "1"
        K31_DCPV8: "1"
        K31_NP1: "1"
        K31_NP1_MAX_REQS: "8"
        K31_T8T: "1"
        K31_T8T_POLL0: "1"
        K31_T8T_VOTE: "1"
        K31_T8T_SD15: "1"
        K31_T8M: "1"
        K31_E32: "1"
        K31_TCS: "1"
        K31_TCS45: "1"
        K31_EXP8: "1"
        K31_EXP8W: "1"
        K31_KDA8: "1"
        K31_KDA8_TABLE: "12:1-8;6:1"
        K31_KDA8_LEAN: "12:1-8"
        K31_S20J: "1"
        K31_S20QAF: "1"
        K31_S20OPU: "1"
        K31_S21N8: "1"
        K31_S21T8M: "1"
        K31_S21T8T: "1"
        K31_S21W40: "1"
        K31_S21E32W: "16"
        K31_S22T56: "1"
        K31_S22DG: "1"
        K31_S22SP: "1"
        K31_S22LC: "1"
        K31_S22IP: "1"
        K31_S23KS: "1"
        K31_S23G4: "1"
        K31_S23DR: "1"
        K31_S24FM: "1"
      args: &override_1p5d_lpt_decode_args
        speculative-config: *spec_k4
        prefix-match-unit: 1408

