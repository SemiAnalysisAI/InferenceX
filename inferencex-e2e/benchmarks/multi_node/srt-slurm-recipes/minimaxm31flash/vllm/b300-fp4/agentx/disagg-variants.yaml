schema: 2

base:
  name: minimaxm31flash-b300-disagg-mooncake
  identity:
    frameworks:
      dynamo: 1.6.0.dev20261023
  dynamo:
    install: true
    source:
      wheel: 1.6.0.dev20261023
  resources:
    gpu_type: b300
    gpus_per_node: 8
  observability:
    tachometer:
      enabled: false
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  environment:
    PYTHONHASHSEED: '0'
    # vllm-mooncake-efa.sh installs libfabric to efa-1.50 when the host mounts /opt/amazon/efa read-only.
    LD_LIBRARY_PATH: &efa-library-path /opt/amazon/efa-1.50/lib:/opt/amazon/efa/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/nvidia/lib
  services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
  - name: mooncake-master
    type: mooncake-master
    preamble: bash /configs/vllm-mooncake.sh
    args:
    - --default_kv_lease_ttl=60000
    - --eviction_high_watermark_ratio=0.95
    - --eviction_ratio=0.10
    options:
      # Workers are store clients; the per-socket mooncake-store services below own the DRAM.
      store_config:
        metadata_server: P2PHANDSHAKE
        global_segment_size: '0'
        local_buffer_size: 4GB
        # With no device list, Mooncake discovers every EFA NIC on the node.
        protocol: efa
        mode: standalone-store
        enable_offload: false
  # Each store binds its socket's memory, and the stores, not the workers, own the pool: 697 GiB beside
  # prefill and 1396 GiB beside decode, the two DRAM shares. EFA needs a segment this large on 2 MB pages,
  # which glibc requests from THP. Registering them can take many minutes, hence the long waits.
  - name: mooncake-store-prefill-numa0
    type: mooncake-store
    placement:
      node: prefill
    command: [numactl, --cpunodebind=0, --membind=0, python3, -m, mooncake.mooncake_store_service]
    args: [--config=/tmp/mooncake-store-numa0.json, --port=8090, --max-wait-time=3600]
    readiness:
      port: 8090
      timeout_seconds: 3600
    env:
      STORE_CONFIG: /tmp/mooncake-store-numa0.json
      STORE_SEGMENT_SIZE: 348GB
      LD_LIBRARY_PATH: *efa-library-path
      GLIBC_TUNABLES: glibc.malloc.hugetlb=1
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_SLICE_SIZE: '1048576'
      MC_WORKERS_PER_CTX: '4'
    preamble: &store-preamble |
      bash /configs/vllm-mooncake-efa.sh
      python3 - <<'PY'
      import json, os
      json.dump({
          "local_hostname": os.environ["MOONCAKE_LOCAL_HOSTNAME"],
          "metadata_server": "P2PHANDSHAKE",
          "master_server_address": os.environ["MOONCAKE_MASTER"],
          "global_segment_size": os.environ["STORE_SEGMENT_SIZE"],
          "local_buffer_size": "4GB",
          "protocol": "efa",
          "device_name": "",
      }, open(os.environ["STORE_CONFIG"], "w"))
      PY
      [ -s "$STORE_CONFIG" ]
  - name: mooncake-store-prefill-numa1
    type: mooncake-store
    placement:
      node: prefill
    command: [numactl, --cpunodebind=1, --membind=1, python3, -m, mooncake.mooncake_store_service]
    args: [--config=/tmp/mooncake-store-numa1.json, --port=8091, --max-wait-time=3600]
    readiness:
      port: 8091
      timeout_seconds: 3600
    env:
      STORE_CONFIG: /tmp/mooncake-store-numa1.json
      STORE_SEGMENT_SIZE: 349GB
      LD_LIBRARY_PATH: *efa-library-path
      GLIBC_TUNABLES: glibc.malloc.hugetlb=1
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_SLICE_SIZE: '1048576'
      MC_WORKERS_PER_CTX: '4'
    preamble: *store-preamble
  - name: mooncake-store-decode-numa0
    type: mooncake-store
    placement:
      node: decode
    command: [numactl, --cpunodebind=0, --membind=0, python3, -m, mooncake.mooncake_store_service]
    args: [--config=/tmp/mooncake-store-numa0.json, --port=8090, --max-wait-time=3600]
    readiness:
      port: 8090
      timeout_seconds: 3600
    env:
      STORE_CONFIG: /tmp/mooncake-store-numa0.json
      STORE_SEGMENT_SIZE: 698GB
      LD_LIBRARY_PATH: *efa-library-path
      GLIBC_TUNABLES: glibc.malloc.hugetlb=1
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_SLICE_SIZE: '1048576'
      MC_WORKERS_PER_CTX: '4'
    preamble: *store-preamble
  - name: mooncake-store-decode-numa1
    type: mooncake-store
    placement:
      node: decode
    command: [numactl, --cpunodebind=1, --membind=1, python3, -m, mooncake.mooncake_store_service]
    args: [--config=/tmp/mooncake-store-numa1.json, --port=8091, --max-wait-time=3600]
    readiness:
      port: 8091
      timeout_seconds: 3600
    env:
      STORE_CONFIG: /tmp/mooncake-store-numa1.json
      STORE_SEGMENT_SIZE: 698GB
      LD_LIBRARY_PATH: *efa-library-path
      GLIBC_TUNABLES: glibc.malloc.hugetlb=1
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_SLICE_SIZE: '1048576'
      MC_WORKERS_PER_CTX: '4'
    preamble: *store-preamble
  - name: otel-collector
    type: otel-collector
    enabled: false
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: 14400
      migration-limit: 1
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
      DYN_TCP_CONNECT_TIMEOUT: '120'
      DYN_TOKENIZER: fastokens
      # The default ~5 s request-plane timeout drops workers during AgentX's no-delay warmup burst.
      DYN_TCP_REQUEST_TIMEOUT: '60'
      DYN_TCP_MAX_MESSAGE_SIZE: '67108864'
      DYN_TCP_CHANNEL_BUFFER: '128'
      DYN_HTTP_BACKEND_TTFT_STREAM_TIMEOUT_SECS: '1800'
      DYN_HTTP_SSE_INACTIVITY_TIMEOUT_SECS: '3600'
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    placement:
      node: dedicated
  engine:
    type: vllm
    connector: null
    dp_launch_mode: per_node
  roles:
    prefill:
      kv_events: true
      nodes: 1
      workers: 1
      gpus: 2
      env:
        VLLM_FLOAT32_MATMUL_PRECISION: high
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        PYTHONUNBUFFERED: '1'
        DYN_TCP_CONNECT_TIMEOUT: '120'
        NCCL_NET_PLUGIN: none
        NCCL_P2P_LEVEL: NVL
        NIXL_TELEMETRY_ENABLE: 'y'
        NIXL_TELEMETRY_PROMETHEUS_PORT: '0'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: '1024'
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: '1024'
        DYN_BACKEND_ADMISSION_REQUEST_QUEUE_LIMIT: '2048'
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '8'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_SLICE_SIZE: '1048576'
        MC_WORKERS_PER_CTX: '4'
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        language-model-only: true
        trust-remote-code: true
        enable-expert-parallel: true
        kv-cache-dtype: nvfp4
        block-size: 128
        attention-config: '{"indexer_kv_dtype":"nvfp4","use_prefill_query_quantization":true}'
        disable-hybrid-kv-cache-manager: true
        max-model-len: 1048576
        kernel-config: '{"moe_backend":"deep_gemm_mega_moe"}'
        dyn-tool-call-parser: minimax_m3
        dyn-reasoning-parser: minimax_m3
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        tensor-parallel-size: 1
        data-parallel-size: 2
        # Prefill GPU KV bounds how many async Mooncake loads can be in flight; 0.92 beat 0.85 at c200.
        gpu-memory-utilization: 0.92
        max-num-seqs: 64
        max-num-batched-tokens: 32768
        long-prefill-token-threshold: 4096
        prefill-schedule-interval: 1
        enable-prefix-caching: true
        # EFA RMA sets CUDA sync-memops on each MR, which VMM memory rejects, so libfabric returns EINVAL.
        no-enable-extensible-kv-cache: true
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE"}'
        max-cudagraph-capture-size: 2048
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["LIBFABRIC"],"enforce_handshake_compat":false,"kv_lease_duration":120}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_offload":false}}]}}'
    decode:
      nodes: 1
      workers: 1
      gpus: 4
      env:
        VLLM_FLOAT32_MATMUL_PRECISION: high
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        PYTHONUNBUFFERED: '1'
        DYN_TCP_CONNECT_TIMEOUT: '120'
        NCCL_NET_PLUGIN: none
        NCCL_P2P_LEVEL: NVL
        NIXL_TELEMETRY_ENABLE: 'y'
        NIXL_TELEMETRY_PROMETHEUS_PORT: '0'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: '1024'
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: '1024'
        DYN_BACKEND_ADMISSION_REQUEST_QUEUE_LIMIT: '2048'
        VLLM_MAX_ASYNC_KV_ADMITS_PER_STEP: '4'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        language-model-only: true
        trust-remote-code: true
        kv-cache-dtype: nvfp4
        block-size: 128
        attention-config: '{"indexer_kv_dtype":"nvfp4","use_prefill_query_quantization":true}'
        disable-hybrid-kv-cache-manager: true
        max-model-len: 1048576
        dyn-tool-call-parser: minimax_m3
        dyn-reasoning-parser: minimax_m3
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        gpu-memory-utilization: 0.95
        max-num-seqs: 48
        # A decode preemption recomputes the whole context locally; 8192-token steps plus the
        # watermark keep running requests below the KV limit instead.
        max-num-batched-tokens: 8192
        watermark: 0.05
        enable-prefix-caching: true
        # EFA RMA sets CUDA sync-memops on each MR, which VMM memory rejects, so libfabric returns EINVAL.
        no-enable-extensible-kv-cache: true
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        max-cudagraph-capture-size: 384
        # Decode takes prompt KV over NIXL only; the Mooncake pool serves prefill.
        kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["LIBFABRIC"],"enforce_handshake_compat":false,"kv_lease_duration":120}}'
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      AIPERF_SERVER_METRICS_COLLECTION_INTERVAL: '1.0'
    placement:
      node: dedicated
  srun_options:
    container-remap-root: ''
  setup_script: vllm-mooncake-efa.sh

override_1p1d_dep2_dep4:
  roles:
    decode:
      env:
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
        VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
      args:
        enable-expert-parallel: true
        kernel-config: '{"moe_backend":"deep_gemm_mega_moe"}'
        tensor-parallel-size: 1
        data-parallel-size: 4

override_1p1d_dep2_tp4_c24:
  roles:
    decode:
      args:
        tensor-parallel-size: 4
