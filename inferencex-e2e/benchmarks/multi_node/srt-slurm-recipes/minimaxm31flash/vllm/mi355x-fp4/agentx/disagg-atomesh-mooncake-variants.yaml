schema: 2

base:
  name: minimaxm31flash-fp4-mi355x-atomesh-vllm-mooncake-agentic
  identity:
    model: {}
    container: {}
  slurm:
    time_limit: "08:00:00"
  container_mounts:
    /dev/infiniband: /dev/infiniband
  extra_mount:
    - /usr/lib/x86_64-linux-gnu/libibverbs/libionic-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libionic-rdmav34.so:ro
    - /etc/libibverbs.d/ionic.driver:/etc/libibverbs.d/ionic.driver:ro
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  health_check:
    interval_seconds: 10
    max_attempts: 720
  environment:
    NCCL_SOCKET_IFNAME: '@fabric.socket-ifname'
    GLOO_SOCKET_IFNAME: '@fabric.socket-ifname'
    NCCL_IB_HCA: '@fabric.rdma-devices'
    NCCL_IB_GID_INDEX: '@fabric.rdma-gid-index'
  frontend:
    type: atomesh
    container_image: rocm/atom-dev:nightly_202611110332@sha256:19712185deac1eca8db5f21bc25ff2f9a3f44758bfd7cec8cc1c7889fbea097d
    enable_multiple_frontends: false
    args:
      policy: dp_sticky
      prefill-policy: dp_sticky
      decode-policy: dp_sticky
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: mooncake
    set_visible_devices: true
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        <<: &common_args
          served-model-name: amd/MiniMax-M3.1-Flash-Quark-MXFP4
          tensor-parallel-size: 4
          gpu-memory-utilization: 0.85
          language-model-only: true
          trust-remote-code: true
          reasoning-parser: minimax_m3
          tool-call-parser: minimax_m3
          enable-auto-tool-choice: true
          block-size: 128
          kv-cache-dtype: nvfp4
          attention-config: '{"indexer_kv_dtype":"nvfp4","indexer_decode_cp":true}'
          moe-backend: aiter
          disable-hybrid-kv-cache-manager: true
          enable-prefix-caching: true
          max-model-len: 1048576
          speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"TRITON_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          enable-batch-sharded-sampling: true
          renderer-num-workers: 8
          enable-prompt-tokens-details: true
          disable-uvicorn-access-log: true
        max-num-batched-tokens: 32768
        enable-dbo: true
        dbo-prefill-token-threshold: 16384
        dbo-decode-token-threshold: 32768
        compilation-config: '{"max_cudagraph_capture_size":2048}'
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"MooncakeConnector","kv_role":"kv_producer","kv_connector_extra_config":{"mooncake_protocol":"rdma","num_workers":10}},{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":1349000000000,"lazy_offload":false,"cpu_lru_eviction":true}}]}}'
      env:
        <<: &common_env
          VLLM_ROCM_USE_AITER: '1'
          VLLM_ROCM_USE_AITER_MOE: '1'
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: '0'
          VLLM_USE_V2_MODEL_RUNNER: '1'
          VLLM_USE_BREAKABLE_CUDAGRAPH: '1'
          DEBUG_HIP_DYNAMIC_QUEUES: '0'
          DEBUG_HIP_IGNORE_STREAM_PRIORITY: '0'
          HIP_FORCE_DEV_KERNARG: '1'
          NCCL_DMABUF_ENABLE: '0'
          HSA_ENABLE_IPC_MODE_LEGACY: '1'
          PYTHONHASHSEED: '0'
          PYTHONNOUSERSITE: '1'
          PYTHONUNBUFFERED: '1'
          AITER_LOG_LEVEL: WARNING
          VLLM_ENGINE_READY_TIMEOUT_S: '7200'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1200'
          VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '3600'
          MC_GID_INDEX: '@fabric.rdma-gid-index'
          MC_IB_TC: '@fabric.rdma-tc'
          MC_MAX_CONCURRENT_REG_MR: '1'
          VLLM_MOONCAKE_CONNECTOR_TIMEOUT: '600'
          HF_HOME: /hf_hub_cache
          HF_HUB_CACHE: /hf_hub_cache/hub
        MC_MAX_MR_SIZE: '1073741824'
    decode:
      nodes: 1
      workers: 2
      gpus: 4
      args:
        <<: *common_args
        max-num-batched-tokens: 8192
        kv-transfer-config: '{"kv_connector":"MooncakeConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"mooncake_protocol":"rdma","num_workers":10}}'
      env:
        <<: *common_env
        MC_MAX_MR_SIZE: '268435456'
  sbatch_directives:
    cpus-per-task: "128"
    mem: "0"
  srun_options:
    mem: "0"
    container-writable: ""
    container-remap-root: ""
  benchmark:
    placement:
      node: head
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: 'true'

override_c40:
  roles:
    prefill:
      args:
        max-num-seqs: 80
    decode:
      args:
        max-num-seqs: 5
        compilation-config: '{"cudagraph_capture_sizes":[8,16,24,32,40],"max_cudagraph_capture_size":40}'

override_c48:
  roles:
    prefill:
      args:
        max-num-seqs: 96
    decode:
      args:
        max-num-seqs: 6
        compilation-config: '{"cudagraph_capture_sizes":[8,16,24,32,40,48],"max_cudagraph_capture_size":48}'

override_c56:
  roles:
    prefill:
      args:
        max-num-seqs: 112
    decode:
      args:
        max-num-seqs: 7
        compilation-config: '{"cudagraph_capture_sizes":[8,16,24,32,40,48,56],"max_cudagraph_capture_size":56}'

override_c64:
  roles:
    prefill:
      args:
        max-num-seqs: 128
    decode:
      args:
        max-num-seqs: 8
        compilation-config: '{"cudagraph_capture_sizes":[8,16,24,32,40,48,56,64],"max_cudagraph_capture_size":64}'

override_c72:
  roles:
    prefill:
      args:
        max-num-seqs: 144
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"MooncakeConnector","kv_role":"kv_producer","kv_connector_extra_config":{"mooncake_protocol":"rdma","num_workers":10}},{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":1499000000000,"lazy_offload":false,"cpu_lru_eviction":true}}]}}'
    decode:
      args:
        max-num-seqs: 10
        compilation-config: '{"cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80],"max_cudagraph_capture_size":80}'

override_c80:
  roles:
    prefill:
      args:
        max-num-seqs: 160
        long-prefill-token-threshold: 4096
        gpu-memory-utilization: 0.75
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"MooncakeConnector","kv_role":"kv_producer","kv_connector_extra_config":{"mooncake_protocol":"rdma","num_workers":10}},{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":1499000000000,"lazy_offload":false,"cpu_lru_eviction":true}}]}}'
    decode:
      args:
        max-num-seqs: 10
        compilation-config: '{"cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80],"max_cudagraph_capture_size":80}'
