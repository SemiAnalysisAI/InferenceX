schema: 2
base:
  identity:
    frameworks:
      dynamo: 1.6.0.dev20261023
  dynamo:
    install: true
    source:
      wheel: 1.6.0.dev20261023
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  observability:
    tachometer:
      enabled: false
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  environment:
    PYTHONHASHSEED: '0'
  services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: 14400
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
      HF_HOME: /hf_hub_cache
      HF_HUB_CACHE: /hf_hub_cache
      DYN_TCP_CONNECT_TIMEOUT: '120'
      DYN_TOKENIZER: fastokens
  engine:
    type: vllm
    connector: null
  roles:
    agg:
      kv_events: true
      nodes: 1
      workers: 1
      gpus: 4
      env:
        HF_HOME: /hf_hub_cache
        HF_HUB_CACHE: /hf_hub_cache
        VLLM_FLOAT32_MATMUL_PRECISION: high
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        PYTHONUNBUFFERED: '1'
        DYN_TCP_CONNECT_TIMEOUT: '120'
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: '1024'
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: '1024'
        DYN_BACKEND_ADMISSION_REQUEST_QUEUE_LIMIT: '2048'
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        language-model-only: true
        trust-remote-code: true
        dyn-tool-call-parser: minimax_m3
        dyn-reasoning-parser: minimax_m3
        # MSA sparse/index cache needs 128-token blocks.
        block-size: 128
        # The checkpoint is QAT-trained for an NVFP4 KV cache.
        kv-cache-dtype: nvfp4
        attention-config: '{"indexer_kv_dtype":"nvfp4","use_prefill_query_quantization":true}'
        disable-hybrid-kv-cache-manager: true
        enable-prefix-caching: true
        max-model-len: 1048576
        tensor-parallel-size: 4
        # AgentX requires a stream interval of 20 to 60 tokens; vLLM defaults to 1.
        stream-interval: 20
        # Same prefill-schedule-interval as the GB300 TP4 points (#4998).
        prefill-schedule-interval: 24
        max-num-batched-tokens: 32768
        # Prefill graphs to 8192 tokens; longer capture lists cost KV memory.
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256,320,384,448,512,576,640,704,768,832,896,960,1024,1536,2048,3072,4096,6144,8192]}'
        # Golden AL 4.04.
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASH_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  sbatch_directives:
    cpus-per-task: '72'
    mem: '0'
  srun_options:
    container-remap-root: ''
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
  name: minimaxm31flash-gb200-agg
override_tp4_c8:
  name: minimaxm31flash-gb200-agg-tp4-c8
  roles:
    agg:
      args:
        max-num-seqs: 16
        gpu-memory-utilization: 0.88
override_tp4_c12:
  name: minimaxm31flash-gb200-agg-tp4-c12
  roles:
    agg:
      args:
        max-num-seqs: 24
        gpu-memory-utilization: 0.88
override_tp4_c16:
  name: minimaxm31flash-gb200-agg-tp4-c16
  roles:
    agg:
      args:
        max-num-seqs: 32
        gpu-memory-utilization: 0.88
override_tp4_c32:
  name: minimaxm31flash-gb200-agg-tp4-dram-c32
  roles:
    agg:
      args:
        max-num-seqs: 64
        gpu-memory-utilization: 0.82
        kv-cache-metrics: true
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":360000000000,"lazy_offload":true}}'
override_tp4_c40:
  name: minimaxm31flash-gb200-agg-tp4-dram-c40
  roles:
    agg:
      args:
        max-num-seqs: 64
        gpu-memory-utilization: 0.82
        kv-cache-metrics: true
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":360000000000,"lazy_offload":true}}'

# Specialized decode (vllm-project/vllm#66324, opt-in with decode_backend
# latency_specialized): fused CuTe DSL kernels for FULL-graph decode steps of up to
# 8 requests x (7 + 1) rows; larger steps and prefill run the stock forward. The
# executor refuses NVFP4 caches, so these points run fp8 KV and fp8 index-K caches,
# with the FLASHINFER_TS drafter backend the PR validated. The nightly includes
# the PR; no patch.
# Above 16 the stock points run as before. The server ran about 6 requests at once
# at most, even at concurrency 16, so every specialized point caps max-num-seqs at
# 8, the kernel's request cap.
# CUDA graphs: FULL decode graphs at every DSpark step size, 8 to 64 rows
# (1 to 8 requests x (7 + 1) tokens), and PIECEWISE graphs for mixed prefill steps
# up to 8192 tokens, spaced so a step pads by at most 12.5% (25% from 64 to 128).
override_tp4_sd_c1:
  name: minimaxm31flash-gb200-agg-tp4-sd-c1
  roles:
    agg:
      args:
        max-num-seqs: 8
        gpu-memory-utilization: 0.9
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        async-scheduling: true
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,144,160,176,192,208,224,240,256,288,320,352,384,416,448,480,512,576,640,704,768,832,896,960,1024,1152,1280,1408,1536,1664,1792,1920,2048,2304,2560,2816,3072,3328,3584,3840,4096,4608,5120,5632,6144,6656,7168,7680,8192]}'
override_tp4_sd_c4:
  name: minimaxm31flash-gb200-agg-tp4-sd-c4
  roles:
    agg:
      args:
        max-num-seqs: 8
        gpu-memory-utilization: 0.9
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        async-scheduling: true
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,144,160,176,192,208,224,240,256,288,320,352,384,416,448,480,512,576,640,704,768,832,896,960,1024,1152,1280,1408,1536,1664,1792,1920,2048,2304,2560,2816,3072,3328,3584,3840,4096,4608,5120,5632,6144,6656,7168,7680,8192]}'
override_tp4_sd_c8:
  name: minimaxm31flash-gb200-agg-tp4-sd-c8
  roles:
    agg:
      args:
        max-num-seqs: 8
        gpu-memory-utilization: 0.9
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        async-scheduling: true
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,144,160,176,192,208,224,240,256,288,320,352,384,416,448,480,512,576,640,704,768,832,896,960,1024,1152,1280,1408,1536,1664,1792,1920,2048,2304,2560,2816,3072,3328,3584,3840,4096,4608,5120,5632,6144,6656,7168,7680,8192]}'
override_tp4_sd_c12:
  name: minimaxm31flash-gb200-agg-tp4-sd-c12
  roles:
    agg:
      args:
        max-num-seqs: 8
        gpu-memory-utilization: 0.9
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        async-scheduling: true
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,144,160,176,192,208,224,240,256,288,320,352,384,416,448,480,512,576,640,704,768,832,896,960,1024,1152,1280,1408,1536,1664,1792,1920,2048,2304,2560,2816,3072,3328,3584,3840,4096,4608,5120,5632,6144,6656,7168,7680,8192]}'
# Concurrency 16 outgrows the fp8 KV pool (about half NVFP4's tokens): prefixes of
# waiting sessions get evicted and re-prefilled. A CPU tier holds them (vLLM #66324
# allows SimpleCPUOffloadConnector with the specialized decode). cpu_bytes_to_use is
# server-wide, so the c32/c40 points' 360 GB is 90 GB a rank: about the fp8 GPU
# pool's 3.2M tokens, and reloaded prefixes stay cached on both tiers, so it held
# little more than the GPUs. 640 GB (160 GB a rank, about 5.8M fp8 tokens, 71% of
# the node's 860,160 MiB) covers stock NVFP4's 6.55M-token pool. The GPUs keep the
# 0.9 memory utilization of the other specialized points.
override_tp4_sd_dram_c16:
  name: minimaxm31flash-gb200-agg-tp4-sd-dram-c16
  roles:
    agg:
      args:
        max-num-seqs: 8
        gpu-memory-utilization: 0.9
        kv-cache-dtype: fp8
        attention-config: '{"indexer_kv_dtype":"fp8"}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_TS","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        async-scheduling: true
        additional-config: '{"decode_backend":"latency_specialized"}'
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,144,160,176,192,208,224,240,256,288,320,352,384,416,448,480,512,576,640,704,768,832,896,960,1024,1152,1280,1408,1536,1664,1792,1920,2048,2304,2560,2816,3072,3328,3584,3840,4096,4608,5120,5632,6144,6656,7168,7680,8192]}'
        kv-cache-metrics: true
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":640000000000,"lazy_offload":true}}'
