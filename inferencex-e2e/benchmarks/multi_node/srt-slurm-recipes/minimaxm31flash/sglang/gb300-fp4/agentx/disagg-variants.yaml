schema: 2

base:
  name: minimaxm31flash-fp4-gb300-dynamo-sglang-agentx-disagg
  identity:
    model: {}
    frameworks:
      dynamo: "1.8.0.dev20261121"
      sglang: "0.0.0.dev1+g93edbeb3a"
  dynamo:
    install: false
    request_plane: tcp
    event_plane: zmq
  environment:
    HF_HUB_CACHE: /hf_hub_cache
  # Tachometer's per-node exporters slow decode steps and add host memory;
  # InferenceX does not read its output.
  observability:
    tachometer:
      enabled: false
  slurm:
    time_limit: "6:00:00"
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    # Disables Dynamo's per-request lifecycle span export; InferenceX does not read it.
    - name: otel-collector
      type: otel-collector
      enabled: false
  # Keeps tokenize, route and stream CPU work off the engine trays.
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    placement:
      node: dedicated
    env:
      DYN_ROUTER_TEMPERATURE: "0"
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
      DYN_TCP_CONNECT_TIMEOUT: "120"
      # The default frontend tokenizer disables its prefix cache for this model,
      # so every turn would re-tokenize the full prompt.
      DYN_TOKENIZER: "fastokens"
      DYN_TOKENIZER_CACHE: "1"
      DYN_TOKENIZER_CACHE_BYTES: "8000000000"
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: "14400"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"
  engine: sglang
  roles:
    prefill:
      nodes: 3
      env:
        PYTHONUNBUFFERED: "1"
        PYTHONNOUSERSITE: "1"
        FMHA_SM100_ALLOW_JIT: "1"
        SGLANG_TIMEOUT_KEEP_ALIVE: "1800"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "32768"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        MC_FORCE_MNNVL: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        # Some GB300 nodes list a BMC interface with the same address on every node first.
        MC_TCP_BIND_ADDRESS: "{node}"
        WITH_NVIDIA_PEERMEM: "0"
        # Dynamo 1.7 backend admission rejects turns with 529 once a DP rank is full;
        # the SGLang scheduler queues them instead.
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: "10000"
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: "10000"
        DYN_BACKEND_ADMISSION_REQUEST_QUEUE_LIMIT: "10000"
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        trust-remote-code: true
        reasoning-parser: minimax-m3
        tool-call-parser: minimax-m3
        tensor-parallel-size: 2
        # SGLang 1.0 sets attention DP with attn-dp-size; dp-size now counts replicas.
        attn-dp-size: 2
        expert-parallel-size: 2
        enable-dp-lm-head: true
        # flashinfer_trtllm_routed needs attention TP to match EP, which attention DP breaks.
        moe-a2a-backend: megamoe
        disaggregation-transfer-backend: mooncake
        chunked-prefill-size: 16384
        # Shortest uncached prefill first: short cached turns stop queueing
        # behind long uncached prompts, which cuts the TTFT tail.
        schedule-policy: shortest-prefill-first
        # 64 per DP rank.
        max-running-requests: 128
        mem-fraction-static: 0.85
        enable-hierarchical-cache: true
        # 200 GB per rank (400 of the 482 GB per-worker allowance): at 60
        # sessions per prefill worker a 150 GB host pool thrashes and the prefix
        # hit rate collapses.
        hicache-size: 200
        hicache-write-policy: write_back
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 7
        speculative-use-block-verification: true
        speculative-draft-kv-cache-dtype: fp8_e4m3
        # A session's turns stay on one prefill worker.
        router-mode: kv
        router-session-affinity-ttl-secs: "14400"
        watchdog-timeout: 3600
        enable-metrics: true
        enable-cache-report: true
      kv_events: true
    decode:
      nodes: 2
      env:
        PYTHONUNBUFFERED: "1"
        PYTHONNOUSERSITE: "1"
        FMHA_SM100_ALLOW_JIT: "1"
        SGLANG_TIMEOUT_KEEP_ALIVE: "1800"
        DYN_SGL_GATEWAY_WORKERS: "8"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
        SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "16384"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_CUMEM_ENABLE: "1"
        MC_FORCE_MNNVL: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        MC_TCP_BIND_ADDRESS: "{node}"
        WITH_NVIDIA_PEERMEM: "0"
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: "10000"
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: "10000"
        DYN_BACKEND_ADMISSION_REQUEST_QUEUE_LIMIT: "10000"
      args:
        served-model-name: MiniMaxAI/MiniMax-M3.1-Flash
        trust-remote-code: true
        reasoning-parser: minimax-m3
        tool-call-parser: minimax-m3
        tensor-parallel-size: 8
        attn-dp-size: 8
        expert-parallel-size: 8
        enable-dp-lm-head: true
        moe-a2a-backend: megamoe
        disaggregation-transfer-backend: mooncake
        # The frontend picks the decode DP rank; least-loaded sends each request to
        # the rank with the fewest in flight, where round-robin left the busiest rank
        # at 1.45x the mean and every DP rank waits for it each step.
        router-mode: least-loaded
        load-balance-method: total_tokens
        # 48 per DP rank.
        max-running-requests: 384
        cuda-graph-max-bs-decode: 48
        mem-fraction-static: 0.85
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 7
        speculative-use-block-verification: true
        speculative-draft-kv-cache-dtype: fp8_e4m3
        watchdog-timeout: 3600
        enable-metrics: true
      kv_events: false
  sbatch_directives:
    mem: "0"
    exclusive: ""
  srun_options:
    container-remap-root: ""
    mem: "0"
  benchmark:
    placement:
      node: dedicated
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"

override_4p_dep4_dep16_si20_linker:
  name: minimaxm31flash-fp4-gb300-dynamo-sglang-agentx-disagg-4p-dep4-dep16-si20-linker
  # Lists replace on merge, so this repeats every base service. Every decode
  # node runs 4 x 190 GB stores; the infra node runs no inference worker, so it
  # holds no KV cache.
  services: &gb300-linker-services
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: mooncake-master
      type: mooncake-master
      # The image ships mooncake-transfer-engine-cuda13 without the master
      # binary on PATH; find it or reinstall the same version.
      preamble: |
        export PATH="$(dirname "$(python3 -c 'import sys; print(sys.executable)')"):$PATH"
        if ! command -v mooncake_master >/dev/null; then
          MC_DIR=$(python3 -c 'import mooncake, os; print(os.path.dirname(mooncake.__file__))')
          if [ -x "$MC_DIR/mooncake_master" ]; then
            export PATH="$MC_DIR:$PATH"
          else
            pip_install=(python3 -m pip install)
            if python3 -m pip install --help 2>/dev/null | grep -q -- --break-system-packages; then
              pip_install+=(--break-system-packages)
            fi
            "${pip_install[@]}" --quiet --no-cache-dir --no-deps --force-reinstall \
              "mooncake-transfer-engine-cuda13==$(python3 -c 'import importlib.metadata as m; print(m.version("mooncake-transfer-engine-cuda13"))')"
          fi
        fi
        command -v mooncake_master
      args:
        # Past 95% full the master evicts the 10% of objects with the oldest
        # lease. The lease sets when an object becomes evictable, not the
        # order; 120 s stays above the slowest load batch.
        - --default_kv_lease_ttl=120000
        - --eviction_high_watermark_ratio=0.95
        - --eviction_ratio=0.10
        - --rpc_thread_num=64
    # Each store runs once on every decode node.
    - &gb300-decode-store
      name: store-decode-0
      type: mooncake-store
      command: ["python3", "-m", "mooncake.mooncake_store_service"]
      placement:
        node: decode
      args: ["--port", "8800"]
      env:
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "@fabric.rdma-devices"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 190gb
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        MC_TCP_BIND_ADDRESS: "{node_ip}"
      preamble: |
        ulimit -n 1048576
        ulimit -l unlimited
      readiness:
        port: 8800
        timeout_seconds: 600
    - <<: *gb300-decode-store
      name: store-decode-1
      args: ["--port", "8801"]
      readiness:
        port: 8801
        timeout_seconds: 600
    - <<: *gb300-decode-store
      name: store-decode-2
      args: ["--port", "8802"]
      readiness:
        port: 8802
        timeout_seconds: 600
    - <<: *gb300-decode-store
      name: store-decode-3
      args: ["--port", "8803"]
      readiness:
        port: 8803
        timeout_seconds: 600
    # Disables Dynamo's per-request lifecycle span export; InferenceX does not read it.
    - name: otel-collector
      type: otel-collector
      enabled: false
  roles:
    prefill:
      nodes: 4
      env: &gb300-linker-prefill-env
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "@fabric.rdma-devices"
        # Per worker, split across its TP ranks: 190 GB per DEP4 rank.
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 190gb
        MOONCAKE_STANDALONE_STORAGE: "0"
      args: &gb300-dep4-linker-prefill-args
        tensor-parallel-size: 4
        attn-dp-size: 4
        expert-parallel-size: 4
        # Divided by the DP size: 8192 per rank.
        chunked-prefill-size: 32768
        max-running-requests: 256
        stream-interval: 20
        mem-fraction-static: 0.85
        enable-hierarchical-cache: null
        hicache-size: null
        hicache-write-policy: null
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mooncake
        unified-cache-external-linker-config: '{"load_mode":"prefetch","enable_group_semantics":false}'
    decode: &gb300-dep16-decode
      nodes: 4
      args:
        tensor-parallel-size: 16
        attn-dp-size: 16
        expert-parallel-size: 16
        max-running-requests: 768
        stream-interval: 20

override_3p_dep4_dep16_si20_linker:
  name: minimaxm31flash-fp4-gb300-dynamo-sglang-agentx-disagg-3p-dep4-dep16-si20-linker
  services: *gb300-linker-services
  roles:
    prefill:
      nodes: 3
      env: *gb300-linker-prefill-env
      args: *gb300-dep4-linker-prefill-args
    decode: *gb300-dep16-decode

