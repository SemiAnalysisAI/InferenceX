override_3p_dep4_dep16_si20_linker:
  name: minimaxm31flash-fp4-gb300-dynamo-sglang-agentx-disagg-3p-dep4-dep16-si20-linker
  # The unified-cache external linker replaces the prefill HiCache: one
  # Mooncake pool read by RDMA straight into device memory. Each prefill rank
  # contributes a 190 GB segment; decode keeps its radix cache off (the linker
  # needs it on, which DP attention marks experimental), so decode nodes host
  # 4 x 190 GB stores instead. L3 = 12 x 190 GB (prefill) + 4 x 4 x 190 GB
  # (decode) + 4 x 190 GB (infra) = 6080 GB. Prefetch mode loads before the
  # forward pass; layer-wise reads stalled the forward on DSV4.1 GB300 (#4595).
  identity:
    frameworks:
      sglang: "0.0.0.dev1+g36027fd15"
  # Lists replace on merge, so this repeats every base service.
  services: &gb300-linker-services
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: mooncake-master
      type: mooncake-master
      # The image ships mooncake-transfer-engine-cuda13 without the master
      # binary on PATH; find it or reinstall the same version.
      preamble: |
        export PATH="$(dirname "$(python3 -c 'import sys; print(sys.executable)')"):$PATH"
        if ! command -v mooncake_master >/dev/null; then
          MC_DIR=$(python3 -c 'import mooncake, os; print(os.path.dirname(mooncake.__file__))')
          if [ -x "$MC_DIR/mooncake_master" ]; then
            export PATH="$MC_DIR:$PATH"
          else
            pip_install=(python3 -m pip install)
            if python3 -m pip install --help 2>/dev/null | grep -q -- --break-system-packages; then
              pip_install+=(--break-system-packages)
            fi
            "${pip_install[@]}" --quiet --no-cache-dir --no-deps --force-reinstall \
              "mooncake-transfer-engine-cuda13==$(python3 -c 'import importlib.metadata as m; print(m.version("mooncake-transfer-engine-cuda13"))')"
          fi
        fi
        command -v mooncake_master
      args:
        # Past 95% full the master evicts the 10% of objects with the oldest
        # lease. The lease sets when an object becomes evictable, not the
        # order; 120 s stays above the slowest load batch.
        - --default_kv_lease_ttl=120000
        - --eviction_high_watermark_ratio=0.95
        - --eviction_ratio=0.10
        - --rpc_thread_num=64
    # Each store runs once on every decode node.
    - &gb300-decode-store
      name: store-decode-0
      type: mooncake-store
      command: ["python3", "-m", "mooncake.mooncake_store_service"]
      placement:
        node: decode
      args: ["--port", "8800"]
      env:
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "@fabric.rdma-devices"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 190gb
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        MC_TCP_BIND_ADDRESS: "{node_ip}"
      preamble: |
        ulimit -n 1048576
        ulimit -l unlimited
      readiness:
        port: 8800
        timeout_seconds: 600
    - <<: *gb300-decode-store
      name: store-decode-1
      args: ["--port", "8801"]
      readiness:
        port: 8801
        timeout_seconds: 600
    - <<: *gb300-decode-store
      name: store-decode-2
      args: ["--port", "8802"]
      readiness:
        port: 8802
        timeout_seconds: 600
    - <<: *gb300-decode-store
      name: store-decode-3
      args: ["--port", "8803"]
      readiness:
        port: 8803
        timeout_seconds: 600
    - &gb300-infra-store
      <<: *gb300-decode-store
      name: store-infra-0
      placement:
        node: infra
      args: ["--port", "8810"]
      readiness:
        port: 8810
        timeout_seconds: 600
    - <<: *gb300-infra-store
      name: store-infra-1
      args: ["--port", "8811"]
      readiness:
        port: 8811
        timeout_seconds: 600
    - <<: *gb300-infra-store
      name: store-infra-2
      args: ["--port", "8812"]
      readiness:
        port: 8812
        timeout_seconds: 600
    - <<: *gb300-infra-store
      name: store-infra-3
      args: ["--port", "8813"]
      readiness:
        port: 8813
        timeout_seconds: 600
    # Disables Dynamo's per-request lifecycle span export; InferenceX does not read it.
    - name: otel-collector
      type: otel-collector
      enabled: false
  roles:
    prefill:
      nodes: 3
      workers: 3
      gpus: 4
      env:
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "@fabric.rdma-devices"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 190gb
        MOONCAKE_STANDALONE_STORAGE: "0"
      args:
        tensor-parallel-size: 4
        data-parallel-size: 4
        expert-parallel-size: 4
        max-running-requests: 256
        stream-interval: 20
        mem-fraction-static: 0.88
        enable-hierarchical-cache: null
        hicache-size: null
        hicache-write-policy: null
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mooncake
        unified-cache-external-linker-config: '{"load_mode":"prefetch","enable_group_semantics":false}'
    decode:
      nodes: 4
      gpus: 16
      args:
        tensor-parallel-size: 16
        data-parallel-size: 16
        expert-parallel-size: 16
        max-running-requests: 768
        stream-interval: 20

override_6p_tp2ep2_dep16_si20_nightly1112:
  name: minimaxm31flash-fp4-gb300-dynamo-sglang-agentx-disagg-6p-tp2ep2-dep16-si20-nightly1112
  # Prefill as TP2 attention with MegaMoE EP2 and no attention DP, against the
  # 3 x DEP4 control on the same 12 GPUs and image. The model has 4 KV heads,
  # so TP2 splits the main KV across the pair and replicates only the index.
  identity:
    frameworks:
      sglang: "0.0.0.dev1+g36027fd15"
  roles:
    prefill:
      nodes: 3
      workers: 6
      gpus: 2
      args: &gb300-tp2ep2-prefill-args
        tensor-parallel-size: 2
        data-parallel-size: null
        expert-parallel-size: 2
        enable-dp-attention: null
        enable-dp-lm-head: null
        max-running-requests: 128
        stream-interval: 20
        mem-fraction-static: 0.88
    decode:
      nodes: 4
      gpus: 16
      args:
        tensor-parallel-size: 16
        data-parallel-size: 16
        expert-parallel-size: 16
        max-running-requests: 768
        stream-interval: 20

override_6p_tp2ep2_dep16_si20_linker:
  name: minimaxm31flash-fp4-gb300-dynamo-sglang-agentx-disagg-6p-tp2ep2-dep16-si20-linker
  # The TP2 prefill above with the linker setup of the 3 x DEP4 linker point:
  # still 12 prefill ranks x 190 GB, so the same 6080 GB pool.
  identity:
    frameworks:
      sglang: "0.0.0.dev1+g36027fd15"
  services: *gb300-linker-services
  roles:
    prefill:
      nodes: 3
      workers: 6
      gpus: 2
      env:
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "@fabric.rdma-devices"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 190gb
        MOONCAKE_STANDALONE_STORAGE: "0"
      args:
        <<: *gb300-tp2ep2-prefill-args
        enable-hierarchical-cache: null
        hicache-size: null
        hicache-write-policy: null
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mooncake
        unified-cache-external-linker-config: '{"load_mode":"prefetch","enable_group_semantics":false}'
    decode:
      nodes: 4
      gpus: 16
      args:
        tensor-parallel-size: 16
        data-parallel-size: 16
        expert-parallel-size: 16
        max-running-requests: 768
        stream-interval: 20
