# AgentX GLM-5.2 TensorRT-LLM B300 recipes: shared settings in base, one
# override per benchmark configuration. Select one with
# CONFIG_FILE=recipes/glm5.2/trtllm/b300-fp4/agentx/disagg-variants.yaml:override_<name>.

schema: 2
base:
  slurm:
    time_limit: "06:00:00"
  srun_options:
    no-container-remap-root: ''
  engine:
    type: trtllm
    numa_cpu_bind: true
    publish_events_and_metrics: false
  roles:
    prefill:
      gpus: 4
      env:
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_PUBLISH_KV_EVENTS: '0'
        DYN_TOKENIZER: fastokens
        DYN_TRTLLM_ENABLE_ATTENTION_DP: '1'
        ETCD_LEASE_TTL: '120'
        HF_HUB_DISABLE_PROGRESS_BARS: '1'
        HF_HUB_OFFLINE: '1'
        HOME: /trtllm-jit-cache
        MIMALLOC_PURGE_DELAY: '10000'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        FI_LOG_LEVEL: warn
        NIXL_DISABLE_CUDA_ADDR_WA: '1'
        OMP_NUM_THREADS: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
        TLLM_EXECUTOR_BATCH_RESP_IN_AWAIT: '1'
        TLLM_EXECUTOR_USE_FILE_SOCKET: '1'
        TLLM_LOG_LEVEL: INFO
        TLLM_PREFIX_TOKEN_CACHE: '1'
        TQDM_DISABLE: '1'
        TRANSFORMERS_OFFLINE: '1'
        TRTLLM_DSA_INDEXER_BF16: '1'
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_FUSED_DSA_METADATA: '1'
        TRTLLM_KVCACHE_POOL_USE_FABRIC_MEMORY: '0'
        TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
        TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
        TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
        TRTLLM_NIXL_KVCACHE_BACKEND: LIBFABRIC
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
      args:
        attention_dp_config:
          enable_kv_cache_aware_routing: false
          kv_cache_routing_conversation_affinity: true
          kv_cache_routing_max_sessions: 65536
        backend: pytorch
        cache_transceiver_config:
          backend: NIXL
          kv_cache_bounce_size_mb: '0'
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 1048576
          transceiver_runtime: PYTHON
        cuda_graph_config: null
        enable_attention_dp: true
        enable_chunked_prefill: true
        gpus_per_node: 8
        kv_cache_config:
          use_kv_cache_manager_v2: false
          dtype: fp8
          enable_block_reuse: true
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.75
          tokens_per_block: 64
        max_batch_size: 256
        max_num_tokens: 8192
        max_seq_len: 1048576
        moe_config:
          backend: CUTEDSL
        moe_expert_parallel_size: 4
        num_postprocess_workers: 8
        perf_metrics_max_requests: 100000
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: true
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
        sparse_attention_config:
          algorithm: dsa
          enable_heuristic_topk: true
        speculative_config:
          decoding_type: MTP
        tensor_parallel_size: 4
        trust_remote_code: true
    decode:
      env:
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_PUBLISH_KV_EVENTS: '0'
        DYN_TOKENIZER: fastokens
        DYN_TRTLLM_ENABLE_ATTENTION_DP: '1'
        ETCD_LEASE_TTL: '120'
        HF_HUB_DISABLE_PROGRESS_BARS: '1'
        HF_HUB_OFFLINE: '1'
        HOME: /trtllm-jit-cache
        MIMALLOC_PURGE_DELAY: '10000'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        FI_LOG_LEVEL: warn
        NIXL_DISABLE_CUDA_ADDR_WA: '1'
        OMP_NUM_THREADS: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
        TLLM_EXECUTOR_BATCH_RESP_IN_AWAIT: '1'
        TLLM_EXECUTOR_USE_FILE_SOCKET: '1'
        TLLM_LOG_LEVEL: INFO
        TLLM_PREFIX_TOKEN_CACHE: '1'
        TQDM_DISABLE: '1'
        TRANSFORMERS_OFFLINE: '1'
        TRTLLM_DSA_INDEXER_BF16: '1'
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_FUSED_DSA_METADATA: '1'
        TRTLLM_KVCACHE_POOL_USE_FABRIC_MEMORY: '0'
        TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
        TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
        TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
        TRTLLM_NIXL_KVCACHE_BACKEND: LIBFABRIC
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
      args:
        backend: pytorch
        cache_transceiver_config:
          backend: NIXL
          kv_cache_bounce_size_mb: '0'
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 1048576
          transceiver_runtime: PYTHON
        cuda_graph_config:
          enable_padding: true
        gpus_per_node: 8
        kv_cache_config:
          use_kv_cache_manager_v2: false
          dtype: fp8
          enable_block_reuse: false
          event_buffer_max_size: 0
          host_cache_size: 0
          tokens_per_block: 64
        max_num_tokens: 128
        max_seq_len: 1048576
        num_postprocess_workers: 4
        perf_metrics_max_requests: 100000
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: true
        sparse_attention_config:
          algorithm: dsa
          enable_heuristic_topk: true
          use_cute_dsl_paged_mqa_logits: true
        speculative_config:
          decoding_type: MTP
        stream_interval: 20
        trust_remote_code: true
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'
      AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES: '0'
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '3600'
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      DURATION: '3600'
      FRAMEWORK: dynamo-trt
      HF_HUB_CACHE: /hf_hub_cache
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      IS_MULTINODE: 'true'
      KV_OFFLOADING: none
      MAX_MODEL_LEN: '1048576'
      MODEL: nvidia/GLM-5.2-NVFP4
      MODEL_PREFIX: glm5.2
      OPENAI_API_KEY: EMPTY
      PORT: '8000'
      PRECISION: fp4
      RESULT_DIR: /logs/agentic
      SERVED_MODEL_NAME: GLM-5.2-NVFP4
      TQDM_DISABLE: '1'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
  dynamo:
    install: true
    source:
      pypi: 1.4.0
    request_plane: tcp
  frontend:
    args:
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      no-kv-events: true
      router-mode: kv
    env:
      DYN_LOG: warn
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
      DYN_ROUTER_TEMPERATURE: '0'
      DYN_TCP_REQUEST_TIMEOUT: '30'
      DYN_TOKENIZER: fastokens
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
      ETCD_LEASE_TTL: '120'
    type: dynamo
  health_check:
    interval_seconds: 10
    max_attempts: 180
  identity:
    model:
      repo: nvidia/GLM-5.2-NVFP4
    container:
      image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc26.dev202609040000
    frameworks:
      dynamo: 1.4.0
      tensorrt_llm: 1.3.0rc26.dev202609040000
  model:
    path: nvidia/GLM-5.2-NVFP4
    container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc26.dev202609040000
    precision: fp4
  resources:
    spread_workers: true
    gpu_type: b300
    gpus_per_node: 8
override_1p1d_tep8_c1_b1_mtp5:
  setup_script: clean_stale_shm.sh
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        disable_overlap_scheduler: true
        kv_cache_config:
          host_cache_size: 412316860416
        scheduler_config:
          context_chunking_policy: EQUAL_PROGRESS
        speculative_config:
          num_nextn_predict_layers: 5
    decode:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        cuda_graph_config:
          batch_sizes:
          - 1
        enable_attention_dp: false
        kv_cache_config:
          free_gpu_memory_fraction: 0.8
        max_batch_size: 1
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 1
        sparse_attention_config:
          use_cute_dsl_topk: true
        speculative_config:
          max_draft_len: 5
        tensor_parallel_size: 8
  benchmark:
    env:
      CONC: '1'
    placement:
      node: first_decode
  frontend:
    enable_multiple_frontends: false
    placement:
      node: first_decode
  name: dynamo-disagg-b300-1p1d-tep8-compact-c1-b1-mtp5
