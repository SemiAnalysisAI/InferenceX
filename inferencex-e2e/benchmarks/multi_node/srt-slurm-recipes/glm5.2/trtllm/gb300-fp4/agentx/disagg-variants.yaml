schema: 2

base:
  dynamo:
    install: true
    source:
      wheel: 1.6.0.dev20261014
    request_plane: tcp
  health_check:
    max_attempts: 270
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine:
    type: trtllm
    publish_metrics: true
    numa_cpu_bind: true
  roles:
    prefill:
      gpus: 4
      env:
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        TQDM_DISABLE: '1'
        HF_HUB_DISABLE_PROGRESS_BARS: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TRTLLM_FUSED_DSA_METADATA: '1'
        TRTLLM_DSA_INDEXER_BF16: '1'
        TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
        TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
        TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
        UCX_CUDA_IPC_ENABLE_MNNVL: y
        UCX_RNDV_SCHEME: put_zcopy
        TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
        TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
        DYN_TRTLLM_ENABLE_ATTENTION_DP: '1'
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_TOKENIZER: fastokens
        DYN_PUBLISH_KV_EVENTS: '0'
      args:
        attention_dp_config:
          enable_kv_cache_aware_routing: false
          kv_cache_routing_conversation_affinity: true
          kv_cache_routing_max_sessions: 65536
        cache_transceiver_config:
          backend: NIXL
          transceiver_runtime: PYTHON
          agent_bounce_buffer_enable: true
          agent_bounce_params:
            max_average_descriptor_size: 4MB
            min_descriptor_count: '1'
          max_tokens_in_buffer: 1048576
          kv_transfer_timeout_ms: 600000
        cuda_graph_config: null
        enable_attention_dp: true
        enable_chunked_prefill: true
        trust_remote_code: true
        kv_cache_config:
          iteration_stats_interval: 20
          enable_block_reuse: true
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.75
          tokens_per_block: 64
        max_batch_size: 256
        max_num_tokens: 8192
        max_seq_len: 1048576
        moe_config:
          backend: CUTEDSL
        moe_expert_parallel_size: 4
        num_postprocess_workers: 8
        pipeline_parallel_size: 1
        print_iter_log: true
        enable_iter_perf_stats: true
        iter_perf_stats_interval: 20
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
        sparse_attention_config:
          algorithm: dsa
          enable_heuristic_topk: true
        speculative_config:
          decoding_type: MTP
          max_draft_len: 5
        tensor_parallel_size: 4
    decode:
      env:
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        TQDM_DISABLE: '1'
        HF_HUB_DISABLE_PROGRESS_BARS: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TRTLLM_FUSED_DSA_METADATA: '1'
        TRTLLM_DSA_INDEXER_BF16: '1'
        TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
        TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
        TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
        UCX_CUDA_IPC_ENABLE_MNNVL: y
        UCX_RNDV_SCHEME: put_zcopy
        TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
        TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
        DYN_TRTLLM_ENABLE_ATTENTION_DP: '1'
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_TOKENIZER: fastokens
        DYN_PUBLISH_KV_EVENTS: '0'
      args:
        cache_transceiver_config:
          backend: NIXL
          transceiver_runtime: PYTHON
          agent_bounce_buffer_enable: true
          agent_bounce_params:
            max_average_descriptor_size: 4MB
            min_descriptor_count: '1'
          max_tokens_in_buffer: 1048576
          kv_transfer_timeout_ms: 600000
        cuda_graph_config:
          enable_padding: true
        trust_remote_code: true
        kv_cache_config:
          iteration_stats_interval: 20
          enable_block_reuse: false
          event_buffer_max_size: 0
          tokens_per_block: 64
        max_num_tokens: 128
        max_seq_len: 1048576
        moe_config:
          use_low_precision_moe_combine: true
        num_postprocess_workers: 4
        pipeline_parallel_size: 1
        print_iter_log: true
        enable_iter_perf_stats: true
        iter_perf_stats_interval: 20
        return_perf_metrics: false
        sparse_attention_config:
          algorithm: dsa
          enable_heuristic_topk: true
          use_cute_dsl_paged_mqa_logits: true
          use_cute_dsl_topk: true
        speculative_config:
          decoding_type: MTP
          max_draft_len: 5
        stream_interval: 20
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      ETCD_LEASE_TTL: '120'
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_ROUTER_TEMPERATURE: '0'
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
      DYN_TOKENIZER: fastokens
      DYN_TCP_REQUEST_TIMEOUT: '30'
      DYN_LOG: warn
      DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
    args:
      router-mode: kv
      no-kv-events: true
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
    placement:
      node: head
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '14400'
      AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES: '0'
      SERVED_MODEL_NAME: GLM-5.2-NVFP4
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    placement:
      node: dedicated

override_1p1d_tp8_c1_b1_mtp5:
  name: dynamo-disagg-gb300-1p1d-tp8-c1-b1-mtp5
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        cache_transceiver_config:
          kv_cache_bounce_size_mb: 1024
        disable_overlap_scheduler: true
        kv_cache_config:
          dtype: fp8
          host_cache_size: 137438953472
        scheduler_config:
          context_chunking_policy: EQUAL_PROGRESS
    decode:
      nodes: 2
      workers: 1
      gpus: 8
      args:
        cache_transceiver_config:
          kv_cache_bounce_size_mb: 1024
        cuda_graph_config:
          batch_sizes:
          - 1
        enable_attention_dp: false
        kv_cache_config:
          dtype: fp8
          free_gpu_memory_fraction: 0.8
        max_batch_size: 1
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 1
        tensor_parallel_size: 8

