# Aggregated TP8 GLM-5.2 AgentX topology on one 8-GPU H200 node. MTP uses the
# committed GLM-5.2 golden thinking-on acceptance length for three speculative
# steps, and max-running-requests is twice the concurrency.

schema: 2

base:
  identity:
    model:
      revision: f33c6dc501ee5a2c7e35155653b1b1abbc320951
    container: {}
    frameworks:
      dynamo: 1.5.0.dev20260913
      sglang: 4358a1617cad734fc37bf53d9e5c2092bd43d075

  dynamo:
    # This nightly includes the matching Dynamo adapter. Reinstalling an older
    # wheel removes compatibility with this SGLang commit.
    install: false

  resources:
    gpu_type: h200
    gpus_per_node: 8

  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 64

  frontend:
    type: dynamo
    nginx_session_affinity: true
    nginx_session_affinity_header: X-Dynamo-Session-ID
    enable_multiple_frontends: true
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: "3600"
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None

  engine: sglang

  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      env:
        HF_HOME: /hf_hub_cache
        HF_HUB_CACHE: /hf_hub_cache
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        PYTHONUNBUFFERED: "1"
        SGLANG_OPT_USE_TOPK_V2: "1"
        SGLANG_TIMEOUT_KEEP_ALIVE: "900"
        SGLANG_ENABLE_THINKING: "1"
        SGLANG_REASONING_EFFORT: max
        SGLANG_ENABLE_UNIFIED_RADIX_TREE: "1"
        SGLANG_HICACHE_DEBUG_LOG: "1"
        SGLANG_HICACHE_DEBUG_SAMPLE_RATE: "16384"
      args:
        served-model-name: zai-org/GLM-5.2-FP8
        trust-remote-code: true
        tool-call-parser: glm47
        reasoning-parser: glm45
        tensor-parallel-size: 8
        data-parallel-size: 1
        expert-parallel-size: 1
        enable-dp-attention: false
        kv-cache-dtype: fp8_e4m3
        dsa-decode-backend: flashmla_kv
        context-length: 1048576
        max-total-tokens: 1048576
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        mem-fraction-static: 0.75
        page-size: 64
        enable-hierarchical-cache: true
        hicache-write-policy: write_back
        hicache-size: 135
        hicache-io-backend: direct
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        watchdog-timeout: 86400
        stream-interval: 60
        enable-metrics: true
        enable-cache-report: true

  health_check:
    max_attempts: 1440
    interval_seconds: 10

  telemetry:
    collector_join_timeout_seconds: 12

  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"

  sbatch_directives:
    mem: "0"

  srun_options:
    mem: "0"
    container-remap-root: ""

override_tp8_c2:
  name: agg-h200-tp8-mtp-c2
  roles:
    agg:
      args:
        max-running-requests: 4
        cuda-graph-max-bs-decode: 4

override_tp8_c4:
  name: agg-h200-tp8-mtp-c4
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8

override_tp8_c8:
  name: agg-h200-tp8-mtp-c8
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16

override_tp8_c12:
  name: agg-h200-tp8-mtp-c12
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs-decode: 24

override_tp8_c16:
  name: agg-h200-tp8-mtp-c16
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 32
