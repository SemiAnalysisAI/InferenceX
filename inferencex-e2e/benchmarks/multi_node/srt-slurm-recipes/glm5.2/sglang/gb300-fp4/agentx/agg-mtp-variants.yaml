# AgentX glm5.2 sglang gb300-fp4 aggregated recipes: shared settings in base,
# one override per benchmark configuration. Select one with
# CONFIG_FILE=recipes/glm5.2/sglang/gb300-fp4/agentx/agg-mtp-variants.yaml:override_<name>.
#
# Concurrency is not a recipe field; the GHA matrix fans out one job per
# concurrency from the master-config conc-list into srt_agentic.sh. The srt
# driver injects the golden synthetic acceptance length for the configured
# speculative steps (infx/golden_al_distribution/glm5.2_mtp.yaml).
schema: 2

base:
  name: gb300-fp4-glm5.2-agentx-agg
  model:
    path: glm-5.2-fp4
    container: dynamo-sglang
    precision: fp4
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: dynamo
    env:
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    args:
      router-mode: kv
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      router-session-affinity-ttl-secs: 3600
  dynamo:
    install: false
  engine: sglang
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        PYTHONUNBUFFERED: '1'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
        MC_TE_METRIC: 'true'
        NCCL_CUMEM_ENABLE: '1'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        SGLANG_ENABLE_THINKING: '1'
        SGLANG_REASONING_EFFORT: max
        SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'
        SGLANG_HICACHE_DEBUG_LOG: '1'
        SGLANG_HICACHE_DEBUG_SAMPLE_RATE: '16384'
        SGLANG_MOE_NVFP4_DISPATCH: '1'
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
        SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: '8'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        SGLANG_DG_CACHE_DIR: /deepgemm_cache
        FLASHINFER_WORKSPACE_BASE: /flashinfer_cache
        MC_FORCE_MNNVL: '1'
        NCCL_MNNVL_ENABLE: '1'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        UCX_TLS: ib,cuda_copy,cuda_ipc,sm,self
        NVSHMEM_REMOTE_TRANSPORT: none
      args:
        served-model-name: nvidia/GLM-5.2-NVFP4
        trust-remote-code: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        tensor-parallel-size: 8
        data-parallel-size: 1
        expert-parallel-size: 1
        enable-dp-attention: false
        enable-dp-lm-head: false
        max-running-requests: 10
        cuda-graph-max-bs-decode: 10
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        context-length: 1048576
        speculative-algorithm: EAGLE
        speculative-num-steps: 4
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 5
        dsa-prefill-backend: trtllm
        dsa-decode-backend: trtllm
        moe-runner-backend: flashinfer_trtllm
        fp4-gemm-backend: flashinfer_trtllm
        disable-shared-experts-fusion: true
        enable-flashinfer-allreduce-fusion: true
        weight-loader-prefetch-checkpoints: true
        model-loader-extra-config: '{"enable_multithread_load": true}'
        mem-fraction-static: 0.8
        enable-hierarchical-cache: true
        hicache-write-policy: write_back
        hicache-size: 135
        hicache-io-backend: direct
        enable-metrics: true
        enable-cache-report: true
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: "8000"
      IS_MULTINODE: "true"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 64
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  srun_options:
    mem: '0'
    container-remap-root: ''

# One TP8 worker on two nodes at concurrency 1. HiCache is off and the prefill
# chunk is 8192 tokens. Session-affinity nginx sits in front of the frontend.
override_tp8_c1:
  name: agg-gb300-tp8-c1-mtp
  frontend:
    nginx_session_affinity: true
    nginx_session_affinity_header: X-Dynamo-Session-ID
    enable_multiple_frontends: true
  roles:
    agg:
      args:
        enable-hierarchical-cache: false
        hicache-write-policy: null
        hicache-size: null
        hicache-io-backend: null

# One TP4 worker on one node at concurrency 4 with HiCache DRAM offload.
override_tp4_c4:
  name: agg-gb300-tp4-c4-mtp
  roles:
    agg:
      nodes: 1
      gpus: 4
      args:
        tensor-parallel-size: 4
