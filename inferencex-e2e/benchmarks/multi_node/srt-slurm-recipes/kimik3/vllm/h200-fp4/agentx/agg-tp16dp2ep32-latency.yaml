schema: 2
name: "kimik3-vllm-agg-h200-tp16dp2ep32-latency-agentic"

identity:
  model:
    revision: "9f62e4e9fffbd0a83ddd60e1c209d828994b3569"
  container: {}
  frameworks:
    vllm: "0.1.dev19262+gb6bbf29dd.d20260727"

dynamo:
  install: false

slurm:
  time_limit: "8:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "h200"
  gpus_per_node: 8
frontend:
  type: vllm
  enable_multiple_frontends: false

engine:
  type: vllm
  connector:
roles:
  agg:
    nodes: 4
    workers: 1
    gpus: 32

    env:
      CUDA_LAUNCH_BLOCKING: "1"
      GLOO_SOCKET_IFNAME: "@fabric.socket-ifname"
      HF_HUB_CACHE: "/hf_hub_cache"
      HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
      NCCL_SOCKET_IFNAME: "@fabric.socket-ifname"
      NCCL_CUMEM_ENABLE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      PYTHONNOUSERSITE: "1"
      TRANSFORMERS_CACHE: "/hf_hub_cache"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_ROUTED_DOWN_PROJ_STREAM_TOKEN_THRESHOLD: "0"
      VLLM_USE_V2_MODEL_RUNNER: "1"
    args:
      served-model-name: "moonshotai/Kimi-K3"
      tensor-parallel-size: 16
      data-parallel-size: 2
      enable-expert-parallel: true
      trust-remote-code: true
      load-format: fastsafetensors
      moe-backend: marlin
      attention-backend: FLASHMLA
      gpu-memory-utilization: 0.975
      max-num-seqs: 5
      max-num-batched-tokens: 4096
      speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":2,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      enforce-eager: true
      compilation-config: '{"pass_config":{"fuse_allreduce_rms":false}}'
      enable-prefix-caching: true
      enable-prompt-tokens-details: true
      no-enable-flashinfer-autotune: true
      disable-custom-all-reduce: true
      enable-auto-tool-choice: true
      tool-call-parser: kimi_k3
      reasoning-parser: kimi_k3
      language-model-only: true

srun_options:
  container-remap-root: ""

telemetry:
  collector_join_timeout_seconds: 12

benchmark:
  env:
    AIPERF_TRACE_IDLE_GAP_CAP_SECONDS: "300"
