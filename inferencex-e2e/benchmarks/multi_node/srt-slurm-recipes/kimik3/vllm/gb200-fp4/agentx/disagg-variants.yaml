# GB200 Kimi-K3 FP4 AgentX, Dynamo + vLLM disaggregated 1P1D: one TP16/DCP16 prefill role (4 nodes) and one
# TP16/DCP16 decode role (4 nodes), 32 GPUs, DSpark depth 4 (draft_sample_method probabilistic; the launcher
# selects the golden acceptance), Mooncake DRAM tier at 128 GB per rank. Per-concurrency knobs: max-num-seqs at
# 2x concurrency on both roles, decode cudagraph capture at max-num-seqs x (K+1) tokens, decode
# gpu-memory-utilization 0.92 while the capture size is at or under 320 tokens and 0.90 above it.
# Decode max-num-batched-tokens 1024 bounds the FlashInfer MoE autotune to the token counts decode can
# reach (at most 480); the 16384-token default bucket needs a 2.9 GiB workspace that fails at 0.92.
# The *_eval overrides add the Kimi K3 tool and reasoning parsers with structural tags, so a named
# tool_choice is constrained by the K3 structural tag rather than a generic JSON-schema constraint.
schema: 2

base:
  identity:
    model: {}
    container: {}
    frameworks:
      dynamo: "ffbbaaa6c44370e798687881317535ac17d66a76"

  dynamo:
    install: true

    source:
      rev: "ffbbaaa6c44370e798687881317535ac17d66a76"
  slurm:
    time_limit: "04:00:00"

  health_check:
    max_attempts: 720
    interval_seconds: 10

  resources:
    gpu_type: "gb200"
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
    - name: mooncake-master
      type: mooncake-master
      args:
        - "--default_kv_lease_ttl=60000"
        - "--eviction_high_watermark_ratio=0.95"
        - "--eviction_ratio=0.10"
      options:
        store_config:
          metadata_server: "P2PHANDSHAKE"
          global_segment_size: "128GB"
          local_buffer_size: "4GB"
          protocol: "rdma"
          device_name: "@fabric.rdma-devices"
          mode: "embedded"
          enable_offload: false
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: "least-loaded"
      router-session-affinity-ttl-secs: 900
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
      DYN_TOKENIZER_CACHE_BYTES: "8589934592"

  engine:
    type: vllm
    connector:
    dp_launch_mode: per_node
  roles:
    prefill:
      nodes: 4
      workers: 1
      gpus: 16
      env: &kimi_env
        VLLM_USE_DIRECT_DCP_A2A: "1"
        VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
        VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
        VLLM_ALLREDUCE_USE_FLASHINFER: "1"
        VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
        DYN_REQUEST_PLANE: "tcp"
        ETCD_LEASE_TTL: "600"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        TILELANG_CLEANUP_TEMP_FILES: "1"
        VLLM_USE_NCCL_SYMM_MEM: "0"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
        VLLM_USE_RUST_FRONTEND: "1"
        VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
        MC_SLICE_SIZE: "1048576"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
        NCCL_P2P_LEVEL: "NVL"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        WITH_NVIDIA_PEERMEM: "0"
        NCCL_NET_PLUGIN: "none"
        UCX_MEMTYPE_CACHE: "n"
        UCX_MEMTYPE_REG_WHOLE: "n"
        UCX_RCACHE_MAX_UNRELEASED: "1024"
        UCX_TCP_AF_PRIO: "inet"
        VLLM_SSM_CONV_STATE_LAYOUT: "DS"
        # The prefill MoE workspace (about 3.3 GiB at 16384 tokens) failed to allocate with 7 GiB
        # reserved but fragmented; blocks above 512 MiB are not split.
        PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "moonshotai/Kimi-K3"
        prefix-match-unit: 128
        load-format: "safetensors"
        safetensors-load-strategy: "lazy"
        kv-cache-dtype: "fp8"
        mamba-ssm-cache-dtype: "bfloat16"
        gpu-memory-utilization: 0.88
        tensor-parallel-size: 16
        decode-context-parallel-size: 16
        dcp-comm-backend: "a2a"
        enable-cumem-allocator: true
        trust-remote-code: true
        max-cudagraph-capture-size: 512
        stream-interval: 10
        language-model-only: true
        attention-backend: "TOKENSPEED_MLA"
        attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic"}'
        enable-prefix-caching: true
      kv_events: true
    decode:
      nodes: 4
      workers: 1
      gpus: 16

      env:
        <<: *kimi_env
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "moonshotai/Kimi-K3"
        prefix-match-unit: 128
        load-format: "safetensors"
        safetensors-load-strategy: "lazy"
        kv-cache-dtype: "fp8"
        mamba-ssm-cache-dtype: "bfloat16"
        max-num-batched-tokens: 1024
        tensor-parallel-size: 16
        decode-context-parallel-size: 16
        dcp-comm-backend: "a2a"
        enable-cumem-allocator: true
        trust-remote-code: true
        stream-interval: 10
        language-model-only: true
        attention-backend: "TOKENSPEED_MLA"
        attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic"}'
        enable-prefix-caching: true

  sbatch_directives:
    mem: "0"
    cpus-per-task: "144"
    comment: >-
      '{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very large model will
      take extra loading time."}}'

  srun_options:
    mem: "0"
    container-remap-root: ""

  telemetry:
    collector_join_timeout_seconds: 12

  benchmark:
    placement:
      node: head
    env:
      AIPERF_LIVE_FAILED_REQUEST_THRESHOLD: "0.25"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"
      AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"

override_1p1d_dcp16_dcp16_dspark4_c16:
  roles:
    prefill: &override_1p1d_dcp16_dcp16_dspark4_c16_prefill
      args: &override_1p1d_dcp16_dcp16_dspark4_c16_prefill_args
        max-num-seqs: 32
    decode: &override_1p1d_dcp16_dcp16_dspark4_c16_decode
      args: &override_1p1d_dcp16_dcp16_dspark4_c16_decode_args
        gpu-memory-utilization: 0.92
        max-num-seqs: 32
        max-cudagraph-capture-size: 160

override_1p1d_dcp16_dcp16_dspark4_c16_eval:
  roles:
    prefill:
      <<: *override_1p1d_dcp16_dcp16_dspark4_c16_prefill
      args:
        <<: *override_1p1d_dcp16_dcp16_dspark4_c16_prefill_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
    decode:
      <<: *override_1p1d_dcp16_dcp16_dspark4_c16_decode
      args:
        <<: *override_1p1d_dcp16_dcp16_dspark4_c16_decode_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true

override_1p1d_dcp16_dcp16_dspark4_c32:
  roles:
    prefill: &override_1p1d_dcp16_dcp16_dspark4_c32_prefill
      args: &override_1p1d_dcp16_dcp16_dspark4_c32_prefill_args
        max-num-seqs: 64
    decode: &override_1p1d_dcp16_dcp16_dspark4_c32_decode
      args: &override_1p1d_dcp16_dcp16_dspark4_c32_decode_args
        gpu-memory-utilization: 0.92
        max-num-seqs: 64
        max-cudagraph-capture-size: 320

override_1p1d_dcp16_dcp16_dspark4_c32_eval:
  roles:
    prefill:
      <<: *override_1p1d_dcp16_dcp16_dspark4_c32_prefill
      args:
        <<: *override_1p1d_dcp16_dcp16_dspark4_c32_prefill_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
    decode:
      <<: *override_1p1d_dcp16_dcp16_dspark4_c32_decode
      args:
        <<: *override_1p1d_dcp16_dcp16_dspark4_c32_decode_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true

override_1p1d_dcp16_dcp16_dspark4_c48:
  roles:
    prefill: &override_1p1d_dcp16_dcp16_dspark4_c48_prefill
      args: &override_1p1d_dcp16_dcp16_dspark4_c48_prefill_args
        max-num-seqs: 96
    decode: &override_1p1d_dcp16_dcp16_dspark4_c48_decode
      args: &override_1p1d_dcp16_dcp16_dspark4_c48_decode_args
        gpu-memory-utilization: 0.9
        max-num-seqs: 96
        max-cudagraph-capture-size: 480

override_1p1d_dcp16_dcp16_dspark4_c48_eval:
  roles:
    prefill:
      <<: *override_1p1d_dcp16_dcp16_dspark4_c48_prefill
      args:
        <<: *override_1p1d_dcp16_dcp16_dspark4_c48_prefill_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
    decode:
      <<: *override_1p1d_dcp16_dcp16_dspark4_c48_decode
      args:
        <<: *override_1p1d_dcp16_dcp16_dspark4_c48_decode_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
