schema: 2
name: "kimi-k3-vllm-disagg-gb300-1p3d-dcp8-dcp8-dspark7-mooncake-agentic"

identity:
  model: {}
  container: {}
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

dynamo:
  install: true

  source:
    rev: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
slurm:
  time_limit: "04:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
  - name: mooncake-master
    type: mooncake-master
    args:
      - "--default_kv_lease_ttl=60000"
      - "--eviction_high_watermark_ratio=0.95"
      - "--eviction_ratio=0.10"
    options:
      store_config:
        metadata_server: "P2PHANDSHAKE"
        global_segment_size: "160GB"
        local_buffer_size: "4GB"
        protocol: "rdma"
        device_name: "@fabric.mooncake-devices"
        mode: "embedded"
        enable_offload: false
frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "least-loaded"
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

engine:
  type: vllm
  connector:
  dp_launch_mode: per_node
roles:
  prefill:
    nodes: 2
    workers: 1
    gpus: 8
    env: &kimi_env
      VLLM_USE_DIRECT_DCP_A2A: "1"
      VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
      VLLM_ALLREDUCE_USE_FLASHINFER: "1"
      VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
      DYN_REQUEST_PLANE: "tcp"
      ETCD_LEASE_TTL: "600"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_USE_NCCL_SYMM_MEM: "0"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
      MC_SLICE_SIZE: "1048576"
      MC_MAX_MR_SIZE: "4294967296"
      VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
      VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
      NCCL_P2P_LEVEL: "NVL"
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      WITH_NVIDIA_PEERMEM: "0"
      NCCL_NET_PLUGIN: "none"
      UCX_MEMTYPE_CACHE: "n"
      UCX_MEMTYPE_REG_WHOLE: "n"
      UCX_RCACHE_MAX_UNRELEASED: "1024"
      UCX_TCP_AF_PRIO: "inet"
      VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    args:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "moonshotai/Kimi-K3"
      prefix-match-unit: 128
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      mamba-ssm-cache-dtype: "bfloat16"
      gpu-memory-utilization: 0.92
      tensor-parallel-size: 8
      decode-context-parallel-size: 8
      cp-kv-cache-interleave-size: 1
      dcp-comm-backend: "a2a"
      enable-flashinfer-autotune: true
      enable-cumem-allocator: true
      trust-remote-code: true
      max-cudagraph-capture-size: 512
      stream-interval: 10
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy","rejection_sample_method":"block"}'
      enable-prefix-caching: true
    kv_events: true
  decode:
    nodes: 6
    workers: 3
    gpus: 8

    env:
      <<: *kimi_env
    args:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "moonshotai/Kimi-K3"
      prefix-match-unit: 128
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      mamba-ssm-cache-dtype: "bfloat16"
      gpu-memory-utilization: 0.92
      tensor-parallel-size: 8
      decode-context-parallel-size: 8
      cp-kv-cache-interleave-size: 1
      dcp-comm-backend: "a2a"
      enable-flashinfer-autotune: true
      enable-cumem-allocator: true
      trust-remote-code: true
      max-cudagraph-capture-size: 512
      stream-interval: 10
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy","rejection_sample_method":"block"}'
      enable-prefix-caching: true

sbatch_directives:
  mem: "0"
  cpus-per-task: "72"
  comment: >-
    '{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very large model will
    take extra loading time."}}'

srun_options:
  mem: "0"
  container-remap-root: ""

telemetry:
  collector_join_timeout_seconds: 12

benchmark:
  placement:
    node: head
  env:
    REQUIRE_POWER: "1"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
