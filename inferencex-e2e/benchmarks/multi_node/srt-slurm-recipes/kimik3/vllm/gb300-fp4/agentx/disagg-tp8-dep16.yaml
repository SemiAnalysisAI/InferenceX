schema: 2

base:
  identity:
    model: {}
    container: {}
    frameworks:
      vllm: "e4a5b5537344b103ed10de7764378ef09604ef3d"
      dynamo: "a0de541ea8c861d5ac01d15953ca529bea68637b"

  dynamo:
    install: true
    source:
      rev: "a0de541ea8c861d5ac01d15953ca529bea68637b"

  slurm:
    time_limit: "04:00:00"

  health_check:
    max_attempts: 720
    interval_seconds: 10

  resources:
    gpu_type: "gb300"
    gpus_per_node: 4

  services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
  - name: mooncake-master
    type: mooncake-master
    args:
    - "--default_kv_lease_ttl=60000"
    - "--eviction_high_watermark_ratio=0.95"
    - "--eviction_ratio=0.10"
    options:
      store_config:
        metadata_server: "P2PHANDSHAKE"
        global_segment_size: "160GB"
        local_buffer_size: "4GB"
        protocol: "rdma"
        device_name: "@fabric.rdma-devices"
        mode: "embedded"
        enable_offload: false

  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: "least-loaded"
      router-session-affinity-ttl-secs: 1
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
      DYN_TOKENIZER_CACHE_BYTES: "8589934592"
      DYN_TCP_REQUEST_TIMEOUT: "120"
      DYN_DISABLE_OPENAI_STRICT_SCHEMA_VALIDATION: "1"

  engine:
    type: vllm
    connector:
    dp_launch_mode: per_node

  roles:
    prefill:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        <<: &kimi_env
          VLLM_ENABLE_GEMM_RS: "1"
          DYN_TCP_REQUEST_TIMEOUT: "120"
          VLLM_ALLREDUCE_USE_FLASHINFER: "1"
          DYN_REQUEST_PLANE: "tcp"
          ETCD_LEASE_TTL: "600"
          VLLM_ENGINE_READY_TIMEOUT_S: "3600"
          VLLM_RPC_TIMEOUT: "600000"
          TILELANG_CLEANUP_TEMP_FILES: "1"
          VLLM_USE_NCCL_SYMM_MEM: "0"
          NCCL_CUMEM_ENABLE: "1"
          NCCL_MNNVL_ENABLE: "1"
          NCCL_NVLS_ENABLE: "1"
          VLLM_SERVER_DEV_MODE: "1"
          VLLM_USE_V2_MODEL_RUNNER: "1"
          VLLM_USE_RUST_FRONTEND: "1"
          VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
          MC_SLICE_SIZE: "1048576"
          MC_MAX_MR_SIZE: "4294967296"
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
          NVSHMEM_REMOTE_TRANSPORT: "none"
          NVSHMEM_DISABLE_MNNVL: "0"
          NVSHMEM_IB_ENABLE_IBGDA: "0"
          NVSHMEM_ENABLE_NIC_PE_MAPPING: "1"
          NVSHMEM_HCA_LIST: "@fabric.rdma-devices"
          NCCL_P2P_LEVEL: "NVL"
          MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
          WITH_NVIDIA_PEERMEM: "0"
          NCCL_NET_PLUGIN: "none"
          UCX_MEMTYPE_CACHE: "n"
          UCX_MEMTYPE_REG_WHOLE: "n"
          UCX_RCACHE_MAX_UNRELEASED: "1024"
          UCX_TCP_AF_PRIO: "inet"
          VLLM_SSM_CONV_STATE_LAYOUT: "DS"
        VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT: "1024"
        DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT: "1024"
      args:
        quantization-config: '{"targets":{"*.in_proj_qkvgfab":"mxfp8","*.fused_qkv_a_g_proj":"mxfp8","*.routed_expert_down_proj":"mxfp8","*.routed_expert_up_proj":"mxfp8"}}'
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "moonshotai/Kimi-K3"
        prefix-match-unit: 128
        load-format: "fastsafetensors"
        enable-flashinfer-autotune: true
        kv-cache-dtype: "fp8"
        mamba-ssm-cache-dtype: "bfloat16"
        gpu-memory-utilization: 0.95
        tensor-parallel-size: 8
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        moe-backend: deep_gemm_mega_moe
        enable-cumem-allocator: true
        trust-remote-code: true
        max-num-seqs: 32
        max-num-batched-tokens: 16384
        max-cudagraph-capture-size: 8192
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,12,16,20,24,32,40,48,64,80,96,128,160,256,384,512,640,768,896,1024,1152,1280,1408,1536,1664,1792,1920,2048,2304,2560,2816,3072,3328,3584,3840,4096,4608,5120,5632,6144,6656,7168,7680,8192]}'
        stream-interval: 10
        language-model-only: true
        attention-backend: "TOKENSPEED_MLA"
        attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true,"trtllm_ragged_backend":"cute-dsl"}'
        enable-prefix-caching: true
        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      kv_events: true
    decode:
      nodes: 4
      workers: 1
      gpus: 16
      env:
        <<: *kimi_env
      args:
        quantization-config: '{"targets":{"*.in_proj_qkvgfab":"mxfp8","*.fused_qkv_a_g_proj":"mxfp8","*.routed_expert_down_proj":"mxfp8","*.routed_expert_up_proj":"mxfp8","*.o_proj":"mxfp8","*.shared_experts.gate_up_proj":"mxfp8","*.shared_experts.down_proj":"mxfp8"}}'
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_lookup":false,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "moonshotai/Kimi-K3"
        prefix-match-unit: 128
        load-format: "fastsafetensors"
        enable-flashinfer-autotune: true
        kv-cache-dtype: "fp8"
        mamba-ssm-cache-dtype: "bfloat16"
        gpu-memory-utilization: 0.95
        tensor-parallel-size: 1
        data-parallel-size: 16
        data-parallel-rpc-port: 13345
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        moe-backend: deep_gemm_mega_moe
        enable-cumem-allocator: true
        trust-remote-code: true
        max-num-seqs: 32
        max-num-batched-tokens: 512
        max-cudagraph-capture-size: 512
        stream-interval: 10
        language-model-only: true
        attention-backend: "TOKENSPEED_MLA"
        attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true,"tokenspeed_mla_min_split_kv":8}'
        no-enable-prefix-caching: true
        use-replayssm: true
        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  sbatch_directives:
    mem: "0"
    cpus-per-task: "72"
    comment: >-
      '{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very large model will
      take extra loading time."}}'

  srun_options:
    mem: "0"
    container-remap-root: ""

  telemetry:
    collector_join_timeout_seconds: 12

  benchmark:
    placement:
      node: head
    env:
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"

override_3p1d_c336:
  roles:
    prefill:
      nodes: 6
      workers: 3

override_3p1d_c336_eval:
  roles:
    prefill:
      nodes: 6
      workers: 3
      args:
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
    decode:
      args:
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
