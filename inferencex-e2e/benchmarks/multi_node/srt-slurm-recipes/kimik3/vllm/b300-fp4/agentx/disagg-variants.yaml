schema: 2

base:
  identity:
    model: {}
    container: {}
    frameworks:
      vllm: "1b2a666391f2a24228a1436b64d547c34cc6b6ce"
      dynamo: "ffbbaaa6c44370e798687881317535ac17d66a76"

  dynamo:
    install: true
    source:
      rev: "ffbbaaa6c44370e798687881317535ac17d66a76"

  setup_script: kimik3-b300-efa-setup.sh

  environment:
    KIMI_EFA_BUILD_CACHE: /hf_hub_cache/inferencex/kimi-k3-efa
    LD_LIBRARY_PATH: /opt/amazon/efa/lib:/opt/amazon/ofi-nccl/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64

  slurm:
    time_limit: "04:00:00"

  health_check:
    max_attempts: 720
    interval_seconds: 10

  resources:
    gpu_type: "b300"
    gpus_per_node: 8

  services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 32
  - name: mooncake-master
    type: mooncake-master
    preamble: bash /configs/kimik3-b300-efa-setup.sh
    cpus_per_task: 16
    env:
      KIMI_EFA_BUILD_CACHE: /hf_hub_cache/inferencex/kimi-k3-efa
      LD_LIBRARY_PATH: /opt/amazon/efa/lib:/opt/amazon/ofi-nccl/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
    readiness:
      port: 8700
      timeout_seconds: 3600
    args:
    - "--default_kv_lease_ttl=60000"
    - "--eviction_high_watermark_ratio=0.95"
    - "--eviction_ratio=0.10"
    options:
      store_config:
        metadata_server: "P2PHANDSHAKE"
        global_segment_size: "160GB"
        local_buffer_size: "4GB"
        protocol: "efa"
        mode: "embedded"
        enable_offload: false

  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args:
      router-mode: "least-loaded"
      router-session-affinity-ttl-secs: 900
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
      DYN_TOKENIZER_CACHE_BYTES: "8589934592"
      DYN_TCP_REQUEST_TIMEOUT: "120"

  engine:
    type: vllm
    connector:
    dp_launch_mode: per_node

  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 8
      env: &kimi_env
        VLLM_FASTSAFETENSORS_QUEUE_SIZE: "-1"
        NIXL_DISABLE_CUDA_ADDR_WA: "1"
        DYN_TCP_REQUEST_TIMEOUT: "120"
        VLLM_USE_DIRECT_DCP_A2A: "1"
        VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
        VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
        VLLM_ALLREDUCE_USE_FLASHINFER: "1"
        VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
        DYN_REQUEST_PLANE: "tcp"
        ETCD_LEASE_TTL: "600"
        VLLM_RPC_TIMEOUT: "600000"
        TILELANG_CLEANUP_TEMP_FILES: "1"
        VLLM_USE_NCCL_SYMM_MEM: "0"
        # EFA DMA into CUDA VMM (cumem) memory froze B300 hosts; keep NCCL
        # buffers and the KV cache Mooncake/NIXL register on cudaMalloc.
        NCCL_CUMEM_ENABLE: "0"
        # Register each GPU buffer with Mooncake only on the two EFA NICs on that
        # GPU's PCIe switch (as NIXL does). By default Mooncake registers GPU KV
        # memory on all 16 NICs and retried slices may DMA it from a NIC on the
        # other socket; disaggregated prefill hosts froze without this.
        MC_EFA_NIC_SELECTION: "local"
        # Keep the two non-EFA IB HCAs (ibp198s0f0/ibp199s0f0) out of Mooncake's
        # topology. EfaTransport indexes its NIC contexts over EFA devices only,
        # but disabled topology HCAs keep their slots, so every selected NIC was
        # off by two: GPU 0 could never transfer (AddressNotRegistered, 0% store
        # hits) and other GPUs posted through a neighbouring GPU's NICs.
        MC_MS_FILTERS: "rdmap86s0,rdmap87s0,rdmap101s0,rdmap102s0,rdmap116s0,rdmap117s0,rdmap131s0,rdmap132s0,rdmap146s0,rdmap147s0,rdmap161s0,rdmap162s0,rdmap176s0,rdmap177s0,rdmap191s0,rdmap192s0"
        # Route same-node EFA peers through the EFA device instead of libfabric's
        # shm provider, which runs CUDA IPC copies on Mooncake's device-less CQ
        # poller thread in a GPU-0 context.
        FI_EFA_ENABLE_SHM_TRANSFER: "0"
        NCCL_MNNVL_ENABLE: "0"
        NCCL_NVLS_ENABLE: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_USE_V2_MODEL_RUNNER: "1"
        VLLM_USE_RUST_FRONTEND: "1"
        VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
        MC_SLICE_SIZE: "1048576"
        VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
        VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
        NCCL_P2P_LEVEL: "NVL"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
        WITH_NVIDIA_PEERMEM: "0"
        UCX_MEMTYPE_CACHE: "n"
        UCX_MEMTYPE_REG_WHOLE: "n"
        UCX_RCACHE_MAX_UNRELEASED: "1024"
        UCX_TCP_AF_PRIO: "inet"
        VLLM_SSM_CONV_STATE_LAYOUT: "DS"
        VLLM_ENABLE_GEMM_RS: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["LIBFABRIC"],"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "moonshotai/Kimi-K3"
        prefix-match-unit: 128
        load-format: "fastsafetensors"
        kv-cache-dtype: "fp8"
        mamba-ssm-cache-dtype: "bfloat16"
        gpu-memory-utilization: 0.92
        tensor-parallel-size: 8
        decode-context-parallel-size: 8
        dcp-comm-backend: "a2a"
        no-enable-flashinfer-autotune: true
        # A prefill GPU stops mid-CUDA-graph under this Mooncake EFA workload
        # while its TP peers spin; run prefill without CUDA graphs.
        enforce-eager: true
        trust-remote-code: true
        max-cudagraph-capture-size: 512
        stream-interval: 10
        language-model-only: true
        attention-backend: "TOKENSPEED_MLA"
        attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true,"trtllm_ragged_backend":"cute-dsl"}'
        enable-prefix-caching: true
        enable-expert-parallel: true
        moe-backend: deep_gemm_mega_moe
        max-num-seqs: 64
        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      kv_events: true
    decode:
      nodes: 1
      workers: 1
      gpus: 8
      env:
        <<: *kimi_env
        VLLM_ENABLE_GEMM_RS: '0'
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["LIBFABRIC"],"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: "moonshotai/Kimi-K3"
        prefix-match-unit: 128
        load-format: "fastsafetensors"
        kv-cache-dtype: "fp8"
        mamba-ssm-cache-dtype: "bfloat16"
        gpu-memory-utilization: 0.92
        tensor-parallel-size: 8
        decode-context-parallel-size: 8
        dcp-comm-backend: "a2a"
        no-enable-flashinfer-autotune: true
        trust-remote-code: true
        max-cudagraph-capture-size: 512
        stream-interval: 10
        language-model-only: true
        attention-backend: "TOKENSPEED_MLA"
        attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true,"tokenspeed_mla_min_split_kv":8}'
        enable-prefix-caching: true
        max-num-seqs: 128
        speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
  sbatch_directives:
    # A hung worker can take its host down; never requeue onto fresh nodes.
    no-requeue: ""
    mem: "0"
    comment: >-
      '{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very large model will
      take extra loading time."}}'

  srun_options:
    mem: "0"
    container-remap-root: ""

  telemetry:
    collector_join_timeout_seconds: 12

  benchmark:
    placement:
      node: head
    env:
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"

override_1p4d_cap2:
  roles:
    prefill: &override_1p4d_cap2_prefill
      nodes: 1
      workers: 1
      args: &override_1p4d_cap2_prefill_args {}
    decode: &override_1p4d_cap2_decode
      nodes: 4
      workers: 4
      args: &override_1p4d_cap2_decode_args
        max-num-seqs: 2

override_1p4d_cap2_eval:
  roles:
    prefill:
      <<: *override_1p4d_cap2_prefill
      args:
        <<: *override_1p4d_cap2_prefill_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true
    decode:
      <<: *override_1p4d_cap2_decode
      args:
        <<: *override_1p4d_cap2_decode_args
        reasoning-parser: kimi_k3
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        dyn-enable-structural-tag: true

