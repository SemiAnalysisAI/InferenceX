schema: 2
name: glm5.3-fp4-gb300-dynamo-sglang-agentx-agg-mk-tp4-c4-mrr4-mtp3
identity:
  model: {}
  container: {}
resources:
  gpu_type: gb300
  gpus_per_node: 4
# The image ships the Dynamo runtime the frontend and workers use.
dynamo:
  install: false
observability:
  tachometer:
    enabled: false
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    PIP_BREAK_SYSTEM_PACKAGES: '1'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '3600'
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None
engine: sglang
roles:
  agg:
    workers: 1
    nodes: 1
    gpus: 4
    env:
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONUNBUFFERED: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SGLANG_ENABLE_NV_MEGA_RUNTIME_OPTIMIZATION: '1'
      SGLANG_TIMEOUT_KEEP_ALIVE: '900'
      TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
    args:
      served-model-name: nvidia/GLM-5.3-NVFP4
      trust-remote-code: true
      quantization: modelopt_fp4
      tensor-parallel-size: 4
      expert-parallel-size: 1
      chunked-prefill-size: 8192
      max-prefill-tokens: 8192
      context-length: 1048576
      mem-fraction-static: 0.83
      # The GLM-5.3 megakernel spec refuses any other KV dtype, DSA decode kernel or MoE runner.
      kv-cache-dtype: fp8_e4m3
      attention-backend: dsa
      dsa-decode-backend: trtllm
      moe-runner-backend: flashinfer_trtllm
      disable-shared-experts-fusion: true
      enable-nvidia-megakernel: true
      enable-torch-symm-mem: true
      speculative-algorithm: NEXTN
      speculative-eagle-topk: 1
      speculative-num-steps: 3
      speculative-num-draft-tokens: 4
      reasoning-parser: glm45
      tool-call-parser: glm47
      weight-loader-prefetch-checkpoints: true
      model-loader-extra-config: '{"enable_multithread_load":true}'
      watchdog-timeout: 1800
      enable-cache-report: true
      enable-metrics: true
      max-running-requests: 4
      cuda-graph-max-bs-decode: 4
health_check:
  max_attempts: 540
  interval_seconds: 10
benchmark:
  env:
    AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 64
  - name: otel-collector
    type: otel-collector
    enabled: false
sbatch_directives:
  mem: '0'
  cpus-per-task: '144'
srun_options:
  mem: '0'
  container-remap-root: ''
