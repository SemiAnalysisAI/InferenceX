schema: 2
name: mi325x-glm53-agentx-dual-tp4-mtp
model:
  path: hf:zai-org/GLM-5.3
  container: lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261001@sha256:8190c29f67bdb65f41e0254efc72e60daa5117b7212e86a46aad5bf4b145f1b4
  precision: fp8
identity:
  model:
    repo: zai-org/GLM-5.3
  container:
    image: lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261001@sha256:8190c29f67bdb65f41e0254efc72e60daa5117b7212e86a46aad5bf4b145f1b4
slurm:
  time_limit: '12:00:00'
resources:
  gpu_type: mi325x
  gpus_per_node: 8
frontend:
  type: sglang-router
  enable_multiple_frontends: false
  args:
    policy: cache_aware
    balance-abs-threshold: 0
    balance-rel-threshold: 1.5
    worker-startup-timeout-secs: 5400
    health-check-timeout-secs: 600
    health-check-interval-secs: 30
    request-timeout-secs: 14400
    disable-retries: true
observability:
  enabled: false
  tachometer:
    enabled: false
engine: sglang
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 4
    env:
      HF_HOME: /hf_hub_cache
      HF_HUB_CACHE: /hf_hub_cache/hub
      PYTHONNOUSERSITE: '1'
      PYTHONUNBUFFERED: '1'
      SGLANG_TIMEOUT_KEEP_ALIVE: '900'
    args:
      served-model-name: zai-org/GLM-5.3
      revision: aca966e4e02791568aa6a4ced368624b3d897f42
      trust-remote-code: true
      tensor-parallel-size: 4
      expert-parallel-size: 1
      dsa-prefill-backend: tilelang
      dsa-decode-backend: tilelang
      dsa-topk-backend: sgl-kernel
      kv-cache-dtype: fp8_e4m3
      # AgentX WEKA replays raw messages without structured tools; no tool parser.
      reasoning-parser: glm45
      context-length: 1048576
      chunked-prefill-size: 8192
      mem-fraction-static: 0.92
      max-running-requests: 4
      cuda-graph-max-bs-decode: 4
      speculative-algorithm: EAGLE
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      watchdog-timeout: 1800
      enable-metrics: true
      enable-cache-report: true
sbatch_directives:
  mem: '0'
srun_options:
  container-writable: ''
  container-remap-root: ''
health_check:
  max_attempts: 720
  interval_seconds: 5
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/srt_agentic.sh
  env:
    MODEL: zai-org/GLM-5.3
    CONC: '4'
    RESULT_DIR: /infmax-workspace/LOGS/agentic
    AGENTIC_OUTPUT_DIR: /infmax-workspace
    HF_HOME: /hf_hub_cache
    HF_HUB_CACHE: /hf_hub_cache/hub
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
    AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
    AIPERF_BENCHMARK_GRACE_PERIOD: '1800'
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
    TOKENIZERS_PARALLELISM: 'false'
