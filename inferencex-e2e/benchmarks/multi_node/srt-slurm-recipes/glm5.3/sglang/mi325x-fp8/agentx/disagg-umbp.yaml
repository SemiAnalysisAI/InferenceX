  roles:
    prefill:
      gpus: 4
      args: &tp4_stp_args
        tensor-parallel-size: 4
        chunked-prefill-size: 8192
        mem-fraction-static: 0.93
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
    decode:
      nodes: colocate
      gpus: 4
      args: *tp4_stp_args
  benchmark:
    env:
      CONC: "4"

override_p4_2d4_c4:
  roles:
    prefill:
      gpus: 4
      args: *tp4_stp_args
    decode:
      workers: 2
      gpus: 4
      args: *tp4_stp_args
  benchmark:
