      CONC: "4"

override_colocated_tep4_tep4_c4:
  sbatch_directives:
    exclude: quanta-ccs-aus-k10-10
  roles:
    prefill:
      gpus: 4
      env:
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "1024"
      args: &tep4_pd_args
        tensor-parallel-size: 4
        expert-parallel-size: 4
        moe-a2a-backend: mori
        deepep-mode: normal
        chunked-prefill-size: 1024
        mem-fraction-static: 0.94
        max-running-requests: 8
        cuda-graph-max-bs-decode: 8
    decode:
      nodes: colocate
      gpus: 4
      env:
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "128"
      args: *tep4_pd_args
  benchmark:
    env:
      CONC: "4"

# One-factor decode dispatch-capacity diagnostic; no MTP or decode radix cache.
override_colocated_tep4_tep4_cap8_c4: &tep4_cap8_pd
  sbatch_directives:
    exclude: quanta-ccs-aus-k10-10
  roles:
    prefill:
      gpus: 4
      env:
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "1024"
      args: *tep4_pd_args
    decode:
      nodes: colocate
      gpus: 4
      env:
        # STP max8 requests, one row each; native EP4 receive capacity is32.
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "8"
      args: *tep4_pd_args
  benchmark:
    env:
      CONC: "4"

override_colocated_tep4_tep4_cap8_c8:
  <<: *tep4_cap8_pd
  benchmark:
    env:
      CONC: "8"

override_colocated_tep4_dep4_c8: &tep4_dep4_pd
  <<: *tep4_cap8_pd
  frontend:
    args:
      dp-aware: true
      decode-policy: cache_aware
  roles:
    prefill: &tep4_dep4_prefill
      gpus: 4
      env:
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "1024"
      args: *tep4_pd_args
    decode: &tep4_dep4_decode
      nodes: colocate
      gpus: 4
      env:
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "8"
      args: &dep4_pd_args
        <<: *tep4_pd_args
        data-parallel-size: 4
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-dense-tp-size: 1
        mem-fraction-static: 0.985
  benchmark:
    env:
      CONC: "8"

# Equal-cost one-wide-prefill versus two-TEP4-prefill quality comparison.
override_tp8_prefill_dep4_c8:
  frontend:
    args:
      dp-aware: true
      decode-policy: cache_aware
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        max-running-requests: 8
    decode:
      <<: *tep4_dep4_decode
      nodes: 1
      workers: 1
  benchmark:
    env:
      CONC: "8"

# Policy-only contrast: stock decode ChunkCache has no shared-prefix reuse.
override_colocated_tep4_dep4_round_robin_c8: &tep4_dep4_rr
  <<: *tep4_dep4_pd
  frontend:
    args:
      dp-aware: true
      decode-policy: round_robin

# Native local decode batch four; leave coupled extra slots at their stock default.
override_colocated_tep4_dep4_round_robin_batch4_c8: &tep4_dep4_rr_batch4
  <<: *tep4_dep4_rr
  roles:
    prefill: *tep4_dep4_prefill
    decode:
      <<: *tep4_dep4_decode
      args:
        <<: *dep4_pd_args
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16

# Genuine GSM32 uses C16 only to exercise the new per-lane graph bucket.
override_colocated_tep4_dep4_round_robin_batch4_quality_c16:
  <<: *tep4_dep4_rr_batch4
  benchmark:
    env:
      CONC: "16"

# Partial attention-DP2 gate; all other qualified batch-four server flags stay fixed.
override_colocated_tep4_attndp2_round_robin_quality_c16: &tep4_attndp2_rr
  <<: *tep4_dep4_rr_batch4
  roles:
    prefill: *tep4_dep4_prefill
    decode:
      <<: *tep4_dep4_decode
      args:
        <<: *dep4_pd_args
        data-parallel-size: 2
        max-running-requests: 16
        cuda-graph-max-bs-decode: 16
  benchmark:
    env:
      CONC: "16"

# Matched long-context proxy; preserve the genuine-qualified ADP2 server.
override_colocated_tep4_attndp2_round_robin_c8:
  <<: *tep4_attndp2_rr
  benchmark:
    env:
      CONC: "8"

# Two independent TEP4 prefill workers share one native 513 GB host pool.
# Decode occupies four GPUs on the second node: 12 active / 16 allocated.
override_two_tep4_prefill_dep4_c8:
  <<: *tep4_dep4_pd
  sbatch_directives: {}
  roles:
    prefill:
      <<: *tep4_dep4_prefill
      nodes: 1
      workers: 2
    decode:
      <<: *tep4_dep4_decode
      nodes: 1
      workers: 1

# Diagnostic-only: attention DP2 is explicit here; dp-attn metadata means enabled,
# not four replicas. Publication requires explicit attention-DP-size metadata.
override_colocated_tep4_attndp2_ep4_c4:
  frontend:
    args:
      dp-aware: true
  roles:
    prefill:
      gpus: 4
      env:
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "1024"
      args: *tep4_pd_args
    decode:
      nodes: colocate
      gpus: 4
      env:
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "128"
      args:
        <<: *tep4_pd_args
        data-parallel-size: 2
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-dense-tp-size: 4
        mem-fraction-static: 0.955
  benchmark:
    env:
      CONC: "4"
