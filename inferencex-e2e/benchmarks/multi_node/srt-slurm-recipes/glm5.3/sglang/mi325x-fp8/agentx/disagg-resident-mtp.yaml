# Diagnostic only: symmetric native MTP, resident KV, and real greedy quality.
# This does not qualify stochastic sampling or eager rejection-state handoff.
schema: 2
base:
  name: mi325x-glm53-mori-resident-mtp-quality
  model:
    path: hf:zai-org/GLM-5.3
    container: lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261001@sha256:8190c29f67bdb65f41e0254efc72e60daa5117b7212e86a46aad5bf4b145f1b4
    precision: fp8
  identity:
    model:
      repo: zai-org/GLM-5.3
    container:
      image: lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261001@sha256:8190c29f67bdb65f41e0254efc72e60daa5117b7212e86a46aad5bf4b145f1b4
  slurm:
    time_limit: "02:00:00"
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  frontend:
    type: sglang-router
    enable_multiple_frontends: false
    args:
      prefill-policy: cache_aware
      decode-policy: round_robin
      health-check-timeout-secs: 600
      health-check-interval-secs: 30
      request-timeout-secs: 14400
      disable-retries: true
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 8
      env: &worker_env
        HF_HOME: /hf_hub_cache
        HF_HUB_CACHE: /hf_hub_cache/hub
        PYTHONNOUSERSITE: "1"
        PYTHONUNBUFFERED: "1"
        GLOO_SOCKET_IFNAME: enp193s0f0np0
        NCCL_SOCKET_IFNAME: enp193s0f0np0
        MORI_SOCKET_IFNAME: enp193s0f0np0
        MORI_IB_GID_INDEX: "3"
        MORI_RDMA_TC: "104"
        MORI_RDMA_SL: "3"
        MORI_IO_TC: "104"
        MORI_IO_SL: "3"
        NCCL_IB_TC: "104"
        NCCL_IB_SL: "3"
        NCCL_IB_GID_INDEX: "3"
        MORI_SHMEM_MODE: ISOLATION
        SGLANG_MORI_QP_PER_TRANSFER: "4"
        SGLANG_MORI_NUM_WORKERS: "4"
        MORI_IO_SQ_BACKOFF_TIMEOUT_US: "5000000"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "14400"
        SGLANG_HEALTH_CHECK_TIMEOUT: "600"
        SGLANG_TIMEOUT_KEEP_ALIVE: "1800"
      args: &worker_args
        served-model-name: zai-org/GLM-5.3
        revision: aca966e4e02791568aa6a4ced368624b3d897f42
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        dsa-prefill-backend: tilelang
        dsa-decode-backend: tilelang
        dsa-topk-backend: sgl-kernel
        kv-cache-dtype: fp8_e4m3
        page-size: 64
        # The evaluation sends messages without structured tools.
        reasoning-parser: glm45
        context-length: 1048576
        chunked-prefill-size: 16384
        mem-fraction-static: 0.85
        max-running-requests: 2
        cuda-graph-max-bs-decode: 2
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        disaggregation-transfer-backend: mori
        disaggregation-ib-device: bnxt_re4,bnxt_re5,bnxt_re1,bnxt_re0,bnxt_re10,bnxt_re11,bnxt_re7,bnxt_re6
        watchdog-timeout: 3600
        enable-metrics: true
        enable-cache-report: true
    decode:
      nodes: 1
      workers: 1
      gpus: 8
      env: *worker_env
      args: *worker_args
  sbatch_directives:
    mem: "0"
  srun_options:
    container-writable: ""
    container-remap-root: ""
  health_check:
    max_attempts: 720
    interval_seconds: 5
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      RESULT_DIR: /infmax-workspace/LOGS/agentic
      AGENTIC_OUTPUT_DIR: /infmax-workspace
      HF_HOME: /hf_hub_cache
      HF_HUB_CACHE: /hf_hub_cache/hub
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_BENCHMARK_GRACE_PERIOD: "1800"
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      TOKENIZERS_PARALLELISM: "false"
      CONC: "1"

override_c1: {}
