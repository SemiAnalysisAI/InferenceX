schema: 2
name: glm5.3-mi355x-tilert-agentx
slurm:
  time_limit: "08:00:00"
resources:
  gpu_type: mi355x
  gpus_per_node: 8
setup_script: glm5.3-tilert-rocm.sh
environment:
  TILERT_VERSION: "0.1.6.post3"
  RDMAV_FORK_SAFE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  NCCL_SOCKET_IFNAME: "@fabric.socket-ifname"
  GLOO_SOCKET_IFNAME: "@fabric.socket-ifname"
  NCCL_IB_HCA: "@fabric.nccl-ib-hca"
roles:
  prefill:
    engine:
      type: vllm
      set_visible_devices: true
    container: ghcr.io/tile-ai/tilert-rocm-prefill:0.1.6.post1
    nodes: 1
    workers: 1
    gpus: 8
    env:
      TILERT_ROLE: prefill
      # The prefill image sets MOONCAKE_DISABLE_HIP_DMABUF=1, so Mooncake falls back to
      # plain ibv_reg_mr on the 12.54 GB VRAM staging buffer and the ionic HCAs reject
      # it with EINVAL. "0" re-enables the dmabuf registration path post2 used.
      MOONCAKE_DISABLE_HIP_DMABUF: "0"
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "10800"
      AITER_QUICK_REDUCE_QUANTIZATION: INT4
      AITER_USE_FLYDSL_MOE_SORTING: "1"
    args:
      served-model-name: glm5_2
      tensor-parallel-size: 8
      max-model-len: 1048576
      trust-remote-code: true
      return-tokens-as-token-ids: true
      gpu-memory-utilization: 0.85
      # vLLM sizes KV to fill the 0.85 budget before TileRT allocates its 12.54 GiB
      # staging buffer, and ATOM leaves the 5.3 GiB of CUDA graphs out of the profile,
      # so the sampler warmup OOMs. 100 GiB is ~1.14M tokens at 93.9 KB/token.
      kv-cache-memory: 107374182400
      kv-cache-dtype: bfloat16
      block-size: 64
      async-scheduling: true
      load-format: fastsafetensors
      compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      max-num-batched-tokens: 16384
      enable-prefix-caching: true
      speculative-config: '{"method":"mtp","num_speculative_tokens":1}'
      kv-transfer-config: >-
        {"kv_connector":"TileRTConnector","kv_connector_module_path":"tilert.pd_vllm.prefill_connector",
         "kv_role":"kv_producer","kv_connector_extra_config":{
           "tilert_model":"glm5_2","tilert_max_seq_len":1048576,"tilert_transport":"mooncake"}}
  decode:
    engine: tilert
    container: ghcr.io/tile-ai/tilert-rocm-decode:0.1.6
    nodes: 1
    workers: 1
    gpus: 8
    env:
      TILERT_ROLE: decode
      GLM5_AR_N: "2"
    args:
      model: glm5_2
      model-weights-dir: /models/GLM-5.3-tilert-tp8
      max-seq-len: 1048576
      kv-cache-dtype: bf16
      transport: mooncake
      with-mtp: true
      num-mtp: 3
frontend:
  type: tilert-router
  container_image: ghcr.io/tile-ai/tilert-rocm-decode:0.1.6
  enable_multiple_frontends: false
  env:
    TILERT_ROLE: router
  args:
    parser: none
    model-path: /model
    queue-timeout: 1800
sbatch_directives:
  cpus-per-task: "128"
  mem: "0"
srun_options:
  mem: "0"
  container-writable: ""
  container-remap-root: ""
health_check:
  max_attempts: 2160
  interval_seconds: 5
benchmark:
  env:
    MODEL: /model
    SERVED_MODEL_NAME: glm5_2
    AIPERF_MAX_CONTEXT_LENGTH: "1048576"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"
    HF_HOME: /logs/hf_cache
    HF_HUB_OFFLINE: ""
    TRANSFORMERS_VERBOSITY: error
    TOKENIZERS_PARALLELISM: "false"
