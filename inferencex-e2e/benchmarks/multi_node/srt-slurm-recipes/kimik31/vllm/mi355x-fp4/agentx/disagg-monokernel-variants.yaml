        additional-config: '{"kda_prefill_backend":"fused"}'
        kv-transfer-config: '{"kv_connector":"MoRIIOConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail","kv_connector_extra_config":{"backend":"rdma","read_mode":true}}'
        attention-config: '{"indexer_kv_dtype":"mxfp4"}'
        hf-overrides: '{"text_config":{"dsa_config":{"indexer_use_fp8":true}}}'
        prefix-match-unit: 512
        cp-kv-cache-interleave-size: 1
        quantization-config: '{"targets":{"*in_proj_qkvgfab":"fp8_per_channel"}}'
        mamba-ssm-cache-dtype: float32
        mamba-cache-mode: align
        block-size: 64
        disable-uvicorn-access-log: true
