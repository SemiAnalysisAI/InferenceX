base:
  schema: 2
  slurm:
    time_limit: 08:00:00
  sbatch_directives:
    mem: '0'
  srun_options:
    container-remap-root: ''
    container-writable: ''
    mem: '0'
  container_mounts:
    /dev/infiniband: /dev/infiniband
    /var/lib/hf-hub-cache/models--moonshotai--Kimi-K3.1-Pro/snapshots/6d0a0202956796543364d666ab19c6ad1a494ee1: /model
  extra_mount:
  - /usr/lib/x86_64-linux-gnu/libibverbs/libionic-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libionic-rdmav34.so:ro
  - /var/lib/hf-hub-cache:/k31-preview:ro
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
