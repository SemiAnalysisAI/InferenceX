    args:
      policy: consistent_hash
      prefill-policy: consistent_hash
      decode-policy: consistent_hash
      log-level: info
    enable_multiple_frontends: false
    placement:
      node: head
  observability:
    enabled: false
    tachometer:
      enabled: false
  health_check:
    interval_seconds: 10
    max_attempts: 720
  engine:
    type: vllm
    connector: moriio
  roles:
    prefill:
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3.1-Pro
        trust-remote-code: true
        moe-backend: auto
        tensor-parallel-size: 8
        load-format: fastsafetensors
        gpu-memory-utilization: 0.91
        language-model-only: true
        max-model-len: 1048576
        enable-prefix-caching: true
        kv-cache-dtype: fp8
        stream-interval: 10
        seed: 7
        decode-context-parallel-size: 8
        dcp-comm-backend: a2a
        max-num-seqs: 48
        max-num-batched-tokens: 10240
        compilation-config: '{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":10240,"custom_ops":["+fused_rms_norm_gated"],"cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128,132,136,140,144,148,152,156,160,164,168,172,176,180,184,188,192,224,256,288,320,352,384,416,448,480,512,640,768,896,1024,1280,1536,1792,2048,2560,3072,3584,4096,4608,5120,6144,6400,7168,8192,8704,10240]}'
