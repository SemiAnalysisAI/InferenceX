# [DNM] AgentX MiniMax-M3 NVFP4 on one B200 node with TokenSpeed prefill/decode
# (engine: tokenspeed, SemiAnalysisAI/srt-slurm#37 and its SMG follow-up), TP4 prefill
# + TP4 decode, KV over Mooncake RDMA, behind two routers:
#   override_dynamo_disagg_c8  Dynamo frontend, dynamo.tokenspeed workers
#   override_smg_disagg_c8     SMG, TokenSpeed gRPC engines
# Same engine settings as b300-fp4/agentx/agentic.yaml. TokenSpeed's Mooncake engine
# speaks RDMA verbs only (runtime/pd/base/mooncake_engine.py); B300 DSXE exposes EFA
# devices, B200 Nscale ConnectX HCAs.
# Engine flags follow TokenSpeed's MiniMax M3 recipe without speculative decoding:
# https://github.com/lightseekorg/tokenspeed/blob/22251686ff26a2b2f495263b348db80980b8ac9e/docs/recipes/models.md#minimax-m3
# tokenspeed-0.1.0.post20260930.sh installs TokenSpeed (and with it the gRPC engine and
# the `smg` command) into TokenSpeed's runner image; srtctl installs ai-dynamo for the
# Dynamo variants. Dynamo prefill/decode needs ai-dynamo/dynamo#9237, first in the
# 1.6.0.dev20260922 nightly.

schema: 2

base:
  model:
    path: minimax-m3-nvfp4
    container: lightseekorg/tokenspeed-runner:cu130-torch-2.14.0-flashinfer-0.7.0
    precision: fp4
  slurm:
    time_limit: '2:00:00'
  health_check:
    max_attempts: 720
    interval_seconds: 5
  resources:
    gpu_type: b200
    gpus_per_node: 8
  observability:
    enabled: false
    tachometer:
      enabled: false
  setup_script: tokenspeed-0.1.0.post20260930.sh
  # The runner image is not built on an NVIDIA CUDA base image, so it sets neither
  # variable and enroot's NVIDIA hook would expose no GPU. The job script exports
  # these, and the containers inherit them.
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  engine: tokenspeed
  sbatch_directives:
    mem: '0'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      IS_MULTINODE: 'true'
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      # 256k-capped corpus, within max-model-len.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      MAX_MODEL_LEN: '262144'
      AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES: '0'
      # Dynamo builds after ai-dynamo/dynamo#9920 reject nvext.session_control.
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      SERVED_MODEL_NAME: nvidia/MiniMax-M3-NVFP4
      MODEL: nvidia/MiniMax-M3-NVFP4
      MODEL_PREFIX: minimaxm3
      PRECISION: fp4
      KV_OFFLOADING: none
      OPENAI_API_KEY: EMPTY
      CONC: '8'

override_dynamo_disagg_c8:
  name: minimaxm3-b200-tokenspeed-dynamo-disagg-tp4-tp4-c8
  dynamo:
    install: true
    source:
      pypi: "1.6.0.dev20260922"
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env: &env
        PYTHONUNBUFFERED: '1'
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        TQDM_DISABLE: '1'
      args: &args
        served-model-name: nvidia/MiniMax-M3-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 4
        max-model-len: 262144
        max-num-seqs: 16
        max-prefill-tokens: 8192
        chunked-prefill-size: 8192
        gpu-memory-utilization: 0.9
        disable-cuda-graph-padding: true
        attention-backend: trtllm
        kv-cache-dtype: fp8
        moe-backend: flashinfer_trtllm
        disable-kvstore: true
        block-size: 128
        # The eight external HCAs, as dsv4/sglang/b200-fp4/agentx/disagg-variants.yaml.
        disaggregation-ib-device: mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_10,mlx5_11
    decode:
      nodes: colocate
      workers: 1
      gpus: 4
      env: *env
      args: *args

override_smg_disagg_c8:
  name: minimaxm3-b200-tokenspeed-smg-disagg-tp4-tp4-c8
  dynamo:
    install: false
  frontend:
    type: smg
    enable_multiple_frontends: false
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: *args
    decode:
      nodes: colocate
      workers: 1
      gpus: 4
      env: *env
      args: *args


# Parallel layouts. MiniMax-M3 is a MoE: DEP is attention DP over every GPU of the worker
# with expert parallelism (data-parallel-size N, enable-expert-parallel), TEP is tensor
# parallelism with expert parallelism (tensor-parallel-size N, enable-expert-parallel). TokenSpeed caps
# MiniMax-M3 at TP4: it has four index heads and does not replicate them.
override_dynamo_dep8_c8:
  name: minimaxm3-b200-tokenspeed-dynamo-agg-dep8-c8
  dynamo: &dynamo_install
    install: true
    source:
      pypi: "1.6.0.dev20260922"
  frontend: &dynamo_frontend
    type: dynamo
    enable_multiple_frontends: false
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      env: *env
      args: &dep8
        served-model-name: nvidia/MiniMax-M3-NVFP4
        trust-remote-code: true
        data-parallel-size: 8
        enable-expert-parallel: true
        max-model-len: 262144
        max-num-seqs: 16
        max-prefill-tokens: 8192
        chunked-prefill-size: 8192
        gpu-memory-utilization: 0.9
        disable-cuda-graph-padding: true
        attention-backend: trtllm
        kv-cache-dtype: fp8
        moe-backend: flashinfer_trtllm
        disable-kvstore: true
        block-size: 128
        disaggregation-ib-device: mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_10,mlx5_11

override_smg_dep8_c8:
  name: minimaxm3-b200-tokenspeed-smg-agg-dep8-c8
  dynamo: &no_dynamo
    install: false
  frontend: &smg_frontend
    type: smg
    enable_multiple_frontends: false
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      env: *env
      args: *dep8

override_dynamo_tep4_c8:
  name: minimaxm3-b200-tokenspeed-dynamo-agg-tep4-c8
  dynamo: *dynamo_install
  frontend: *dynamo_frontend
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: &tep4
        served-model-name: nvidia/MiniMax-M3-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 4
        enable-expert-parallel: true
        max-model-len: 262144
        max-num-seqs: 16
        max-prefill-tokens: 8192
        chunked-prefill-size: 8192
        gpu-memory-utilization: 0.9
        disable-cuda-graph-padding: true
        attention-backend: trtllm
        kv-cache-dtype: fp8
        moe-backend: flashinfer_trtllm
        disable-kvstore: true
        block-size: 128
        disaggregation-ib-device: mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_10,mlx5_11

override_smg_tep4_c8:
  name: minimaxm3-b200-tokenspeed-smg-agg-tep4-c8
  dynamo: *no_dynamo
  frontend: *smg_frontend
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: *tep4

# One DEP16 worker across two nodes. At 0.9 its attention-DP ranks ran out of memory under
# load (sparse_topk_select init, cublasCreate), so it leaves more headroom.
override_dynamo_dep16_c8:
  name: minimaxm3-b200-tokenspeed-dynamo-agg-dep16-c8
  dynamo: *dynamo_install
  frontend: *dynamo_frontend
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 16
      env: *env
      args: &dep16
        served-model-name: nvidia/MiniMax-M3-NVFP4
        trust-remote-code: true
        data-parallel-size: 16
        enable-expert-parallel: true
        max-model-len: 262144
        max-num-seqs: 16
        max-prefill-tokens: 8192
        chunked-prefill-size: 8192
        gpu-memory-utilization: 0.8
        disable-cuda-graph-padding: true
        attention-backend: trtllm
        kv-cache-dtype: fp8
        moe-backend: flashinfer_trtllm
        disable-kvstore: true
        block-size: 128
        disaggregation-ib-device: mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_10,mlx5_11

override_smg_dep16_c8:
  name: minimaxm3-b200-tokenspeed-smg-agg-dep16-c8
  dynamo: *no_dynamo
  frontend: *smg_frontend
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 16
      env: *env
      args: *dep16

# Prefill and decode on separate nodes, KV over Mooncake RDMA between them. Dynamo
# disaggregates only attention-DP-1 workers (dynamo.tokenspeed's
# validate_disagg_compatibility), so its decode is TEP4; behind SMG decode is DEP8.
override_dynamo_disagg_tep4_tep4_c8:
  name: minimaxm3-b200-tokenspeed-dynamo-disagg-tep4-tep4-c8
  dynamo: *dynamo_install
  frontend: *dynamo_frontend
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: *tep4
    decode:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: *tep4

override_smg_disagg_tep4_dep8_c8:
  name: minimaxm3-b200-tokenspeed-smg-disagg-tep4-dep8-c8
  dynamo: *no_dynamo
  frontend: *smg_frontend
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: *tep4
    decode:
      nodes: 1
      workers: 1
      gpus: 8
      env: *env
      args: *dep8
