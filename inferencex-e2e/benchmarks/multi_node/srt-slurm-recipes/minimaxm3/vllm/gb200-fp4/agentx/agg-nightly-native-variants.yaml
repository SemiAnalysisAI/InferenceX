schema: 2

base:
  identity:
    model: {}
    container: {}
    frameworks: {dynamo: "1.6.0.dev20261016"}
  dynamo: {install: true, source: {pypi: "1.6.0.dev20261016"}}
  environment: {ETCD_LEASE_TTL: "7200"}
  slurm: {time_limit: "12:00:00"}
  health_check: {max_attempts: 2160, interval_seconds: 10}
  resources:
    gpu_type: "gb200"
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      DYN_TCP_REQUEST_TIMEOUT: "60"
      DYN_TOKENIZER: "fastokens"
      DYN_TOKENIZER_CACHE_BYTES: "8589934592"
    args:
      trust-remote-code: true
      router-mode: "kv"
      router-kv-events: true
      router-temperature: "0"
      router-session-affinity-ttl-secs: 14400
      kv-cache-block-size: 128
  engine:
    type: vllm
    connector:
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "7200"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        VLLM_FLOAT32_MATMUL_PRECISION: "high"
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: "trtllm"
        VLLM_LOG_STATS_INTERVAL: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        UCX_MEMTYPE_CACHE: "n"
        UCX_NET_DEVICES: "@fabric.rdma-device-ports"
        UCX_TLS: "cuda_copy,cuda_ipc,rc"
        NCCL_IB_HCA: "@fabric.rdma-devices"
      args:
        served-model-name: "nvidia/MiniMax-M3-NVFP4"
        tensor-parallel-size: 4
        pipeline-parallel-size: 1
        trust-remote-code: true
        enable-prefix-caching: true
        kv-cache-metrics: true
        attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8","minimax_m3_msa_decode_backend":"cutlass"}'
        block-size: 128
        gpu-memory-utilization: 0.9
        max-model-len: 1048576
        language-model-only: true
        kv-cache-dtype: "fp8"
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASHINFER","use_local_argmax_reduction":true}'
        stream-interval: 20
        max-num-batched-tokens: 16384
        no-enable-flashinfer-autotune: true
        reasoning-parser: "minimax_m3"
        dyn-tool-call-parser: "minimax_m3"
        dyn-reasoning-parser: "minimax_m3"
      kv_events: true
  sbatch_directives: {cpus-per-task: "144", mem: "0"}
  srun_options: {container-remap-root: ""}
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
      AIPERF_EXTRA_INPUTS: "thinking:true"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"

override_tp4_c1:
  name: "minimax-m3-vllm-agg-gb200-tp4-c1-agentic-nightly-native"
  roles:
    agg:
      args:
        max-num-seqs: 2
        # Sizes 1 and 2 give the EAGLE3 drafter's decode steps full CUDA graphs.
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8,256,512,1024,2048]}'

override_tp4_mns16_c10:
  name: "minimax-m3-vllm-agg-gb200-tp4-mns16-c10-agentic-nightly-native"
  roles:
    agg:
      args:
        max-num-seqs: 16
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,256,512,1024,2048]}'

