schema: 2

base:
  name: minimaxm3-mi300x-vllm-nixl-agentx
  model:
    path: hf:MiniMaxAI/MiniMax-M3-MXFP8
    container: vllm/vllm-openai-rocm:nightly-81198e97ba7eee2a22540caaa756b7fdddcb4d93@sha256:a401e4f46872dcde77e07ae3d7fa2d3a71b7f2773714316116532e2b39deb179
    precision: fp8
  resources:
    gpu_type: mi300x
    gpus_per_node: 8
  sbatch_directives:
    cpus-per-task: "128"
    mem: "0"
  srun_options:
    container-remap-root: ""
    container-writable: ""
  frontend:
    type: vllm-router
    container_image: vllm/vllm-router@sha256:9321abfa55f5d75d1bfce51a4a9835824ef6a5c73731d6ea65b3fc5402d85354
    enable_multiple_frontends: false
    args:
      policy: cache_aware
      prefill-policy: cache_aware
      decode-policy: round_robin
  observability:
    enabled: false
    tachometer:
      enabled: false
  health_check:
    interval_seconds: 10
    max_attempts: 360
  engine:
    type: vllm
    connector: nixl
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 8
      env: &worker_env
        HF_HOME: /hf_hub_cache
        HF_HUB_CACHE: /hf_hub_cache
        PYTHONNOUSERSITE: "1"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
        VLLM_ROCM_USE_AITER: "1"
        VLLM_ROCM_USE_AITER_MHA: "0"
        TORCH_BLAS_PREFER_HIPBLASLT: "1"
        NCCL_MIN_NCHANNELS: "112"
        GPU_MAX_HW_QUEUES: "2"
        UCX_LOG_LEVEL: info
      args: &worker_args
        kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}'
        served-model-name: MiniMaxAI/MiniMax-M3-MXFP8
        tensor-parallel-size: 8
        trust-remote-code: true
        block-size: 128
        gpu-memory-utilization: 0.90
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        enable-chunked-prefill: true
        max-num-batched-tokens: 16384
        max-num-seqs: 8
        max-model-len: 1048576
        language-model-only: true
        enable-prefix-caching: true
        attention-backend: TRITON_ATTN
        kv-cache-dtype: fp8
        tool-call-parser: minimax_m3
        reasoning-parser: minimax_m3
        enable-auto-tool-choice: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        stream-interval: 20
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"TRITON_ATTN"}'
    decode:
      nodes: 1
      workers: 1
      gpus: 8
      env: *worker_env
      args:
        <<: *worker_args
        kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: MiniMaxAI/MiniMax-M3-MXFP8
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"
      AIPERF_APPLY_CHAT_TEMPLATE: "true"
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache

override_1p1d_tp8_c4:
  benchmark:
    env:
      CONC: "4"
      KV_OFFLOADING: none
