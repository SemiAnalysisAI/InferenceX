schema: 2
name: "minimax-m3-vllm-disagg-b300-2p1d-fp4-dep2-tep8-1k1k"

model:
  path: "nvidia/MiniMax-M3-NVFP4"
  container: "vllm/vllm-openai:vllm-minimax-m3-perf-x86_64-13.0.1-8b00f41"
  precision: "fp4"

resources:
  gpu_type: "b300"
  gpus_per_node: 8
dynamo:
  install: true
  source:
    pypi: 1.3.0.dev20260614

frontend:
  type: dynamo
  enable_multiple_frontends: false

engine:
  type: vllm
  connector:

roles:
  prefill:
    nodes: 1
    workers: 2
    gpus: 2
    env:
      UCX_TLS: "cuda_copy,rc"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"

    args:
      no-enable-flashinfer-autotune: true
      tensor-parallel-size: 1
      data-parallel-size: 2
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      trust-remote-code: true
      no-enable-prefix-caching: true
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      block-size: 128
      gpu-memory-utilization: 0.90
      max-model-len: 2304
      language-model-only: true
      stream-interval: 32
      max-cudagraph-capture-size: 2048
      max-num-batched-tokens: 2048

  decode:
    nodes: 1
    workers: 1
    gpus: 8

    env:
      UCX_TLS: "cuda_copy,rc"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"

    args:
      no-enable-flashinfer-autotune: true
      tensor-parallel-size: 8
      enable-expert-parallel: true
      trust-remote-code: true
      no-enable-prefix-caching: true
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      block-size: 128
      gpu-memory-utilization: 0.90
      max-model-len: 2304
      language-model-only: true
      stream-interval: 32
      max-num-seqs: 4096
      max-num-batched-tokens: 16384
      max-cudagraph-capture-size: 8192

health_check:
  max_attempts: 360
  interval_seconds: 10

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "32"
  req_rate: "inf"
