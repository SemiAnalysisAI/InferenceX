# [DNM] MiniMax-M3 NVFP4 AgentX on two GB300 nodes, prefill/decode disaggregated
# behind the Shepherd Model Gateway (SMG 1.11.0) over gRPC, KV over NIXL.
# Topology and NVL72/UCX settings follow disagg-variants.yaml (1P TP4 + 1D TP4);
# engine settings follow the B300 single-node recipe for the same vLLM image
# (single_node/.../minimaxm3/vllm/b300-fp4-mtp/agentic.yaml), without speculative
# decoding. `grpc: true` runs `vllm serve --grpc`; engine.connector: nixl gives both
# roles NixlConnector. smg-vllm-grpc-1.11.0.sh installs SMG and smg-grpc-servicer.
schema: 2
name: "minimax-m3-vllm-disagg-gb300-1p1d-tp4-tp4-smg-grpc-nixl-agentic"

model:
  path: "nvidia/MiniMax-M3-NVFP4"
  container: "vllm/vllm-openai:nightly-af7f9488c2210d67e1033ecdc845b087ee7fe92b"
  precision: "fp4"

identity:
  model:
    repo: "nvidia/MiniMax-M3-NVFP4"
  container:
    image: "vllm/vllm-openai:nightly-af7f9488c2210d67e1033ecdc845b087ee7fe92b"

dynamo:
  install: false

health_check:
  max_attempts: 2160
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4

observability:
  enabled: false
  tachometer:
    enabled: false

frontend:
  type: smg
  enable_multiple_frontends: false
  args:
    tool-call-parser: minimax_m3
    reasoning-parser: minimax_m3
    request-timeout-secs: 14400

setup_script: smg-vllm-grpc-1.11.0.sh

engine:
  type: vllm
  connector: nixl

roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env: &env
      HF_HUB_CACHE: "/hf_hub_cache"
      HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
      PYTHONNOUSERSITE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: "trtllm"
      VLLM_USE_NCCL_SYMM_MEM: "0"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      UCX_MEMTYPE_CACHE: "n"
      UCX_CUDA_IPC_ENABLE_MNNVL: "y"
      UCX_MODULE_DIR: "/usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx"
      UCX_RNDV_PIPELINE_ERROR_HANDLING: "y"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
    args: &args
      served-model-name: "nvidia/MiniMax-M3-NVFP4"
      grpc: true
      tensor-parallel-size: 4
      gpu-memory-utilization: 0.9
      block-size: 128
      language-model-only: true
      enable-prefix-caching: true
      enable-chunked-prefill: true
      no-enable-flashinfer-autotune: true
      attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}'
      kv-cache-dtype: fp8
      max-num-batched-tokens: 16384
      max-num-seqs: 16
      stream-interval: 20
      trust-remote-code: true
  decode:
    nodes: 1
    workers: 1
    gpus: 4
    env: *env
    args: *args

sbatch_directives:
  cpus-per-task: "72"
  mem: "0"

srun_options:
  container-remap-root: ""

benchmark:
  type: custom
  concurrencies: [8]
  command: "bash /infmax-workspace/benchmarks/srt_agentic.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    MODEL: "nvidia/MiniMax-M3-NVFP4"
    # gRPC workers serve no Prometheus endpoint; read SMG's on the frontend node.
    AIPERF_SERVER_METRICS_URLS: "http://localhost:29000/metrics"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
