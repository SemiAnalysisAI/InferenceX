# [DNM] MiniMax-M3 NVFP4 AgentX on two B200 HGX nodes: one aggregated vLLM
# deployment at data parallel 16 with expert parallelism, served through the
# Shepherd Model Gateway (SMG 1.11.0). Engine settings follow the B200
# single-node recipe (single_node/.../minimaxm3/vllm/b200-fp4-mtp/agentic.yaml),
# DP/EP settings the GB200 DEP8 recipe (gb200-fp4/agentx/agg-dep8.yaml).
# Node 0 serves the API and balances the 16 ranks; node 1 runs headless ranks,
# so SMG receives one worker. smg-1.11.0.sh installs SMG into the vLLM image.
schema: 2
name: "minimax-m3-vllm-agg-b200-dep16-smg-agentic"

model:
  path: "hf:nvidia/MiniMax-M3-NVFP4"
  container: "vllm/vllm-openai:nightly-af7f9488c2210d67e1033ecdc845b087ee7fe92b"
  precision: "fp4"

identity:
  model:
    repo: "nvidia/MiniMax-M3-NVFP4"
  container:
    image: "vllm/vllm-openai:nightly-af7f9488c2210d67e1033ecdc845b087ee7fe92b"

dynamo:
  install: false

slurm:
  time_limit: "4:00:00"

health_check:
  interval_seconds: 10
  max_attempts: 720

resources:
  gpu_type: "b200"
  gpus_per_node: 8

frontend:
  type: smg
  enable_multiple_frontends: false
  args:
    policy: cache_aware
    request-timeout-secs: 14400

setup_script: smg-1.11.0.sh

engine:
  type: vllm
  connector:

roles:
  agg:
    nodes: 2
    workers: 1
    gpus: 16
    env:
      PYTHONNOUSERSITE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: "trtllm"
      VLLM_LOG_STATS_INTERVAL: "1"
      NCCL_CUMEM_ENABLE: "1"
    args:
      served-model-name: "nvidia/MiniMax-M3-NVFP4"
      tensor-parallel-size: 1
      data-parallel-size: 16
      enable-expert-parallel: true
      trust-remote-code: true
      gpu-memory-utilization: 0.90
      block-size: 128
      language-model-only: true
      enable-prefix-caching: true
      enable-chunked-prefill: true
      no-enable-flashinfer-autotune: true
      reasoning-parser: minimax_m3
      tool-call-parser: minimax_m3
      enable-auto-tool-choice: true
      default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
      attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}'
      kv-cache-dtype: fp8
      max-num-batched-tokens: 16384
      max-num-seqs: 4
      max-cudagraph-capture-size: 16
      stream-interval: 20
      speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASHINFER","use_local_argmax_reduction":true}'

srun_options:
  container-remap-root: ""

benchmark:
  type: custom
  concurrencies: [32]
  command: bash /infmax-workspace/benchmarks/srt_agentic.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    MODEL: "nvidia/MiniMax-M3-NVFP4"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
