# AgentX Qwen3.5 FP8: native SGLang Router, MORI KV transfer, TP8/EP8 per role.
# Uses the srt-slurm AMD runtime and native Qwen3.5 MTP.
# Concurrency candidates are untuned; fast runs are not performance submissions.
# The shared launcher supplies the cluster profile and workspace/results mounts.
# srt-slurm and Pyxis own model caching and the container lifecycle.

schema: 2
name: mi300x-qwen35-agentx-mori-disagg-1p1d-tep8-mtp

model:
  path: hf:Qwen/Qwen3.5-397B-A17B-FP8
  container: lmsysorg/sglang-rocm:v0.5.20-rocm720-mi30x-20260929
  precision: fp8

identity:
  model:
    repo: Qwen/Qwen3.5-397B-A17B-FP8
  container:
    image:
      lmsysorg/sglang-rocm:v0.5.20-rocm720-mi30x-20260929@sha256:585867623ab32a3f6e7839e15608cf67229f3de77d08af796b8b9d58ff76b6cb

slurm:
  time_limit: "12:00:00"

resources:
  gpu_type: mi300x
  gpus_per_node: 8
frontend:
  type: sglang-router
  enable_multiple_frontends: false
  args:
    prefill-policy: cache_aware
    decode-policy: round_robin
    cache-threshold: 0.3
    health-check-timeout-secs: 600
    health-check-interval-secs: 30

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 8
    env: &worker_environment
      HF_HOME: /hf-cache
      HF_HUB_CACHE: /hf-cache/hub
      HUGGINGFACE_HUB_CACHE: /hf-cache/hub
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      GLOO_SOCKET_IFNAME: ens50f1np1
      NCCL_SOCKET_IFNAME: ens50f1np1
      MORI_SOCKET_IFNAME: ens50f1np1
      MORI_RDMA_DEVICES:
        bnxt_re_bond0,bnxt_re_bond1,bnxt_re_bond2,bnxt_re_bond3,bnxt_re_bond4,bnxt_re_bond5,bnxt_re_bond6,bnxt_re_bond7
      IBDEVICES:
        bnxt_re_bond0,bnxt_re_bond1,bnxt_re_bond2,bnxt_re_bond3,bnxt_re_bond4,bnxt_re_bond5,bnxt_re_bond6,bnxt_re_bond7
      MORI_IB_GID_INDEX: "3"
      MORI_RDMA_TC: "104"
      MORI_RDMA_SL: "3"
      MORI_IO_TC: "104"
      MORI_IO_SL: "3"
      NCCL_IB_TC: "104"
      NCCL_IB_SL: "3"
      NCCL_IB_GID_INDEX: "3"
      MORI_IO_SQ_BACKOFF_TIMEOUT_US: "50000"
      MORI_IO_QP_MAX_SEND_WR: "16384"
      MORI_IO_QP_MAX_CQE: "32768"
      MORI_IO_QP_MAX_SGE: "2"
      MORI_SHMEM_MODE: ISOLATION
      SGLANG_USE_AITER: "1"
      SGLANG_USE_AITER_UNIFIED_ATTN: "1"
      AITER_FLYDSL_FORCE: "1"
      SGLANG_MAMBA_SSM_DTYPE: bfloat16
      SGLANG_MORI_QP_PER_TRANSFER: "4"
      SGLANG_MORI_NUM_WORKERS: "4"
      SGLANG_DISAGGREGATION_NUM_PRE_ALLOCATE_REQS: "32"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
      SGLANG_HEALTH_CHECK_TIMEOUT: "600"
      SGLANG_TIMEOUT_KEEP_ALIVE: "1800"
    args: &worker_config
      served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
      trust-remote-code: true
      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 8
      disaggregation-transfer-backend: mori
      disaggregation-ib-device:
        bnxt_re_bond0,bnxt_re_bond1,bnxt_re_bond2,bnxt_re_bond3,bnxt_re_bond4,bnxt_re_bond5,bnxt_re_bond6,bnxt_re_bond7
      dtype: bfloat16
      # auto follows the explicit BF16 model activation dtype, not FP8 weights.
      kv-cache-dtype: auto
      attention-backend: aiter
      # Image enables INT8 quick-reduce; do not combine with allreduce fusion.
      enable-aiter-allreduce-fusion: false
      page-size: 16
      mamba-ssm-dtype: bfloat16
      moe-dense-tp-size: 1
      reasoning-parser: qwen3
      tool-call-parser: qwen3_coder
      speculative-algorithm: EAGLE
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      context-length: 262144
      disable-radix-cache: false
      mem-fraction-static: 0.75
      max-running-requests: 64
      max-prefill-tokens: 32768
      chunked-prefill-size: 8192
      scheduler-recv-interval: 30
      tokenizer-worker-num: 6
      cuda-graph-max-bs-decode: 64
      watchdog-timeout: 3600
      enable-metrics: true
      enable-cache-report: true
      log-level: info
  decode:
    nodes: 1
    workers: 1
    gpus: 8

    env:
      <<: *worker_environment
    args:
      <<: *worker_config
      chunked-prefill-size: 8192

sbatch_directives:
  mem: "0"

srun_options:
  container-writable: ""
  container-remap-root: ""

health_check:
  max_attempts: 720
  interval_seconds: 5

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/srt_agentic.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    IMAGE: lmsysorg/sglang-rocm:v0.5.20-rocm720-mi30x-20260929
    IS_MULTINODE: "true"
    DISAGG: "true"
    HF_HOME: /hf-cache
    HF_HUB_CACHE: /hf-cache/hub
    HUGGINGFACE_HUB_CACHE: /hf-cache/hub
    PYTHONDONTWRITEBYTECODE: "1"
    TOKENIZERS_PARALLELISM: "false"
    TRANSFORMERS_VERBOSITY: error
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
    RESULT_DIR: /logs/agentic
    AGENTIC_OUTPUT_DIR: /logs
    PORT: '8000'
