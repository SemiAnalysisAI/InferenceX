schema: 2

base:
  dynamo:
    install: true
    source:
      rev: b208989fbe1cfbfde64d11334d8af4ff04fe1a99
  slurm:
    time_limit: '8:00:00'
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  services:
    - name: etcd
      type: etcd
    - name: nats
      type: nats
      options:
        max_payload_mb: 8
  frontend:
    type: dynamo
    nginx_session_affinity: true
    nginx_session_affinity_header: X-Dynamo-Session-ID
    enable_multiple_frontends: true
    env:
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    args:
      router-mode: kv
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      router-replica-sync: true
      router-queue-threshold: None
  engine: sglang
  roles:
    prefill:
      env:
        PYTHONOPTIMIZE: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        SGLANG_DISAGG_STAGING_BUFFER: '1'
        NO_COLOR: '1'
        PYTHONUNBUFFERED: '1'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_NVLS_ENABLE: '0'
        MC_FORCE_MNNVL: '1'
        NVSHMEM_REMOTE_TRANSPORT: none
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        SGLANG_FLASHINFER_FP4_GEMM_BACKEND: cutlass
        FLASHINFER_DISABLE_VERSION_CHECK: '1'
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: '1'
        SGLANG_FLASHINFER_NUM_MAX_DISPATCH_TOKENS_PER_RANK: '8192'
        SGLANG_DISAGG_STAGING_POOL_SIZE_MB: '8192'
        SGLANG_FLASHINFER_AUTOTUNE_CACHE: '1'
        SGLANG_FLASHINFER_AUTOTUNE_EXTEND: '1'
        SGLANG_FLASHINFER_MOE_FUSED_FINALIZE: '1'
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: '0'
        TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '1800'
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4
        model-path: /model/
        enable-metrics: true
        enable-cache-report: true
        trust-remote-code: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        tensor-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        disable-overlap-schedule: true
        mamba-ssm-dtype: bfloat16
        mamba-radix-cache-strategy: extra_buffer
        mamba-track-interval: 1048576
        mamba-max-states-per-path: 3
        disaggregation-mode: prefill
        disaggregation-bootstrap-port: 31000
        load-balance-method: round_robin
        page-size: 64
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_cutedsl
        speculative-algorithm: NEXTN
        speculative-num-steps: 6
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
        linear-attn-decode-backend: triton
        enable-hierarchical-cache: true
        hicache-write-policy: write_back
        hicache-io-backend: kernel
        watchdog-timeout: 1000000
        log-level: info
        nccl-port: 29500
        scheduler-recv-interval: 1
        weight-loader-prefetch-checkpoints: true
        weight-loader-prefetch-num-threads: 4
        moe-dense-tp-size: 1
        disable-shared-experts-fusion: true
        moe-a2a-backend: none
        speculative-moe-a2a-backend: none
        speculative-moe-runner-backend: flashinfer_trtllm
        disable-cuda-graph: true
        dist-timeout: 1800
    decode:
      env:
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        SGLANG_DISAGG_STAGING_BUFFER: '1'
        NO_COLOR: '1'
        PYTHONUNBUFFERED: '1'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_NVLS_ENABLE: '0'
        MC_FORCE_MNNVL: '1'
        NVSHMEM_REMOTE_TRANSPORT: none
        MC_TE_METRIC: 'true'
        SGLANG_ENABLE_SPEC_V2: '1'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        SGLANG_ENABLE_JIT_DEEPGEMM: 'true'
        SGLANG_FLASHINFER_FP4_GEMM_BACKEND: cutlass
        SGLANG_MOE_NVFP4_DISPATCH: '1'
        SGLANG_CUTEDSL_MOE_NVFP4_DISPATCH: '1'
        SGLANG_NCCL_ALL_GATHER_IN_OVERLAP_SCHEDULER_SYNC_BATCH: '1'
        FLASHINFER_DISABLE_VERSION_CHECK: '1'
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        SGLANG_HEALTH_CHECK_TIMEOUT: '1800'
        SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
        SGLANG_DISAGG_STAGING_POOL_SIZE_MB: '8192'
        SGLANG_FLASHINFER_AUTOTUNE_CACHE: '1'
        SGLANG_FLASHINFER_MOE_FUSED_FINALIZE: '1'
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: '0'
        TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '1800'
        SGLANG_Q35MF_PDDEC_FENCE: '1'
        SGLANG_Q35MF_PDDEC_DEFER_PREALLOC: '1'
        SGLANG_Q35MF_PDDEC_NONBLOCKING_ADMIT: '1'
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4
        model-path: /model/
        enable-metrics: true
        enable-cache-report: true
        trust-remote-code: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        pipeline-parallel-size: 1
        load-balance-method: round_robin
        mamba-track-interval: 128
        mamba-ssm-dtype: bfloat16
        disaggregation-mode: decode
        disable-radix-cache: true
        disaggregation-bootstrap-port: 31000
        page-size: 64
        attention-backend: trtllm_mha
        linear-attn-decode-backend: triton
        disable-shared-experts-fusion: true
        speculative-algorithm: NEXTN
        speculative-num-steps: 6
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
        chunked-prefill-size: 4096
        mem-fraction-static: 0.85
        stream-interval: 30
        enable-linear-replayssm-spec: true
        decode-log-interval: 30
        watchdog-timeout: 1000000
        weight-loader-prefetch-checkpoints: true
        weight-loader-prefetch-num-threads: 4
        mamba-radix-cache-strategy: no_buffer
        dist-timeout: 1800
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  srun_options:
    mem: '0'
    container-remap-root: ''
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_3p1d_dep8_cap32:
  name: disagg-gb300-3p1d-dep8-cap32-mtp-hicache
  frontend:
    num_additional_frontends: 1
    worker_selection:
      decode: dynamo-two-tier-cost-fn
      instances:
        - name: dynamo-two-tier-cost-fn
          type: dynamo-two-tier-cost-fn
    args:
      router-session-affinity-ttl-secs: '3600'
      router-session-affinity-mode: soft
      router-temperature: '1.0'
  roles:
    prefill:
      nodes: 3
      workers: 3
      gpus: 4
      env:
        SGLANG_PP_LAYER_PARTITION: 16,16,16,12
        SGLANG_Q35MF_GDN_PREFILL_SPLIT_CONV: '1'
      args:
        pipeline-parallel-size: 4
        max-mamba-cache-size: 1536
        max-running-requests: 128
        mem-fraction-static: 0.85
        max-prefill-tokens: 32768
        chunked-prefill-size: 32768
        hicache-mem-layout: page_first_direct
        hicache-ratio: 0.9
        pp-async-batch-depth: 1
    decode:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        SGLANG_USE_SYMM_MEM_DP_SYNC: 'true'
        SGLANG_TRTLLM_MHA_DECODE_SEQ_LEN_SPLITS: '4'
        SGLANG_Q35MF_PDDEC_SPLIT_HOIST: '1'
      args:
        gc-warning-threshold-secs: 0.2
        gc-threshold:
          - 50000
          - 50
          - 1000
        tensor-parallel-size: 8
        data-parallel-size: 8
        expert-parallel-size: 8
        moe-dense-tp-size: 1
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-runner-backend: flashinfer_cutedsl
        moe-a2a-backend: flashinfer
        ep-dispatch-algorithm: static
        eplb-algorithm: deepseek
        speculative-moe-runner-backend: flashinfer_trtllm_routed
        speculative-moe-a2a-backend: flashinfer
        max-mamba-cache-size: 936
        max-running-requests: 256
        disaggregation-decode-extra-slots: 64
        linear-replayssm-cache-len: 32
        cuda-graph-max-bs-decode: 32
        max-total-tokens: 12000000

