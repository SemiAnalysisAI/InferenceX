schema: 2
base:
  slurm:
    time_limit: '2:00:00'
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: sglang-router
    enable_multiple_frontends: false
  engine: sglang
  roles:
    agg:
      env:
        SGLANG_TRTLLM_MHA_DECODE_SEQ_LEN_SPLITS: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        NO_COLOR: '1'
        PYTHONUNBUFFERED: '1'
        PIP_BREAK_SYSTEM_PACKAGES: '1'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_NVLS_ENABLE: '0'
        MC_FORCE_MNNVL: '1'
        NVSHMEM_REMOTE_TRANSPORT: none
        MC_TE_METRIC: 'true'
        SGLANG_ENABLE_JIT_DEEPGEMM: 'true'
        SGLANG_MOE_NVFP4_DISPATCH: '1'
        SGLANG_NCCL_ALL_GATHER_IN_OVERLAP_SCHEDULER_SYNC_BATCH: '1'
        FLASHINFER_DISABLE_VERSION_CHECK: '1'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_HEALTH_CHECK_TIMEOUT: '1800'
        SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
        SGLANG_FLASHINFER_AUTOTUNE_CACHE: '1'
        SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: '1'
        SGLANG_SCHEDULER_SKIP_ALL_GATHER: '1'
        SGLANG_FLASHINFER_MOE_FUSED_FINALIZE: '1'
        SGLANG_ENABLE_METADATA_GLUE_GRAPH: '1'
        SGLANG_ENABLE_NV_MEGA_RUNTIME_OPTIMIZATION: '1'
        SGLANG_NVIDIA_MEGAKERNEL_SLOTS: route,mkm,gdn_verify,gdn_pdl,gdn_conv,hop,hop_fp8,hop_mid,draft_loop,draft_extend,draft_moe,draft_q1,draft_xchg,draft_hop,draft_fin,draft_front,draft_skv2,draft_multi,draft_embed,gdn_push,gdn_front,gdn_trt_front,route_shared,skv2,skv2_cp,mka,mka_push,mkm_wide,mkm_m32,mkm_m64,mkm_m128,mkm_m256,mkm_m512,multi_request,lowm_in,lowm_out,lowm_se,lowm_push,draft_q1_cp,draft_skv2_cp,sharded_gumbel
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4
        model-path: /model/
        enable-cache-report: true
        trust-remote-code: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        pipeline-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        moe-a2a-backend: none
        load-balance-method: round_robin
        mamba-radix-cache-strategy: extra_buffer
        mamba-track-interval: 8192
        mamba-max-states-per-path: 3
        mamba-ssm-dtype: bfloat16
        max-mamba-cache-size: 1536
        context-length: 262144
        page-size: 64
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        linear-attn-decode-backend: triton
        disable-shared-experts-fusion: true
        speculative-algorithm: NEXTN
        speculative-num-steps: 6
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 7
        speculative-moe-runner-backend: flashinfer_cutedsl
        speculative-moe-a2a-backend: none
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        mem-fraction-static: 0.85
        prefill-max-requests: 1
        stream-interval: 20
        decode-log-interval: 10
        watchdog-timeout: 1000000
        weight-loader-prefetch-checkpoints: true
        weight-loader-prefetch-num-threads: 4
        enable-hierarchical-cache: true
        hicache-write-policy: write_back
        hicache-io-backend: kernel
        hicache-mem-layout: page_first_direct
        hicache-size: 32
        enable-metrics: true
        enable-linear-replayssm-spec: true
        disable-attn-tp-gather: true
        cuda-graph-backend-prefill: breakable
        cuda-graph-max-bs-prefill: 16384
        enable-symm-mem: true
        flashinfer-allreduce-fusion-backend: cutedsl
        enable-nvidia-megakernel: true
        startup-weight-load-mode: serial
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  srun_options:
    mem: '0'
    container-remap-root: ''
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
override_tp4_mrr8:
  name: agg-gb300-tp4-mrr8-mtp-hicache
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      env:
        SGLANG_GDN_CHUNK_H_BV: '16'
        SGLANG_GDN_CHUNK_H_NUM_STAGES: '3'
        SGLANG_ENABLE_NV_MEGA_RUNTIME_OPTIMIZATION: '1'
        SGLANG_NVIDIA_MEGAKERNEL_SLOTS: route,mkm,gdn_verify,gdn_pdl,gdn_conv,hop,hop_fp8,hop_mid,draft_loop,draft_extend,draft_moe,draft_q1,draft_xchg,draft_hop,draft_fin,draft_front,draft_skv2,draft_multi,draft_embed,gdn_push,gdn_front,gdn_trt_front,route_shared,skv2,skv2_cp,mka,mka_push,mkm_wide,mkm_m32,mkm_m64,mkm_m128,mkm_m256,mkm_m512,multi_request,lowm_in,lowm_out,lowm_se,lowm_push,draft_q1_cp,draft_skv2_cp,sharded_gumbel
      args:
        tensor-parallel-size: 4
        moe-dense-tp-size: 4
        max-running-requests: 8
        pp-max-micro-batch-size: 8
        cuda-graph-max-bs-decode: 8
        cuda-graph-bs-decode:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
