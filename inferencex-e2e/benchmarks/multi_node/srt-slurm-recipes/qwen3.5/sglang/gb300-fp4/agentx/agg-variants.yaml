        SGLANG_GDN_CHUNK_H_NUM_STAGES: '3'
        SGLANG_Q35MF_MKH_HT_REDUCTION_WARPS: '4'
        SGLANG_Q35MF_MKH_PREP_NOSYNC: '1'
        SGLANG_Q35MF_DRAFT_EXCHANGE_STEP_ROWS: '8'
        SGLANG_Q35MF_EDGE_POST_VERIFY_MAX_BS: '8'
      args:
