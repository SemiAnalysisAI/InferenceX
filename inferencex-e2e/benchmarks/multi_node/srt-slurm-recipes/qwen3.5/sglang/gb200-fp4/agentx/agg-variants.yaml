# AgentX qwen3.5 sglang gb200-fp4 recipes: shared settings in base, one
# override per benchmark configuration. Select one with
# CONFIG_FILE=recipes/qwen3.5/sglang/gb200-fp4/agentx/agg-variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: qwen3.5-fp4
    container: lmsysorg/sglang:nightly-dev-20260818-c0b6474b
    precision: fp4
  identity:
    model: {repo: nvidia/Qwen3.5-397B-A17B-NVFP4-V2}
    container: {image: lmsysorg/sglang:nightly-dev-20260818-c0b6474b}
  slurm: {time_limit: "8:00:00"}
  health_check: {max_attempts: 2160, interval_seconds: 10}
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  services:
    - name: nats
      type: nats
      options:
        max_payload_mb: 8
  dynamo:
    install: true
    source:
      wheel: 1.4.2
    request_plane: tcp
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env: {}
    args:
      router-mode: round-robin
      router-session-affinity-ttl-secs: 3600
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      env:
        PYTHONNOUSERSITE: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        SGLANG_ENABLE_FLASHINFER_GEMM: "true"
        SGLANG_ENABLE_SPEC_V2: "1"
        SGL_ENABLE_JIT_DEEPGEMM: "false"
        TORCH_CUDA_ARCH_LIST: "10.0"
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
        model-path: /model/
        trust-remote-code: true
        data-parallel-size: 1
        enable-symm-mem: false
        quantization: modelopt_fp4
        fp4-gemm-backend: flashinfer_cutlass
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        mamba-track-interval: 1048576
        attention-backend: trtllm_mha
        linear-attn-decode-backend: flashinfer
        moe-runner-backend: flashinfer_trtllm
        speculative-algorithm: NEXTN
        speculative-num-steps: 5
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 6
        cuda-graph-max-bs: 64
        max-running-requests: 80
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        allow-auto-truncate: true
        stream-interval: 50
        scheduler-recv-interval: 10
        mamba-max-states-per-path: 1
        weight-loader-prefetch-checkpoints: true
        weight-loader-prefetch-num-threads: 4
        weight-loader-drop-cache-after-load: false
        model-loader-extra-config: '{"enable_multithread_load":true}'
        enable-metrics: true
        enable-cache-report: true
  sbatch_directives: {mem: "0", cpus-per-task: "144"}
  srun_options: {mem: "0", container-remap-root: ""}
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: "8000"
      IS_MULTINODE: "false"
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_EXTRA_INPUTS: '{"chat_template_kwargs":{"enable_thinking":true},"presence_penalty":0,"temperature":0.6,"top_k":20,"top_p":0.95}'

override_tp4:
  name: qwen35-gb200-dynsg-agentic-mtp-agg-tp4-k5
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        enable-symm-mem: true
        mamba-scheduler-strategy: extra_buffer
        mamba-track-interval: 8192
        mem-fraction-static: 0.80
        max-mamba-cache-size: 360
  benchmark:
    env:
      TP: "4"

override_tp4_parity:
  name: qwen35-gb200-dynsg-agentic-mtp-agg-tp4-k5-parity
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        enable-symm-mem: true
        mamba-scheduler-strategy: extra_buffer_lazy
        linear-attn-prefill-backend: flashinfer
        enable-linear-replayssm-spec: true
        linear-replayssm-cache-len: 8
        mem-fraction-static: 0.80
        max-mamba-cache-size: 360
  benchmark:
    env:
      TP: "4"

override_tp4_no_symm:
  name: qwen35-gb200-dynsg-agentic-mtp-agg-tp4-k5-no-symm
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        mamba-scheduler-strategy: extra_buffer
        mamba-track-interval: 8192
        mem-fraction-static: 0.80
        max-mamba-cache-size: 360
  benchmark:
    env:
      TP: "4"

override_tp2ep2_hicache:
  name: qwen35-gb200-dynsg-agentic-mtp-agg-tp2ep2-hicache-k5
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        pipeline-parallel-size: 1
        expert-parallel-size: 2
        enable-dp-attention: false
        enable-dp-lm-head: false
        mamba-radix-cache-strategy: extra_buffer_lazy
        linear-attn-prefill-backend: flashinfer
        speculative-moe-runner-backend: flashinfer_trtllm
        enable-linear-replayssm-spec: true
        linear-replayssm-cache-len: 8
        mem-fraction-static: 0.88
        # extra_buffer_lazy uses four physical Mamba state slots per running request.
        # This layout is the measured K5 middle frontier through C28.
        max-mamba-cache-size: 320
        page-size: 64
        enable-hierarchical-cache: true
        hicache-ratio: 2.5
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        hicache-write-policy: write_through_selective
        watchdog-timeout: 1000000
  benchmark:
    env:
      TP: "2"

override_tp2ep2_hicache_cap48:
  name: qwen35-gb200-dynsg-agentic-mtp-agg-tp2ep2-hicache-cap48
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        pipeline-parallel-size: 1
        expert-parallel-size: 2
        enable-dp-attention: false
        enable-dp-lm-head: false
        mamba-radix-cache-strategy: extra_buffer_lazy
        linear-attn-prefill-backend: flashinfer
        speculative-moe-runner-backend: flashinfer_trtllm
        speculative-num-steps: 3
        speculative-num-draft-tokens: 4
        enable-linear-replayssm-spec: true
        linear-replayssm-cache-len: 8
        cuda-graph-max-bs: 48
        max-running-requests: 48
        mem-fraction-static: 0.88
        max-mamba-cache-size: 192
        page-size: 64
        enable-hierarchical-cache: true
        hicache-ratio: 2.5
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        hicache-write-policy: write_through_selective
        watchdog-timeout: 1000000
  benchmark:
    env:
      TP: "2"

override_tp2ep2_hicache_k3_baseline:
  name: qwen35-gb200-dynsg-agentic-mtp-agg-tp2ep2-hicache-k3-baseline
  roles:
    agg:
      gpus: 2
      args:
        tensor-parallel-size: 2
        pipeline-parallel-size: 1
        expert-parallel-size: 2
        enable-dp-attention: false
        enable-dp-lm-head: false
        mamba-radix-cache-strategy: extra_buffer_lazy
        linear-attn-prefill-backend: flashinfer
        speculative-moe-runner-backend: flashinfer_trtllm
        speculative-num-steps: 3
        speculative-num-draft-tokens: 4
        enable-linear-replayssm-spec: true
        linear-replayssm-cache-len: 8
        mem-fraction-static: 0.88
        max-mamba-cache-size: 320
        tokenizer-worker-num: 1
        page-size: 64
        enable-hierarchical-cache: true
        hicache-ratio: 2.5
        hicache-io-backend: direct
        hicache-mem-layout: page_first_direct
        hicache-write-policy: write_through_selective
        watchdog-timeout: 1000000
  benchmark:
    env:
      TP: "2"
