schema: 2

base:
  dynamo:
    install: true
    source:
      wheel: 1.6.0.dev20261010
  identity:
    model: {}
    container: {}
    frameworks:
      tensorrt_llm: 1.3.0a0.dev202610210406
      dynamo: 1.6.0.dev20261010
  slurm:
    time_limit: 04:00:00
  health_check:
    max_attempts: 540
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine:
    type: trtllm
    served_model_name: Qwen3.5-397B-A17B-NVFP4-V2
    publish_metrics: true
    numa_cpu_bind: true
    numa_memory_bind: preferred
  environment:
    TRTLLM_SERVER_DISABLE_GC: '1'
  roles:
    prefill:
      nodes: 1
      env:
        TRTLLM_Q35_PROFILE: ctx
        TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
        CUDA_SCALE_LAUNCH_QUEUES: 4x
        ENROOT_ALLOW_DEV: 'yes'
        MIMALLOC_ARENA_RESERVE: '0'
        MIMALLOC_PURGE_DELAY: ''
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        OMP_NUM_THREADS: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TLLM_LOG_LEVEL: INFO
        TLLM_PROFILE_LOG_RANKS: all
        TRTLLM_CTX_SCHED_SRPT: '1'
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
        TRTLLM_MAMBA_INFORWARD_SNAPSHOT: '1'
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_SKIP_KV_CACHE_ESTIMATION: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        UCX_CUDA_COPY_MAX_POLL: inf
        UCX_CUDA_IPC_MAX_POLL: inf
        UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
        DYN_ENGINE_CONV_AFFINITY: "1"
      args:
        attention_dp_config:
          kv_cache_routing_conversation_affinity: true
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_sender_future_timeout_ms: 20
          kv_transfer_timeout_ms: 600000
          transceiver_runtime: PYTHON
        cuda_graph_config:
        disable_overlap_scheduler: false
        enable_chunked_prefill: true
        enable_iter_perf_stats: true
        enable_iter_req_stats: false
        iter_perf_stats_interval: 20
        kv_cache_config:
          block_reuse_config:
            max_num_turns: 3
            policy: per_conversation
          dtype: fp8
          enable_block_reuse: true
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.8
          host_cache_size: 137438953472
          iteration_stats_interval: 20
          mamba_state_config:
            additional_snapshot_offsets_from_end:
              - 2
            periodic_snapshot_interval: 0
          pool_ratio:
            - 0.8
            - 0.2
          tokens_per_block: 64
          use_kv_cache_manager_v2: true
        max_batch_size: 64
        max_seq_len: 262144
        moe_config:
          backend: CUTEDSL
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
        trust_remote_code: true
    decode:
      env:
        TRTLLM_Q35_PROFILE: gen
        TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
        ENROOT_ALLOW_DEV: 'yes'
        MIMALLOC_ARENA_RESERVE: '0'
        MIMALLOC_PURGE_DELAY: ''
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        OMP_NUM_THREADS: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TLLM_LOG_LEVEL: INFO
        TLLM_PROFILE_LOG_RANKS: all
        TRTLLM_DISAGG_GEN_EMIT_FIRST_STEP: '1'
        TRTLLM_DISAGG_GEN_IDLE_POLL_SKIP: '1'
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
        TRTLLM_OVERLAP_LOOP_ON_EXECUTION_STREAM: '1'
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_SPEC_SAMPLER_FUSED_STORE: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        UCX_CUDA_COPY_MAX_POLL: inf
        UCX_CUDA_IPC_MAX_POLL: inf
        UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
        DYN_ENGINE_CONV_AFFINITY: "1"
      args:
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_sender_future_timeout_ms: 20
          kv_transfer_timeout_ms: 600000
          transceiver_runtime: PYTHON
        cuda_graph_config:
          enable_padding: true
        enable_attention_dp: false
        enable_iter_perf_stats: true
        enable_iter_req_stats: false
        iter_perf_stats_interval: 20
        enable_lm_head_tp_in_adp: false
        kv_cache_config:
          avg_seq_len: 102150
          dtype: fp8
          enable_block_reuse: false
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.85
          host_cache_size: 137438953472
          iteration_stats_interval: 20
          tokens_per_block: 64
          use_kv_cache_manager_v2: true
        max_seq_len: 262148
        moe_config:
          use_low_precision_moe_combine: true
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: GUARANTEED_NO_EVICT
        speculative_config:
          decoding_type: MTP
          max_draft_len: 6
        stream_interval: 20
        trust_remote_code: true
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      ETCD_LEASE_TTL: "120"
      DYN_TOKENIZER_CACHE: "1"
      DYN_TOKENIZER_CACHE_BYTES: "8000000000"
      DYN_TOKENIZER: "fastokens"
      DYN_TOKEN_IDS_AS_BYTES: "1"
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: '14400'
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      SERVED_MODEL_NAME: Qwen3.5-397B-A17B-NVFP4-V2
    placement:
      node: last_decode

override_1p1d_tep4_tep16_c8_b1:
  name: disagg-gb300-1p1d-tep4-tep16-c8-b1-mtp-kvoffload
  roles:
    prefill: &tep4_prefill
      workers: 1
      gpus: 4
      env: &tep_prefill_env
        TRTLLM_EMBED_COMPILE_ONCE: '1'
        TRTLLM_PREFILL_BCG: '1'
        # Prefill hops otherwise inherit the decode workers' least-loaded advertisement.
        DYN_ROUTER_MODE: kv
        DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
      args:
        allreduce_strategy: TWOSHOT
        enable_attention_dp: false
        max_num_tokens: 16384
        moe_expert_parallel_size: 4
        speculative_config: &prefill_mtp1
          decoding_type: MTP
          max_draft_len: 1
        tensor_parallel_size: 4
        torch_compile_config: &tep_prefill_compile
          capture_num_tokens:
            - 1
            - 2
            - 4
            - 8
            - 16
            - 32
            - 64
            - 128
            - 256
            - 384
            - 512
            - 768
            - 1024
            - 1536
            - 2048
            - 2560
            - 3072
            - 3584
            - 4096
            - 4608
            - 5120
            - 5632
            - 6144
            - 6656
            - 7168
            - 7680
            - 8192
            - 10240
            - 12288
            - 14336
            - 16384
          enable_fullgraph: true
          enable_piecewise_cuda_graph: true
          enable_userbuffers: false
    decode:
      nodes: 4
      workers: 1
      gpus: 16
      env: &least_loaded_decode_env
        DYN_ROUTER_MODE: least-loaded
      args:
        cuda_graph_config:
          batch_sizes:
            - 1
        max_batch_size: 1
        max_num_tokens: 7
        moe_config: &tep_decode_moe
          backend: TRTLLM
        moe_expert_parallel_size: 8
        moe_tensor_parallel_size: 2
        tensor_parallel_size: 16
  frontend:
    placement:
      node: first_decode

