schema: 2

base:
  identity:
    model: {}
    container: {}
    frameworks:
      tensorrt_llm: 1.4.0rc3.dev202611020007
      dynamo: 1.6.0.dev20261010
  slurm:
    time_limit: 04:00:00
  health_check:
    max_attempts: 540
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
    het_jobs: false
  engine:
    type: trtllm
    served_model_name: Qwen3.5-397B-A17B-NVFP4-V2
    publish_metrics: true
    numa_cpu_bind: true
    numa_memory_bind: preferred
  roles:
    prefill:
      nodes: 1
      gpus: 4
      env:
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_ARENA_RESERVE: '0'
        OMP_NUM_THREADS: '1'
        TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
        MPI_UCX_TLS: rc,ud,sm,self
        MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_2:1
        OMPI_MCA_coll: ^ucc,hcoll
        UCX_CUDA_IPC_MAX_POLL: inf
        UCX_CUDA_COPY_MAX_POLL: inf
        UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
        CUDA_SCALE_LAUNCH_QUEUES: 4x
        TRTLLM_SKIP_KV_CACHE_ESTIMATION: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        MIMALLOC_PURGE_DELAY: ''
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_ROUTER_MODE: kv
        DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
      args:
        allreduce_strategy: TWOSHOT
        attention_dp_config:
          kv_cache_routing_conversation_affinity: true
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_sender_future_timeout_ms: 20
          kv_transfer_timeout_ms: 600000
          transceiver_runtime: PYTHON
        cuda_graph_config:
        disable_mm_encoder: true
        disable_overlap_scheduler: false
        enable_attention_dp: false
        enable_chunked_prefill: true
        enable_iter_perf_stats: true
        enable_iter_req_stats: false
        iter_perf_stats_interval: 40
        kv_cache_config:
          block_reuse_config:
            enable_branch_snapshot: true
            max_num_turns: 3
            policy: per_conversation
          dtype: fp8
          enable_block_reuse: true
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.8
          host_cache_size: 137438953472
          iteration_stats_interval: 40
          mamba_state_config:
            additional_snapshot_offsets_from_end:
            - 2
            periodic_snapshot_interval: 0
          pool_ratio:
          - 0.2
          - 0.8
          tokens_per_block: 64
          use_kv_cache_manager_v2: true
        max_batch_size: 64
        max_num_tokens: 16384
        max_seq_len: 262144
        moe_config:
          backend: CUTEDSL
        moe_expert_parallel_size: 4
        nvfp4_gemm_config:
          allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
        pipeline_parallel_size: 1
        prefill_capture_num_tokens:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 384
        - 512
        - 768
        - 1024
        - 1536
        - 2048
        - 2560
        - 3072
        - 3584
        - 4096
        - 4608
        - 5120
        - 5632
        - 6144
        - 6656
        - 7168
        - 7680
        - 8192
        - 10240
        - 12288
        - 14336
        - 16384
        prefill_cuda_graph_backend: breakable
        print_iter_log: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
          context_scheduling_policy: shortest_uncached_first
        speculative_config:
          decoding_type: MTP
          max_draft_len: 1
        tensor_parallel_size: 4
        trust_remote_code: true
    decode:
      nodes: 4
      workers: 1
      gpus: 8
      env:
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_ARENA_RESERVE: '0'
        OMP_NUM_THREADS: '1'
        TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
        MPI_UCX_TLS: rc,ud,sm,self
        MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_2:1
        OMPI_MCA_coll: ^ucc,hcoll
        UCX_CUDA_IPC_MAX_POLL: inf
        UCX_CUDA_COPY_MAX_POLL: inf
        UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        MIMALLOC_PURGE_DELAY: ''
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_ROUTER_MODE: least-loaded
      args:
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_sender_future_timeout_ms: 20
          kv_transfer_timeout_ms: 600000
          # Explicit: TensorRT-LLM bypasses the GEN transfer window when it defaults the budget.
          max_tokens_in_buffer: 262144
          transceiver_runtime: PYTHON
        cuda_graph_config:
          enable_padding: true
        disable_mm_encoder: true
        enable_attention_dp: false
        enable_iter_perf_stats: true
        enable_iter_req_stats: false
        enable_lm_head_tp_in_adp: false
        iter_perf_stats_interval: 40
        kv_cache_config:
          avg_seq_len: 102150
          dtype: fp8
          enable_block_reuse: false
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.85
          host_cache_size: 137438953472
          iteration_stats_interval: 40
          tokens_per_block: 64
          use_kv_cache_manager_v2: true
        max_seq_len: 262148
        moe_config:
          backend: TRTLLM
          use_low_precision_moe_combine: true
        moe_expert_parallel_size: 4
        moe_tensor_parallel_size: 2
        nvfp4_gemm_config:
          allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        replicate_embedding: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: GUARANTEED_NO_EVICT
        speculative_config:
          decoding_type: MTP
          max_draft_len: 6
        stream_interval: 20
        tensor_parallel_size: 8
        trust_remote_code: true
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      ETCD_LEASE_TTL: '120'
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
      DYN_TOKENIZER: fastokens
      DYN_TOKEN_IDS_AS_BYTES: '1'
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: '14400'
    placement:
      node: first_decode
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      SERVED_MODEL_NAME: Qwen3.5-397B-A17B-NVFP4-V2
    placement:
      node: last_decode
  dynamo:
    install: true
    source:
      wheel: 1.6.0.dev20261010

