schema: 2

base:
  dynamo:
    install: true
    source:
      wheel: 1.4.0.dev20260807

  identity:
    container: {}

  slurm:
    time_limit: 04:00:00

  health_check:
    max_attempts: 540
    interval_seconds: 10

  resources:
    gpu_type: gb300
    gpus_per_node: 4

  engine:
    type: trtllm
    # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
    publish_metrics: false

  roles:
    prefill:
      env:
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
      args:
        cache_transceiver_config:
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 16384
        cuda_graph_config:
        disable_overlap_scheduler: true
        enable_attention_dp: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
        max_num_tokens: 16896
        max_seq_len: 8448
        moe_config:
          backend: CUTEDSL
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        trust_remote_code: true
    decode:
      env:
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
      args:
        cache_transceiver_config:
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 16384
        cuda_graph_config:
          enable_padding: true
        enable_lm_head_tp_in_adp: false
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
        max_seq_len: 9472
        moe_config:
          use_low_precision_moe_combine: true
        num_postprocess_workers: 4
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        stream_interval: 100
        trust_remote_code: true

  frontend:
    type: dynamo
    env:
      ETCD_LEASE_TTL: '120'
      DYN_TOKENIZER: "fastokens"

override_1p2d_tep8_b16_c42:
  name: disagg-gb300-1p2d-dep1-tep8-c42-stp
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 1
      env:
        TRT_LLM_DISABLE_LOAD_WEIGHTS_IN_PARALLEL: '1'
        CTX_LOAD_STAGGER_S: '180'
      args:
        cache_transceiver_config:
          backend: UCX
        kv_cache_config:
          free_gpu_memory_fraction: 0.85
        max_batch_size: 32
        moe_expert_parallel_size: 1
        tensor_parallel_size: 1
    decode:
      nodes: 4
      workers: 2
      gpus: 8
      args:
        cache_transceiver_config:
          backend: UCX
        cuda_graph_config:
          batch_sizes:
            - 1
            - 2
            - 4
            - 8
            - 16
        enable_attention_dp: false
        kv_cache_config:
          free_gpu_memory_fraction: 0.9
        max_batch_size: 16
        max_num_tokens: 16
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 8
        tensor_parallel_size: 8
  frontend:
    enable_multiple_frontends: false

