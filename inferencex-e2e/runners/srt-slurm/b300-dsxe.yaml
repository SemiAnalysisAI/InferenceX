default_account: ${SLURM_ACCOUNT}
default_partition: ${SLURM_PARTITION}
# srtctl otherwise submits with a one-hour limit.
default_time_limit: ${SRT_DEFAULT_TIME_LIMIT}
gpus_per_node: 8
network_interface: ""
srtctl_root: ${SRTCTL_ROOT}
model_paths:
  dsr1: ${MODEL_ROOT}/DeepSeek-R1-0528-NVFP4-v2
  dsr1-fp8: ${MODEL_ROOT}/DeepSeek-R1-0528
  deepseek-v4-pro: ${MODEL_ROOT}/DeepSeek-V4-Pro
  deepseek-ai/DeepSeek-V4-Pro: ${MODEL_ROOT}/DeepSeek-V4-Pro
  glm-5.2-fp4: ${MODEL_ROOT}/GLM-5.2-NVFP4
  glm-5.2-fp8: ${MODEL_ROOT}/GLM-5.2-FP8
  nvidia/GLM-5.2-NVFP4: ${MODEL_ROOT}/GLM-5.2-NVFP4
  zai-org/GLM-5.2-FP8: ${MODEL_ROOT}/GLM-5.2-FP8
  kimi-k3: ${MODEL_ROOT}/Kimi-K3
  kimik3: ${MODEL_ROOT}/Kimi-K3
  moonshotai/Kimi-K3: ${MODEL_ROOT}/Kimi-K3
  minimax-m3-nvfp4: ${MODEL_ROOT}/MiniMax-M3-NVFP4
  nvidia/MiniMax-M3-NVFP4: ${MODEL_ROOT}/MiniMax-M3-NVFP4
  minimax-m3-mxfp8: ${MODEL_ROOT}/MiniMax-M3-MXFP8
  MiniMaxAI/MiniMax-M3-MXFP8: ${MODEL_ROOT}/MiniMax-M3-MXFP8
  qwen3.5-fp4: ${MODEL_ROOT}/Qwen3.5-397B-A17B-NVFP4-V2
  qwen3.5-fp8: ${MODEL_ROOT}/Qwen3.5-397B-A17B-FP8
  nvidia/Qwen3.5-397B-A17B-NVFP4-V2: ${MODEL_ROOT}/Qwen3.5-397B-A17B-NVFP4-V2
containers:
  dynamo-trtllm: ${SQUASH_FILE}
  dynamo-sglang: ${SQUASH_FILE}
  dynamo-vllm: ${SQUASH_FILE}
  "${IMAGE}": ${SQUASH_FILE}
  nginx-sqsh: ${NGINX_SQUASH_FILE}
use_exclusive_sbatch_directive: true
default_sbatch_directives:
  cpus-per-task: '192'
  # gpu-16 retains a foreign 1.63 TB tmpfs allocation; rechecked 2026-09-21.
  exclude: dsxe-sa-b300-prd0-gpu-16
