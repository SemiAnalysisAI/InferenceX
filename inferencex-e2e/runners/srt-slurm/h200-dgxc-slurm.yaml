cluster: h200-dgxc-slurm
default_gpu_exporter:
  container_image: nvcr.io#nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
  port: 9401
  command: "dcgm-exporter --collect-interval=1000 --address :{port} -f /configs/dcgm-counters-noprof-3.3.9.csv"
default_account: ${SLURM_ACCOUNT}
default_partition: ${SLURM_PARTITION}
default_time_limit: ${SRT_DEFAULT_TIME_LIMIT}
gpus_per_node: 8
network_interface: ""
srtctl_root: ${SRTCTL_ROOT}
default_mounts:
  "${AIPERF_MMAP_CACHE_HOST_PATH}": /aiperf_mmap_cache
  "${HF_HUB_CACHE_MOUNT}": /hf_hub_cache
containers:
  dynamo-trtllm: ${SQUASH_FILE}
  dynamo-sglang: ${SQUASH_FILE}
  dynamo-vllm: ${SQUASH_FILE}
  nginx-sqsh: ${NGINX_SQUASH_FILE}
  latest: ${SQUASH_FILE}
  "${CONTAINER_KEY}": ${SQUASH_FILE}
use_gpus_per_node_directive: true
use_segment_sbatch_directive: false
use_exclusive_sbatch_directive: false
