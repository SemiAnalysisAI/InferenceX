prompts:
  drum-taps:
    text: >-
      A single continuous medium shot of a drummer tapping a snare drum three
      times in a quiet rehearsal room. The drumsticks visibly contact the
      drumhead on each tap. The three crisp snare hits and the natural room
      ambience are audible. The camera remains still. No music, speech,
      subtitles, or scene cuts.
    requires_motion: true
    requires_sound: true
    source: feat/wan-serving-runner@77f2080ce:experimental/video-generation/mvp/h3-smoke.plan.json:21
  pouring-water:
    text: >-
      A single continuous close-up of a hand steadily pouring water from a
      clear glass jug into an empty drinking glass on a wooden table. The water
      level visibly rises and the pouring and splashing sounds are clearly
      audible. Daylight, a still camera, no speech, no music, no subtitles, and
      no scene cuts.
    requires_motion: true
    requires_sound: true
    source: feat/wan-serving-runner@77f2080ce:experimental/video-generation/mvp/h3-smoke.plan.json:28
  bicycle-pass:
    text: >-
      A single continuous wide shot of a cyclist riding from the left side of
      the frame to the right along a quiet park path. The moving wheels remain
      visible and the bicycle bell rings once as the cyclist passes the camera.
      Soft outdoor ambience is audible. The camera stays still, with no music,
      speech, subtitles, or scene cuts.
    requires_motion: true
    requires_sound: true
    source: feat/wan-serving-runner@77f2080ce:experimental/video-generation/mvp/h3-smoke.plan.json:35
  footsteps:
    text: >-
      A single continuous low-angle shot of a person in ordinary shoes walking
      across a wooden floor from left to right. Each step visibly lands on the
      floor and the corresponding footsteps are audible in the quiet room. The
      camera stays still. No music, speech, subtitles, or scene cuts.
    requires_motion: true
    requires_sound: true
    source: feat/wan-serving-runner@77f2080ce:experimental/video-generation/mvp/h3-smoke.plan.json:42

