  operators: [gemm, attention_mha, attention_mla]
  pools: [h100-dgxc, h200-dgxc, b200-nscale, b300, gb200, gb300, mi300x, mi325x, mi355x]
  description:
    - Add ROCm GEMM with architecture-correct FP8 and AMD attention with torch/AITER.
    - Correct rectangular causal masking in torch attention; preserve requested output precision.
    - MLA timings cover materialized Q/K/V attention, excluding cache projection and RoPE.
