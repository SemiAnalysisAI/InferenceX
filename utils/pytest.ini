[pytest]
testpaths = .
# The agentic aggregation tests import through the repo-root package path
# (utils.agentic....) because the production modules do; CI runs pytest from
# utils/, so the repo root must be on sys.path in both invocation modes.
pythonpath = ..
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
