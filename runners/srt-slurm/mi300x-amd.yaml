cluster: mi300x-amd
default_partition: compute-0
default_time_limit: "00:30:00"
output_dir: ${SRT_SLURM_SHARED_BASE}/outputs
gpus_per_node: 8
visible_devices_env: ROCR_VISIBLE_DEVICES
default_gpu_exporter: null
network_interface: ''
use_gpus_per_node_directive: true
use_segment_sbatch_directive: false
use_exclusive_sbatch_directive: true
default_sbatch_directives:
  cpus-per-task: "128"
  mem: "0"
default_mounts:
  /dev/kfd: /dev/kfd
  /dev/dri: /dev/dri
  /raid/inferencex/models/hub: /hf_hub_cache/hub
nginx_raise_ulimit: false
