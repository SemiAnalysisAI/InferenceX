# srt-slurm cluster profile for the MI355X AMD Slurm cluster. The login and
# compute nodes share /it-share, so source, output, image, and result paths do
# not need node-local transport.

cluster: mi355x-amds
default_partition: compute
default_time_limit: "01:00:00"
output_dir: /it-share/gharunners2/srt-slurm/outputs

gpus_per_node: 8
visible_devices_env: ROCR_VISIBLE_DEVICES
default_gpu_exporter: null
network_interface: eno0

use_gpus_per_node_directive: false
use_segment_sbatch_directive: false
use_exclusive_sbatch_directive: false

default_sbatch_directives:
  gres: gpu:8
  cpus-per-task: "32"
  mem: "128G"

model_paths:
  DeepSeek-V4-Pro-0813: /it-share/data/DeepSeek-V4-Pro-0813

default_mounts:
  /dev/kfd: /dev/kfd
  /dev/dri: /dev/dri
  # This host directory is already the Hub cache, not HF_HOME.
  /it-share/hf-hub-cache: /hf_hub_cache/hub
  /it-share/hf_home: /it-share/hf_home
  # The launcher appends the exact shared workspace and result roots.


nginx_raise_ulimit: false

# Preserve the existing per-allocation fabric/memory prerequisites through the
# upstream host-setup lifecycle, not a separate staging Slurm job.
default_host_setup:
  # The existing GPU-drain check can take 15 minutes; leave room for fabric
  # checks and host-memory preparation instead of cutting it off at 5 minutes.
  timeout_seconds: 1200
  commands:
    - IBDEVICES=rdma0,rdma1,rdma2,rdma3,rdma4,rdma5,rdma6,rdma7 bash "${GITHUB_WORKSPACE}/runners/prepare_mi355x_srt_host.sh"
  nodes: all
