kimik2.5-fp4-mi355x-vllm-disagg-mpnd:
  # Focused three-point MPND sweep. B200/GB200 wins by keeping 4-GPU
  # prefill/decode workers efficient and only scaling replicas at high
  # concurrency; avoid low-concurrency TP8 decode points that inflate the
  # GPU denominator without filling the workers.
  image: vllm/vllm-openai-rocm:nightly-67fe73b2b47e2927af1e5ec6fb91e16e3b075940
  model: amd/Kimi-K2.5-MXFP4
  model-prefix: kimik2.5
  runner: mi355x-disagg
  precision: fp4
  framework: vllm-disagg
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # conc=512: reproduce the best current MI355X disagg shape on the latest
      # image/patch.  This was near single-node 8k1k TP4 per-GPU throughput in
      # the earlier PR sweep.
      - spec-decoding: "none"
        conc-list: [ 512 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
        decode:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"

      # conc=1024: same efficient 4-GPU worker shape, higher pressure.  This is
      # the most likely point to cross the single-node TP4 per-GPU frontier
      # without introducing a new mode.
      - spec-decoding: "none"
        conc-list: [ 1024 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
        decode:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"

      # conc=3072: MI355X analogue of the NV 8k1k high-concurrency
      # 6P DEP4 -> D DEP16 point.  Use 6 prefill TP4 workers and 4 decode TP4
      # workers so the total is also 40 GPUs while keeping each worker on the
      # efficient TP4 path.
      - spec-decoding: "none"
        conc-list: [ 3072 ]
        prefill:
          num-worker: 6
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=6"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
        decode:
          num-worker: 4
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=4"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
