kimik2.5-fp4-mi355x-vllm-disagg-mpnd:
  # Focused three-point MPND sweep. B200/GB200 wins by keeping 4-GPU
  # prefill/decode workers efficient and only scaling replicas at high
  # concurrency; avoid low-concurrency TP8 decode points that inflate the
  # GPU denominator without filling the workers.
  image: vllm/vllm-openai-rocm:nightly-67fe73b2b47e2927af1e5ec6fb91e16e3b075940
  model: amd/Kimi-K2.5-MXFP4
  model-prefix: kimik2.5
  runner: mi355x-disagg
  precision: fp4
  framework: vllm-disagg
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # conc=512: reproduce the best current MI355X disagg shape on the latest
      # image/patch.  This was near single-node 8k1k TP4 per-GPU throughput in
      # the earlier PR sweep.
      - spec-decoding: "none"
        conc-list: [ 512 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
        decode:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"

      # conc=1024: same efficient 4-GPU worker shape, higher pressure.  This is
      # the most likely point to cross the single-node TP4 per-GPU frontier
      # without introducing a new mode.
      - spec-decoding: "none"
        conc-list: [ 1024 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
        decode:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"

      # conc=1024: add prefill replicas for 8k1k.  This is the MI355X analogue
      # of the B200 high-concurrency move from 1P to multi-P, but keeps each
      # worker at TP4 instead of using inefficient TP8 decode as a DEP substitute.
      - spec-decoding: "none"
        conc-list: [ 1024 ]
        prefill:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=2"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
        decode:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
