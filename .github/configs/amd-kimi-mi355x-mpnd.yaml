kimik2.5-fp4-mi355x-vllm-disagg-mpnd:
  # Focused three-point MPND sweep. B200/GB200 wins by keeping 4-GPU
  # prefill/decode workers efficient and only scaling replicas at high
  # concurrency; avoid low-concurrency TP8 decode points that inflate the
  # GPU denominator without filling the workers.
  image: vllm/vllm-openai-rocm:nightly-67fe73b2b47e2927af1e5ec6fb91e16e3b075940
  model: amd/Kimi-K2.5-MXFP4
  model-prefix: kimik2.5
  runner: mi355x-disagg
  precision: fp4
  framework: vllm-disagg
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # conc=512: DP-attn/EP bring-up at moderate pressure.  Use DP4 workers
      # on both sides while keeping the low-cost 1P2D topology.
      - spec-decoding: "none"
        conc-list: [ 512 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=1"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
        decode:
          num-worker: 2
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=2"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"

      # conc=1024: MI355X analogue of the NV 8k1k
      # 3P DEP4 -> D DEP16 point.  Use 3 prefill DP4 workers and 4 decode DP4
      # workers for the same 28-GPU scale.
      - spec-decoding: "none"
        conc-list: [ 1024 ]
        prefill:
          num-worker: 3
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=3"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
        decode:
          num-worker: 4
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=4"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"

      # conc=3072: MI355X analogue of the NV 8k1k high-concurrency
      # 6P DEP4 -> D DEP16 point.  Use 6 prefill DP4 workers and 4 decode DP4
      # workers so the total is also 40 GPUs.
      - spec-decoding: "none"
        conc-list: [ 3072 ]
        prefill:
          num-worker: 6
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=6"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
        decode:
          num-worker: 4
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=4"
          - "VLLM_MORIIO_CONNECTOR_READ_MODE=1"
          - "VLLM_SERVER_READY_TIMEOUT=3600"
          - "VLLM_ROUTER_READY_TIMEOUT=3600"
