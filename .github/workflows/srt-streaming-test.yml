name: SRT raw streaming test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/srt-streaming-test.yml
      - inferencex-e2e/tests/srt-streaming/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srt-streaming-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SRT_TEST_SHA: d7c46d95f9c941aaf6c3477514fadc2f1a8ba78c

jobs:
  build:
    name: Build pinned Tachometer
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'test/srt-raw-log-streaming')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      queue-token: ${{ steps.queue.outputs.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/srt-slurm
          ref: ${{ env.SRT_TEST_SHA }}
          persist-credentials: false
      - name: Build the PR's atomic Tachometer writer
        run: |
          test "$(git rev-parse HEAD)" = "$SRT_TEST_SHA"
          cargo build --release --locked --bin tachometer-scraper
          install -Dm755 target/release/tachometer-scraper bin/tachometer-scraper
          curl -fsSLO https://github.com/ncabatoff/process-exporter/releases/download/v0.8.7/process-exporter-0.8.7.linux-amd64.tar.gz
          curl -fsSLO https://github.com/ncabatoff/process-exporter/releases/download/v0.8.7/checksums.txt
          grep ' process-exporter-0.8.7.linux-amd64.tar.gz$' checksums.txt | sha256sum --check --strict
          mkdir -p configs
          tar -xzf process-exporter-0.8.7.linux-amd64.tar.gz --strip-components=1 -C configs process-exporter-0.8.7.linux-amd64/process-exporter
          sha256sum bin/tachometer-scraper configs/process-exporter > streaming-binaries.sha256
          printf '%s\n' "$SRT_TEST_SHA" > streaming-source.txt
      - id: queue
        run: echo "token=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srt-streaming-binaries
          path: |
            bin/tachometer-scraper
            configs/process-exporter
            streaming-binaries.sha256
            streaming-source.txt
          if-no-files-found: error
          retention-days: 7

  stream:
    name: Stream on B300
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'srt-streaming-test')
    runs-on: >-
      ${{ fromJSON(vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        format('["self-hosted","cluster:b300-dsxe","nodes:1",{0},{1}]',
          toJSON(format('ci-job-1.000-{0}', needs.build.outputs.queue-token)),
          toJSON(format('ci-attempt-{0}', github.run_attempt))) ||
        '["self-hosted","cluster:b300-dsxe"]') }}
    timeout-minutes: 20
    # Repository secrets are shared with benchmark jobs; the same-repository gate and label opt in.
    env:
      SRT_STATUS_ENDPOINT: ${{ secrets.SRT_STATUS_ENDPOINT }} # zizmor: ignore[secrets-outside-env]
      SRTCTL_STATUS_TOKEN: ${{ secrets.SRTCTL_STATUS_TOKEN }} # zizmor: ignore[secrets-outside-env]
      SRT_ROOT: ${{ github.workspace }}/streaming-srt
      SRT_TEST_OUTPUT: ${{ github.workspace }}/streaming-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/srt-slurm
          ref: ${{ env.SRT_TEST_SHA }}
          path: streaming-srt
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srt-streaming-binaries
          path: streaming-srt
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Stream 90 seconds of logs and real process metrics
        run: bash inferencex-e2e/tests/srt-streaming/run.sh
      - name: Save run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srt-streaming-evidence-${{ github.run_id }}
          path: |
            streaming-output/job-id.txt
            streaming-output/*/logs/*.log
            streaming-output/*/logs/*.out
            streaming-output/*/logs/*.err
            streaming-output/*/logs/tachometer/local
            streaming-srt/streaming-source.txt
            streaming-srt/streaming-binaries.sha256
          if-no-files-found: warn
          retention-days: 7
