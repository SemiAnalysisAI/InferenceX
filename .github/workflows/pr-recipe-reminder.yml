name: PR Recipe Reminder

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
    paths:
      - 'configs/amd-master.yaml'
      - 'configs/nvidia-master.yaml'
      - 'benchmarks/**'
      - 'perf-changelog.yaml'

permissions: {}

concurrency:
  group: recipe-reminder-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  comment:
    name: comment
    permissions:
      pull-requests: write # Publish PR feedback.
    runs-on: ubuntu-latest
    steps:
      - name: Comment recipe reminder
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            // Check if we already left this comment to avoid duplicates
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const marker = '<!-- recipe-reminder -->';
            const alreadyCommented = comments.data.some(c => c.body.includes(marker));
            if (alreadyCommented) {
              core.info('Recipe reminder already posted, skipping.');
              return;
            }

            const body = `${marker}
            Thanks for the contribution!

            - **Review:** If this PR changes files owned by someone other than a repository admin or \`@SemiAnalysisAI/core\`, ask one eligible [CODEOWNER](https://github.com/SemiAnalysisAI/InferenceX/blob/main/.github/CODEOWNERS) to complete the latest [PR_REVIEW_CHECKLIST.md](https://github.com/SemiAnalysisAI/InferenceX/blob/main/docs/PR_REVIEW_CHECKLIST.md) before contacting a core maintainer on Slack. Follow the template exactly, including \`As a PR reviewer and CODEOWNER, I have reviewed this and have\`, so sign-off verification triggers.
            - **PR verification:** Sweeps only run on labeled PRs. Add \`full-sweep-fail-fast\` (strongly recommended); use \`full-sweep-enabled\` only when matrix jobs should continue after a failure.
            - **After merging:** PR authors must ensure all GitHub Actions jobs pass. Transient failures often pass on rerun; see [how to rerun failed jobs](https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs#re-running-failed-jobs-in-a-workflow).

            <details>
            <summary>中文</summary>

            感谢你的贡献！

            - **审阅：**如果 PR 修改的文件归属于仓库管理员及 \`@SemiAnalysisAI/core\` 之外的 CODEOWNER，请先联系一位有资格的 [CODEOWNER](https://github.com/SemiAnalysisAI/InferenceX/blob/main/.github/CODEOWNERS) 填写最新的 [PR_REVIEW_CHECKLIST.md](https://github.com/SemiAnalysisAI/InferenceX/blob/main/docs/PR_REVIEW_CHECKLIST.md)，再通过 Slack 联系核心维护者。必须严格遵循模板，并保留 \`As a PR reviewer and CODEOWNER, I have reviewed this and have\`，才能触发签核验证。
            - **PR 验证：**扫描仅在带有标签的 PR 上运行。强烈建议添加 \`full-sweep-fail-fast\`；仅当需要矩阵任务在失败后继续运行时才使用 \`full-sweep-enabled\`。
            - **合并后：**PR 作者必须确保所有 GitHub Actions 任务通过。临时性失败通常可以通过重新运行恢复；参见[重新运行失败任务的说明](https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs#re-running-failed-jobs-in-a-workflow)。

            </details>`.replace(/^            /gm, '');

            await github.rest.issues.createComment({ owner, repo, issue_number, body });
