name: CODEOWNER Sign-off Verify

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number
        required: true
        type: number
      comment_url:
        description: >-
          URL of the sign-off comment/review to verify, e.g.
          https://github.com/OWNER/REPO/pull/123#issuecomment-456 (also accepts
          #pullrequestreview-<id> and #discussion_r<id> review URLs).
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Check sign-off
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body || '', 'As a PR reviewer and CODEOWNER')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body || '', 'As a PR reviewer and CODEOWNER')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body || '', 'As a PR reviewer and CODEOWNER'))
    runs-on: ubuntu-latest
    concurrency:
      group: codeowner-signoff-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # Publish PR feedback.
      issues: write # Update the verdict comment.
      actions: read # Read workflow runs and artifacts.
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check changed-file ownership
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --extra workflows python -m infx.workflows.signoff_scope

      - name: Resolve PR state and sign-off metadata
        id: resolve
        if: steps.scope.outputs.required == 'true'
        env:
          SCOPED_HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFull = `${owner}/${repo}`;
            const eventName = context.eventName;
            let prNumber, author, refId, kind, fetchCmd;
            if (eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
              author = context.payload.comment.user.login;
              refId = context.payload.comment.id;
              kind = 'conversation comment';
              fetchCmd = `gh api repos/${repoFull}/issues/comments/${refId} --jq .body`;
            } else if (eventName === 'pull_request_review') {
              prNumber = context.payload.pull_request.number;
              author = context.payload.review.user.login;
              refId = context.payload.review.id;
              kind = 'review summary';
              fetchCmd = `gh api repos/${repoFull}/pulls/${prNumber}/reviews/${refId} --jq .body`;
            } else if (eventName === 'pull_request_review_comment') {
              prNumber = context.payload.pull_request.number;
              author = context.payload.comment.user.login;
              refId = context.payload.comment.id;
              kind = 'inline review comment';
              fetchCmd = `gh api repos/${repoFull}/pulls/comments/${refId} --jq .body`;
            } else if (eventName === 'workflow_dispatch') {
              // Parse a sign-off URL like
              //   https://github.com/OWNER/REPO/pull/123#issuecomment-456
              //   .../pull/123#pullrequestreview-456
              //   .../pull/123#discussion_r456
              const url = (context.payload.inputs && context.payload.inputs.comment_url) || '';
              const prMatch = url.match(/\/pull\/(\d+)/);
              if (!prMatch) {
                core.setOutput('proceed', 'false');
                core.setFailed(`comment_url must contain /pull/<number>: ${url}`);
                return;
              }
              prNumber = parseInt(prMatch[1], 10);
              let m;
              if ((m = url.match(/#issuecomment-(\d+)/))) {
                refId = m[1];
                kind = 'conversation comment';
                fetchCmd = `gh api repos/${repoFull}/issues/comments/${refId} --jq .body`;
                const c = await github.rest.issues.getComment({ owner, repo, comment_id: parseInt(refId, 10) });
                author = c.data.user.login;
              } else if ((m = url.match(/#pullrequestreview-(\d+)/))) {
                refId = m[1];
                kind = 'review summary';
                fetchCmd = `gh api repos/${repoFull}/pulls/${prNumber}/reviews/${refId} --jq .body`;
                const r = await github.rest.pulls.getReview({ owner, repo, pull_number: prNumber, review_id: parseInt(refId, 10) });
                author = r.data.user.login;
              } else if ((m = url.match(/#discussion_r(\d+)/))) {
                refId = m[1];
                kind = 'inline review comment';
                fetchCmd = `gh api repos/${repoFull}/pulls/comments/${refId} --jq .body`;
                const rc = await github.rest.pulls.getReviewComment({ owner, repo, comment_id: parseInt(refId, 10) });
                author = rc.data.user.login;
              } else {
                core.setOutput('proceed', 'false');
                core.setFailed(`comment_url must end with #issuecomment-<id>, #pullrequestreview-<id>, or #discussion_r<id>: ${url}`);
                return;
              }
            } else {
              core.setOutput('proceed', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            if (pr.head.sha !== process.env.SCOPED_HEAD_SHA) {
              core.setFailed('PR head changed while determining sign-off scope; retry on the current head.');
              return;
            }

            if (eventName !== 'workflow_dispatch' && (pr.state !== 'open' || pr.draft)) {
              core.info(`PR #${prNumber} is not ready; skipping.`);
              return;
            }
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: context.actor,
            });
            if (!['admin', 'write'].includes(permission?.permission) ||
                !['admin', 'maintain', 'write'].includes(permission?.role_name) ||
                context.actor.endsWith('[bot]') || context.payload.sender?.type === 'Bot') {
              core.info(`Actor ${context.actor} cannot request verification.`);
              return;
            }

            core.setOutput('proceed', 'true');
            core.setOutput('pr-number', String(prNumber));
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('signoff-author', author);
            core.setOutput('signoff-kind', kind);
            core.setOutput('signoff-fetch-cmd', fetchCmd);

      - name: Render verifier prompt
        if: steps.resolve.outputs.proceed == 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.scope.outputs.pr-number }}
          HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
          SIGNOFF_AUTHOR: ${{ steps.resolve.outputs.signoff-author }}
          SIGNOFF_KIND: ${{ steps.resolve.outputs.signoff-kind }}
          SIGNOFF_FETCH_CMD: ${{ steps.resolve.outputs.signoff-fetch-cmd }}
        run: |
          # These placeholders must remain literal for envsubst.
          # shellcheck disable=SC2016
          envsubst '${REPO} ${PR_NUMBER} ${HEAD_SHA} ${SIGNOFF_AUTHOR} ${SIGNOFF_KIND} ${SIGNOFF_FETCH_CMD}' \
            < .github/codeowner-signoff-verify-prompt.md \
            > /tmp/codeowner-signoff-verify-prompt.md
          grep -q "PR #${PR_NUMBER}" /tmp/codeowner-signoff-verify-prompt.md
          wc -c /tmp/codeowner-signoff-verify-prompt.md

      - name: Verify sign-off with Claude
        id: claude
        if: steps.resolve.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@0d0e0876d3eaa933f45dc692f7a4312c83caf36f # v1.0.218
        env:
          # Repository verifier credential; trusted code checks writer authorization before this step.
          GH_TOKEN: ${{ secrets.CLAUDE_PAT }} # zizmor: ignore[secrets-outside-env]
          # Repository verifier credential; trusted code checks writer authorization before this step.
          GITHUB_TOKEN: ${{ secrets.CLAUDE_PAT }} # zizmor: ignore[secrets-outside-env]
          INFERENCEMAX_ROOT: ${{ github.workspace }}
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          # Repository verifier credential; trusted code checks writer authorization before this step.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # zizmor: ignore[secrets-outside-env]
          # Repository verifier credential; trusted code checks writer authorization before this step.
          github_token: ${{ secrets.CLAUDE_PAT }} # zizmor: ignore[secrets-outside-env]
          track_progress: false
          allowed_bots: ''
          additional_permissions: |
            actions: read
          settings: |
            {"fastMode": true}

          claude_args: |
            --model 'claude-fable-5-1'
            --mcp-config .github/mcp-ci.json '{"mcpServers": {"fetch": {"command": "npx", "args": ["-y", "@anthropic-ai/mcp-server-fetch@latest"]}}}'
            --allowedTools "Read,Write,Glob,Grep,WebFetch,mcp__github__*,mcp__github_ci__*,mcp__fetch__*,mcp__inferencemax-repos__*,Bash"
          prompt: |
            Read the file /tmp/codeowner-signoff-verify-prompt.md and follow the
            instructions in it exactly — it is your complete task specification,
            already rendered with this run's PR number, head SHA, and sign-off
            metadata.

      - name: Update verdict comment
        if: always() && steps.resolve.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
          PR_NUMBER: ${{ steps.scope.outputs.pr-number }}
          VERIFICATION_SUCCEEDED: ${{ steps.claude.outcome == 'success' }}
        with:
          script: |
            const { publish } = require('./.github/scripts/codeowner-signoff.cjs');
            await publish({
              github, context, core,
              prNumber: Number(process.env.PR_NUMBER),
              headSha: process.env.HEAD_SHA,
              verdictPath: '/tmp/codeowner-signoff-verdict.md',
              verificationSucceeded: process.env.VERIFICATION_SUCCEEDED === 'true',
            });
