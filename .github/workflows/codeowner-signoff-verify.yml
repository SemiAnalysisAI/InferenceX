name: CODEOWNER Sign-off Verify

on:
  # Fork sign-off needs a trusted status writer; only default-branch code executes and verifier authorization is checked.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number
        required: true
        type: number
      comment_url:
        description: >-
          URL of the sign-off comment/review to verify, e.g.
          https://github.com/OWNER/REPO/pull/123#issuecomment-456 (also accepts
          #pullrequestreview-<id> and #discussion_r<id> review URLs).
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Check sign-off
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       ((github.event.action != 'deleted' && contains(github.event.comment.body || '', 'As a PR reviewer and CODEOWNER')) ||
        (github.event.action == 'deleted' && startsWith(github.event.comment.body || '', '<!-- codeowner-signoff-verify')))) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body || '', 'As a PR reviewer and CODEOWNER')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body || '', 'As a PR reviewer and CODEOWNER'))
    runs-on: ubuntu-latest
    concurrency:
      group: codeowner-signoff-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # Publish PR feedback.
      issues: write # Update comments, labels, and reactions.
      actions: read # Read workflow runs and artifacts.
      statuses: write # Publish the CODEOWNER status.
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check changed-file ownership
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --exclude-newer PT12H --python 3.12 --with codeowners python -m infx.workflows.signoff_scope

      - name: Resolve PR state and sign-off metadata
        id: resolve
        if: steps.scope.outputs.required == 'true'
        env:
          SCOPED_HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFull = `${owner}/${repo}`;
            const eventName = context.eventName;
            const permissions = new Map();
            async function canRequestVerification(username) {
              if (!permissions.has(username)) {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
                permissions.set(username, ['admin', 'write'].includes(data?.permission) &&
                  ['admin', 'maintain', 'write'].includes(data?.role_name));
              }
              return permissions.get(username);
            }

            let prNumber, author, refId, kind, fetchCmd;
            if (eventName === 'pull_request_target') {
              prNumber = context.payload.pull_request.number;
            } else if (eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
              author = context.payload.comment.user.login;
              refId = context.payload.comment.id;
              kind = 'conversation comment';
              fetchCmd = `gh api repos/${repoFull}/issues/comments/${refId} --jq .body`;
            } else if (eventName === 'pull_request_review') {
              prNumber = context.payload.pull_request.number;
              author = context.payload.review.user.login;
              refId = context.payload.review.id;
              kind = 'review summary';
              fetchCmd = `gh api repos/${repoFull}/pulls/${prNumber}/reviews/${refId} --jq .body`;
            } else if (eventName === 'pull_request_review_comment') {
              prNumber = context.payload.pull_request.number;
              author = context.payload.comment.user.login;
              refId = context.payload.comment.id;
              kind = 'inline review comment';
              fetchCmd = `gh api repos/${repoFull}/pulls/comments/${refId} --jq .body`;
            } else if (eventName === 'workflow_dispatch') {
              // Parse a sign-off URL like
              //   https://github.com/OWNER/REPO/pull/123#issuecomment-456
              //   .../pull/123#pullrequestreview-456
              //   .../pull/123#discussion_r456
              const url = (context.payload.inputs && context.payload.inputs.comment_url) || '';
              const prMatch = url.match(/\/pull\/(\d+)/);
              if (!prMatch) {
                core.setOutput('proceed', 'false');
                core.setFailed(`comment_url must contain /pull/<number>: ${url}`);
                return;
              }
              prNumber = parseInt(prMatch[1], 10);
              let m;
              if ((m = url.match(/#issuecomment-(\d+)/))) {
                refId = m[1];
                kind = 'conversation comment';
                fetchCmd = `gh api repos/${repoFull}/issues/comments/${refId} --jq .body`;
                const c = await github.rest.issues.getComment({ owner, repo, comment_id: parseInt(refId, 10) });
                author = c.data.user.login;
              } else if ((m = url.match(/#pullrequestreview-(\d+)/))) {
                refId = m[1];
                kind = 'review summary';
                fetchCmd = `gh api repos/${repoFull}/pulls/${prNumber}/reviews/${refId} --jq .body`;
                const r = await github.rest.pulls.getReview({ owner, repo, pull_number: prNumber, review_id: parseInt(refId, 10) });
                author = r.data.user.login;
              } else if ((m = url.match(/#discussion_r(\d+)/))) {
                refId = m[1];
                kind = 'inline review comment';
                fetchCmd = `gh api repos/${repoFull}/pulls/comments/${refId} --jq .body`;
                const rc = await github.rest.pulls.getReviewComment({ owner, repo, comment_id: parseInt(refId, 10) });
                author = rc.data.user.login;
              } else {
                core.setOutput('proceed', 'false');
                core.setFailed(`comment_url must end with #issuecomment-<id>, #pullrequestreview-<id>, or #discussion_r<id>: ${url}`);
                return;
              }
            } else {
              core.setOutput('proceed', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            if (pr.head.sha !== process.env.SCOPED_HEAD_SHA) {
              core.setFailed('PR head changed while determining sign-off scope; retry on the current head.');
              return;
            }

            // Event-triggered: only act on open, non-draft ("ready") PRs.
            // Manual dispatch is an explicit override, so allow any PR state.
            const ready = eventName === 'workflow_dispatch'
              ? true
              : (pr.state === 'open' && pr.draft === false);
            if (!ready) {
              core.info(`PR #${prNumber} is not ready (state=${pr.state}, draft=${pr.draft}); skipping.`);
              if (eventName === 'pull_request_target') {
                core.setOutput('proceed', 'false');
                return;
              }
            }

            if (ready) {
              if (!await canRequestVerification(context.actor) ||
                  context.actor.endsWith('[bot]') || context.payload.sender?.type === 'Bot') {
                core.info(`Actor ${context.actor} cannot request verification.`);
                core.setOutput('proceed', 'false');
                return;
              }
            }

            if (eventName === 'pull_request_target') {
              const [comments, reviews, inlineComments] = await Promise.all([
                github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 }),
                github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 }),
                github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number: prNumber, per_page: 100 }),
              ]);
              const candidate = (item, kind, path) => ({
                ...item, kind, fetchCmd: `gh api repos/${repoFull}/${path}/${item.id} --jq .body`,
              });
              const candidates = [
                ...comments.map(item => candidate(item, 'conversation comment', 'issues/comments')),
                ...reviews.map(item => candidate(item, 'review summary', `pulls/${prNumber}/reviews`)),
                ...inlineComments.map(item => candidate(item, 'inline review comment', 'pulls/comments')),
              ].filter(item => item.user?.type === 'User' && item.state !== 'DISMISSED' && item.state !== 'PENDING' &&
                  item.body?.includes('As a PR reviewer and CODEOWNER') &&
                  !item.body.includes('<!-- codeowner-signoff-verify'))
                .sort((a, b) => Date.parse(b.updated_at || b.submitted_at || b.created_at) -
                                Date.parse(a.updated_at || a.submitted_at || a.created_at));
              let signoff;
              for (const item of candidates) {
                if (await canRequestVerification(item.user.login)) {
                  signoff = item;
                  break;
                }
              }
              if (!signoff) {
                core.setOutput('proceed', 'false');
                return;
              }
              author = signoff.user.login;
              kind = signoff.kind;
              fetchCmd = signoff.fetchCmd;
            }

            core.setOutput('proceed', ready ? 'true' : 'false');
            core.setOutput('pr-number', String(prNumber));
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('signoff-author', author);
            core.setOutput('signoff-kind', kind);
            core.setOutput('signoff-fetch-cmd', fetchCmd);

      - name: Carry the PR's passing checklist onto its latest head
        if: >-
          steps.scope.outputs.required == 'true' &&
          (github.event_name == 'pull_request_target' ||
          (github.event_name == 'issue_comment' && github.event.action == 'deleted' &&
           github.event.issue.pull_request &&
           (github.event.comment.user.login == 'Klaud-Cold' ||
            github.event.comment.user.login == 'github-actions[bot]') &&
           startsWith(github.event.comment.body || '', '<!-- codeowner-signoff-verify')))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.scope.outputs.pr-number }}
        with:
          script: |
            const { carry } = require('./.github/scripts/codeowner-signoff.cjs');
            await carry({ github, context, core, prNumber: Number(process.env.PR_NUMBER) });

      - name: Reuse an existing passing checklist
        id: prepare
        if: steps.resolve.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.scope.outputs.pr-number }}
          HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
        with:
          script: |
            const { prepare } = require('./.github/scripts/codeowner-signoff.cjs');
            await prepare({ github, context, core, prNumber: Number(process.env.PR_NUMBER), headSha: process.env.HEAD_SHA });

      # The verifier prompt lives in .github/codeowner-signoff-verify-prompt.md:
      # GitHub caps any ${{ }}-bearing workflow scalar at 21000 characters and
      # the prompt outgrew that, so it is rendered here (envsubst on the
      # template from the TRUSTED default-branch checkout — same trust level
      # as this workflow file; never PR head content) and handed to the action
      # as a file the tiny static prompt below points at.
      - name: Render verifier prompt
        if: steps.prepare.outputs.verify == 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.scope.outputs.pr-number }}
          HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
          SIGNOFF_AUTHOR: ${{ steps.resolve.outputs.signoff-author }}
          SIGNOFF_KIND: ${{ steps.resolve.outputs.signoff-kind }}
          SIGNOFF_FETCH_CMD: ${{ steps.resolve.outputs.signoff-fetch-cmd }}
        run: |
          # These placeholders must remain literal for envsubst.
          # shellcheck disable=SC2016
          envsubst '${REPO} ${PR_NUMBER} ${HEAD_SHA} ${SIGNOFF_AUTHOR} ${SIGNOFF_KIND} ${SIGNOFF_FETCH_CMD}' \
            < .github/codeowner-signoff-verify-prompt.md \
            > /tmp/codeowner-signoff-verify-prompt.md
          grep -q "PR #${PR_NUMBER}" /tmp/codeowner-signoff-verify-prompt.md
          wc -c /tmp/codeowner-signoff-verify-prompt.md

      - name: Verify sign-off with Claude
        id: claude
        if: steps.prepare.outputs.verify == 'true'
        uses: anthropics/claude-code-action@0d0e0876d3eaa933f45dc692f7a4312c83caf36f # v1.0.218
        env:
          # Repository verifier credential; trusted code checks writer authorization before this step.
          GH_TOKEN: ${{ secrets.CLAUDE_PAT }} # zizmor: ignore[secrets-outside-env]
          # Repository verifier credential; trusted code checks writer authorization before this step.
          GITHUB_TOKEN: ${{ secrets.CLAUDE_PAT }} # zizmor: ignore[secrets-outside-env]
          INFERENCEMAX_ROOT: ${{ github.workspace }}
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          # Repository verifier credential; trusted code checks writer authorization before this step.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # zizmor: ignore[secrets-outside-env]
          # Repository verifier credential; trusted code checks writer authorization before this step.
          github_token: ${{ secrets.CLAUDE_PAT }} # zizmor: ignore[secrets-outside-env]
          track_progress: false
          allowed_bots: ''
          additional_permissions: |
            actions: read
          settings: |
            {"fastMode": true}

          claude_args: |
            --model 'claude-fable-5-1'
            --mcp-config .github/mcp-ci.json '{"mcpServers": {"fetch": {"command": "npx", "args": ["-y", "@anthropic-ai/mcp-server-fetch@latest"]}}}'
            --allowedTools "Read,Write,Glob,Grep,WebFetch,mcp__github__*,mcp__github_ci__*,mcp__fetch__*,mcp__inferencemax-repos__*,Bash"
          prompt: |
            Read the file /tmp/codeowner-signoff-verify-prompt.md and follow the
            instructions in it exactly — it is your complete task specification,
            already rendered with this run's PR number, head SHA, and sign-off
            metadata.

      - name: Update verdict comment and PR status
        if: always() && steps.prepare.outputs.verify == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
          PR_NUMBER: ${{ steps.scope.outputs.pr-number }}
          VERIFICATION_SUCCEEDED: ${{ steps.claude.outcome == 'success' }}
        with:
          script: |
            const { publish } = require('./.github/scripts/codeowner-signoff.cjs');
            await publish({
              github, context, core,
              prNumber: Number(process.env.PR_NUMBER),
              headSha: process.env.HEAD_SHA,
              verdictPath: '/tmp/codeowner-signoff-verdict.md',
              verificationSucceeded: process.env.VERIFICATION_SUCCEEDED === 'true',
            });
