name: CODEOWNER Sign-off Verify

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] runs trusted default-branch code; signoff_resolve checks eligibility before the read-only agent; only the reaction and publish jobs write
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number
        required: true
        type: number
      comment_url:
        description: >-
          URL of the sign-off comment/review to verify, e.g.
          https://github.com/OWNER/REPO/pull/123#issuecomment-456 (also accepts
          #pullrequestreview-<id> and #discussion_r<id> review URLs).
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve sign-off
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body || '', 'As a PR reviewer and CODEOWNER')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body || '', 'As a PR reviewer and CODEOWNER')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body || '', 'As a PR reviewer and CODEOWNER'))
    runs-on: ubuntu-latest
    concurrency:
      group: codeowner-signoff-resolve-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read # Read PR metadata and review comments.
      issues: read # Read PR conversation comments.
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      pr-number: ${{ steps.scope.outputs.pr-number }}
      head-sha: ${{ steps.scope.outputs.head-sha }}
      signoff-key: ${{ steps.resolve.outputs.signoff-key }}
      signoff-author: ${{ steps.resolve.outputs.signoff-author }}
      signoff-kind: ${{ steps.resolve.outputs.signoff-kind }}
      signoff-fetch-cmd: ${{ steps.resolve.outputs.signoff-fetch-cmd }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select Python project
        run: |
          python_project="$GITHUB_WORKSPACE"
          if [[ -f "$python_project/inferencex-e2e/pyproject.toml" ]]; then
            python_project="$python_project/inferencex-e2e"
          fi
          test -f "$python_project/pyproject.toml"
          echo "INFERENCEX_PYTHON_PROJECT=$python_project" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            inferencex-e2e/pyproject.toml
            inferencex-e2e/uv.lock

      - name: Check changed-file ownership
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked --extra workflows python -m infx.workflows.signoff_scope

      - name: Resolve PR state and sign-off metadata
        id: resolve
        if: steps.scope.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPED_HEAD_SHA: ${{ steps.scope.outputs.head-sha }}
        run: uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked --extra workflows python -m infx.workflows.signoff_resolve

  acknowledge:
    name: Mark sign-off in progress
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: codeowner-signoff-progress-${{ needs.resolve.outputs.signoff-key }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # React to inline review comments.
      issues: write # React to PR conversation comments.
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select Python project
        run: |
          python_project="$GITHUB_WORKSPACE"
          if [[ -f "$python_project/inferencex-e2e/pyproject.toml" ]]; then
            python_project="$python_project/inferencex-e2e"
          fi
          test -f "$python_project/pyproject.toml"
          echo "INFERENCEX_PYTHON_PROJECT=$python_project" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            inferencex-e2e/pyproject.toml
            inferencex-e2e/uv.lock

      - name: Add in-progress reaction
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNOFF_KEY: ${{ needs.resolve.outputs.signoff-key }}
        run: uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked --extra workflows python -m infx.workflows.signoff_progress start

  verify:
    name: Check sign-off
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: codeowner-signoff-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read # Read PR metadata, diff, and review comments.
      issues: read # Read PR conversation comments.
      actions: read # Read workflow runs and artifacts.
      checks: read # Read check-runs on PR commits.
    outputs:
      verification-succeeded: ${{ steps.outcome.outputs.succeeded }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select Python project
        run: |
          python_project="$GITHUB_WORKSPACE"
          if [[ -f "$python_project/inferencex-e2e/pyproject.toml" ]]; then
            python_project="$python_project/inferencex-e2e"
          fi
          test -f "$python_project/pyproject.toml"
          echo "INFERENCEX_PYTHON_PROJECT=$python_project" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            inferencex-e2e/pyproject.toml
            inferencex-e2e/uv.lock

      - name: Render verifier prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          SIGNOFF_AUTHOR: ${{ needs.resolve.outputs.signoff-author }}
          SIGNOFF_KIND: ${{ needs.resolve.outputs.signoff-kind }}
          SIGNOFF_FETCH_CMD: ${{ needs.resolve.outputs.signoff-fetch-cmd }}
        run: |
          # shellcheck disable=SC2016
          envsubst '${REPO} ${PR_NUMBER} ${HEAD_SHA} ${SIGNOFF_AUTHOR} ${SIGNOFF_KIND} ${SIGNOFF_FETCH_CMD}' \
            < .github/codeowner-signoff-verify-prompt.md \
            > /tmp/codeowner-signoff-verify-prompt.md
          grep -q "PR #${PR_NUMBER}" /tmp/codeowner-signoff-verify-prompt.md
          wc -c /tmp/codeowner-signoff-verify-prompt.md

      # Trusted default-branch code reads PR commits only as git data; no PR code runs.
      - name: Collect deterministic facts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git cat-file -e "${HEAD_SHA}^{commit}" || git fetch --no-tags origin "${HEAD_SHA}"
          uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked python -m infx.workflows.signoff_facts report \
            --repo "$REPO" --pr "$PR_NUMBER" --sha "$HEAD_SHA" \
            --base-ref "origin/${DEFAULT_BRANCH}" --out /tmp/signoff-facts.json

      - name: Install Claude Code 2.1.282
        id: claude_cli
        run: | # zizmor: ignore[adhoc-packages] Claude CLI and its native packages are pinned to 2.1.282
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code@2.1.282
          claude_cli="$RUNNER_TEMP/claude-code/node_modules/.bin/claude"
          test "$("$claude_cli" --version)" = "2.1.282 (Claude Code)"
          echo "path=$claude_cli" >> "$GITHUB_OUTPUT"
      - name: Verify sign-off with Claude
        id: claude
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # zizmor: ignore[secrets-outside-env]
          github_token: ${{ github.token }}
          path_to_claude_code_executable: ${{ steps.claude_cli.outputs.path }}
          track_progress: false
          allowed_bots: ''
          additional_permissions: |
            actions: read
          settings: |
            {"fastMode": true}

          claude_args: |
            --model 'claude-opus-5-5'
            --allowedTools "Read,Write,Glob,Grep,WebFetch,mcp__github_ci__*,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh run download:*),Bash(git log:*),Bash(git show:*),Bash(docker manifest inspect:*),Bash(uv run --project inferencex-e2e --locked python -m infx.workflows.pareto_coverage:*),Bash(uv run --project inferencex-e2e --locked python -m infx.workflows.signoff_facts:*),Bash(uv run --project inferencex-e2e --locked python -m infx.workflows.signoff_validate:*)"
            --disallowedTools "Read(//proc/**),Write(//proc/**)"
          prompt: |
            Read the file /tmp/codeowner-signoff-verify-prompt.md and follow the
            instructions in it exactly — it is your complete task specification,
            already rendered with this run's PR number, head SHA, and sign-off
            metadata.

      - name: Record verification outcome
        id: outcome
        if: always()
        env:
          CLAUDE_SUCCEEDED: ${{ steps.claude.outcome == 'success' }}
          VERDICT_PATH: /tmp/codeowner-signoff-verdict.md
        run: |
          succeeded=false
          if [[ "$CLAUDE_SUCCEEDED" == true && -f "$VERDICT_PATH" ]]; then
            succeeded=true
          fi
          echo "succeeded=$succeeded" >> "$GITHUB_OUTPUT"

      - name: Upload verdict
        if: always() && steps.outcome.outputs.succeeded == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeowner-signoff-verdict
          path: /tmp/codeowner-signoff-verdict.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish sign-off verdict
    needs: [resolve, acknowledge, verify]
    if: always() && needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: codeowner-signoff-publish-pr-${{ needs.resolve.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # Publish PR feedback.
      issues: write # Post a new verdict comment.
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select Python project
        run: |
          python_project="$GITHUB_WORKSPACE"
          if [[ -f "$python_project/inferencex-e2e/pyproject.toml" ]]; then
            python_project="$python_project/inferencex-e2e"
          fi
          test -f "$python_project/pyproject.toml"
          echo "INFERENCEX_PYTHON_PROJECT=$python_project" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            inferencex-e2e/pyproject.toml
            inferencex-e2e/uv.lock

      - name: Download verdict
        if: needs.verify.outputs.verification-succeeded == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeowner-signoff-verdict
          path: /tmp

      - name: Post verdict comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
          SIGNOFF_KEY: ${{ needs.resolve.outputs.signoff-key }}
          VERIFICATION_SUCCEEDED: ${{ needs.verify.outputs.verification-succeeded == 'true' }}
          VERDICT_PATH: /tmp/codeowner-signoff-verdict.md
        run: uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked --extra workflows python -m infx.workflows.signoff_publish

      - name: Clear in-progress reaction
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNOFF_KEY: ${{ needs.resolve.outputs.signoff-key }}
        run: uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked --extra workflows python -m infx.workflows.signoff_progress finish
