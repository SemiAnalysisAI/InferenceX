name: K3 Single-Node Loading Diagnostic
run-name: K3 native D loading on one MI355X node

# Dedicated diagnostic branch only; no performance results are produced or ingested.
on: # zizmor: ignore[concurrency-limits] Independent diagnostics queue normally.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/inferencex-e2e

jobs:
  setup:
    name: Score normal-priority diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: score
        run: |
          entry='[{"runner":"mi355x-amds","framework":"vllm","model-prefix":"kimik3","precision":"fp4","spec-decoding":"mtp","node-count":1}]'
          scored=$(printf '%s' "$entry" | uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml python -m infx.workflows.ci_priority --queue-namespace "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}")
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"

  load-probe:
    needs: setup
    runs-on: >- # zizmor: ignore[self-hosted-runner] Maintainer workflow_dispatch-only GPU diagnostic.
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        format('["self-hosted","mi355x-amds","nodes:1",{0},{1}]',
          toJSON(format('ci-job-{0}-{1}', needs.setup.outputs.priority, needs.setup.outputs.queue-token)),
          toJSON(format('ci-attempt-{0}', github.run_attempt))) ||
        '["self-hosted","mi355x-amds","nodes:1"]'
      ) }}
    timeout-minutes: 45
    name: "One-node TP8 D128 loading diagnostic"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run one bounded Slurm allocation
        run: |
          cd inferencex-e2e/benchmarks/diagnostics/k3-load
          test ! -e submission.txt
          job=$(sbatch --parsable --job-name="k3-load-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output="$PWD/slurm-%j.out" --error="$PWD/slurm-%j.err" job.sbatch)
          job=${job%%;*}
          [[ "$job" =~ ^[0-9]+$ ]]
          printf '%s\n' "$job" > submission.txt
          trap 'scancel "$job" || true' TERM INT
          while [[ -n "$(squeue -h -j "$job" -o '%i')" ]]; do
            sleep 10
          done
          test -f logs/result.json
          cat logs/result.json
      - name: Preserve diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: k3-one-node-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            inferencex-e2e/benchmarks/diagnostics/k3-load/logs/
            inferencex-e2e/benchmarks/diagnostics/k3-load/slurm-*.out
            inferencex-e2e/benchmarks/diagnostics/k3-load/slurm-*.err
            inferencex-e2e/benchmarks/diagnostics/k3-load/submission.txt
            inferencex-e2e/benchmarks/diagnostics/k3-load/settings.json
          if-no-files-found: error
          retention-days: 14
