            eval-suite: ${{ inputs.eval-suite != '' && inputs.eval-suite || (inputs.eval-framework == 'auto' && matrix.config['eval-suite'] || '') }}
            scenario-type: agentic-coding
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-multi-node-agentic:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-agentic-config != '' && needs.get-jobs.outputs.multi-node-agentic-config != '[]' }}
        uses: $/.github/workflows/benchmark-multinode-tmpl.yml
