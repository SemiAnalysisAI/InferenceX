name: End-to-End Tests
run-name: e2e Test - ${{ inputs.test-name || inputs.generate-cli-command || github.event.inputs.generate-cli-command }}

permissions:
    contents: read

# Independent GPU dispatches queue through the priority scheduler; newer runs must not cancel them.
on: # zizmor: ignore[concurrency-limits]
    workflow_dispatch:
        inputs:
            phase1-site-operation:
                description: "H100 site preparation or disposable native cancellation qualification"
                required: false
                type: choice
                options: [none, inspect, provision, cancel-startup, cancel-client]
                default: none
            phase1-site-draft:
                description: "Explicit shared site-draft.json path for cancellation qualification"
                required: false
                type: string
                default: ""
            generate-cli-command:
                description: "Command passed to generate matrix script"
                required: false
                type: string
                default: ""
            klaud-run:
                description: "Run Klaud Cold benchmarks at background priority"
                required: false
                type: boolean
                default: false
            test-name:
                description: "Name for this test run"
                required: false
                type: string
            ref:
                description: "Ref (branch/sha) to checkout for generating configs"
                required: false
                type: string
            duration-override:
                description: "Override matrix.config.duration (seconds). Empty = use matrix value."
                required: false
                type: string
                default: ""
            require-power:
                description: "Fail benchmark jobs when GPU power is invalid"
                required: false
                type: boolean
                default: false
            power-producer-sha:
                description: "Expected srt-slurm producer git commit for power validation"
                required: false
                type: string
                default: ""
            agentx-fast:
                description: "AgentX fast feedback: one warmup request per lane and a 20-minute profile."
                required: false
                type: boolean
                default: false
            eval-limit:
                description: "Eval instance count: empty/full = whole split (default); N = first-N smoke slice"
                required: false
                type: string
                default: ""
            eval-framework:
                description: "Eval runner override (auto uses model-aware selection; lm-eval, swebench, kimi-vendor, minimax-vendor, or bfcl)"
                required: false
                type: string
                default: "auto"
            eval-suite:
                description: "Eval suite (kimi_tool_call_schema, kimi_tool_call_schema_full, minimax_m3_smoke, minimax_m3_full, bfcl_smoke, bfcl_vllm_minimax_m3, or bfcl_vllm_kimi); empty for lm-eval and swebench"
                required: false
                type: string
                default: ""
            swebench-gen-mode:
                description: "SWE-bench generation mode (single-shot | agentic). Empty = agentic (single-shot is an explicit debugging escape hatch)."
                required: false
                type: string
                default: ""
            changelog-base-ref:
                description: "Trusted-dispatch mode: base SHA for infx.matrix.plan"
                required: false
                type: string
                default: ""
            changelog-head-ref:
                description: "Trusted-dispatch mode: exact approved PR head SHA"
                required: false
                type: string
                default: ""
            trim-conc:
                description: "Trim each configuration to its minimum concurrency"
                required: false
                type: boolean
                default: false
            all-evals:
                description: "Expand evaluation selection to every fixed-sequence configuration"
                required: false
                type: boolean
                default: false
            evals-only:
                description: "Suppress throughput and run only evaluations"
                required: false
                type: boolean
                default: false
            fail-fast:
                description: "Cancel the rest of each matrix after its first failure"
                required: false
                type: boolean
                default: false
            pr-labels-json:
                description: "Labels from the source PR for priority scoring"
                required: false
                type: string
                default: "[]"
    workflow_call:
        secrets:
          INFERENCEX_OFFICIAL_RO_HF_TOKEN:
            required: true
          MODAL_TOKEN_ID:
            required: false
          MODAL_TOKEN_SECRET:
            required: false
        inputs:
            phase1-site-operation:
                description: "H100 site preparation or disposable native cancellation qualification"
                required: false
                type: string
                default: none
            phase1-site-draft:
                description: "Explicit shared site-draft.json path for cancellation qualification"
                required: false
                type: string
                default: ""
            generate-cli-command:
                description: "Command passed to generate matrix script"
                required: false
                type: string
                default: ""
            klaud-run:
                description: "Run Klaud Cold benchmarks at background priority"
                required: false
                type: boolean
                default: false
            test-name:
                description: "Name for this test run"
                required: false
                type: string
            ref:
                description: "Ref (branch/sha) to checkout for generating configs"
                required: false
                type: string
            duration-override:
                description: "Override matrix.config.duration (seconds). Empty = use matrix value."
                required: false
                type: string
                default: ""
            require-power:
                description: "Fail benchmark jobs when GPU power is invalid"
                required: false
                type: boolean
                default: false
            power-producer-sha:
                description: "Expected srt-slurm producer git commit for power validation"
                required: false
                type: string
                default: ""
            agentx-fast:
                description: "AgentX fast feedback: one warmup request per lane and a 20-minute profile."
                required: false
                type: boolean
                default: false
            eval-limit:
                description: "Eval instance count: empty/full = whole split (default); N = first-N smoke slice"
                required: false
                type: string
                default: ""
            eval-framework:
                description: "Eval runner override (auto uses model-aware selection; lm-eval, swebench, kimi-vendor, minimax-vendor, or bfcl)"
                required: false
                type: string
                default: "auto"
            eval-suite:
                description: "Eval suite (kimi_tool_call_schema, kimi_tool_call_schema_full, minimax_m3_smoke, minimax_m3_full, bfcl_smoke, bfcl_vllm_minimax_m3, or bfcl_vllm_kimi); empty for lm-eval and swebench"
                required: false
                type: string
                default: ""
            swebench-gen-mode:
                description: "SWE-bench generation mode (single-shot | agentic). Empty = agentic (single-shot is an explicit debugging escape hatch)."
                required: false
                type: string
                default: ""
            changelog-base-ref:
                description: "Trusted-dispatch mode: base SHA for infx.matrix.plan"
                required: false
                type: string
                default: ""
            changelog-head-ref:
                description: "Trusted-dispatch mode: exact approved PR head SHA"
                required: false
                type: string
                default: ""
            trim-conc:
                description: "Trim each configuration to its minimum concurrency"
                required: false
                type: boolean
                default: false
            all-evals:
                description: "Expand evaluation selection to every fixed-sequence configuration"
                required: false
                type: boolean
                default: false
            evals-only:
                description: "Suppress throughput and run only evaluations"
                required: false
                type: boolean
                default: false
            fail-fast:
                description: "Cancel the rest of each matrix after its first failure"
                required: false
                type: boolean
                default: false
            pr-labels-json:
                description: "Labels from the source PR for priority scoring"
                required: false
                type: string
                default: "[]"

jobs:
    phase1-site-route:
        name: Queue Phase 1 site preparation
        if: ${{ inputs.phase1-site-operation && inputs.phase1-site-operation != 'none' }}
        runs-on: ubuntu-latest
        outputs:
            queue-token: ${{ steps.token.outputs.result }}
        steps:
            - id: token
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                SITE_OPERATION: ${{ inputs.phase1-site-operation }}
              with:
                result-encoding: string
                script: |
                    if (!['inspect', 'provision', 'cancel-startup', 'cancel-client'].includes(process.env.SITE_OPERATION)) {
                      throw new Error('Unknown Phase 1 site operation');
                    }
                    return require('crypto').createHash('sha256')
                      .update(`${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}:phase1-site`)
                      .digest('hex').slice(0, 32);
    phase1-site:
        if: ${{ inputs.phase1-site-operation && inputs.phase1-site-operation != 'none' }}
        needs: phase1-site-route
        name: Phase 1 H100 site and lifecycle qualification
        # The shared Linux paths can only be inspected from this cluster's login runners.
        runs-on: ${{ fromJSON(format('["self-hosted","cluster:h100-dgxc","nodes:1","ci-job-1.000-{0}","ci-attempt-{1}"]', needs.phase1-site-route.outputs.queue-token, github.run_attempt)) }}
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # Provision the same immutable tree the sweep will measure (PR merge SHA).
                ref: ${{ inputs.ref || github.workflow_sha }}
                path: phase1-site-${{ github.run_id }}-${{ github.run_attempt }}
                persist-credentials: false
            - name: Observe fixed Phase 1 client cancellation progress
              working-directory: phase1-site-${{ github.run_id }}-${{ github.run_attempt }}
              env:
                SITE_OPERATION: ${{ inputs.phase1-site-operation }}
              # No installs, Slurm writes, or modifications to the observed generation.
              shell: /mnt/nfs/sa-shared/gharunners/inferencex-native/generations/35484558552-1/envs/wrapper/bin/python -I -S -B {0} # zizmor: ignore[misfeature]
              run: |
                """Bounded read-only observation of one fixed client cancellation lifecycle."""
                import datetime
                import itertools
                import json
                import os
                from pathlib import Path
                import re
                import selectors
                import stat
                import subprocess
                import time

                GENERATION = Path("/mnt/nfs/sa-shared/gharunners/inferencex-native/generations/35484558552-1")
                RUN_ID = 35486685532
                ATTEMPT = 1
                SOURCE_SHA = "19a0d648932ec5f668fecb26f0c377bdd229cf49"
                NAMESPACE = "35486685532-1-client"
                INTENT = "cancellation-qualification-35486685532-1-client"
                TOKEN = "850ba9951d5b6d2a2c2a40f512bef69f03013465ff4b48661ab1febc95e2139c"
                DIRECTORY = GENERATION / "cancellation-qualification" / NAMESPACE
                JOURNAL = DIRECTORY / "journal" / "h100-dgxc" / TOKEN


                def read_fixed(path, parent, limit=65536, *, tail=False):
                    if parent.resolve(strict=True) != parent or path.parent != parent:
                        raise ValueError("source escapes its canonical fixed parent")
                    if path.resolve(strict=True) != path:
                        raise ValueError("source is a symlink")
                    descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                    with os.fdopen(descriptor, "rb") as stream:
                        info = os.fstat(stream.fileno())
                        if not stat.S_ISREG(info.st_mode):
                            raise ValueError("source is not a regular file")
                        if not tail and info.st_size > limit:
                            raise ValueError("source exceeds the read bound")
                        offset = max(0, info.st_size - limit) if tail else 0
                        stream.seek(offset)
                        data = stream.read(limit if tail else limit + 1)
                        if len(data) > limit:
                            raise ValueError("source grew beyond the read bound")
                        if offset and b"\n" in data:
                            data = data.split(b"\n", 1)[1]
                        return data, {"bytes": info.st_size, "mtime_ns": info.st_mtime_ns, "tail_truncated": bool(offset)}


                def read_object(path, parent):
                    raw, info = read_fixed(path, parent)
                    value = json.loads(raw)
                    if not isinstance(value, dict):
                        raise ValueError("expected a JSON object")
                    return value, info


                def scheduler_read(argv):
                    limit = 69632
                    output = bytearray()
                    deadline = time.monotonic() + 15
                    process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                    assert process.stdout is not None
                    status = "closed"
                    try:
                        with selectors.DefaultSelector() as selector:
                            selector.register(process.stdout, selectors.EVENT_READ)
                            while True:
                                remaining = deadline - time.monotonic()
                                if remaining <= 0:
                                    status = "timeout"
                                    break
                                if not selector.select(timeout=remaining):
                                    status = "timeout"
                                    break
                                chunk = os.read(process.stdout.fileno(), min(4096, limit + 1 - len(output)))
                                if not chunk:
                                    break
                                output.extend(chunk)
                                if len(output) > limit:
                                    status = "output-bound-exceeded"
                                    break
                    finally:
                        process.stdout.close()
                        if status == "closed":
                            try:
                                process.wait(timeout=max(0.1, min(5, deadline - time.monotonic())))
                            except subprocess.TimeoutExpired:
                                status = "timeout"
                        if process.poll() is None:
                            process.kill()  # Only this newly spawned local read-only command.
                        process.wait(timeout=5)
                    return {"state": status, "exit_code": process.returncode, "output": bytes(output[:limit]).decode(errors="replace")}


                def failure(error):
                    return {"state": "not-readable", "error_type": type(error).__name__}


                def select_fields(value, fields):
                    return {name: value[name] for name in fields if name in value}


                def capture_object(path, fields):
                    try:
                        value, info = read_object(path, path.parent)
                        return {**info, "value": select_fields(value, fields)}
                    except (OSError, ValueError, KeyError) as error:
                        return failure(error)


                def capture_tail(path, report, name, limit=32768):
                    try:
                        raw, info = read_fixed(path, path.parent, limit, tail=True)
                        lines = raw.splitlines()
                        (report / name).write_bytes(b"\n".join(lines[-100:]) + b"\n")
                        return {**info, "artifact": name, "line_limit": 100, "line_truncated": len(lines) > 100}
                    except (OSError, ValueError) as error:
                        return failure(error)


                def writer_snapshot(job_id, report, suffix):
                    result = {"observed_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
                    for name in ("started.json", "closed.json"):
                        try:
                            value, info = read_object(DIRECTORY / "writer" / name, DIRECTORY / "writer")
                            if (value.get("token") != NAMESPACE or value.get("job_id") != job_id
                                    or value.get("cwd") != str(DIRECTORY)
                                    or type(value.get("pid")) is not int or value["pid"] <= 0
                                    or not isinstance(value.get("endpoint"), str)
                                    or not value["endpoint"].startswith("http://")):
                                raise ValueError("writer does not match the fixed lifecycle")
                            result[name] = {**info, "value": select_fields(value, (
                                "token", "job_id", "pid", "endpoint", "cwd", "signal", "records", "bytes", "writer_closed"))}
                        except (OSError, ValueError, KeyError) as error:
                            result[name] = failure(error)
                    result["heartbeat"] = capture_tail(DIRECTORY / "writer/heartbeat.jsonl", report,
                                                       "writer-heartbeat-" + suffix + ".jsonl", 4096)
                    return result


                def observe_scheduler(job_id):
                    result = {}
                    job = scheduler_read(["scontrol", "--oneliner", "show", "job", job_id])
                    fields = dict(re.findall(r"(\w+)=([^\s]+)", job["output"]))
                    result["job"] = {"state": job["state"], "exit_code": job["exit_code"], "fields": select_fields(fields, (
                        "JobId", "JobState", "Comment", "Restarts", "RestartCnt", "ExitCode", "BatchHost", "NodeList",
                        "StartTime", "EndTime", "RunTime", "TimeLimit", "StepMgrEnabled", "StepMgr"))}
                    if job["state"] != "closed":
                        return result
                    if job["exit_code"] == 0:
                        if fields.get("JobId") != job_id or fields.get("Comment") != "srtctl:" + TOKEN:
                            result["identity_mismatch"] = True
                            return result
                        steps = scheduler_read(["scontrol", "--oneliner", "show", "steps", job_id])
                        result["steps"] = {"state": steps["state"], "exit_code": steps["exit_code"], "records": []}
                        for line in steps["output"].splitlines():
                            row = dict(re.findall(r"(\w+)=([^\s]+)", line))
                            if re.fullmatch(re.escape(job_id) + r"\.(?:[0-9]+|batch|extern)", row.get("StepId", "")):
                                result["steps"]["records"].append(select_fields(row, (
                                    "StepId", "Name", "State", "StartTime", "TimeLimit", "NodeList", "ExitCode")))
                            elif row:
                                result["steps"]["unmatched_record"] = True
                    elif "invalid job id" not in job["output"].lower():
                        return result
                    accounting = scheduler_read(["sacct", "--allocations", "--jobs", job_id, "--noheader", "--parsable2",
                                                 "--format=JobIDRaw,State,ExitCode,Elapsed,Start,End,NodeList,Comment"])
                    result["accounting"] = {"state": accounting["state"], "exit_code": accounting["exit_code"], "records": []}
                    for line in accounting["output"].splitlines():
                        parts = line.split("|")
                        if len(parts) >= 8 and parts[0] == job_id and parts[7] == "srtctl:" + TOKEN:
                            result["accounting"]["records"].append(dict(zip(
                                ("job_id", "state", "exit_code", "elapsed", "start", "end", "nodes", "comment"), parts[:8])))
                    return result


                def observe(report):
                    result = {"purpose": "operational-diagnostic", "qualification_evidence": False,
                              "run_id": RUN_ID, "attempt": ATTEMPT, "expected_dispatch_source_sha": SOURCE_SHA,
                              "source_verification": "Dispatch context supplied externally; not independently attested by this observer.",
                              "generation": str(GENERATION), "namespace": NAMESPACE,
                              "observed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                              "note": "Read-only snapshot. Missing or truncated evidence is not proof of absence, readiness, closure, or event causality."}
                    try:
                        if DIRECTORY.resolve(strict=True) != DIRECTORY or not DIRECTORY.is_dir():
                            raise ValueError("fixed lifecycle directory is not canonical")
                        receipt, info = read_object(JOURNAL / "receipt.json", JOURNAL)
                        job_id = receipt.get("job_id", "")
                        if (receipt.get("state") != "accepted" or not isinstance(job_id, str)
                                or not re.fullmatch(r"[1-9][0-9]*", job_id)
                                or receipt.get("intent_id") != INTENT or receipt.get("scheduler_comment") != "srtctl:" + TOKEN
                                or receipt.get("accepted_ids") != [job_id]
                                or receipt.get("output_dir") != str(DIRECTORY / "native-output" / job_id)):
                            raise ValueError("receipt does not own the fixed lifecycle")
                        result["receipt"] = {**info, "value": select_fields(receipt, (
                            "state", "job_id", "accepted_ids", "intent_id", "scheduler_comment", "output_dir", "manifest_sha256"))}
                    except (OSError, ValueError, KeyError) as error:
                        result["receipt"] = failure(error)
                        return result
                    result["writer_before_scheduler"] = writer_snapshot(job_id, report, "before")
                    try:
                        result["scheduler"] = observe_scheduler(job_id)
                    except (OSError, subprocess.TimeoutExpired) as error:
                        result["scheduler"] = failure(error)
                    output = DIRECTORY / "native-output" / job_id
                    result["completion"] = capture_object(output / "completion.json", (
                        "schema", "job_id", "manifest_sha256", "execution_success", "exit_code", "cleanup_complete", "restoration_success"))
                    result["qualification"] = capture_object(DIRECTORY / "qualification.json", (
                        "state", "mode", "namespace", "native_revision", "serving_point", "lifecycle_qualified",
                        "qualification_complete", "accepted_benchmark", "trigger", "cleanup", "writer_closure",
                        "error_type", "error", "cleanup_error_type", "cleanup_error"))
                    logs = output / "logs"
                    result["worker_identity"] = capture_object(logs / "direct-vllm-worker.json", (
                        "pid", "start_ticks", "pid_namespace", "net_namespace"))
                    result["logs"] = {"orchestrator": capture_tail(DIRECTORY / "native-output/native-logs" / (job_id + ".log"),
                                                                   report, "native-orchestrator.log"),
                                      "client": capture_tail(logs / "benchmark.out", report, "benchmark.out")}
                    try:
                        if logs.resolve(strict=True) != logs:
                            raise ValueError("worker logs directory is not canonical")
                        with os.scandir(logs) as entries:
                            candidates = [Path(entry.path) for entry in itertools.islice(entries, 32)]
                        for path in sorted(candidates):
                            if re.fullmatch(r"[A-Za-z0-9_.-]{1,100}_agg_w0\.(?:out|err)", path.name):
                                result["logs"][path.name] = capture_tail(path, report, "worker-" + path.name)
                        result["worker_log_directory_scan_limit"] = 32
                    except (OSError, ValueError) as error:
                        result["worker_logs"] = failure(error)
                    result["writer_after_scheduler"] = writer_snapshot(job_id, report, "after")
                    result["completed_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
                    return result


                if __name__ == "__main__":
                    if os.environ.get("SITE_OPERATION") != "inspect":
                        raise ValueError("This diagnostic branch supports inspect only")
                    report = Path.cwd() / "phase1-provision-report"
                    report.mkdir(exist_ok=False)
                    (report / "diagnostic.json").write_text(json.dumps(observe(report), indent=2) + "\n")
                    print("Fixed client lifecycle observation retained; this is not qualification evidence.")
            - name: Preserve provisioning evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: phase1-site-${{ inputs.phase1-site-operation }}-${{ github.run_id }}-${{ github.run_attempt }}
                path: phase1-site-${{ github.run_id }}-${{ github.run_attempt }}/phase1-provision-report/
                if-no-files-found: error
    get-jobs:
        if: ${{ !inputs.phase1-site-operation || inputs.phase1-site-operation == 'none' }}
        name: get-jobs
        runs-on: ubuntu-latest
        outputs:
            benchmark-ref: ${{ steps.checkout-ref.outputs.commit || steps.checkout-default.outputs.commit }}
            tooling-ref: ${{ steps.tooling.outputs.result }}
            single-node-config: ${{ steps.get-jobs.outputs.single-node-config }}
            multi-node-config: ${{ steps.get-jobs.outputs.multi-node-config }}
            eval-config: ${{ steps.get-jobs.outputs.eval-config }}
            multi-node-eval-config: ${{ steps.get-jobs.outputs.multi-node-eval-config }}
            agentic-config: ${{ steps.get-jobs.outputs.agentic-config }}
            agentic-eval-config: ${{ steps.get-jobs.outputs.agentic-eval-config }}
            multi-node-agentic-config: ${{ steps.get-jobs.outputs.multi-node-agentic-config }}
            multi-node-agentic-eval-config: ${{ steps.get-jobs.outputs.multi-node-agentic-eval-config }}
        steps:
            - name: Checkout code (ref)
              id: checkout-ref
              if: ${{ inputs.ref && inputs.ref != '' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ inputs.ref }}
                fetch-depth: 0
                persist-credentials: false

            - name: Checkout code (default)
              id: checkout-default
              if: ${{ !inputs.ref || inputs.ref == '' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ github.sha }}
                persist-credentials: false
            - name: Resolve workflow tooling
              id: tooling
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                CHECKOUT_SHA: ${{ steps.checkout-ref.outputs.commit || steps.checkout-default.outputs.commit }}
              with:
                result-encoding: string
                script: |
                  const { data } = await github.rest.repos.getCommit({
                    ...context.repo, ref: context.payload.repository.default_branch,
                  });
                  await core.summary.addHeading('Revisions', 2).addTable([
                    ['Setup checkout', process.env.CHECKOUT_SHA],
                    ['infx tooling', data.sha],
                  ]).write();
                  return data.sha;
            - name: Checkout workflow tooling
              if: ${{ inputs.ref && inputs.ref != '' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ github.workflow_sha }}
                path: .ci-priority
                persist-credentials: false

            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
            - id: get-jobs
              env:
                  GENERATE_COMMAND: ${{ inputs.generate-cli-command || github.event.inputs.generate-cli-command }}
                  PR_LABELS: ${{ inputs.pr-labels-json || toJson(github.event.pull_request.labels.*.name) }}
                  CHANGELOG_BASE_REF: ${{ inputs.changelog-base-ref }}
                  CHANGELOG_HEAD_REF: ${{ inputs.changelog-head-ref }}
                  TRIM_CONC: ${{ inputs.trim-conc }}
                  ALL_EVALS: ${{ inputs.all-evals }}
                  EVALS_ONLY: ${{ inputs.evals-only }}
              run: |
                  PRIORITY_ROOT="${GITHUB_WORKSPACE}"
                  if [ -d "${GITHUB_WORKSPACE}/.ci-priority" ]; then
                    PRIORITY_ROOT="${GITHUB_WORKSPACE}/.ci-priority"
                  fi
                  if [ -n "$CHANGELOG_BASE_REF" ] || [ -n "$CHANGELOG_HEAD_REF" ]; then
                    if [ -z "$CHANGELOG_BASE_REF" ] || [ -z "$CHANGELOG_HEAD_REF" ]; then
                      echo "Both changelog-base-ref and changelog-head-ref are required" >&2
                      exit 1
                    fi
                    CMD=(
                      env PYTHONPATH="$PRIORITY_ROOT"
                      uv run --no-project --exclude-newer PT12H --python 3.12 --with pydantic --with pyyaml
                      python -P -m infx.matrix.plan
                      --changelog-file "${GITHUB_WORKSPACE}/perf-changelog.yaml"
                      --base-ref "$CHANGELOG_BASE_REF"
                      --head-ref "$CHANGELOG_HEAD_REF"
                    )
                    if [ "$TRIM_CONC" = "true" ]; then
                      CMD+=(--trim-conc)
                    fi
                    if [ "$ALL_EVALS" = "true" ]; then
                      CMD+=(--all-evals)
                    fi
                    if [ "$EVALS_ONLY" = "true" ]; then
                      CMD+=(--evals-only)
                    fi
                    RAW_CONFIG_JSON=$("${CMD[@]}")
                    CONFIG_JSON=$(python3 -c 'import json,sys; data=json.load(sys.stdin); rows=[row for family in ("single_node","multi_node") for group in data.get(family,{}).values() for row in group]; rows.extend(row for family in ("evals","agentic_evals","multinode_evals","multinode_agentic_evals") for row in data.get(family,[])); print(json.dumps(rows))' <<<"$RAW_CONFIG_JSON")
                  else
                    if [ -z "$GENERATE_COMMAND" ]; then
                      echo "generate-cli-command is required outside trusted changelog dispatch mode" >&2
                      exit 1
                    fi
                    read -r -a GENERATE_ARGS <<< "$GENERATE_COMMAND"
                    if [ "$TRIM_CONC" = "true" ]; then
                      GENERATE_ARGS+=(--trim-conc)
                    fi
                    if [ "$ALL_EVALS" = "true" ]; then
                      GENERATE_ARGS+=(--all-evals)
                    fi
                    if [ "$EVALS_ONLY" = "true" ]; then
                      GENERATE_ARGS+=(--evals-only)
                    fi
                    CONFIG_JSON=$(uv run --no-project --exclude-newer PT12H --python 3.12 --with pydantic --with pyyaml \
                      python "${GITHUB_WORKSPACE}/utils/matrix_logic/generate_sweep_configs.py" \
                      "${GENERATE_ARGS[@]}")
                  fi
                  CONFIG_JSON=$(printf '%s' "$CONFIG_JSON" | env PYTHONPATH="$PRIORITY_ROOT" \
                    uv run --no-project --exclude-newer PT12H --python 3.12 --with pydantic --with pyyaml \
                    python -P -m infx.workflows.benchmark_schema)
                  score_matrix() {
                    local family="$1"
                    env PYTHONPATH="$PRIORITY_ROOT" uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
                      python -P "${PRIORITY_ROOT}/utils/ci_priority.py" \
                      --policy "${PRIORITY_ROOT}/configs/ci-priority.yaml" \
                      --event-name "${GITHUB_EVENT_NAME}" \
                      --queue-namespace "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${family}" \
                      --labels-json "$PR_LABELS"
                  }
                  AGENTIC=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' not in x and not x.get('eval-only', False)]))" | score_matrix agentic)
                  AGENTIC_EVAL=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' not in x and x.get('run-eval', False)]))" | score_matrix agentic-eval)
                  MULTI_AGENTIC=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' in x and not x.get('eval-only', False)]))" | score_matrix multi-agentic)
                  MULTI_AGENTIC_EVAL=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' in x and x.get('run-eval', False)]))" | score_matrix multi-agentic-eval)
                  SINGLE=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' not in x and x.get('scenario-type') != 'agentic-coding' and not x.get('eval-only', False)]))" | score_matrix single)
                  MULTI=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' in x and x.get('scenario-type') != 'agentic-coding' and not x.get('eval-only', False)]))" | score_matrix multi)
                  EVALS=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' not in x and x.get('scenario-type') != 'agentic-coding' and x.get('run-eval', False)]))" | score_matrix eval)
                  MULTI_EVAL=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' in x and x.get('scenario-type') != 'agentic-coding' and x.get('run-eval', False)]))" | score_matrix multi-eval)
                  {
                    echo "agentic-config=$AGENTIC"
                    echo "agentic-eval-config=$AGENTIC_EVAL"
                    echo "multi-node-agentic-config=$MULTI_AGENTIC"
                    echo "multi-node-agentic-eval-config=$MULTI_AGENTIC_EVAL"
                    echo "single-node-config=$SINGLE"
                    echo "multi-node-config=$MULTI"
                    echo "eval-config=$EVALS"
                    echo "multi-node-eval-config=$MULTI_EVAL"
                  } >> "$GITHUB_OUTPUT"

    test-sweep-multi-node:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-config != '' && needs.get-jobs.outputs.multi-node-config != '[]' }}
        uses: $/.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node /
        strategy:
            fail-fast: ${{ inputs.fail-fast }}
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            node-count: ${{ matrix.config.node-count }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            run-eval: false
            require-power: ${{ inputs.require-power || (matrix.config['require-power'] == true && matrix.config['eval-only'] != true) }}
            power-producer-sha: ${{ inputs.power-producer-sha }}
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-multi-node-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-eval-config != '' && needs.get-jobs.outputs.multi-node-eval-config != '[]' }}
        uses: $/.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node eval /
        strategy:
            fail-fast: ${{ inputs.fail-fast }}
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-eval-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            node-count: ${{ matrix.config.node-count }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            run-eval: true
            eval-only: true
            eval-conc: ${{ (inputs.eval-framework == 'auto' && (matrix.config['eval-framework'] || 'lm-eval') || inputs.eval-framework) == 'lm-eval' && matrix.config['eval-all-concs'] && join(matrix.config.conc, ' ') || matrix.config['eval-conc'] }}
            eval-limit: ${{ inputs.eval-limit }}
            eval-framework: ${{ inputs.eval-framework == 'auto' && (matrix.config['eval-framework'] || 'lm-eval') || inputs.eval-framework }}
            eval-suite: ${{ inputs.eval-suite != '' && inputs.eval-suite || (inputs.eval-framework == 'auto' && matrix.config['eval-suite'] || '') }}
            swebench-gen-mode: ${{ inputs.swebench-gen-mode }}
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-agentic:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.agentic-config != '' && needs.get-jobs.outputs.agentic-config != '[]' }}
        uses: $/.github/workflows/benchmark-tmpl.yml
        name: agentic /
        strategy:
            fail-fast: ${{ inputs.fail-fast }}
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.agentic-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            dp-attn: ${{ matrix.config.dp-attn }}
            duration: ${{ inputs.agentx-fast && '1200' || (inputs.duration-override != '' && inputs.duration-override || matrix.config.duration) }}
            agentx-fast: ${{ inputs.agentx-fast }}
            run-eval: false
            require-power: ${{ inputs.require-power }}
            scenario-type: agentic-coding
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-agentic-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.agentic-eval-config != '' && needs.get-jobs.outputs.agentic-eval-config != '[]' }}
        uses: $/.github/workflows/benchmark-tmpl.yml
        name: agentic eval /
        strategy:
            fail-fast: ${{ inputs.fail-fast }}
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.agentic-eval-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            dp-attn: ${{ matrix.config.dp-attn }}
            duration: ${{ inputs.agentx-fast && '1200' || (inputs.duration-override != '' && inputs.duration-override || matrix.config.duration) }}
            agentx-fast: ${{ inputs.agentx-fast }}
            run-eval: true
            eval-only: true
            eval-limit: ${{ inputs.eval-limit }}
            swebench-gen-mode: ${{ inputs.swebench-gen-mode }}
            eval-framework: ${{ inputs.eval-framework == 'auto' && (matrix.config['eval-framework'] || 'lm-eval') || inputs.eval-framework }}
            eval-suite: ${{ inputs.eval-suite != '' && inputs.eval-suite || (inputs.eval-framework == 'auto' && matrix.config['eval-suite'] || '') }}
            scenario-type: agentic-coding
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-multi-node-agentic:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-agentic-config != '' && needs.get-jobs.outputs.multi-node-agentic-config != '[]' }}
        uses: $/.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node agentic /
        strategy:
            fail-fast: ${{ inputs.fail-fast }}
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-agentic-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            node-count: ${{ matrix.config.node-count }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            conc: ${{ matrix.config.conc[0] }}
            duration: ${{ inputs.agentx-fast && '1200' || (inputs.duration-override != '' && inputs.duration-override || matrix.config.duration) }}
            agentx-fast: ${{ inputs.agentx-fast }}
            run-eval: false
            require-power: ${{ inputs.require-power }}
            power-producer-sha: ${{ inputs.power-producer-sha }}
            scenario-type: agentic-coding
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-multi-node-agentic-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-agentic-eval-config != '' && needs.get-jobs.outputs.multi-node-agentic-eval-config != '[]' }}
        uses: $/.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node agentic eval /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-agentic-eval-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            node-count: ${{ matrix.config.node-count }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            conc-list: ${{ format('[{0}]', matrix.config['eval-conc']) }}
            conc: ${{ matrix.config['eval-conc'] }}
            duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
            run-eval: true
            eval-only: true
            eval-conc: ${{ matrix.config['eval-conc'] }}
            eval-limit: ${{ inputs.eval-limit }}
            swebench-gen-mode: ${{ inputs.swebench-gen-mode }}
            eval-framework: ${{ inputs.eval-framework == 'auto' && (matrix.config['eval-framework'] || 'lm-eval') || inputs.eval-framework }}
            eval-suite: ${{ inputs.eval-suite != '' && inputs.eval-suite || (inputs.eval-framework == 'auto' && matrix.config['eval-suite'] || '') }}
            scenario-type: agentic-coding
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-single-node:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.single-node-config != '' && needs.get-jobs.outputs.single-node-config != '[]' }}
        uses: $/.github/workflows/benchmark-tmpl.yml
        name: single-node /
        strategy:
            fail-fast: ${{ inputs.fail-fast }}
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.single-node-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            dp-attn: ${{ matrix.config.dp-attn }}
            run-eval: false
            require-power: ${{ inputs.require-power || (matrix.config['require-power'] == true && matrix.config['eval-only'] != true) }}
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    test-sweep-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.eval-config != '' && needs.get-jobs.outputs.eval-config != '[]' }}
        uses: $/.github/workflows/benchmark-tmpl.yml
        name: eval /
        strategy:
            fail-fast: ${{ inputs.fail-fast }}
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.eval-config) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
            MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        with:
            config: ${{ toJSON(matrix.config) }}
            klaud-run: ${{ inputs.klaud-run }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            dp-attn: ${{ matrix.config.dp-attn }}
            run-eval: true
            eval-only: true
            eval-limit: ${{ inputs.eval-limit }}
            eval-framework: ${{ inputs.eval-framework == 'auto' && (matrix.config['eval-framework'] || 'lm-eval') || inputs.eval-framework }}
            eval-suite: ${{ inputs.eval-suite != '' && inputs.eval-suite || (inputs.eval-framework == 'auto' && matrix.config['eval-suite'] || '') }}
            swebench-gen-mode: ${{ inputs.swebench-gen-mode }}
            ref: ${{ needs.get-jobs.outputs.benchmark-ref }}

    collect-results:
        name: collect-results
        needs: [get-jobs, test-sweep-multi-node, test-sweep-single-node, test-sweep-agentic, test-sweep-multi-node-agentic]
        if: ${{ always() && (needs.test-sweep-multi-node.result != 'skipped' || needs.test-sweep-single-node.result != 'skipped' || needs.test-sweep-agentic.result != 'skipped' || needs.test-sweep-multi-node-agentic.result != 'skipped') }}
        uses: $/.github/workflows/collect-results.yml
        with:
            result-prefix: "bmk"
            tooling-ref: ${{ needs.get-jobs.outputs.tooling-ref }}

    collect-evals:
        name: collect-evals
        needs: [get-jobs, test-sweep-evals, test-sweep-multi-node-evals, test-sweep-agentic-evals, test-sweep-multi-node-agentic-evals]
        if: ${{ always() && (needs.test-sweep-evals.result != 'skipped' || needs.test-sweep-multi-node-evals.result != 'skipped' || needs.test-sweep-agentic-evals.result != 'skipped' || needs.test-sweep-multi-node-agentic-evals.result != 'skipped') }}
        uses: $/.github/workflows/collect-evals.yml
        with:
            tooling-ref: ${{ needs.get-jobs.outputs.tooling-ref }}

    calc-success-rate:
        name: calc-success-rate
        needs: [get-jobs, collect-results, collect-evals]
        if: ${{ always() && needs.get-jobs.outputs.tooling-ref != '' }}
        runs-on: ubuntu-latest
        permissions:
            actions: read # Read job timings for run statistics.
            contents: read

        env:
            RESULTS_DIR: "results/"
            STATS_FILENAME: "run_stats"
            GITHUB_TOKEN: ${{ github.token }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.get-jobs.outputs.tooling-ref }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Download results artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: ${{ env.RESULTS_DIR }}
                  pattern: results_*

            - name: Set up uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

            - name: Calculate success rate
              run: >-
                  uv run --locked --extra workflows
                  python -m infx.workflows.calc_success_rate "$STATS_FILENAME"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: "run-stats"
                  path: ${{ env.STATS_FILENAME }}.json
