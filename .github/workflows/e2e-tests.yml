name: K3 asset validation
run-name: K3 asset validation - ${{ inputs.test-name }}

# Disposable diagnostic branch only. Never include this workflow in the recipe PR.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Validation branch (must match the workflow branch)
        required: true
        type: string
      test-name:
        description: Diagnostic identity
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: k3-asset-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/inferencex-e2e
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      priority: ${{ steps.queue.outputs.priority }}
      token: ${{ steps.queue.outputs.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Check scope and image
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          source inferencex-e2e/benchmarks/check_env.sh
          check_env_vars INPUT_REF GITHUB_REF_NAME
          test "$INPUT_REF" = "$GITHUB_REF_NAME"
          uv run --no-project --exclude-newer PT12H --python 3.12 --with pydantic --with pyyaml \
            python inferencex-e2e/runners/diagnostics/k3_asset_job.py plan
      - name: Use the existing scheduler policy
        id: queue
        run: |
          uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml python - <<'PY'
          import os
          from infx.workflows.ci_priority import PriorityContext, annotate_jobs, load_policy
          policy = load_policy("inferencex-e2e/configs/ci-priority.yaml")
          context = PriorityContext(event_name="workflow_dispatch", queue_namespace=f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}", criteria=frozenset())
          job = annotate_jobs({"runner": "mi355x", "framework": "diagnostic", "node-count": 1}, policy, context)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"priority={job['priority']}\ntoken={job['queue-token']}\n")
          print(job)
          PY

  probe:
    needs: prepare
    name: Ionic A/B and ordinary draft mount (0 GPUs)
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        format('["self-hosted","mi355x","nodes:1",{0},{1}]',
          toJSON(format('ci-job-{0}-{1}', needs.prepare.outputs.priority, needs.prepare.outputs.token)),
          toJSON(format('ci-attempt-{0}', github.run_attempt))) || '["mi355x"]'
      ) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Run the bounded CPU diagnostic
        run: |
          uv run --no-project --exclude-newer PT12H --python 3.12 --with pydantic --with pyyaml \
            python -u inferencex-e2e/runners/diagnostics/k3_asset_job.py submit
