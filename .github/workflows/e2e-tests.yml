    test-sweep-multi-node-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-eval-config != '' && needs.get-jobs.outputs.multi-node-eval-config != '[]' }}
        uses: $/.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node eval /
