name: MI355X Power Preflight

on:
  push:
    branches:
      - feat/power-pr5-mi355x-preflight
    paths:
      - .github/workflows/mi355x-power-preflight.yml
      - utils/mi355x_power_preflight.py
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: mi355x
    timeout-minutes: 30
    env:
      IMAGE: lmsysorg/sglang-rocm:v0.5.16-rocm720-mi35x-20260726
      GPU_COUNT: "4"
      PARTITION: compute
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Submit-host recon
        run: |
          {
            uname -a
            sinfo -p "$PARTITION" 2>&1 || echo "sinfo: absent"
            squeue -p "$PARTITION" -h 2>&1 | head -5
          } | tee env_recon.txt

      - name: Compute-node preflight via Slurm + enroot
        run: |
          JOB_NAME="power-preflight-${{ github.run_id }}"
          SQUASH_FILE="/var/lib/squash/$(echo "$IMAGE" | sed 's/[\/:@#]/_/g').sqsh"
          LOCK_FILE="${SQUASH_FILE}.lock"

          salloc --partition="$PARTITION" --gres=gpu:$GPU_COUNT --exclusive \
            --cpus-per-task=128 --time=25 --no-shell --job-name="$JOB_NAME"
          JOB_ID=$(squeue --name="$JOB_NAME" -h -o %A | head -n1)
          [ -n "$JOB_ID" ] || { echo "no allocation"; exit 1; }
          trap 'scancel $JOB_ID' EXIT

          srun --jobid=$JOB_ID bash -c "
            { hostname; uname -a; ls -l /dev/kfd 2>&1
              cat /opt/rocm/.info/version 2>&1 || true
              (command -v amd-smi >/dev/null && amd-smi version 2>&1) || echo 'amd-smi: absent on compute host'
            } " | tee node_recon.txt

          srun --jobid=$JOB_ID bash -c "
            exec 9>\"$LOCK_FILE\"
            flock -w 600 9 || { echo 'Failed to acquire lock for $SQUASH_FILE'; exit 1; }
            if unsquashfs -l \"$SQUASH_FILE\" > /dev/null 2>&1; then
              echo 'Squash file already exists and is valid, skipping import'
            else
              rm -f \"$SQUASH_FILE\"
              enroot import -o \"$SQUASH_FILE\" docker://$IMAGE
            fi
          "

          srun --jobid=$JOB_ID \
            --container-image=$SQUASH_FILE \
            --container-mounts=$GITHUB_WORKSPACE:/workspace/ \
            --container-writable \
            --container-workdir=/workspace/ \
            --container-remap-root \
            --no-container-entrypoint \
            bash -c "amd-smi version; python3 utils/mi355x_power_preflight.py --samples 60 --hz 1.0 --out preflight_container.json; \
              timeout 12 amd-smi metric -p -c -t -u -w 1 --csv > watch_mode_head.csv 2> watch_mode_err.txt || true; \
              amd-smi metric -p -E --csv > oneshot_pE.csv 2>&1 || true; \
              amd-smi metric -E --json > oneshot_E.json 2>&1 || true; \
              head -c 2000 watch_mode_head.csv; echo; head -c 800 oneshot_pE.csv"

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mi355x-power-preflight
          path: |
            env_recon.txt
            node_recon.txt
            preflight_container.json
            watch_mode_head.csv
            watch_mode_err.txt
            oneshot_pE.csv
            oneshot_E.json
          if-no-files-found: warn
