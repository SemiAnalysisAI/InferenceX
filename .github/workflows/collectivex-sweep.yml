# Generate a shard matrix, run each shard on its GPU pool, and upload raw results.
name: CollectiveX Sweep
permissions:
  actions: read # Read workflow runs and artifacts.
  contents: read
on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Benchmark to run — swap-blocks runs only vLLM memory copies on one GPU per selected pool; all runs EP backends"
        type: choice
        default: all
        options: [all, deepep-v2, mori, uccl-ep, nccl-ep, flashinfer-ep, swap-blocks]
      swap_image:
        description: Official CUDA vLLM image for swap-blocks
        type: string
        default: vllm/vllm-openai:v0.25.1
      swap_rocm_image:
        description: Official ROCm vLLM image for AMD swap-blocks
        type: string
        default: vllm/vllm-openai-rocm:v0.27.1
      swap_h100_image:
        description: Official CUDA vLLM image staged in the H100 serving cache
        type: string
        default: vllm/vllm-openai:v0.27.1
      swap_profile:
        description: swap-blocks workload size (both profiles cover all directions and layouts)
        type: choice
        default: smoke
        options: [smoke, standard, large-blocks]
      only_sku:
        description: Restrict to one GHA runner pool; blank = all
        type: string
        default: ''
      exclude_skus:
        description: Comma-list of runner pools to drop from the matrix (partial run, e.g. b300); disjoint from only_sku; blank = none
        type: string
        default: ''
      ep_sizes:
        description: Keep only shards whose expert-parallel degree is in this comma-list (8 keeps EP8 only, dropping EP16 so GB SKUs co-schedule with 8-GPU SKUs; blank = all)
        type: string
        default: ''
      modes:
        description: "Keep only shards in this comma-list of modes (normal, low-latency); low-latency is a decode-only EP8 addition; blank = all"
        type: string
        default: ''
      refresh_image:
        description: "Force a fresh container image import even when a staged squash exists — only needed when a tag moved upstream and its digest could not be resolved from the submit host"
        type: boolean
        default: false
      fp8_consume:
        description: "DIAGNOSTIC ONLY. 'dequant' puts the FP8 dequant back inside the chain, so staging is no longer hoisted; changes what is measured. Use native for the production model."
        type: choice
        default: native
        options: [native, dequant]
concurrency:
  group: cx-${{ github.ref }}-${{ inputs.backend }}-${{ inputs.only_sku }}
  cancel-in-progress: false

jobs:
  # ---- setup: generate the shard matrix and upload its requested coverage ----
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      n: ${{ steps.gen.outputs.n }}
      priority: ${{ steps.score.outputs.priority }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: true, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: score
        shell: python3 {0} # zizmor: ignore[misfeature] -- Runners provide python3; bootstrap uses Python without shell interpolation.
        run: |
          import json
          import os
          import subprocess

          result = subprocess.run(
              ["uv", "run", "--no-project", "--exclude-newer", "PT12H", "--python", "3.12",
               "--with", "pyyaml", "python", "-m", "infx.workflows.ci_priority"],
              input='[{"runner":"collectivex","framework":"collectivex"}]',
              stdout=subprocess.PIPE, text=True, check=True,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"priority={json.loads(result.stdout)[0]['priority']}\n")
      - id: gen
        working-directory: experimental/CollectiveX
        env:
          INPUT_BACKEND: ${{ inputs.backend }}
          INPUT_ONLY_SKU: ${{ inputs.only_sku }}
          INPUT_EXCLUDE_SKUS: ${{ inputs.exclude_skus }}
          INPUT_EP_SIZES: ${{ inputs.ep_sizes }}
          INPUT_MODES: ${{ inputs.modes }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 ci.py matrix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cxsweep-matrix-${{ github.run_id }}
          path: experimental/CollectiveX/matrix_full.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # ---- sweep: ONE matrix cell per shard (the parent job with child jobs) ----
  sweep:
    needs: setup
    if: ${{ fromJSON(needs.setup.outputs.n) > 0 }}
    strategy:
      fail-fast: false
      # Global cap; real throttling is each SKU pool's runner count and its cluster's
      # Slurm partition. setup interleaves shards across SKUs so the cap spreads over
      # pools instead of queuing on one. Kept above the total per-pool runner count so a
      # saturated pool's dispatched-but-waiting legs cannot starve pools that have free
      # runners (10 was too low when the shared fleet is busy with concurrent sweeps).
      max-parallel: 30
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' && !endsWith(matrix.sku, '-tw') &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(matrix.sku),
            toJSON(format('nodes:{0}', matrix.nodes)),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              matrix.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(matrix.sku),
            toJSON(format('nodes:{0}', matrix.nodes)),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              matrix.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0}]', toJSON(matrix.sku))
      ) }}
    name: p${{ needs.setup.outputs.priority }} | ${{ matrix.sku }} ${{ matrix.backend }} shard ${{ matrix.id }}
    timeout-minutes: 350
    env:
      COLLX_BENCH: ${{ matrix.backend }}
      COLLX_SWAP_IMAGE: ${{ matrix.vendor == 'amd' && inputs.swap_rocm_image || matrix.sku == 'h100-dgxc' && inputs.swap_h100_image || inputs.swap_image }}
      COLLX_VENDOR: ${{ matrix.vendor }}
      COLLX_SWAP_BLOCK_BYTES: ${{ inputs.swap_profile == 'large-blocks' && '257 4096 65536 262144 1048576 4194304 16777216 67108864 268435456 1073741824' || inputs.swap_profile == 'standard' && '4096 65536 1048576' || '257 4096 65536 262144' }}
      COLLX_SWAP_MAX_PAYLOAD_BYTES: ${{ inputs.swap_profile == 'large-blocks' && '1073741824' || '2147483648' }}
      COLLX_SWAP_NUM_BLOCKS: '1 4 16 64 256 1024 2048'
      COLLX_SWAP_WARMUP: ${{ inputs.swap_profile == 'standard' && '32' || '4' }}
      COLLX_SWAP_ITERATIONS: ${{ inputs.swap_profile == 'standard' && '100' || '20' }}
      COLLX_SWAP_SEED: '0'
      COLLX_SWAP_DEVICE: '0'
      COLLX_SWAP_TIME: '45'
      COLLX_IMPORT_TMPDIR: ${{ matrix.sku == 'h100-dgxc' && '/var/tmp' || '/tmp' }}
      COLLX_SWAP_STAGED_DIR: ${{ matrix.sku == 'h100-dgxc' && '/mnt/nfs/lustre/containers' || '' }}
      COLLX_NODES: ${{ matrix.nodes }}
      COLLX_GPUS_PER_NODE: ${{ matrix.gpus_per_node }}
      COLLX_SCALE_UP_DOMAIN: ${{ matrix.scale_up_domain }}
      COLLX_SHARD_FILE: .shards/${{ matrix.id }}.json
      COLLX_SHARD_SKU: ${{ matrix.sku }}
      COLLECTIVEX_CANONICAL_GHA: '1'
      COLLECTIVEX_SOURCE_SHA: ${{ github.sha }}
      # Diagnostic hatch, "native" on every normal run. Reaches the ranks because the container
      # srun exports the submitting environment; EPBackend reads it at class-body evaluation.
      # Defaulted here rather than passed through empty: the harness fails closed on an
      # unrecognised value, and a blank input would set the variable to "" -- which is not
      # "unset", so os.environ.get's default never applies and every leg would die at import.
      CX_FP8_CONSUME: ${{ inputs.fp8_consume || 'native' }}
      # The squash cache is content-keyed, so updates normally ride the digest;
      # this is the manual override for a moved tag with an unresolvable digest.
      COLLX_IMAGE_REFRESH: ${{ inputs.refresh_image && '1' || '0' }}
      # Consolidated shards run one bounded build-group in one Slurm allocation;
      # every production pool accepts 300 minutes. Allocations release as soon as
      # the shard finishes.
      COLLX_TIME: '300'
      COLLECTIVEX_EXECUTION_ID: ${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.id }}
      COLLX_JOB_PARENT: ${{ (matrix.launcher == 'mi-amds' || startsWith(matrix.sku, 'mi3') && !endsWith(matrix.sku, '-tw')) && format('/tmp/inferencex-collectivex-parent-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.id) || '/tmp' }}
      COLLX_JOB_ROOT: ${{ (matrix.launcher == 'mi-amds' || startsWith(matrix.sku, 'mi3') && !endsWith(matrix.sku, '-tw')) && format('/tmp/inferencex-collectivex-parent-{0}-{1}-{2}/inferencex-collectivex-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.id) || format('/tmp/inferencex-collectivex-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.id) }}
      COLLX_SOURCE_ROOT: ${{ (matrix.launcher == 'mi-amds' || startsWith(matrix.sku, 'mi3') && !endsWith(matrix.sku, '-tw')) && format('/tmp/inferencex-collectivex-parent-{0}-{1}-{2}/inferencex-collectivex-{0}-{1}-{2}/source', github.run_id, github.run_attempt, matrix.id) || format('/tmp/inferencex-collectivex-{0}-{1}-{2}/source', github.run_id, github.run_attempt, matrix.id) }}
      HOME: ${{ (matrix.launcher == 'mi-amds' || startsWith(matrix.sku, 'mi3') && !endsWith(matrix.sku, '-tw')) && format('/tmp/inferencex-collectivex-parent-{0}-{1}-{2}/inferencex-collectivex-{0}-{1}-{2}/home', github.run_id, github.run_attempt, matrix.id) || format('/tmp/inferencex-collectivex-{0}-{1}-{2}/home', github.run_id, github.run_attempt, matrix.id) }}
    steps:
      # Create the private mode-0700 /tmp job root and git-fetch the exact COLLECTIVEX_SOURCE_SHA into it; shards never execute from the runner's shared checkout.
      - name: Prepare isolated source
        id: source
        env:
          COLLECTIVEX_REPOSITORY: ${{ github.repository }}
        shell: python3 {0} # zizmor: ignore[misfeature] -- Runners provide python3; bootstrap uses Python without shell interpolation.
        run: |
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          env = os.environ
          root, parent = Path(env["COLLX_JOB_ROOT"]), Path(env["COLLX_JOB_PARENT"])
          source = Path(env["COLLX_SOURCE_ROOT"])
          name = r"inferencex-collectivex-([0-9]+)-([0-9]+)-([A-Za-z0-9._-]+)"
          if root.parent != parent or not re.fullmatch(name, root.name):
              raise RuntimeError("CollectiveX isolated root is invalid")
          if source != root / "source":
              raise RuntimeError("CollectiveX source root is invalid")
          if parent != Path("/tmp"):
              if not re.fullmatch(r"/tmp/inferencex-collectivex-parent-[0-9]+-[0-9]+-[A-Za-z0-9._-]+", str(parent)):
                  raise RuntimeError("CollectiveX isolated parent is invalid")
              shared = Path(env["GITHUB_WORKSPACE"]) / ".collectivex-jobs"
              shared.mkdir(parents=True, exist_ok=True, mode=0o700)
              shared.chmod(0o700)
              status = shared.stat()
              if status.st_uid != os.getuid() or status.st_mode & 0o7777 != 0o700:
                  raise RuntimeError("CollectiveX shared parent is unsafe")
              if parent.exists() or parent.is_symlink():
                  raise RuntimeError("CollectiveX isolated parent already exists")
              parent.symlink_to(shared, target_is_directory=True)
          os.umask(0o077)
          if root.exists() or root.is_symlink():
              raise RuntimeError("CollectiveX isolated root already exists")
          root.mkdir(mode=0o700)
          try:
              for directory in (Path(env["HOME"]), root / "control", root / "artifact", source):
                  directory.mkdir(mode=0o700)
              git_env = {**env, "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null"}
              commands = [
                  ["git", "init", "-q", str(source)],
                  ["git", "-C", str(source), "remote", "add", "origin",
                   f"https://github.com/{env['COLLECTIVEX_REPOSITORY']}.git"],
                  ["git", "-C", str(source), "-c", "credential.helper=", "-c", "protocol.version=2",
                   "fetch", "-q", "--no-tags", "--depth=1", "origin", env["COLLECTIVEX_SOURCE_SHA"]],
                  ["git", "-C", str(source), "-c", "advice.detachedHead=false", "checkout", "-q", "--detach", "FETCH_HEAD"],
              ]
              for command in commands:
                  subprocess.run(command, env=git_env, check=True)
              sha = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], env=git_env, text=True).strip()
              if sha != env["COLLECTIVEX_SOURCE_SHA"]:
                  raise RuntimeError("CollectiveX source preparation failed")
              with open(env["GITHUB_OUTPUT"], "a") as output:
                  output.write("prepared=true\n")
          except BaseException:
              shutil.rmtree(root)
              if parent != Path("/tmp"):
                  parent.unlink()
              raise
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cxsweep-matrix-${{ github.run_id }}
          path: ${{ env.COLLX_JOB_ROOT }}/control
      # Materialize this shard's .shards/<id>.json case control from the run-scoped matrix artifact downloaded above.
      - name: Extract execution control
        if: matrix.backend != 'swap-blocks'
        env:
          MATRIX_ID: ${{ matrix.id }}
        working-directory: ${{ env.COLLX_SOURCE_ROOT }}/experimental/CollectiveX
        run: python3 ci.py extract

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # Invoke the venv interpreter directly after sync. Activating it would leak its PATH
      # and VIRTUAL_ENV into worker containers, which must keep the pinned image's Python.
      - name: Install orchestration dependencies
        id: runtime
        working-directory: ${{ env.COLLX_SOURCE_ROOT }}
        run: uv sync --locked --extra collectivex --no-default-groups
      - name: Execute sweep cell ${{ matrix.id }}
        id: sweep_shard
        working-directory: ${{ env.COLLX_SOURCE_ROOT }}
        run: .venv/bin/python experimental/CollectiveX/ci.py execute

      # always(): recover the recorded allocation/containers, collect partial results,
      # and render both views. The benchmark's return code remains the case gate.
      - name: Summarize and stage shard results
        id: stage_artifact
        if: ${{ always() && steps.source.outputs.prepared == 'true' && steps.runtime.conclusion == 'success' }}
        working-directory: ${{ env.COLLX_SOURCE_ROOT }}
        run: .venv/bin/python experimental/CollectiveX/ci.py finalize
      # The neutral per-case JSONs are the workflow's only output; a consumer downloads them and decides what to display.
      - name: Upload shard results
        id: upload_artifact
        if: always() && steps.stage_artifact.outputs.staged == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('cxshard-{0}-{1}-{2}', matrix.id, github.run_id, github.run_attempt) }}
          path: |
            ${{ env.COLLX_JOB_ROOT }}/artifact/*.json
          if-no-files-found: error
          retention-days: 14
      # Delete the private /tmp job root after the preceding step releases any allocation.
      - name: Cleanup isolated workspace
        if: ${{ always() && steps.source.outputs.prepared == 'true' }}
        working-directory: ${{ env.COLLX_SOURCE_ROOT }}
        run: python3 experimental/CollectiveX/ci.py cleanup
