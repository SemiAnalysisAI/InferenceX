name: Lint Python

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'infx/ruff.toml'
      - '.github/workflows/lint-python.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'infx/ruff.toml'
      - '.github/workflows/lint-python.yml'

permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.7"

jobs:
  ruff:
    name: ruff (infx)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: ruff check
        run: uvx --exclude-newer PT12H "ruff==${RUFF_VERSION}" check --output-format=github infx

      - name: ruff format --check
        run: uvx --exclude-newer PT12H "ruff==${RUFF_VERSION}" format --check --diff infx
