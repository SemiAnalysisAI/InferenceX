name: Test Process Result

on:
  pull_request:
    paths:
      - 'infx/results/**'
      - 'infx/bench_serving/**'
      - '.github/workflows/benchmark-multinode-tmpl.yml'
      - '.github/workflows/benchmark-tmpl.yml'
      - '.github/workflows/e2e-tests.yml'
      - '.github/workflows/test-process-result.yml'
      - 'benchmarks/benchmark_lib.sh'
      - 'benchmarks/multi_node/srt-slurm-recipes/sglang/deepseek-v4/**/*.yaml'
      - 'benchmarks/multi_node/srt-slurm-recipes/vllm/deepseek-v4/**/*.yaml'
      - 'benchmarks/multi_node/srt-slurm-recipes/vllm/kimi-k2.6/b200-fp4/**/*.yaml'
      - 'benchmarks/multi_node/srt-slurm-recipes/sglang/deepseek-v4/agentic/agg-h200-tp8-mtp-kvoffload.yaml'
      - 'benchmarks/multi_node/srt-slurm-recipes/sglang/glm5.2/agentic/disagg-h200-2p2d-pcp8-tp8-dp8-mtp.yaml'
      - 'benchmarks/multi_node/srt-slurm-recipes/sglang/qwen3.5/gb200-*/**/*.yaml'
      - 'benchmarks/multi_node/srt-slurm-recipes/sglang/qwen3.5/gb300-*/**/*.yaml'
      - 'configs/nvidia-master.yaml'
      - 'runners/launch_gb200-nv.sh'
      - 'runners/launch_gb300-nv.sh'
      - 'runners/launch_b200-nscale-slurm.sh'
      - 'runners/launch_b200-nscale-compat.sh'
      - 'runners/launch_b300-dsxe.sh'
      - 'runners/launch_h200-dgxc-slurm.sh'
      - 'runners/inject_srt_power_concurrencies.py'
      - 'utils/aggregate_power.py'
      - 'utils/aggregate_power_multinode.py'
      - 'utils/agentic/aggregation/**'
      - 'utils/pytest.ini'
      - 'utils/bench_serving/benchmark_serving.py'
      - 'utils/process_result.py'
      - 'utils/test_aggregate_power.py'
      - 'utils/test_aggregate_power_multinode.py'
      - 'utils/test_gb300_power_official_contract.py'
      - 'utils/test_inject_srt_power_concurrencies.py'
      - 'utils/test_process_result.py'
      - 'runners/powerx_8k1k.sh'
      - 'runners/prepare_srt_power.py'
      - 'runners/launch_h100-dgxc-slurm.sh'
      - 'utils/test_prepare_srt_power.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run pytest
        run: |
          cd utils
          uv run --no-project --exclude-newer PT12H --python 3.12 --with pytest --with pyyaml \
            python -m pytest test_aggregate_power.py test_aggregate_power_multinode.py agentic/aggregation/ test_gb300_power_official_contract.py test_inject_srt_power_concurrencies.py test_process_result.py test_prepare_srt_power.py -v
