name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &ci-paths
      - '**/*.py'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/mcp-ci.json'
      - '.claude/mcp/**'
      - '.claude/requirements-mcp.txt'
      - 'infx/**'
      - 'utils/**'
      - 'runners/**'
      - 'benchmarks/**'
      - 'configs/**'
      - 'experimental/CollectiveX/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths: *ci-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Lint
            paths: >-
              :(glob)**/*.py infx/ruff.toml .github/workflows/ci.yml
          - check: Tests
            paths: >-
              :(glob)**/*.py infx/ utils/ runners/ benchmarks/ configs/
              experimental/CollectiveX/ .github/workflows/ .github/scripts/
              .github/mcp-ci.json .claude/mcp/ .claude/requirements-mcp.txt
              :(exclude,glob)**/*.md :(exclude)infx/ruff.toml
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_PATHS: ${{ matrix.paths }}
        run: |
          read -r -a paths <<< "$CHECK_PATHS"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            needed=true
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- "${paths[@]}"; then
            needed=false
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.changes.outputs.needed == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Lint and format
        if: matrix.check == 'Lint' && steps.changes.outputs.needed == 'true'
        run: |
          uvx --exclude-newer PT12H ruff@latest check --output-format=github infx
          uvx --exclude-newer PT12H ruff@latest format --check --diff infx

      - name: Prepare test environment
        if: matrix.check == 'Tests' && steps.changes.outputs.needed == 'true'
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/test-venv"
          uv pip install --python "$RUNNER_TEMP/test-venv/bin/python" \
            --exclude-newer PT12H --torch-backend cpu \
            -r .claude/requirements-mcp.txt \
            pytest pytest-xdist pydantic tabulate codeowners \
            numpy aiohttp transformers matplotlib torch packaging
          echo "$RUNNER_TEMP/test-venv/bin" >> "$GITHUB_PATH"

      - name: Verify MCP server compatibility
        if: matrix.check == 'Tests' && steps.changes.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import asyncio
          import runpy

          module = runpy.run_path(".claude/mcp/server.py")
          server = module["InferenceXMCPServer"]()
          tools = asyncio.run(server.list_tools())
          assert any(tool.name == "list_versions" for tool in tools)
          assert asyncio.run(server.list_resources()) == []
          print("MCP server construction and discovery passed.")
          PY

      - name: Run tests
        if: matrix.check == 'Tests' && steps.changes.outputs.needed == 'true'
        run: |
          python -c "import torch; assert torch.version.cuda is None and torch.version.hip is None"
          python -m pytest utils/ runners/ experimental/CollectiveX/tests/ -n 4
