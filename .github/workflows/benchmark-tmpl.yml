name: Template - Benchmark
on:
  workflow_call:
    inputs:
      klaud-run:
        description: "Run Klaud Cold benchmarks at background priority"
        required: false
        type: boolean
        default: false
      runner:
        required: true
        type: string
      priority:
        description: "Higher-is-sooner CI priority score"
        required: true
        type: string
      queue-token:
        description: "One-shot queue token generated for this job"
        required: true
        type: string
      skip-queue-pr:
        description: "Requested skip_queue PR number"
        required: false
        type: string
        default: ''
      image:
        required: true
        type: string
      model:
        required: true
        type: string
      model-prefix:
        required: true
        type: string
      precision:
        required: true
        type: string
      framework:
        required: true
        type: string
      exp-name:
        required: true
        type: string
      recipe-fingerprint:
        description: "Deterministic generated-recipe identity"
        required: false
        type: string
        default: ''
      isl:
        required: true
        type: string
      osl:
        required: true
        type: string
      tp:
        required: true
        type: string
      pp:
        required: false
        type: string
        default: '1'
      dcp-size:
        required: false
        type: string
        default: '1'
      pcp-size:
        required: false
        type: string
        default: '1'

      ep:
        required: true
        type: string
      dp-attn:
        required: true
        type: boolean
      max-model-len:
        required: true
        type: string
      conc:
        required: true
        type: string
      spec-decoding:
        required: true
        type: string
      disagg:
        required: true
        type: string
      run-eval:
        type: boolean
        required: true
        default: false
      eval-only:
        description: "Run only evals (skip throughput benchmark)"
        type: boolean
        required: false
        default: false
      eval-framework:
        description: "Eval runner (lm-eval, swebench, kimi-vendor, minimax-vendor, or bfcl)"
        type: string
        required: false
        default: "lm-eval"
      eval-suite:
        description: "Eval suite (kimi_tool_call_schema, kimi_tool_call_schema_full, minimax_m3_smoke, minimax_m3_full, bfcl_smoke, bfcl_vllm_minimax_m3, or bfcl_vllm_kimi); empty for lm-eval and swebench"
        type: string
        required: false
        default: ""
      random-range-ratio:
        required: false
        type: string
        default: '0.8'
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string
      # Agentic-coding inputs. Fixed-seq-len jobs leave these empty.
      scenario-type:
        description: "Scenario type (fixed-seq-len or agentic-coding)"
        required: false
        type: string
        default: 'fixed-seq-len'
      kv-offloading:
        description: "KV offload mode for agentic scenarios (none/dram)"
        required: false
        type: string
      kv-offload-backend:
        description: "KV offload backend for agentic scenarios when kv-offloading is not none"
        required: false
        type: string
      kv-offload-backend-metadata:
        description: "Optional KV offload backend name and version metadata as JSON"
        required: false
        type: string
      router:
        description: "Optional router name and version metadata as JSON"
        required: false
        type: string
      kv-p2p-transfer:
        description: "Optional multinode peer-to-peer KV transfer engine name"
        required: false
        type: string
      total-cpu-dram-gb:
        description: "Configured CPU DRAM capacity in GB for KV offloading"
        required: false
        type: string
        default: '0'
      duration:
        description: "Benchmark duration in seconds"
        required: false
        type: string
        default: '3600'
      require-power:
        description: "Fail result processing when GPU power is invalid"
        required: false
        type: boolean
        default: false
      agentx-fast:
        description: "Use one warmup request per AgentX lane and a 20-minute profile"
        required: false
        type: boolean
        default: false
      eval-limit:
        description: "Eval instance count: empty/full = whole split (default); N = first-N smoke slice"
        required: false
        type: string
        default: ""
      swebench-gen-mode:
        description: "SWE-bench generation mode (single-shot | agentic). Empty = agentic (single-shot is an explicit debugging escape hatch)."
        required: false
        type: string
        default: ""
jobs:
  benchmark:
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          (
            inputs.skip-queue-pr != '' &&
            format(
              '["self-hosted",{0},{1},{2},{3},{4}]',
              toJSON(inputs.runner),
              toJSON('nodes:1'),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt)),
              toJSON(format('ci-skip-queue-pr-{0}', inputs.skip-queue-pr))
            ) ||
            format(
              '["self-hosted",{0},{1},{2},{3}]',
              toJSON(inputs.runner),
              toJSON('nodes:1'),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt))
            )
          ) ||
          (
            inputs.skip-queue-pr != '' &&
            format(
              '["self-hosted",{0},{1},{2},{3}]',
              toJSON(inputs.runner),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt)),
              toJSON(format('ci-skip-queue-pr-{0}', inputs.skip-queue-pr))
            ) ||
            format(
              '["self-hosted",{0},{1},{2}]',
              toJSON(inputs.runner),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt))
            )
          )
        ) ||
        format('[{0}]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 6
    name: Repair and verify HF config cache for PR 2912
    steps:
      - name: Restore verified public config using normal cache-owner permissions
        shell: bash
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Restore one verified public HF config using the cache owner's normal rights."""
          import errno
          import fcntl
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import stat
          import tempfile
          import time
          import urllib.request
          import uuid

          MODEL = "deepseek-ai/DeepSeek-V4-Pro"
          REVISION = "b5968e9190ef611bbf34a7229255be88a0e937c1"
          BLOB = "025a1ca59cb255296f274d4ef5e0ea632a0d6384"
          SIZE = 1828
          URL = f"https://huggingface.co/{MODEL}/resolve/{REVISION}/config.json"


          def verify(data):
              digest = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if len(data) != SIZE or digest != BLOB:
                  raise RuntimeError(f"Official config identity mismatch: size={len(data)}, git_blob={digest}")
              if not isinstance(json.loads(data), dict):
                  raise RuntimeError("Config must be a JSON object")


          def signature(s):
              return (s.st_dev, s.st_ino, s.st_uid, s.st_gid, s.st_mode, s.st_size, s.st_mtime_ns)


          def repair(cache, data, *, expected_owner=0, expected_mode=0o600):
              verify(data)
              cache = Path(cache)
              repo = cache / "models--deepseek-ai--DeepSeek-V4-Pro"
              directory = repo / "blobs"
              blob = directory / BLOB
              pointer = repo / "snapshots" / REVISION / "config.json"
              for parent in (cache, repo, directory, repo / "snapshots", pointer.parent):
                  info = parent.lstat()
                  if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.geteuid():
                      raise RuntimeError(f"Not a directory owned by the current cache user: {parent}")
              if not pointer.is_symlink() or os.readlink(pointer) != f"../../blobs/{BLOB}" or pointer.resolve(strict=True) != blob:
                  raise RuntimeError("Snapshot config does not point to the expected canonical blob")
              pointer_before = pointer.lstat()
              lock_dir = cache / ".locks" / repo.name
              for parent in (cache / ".locks", lock_dir):
                  try:
                      parent.mkdir()
                  except FileExistsError:
                      pass
                  if not stat.S_ISDIR(parent.lstat().st_mode):
                      raise RuntimeError(f"HF lock parent is not a real directory: {parent}")
              lock_path = lock_dir / f"{BLOB}.lock"
              lock_fd = os.open(lock_path, os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW | os.O_CLOEXEC, 0o664)
              temporary = None
              backup = None
              try:
                  if not stat.S_ISREG(os.fstat(lock_fd).st_mode):
                      raise RuntimeError("HF lock is not a regular file")
                  deadline = time.monotonic() + 15
                  while True:
                      try:
                          fcntl.flock(lock_fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                          break
                      except BlockingIOError:
                          if time.monotonic() >= deadline:
                              raise RuntimeError("Timed out waiting for the standard HF config-blob lock")
                          time.sleep(0.1)
                  before = blob.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_size != SIZE:
                      raise RuntimeError("Unexpected config blob type or size")
                  try:
                      current = pointer.read_bytes()
                  except PermissionError:
                      if before.st_uid != expected_owner or stat.S_IMODE(before.st_mode) != expected_mode:
                          raise RuntimeError("Unreadable config does not match the diagnosed owner/mode")
                  else:
                      verify(current)
                      return {"status": "already-correct", "blob": str(blob), "git_blob": BLOB}

                  fd, filename = tempfile.mkstemp(prefix=".pr2912-config-new-", dir=directory)
                  temporary = Path(filename)
                  with os.fdopen(fd, "wb") as stream:
                      stream.write(data)
                      stream.flush()
                      os.fchmod(stream.fileno(), 0o644)
                      os.fsync(stream.fileno())
                      new_identity = (os.fstat(stream.fileno()).st_dev, os.fstat(stream.fileno()).st_ino)
                  if (signature(blob.lstat()) != signature(before)
                          or signature(pointer.lstat()) != signature(pointer_before)
                          or pointer.resolve(strict=True) != blob):
                      raise RuntimeError("Cache entry changed during repair; refusing replacement")
                  backup = directory / f"{BLOB}.pr2912-backup-{uuid.uuid4().hex}"
                  print(json.dumps({"status": "prepared", "backup": str(backup),
                                    "publication": "backup-rename-then-replace"}), flush=True)
                  try:
                      os.rename(blob, backup)
                      os.replace(temporary, blob)
                      temporary = None
                      published = blob.lstat()
                      if ((published.st_dev, published.st_ino) != new_identity
                              or published.st_uid != os.geteuid()
                              or stat.S_IMODE(published.st_mode) != 0o644):
                          raise RuntimeError("Published config does not match the prepared file")
                      verify(pointer.read_bytes())
                  except BaseException:
                      if backup.exists():
                          try:
                              live = blob.lstat()
                          except FileNotFoundError:
                              live = None
                          if live is not None and (live.st_dev, live.st_ino) != new_identity:
                              raise RuntimeError(f"Concurrent replacement detected; retained original at {backup}")
                          os.replace(backup, blob)
                          backup = None
                      raise
                  after = blob.stat()
                  saved = backup.stat()
                  if signature(saved) != signature(before):
                      raise RuntimeError("Backup attributes changed unexpectedly")
                  directory_fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
                  try:
                      try:
                          os.fsync(directory_fd)
                          directory_sync = "success"
                      except OSError as exc:
                          if exc.errno not in (errno.EINVAL, errno.ENOTSUP):
                              raise
                          directory_sync = "unsupported"
                  finally:
                      os.close(directory_fd)
                  return {"status": "repaired", "model": MODEL, "revision": REVISION,
                          "git_blob": BLOB, "sha256": hashlib.sha256(data).hexdigest(),
                          "blob": str(blob), "backup": str(backup), "bytes": SIZE,
                          "directory_fsync": directory_sync,
                          "before": {"uid": before.st_uid, "gid": before.st_gid,
                                     "mode": oct(stat.S_IMODE(before.st_mode))},
                          "after": {"uid": after.st_uid, "gid": after.st_gid,
                                    "mode": oct(stat.S_IMODE(after.st_mode))}}
              finally:
                  if temporary is not None:
                      temporary.unlink(missing_ok=True)
                  os.close(lock_fd)


          def main():
              def interrupted(signum, frame):
                  raise SystemExit(128 + signum)

              signal.signal(signal.SIGTERM, interrupted)
              if os.geteuid() != 300071:
                  raise RuntimeError("Expected the audited normal CI user UID 300071")
              with urllib.request.urlopen(URL, timeout=30) as response:
                  data = response.read(SIZE + 1)
              verify(data)
              print(json.dumps(repair(Path("/it-share/hf-hub-cache"), data), indent=2))


          if __name__ == "__main__":
              main()
          PY
      - name: Verify all snapshot files and load tokenizer in the pinned container
        shell: bash
        run: |
          VERIFY_SCRIPT=$(cat <<'PY'
          #!/usr/bin/env python3
          """Bounded, read-only HF cache audit. File bytes are never included in output."""
          import argparse
          import json
          import os
          import shutil
          import socket
          import stat
          import subprocess

          MODEL = "deepseek-ai/DeepSeek-V4-Pro"
          REVISION = "b5968e9190ef611bbf34a7229255be88a0e937c1"
          LIMIT = 200


          def error(exc):
              return {"type": type(exc).__name__, "errno": getattr(exc, "errno", None),
                      "message": str(exc)[:400]}


          def command(argv, timeout=2):
              try:
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=timeout,
                                          check=False, stdin=subprocess.DEVNULL)
                  return {"returncode": result.returncode, "stdout": result.stdout[:8192],
                          "stderr": result.stderr[:1024]}
              except Exception as exc:
                  return {"error": error(exc)}


          def stat_info(path, follow=True):
              try:
                  s = os.stat(path, follow_symlinks=follow)
                  return {"ok": True, "mode": oct(stat.S_IMODE(s.st_mode)),
                          "mode_text": stat.filemode(s.st_mode), "uid": s.st_uid,
                          "gid": s.st_gid, "size": s.st_size, "device": s.st_dev,
                          "inode": s.st_ino, "regular": stat.S_ISREG(s.st_mode),
                          "directory": stat.S_ISDIR(s.st_mode), "symlink": stat.S_ISLNK(s.st_mode)}
              except Exception as exc:
                  return {"ok": False, "error": error(exc)}


          def describe(path):
              result = {"path": path, "lstat": stat_info(path, False), "stat": stat_info(path)}
              if result["lstat"].get("symlink"):
                  try:
                      result["readlink"] = os.readlink(path)
                  except Exception as exc:
                      result["readlink_error"] = error(exc)
              return result


          def read_probe(path):
              fd = None
              try:
                  fd = os.open(path, os.O_RDONLY | os.O_NONBLOCK | os.O_CLOEXEC)
                  if not stat.S_ISREG(os.fstat(fd).st_mode):
                      return {"ok": False, "skipped": "not a regular file"}
                  return {"ok": True, "bytes_read": len(os.read(fd, 1))}
              except Exception as exc:
                  return {"ok": False, "error": error(exc)}
              finally:
                  if fd is not None:
                      os.close(fd)


          def read_map(path):
              try:
                  with open(path, "r", encoding="ascii") as stream:
                      data = stream.read(4096)
                  return {"ok": True, "ranges": [dict(zip(("inside", "outside", "count"),
                                                          map(int, line.split())))
                                                  for line in data.splitlines()]}
              except Exception as exc:
                  return {"ok": False, "error": error(exc)}


          class Parser(argparse.ArgumentParser):
              def error(self, message):
                  raise ValueError(message)


          def audit(args, result):
              cache = os.path.abspath(args.cache_root)
              snapshot = os.path.join(cache, "models--deepseek-ai--DeepSeek-V4-Pro", "snapshots", REVISION)
              result.update(cache_root=cache, snapshot=snapshot, hostname=socket.gethostname(),
                            identity={"uid": os.getuid(), "euid": os.geteuid(), "gid": os.getgid(),
                                      "egid": os.getegid(), "groups": os.getgroups(),
                                      "id": command(["id"]), "uid_map": read_map("/proc/self/uid_map"),
                                      "gid_map": read_map("/proc/self/gid_map")},
                            parent_paths=[], files=[], scan_errors=[])
              parents = set()

              def add_parents(path):
                  chain = []
                  while path not in parents and len(chain) < 64:
                      chain.append(path)
                      parent = os.path.dirname(path)
                      if parent == path:
                          break
                      path = parent
                  for item in reversed(chain):
                      if len(parents) >= 64:
                          result["parent_paths_truncated"] = True
                          break
                      parents.add(item)
                      result["parent_paths"].append(describe(item))

              add_parents(snapshot)
              pending, visited = [snapshot], 0
              while pending and visited < LIMIT:
                  directory = pending.pop()
                  try:
                      with os.scandir(directory) as entries:
                          for entry in entries:
                              if visited >= LIMIT:
                                  result["scan_truncated"] = True
                                  break
                              visited += 1
                              record = describe(entry.path)
                              if record["lstat"].get("directory"):
                                  pending.append(entry.path)
                                  add_parents(entry.path)
                                  continue
                              record["category"] = ("safetensors" if entry.name.endswith(".safetensors")
                                                    else "metadata")
                              try:
                                  resolved = os.path.realpath(entry.path)
                                  record["resolved_target"] = {"path": resolved, "stat": stat_info(resolved)}
                                  add_parents(os.path.dirname(resolved))
                              except Exception as exc:
                                  record["resolved_target_error"] = error(exc)
                              record["read_probe"] = (read_probe(entry.path) if record["stat"].get("regular")
                                                      or not record["stat"]["ok"] else
                                                      {"ok": False, "skipped": "not a regular file"})
                              result["files"].append(record)
                  except Exception as exc:
                      result["scan_errors"].append({"path": directory, "error": error(exc)})
              result.update(entries_visited=visited, scan_truncated=bool(pending) or result.get("scan_truncated", False))
              result["summary"] = {}
              for category in ("metadata", "safetensors"):
                  files = [r for r in result["files"] if r["category"] == category]
                  failed = [r["path"] for r in files if "error" in r["read_probe"]]
                  skipped = [r["path"] for r in files if "skipped" in r["read_probe"]]
                  result["summary"][category] = {"examined": len(files),
                                                "readable": sum(r["read_probe"]["ok"] for r in files),
                                                "read_failures": failed, "skipped": skipped}
              result["summary"]["complete_scan"] = not result["scan_truncated"] and not result["scan_errors"]
              result["summary"]["metadata_definition"] = "All snapshot files except *.safetensors; may include documentation/assets."
              if args.getfacl:
                  acl = shutil.which("getfacl")
                  result["getfacl"] = {"available": bool(acl), "limit": 24, "paths": []}
                  candidates = [r["path"] for r in result["parent_paths"]]
                  for record in sorted(result["files"], key=lambda r: (r["read_probe"]["ok"], r["path"])):
                      candidates += [record["path"], record.get("resolved_target", {}).get("path", record["path"])]
                  unique = list(dict.fromkeys(candidates))
                  result["getfacl"]["truncated"] = len(unique) > 24
                  if acl:
                      for path in unique[:24]:
                          result["getfacl"]["paths"].append({"path": path, **command([acl, "-cpn", "--", path], 1)})



          def main():
              result = {"model": MODEL, "revision": REVISION}
              audit(argparse.Namespace(cache_root="/mnt/hf_hub_cache", getfacl=False), result)
              print(json.dumps({"stage": "container-cache-verification", "hostname": result["hostname"],
                                "identity": result["identity"], "summary": result["summary"],
                                "config": next((f for f in result["files"] if f["path"] ==
                                               result["snapshot"] + "/config.json"), None)}, indent=2), flush=True)
              if not result["summary"]["complete_scan"]:
                  raise RuntimeError("Cache scan was incomplete")
              for category, expected in (("metadata", 27), ("safetensors", 64)):
                  summary = result["summary"][category]
                  if summary["examined"] != expected or summary["readable"] != expected:
                      raise RuntimeError(f"Cache remains unreadable or differs from audited snapshot: {category}")
              os.environ["HF_HUB_CACHE"] = "/mnt/hf_hub_cache"
              os.environ["HF_HUB_OFFLINE"] = "1"
              os.environ["TRANSFORMERS_OFFLINE"] = "1"
              os.environ["HF_HUB_DISABLE_TELEMETRY"] = "1"
              from huggingface_hub import hf_hub_download
              from transformers import AutoTokenizer
              config_path = hf_hub_download(MODEL, "config.json", local_files_only=True)
              if config_path != result["snapshot"] + "/config.json":
                  raise RuntimeError(f"Default model revision changed: {config_path}")
              tokenizer = AutoTokenizer.from_pretrained(MODEL, local_files_only=True)
              token_ids = tokenizer.encode("Hello, CI cache.", add_special_tokens=False)
              if not token_ids or not tokenizer.decode(token_ids):
                  raise RuntimeError("Tokenizer encode/decode failed")
              print(json.dumps({"stage": "tokenizer", "status": "success", "model": MODEL,
                                "config_path": config_path, "tokenizer_class": type(tokenizer).__name__,
                                "vocab_size": len(tokenizer), "test_tokens": len(token_ids)}), flush=True)


          if __name__ == "__main__":
              main()
          PY
          )
          srun --partition=compute --nodes=1 --ntasks=1 --cpus-per-task=1 --time=00:02:00 --immediate=30 \
            --nodelist=mia1-p01-g11 --job-name="pr2912-hf-cache-verify-${GITHUB_RUN_ID}" \
            --container-image=/var/lib/squash/rocm_atom-dev_nightly_202609121454.sqsh \
            --container-mounts=/it-share/hf-hub-cache/:/mnt/hf_hub_cache/:ro \
            --container-workdir=/tmp --container-remap-root --no-container-entrypoint \
            python3 -c "$VERIFY_SCRIPT"
