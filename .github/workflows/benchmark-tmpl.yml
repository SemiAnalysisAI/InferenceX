name: Template - Benchmark
on:
  workflow_call:
    inputs:
      klaud-run:
        description: "Run Klaud Cold benchmarks at background priority"
        required: false
        type: boolean
        default: false
      runner:
        required: true
        type: string
      priority:
        description: "Higher-is-sooner CI priority score"
        required: true
        type: string
      queue-token:
        description: "One-shot queue token generated for this job"
        required: true
        type: string
      skip-queue-pr:
        description: "Requested skip_queue PR number"
        required: false
        type: string
        default: ''
      image:
        required: true
        type: string
      model:
        required: true
        type: string
      model-prefix:
        required: true
        type: string
      precision:
        required: true
        type: string
      framework:
        required: true
        type: string
      exp-name:
        required: true
        type: string
      recipe-fingerprint:
        description: "Deterministic generated-recipe identity"
        required: false
        type: string
        default: ''
      isl:
        required: true
        type: string
      osl:
        required: true
        type: string
      tp:
        required: true
        type: string
      pp:
        required: false
        type: string
        default: '1'
      dcp-size:
        required: false
        type: string
        default: '1'
      pcp-size:
        required: false
        type: string
        default: '1'

      ep:
        required: true
        type: string
      dp-attn:
        required: true
        type: boolean
      max-model-len:
        required: true
        type: string
      conc:
        required: true
        type: string
      spec-decoding:
        required: true
        type: string
      disagg:
        required: true
        type: string
      run-eval:
        type: boolean
        required: true
        default: false
      eval-only:
        description: "Run only evals (skip throughput benchmark)"
        type: boolean
        required: false
        default: false
      eval-framework:
        description: "Eval runner (lm-eval, swebench, kimi-vendor, minimax-vendor, or bfcl)"
        type: string
        required: false
        default: "lm-eval"
      eval-suite:
        description: "Eval suite (kimi_tool_call_schema, kimi_tool_call_schema_full, minimax_m3_smoke, minimax_m3_full, bfcl_smoke, bfcl_vllm_minimax_m3, or bfcl_vllm_kimi); empty for lm-eval and swebench"
        type: string
        required: false
        default: ""
      random-range-ratio:
        required: false
        type: string
        default: '0.8'
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string
      # Agentic-coding inputs. Fixed-seq-len jobs leave these empty.
      scenario-type:
        description: "Scenario type (fixed-seq-len or agentic-coding)"
        required: false
        type: string
        default: 'fixed-seq-len'
      kv-offloading:
        description: "KV offload mode for agentic scenarios (none/dram)"
        required: false
        type: string
      kv-offload-backend:
        description: "KV offload backend for agentic scenarios when kv-offloading is not none"
        required: false
        type: string
      kv-offload-backend-metadata:
        description: "Optional KV offload backend name and version metadata as JSON"
        required: false
        type: string
      router:
        description: "Optional router name and version metadata as JSON"
        required: false
        type: string
      kv-p2p-transfer:
        description: "Optional multinode peer-to-peer KV transfer engine name"
        required: false
        type: string
      total-cpu-dram-gb:
        description: "Configured CPU DRAM capacity in GB for KV offloading"
        required: false
        type: string
        default: '0'
      duration:
        description: "Benchmark duration in seconds"
        required: false
        type: string
        default: '3600'
      require-power:
        description: "Fail result processing when GPU power is invalid"
        required: false
        type: boolean
        default: false
      agentx-fast:
        description: "Use one warmup request per AgentX lane and a 20-minute profile"
        required: false
        type: boolean
        default: false
      eval-limit:
        description: "Eval instance count: empty/full = whole split (default); N = first-N smoke slice"
        required: false
        type: string
        default: ""
      swebench-gen-mode:
        description: "SWE-bench generation mode (single-shot | agentic). Empty = agentic (single-shot is an explicit debugging escape hatch)."
        required: false
        type: string
        default: ""
jobs:
  benchmark:
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          (
            inputs.skip-queue-pr != '' &&
            format(
              '["self-hosted",{0},{1},{2},{3},{4}]',
              toJSON(inputs.runner),
              toJSON('nodes:1'),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt)),
              toJSON(format('ci-skip-queue-pr-{0}', inputs.skip-queue-pr))
            ) ||
            format(
              '["self-hosted",{0},{1},{2},{3}]',
              toJSON(inputs.runner),
              toJSON('nodes:1'),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt))
            )
          ) ||
          (
            inputs.skip-queue-pr != '' &&
            format(
              '["self-hosted",{0},{1},{2},{3}]',
              toJSON(inputs.runner),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt)),
              toJSON(format('ci-skip-queue-pr-{0}', inputs.skip-queue-pr))
            ) ||
            format(
              '["self-hosted",{0},{1},{2}]',
              toJSON(inputs.runner),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt))
            )
          )
        ) ||
        format('[{0}]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 6
    name: Read-only HF cache probe for PR 2912
    steps:
      - name: Inspect model cache as the runner and remapped container user
        run: |
          AUDIT_SCRIPT=$(cat <<'PY'
          #!/usr/bin/env python3
          """Bounded, read-only HF cache audit. File bytes are never included in output."""
          import argparse
          import json
          import os
          import shutil
          import socket
          import stat
          import subprocess

          MODEL = "deepseek-ai/DeepSeek-V4-Pro"
          REVISION = "b5968e9190ef611bbf34a7229255be88a0e937c1"
          LIMIT = 200


          def error(exc):
              return {"type": type(exc).__name__, "errno": getattr(exc, "errno", None),
                      "message": str(exc)[:400]}


          def command(argv, timeout=2):
              try:
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=timeout,
                                          check=False, stdin=subprocess.DEVNULL)
                  return {"returncode": result.returncode, "stdout": result.stdout[:8192],
                          "stderr": result.stderr[:1024]}
              except Exception as exc:
                  return {"error": error(exc)}


          def stat_info(path, follow=True):
              try:
                  s = os.stat(path, follow_symlinks=follow)
                  return {"ok": True, "mode": oct(stat.S_IMODE(s.st_mode)),
                          "mode_text": stat.filemode(s.st_mode), "uid": s.st_uid,
                          "gid": s.st_gid, "size": s.st_size, "device": s.st_dev,
                          "inode": s.st_ino, "regular": stat.S_ISREG(s.st_mode),
                          "directory": stat.S_ISDIR(s.st_mode), "symlink": stat.S_ISLNK(s.st_mode)}
              except Exception as exc:
                  return {"ok": False, "error": error(exc)}


          def describe(path):
              result = {"path": path, "lstat": stat_info(path, False), "stat": stat_info(path)}
              if result["lstat"].get("symlink"):
                  try:
                      result["readlink"] = os.readlink(path)
                  except Exception as exc:
                      result["readlink_error"] = error(exc)
              return result


          def read_probe(path):
              fd = None
              try:
                  fd = os.open(path, os.O_RDONLY | os.O_NONBLOCK | os.O_CLOEXEC)
                  if not stat.S_ISREG(os.fstat(fd).st_mode):
                      return {"ok": False, "skipped": "not a regular file"}
                  return {"ok": True, "bytes_read": len(os.read(fd, 1))}
              except Exception as exc:
                  return {"ok": False, "error": error(exc)}
              finally:
                  if fd is not None:
                      os.close(fd)


          def read_map(path):
              try:
                  with open(path, "r", encoding="ascii") as stream:
                      data = stream.read(4096)
                  return {"ok": True, "ranges": [dict(zip(("inside", "outside", "count"),
                                                          map(int, line.split())))
                                                  for line in data.splitlines()]}
              except Exception as exc:
                  return {"ok": False, "error": error(exc)}


          class Parser(argparse.ArgumentParser):
              def error(self, message):
                  raise ValueError(message)


          def audit(args, result):
              cache = os.path.abspath(args.cache_root)
              snapshot = os.path.join(cache, "models--deepseek-ai--DeepSeek-V4-Pro", "snapshots", REVISION)
              result.update(cache_root=cache, snapshot=snapshot, hostname=socket.gethostname(),
                            identity={"uid": os.getuid(), "euid": os.geteuid(), "gid": os.getgid(),
                                      "egid": os.getegid(), "groups": os.getgroups(),
                                      "id": command(["id"]), "uid_map": read_map("/proc/self/uid_map"),
                                      "gid_map": read_map("/proc/self/gid_map")},
                            parent_paths=[], files=[], scan_errors=[])
              parents = set()

              def add_parents(path):
                  chain = []
                  while path not in parents and len(chain) < 64:
                      chain.append(path)
                      parent = os.path.dirname(path)
                      if parent == path:
                          break
                      path = parent
                  for item in reversed(chain):
                      if len(parents) >= 64:
                          result["parent_paths_truncated"] = True
                          break
                      parents.add(item)
                      result["parent_paths"].append(describe(item))

              add_parents(snapshot)
              pending, visited = [snapshot], 0
              while pending and visited < LIMIT:
                  directory = pending.pop()
                  try:
                      with os.scandir(directory) as entries:
                          for entry in entries:
                              if visited >= LIMIT:
                                  result["scan_truncated"] = True
                                  break
                              visited += 1
                              record = describe(entry.path)
                              if record["lstat"].get("directory"):
                                  pending.append(entry.path)
                                  add_parents(entry.path)
                                  continue
                              record["category"] = ("safetensors" if entry.name.endswith(".safetensors")
                                                    else "metadata")
                              try:
                                  resolved = os.path.realpath(entry.path)
                                  record["resolved_target"] = {"path": resolved, "stat": stat_info(resolved)}
                                  add_parents(os.path.dirname(resolved))
                              except Exception as exc:
                                  record["resolved_target_error"] = error(exc)
                              record["read_probe"] = (read_probe(entry.path) if record["stat"].get("regular")
                                                      or not record["stat"]["ok"] else
                                                      {"ok": False, "skipped": "not a regular file"})
                              result["files"].append(record)
                  except Exception as exc:
                      result["scan_errors"].append({"path": directory, "error": error(exc)})
              result.update(entries_visited=visited, scan_truncated=bool(pending) or result.get("scan_truncated", False))
              result["summary"] = {}
              for category in ("metadata", "safetensors"):
                  files = [r for r in result["files"] if r["category"] == category]
                  failed = [r["path"] for r in files if "error" in r["read_probe"]]
                  skipped = [r["path"] for r in files if "skipped" in r["read_probe"]]
                  result["summary"][category] = {"examined": len(files),
                                                "readable": sum(r["read_probe"]["ok"] for r in files),
                                                "read_failures": failed, "skipped": skipped}
              result["summary"]["complete_scan"] = not result["scan_truncated"] and not result["scan_errors"]
              result["summary"]["metadata_definition"] = "All snapshot files except *.safetensors; may include documentation/assets."
              if args.getfacl:
                  acl = shutil.which("getfacl")
                  result["getfacl"] = {"available": bool(acl), "limit": 24, "paths": []}
                  candidates = [r["path"] for r in result["parent_paths"]]
                  for record in sorted(result["files"], key=lambda r: (r["read_probe"]["ok"], r["path"])):
                      candidates += [record["path"], record.get("resolved_target", {}).get("path", record["path"])]
                  unique = list(dict.fromkeys(candidates))
                  result["getfacl"]["truncated"] = len(unique) > 24
                  if acl:
                      for path in unique[:24]:
                          result["getfacl"]["paths"].append({"path": path, **command([acl, "-cpn", "--", path], 1)})


          def main():
              result = {"schema_version": 1, "model": MODEL, "revision": REVISION, "entry_limit": LIMIT}
              code = 0
              try:
                  parser = Parser(description=__doc__)
                  parser.add_argument("--cache-root", required=True)
                  parser.add_argument("--getfacl", action="store_true", help="Audit up to 24 exact paths; never recursive.")
                  audit(parser.parse_args(), result)
              except Exception as exc:
                  result["fatal_error"] = error(exc)
                  code = 1
              print(json.dumps(result, indent=2, sort_keys=True))
              return code


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          )
          python3 -c "$AUDIT_SCRIPT" --cache-root /it-share/hf-hub-cache --getfacl
          srun --partition=compute --nodes=1 --ntasks=1 --cpus-per-task=1 --time=00:02:00 --immediate=30 \
            --nodelist=mia1-p01-g11 --job-name="pr2912-hf-cache-audit-${GITHUB_RUN_ID}" \
            --container-image=/var/lib/squash/rocm_atom-dev_nightly_202609121454.sqsh \
            --container-mounts=/it-share/hf-hub-cache/:/mnt/hf_hub_cache/:ro \
            --container-workdir=/tmp --container-remap-root --no-container-entrypoint \
            python3 -c "$AUDIT_SCRIPT" --cache-root /mnt/hf_hub_cache --getfacl
