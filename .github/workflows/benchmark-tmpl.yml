name: Template - Benchmark
on:
  workflow_call:
    secrets:
      REPO_PAT:
        required: true
      INFERENCEX_OFFICIAL_RO_HF_TOKEN:
        required: true
      MODAL_TOKEN_ID:
        required: false
      MODAL_TOKEN_SECRET:
        required: false
    inputs:
      config:
        description: "Benchmark configuration as JSON"
        required: true
        type: string
      klaud-run:
        description: "Run Klaud Cold benchmarks at background priority"
        required: false
        type: boolean
        default: false
      runner:
        required: true
        type: string
      priority:
        description: "Higher-is-sooner CI priority score"
        required: true
        type: string
      queue-token:
        description: "One-shot queue token generated for this job"
        required: true
        type: string
      skip-queue-pr:
        description: "Requested skip_queue PR number"
        required: false
        type: string
        default: ''
      dp-attn:
        required: true
        type: boolean
      run-eval:
        type: boolean
        required: true
      eval-only:
        description: "Run only evals (skip throughput benchmark)"
        type: boolean
        required: false
        default: false
      eval-framework:
        description: "Eval runner (lm-eval, swebench, kimi-vendor, minimax-vendor, or bfcl)"
        type: string
        required: false
        default: "lm-eval"
      eval-suite:
        description: "Eval suite (kimi_tool_call_schema, kimi_tool_call_schema_full, minimax_m3_smoke, minimax_m3_full, bfcl_smoke, bfcl_vllm_minimax_m3, or bfcl_vllm_kimi); empty for lm-eval and swebench"
        type: string
        required: false
        default: ""
      random-range-ratio:
        required: false
        type: string
        default: '0.8'
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string
      # Agentic-coding inputs. Fixed-seq-len jobs leave these empty.
      scenario-type:
        description: "Scenario type (fixed-seq-len or agentic-coding)"
        required: false
        type: string
        default: 'fixed-seq-len'
      duration:
        description: "Benchmark duration in seconds"
        required: false
        type: string
        default: '3600'
      require-power:
        description: "Fail result processing when GPU power is invalid"
        required: false
        type: boolean
        default: false
      agentx-fast:
        description: "Use one warmup request per AgentX lane and a 20-minute profile"
        required: false
        type: boolean
        default: false
      eval-limit:
        description: "Eval instance count: empty/full = whole split (default); N = first-N smoke slice"
        required: false
        type: string
        default: ""
      swebench-gen-mode:
        description: "SWE-bench generation mode (single-shot | agentic). Empty = agentic (single-shot is an explicit debugging escape hatch)."
        required: false
        type: string
        default: ""
env:
  PORT: '8888'
  INFMAX_CONTAINER_WORKSPACE: '/workspace'
  DSV41_MIN_CUDAGRAPH_CAPTURE_SIZE: '1'
  MODEL_DOWNLOAD_LOCK_TIMEOUT: '21600'
  ENROOT_IMPORT_TIME_LIMIT: '120'
  SALLOC_TIME_LIMIT: '480'
  GPU_MONITOR_INTERVAL: '1'
  GPU_METRICS_CSV: 'gpu_metrics.csv'
  KEEP_LOGS: '0'
  IS_MULTINODE: 'false'
  RANDOM_RANGE_RATIO: 0.8
  HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
  HF_HUB_CACHE: '/mnt/hf_hub_cache/'
  EXP_NAME: ${{ fromJSON(inputs.config).exp-name }}
  RECIPE_FINGERPRINT: ${{ fromJSON(inputs.config).recipe-fingerprint || '' }}
  MODEL: ${{ fromJSON(inputs.config).model }}
  THINKING_MODE: thinking_on
  MODEL_PREFIX: ${{ fromJSON(inputs.config).model-prefix }}
  ISL: ${{ inputs.scenario-type == 'agentic-coding' && '0' || fromJSON(inputs.config).isl }}
  OSL: ${{ inputs.scenario-type == 'agentic-coding' && '0' || fromJSON(inputs.config).osl }}
  MAX_MODEL_LEN: ${{ inputs.scenario-type == 'agentic-coding' && '0' || fromJSON(inputs.config).max-model-len }}
  IMAGE: ${{ fromJSON(inputs.config).image }}
  FRAMEWORK: ${{ fromJSON(inputs.config).framework }}
  PRECISION: ${{ fromJSON(inputs.config).precision }}
  TP: ${{ fromJSON(inputs.config).tp }}
  PP_SIZE: ${{ fromJSON(inputs.config).pp }}
  DCP_SIZE: ${{ fromJSON(inputs.config).dcp-size }}
  PCP_SIZE: ${{ fromJSON(inputs.config).pcp-size }}
  EP_SIZE: ${{ fromJSON(inputs.config).ep }}
  DP_ATTENTION: ${{ inputs.dp-attn }}
  CONC: ${{ fromJSON(inputs.config).conc }}
  SPEC_DECODING: ${{ fromJSON(inputs.config).spec-decoding }}
  DISAGG: ${{ inputs.scenario-type == 'agentic-coding' && 'false' || fromJSON(inputs.config).disagg }}
  RUN_EVAL: ${{ inputs.run-eval }}
  EVAL_ONLY: ${{ inputs.eval-only }}
  EVAL_FRAMEWORK: ${{ inputs.eval-framework }}
  EVAL_SUITE: ${{ inputs.eval-suite }}
  # Agentic-coding env. Fixed-seq-len jobs leave these empty.
  SCENARIO_TYPE: ${{ inputs.scenario-type }}
  SCENARIO_SUBDIR: ${{ inputs.scenario-type == 'agentic-coding' && 'agentic/' || 'fixed_seq_len/' }}
  IS_AGENTIC: ${{ inputs.scenario-type == 'agentic-coding' && '1' || '0' }}
  KV_OFFLOADING: ${{ inputs.scenario-type == 'agentic-coding' && format('{0}', fromJSON(inputs.config).kv-offloading) || '' }}
  KV_OFFLOAD_BACKEND: ${{ inputs.scenario-type == 'agentic-coding' && format('{0}', fromJSON(inputs.config).kv-offload-backend.name) || '' }}
  KV_OFFLOAD_BACKEND_METADATA: ${{ inputs.scenario-type == 'agentic-coding' && fromJSON(inputs.config).kv-offload-backend && toJSON(fromJSON(inputs.config).kv-offload-backend) || '' }}
  ROUTER_METADATA: ${{ fromJSON(inputs.config).router && toJSON(fromJSON(inputs.config).router) || '' }}
  KV_P2P_TRANSFER: ${{ fromJSON(inputs.config).kv-p2p-transfer || '' }}
  TOTAL_CPU_DRAM_GB: ${{ inputs.scenario-type != 'agentic-coding' && '0' || fromJSON(inputs.config).total-cpu-dram-gb }}
  DURATION: ${{ inputs.duration }}
  REQUIRE_POWER: ${{ inputs.require-power && '1' || '0' }}
  AIPERF_EXPERIMENTAL_FAST: ${{ inputs.agentx-fast && '1' || '0' }}
  EVAL_LIMIT: ${{ inputs.eval-limit }}
  SWEBENCH_GEN_MODE: ${{ inputs.swebench-gen-mode || 'agentic' }}
  AIPERF_FAILED_REQUEST_THRESHOLD: '0.10'
  RESULT_DIR: /workspace/results
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache
  # GPU runners lack Docker for SWE-bench scoring.
  SWEBENCH_USE_MODAL: 'true'
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          (
            inputs.skip-queue-pr != '' &&
            format(
              '["self-hosted",{0},{1},{2},{3},{4}]',
              toJSON(inputs.runner),
              '"nodes:1"',
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt)),
              toJSON(format('ci-skip-queue-pr-{0}', inputs.skip-queue-pr))
            ) ||
            format(
              '["self-hosted",{0},{1},{2},{3}]',
              toJSON(inputs.runner),
              '"nodes:1"',
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt))
            )
          ) ||
          (
            inputs.skip-queue-pr != '' &&
            format(
              '["self-hosted",{0},{1},{2},{3}]',
              toJSON(inputs.runner),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt)),
              toJSON(format('ci-skip-queue-pr-{0}', inputs.skip-queue-pr))
            ) ||
            format(
              '["self-hosted",{0},{1},{2}]',
              toJSON(inputs.runner),
              toJSON(format('ci-job-{0}-{1}', inputs.priority, inputs.queue-token)),
              toJSON(format('ci-attempt-{0}', github.run_attempt))
            )
          )
        ) ||
        format('[{0}]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 500
    name: >-
      ${{ inputs.klaud-run && 'klaud | ' || '' }}p${{ inputs.priority }} | ${{ fromJSON(inputs.config).model-prefix }} ${{ fromJSON(inputs.config).precision }} ${{ inputs.runner }} ${{ fromJSON(inputs.config).framework == 'sglang' && 'sgl' || fromJSON(inputs.config).framework == 'dynamo-sglang' && 'dyn-sgl' || fromJSON(inputs.config).framework == 'sglang-disagg' && 'sgl-disagg' || fromJSON(inputs.config).framework }}
      TP${{ fromJSON(inputs.config).tp }}${{ format('{0}', fromJSON(inputs.config).pp) != '' && format('{0}', fromJSON(inputs.config).pp) != '1' && format('/PP{0}', fromJSON(inputs.config).pp) || '' }}${{ format('{0}', fromJSON(inputs.config).dcp-size) != '' && format('{0}', fromJSON(inputs.config).dcp-size) != '1' && format('/DCP{0}', fromJSON(inputs.config).dcp-size) || '' }}${{ format('{0}', fromJSON(inputs.config).pcp-size) != '' && format('{0}', fromJSON(inputs.config).pcp-size) != '1' && format('/PCP{0}', fromJSON(inputs.config).pcp-size) || '' }}${{ format('{0}', fromJSON(inputs.config).ep) != '' && format('{0}', fromJSON(inputs.config).ep) != '1' && format('/EP{0}', fromJSON(inputs.config).ep) || '' }}${{ inputs.dp-attn && '/DPA' || '' }}
      ${{ fromJSON(inputs.config).spec-decoding != 'none' && fromJSON(inputs.config).spec-decoding || '' }}
      ${{ inputs.scenario-type == 'agentic-coding' && format('{0}', fromJSON(inputs.config).kv-offloading) != '' && fromJSON(inputs.config).kv-offloading != 'none' && format('{0} KV offload', fromJSON(inputs.config).kv-offloading) || '' }}
      ${{ inputs.scenario-type == 'agentic-coding' && fromJSON(inputs.config).kv-offload-backend.name != 'none' && fromJSON(inputs.config).kv-offload-backend.name != 'default' && format('{0}', fromJSON(inputs.config).kv-offload-backend.name) || '' }}
      c${{ fromJSON(inputs.config).conc }}${{ inputs.eval-only && ' | eval-only' || (inputs.run-eval && ' | eval' || '') }}
    steps:
      - name: Repair root-owned artifacts (pre-run)
        if: ${{ inputs.runner == 'cluster:mi355x-amds' }}
        run: |
          if [[ -d "$GITHUB_WORKSPACE" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Resource cleanup (pre-run)
        run: &resource-cleanup |
          # Cleanup Docker resources
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "[Docker] Cleaning up resources ..."
            docker ps -aq | xargs -r docker rm -f
            docker network prune -f
            while [ -n "$(docker ps -aq)" ]; do
              docker ps -a
              sleep 5
            done
          fi

          # Cleanup SLURM resources
          if command -v squeue >/dev/null 2>&1; then
            echo "[Slurm] Cleaning up jobs with name: ${RUNNER_NAME} ..."
            scancel --name="${RUNNER_NAME}" || true
            while [ -n "$(squeue --name="${RUNNER_NAME}" --noheader --format='%i')" ]; do
              squeue --name="${RUNNER_NAME}"
              sleep 5
            done
          fi

      - name: Repair stale git state (pre-run)
        run: |
          # Interrupted runs leave index.lock files and corrupt submodule git
          # dirs behind in the persistent self-hosted workspace, and both make
          # actions/checkout fail before any benchmark starts. The runner
          # executes one job at a time, so any lock found here is stale by
          # definition. Grouping dirs (e.g. .git/modules/utils) hold only
          # nested module dirs, so any dir carrying top-level files is a
          # module git dir — a truncated clone may lack HEAD entirely, and a
          # git dir whose HEAD does not resolve to a commit is dropped
          # together with its worktree so checkout re-clones it.
          repo_dir="${GITHUB_WORKSPACE}"
          if [ -d "${repo_dir}/.git" ]; then
            find "${repo_dir}/.git" -name index.lock -type f -delete || true
            for gitdir in "${repo_dir}"/.git/modules/* "${repo_dir}"/.git/modules/*/*; do
              [ -d "${gitdir}" ] || continue
              [ -n "$(find "${gitdir}" -maxdepth 1 -type f -print -quit)" ] || continue
              if ! git --git-dir="${gitdir}" rev-parse --verify 'HEAD^{commit}' >/dev/null 2>&1; then
                rel="${gitdir##*/.git/modules/}"
                echo "[git-repair] Removing corrupt submodule state: ${rel}"
                rm -rf "${gitdir}" "${repo_dir:?}/${rel}"
              fi
            done
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          clean: true
          submodules: true
          persist-credentials: false

      - name: Launch job script
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_TYPE: ${{ inputs.runner }}
          RESULT_FILENAME_BASE: ${{ env.EXP_NAME }}_${{ env.PRECISION }}_${{ env.FRAMEWORK }}_tp${{ env.TP }}-pp${{ env.PP_SIZE }}-dcp${{ env.DCP_SIZE }}-pcp${{ env.PCP_SIZE }}-ep${{ env.EP_SIZE }}-dpa${{ env.DP_ATTENTION }}_disagg-${{ env.DISAGG }}_spec-${{ env.SPEC_DECODING }}_conc${{ env.CONC }}_${{ runner.name }}
          # Suppress per-job eval markdown from being appended to the step summary.
          # We'll publish a single combined eval table in the collection job instead.
          GITHUB_STEP_SUMMARY: ''
        run: |
          if [[ -f utils/result_filename.py ]]; then
            RESULT_FILENAME=$(python3 utils/result_filename.py)
          else
            # Older measured commits predate the helper; preserve safe identity.
            RESULT_FILENAME=$(printf '%s\0' "$RESULT_FILENAME_BASE" "$RECIPE_FINGERPRINT" | sha256sum)
            RESULT_FILENAME="${RESULT_FILENAME%% *}"
          fi
          export RESULT_FILENAME
          export GPU_COUNT=$((TP * PP_SIZE * PCP_SIZE))
          echo "GPU_COUNT=${GPU_COUNT}" >> "$GITHUB_ENV"

          # Export RESULT_FILENAME early so it's available for artifact uploads even if cancelled
          echo "RESULT_FILENAME=${RESULT_FILENAME}" >> "$GITHUB_ENV"

          # Historical measured revisions own their configuration in the launchers.
          if [[ -f benchmarks/runtime_settings.sh ]]; then
            source benchmarks/runtime_settings.sh
          fi
          if [[ -f runners/runtime_settings.sh ]]; then
            source runners/runtime_settings.sh
          fi
          bash "./runners/launch_${RUNNER_NAME%%_*}.sh"

          if [ "${EVAL_ONLY}" = "true" ]; then
            echo "Eval-only mode: skipping benchmark result file check"
            # Verify eval produced results
            if ! ls results*.json 1>/dev/null 2>&1; then
              echo "Eval-only run failed: no results*.json files found." >&2
              exit 1
            fi
          else
            FOUND_RESULT_FILE=
            for i in {1..10}; do
              if [ -f "$RESULT_FILENAME.json" ]; then
                FOUND_RESULT_FILE=true
                break
              fi
              echo "Waiting for result file... (attempt $i)"
              sleep 1
            done

            if [ -z "$FOUND_RESULT_FILE" ]; then
              echo "Run failed: Benchmark result $RESULT_FILENAME.json not found." >&2
              exit 1
            fi

            if [ "${SCENARIO_TYPE}" = "agentic-coding" ]; then
              python3 -m utils.agentic.validation.validate_agentic_result \
                results/aiperf_artifacts \
                --failed-request-threshold "$AIPERF_FAILED_REQUEST_THRESHOLD"
            fi
          fi

      - name: Process result
        if: ${{ always() && env.RESULT_FILENAME != '' && !inputs.eval-only && inputs.scenario-type != 'agentic-coding' }}
        env:
          RUNNER_TYPE: ${{ inputs.runner }}
        run: |
          if [ ! -f "$RESULT_FILENAME.json" ]; then
            echo "no raw result to process: $RESULT_FILENAME.json" >&2
            exit 1
          fi
          python3 utils/process_result.py

      - name: Upload result
        if: ${{ success() && env.RESULT_FILENAME != '' && !inputs.eval-only && inputs.scenario-type != 'agentic-coding' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bmk_${{ env.RESULT_FILENAME }}
          path: agg_${{ env.RESULT_FILENAME }}.json

      - name: Upload agentic aggregated result
        if: ${{ always() && inputs.scenario-type == 'agentic-coding' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bmk_agentic_${{ env.RESULT_FILENAME }}
          path: ${{ env.RESULT_FILENAME }}.json

      - name: Upload agentic raw results
        if: ${{ always() && inputs.scenario-type == 'agentic-coding' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic_${{ env.RESULT_FILENAME }}
          path: |
            results/**
            !results/aiperf_artifacts/inputs.json
            !results/aiperf_artifacts/profile_export_raw.jsonl
          if-no-files-found: ignore

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.eval-only && 'eval_server_logs_' || 'server_logs_' }}${{ env.RESULT_FILENAME }}
          # fixed-seq writes server.log at root; agentic writes logs under results/.
          path: |
            server.log
            results/*.log
            results/*_config.json
          if-no-files-found: ignore

      - name: Upload GPU metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.eval-only && 'eval_gpu_metrics_' || 'gpu_metrics_' }}${{ env.RESULT_FILENAME }}
          path: |
            gpu_metrics.csv
            gpu_metrics*_context.json
            gpu_metrics_energy_start.csv
            gpu_metrics_energy_end.csv
            gpu_metrics_identity.json
            gpu_metrics_identity.csv
            results/gpu_metrics*.csv
            results/gpu_metrics*_context.json
            results/gpu_metrics_identity.json
          if-no-files-found: ignore

      - name: Upload power audit bundle
        if: ${{ always() && !inputs.eval-only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: power_audit_${{ env.RESULT_FILENAME }}
          path: |
            ${{ env.RESULT_FILENAME }}.json
            agg_${{ env.RESULT_FILENAME }}.json
            gpu_metrics.csv
            gpu_metrics*_context.json
            gpu_metrics_energy_start.csv
            gpu_metrics_energy_end.csv
            gpu_metrics_identity.json
            gpu_metrics_identity.csv
            power_validation_${{ env.RESULT_FILENAME }}.json
            results/gpu_metrics*.csv
            results/gpu_metrics*_context.json
            results/gpu_metrics_identity.json
            results/agentic_power_window.json
            results/agentic_power_timezone_offset.txt
            results/power_validation.json
          if-no-files-found: ignore

      - name: Upload eval results (if any)
        if: ${{ always() && (env.RUN_EVAL == 'true' || inputs.eval-only) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval_${{ env.RESULT_FILENAME }}_${{ env.EVAL_FRAMEWORK }}_${{ env.EVAL_SUITE }}_${{ github.run_attempt }}
          path: |
            meta_env.json
            results*.json
            *_report.json
            *_results.jsonl
            *_artifacts.tar.gz
            sample*.jsonl
            agent_preds.json
            predictions.jsonl
            swebench_report_*.json
            *.traj*
          if-no-files-found: ${{ inputs.eval-only && 'error' || 'ignore' }}

      - name: Verify eval scores
        if: ${{ (success() || failure()) && inputs.eval-only }}
        run: python3 utils/evals/validate_scores.py

      - name: Cleanup eval outputs (post-upload)
        if: ${{ always() && (env.RUN_EVAL == 'true' || inputs.eval-only) }}
        run: |
          rm -f meta_env.json || true
          # Remove any eval results JSONs that were moved into workspace
          rm -f results*.json || true
          rm -f -- ./*_report.json || true
          rm -f -- ./*_results.jsonl || true
          rm -f sample*.jsonl || true
          rm -f -- ./*_artifacts.tar.gz || true
          rm -f agent_preds.json predictions.jsonl swebench_report_*.json *.traj* || true
          
      - name: Repair root-owned artifacts (post-run)
        if: ${{ always() && inputs.runner == 'cluster:mi355x-amds' }}
        run: |
          if [[ -d "$GITHUB_WORKSPACE" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Resource cleanup (post-run)
        if: always()
        run: *resource-cleanup
