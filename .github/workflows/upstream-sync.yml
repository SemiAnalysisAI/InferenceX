name: Upstream Sync

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          lfs: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote (Fetch Only)
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          echo "Setting upstream as fetch-only (no push allowed)..."
          git remote add upstream https://github.com/SemiAnalysisAI/InferenceX.git
          git remote set-url --push upstream no_push
          git fetch upstream --tags

      - name: Sync upstream
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          echo "Starting branch synchronization..."
          for branch in $(git branch -r | grep 'upstream/' | grep -v 'HEAD' | grep -v '\->' | sed 's|upstream/||'); do
            echo "Syncing branch: $branch"
            # Checkout or create local branch tracking origin. Always pass an explicit
            # start point: a bare name lets git read "...-gb300" as a commit id and
            # silently detach HEAD instead of switching to the branch.
            git checkout -B $branch origin/$branch 2>/dev/null || git checkout -B $branch upstream/$branch
            git fetch upstream $branch
            # Merge upstream in. On conflict, take upstream's copy wholesale rather than
            # leaving a half-merged index behind, which breaks the next branch's checkout.
            # main is exempt: it carries files that do not exist upstream, this workflow
            # among them, so it is only ever fast-forwarded.
            if ! git merge upstream/$branch --no-edit; then
              git merge --abort || true
              if [ "$branch" = "main" ]; then
                echo "::warning::merge conflict on main - left untouched, resolve by hand"
              else
                echo "::warning::merge conflict on $branch - resetting to upstream/$branch"
                git reset --hard upstream/$branch
                git push --force-with-lease origin $branch
              fi
            fi
            if [ "$branch" = "main" ]; then
              python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/run-sweep.yml")
          source = workflow.read_text()

          public_block = """\
                                const inferenceUrl = `https://inferencex.semianalysis.com/inference?unofficialRun=${context.runId}`;
                                const evaluationUrl = `https://inferencex.semianalysis.com/evaluation?unofficialRun=${context.runId}`;
                                const body = [
                                    `see unofficial run visualizer at ${inferenceUrl}`,
                                    `see unofficial run visualizer at ${evaluationUrl}`,
                                ].join('\\n');
          """
          internal_block = """\
                                const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                                const visualizerUrl = new URL('http://infmax-tools.nvidia.com/');
                                visualizerUrl.searchParams.set('baselineUrl', runUrl);
                                const body = `see unofficial run visualizer at ${visualizerUrl.toString()}`;
          """

          public_count = source.count(public_block)
          internal_count = source.count(internal_block)
          if public_count == 1 and internal_count == 0:
              workflow.write_text(source.replace(public_block, internal_block, 1))
              print("Applied the internal InfDash sweep-comment override.")
          elif public_count == 0 and internal_count == 1:
              print("The internal InfDash sweep-comment override is already present.")
          else:
              raise SystemExit(
                  "Expected exactly one public or internal sweep-comment block; "
                  f"found public={public_count}, internal={internal_count}."
              )
          PY
              if ! git diff --quiet -- .github/workflows/run-sweep.yml; then
                git add -- .github/workflows/run-sweep.yml
                git commit \
                  -m "chore(ci): restore internal sweep visualizer link" \
                  -m "恢复内部 sweep 可视化链接。"
              fi
            fi
            git push origin $branch
          done

      - name: Sync Tags
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          echo "Syncing tags..."
          git fetch upstream --tags
          git push origin --tags

