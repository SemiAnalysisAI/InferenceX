name: Upstream Sync

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote (Fetch Only)
        run: |
          echo "Setting upstream as fetch-only (no push allowed)..."
          git remote add upstream https://github.com/InferenceMAX/InferenceMAX.git
          git remote set-url --push upstream no_push
          git fetch upstream --tags

      - name: Sync upstream
        run: |
          echo "Starting branch synchronization..."
          for branch in $(git branch -r | grep 'upstream/' | grep -v 'HEAD' | grep -v '\->' | sed 's|upstream/||'); do
            echo "Syncing branch: $branch"
            # Checkout or create local branch tracking origin
            git checkout $branch 2>/dev/null || git checkout -b $branch origin/$branch
            git fetch upstream $branch
            # Perform safe, non-destructive merge
            git merge upstream/$branch --no-edit || true
            git push origin $branch
          done

      - name: Sync Tags
        run: |
          echo "Syncing tags..."
          git fetch upstream --tags
          git push origin --tags

