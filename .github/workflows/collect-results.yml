name: Template - Collect Results

on:
  workflow_call:
    inputs:
      tooling-ref:
        required: true
        type: string
      result-prefix:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  collect-results:
    name: collect-results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling-ref }}
          persist-credentials: false

      - name: Download JSON artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results/
          pattern: ${{ inputs.result-prefix && format('{0}_*', inputs.result-prefix) || '*' }}

      - name: Select Python project
        run: |
          python_project="$GITHUB_WORKSPACE"
          if [[ -f "$python_project/inferencex-e2e/pyproject.toml" ]]; then
            python_project="$python_project/inferencex-e2e"
          fi
          test -f "$python_project/pyproject.toml"
          echo "INFERENCEX_PYTHON_PROJECT=$python_project" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            inferencex-e2e/pyproject.toml
            inferencex-e2e/uv.lock

      - name: Aggregate results
        env:
          RESULT_PREFIX: ${{ inputs.result-prefix || 'all' }}
        run: |
          uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked python -m infx.results.collect_results results/ "${RESULT_PREFIX}"

      - name: Upload aggregated results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results_${{ inputs.result-prefix || 'all' }}
          path: agg_${{ inputs.result-prefix || 'all' }}.json

      # Job records are diagnostics: they never fail result collection.
      - name: Download job events
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: job_events/
          pattern: job_event_*

      - name: Collect job events
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked python -m infx.results.collect_events job_events/ events.jsonl

      - name: Upload job events
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: job_events
          path: events.jsonl
          if-no-files-found: ignore
