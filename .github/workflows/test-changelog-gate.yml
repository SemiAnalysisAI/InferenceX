name: Test Changelog Gate
run-name: Test Changelog Gate - ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches-ignore:
      - main
    paths:
      - "infx/**"
      - "utils/test_module_entrypoints.py"
      - ".claude/commands/recover-failed-ingest.md"
      - ".claude/mcp/**"
      - ".claude/requirements-mcp.txt"
      - ".github/mcp-ci.json"
      - ".github/workflows/claude-pr-review.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/codeowner-signoff-verify.yml"
      - ".github/workflows/benchmark-tmpl.yml"
      - ".github/workflows/benchmark-multinode-tmpl.yml"
      - ".github/workflows/collectivex-sweep.yml"
      - ".github/workflows/profile.yml"
      - ".github/workflows/e2e-tests.yml"
      - ".github/workflows/run-sweep.yml"
      - ".github/workflows/stage-results.yml"
      - ".github/workflows/speedbench-al.yml"
      - ".github/workflows/test-changelog-gate.yml"
      - ".github/workflows/trusted-external-sweep.yml"
      - "benchmarks/benchmark_lib.sh"
      - "configs/ci-priority.yaml"
      - "benchmarks/multi_node/amd_utils/job.slurm"
      - "runners/launch_*.sh"
      - "runners/slurm_utils.sh"
      - "runners/test_slurm_utils.py"
      - "utils/ci_priority.py"
      - "utils/test_ci_priority.py"
      - ".github/workflows/reuse-sweep-comment.yml"
      - "utils/test_acknowledge_sweep_reuse.py"
      - "utils/test_github.py"
      - "utils/find_reusable_sweep_run.py"
      - "utils/test_find_reusable_sweep_run.py"
      - "utils/process_changelog.py"
      - "utils/test_process_changelog.py"
      - "utils/collect_eval_results.py"
      - "utils/test_collect_eval_results.py"
      - "utils/evals/validate_scores.py"
      - "utils/evals/test_batched_eval.py"
      - "utils/evals/test_run_eval_dispatch.py"
      - "utils/evals/_kimi_verifier_archive.py"
      - "utils/prepare_perf_changelog_merge.py"
      - "utils/recover_failed_ingest.py"
      - "utils/changelog_gate_tests/test_prepare_perf_changelog_merge.py"
      - "utils/changelog_gate_tests/test_merge_with_reuse.py"
      - "utils/changelog_gate_tests/test_recover_failed_ingest.py"
      - "utils/test_validate_reusable_sweep_artifacts.py"
      - "utils/validate_perf_changelog.py"
      - "utils/validate_reusable_sweep_artifacts.py"
      - "utils/changelog_gate_tests/test_validate_perf_changelog.py"
      - "utils/changelog_gate_tests/test_run_sweep_gating.py"
      - "utils/changelog_gate_tests/test_workflow_authorization.py"
      - "utils/changelog_gate_tests/workflow_script_runner.cjs"
      - "utils/changelog_gate_tests/conftest.py"
      - "utils/merge_with_reuse.sh"
      - "utils/matrix_logic/**"
      - "infx/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-changelog-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-changelog:
    name: Test changelog validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify MCP server compatibility
        run: |
          uv run --no-project --exclude-newer PT12H --python 3.12 \
            --with-requirements .claude/requirements-mcp.txt python - <<'PY'
          import asyncio
          import runpy

          module = runpy.run_path(".claude/mcp/server.py")
          server = module["InferenceXMCPServer"]()
          tools = asyncio.run(server.list_tools())
          assert any(tool.name == "list_versions" for tool in tools)
          assert asyncio.run(server.list_resources()) == []
          print("MCP server construction and discovery passed.")
          PY

      - name: Run validator, reuse, and gating tests
        run: |
          uv run --no-project --exclude-newer PT12H --python 3.12 \
            --with pytest --with pytest-xdist --with "pydantic>=2" --with pyyaml --with tabulate \
            python -m pytest \
            utils/changelog_gate_tests/test_validate_perf_changelog.py \
            utils/test_find_reusable_sweep_run.py \
            utils/test_acknowledge_sweep_reuse.py \
            utils/test_github.py \
            utils/changelog_gate_tests/test_prepare_perf_changelog_merge.py \
            utils/changelog_gate_tests/test_merge_with_reuse.py \
            utils/changelog_gate_tests/test_recover_failed_ingest.py \
            utils/test_validate_reusable_sweep_artifacts.py \
            utils/changelog_gate_tests/test_run_sweep_gating.py \
            utils/changelog_gate_tests/test_workflow_authorization.py \
            utils/test_ci_priority.py \
            utils/test_calc_success_rate.py \
            utils/test_server_watch.py \
            utils/test_module_entrypoints.py \
            utils/test_process_changelog.py \
            utils/test_collect_eval_results.py \
            utils/evals/test_batched_eval.py \
            utils/evals/test_run_eval_dispatch.py \
            runners/test_slurm_utils.py \
            -v -n 4
