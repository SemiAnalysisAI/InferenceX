name: Shared actions smoke

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/zz-shared-actions-smoke.yml

permissions: {}

concurrency:
  group: shared-actions-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-project:
    name: python-project (${{ matrix.python-version || 'default' }}, cache ${{ matrix.enable-cache }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - python-version: ''
            enable-cache: auto
          - python-version: '3.12'
            enable-cache: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-project
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ matrix.enable-cache }}
      - run: |
          test "$INFERENCEX_PYTHON_PROJECT" = "$GITHUB_WORKSPACE/inferencex-e2e"
          uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked python -c "import infx, sys; print(sys.version)"

  upload-after-failure:
    name: upload-after-failure
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo payload > payload.txt
      - name: Fail the job before uploading
        run: exit 1
      - name: Upload after a failed step
        if: always()
        uses: $/.github/actions/upload-artifact-retry
        with:
          name: smoke-after-failure
          path: payload.txt
          if-no-files-found: error

  upload-retries:
    name: upload-retries
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo payload > payload.txt
      - name: Upload once
        uses: $/.github/actions/upload-artifact-retry
        with:
          name: smoke-success
          path: payload.txt
          if-no-files-found: error
      - name: Start timer
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Upload an invalid name three times
        id: invalid
        continue-on-error: true
        uses: $/.github/actions/upload-artifact-retry
        with:
          name: 'bad:name'
          path: payload.txt
          if-no-files-found: error
      - name: Require the failure after both waits
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          START: ${{ steps.start.outputs.at }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          echo "outcome=$OUTCOME elapsed=${elapsed}s"
          test "$OUTCOME" = failure
          test "$elapsed" -ge 40

  verify:
    name: verify
    needs: [upload-after-failure, upload-retries]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read # Download this run's artifacts.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smoke-*
          path: artifacts
      - run: |
          ls -R artifacts
          test "$(cat artifacts/smoke-after-failure/payload.txt)" = payload
          test "$(cat artifacts/smoke-success/payload.txt)" = payload
          test ! -e artifacts/bad:name
