name: Profile

# Capture a torch-profiler trace of one benchmark config (fixed-seq-len or
# agentic) for kernel-level correlation. Reuses the standard benchmark
# template with profile=true: the server runs eager by default (CUDA graphs
# disabled) so every device kernel keeps its launching-operator attribution,
# and the job uploads a profile_<result> artifact containing every trace the
# engine produced plus a profile_meta.json metadata sidecar.

on:
  workflow_dispatch:
    inputs:
      config-key:
        description: "Config key from config yaml"
        required: true
        type: string
      config-file:
        description: "Config file to use"
        required: false
        type: string
        default: 'configs/nvidia-master.yaml'
      conc:
        description: "Concurrency value (must exist in config's conc-range/list)"
        required: false
        type: string
        default: '64'
      ref:
        description: "Ref (branch/sha) to checkout"
        required: false
        type: string
      keep-cuda-graphs:
        description: "Profile with CUDA graphs enabled (graph-replayed kernels lose operator attribution)"
        required: false
        type: boolean
        default: false
      profile-num-steps:
        description: "sglang: forward steps per stage to capture"
        required: false
        type: string
        default: '2'
      profile-start-delay-seconds:
        description: "Agentic: steady-state delay before triggering the capture"
        required: false
        type: string
        default: '600'
      duration-override:
        description: "Agentic: replay duration in seconds (empty = config value)"
        required: false
        type: string
        default: '1800'

permissions:
  contents: read

jobs:
  get-jobs:
    runs-on: ubuntu-latest
    outputs:
      fixed-config: ${{ steps.filter.outputs.fixed }}
      agentic-config: ${{ steps.filter.outputs.agentic }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Checkout priority scheduler tooling
        if: ${{ inputs.ref && inputs.ref != '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-priority
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - id: gen
        name: Generate matrix via script
        run: |
          CLI_ARGS="test-config --config-files ${{ inputs.config-file }} --config-keys ${{ inputs.config-key }} --conc ${{ inputs.conc }}"
          CONFIG_JSON=$(uv run --no-project --with pydantic --with pyyaml --python 3.12 ${GITHUB_WORKSPACE}/utils/matrix_logic/generate_sweep_configs.py $CLI_ARGS)
          PRIORITY_ROOT="${GITHUB_WORKSPACE}"
          if [ -d "${GITHUB_WORKSPACE}/.ci-priority" ]; then
            PRIORITY_ROOT="${GITHUB_WORKSPACE}/.ci-priority"
          fi
          CONFIG_JSON=$(printf '%s' "$CONFIG_JSON" | uv run --no-project --with pyyaml --python 3.12 \
            "${PRIORITY_ROOT}/utils/ci_priority.py" \
            --policy "${PRIORITY_ROOT}/configs/ci-priority.yaml" \
            --event-name "${{ github.event_name }}" \
            --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}" \
            --labels-json '[]')
          echo "raw=$CONFIG_JSON" >> $GITHUB_OUTPUT

      - id: filter
        name: Take first generated job and route by scenario
        shell: python
        run: |
          import json, os, sys
          raw = '${{ steps.gen.outputs.raw }}'
          try:
            data = json.loads(raw)
          except Exception as e:
            print('Invalid generator output:', e, file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("fixed=[]\nagentic=[]\n")
            raise

          if not isinstance(data, list) or not data:
            print('Generator produced no entries for '
                  'config-key=${{ inputs.config-key }} conc=${{ inputs.conc }}.',
                  file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("fixed=[]\nagentic=[]\n")
            raise SystemExit(1)

          # Multinode entries need the multinode template, which the profile
          # plumbing does not cover yet.
          single = [x for x in data if 'prefill' not in x]
          if not single:
            print('Only multinode entries generated; profiling supports '
                  'single-node configs only.', file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("fixed=[]\nagentic=[]\n")
            raise SystemExit(1)

          entry = single[0]
          agentic = entry.get('scenario-type') == 'agentic-coding'
          fixed_out = json.dumps([] if agentic else [entry])
          agentic_out = json.dumps([entry] if agentic else [])
          print('selected entry:', json.dumps(entry))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"fixed={fixed_out}\n")
            f.write(f"agentic={agentic_out}\n")

  profile-fixed:
    needs: get-jobs
    if: ${{ needs.get-jobs.outputs.fixed-config != '[]' }}
    uses: ./.github/workflows/benchmark-tmpl.yml
    name: profile /
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.get-jobs.outputs.fixed-config) }}
    secrets: inherit
    with:
      exp-name: ${{ matrix.config.exp-name }}
      recipe-fingerprint: ${{ matrix.config['recipe-fingerprint'] || '' }}
      isl: ${{ matrix.config.isl }}
      osl: ${{ matrix.config.osl }}
      max-model-len: ${{ matrix.config.max-model-len }}
      runner: ${{ matrix.config.runner }}
      priority: ${{ matrix.config.priority }}
      queue-token: ${{ matrix.config['queue-token'] }}
      image: ${{ matrix.config.image }}
      model: ${{ matrix.config.model }}
      model-prefix: ${{ matrix.config.model-prefix }}
      framework: ${{ matrix.config.framework }}
      precision: ${{ matrix.config.precision }}
      router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
      kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
      tp: ${{ matrix.config.tp }}
      pp: ${{ matrix.config.pp }}
      dcp-size: ${{ matrix.config.dcp-size }}
      pcp-size: ${{ matrix.config.pcp-size }}
      ep: ${{ matrix.config.ep }}
      dp-attn: ${{ matrix.config.dp-attn }}
      conc: ${{ matrix.config.conc }}
      spec-decoding: ${{ matrix.config.spec-decoding }}
      disagg: ${{ matrix.config.disagg }}
      run-eval: false
      ref: ${{ inputs.ref }}
      profile: true
      profile-keep-cuda-graphs: ${{ inputs.keep-cuda-graphs }}
      profile-num-steps: ${{ inputs.profile-num-steps }}
      profile-start-delay-seconds: ${{ inputs.profile-start-delay-seconds }}

  profile-agentic:
    needs: get-jobs
    if: ${{ needs.get-jobs.outputs.agentic-config != '[]' }}
    uses: ./.github/workflows/benchmark-tmpl.yml
    name: profile agentic /
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.get-jobs.outputs.agentic-config) }}
    secrets: inherit
    with:
      exp-name: ${{ matrix.config.exp-name }}
      recipe-fingerprint: ${{ matrix.config['recipe-fingerprint'] || '' }}
      runner: ${{ matrix.config.runner }}
      priority: ${{ matrix.config.priority }}
      queue-token: ${{ matrix.config['queue-token'] }}
      image: ${{ matrix.config.image }}
      model: ${{ matrix.config.model }}
      model-prefix: ${{ matrix.config.model-prefix }}
      framework: ${{ matrix.config.framework }}
      precision: ${{ matrix.config.precision }}
      router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
      kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
      tp: ${{ matrix.config.tp }}
      pp: ${{ matrix.config.pp }}
      dcp-size: ${{ matrix.config.dcp-size }}
      pcp-size: ${{ matrix.config.pcp-size }}
      ep: ${{ matrix.config.ep }}
      dp-attn: ${{ matrix.config.dp-attn }}
      conc: ${{ matrix.config.conc }}
      kv-offloading: ${{ matrix.config.kv-offloading }}
      kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
      kv-offload-backend-metadata: ${{ matrix.config['kv-offload-backend'] && toJson(matrix.config['kv-offload-backend']) || '' }}
      total-cpu-dram-gb: ${{ matrix.config.total-cpu-dram-gb }}
      duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
      isl: '0'
      osl: '0'
      max-model-len: '0'
      spec-decoding: ${{ matrix.config.spec-decoding }}
      disagg: ${{ 'false' }}
      run-eval: false
      scenario-type: agentic-coding
      ref: ${{ inputs.ref }}
      profile: true
      profile-keep-cuda-graphs: ${{ inputs.keep-cuda-graphs }}
      profile-num-steps: ${{ inputs.profile-num-steps }}
      profile-start-delay-seconds: ${{ inputs.profile-start-delay-seconds }}
