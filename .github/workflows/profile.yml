name: Profile

# Capture a torch-profiler trace of one benchmark config (fixed-seq-len or
# agentic) for kernel-level correlation. Reuses the standard benchmark
# template with profile=true: the server runs eager by default (CUDA graphs
# disabled) so every device kernel keeps its launching-operator attribution,
# and the job uploads a profile_<result> artifact containing every trace the
# engine produced plus a profile_meta.json metadata sidecar.

on:
  workflow_dispatch:
    inputs:
      config-key:
        description: "Config key from config yaml"
        required: true
        type: string
      config-file:
        description: "Config file to use"
        required: false
        type: string
        default: 'configs/nvidia-master.yaml'
      conc:
        description: "Concurrency value (must exist in config's conc-range/list)"
        required: false
        type: string
        default: '64'
      ref:
        description: "Ref (branch/sha) to checkout"
        required: false
        type: string
      keep-cuda-graphs:
        description: "Profile with CUDA graphs enabled (graph-replayed kernels lose operator attribution)"
        required: false
        type: boolean
        default: false
      profile-num-steps:
        description: "sglang: forward steps per stage to capture"
        required: false
        type: string
        default: '2'
      profile-start-delay-seconds:
        description: "Agentic: steady-state delay before triggering the capture"
        required: false
        type: string
        default: '600'
      profile-execution-trace:
        description: "ExecutionTrace capture: '' = default (on; off only for spec-decode fixed-seq), '1'/'0' force"
        required: false
        type: string
        default: ''
      profile-with-stack:
        description: "Record python stacks in profiler sessions ('true'/'false'; agentic ET steady windows force false)"
        required: false
        type: string
        default: 'true'
      duration-override:
        description: "Agentic: replay duration in seconds (empty = config value)"
        required: false
        type: string
        default: '1800'

permissions:
  contents: read

jobs:
  get-jobs:
    runs-on: ubuntu-latest
    outputs:
      fixed-config: ${{ steps.filter.outputs.fixed }}
      agentic-config: ${{ steps.filter.outputs.agentic }}
      multinode-agentic-config: ${{ steps.filter.outputs.multinode-agentic }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Checkout priority scheduler tooling
        if: ${{ inputs.ref && inputs.ref != '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-priority
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - id: gen
        name: Generate matrix via script
        run: |
          CLI_ARGS="test-config --config-files ${{ inputs.config-file }} --config-keys ${{ inputs.config-key }} --conc ${{ inputs.conc }}"
          CONFIG_JSON=$(uv run --no-project --with pydantic --with pyyaml --python 3.12 ${GITHUB_WORKSPACE}/utils/matrix_logic/generate_sweep_configs.py $CLI_ARGS)
          PRIORITY_ROOT="${GITHUB_WORKSPACE}"
          if [ -d "${GITHUB_WORKSPACE}/.ci-priority" ]; then
            PRIORITY_ROOT="${GITHUB_WORKSPACE}/.ci-priority"
          fi
          CONFIG_JSON=$(printf '%s' "$CONFIG_JSON" | uv run --no-project --with pyyaml --python 3.12 \
            "${PRIORITY_ROOT}/utils/ci_priority.py" \
            --policy "${PRIORITY_ROOT}/configs/ci-priority.yaml" \
            --event-name "${{ github.event_name }}" \
            --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}" \
            --labels-json '[]')
          echo "raw=$CONFIG_JSON" >> $GITHUB_OUTPUT

      - id: filter
        name: Take first generated job and route by scenario
        shell: python
        run: |
          import json, os, sys
          raw = '${{ steps.gen.outputs.raw }}'
          try:
            data = json.loads(raw)
          except Exception as e:
            print('Invalid generator output:', e, file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("fixed=[]\nagentic=[]\n")
            raise

          def emit(fixed=(), agentic=(), multinode_agentic=()):
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"fixed={json.dumps(list(fixed))}\n")
              f.write(f"agentic={json.dumps(list(agentic))}\n")
              f.write(f"multinode-agentic={json.dumps(list(multinode_agentic))}\n")

          if not isinstance(data, list) or not data:
            print('Generator produced no entries for '
                  'config-key=${{ inputs.config-key }} conc=${{ inputs.conc }}.',
                  file=sys.stderr)
            emit()
            raise SystemExit(1)

          entry = data[0]
          multinode = 'prefill' in entry
          agentic = entry.get('scenario-type') == 'agentic-coding'
          if multinode and not agentic:
            # Multinode fixed-seq-len benchmarks run srt-slurm's own sa-bench
            # client, which has no capture-trigger hook yet.
            print('Multinode fixed-seq-len profiling is not supported yet '
                  '(only multinode agentic).', file=sys.stderr)
            emit()
            raise SystemExit(1)

          if multinode:
            node_count = entry.get('node-count')
            if (
              isinstance(node_count, bool)
              or not isinstance(node_count, int)
              or node_count <= 0
            ):
              print(
                'Multinode profiling requires a validated positive integer '
                f'node-count; got {node_count!r}.',
                file=sys.stderr,
              )
              emit()
              raise SystemExit(1)
          else:
            node_count = entry.get('node-count', 1)
            if (
              isinstance(node_count, bool)
              or not isinstance(node_count, int)
              or node_count != 1
            ):
              print(
                'Single-node profiling requires node-count=1; '
                f'got {node_count!r}.',
                file=sys.stderr,
              )
              emit()
              raise SystemExit(1)
            entry['node-count'] = 1

          print('selected entry:', json.dumps(entry))
          if multinode:
            emit(multinode_agentic=[entry])
          elif agentic:
            emit(agentic=[entry])
          else:
            emit(fixed=[entry])

  profile-fixed:
    needs: get-jobs
    if: ${{ needs.get-jobs.outputs.fixed-config != '[]' }}
    uses: ./.github/workflows/benchmark-tmpl.yml
    name: profile /
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.get-jobs.outputs.fixed-config) }}
    secrets: inherit
    with:
      exp-name: ${{ matrix.config.exp-name }}
      recipe-fingerprint: ${{ matrix.config['recipe-fingerprint'] || '' }}
      isl: ${{ matrix.config.isl }}
      osl: ${{ matrix.config.osl }}
      max-model-len: ${{ matrix.config.max-model-len }}
      runner: ${{ matrix.config.runner }}
      priority: ${{ matrix.config.priority }}
      queue-token: ${{ matrix.config['queue-token'] }}
      image: ${{ matrix.config.image }}
      model: ${{ matrix.config.model }}
      model-prefix: ${{ matrix.config.model-prefix }}
      framework: ${{ matrix.config.framework }}
      precision: ${{ matrix.config.precision }}
      router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
      kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
      tp: ${{ matrix.config.tp }}
      pp: ${{ matrix.config.pp }}
      dcp-size: ${{ matrix.config.dcp-size }}
      pcp-size: ${{ matrix.config.pcp-size }}
      ep: ${{ matrix.config.ep }}
      dp-attn: ${{ matrix.config.dp-attn }}
      conc: ${{ matrix.config.conc }}
      spec-decoding: ${{ matrix.config.spec-decoding }}
      disagg: ${{ matrix.config.disagg }}
      run-eval: false
      ref: ${{ inputs.ref }}
      profile: true
      profile-keep-cuda-graphs: ${{ inputs.keep-cuda-graphs }}
      profile-num-steps: ${{ inputs.profile-num-steps }}
      profile-start-delay-seconds: ${{ inputs.profile-start-delay-seconds }}
      profile-execution-trace: ${{ inputs.profile-execution-trace }}
      profile-with-stack: ${{ inputs.profile-with-stack }}

  profile-agentic:
    needs: get-jobs
    if: ${{ needs.get-jobs.outputs.agentic-config != '[]' }}
    uses: ./.github/workflows/benchmark-tmpl.yml
    name: profile agentic /
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.get-jobs.outputs.agentic-config) }}
    secrets: inherit
    with:
      exp-name: ${{ matrix.config.exp-name }}
      recipe-fingerprint: ${{ matrix.config['recipe-fingerprint'] || '' }}
      runner: ${{ matrix.config.runner }}
      priority: ${{ matrix.config.priority }}
      queue-token: ${{ matrix.config['queue-token'] }}
      image: ${{ matrix.config.image }}
      model: ${{ matrix.config.model }}
      model-prefix: ${{ matrix.config.model-prefix }}
      framework: ${{ matrix.config.framework }}
      precision: ${{ matrix.config.precision }}
      router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
      kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
      tp: ${{ matrix.config.tp }}
      pp: ${{ matrix.config.pp }}
      dcp-size: ${{ matrix.config.dcp-size }}
      pcp-size: ${{ matrix.config.pcp-size }}
      ep: ${{ matrix.config.ep }}
      dp-attn: ${{ matrix.config.dp-attn }}
      conc: ${{ matrix.config.conc }}
      kv-offloading: ${{ matrix.config.kv-offloading }}
      kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
      kv-offload-backend-metadata: ${{ matrix.config['kv-offload-backend'] && toJson(matrix.config['kv-offload-backend']) || '' }}
      total-cpu-dram-gb: ${{ matrix.config.total-cpu-dram-gb }}
      duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
      isl: '0'
      osl: '0'
      max-model-len: '0'
      spec-decoding: ${{ matrix.config.spec-decoding }}
      disagg: ${{ 'false' }}
      run-eval: false
      scenario-type: agentic-coding
      ref: ${{ inputs.ref }}
      profile: true
      profile-keep-cuda-graphs: ${{ inputs.keep-cuda-graphs }}
      profile-num-steps: ${{ inputs.profile-num-steps }}
      profile-start-delay-seconds: ${{ inputs.profile-start-delay-seconds }}
      profile-execution-trace: ${{ inputs.profile-execution-trace }}
      profile-with-stack: ${{ inputs.profile-with-stack }}

  profile-multinode-agentic:
    needs: get-jobs
    if: ${{ needs.get-jobs.outputs.multinode-agentic-config != '[]' }}
    uses: ./.github/workflows/benchmark-multinode-tmpl.yml
    name: profile multi-node agentic /
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.get-jobs.outputs.multinode-agentic-config) }}
    secrets: inherit
    with:
      exp-name: ${{ matrix.config.exp-name }}
      recipe-fingerprint: ${{ matrix.config['recipe-fingerprint'] || '' }}
      isl: '0'
      osl: '0'
      max-model-len: '0'
      runner: ${{ matrix.config.runner }}
      node-count: ${{ matrix.config['node-count'] }}
      priority: ${{ matrix.config.priority }}
      queue-token: ${{ matrix.config['queue-token'] }}
      image: ${{ matrix.config.image }}
      model: ${{ matrix.config.model }}
      model-prefix: ${{ matrix.config.model-prefix }}
      framework: ${{ matrix.config.framework }}
      precision: ${{ matrix.config.precision }}
      router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
      kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
      conc-list: ${{ toJson(matrix.config.conc) }}
      spec-decoding: ${{ matrix.config.spec-decoding }}
      disagg: ${{ matrix.config.disagg }}
      prefill-hardware: ${{ matrix.config.prefill.hardware }}
      decode-hardware: ${{ matrix.config.decode.hardware }}
      prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
      prefill-tp: ${{ matrix.config.prefill.tp }}
      prefill-pp: ${{ matrix.config.prefill.pp }}
      prefill-dcp-size: ${{ matrix.config.prefill.dcp-size }}
      prefill-pcp-size: ${{ matrix.config.prefill.pcp-size }}
      prefill-ep: ${{ matrix.config.prefill.ep }}
      prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
      prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}
      decode-num-worker: ${{ matrix.config.decode.num-worker }}
      decode-tp: ${{ matrix.config.decode.tp }}
      decode-pp: ${{ matrix.config.decode.pp }}
      decode-dcp-size: ${{ matrix.config.decode.dcp-size }}
      decode-pcp-size: ${{ matrix.config.decode.pcp-size }}
      decode-ep: ${{ matrix.config.decode.ep }}
      decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
      decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
      conc: ${{ matrix.config.conc[0] }}
      kv-offloading: ${{ matrix.config.kv-offloading }}
      kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
      kv-offload-backend-metadata: ${{ matrix.config['kv-offload-backend'] && toJson(matrix.config['kv-offload-backend']) || '' }}
      duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
      run-eval: false
      scenario-type: agentic-coding
      ref: ${{ inputs.ref }}
      profile: true
      profile-keep-cuda-graphs: ${{ inputs.keep-cuda-graphs }}
      profile-num-steps: ${{ inputs.profile-num-steps }}
      profile-start-delay-seconds: ${{ inputs.profile-start-delay-seconds }}
      profile-execution-trace: ${{ inputs.profile-execution-trace }}
      profile-with-stack: ${{ inputs.profile-with-stack }}
