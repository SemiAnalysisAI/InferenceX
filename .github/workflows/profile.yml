name: Profile

# Independent profiling requests use priority-scheduled runner slots.
on: # zizmor: ignore[concurrency-limits]
  workflow_dispatch:
    inputs:
      config-key:
        description: "Config key from config yaml"
        required: true
        type: string
      config-file:
        description: "Config file to use"
        required: false
        type: string
        default: 'configs/nvidia-master.yaml'
      conc:
        description: "Concurrency value (must exist in config's conc-range/list)"
        required: false
        type: string
        default: '64'
      moe-debug:
        description: "Enable MoE debug patch and log (MOE_DEBUG_LOG)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Ref (branch/sha) to checkout"
        required: false
        type: string

permissions:
  contents: read

env:
  PORT: '8888'
  INFMAX_CONTAINER_WORKSPACE: '/workspace'
  DSV41_MIN_CUDAGRAPH_CAPTURE_SIZE: '1'
  MODEL_DOWNLOAD_LOCK_TIMEOUT: '21600'
  ENROOT_IMPORT_TIME_LIMIT: '120'
  SALLOC_TIME_LIMIT: '480'
  GPU_MONITOR_INTERVAL: '1'
  GPU_METRICS_CSV: 'gpu_metrics.csv'
  KEEP_LOGS: '0'
  EVAL_ONLY: 'false'
  RUN_EVAL: 'false'
  IS_AGENTIC: '0'
  REQUIRE_POWER: '0'
  IS_MULTINODE: 'false'
  SCENARIO_SUBDIR: fixed_seq_len/
  HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
  HF_HUB_CACHE: '/mnt/hf_hub_cache/'
  RANDOM_RANGE_RATIO: '0.8'
  PERFETTO_RELAY_URL: https://semianalysisai.github.io/InferenceX-trace-storage
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache

jobs:
  get-jobs:
    name: get-jobs
    runs-on: ubuntu-latest
    outputs:
      filtered-matrix: ${{ steps.filter.outputs.filtered }}
      count: ${{ steps.filter.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Checkout priority scheduler tooling
        if: ${{ inputs.ref && inputs.ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-priority
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: gen
        name: Generate matrix via script
        run: |
          PRIORITY_ROOT="${GITHUB_WORKSPACE}"
          if [ -d "${GITHUB_WORKSPACE}/.ci-priority" ]; then
            PRIORITY_ROOT="${GITHUB_WORKSPACE}/.ci-priority"
          fi
          source "$PRIORITY_ROOT/benchmarks/benchmark_lib.sh" --validation-only
          check_env_vars INPUTS_CONFIG_FILE INPUTS_CONFIG_KEY INPUTS_CONC PR_LABELS
          CONFIG_JSON=$(uv run --no-project --exclude-newer PT12H --python 3.12 --with pydantic --with pyyaml \
            python "${GITHUB_WORKSPACE}/utils/matrix_logic/generate_sweep_configs.py" \
            test-config --config-files "$INPUTS_CONFIG_FILE" --config-keys "$INPUTS_CONFIG_KEY" --conc "$INPUTS_CONC")
          CONFIG_JSON=$(printf '%s' "$CONFIG_JSON" | env PYTHONPATH="$PRIORITY_ROOT" uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
            python -P "${PRIORITY_ROOT}/utils/ci_priority.py" \
            --policy "${PRIORITY_ROOT}/configs/ci-priority.yaml" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --queue-namespace "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --labels-json "${PR_LABELS}")
          echo "raw=$CONFIG_JSON" >> "$GITHUB_OUTPUT"

        env:
          PR_LABELS: ${{ inputs.moe-debug && '["ci-patchwork"]' || '[]' }}
          INPUTS_CONFIG_FILE: ${{ inputs.config-file }}
          INPUTS_CONFIG_KEY: ${{ inputs.config-key }}
          INPUTS_CONC: ${{ inputs.conc }}

      - id: filter
        name: Take first generated job
        shell: python
        env:
          STEPS_GEN_OUTPUTS_RAW: ${{ steps.gen.outputs.raw }}
        run: |
          import json, os, sys
          raw = os.environ["STEPS_GEN_OUTPUTS_RAW"]
          try:
            data = json.loads(raw)
          except Exception as e:
            print('Invalid generator output:', e, file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("filtered=[]\ncount=0\n")
            raise

          if not isinstance(data, list):
            print('Generator output is not a list.', file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("filtered=[]\ncount=0\n")
            raise SystemExit(1)

          filt = data[:1]

          for entry in filt:
            node_count = entry.get('node-count', 1)
            if isinstance(node_count, bool) or not isinstance(node_count, int) or node_count != 1:
              print(
                'Profile supports only validated single-node matrix entries; '
                f'got node-count={node_count!r}.',
                file=sys.stderr,
              )
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write("filtered=[]\ncount=0\n")
              raise SystemExit(1)
            entry['node-count'] = node_count

          out = json.dumps(filt)
          print(out)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"filtered={out}\n")
            f.write(f"count={len(filt)}\n")

      - name: Fail if no matching entries
        if: ${{ steps.filter.outputs.count == '0' }}
        run: |
          echo "No entries produced for config-key=${INPUTS_CONFIG_KEY}, conc=${INPUTS_CONC}." >&2
          exit 1
        env:
          INPUTS_CONFIG_KEY: ${{ inputs.config-key }}
          INPUTS_CONC: ${{ inputs.conc }}

  profile:
    needs: get-jobs
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.get-jobs.outputs.filtered-matrix) }}
    name: >-
      p${{ matrix.config.priority }} | ${{ matrix.config.model-prefix }} ${{ matrix.config.precision }} ${{ matrix.config.runner }} ${{ matrix.config.framework }}
      TP${{ matrix.config.tp }}${{ matrix.config.pp != '' && matrix.config.pp != '1' && format('/PP{0}', matrix.config.pp) || '' }}${{ matrix.config.dcp-size != '' && matrix.config.dcp-size != '1' && format('/DCP{0}', matrix.config.dcp-size) || '' }}${{ matrix.config.pcp-size != '' && matrix.config.pcp-size != '1' && format('/PCP{0}', matrix.config.pcp-size) || '' }} c${{ matrix.config.conc }}
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(matrix.config.runner),
            toJSON(format('nodes:{0}', matrix.config['node-count'])),
            toJSON(format(
              'ci-job-{0}-{1}',
              matrix.config.priority,
              matrix.config['queue-token']
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},{1},{2}]',
            toJSON(matrix.config.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              matrix.config.priority,
              matrix.config['queue-token']
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0}]', toJSON(matrix.config.runner))
      ) }}
    env:
      EXP_NAME: ${{ matrix.config.exp-name }}
      MODEL: ${{ matrix.config.model }}
      MODEL_PREFIX: ${{ matrix.config.model-prefix }}
      ISL: ${{ matrix.config.isl }}
      OSL: ${{ matrix.config.osl }}
      MAX_MODEL_LEN: ${{ matrix.config.max-model-len }}
      IMAGE: ${{ matrix.config.image }}
      FRAMEWORK: ${{ matrix.config.framework }}
      PRECISION: ${{ matrix.config.precision }}
      TP: ${{ matrix.config.tp }}
      PP_SIZE: ${{ matrix.config.pp }}
      DCP_SIZE: ${{ matrix.config.dcp-size }}
      PCP_SIZE: ${{ matrix.config.pcp-size }}
      EP_SIZE: ${{ matrix.config.ep }}
      DP_ATTENTION: ${{ matrix.config['dp-attn'] }}
      CONC: ${{ matrix.config.conc }}
      SPEC_DECODING: ${{ matrix.config.spec-decoding }}
      DISAGG: ${{ matrix.config.disagg }}
      MOE_DEBUG: '0'
      MOE_DEBUG_LOG: ${{ (inputs.moe-debug) && '/workspace/moe_debug.tp0.log' || '' }}
    steps:
      - name: Resource cleanup
        run: |
          # Cleanup Docker resources
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "[Docker] Cleaning up resources ..."
            docker ps -aq | xargs -r docker rm -f
            docker network prune -f
            while [ -n "$(docker ps -aq)" ]; do
              docker ps -a
              sleep 5
            done
          fi

          # Cleanup SLURM resources
          if command -v squeue >/dev/null 2>&1; then
            echo "[Slurm] Cleaning up jobs with name: ${RUNNER_NAME} ..."
            scancel --name="${RUNNER_NAME}" || true
            while [ -n "$(squeue --name="${RUNNER_NAME}" --noheader --format='%i')" ]; do
              squeue --name="${RUNNER_NAME}"
              sleep 5
            done
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          clean: false
          persist-credentials: false

      - name: Launch + Profile (single-node sglang/vllm)
        id: run
        env:
          RUNNER_NAME: ${{ runner.name }}
          PROFILE: '1'
          SGLANG_TORCH_PROFILER_DIR: /workspace/
          VLLM_TORCH_PROFILER_DIR: /workspace/
          VLLM_RPC_TIMEOUT: '1800000'
        shell: bash
        run: |
          set -eo pipefail
          export GPU_COUNT=$((TP * PP_SIZE * PCP_SIZE))
          echo "GPU_COUNT=${GPU_COUNT}" >> "$GITHUB_ENV"
          ep_val="${EP_SIZE:-1}"
          res_name="${EXP_NAME}_${PRECISION}_${FRAMEWORK}_tp${TP}-pp${PP_SIZE}-dcp${DCP_SIZE}-pcp${PCP_SIZE}_ep${ep_val}_dpa_${DP_ATTENTION}_conc${CONC}_${RUNNER_NAME}"
          export RESULT_FILENAME="${res_name}"
          echo "RESULT_FILENAME=${res_name}" >> "$GITHUB_ENV"

          # Historical measured revisions own their configuration in the launchers.
          if [[ -f benchmarks/runtime_settings.sh ]]; then
            source benchmarks/runtime_settings.sh
          fi
          if [[ -f runners/runtime_settings.sh ]]; then
            source runners/runtime_settings.sh
          fi
          bash ./runners/launch_${RUNNER_NAME%%_*}.sh

          if [ ! -f "${res_name}.json" ]; then
            echo "Run failed: Benchmark result ${res_name}.json not found." >&2
            exit 1
          fi

          trace_path="profile_${res_name}.trace.json.gz"
          if [ -f "$trace_path" ]; then
            echo "trace=$trace_path" >> "$GITHUB_OUTPUT"
            if [ "${FRAMEWORK}" = "sglang" ]; then
              # Try to locate corresponding TP-0 traces produced by SGLang profiler
              merged_latest=$(ls -t profiles/merged-*.trace.json.gz 2>/dev/null | head -n1 || true)
              if [ -n "${merged_latest}" ] && [ -f "${merged_latest}" ]; then
                ts_name="${merged_latest##*/}"
                ts_name="${ts_name#merged-}"
                ts_name="${ts_name%.trace.json.gz}"
                tp0_decode="profiles/${ts_name}-TP-0-DECODE.trace.json.gz"
                tp0_extend="profiles/${ts_name}-TP-0-EXTEND.trace.json.gz"
                if [ -f "${tp0_decode}" ]; then
                  echo "tp0_decode=${tp0_decode}" >> "$GITHUB_OUTPUT"
                fi
                if [ -f "${tp0_extend}" ]; then
                  echo "tp0_extend=${tp0_extend}" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
          else
            echo "Profile trace not found: $trace_path" >&2
          fi

      - name: Process result (json -> agg)
        env:
          RUNNER_TYPE: ${{ matrix.config.runner }}
        run: |
          python3 utils/process_result.py

      - name: Upload profile as artifact
        if: ${{ steps.run.outputs.trace != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile_${{ env.RESULT_FILENAME }}
          path: profile_${{ env.RESULT_FILENAME }}.trace.json.gz
          if-no-files-found: ignore

      - name: Upload TP-0-DECODE trace as artifact
        if: ${{ steps.run.outputs.tp0_decode != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile_${{ env.RESULT_FILENAME }}_TP0_DECODE
          path: ${{ steps.run.outputs.tp0_decode }}
          if-no-files-found: ignore

      - name: Upload TP-0-EXTEND trace as artifact
        if: ${{ steps.run.outputs.tp0_extend != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile_${{ env.RESULT_FILENAME }}_TP0_EXTEND
          path: ${{ steps.run.outputs.tp0_extend }}
          if-no-files-found: ignore

      - name: Upload MoE debug log as artifact
        if: ${{ env.MOE_DEBUG == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moe_debug_${{ env.RESULT_FILENAME }}
          path: "moe_debug.tp0.log"
          if-no-files-found: ignore

      - name: Checkout storage repo
        if: ${{ steps.run.outputs.trace != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SemiAnalysisAI/InferenceX-trace-storage
          path: storage
          ref: master
          # Storage-repository deploy key for authorized profiling dispatches.
          ssh-key: ${{ secrets.PROFILER_STORAGE_DEPLOY_KEY }} # zizmor: ignore[secrets-outside-env]
          fetch-depth: 0
          # This separate storage checkout pushes trace commits using its scoped deploy key.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Push profile to storage repo
        if: ${{ steps.run.outputs.trace != '' }}
        id: push
        env:
          MATRIX_CONFIG_RUNNER: ${{ matrix.config.runner }}
          MATRIX_CONFIG_EXP_NAME: ${{ matrix.config['exp-name'] }}
          MATRIX_EP: ${{ matrix.config.ep || 1 }}
          TRACE_LOCAL: ${{ steps.run.outputs.trace }}
        shell: bash
        run: |
          set -eo pipefail

          dest_dir="storage/profiles/${GITHUB_SHA}/${MATRIX_CONFIG_RUNNER}/${FRAMEWORK}/${MATRIX_CONFIG_EXP_NAME}_${PRECISION}_tp${TP}_pp${PP_SIZE}_dcp${DCP_SIZE}_pcp${PCP_SIZE}_ep${MATRIX_EP}_conc${CONC}"
          mkdir -p "$dest_dir"
          cp "$TRACE_LOCAL" "$dest_dir/trace.json.gz"

          pushd storage >/dev/null
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Add profile: ${GITHUB_SHA} ${MATRIX_CONFIG_EXP_NAME} tp${TP} pp${PP_SIZE} dcp${DCP_SIZE} pcp${PCP_SIZE} ep${MATRIX_EP} conc${CONC}" || echo "Nothing to commit"
          git push
          STORAGE_SHA="$(git rev-parse HEAD)"
          popd >/dev/null

          export RAW_URL="https://raw.githubusercontent.com/SemiAnalysisAI/InferenceX-trace-storage/${STORAGE_SHA}/profiles/${GITHUB_SHA}/${MATRIX_CONFIG_RUNNER}/${FRAMEWORK}/${MATRIX_CONFIG_EXP_NAME}_${PRECISION}_tp${TP}_pp${PP_SIZE}_dcp${DCP_SIZE}_pcp${PCP_SIZE}_ep${MATRIX_EP}_conc${CONC}/trace.json.gz"
          export TITLE="${MATRIX_CONFIG_EXP_NAME}_${PRECISION}_tp${TP}_pp${PP_SIZE}_dcp${DCP_SIZE}_pcp${PCP_SIZE}_ep${MATRIX_EP}_conc${CONC}"

          enc_src="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["RAW_URL"], safe=""))')"
          enc_title="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["TITLE"], safe=""))')"

          relay="${PERFETTO_RELAY_URL%/}"
          RELAY_URL="${relay}/?src=${enc_src}&title=${enc_title}"

          echo "raw_url=$RAW_URL" >> "$GITHUB_OUTPUT"
          echo "relay_url=$RELAY_URL" >> "$GITHUB_OUTPUT"

      - name: Print Perfetto link (relay)
        if: ${{ steps.push.outputs.relay_url != '' }}
        env:
          RELAY_URL: ${{ steps.push.outputs.relay_url }}
          RAW_URL: ${{ steps.push.outputs.raw_url }}
        shell: bash
        run: |
          set -eo pipefail
          echo "RAW trace URL: $RAW_URL"
          echo "Perfetto Relay URL: $RELAY_URL"
          printf "\n**Perfetto (Relay):** %s\n" "$RELAY_URL" >> "$GITHUB_STEP_SUMMARY"
