name: Profile

# Independent profiling requests use priority-scheduled runner slots.
on: # zizmor: ignore[concurrency-limits]
  workflow_dispatch:
    inputs:
      config-key:
        description: "Config key from config yaml"
        required: true
        type: string
      config-file:
        description: "Config file to use"
        required: false
        type: string
        default: 'configs/nvidia-master.yaml'
      conc:
        description: "Concurrency value (must exist in config's conc-range/list)"
        required: false
        type: string
        default: '64'
      moe-debug:
        description: "Enable MoE debug patch and log (MOE_DEBUG_LOG)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Ref (branch/sha) to checkout"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/inferencex-e2e
  INFERENCEX_E2E_ROOT: ${{ github.workspace }}
  PORT: '8888'
  INFMAX_CONTAINER_WORKSPACE: '/workspace'
  DSV41_MIN_CUDAGRAPH_CAPTURE_SIZE: '1'
  MODEL_DOWNLOAD_LOCK_TIMEOUT: '21600'
  ENROOT_IMPORT_TIME_LIMIT: '120'
  SALLOC_TIME_LIMIT: '480'
  KEEP_LOGS: '0'
  EVAL_ONLY: 'false'
  RUN_EVAL: 'false'
  IS_AGENTIC: '0'
  IS_MULTINODE: 'false'
  SCENARIO_SUBDIR: fixed_seq_len/
  HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
  HF_HUB_CACHE: '/mnt/hf_hub_cache/'
  RANDOM_RANGE_RATIO: '0.8'
  PERFETTO_RELAY_URL: https://semianalysisai.github.io/InferenceX-trace-storage
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache

jobs:
  get-jobs:
    name: get-jobs
    runs-on: ubuntu-latest
    outputs:
      filtered-matrix: ${{ steps.filter.outputs.filtered }}
      count: ${{ steps.filter.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Checkout priority scheduler tooling
        if: ${{ inputs.ref && inputs.ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-priority
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: gen
        name: Generate matrix via script
        run: |
          if [[ -f inferencex-e2e/configs/runners.yaml ]]; then cd inferencex-e2e; fi
          MEASURED_ROOT="$PWD"
          PRIORITY_ROOT="${GITHUB_WORKSPACE}"
          if [ -d "${GITHUB_WORKSPACE}/.ci-priority" ]; then
            PRIORITY_ROOT="${GITHUB_WORKSPACE}/.ci-priority"
          fi
          if [[ -f "$PRIORITY_ROOT/inferencex-e2e/configs/runners.yaml" ]]; then
            PRIORITY_ROOT="$PRIORITY_ROOT/inferencex-e2e"
          fi
          env PYTHONPATH="$PRIORITY_ROOT" python3 -P -m infx.workflows.require_launcher "$GITHUB_WORKSPACE"
          source "$PRIORITY_ROOT/benchmarks/check_env.sh"
          check_env_vars INPUTS_CONFIG_FILE INPUTS_CONFIG_KEY INPUTS_CONC
          GENERATOR_PATH="${MEASURED_ROOT}"
          if [ -f "${MEASURED_ROOT}/infx/matrix/generate.py" ]; then
            GENERATOR=(-m infx.matrix.generate)
          elif [ -f "${MEASURED_ROOT}/utils/matrix_logic/generate_sweep_configs.py" ]; then
            GENERATOR=("${MEASURED_ROOT}/utils/matrix_logic/generate_sweep_configs.py")
            GENERATOR_PATH="${MEASURED_ROOT}/utils/matrix_logic:${MEASURED_ROOT}"
          else
            echo "Matrix generator not found in selected checkout" >&2
            exit 1
          fi
          CONFIG_JSON=$(env PYTHONPATH="$GENERATOR_PATH" \
            uv run --no-project --exclude-newer PT12H --python 3.12 --with pydantic --with pyyaml \
            python -P "${GENERATOR[@]}" \
            test-config --config-files "$INPUTS_CONFIG_FILE" --config-keys "$INPUTS_CONFIG_KEY" --conc "$INPUTS_CONC")
          CONFIG_JSON=$(printf '%s' "$CONFIG_JSON" | env PYTHONPATH="$PRIORITY_ROOT" uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
            python -P -m infx.workflows.ci_priority \
            --policy "${PRIORITY_ROOT}/configs/ci-priority.yaml" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --queue-namespace "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --criteria-json "${PRIORITY_CRITERIA}")
          echo "raw=$CONFIG_JSON" >> "$GITHUB_OUTPUT"

        env:
          PRIORITY_CRITERIA: ${{ inputs.moe-debug && '["patchwork"]' || '' }}
          INPUTS_CONFIG_FILE: ${{ inputs.config-file }}
          INPUTS_CONFIG_KEY: ${{ inputs.config-key }}
          INPUTS_CONC: ${{ inputs.conc }}

      - id: filter
        name: Take first generated job
        shell: python
        env:
          STEPS_GEN_OUTPUTS_RAW: ${{ steps.gen.outputs.raw }}
        run: |
          import json, os, sys
          raw = os.environ["STEPS_GEN_OUTPUTS_RAW"]
          try:
            data = json.loads(raw)
          except Exception as e:
            print('Invalid generator output:', e, file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("filtered=[]\ncount=0\n")
            raise

          if not isinstance(data, list):
            print('Generator output is not a list.', file=sys.stderr)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("filtered=[]\ncount=0\n")
            raise SystemExit(1)

          filt = data[:1]

          for entry in filt:
            node_count = entry.get('node-count', 1)
            if isinstance(node_count, bool) or not isinstance(node_count, int) or node_count != 1:
              print(
                'Profile supports only validated single-node matrix entries; '
                f'got node-count={node_count!r}.',
                file=sys.stderr,
              )
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write("filtered=[]\ncount=0\n")
              raise SystemExit(1)
            entry['node-count'] = node_count

          out = json.dumps(filt)
          print(out)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"filtered={out}\n")
            f.write(f"count={len(filt)}\n")

      - name: Fail if no matching entries
        if: ${{ steps.filter.outputs.count == '0' }}
        run: |
          echo "No entries produced for config-key=${INPUTS_CONFIG_KEY}, conc=${INPUTS_CONC}." >&2
          exit 1
        env:
          INPUTS_CONFIG_KEY: ${{ inputs.config-key }}
          INPUTS_CONC: ${{ inputs.conc }}

  profile:
    needs: get-jobs
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.get-jobs.outputs.filtered-matrix) }}
    name: >-
      p${{ matrix.config.priority }} | ${{ matrix.config.model-prefix }} ${{ matrix.config.precision }} ${{ matrix.config.runner }} ${{ matrix.config.framework }}
      TP${{ matrix.config.tp }}${{ matrix.config.pp != '' && matrix.config.pp != '1' && format('/PP{0}', matrix.config.pp) || '' }}${{ matrix.config.dcp-size != '' && matrix.config.dcp-size != '1' && format('/DCP{0}', matrix.config.dcp-size) || '' }}${{ matrix.config.pcp-size != '' && matrix.config.pcp-size != '1' && format('/PCP{0}', matrix.config.pcp-size) || '' }} c${{ matrix.config.conc }}
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(matrix.config.runner),
            toJSON(format('nodes:{0}', matrix.config['node-count'])),
            toJSON(format(
              'ci-job-{0}-{1}',
              matrix.config.priority,
              matrix.config['queue-token']
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},{1},{2}]',
            toJSON(matrix.config.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              matrix.config.priority,
              matrix.config['queue-token']
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0}]', toJSON(matrix.config.runner))
      ) }}
    env:
      EXP_NAME: ${{ matrix.config.exp-name }}
      MODEL: ${{ matrix.config.model }}
      MODEL_PREFIX: ${{ matrix.config.model-prefix }}
      ISL: ${{ matrix.config.isl }}
      OSL: ${{ matrix.config.osl }}
      MAX_MODEL_LEN: ${{ matrix.config.max-model-len }}
      IMAGE: ${{ matrix.config.image }}
      FRAMEWORK: ${{ matrix.config.framework }}
      PRECISION: ${{ matrix.config.precision }}
      TP: ${{ matrix.config.tp }}
      PP_SIZE: ${{ matrix.config.pp }}
      DCP_SIZE: ${{ matrix.config.dcp-size }}
      PCP_SIZE: ${{ matrix.config.pcp-size }}
      EP_SIZE: ${{ matrix.config.ep }}
      DP_ATTENTION: ${{ matrix.config['dp-attn'] }}
      CONC: ${{ matrix.config.conc }}
      SPEC_DECODING: ${{ matrix.config.spec-decoding }}
      DISAGG: ${{ matrix.config.disagg }}
      MOE_DEBUG: '0'
      MOE_DEBUG_LOG: ${{ (inputs.moe-debug) && '/workspace/moe_debug.tp0.log' || '' }}
    steps:
      - name: Slurm cleanup
        run: |
          if command -v squeue >/dev/null 2>&1; then
            for job_name in "${RUNNER_NAME}" "inferencex-${RUNNER_NAME}"; do
              echo "[Slurm] Cleaning up jobs with name: ${job_name} ..."
              scancel --name="${job_name}" || true
              while [ -n "$(squeue --name="${job_name}" --noheader --format='%i')" ]; do
                squeue --name="${job_name}"
                sleep 5
              done
            done
          fi

      - name: Repair stale git state (pre-run)
        shell: bash
        run: |
          # Interrupted jobs leave stale locks and damaged git state in the
          # persistent workspace. actions/checkout only clears the top-level
          # index.lock/shallow.lock and recreates the repo when the top-level
          # clean/reset fails, yet every checkout also runs
          # `git submodule foreach --recursive` and walks every ref, so a
          # damaged submodule or a ref to an unreadable object fails the job.
          # One job runs per runner, so every lock here is stale. Keep
          # identical in benchmark-tmpl.yml, benchmark-multinode-tmpl.yml,
          # operatorx-sweep.yml, profile.yml and speedbench-al.yml.
          repo_dir="${GITHUB_WORKSPACE}"
          if [ -d "${repo_dir}/.git" ]; then
            git_in() { local dir="$1"; shift; git --git-dir="${dir}" --work-tree="${dir}" "$@"; }
            # Nested module git dirs are cleared when they are checked.
            clear_locks() {
              local lock n=0
              while IFS= read -r -d '' lock; do
                rm -f "${lock}" && n=$((n + 1))
              done < <(find "$1" -path "$1/modules" -prune -o -path '*/objects/[0-9a-f][0-9a-f]' -prune \
                -o -name '*.lock' -type f -print0)
              echo "${n}"
            }
            # Top-level checkout fetches the exact SHA, so its remote-tracking
            # refs and tags go at the file level: a damaged object or a
            # misordered packed-refs can turn `update-ref -d` into a silent
            # no-op. Other refs, including module tags (srt-slurm takes its
            # version from them), stay only while rev-list, which reads
            # objects the way checkout's ref walk does, can parse their
            # object. Sets pruned to how many listed refs actually went.
            prune_refs() {
              local before refs parsed prune
              before=$(git_in "$1" for-each-ref --format='%(refname)' | wc -l)
              if [ "$2" = top-level ]; then
                rm -rf "$1/refs/remotes" "$1/refs/tags" "$1/logs/refs/remotes" "$1/logs/refs/tags" || return 1
                if [ -f "$1/packed-refs" ]; then
                  awk '/^\^/ { if (!skip) print; next } { skip = $2 ~ /^refs\/(remotes|tags)\//; if (!skip) print }' \
                    "$1/packed-refs" > "$1/packed-refs.new" && mv "$1/packed-refs.new" "$1/packed-refs" || return 1
                fi
              fi
              refs=$(git_in "$1" for-each-ref --format='%(objectname) %(refname)') || return 1
              parsed=$(cut -d ' ' -f 1 <<<"${refs}" |
                git_in "$1" rev-list --objects --no-walk --ignore-missing --stdin | cut -d ' ' -f 1) || return 1
              mapfile -t prune < <(awk 'NR == FNR { ok[$1] = 1; next } NF == 2 && !($1 in ok) && !seen[$2]++ { print $2 }' \
                <(printf '%s\n' "${parsed}") <(printf '%s\n' "${refs}"))
              if [ "${#prune[@]}" -gt 0 ]; then
                printf 'delete %s\n' "${prune[@]}" | git_in "$1" update-ref --no-deref --stdin || return 1
              fi
              pruned=$((before - $(git_in "$1" for-each-ref --format='%(refname)' | wc -l)))
            }
            # Prints one summary line per git dir and fails when it is damaged.
            # Every checkout reads a module's remote.origin.url, HEAD objects,
            # refs and index; checkout recreates the repo for a bad top-level
            # index. `rev-list --no-walk --all` repeats checkout's ref walk, so
            # a git dir reported ok cannot fail it.
            check_gitdir() {
              local locks pruned=0 reason=""
              locks=$(clear_locks "$1")
              if [ "$2" = module ] && ! git_in "$1" config --local --get remote.origin.url >/dev/null; then
                reason="no remote.origin.url"
              elif ! prune_refs "$1" "$2"; then
                reason="refs could not be pruned"
              elif ! git_in "$1" rev-list --objects --no-walk HEAD >/dev/null; then
                reason="HEAD objects unreadable"
              elif [ "$2" = top-level ] && [ -n "$(git_in "$1" for-each-ref --format='%(refname)' refs/remotes refs/tags)" ]; then
                reason="remote refs or tags survived"
              elif ! git_in "$1" for-each-ref --format='%(refname)' >/dev/null || ! git_in "$1" rev-list --no-walk --all >/dev/null; then
                reason="refs unreadable"
              elif [ "$2" = module ] && ! git_in "$1" ls-files --stage >/dev/null; then
                reason="index unreadable"
              fi
              echo "[git-repair] ${1#"${repo_dir}/"}: ${locks} locks, ${pruned} refs pruned, ${reason:+dropped: }${reason:-ok}"
              [ -z "${reason}" ]
            }
            # Module git dirs sit at any depth below .git/modules; names may
            # contain '/', so dirs without HEAD/config/objects/refs only group
            # them.
            is_gitdir() { [ -e "$1/HEAD" ] || [ -e "$1/config" ] || [ -e "$1/objects" ] || [ -e "$1/refs" ]; }
            drop_damaged_gitdirs() {
              local d wt root
              for d in "$1"/*/; do
                d="${d%/}"
                [ -d "${d}" ] && [ ! -L "${d}" ] || continue
                if ! is_gitdir "${d}"; then
                  drop_damaged_gitdirs "${d}"
                elif check_gitdir "${d}" module; then
                  drop_damaged_gitdirs "${d}/modules"
                else
                  # Its worktree, even one no longer in .gitmodules, would keep
                  # a .git file pointing at the removed git dir.
                  if wt=$(git config -f "${d}/config" core.worktree) &&
                    wt=$(cd "${d}" && cd "${wt}" && pwd -P) && root=$(cd "${repo_dir}" && pwd -P) &&
                    [ -f "${wt}/.git" ] && [ "${wt#"${root}"/}" != "${wt}" ]; then
                    echo "[git-repair] Removing its worktree: ${wt#"${root}"/}"
                    rm -rf "${wt:?}" || true
                  fi
                  rm -rf "${d:?}" || true
                fi
              done
            }
            # `submodule update` re-clones only into an empty worktree, so a
            # worktree whose git dir is gone or partial, or whose .git file
            # does not resolve, is removed together with that git dir.
            drop_orphaned_worktrees() {
              local entry name path wt gd
              [ -f "$1/.gitmodules" ] || return 0
              while IFS= read -r -d '' entry; do
                name="${entry%%$'\n'*}"
                name="${name#submodule.}"
                name="${name%.path}"
                path="${entry#*$'\n'}"
                case "/${name}/ /${path}/" in *//*|*/./*|*/../*) continue ;; esac
                wt="$1/${path}"
                gd="$2/modules/${name}"
                if is_gitdir "${gd}" &&
                  { [ ! -f "${wt}/.git" ] || git -C "${wt}" rev-parse --git-dir >/dev/null; }; then
                  drop_orphaned_worktrees "${wt}" "${gd}"
                elif [ -e "${gd}" ] || [ -n "$(ls -A "${wt}" 2>/dev/null)" ]; then
                  echo "[git-repair] Removing damaged submodule: ${wt#"${repo_dir}/"} (git dir ${gd#"${repo_dir}/"})"
                  rm -rf "${gd:?}" "${wt:?}" || true
                fi
              done < <(git config -z -f "$1/.gitmodules" --get-regexp '^submodule\..*\.path$')
            }
            # A damaged top-level repo is removed, so checkout re-clones it
            # instead of failing.
            if check_gitdir "${repo_dir}/.git" top-level; then
              drop_damaged_gitdirs "${repo_dir:?}/.git/modules"
              drop_orphaned_worktrees "${repo_dir:?}" "${repo_dir:?}/.git"
            else
              rm -rf "${repo_dir:?}/.git" || true
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          clean: false
          persist-credentials: false

      - name: Checkout result tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .result-tooling
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Prepare result-processing Python
        env: &uv-setup-env
          UV_CACHE_DIR: ${{ github.workspace }}/../.infx-uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/../.infx-uv-python
        run: |
          uv python install --quiet --no-bin 3.12
          result_python=$(uv python find --system 3.12)
          "$result_python" --version
          echo "INFERENCEX_RESULTS_PYTHON=$result_python" >> "$GITHUB_ENV"

      - name: Prepare launcher Python
        env: *uv-setup-env
        run: |
          launch_venv="$RUNNER_TEMP/infx-launch-venv"
          uv venv --quiet --python 3.12 "$launch_venv"
          uv pip install --quiet --exclude-newer PT12H --python "$launch_venv/bin/python" \
            -r "$GITHUB_WORKSPACE/.result-tooling/inferencex-e2e/pyproject.toml"
          echo "INFERENCEX_LAUNCH_PYTHON=$launch_venv/bin/python" >> "$GITHUB_ENV"

      - name: Launcher cleanup
        env:
          PYTHONPATH: ${{ github.workspace }}/.result-tooling/inferencex-e2e
        run: |
          "$INFERENCEX_LAUNCH_PYTHON" -P -m infx.launch cleanup

      - name: Launch + Profile (single-node sglang/vllm)
        id: run
        env:
          RUNNER_NAME: ${{ runner.name }}
          PROFILE: '1'
          SGLANG_TORCH_PROFILER_DIR: /workspace/
          VLLM_TORCH_PROFILER_DIR: /workspace/
          VLLM_RPC_TIMEOUT: '1800000'
        shell: bash
        run: |
          if [[ -f inferencex-e2e/configs/runners.yaml ]]; then cd inferencex-e2e; fi
          export GITHUB_WORKSPACE="$PWD"
          echo "INFERENCEX_E2E_ROOT=$PWD" >> "$GITHUB_ENV"
          set -eo pipefail
          export GPU_COUNT=$((TP * PP_SIZE * PCP_SIZE))
          echo "GPU_COUNT=${GPU_COUNT}" >> "$GITHUB_ENV"
          ep_val="${EP_SIZE:-1}"
          res_name="${EXP_NAME}_${PRECISION}_${FRAMEWORK}_tp${TP}-pp${PP_SIZE}-dcp${DCP_SIZE}-pcp${PCP_SIZE}_ep${ep_val}_dpa_${DP_ATTENTION}_conc${CONC}_${RUNNER_NAME}"
          export RESULT_FILENAME="${res_name}"
          echo "RESULT_FILENAME=${res_name}" >> "$GITHUB_ENV"

          source benchmarks/runtime_settings.sh
          "$INFERENCEX_LAUNCH_PYTHON" -m infx.launch run

          if [ ! -f "${res_name}.json" ]; then
            echo "Run failed: Benchmark result ${res_name}.json not found." >&2
            exit 1
          fi

          trace_path="profile_${res_name}.trace.json.gz"
          if [ -f "$trace_path" ]; then
            echo "trace=$PWD/$trace_path" >> "$GITHUB_OUTPUT"
            if [ "${FRAMEWORK}" = "sglang" ]; then
              # Try to locate corresponding TP-0 traces produced by SGLang profiler
              merged_latest=$(ls -t profiles/merged-*.trace.json.gz 2>/dev/null | head -n1 || true)
              if [ -n "${merged_latest}" ] && [ -f "${merged_latest}" ]; then
                ts_name="${merged_latest##*/}"
                ts_name="${ts_name#merged-}"
                ts_name="${ts_name%.trace.json.gz}"
                tp0_decode="profiles/${ts_name}-TP-0-DECODE.trace.json.gz"
                tp0_extend="profiles/${ts_name}-TP-0-EXTEND.trace.json.gz"
                if [ -f "${tp0_decode}" ]; then
                  echo "tp0_decode=$PWD/${tp0_decode}" >> "$GITHUB_OUTPUT"
                fi
                if [ -f "${tp0_extend}" ]; then
                  echo "tp0_extend=$PWD/${tp0_extend}" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
          else
            echo "Profile trace not found: $trace_path" >&2
          fi

      - name: Process result (json -> agg)
        env:
          RUNNER_TYPE: ${{ matrix.config.runner }}
          PYTHONPATH: ${{ github.workspace }}/.result-tooling/inferencex-e2e
        run: |
          if [[ -f inferencex-e2e/configs/runners.yaml ]]; then cd inferencex-e2e; fi
          source "$PYTHONPATH/benchmarks/check_env.sh"
          check_env_vars INFERENCEX_RESULTS_PYTHON
          "$INFERENCEX_RESULTS_PYTHON" -P -m infx.results.fixed_sequence

      - name: Upload profile as artifact
        if: ${{ steps.run.outputs.trace != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile_${{ env.RESULT_FILENAME }}
          path: ${{ steps.run.outputs.trace }}
          if-no-files-found: ignore

      - name: Upload TP-0-DECODE trace as artifact
        if: ${{ steps.run.outputs.tp0_decode != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile_${{ env.RESULT_FILENAME }}_TP0_DECODE
          path: ${{ steps.run.outputs.tp0_decode }}
          if-no-files-found: ignore

      - name: Upload TP-0-EXTEND trace as artifact
        if: ${{ steps.run.outputs.tp0_extend != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile_${{ env.RESULT_FILENAME }}_TP0_EXTEND
          path: ${{ steps.run.outputs.tp0_extend }}
          if-no-files-found: ignore

      - name: Upload MoE debug log as artifact
        if: ${{ env.MOE_DEBUG == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moe_debug_${{ env.RESULT_FILENAME }}
          path: ${{ env.INFERENCEX_E2E_ROOT }}/moe_debug.tp0.log
          if-no-files-found: ignore

      - name: Checkout storage repo
        if: ${{ steps.run.outputs.trace != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SemiAnalysisAI/InferenceX-trace-storage
          path: storage
          ref: master
          # Storage-repository deploy key for authorized profiling dispatches.
          ssh-key: ${{ secrets.PROFILER_STORAGE_DEPLOY_KEY }} # zizmor: ignore[secrets-outside-env]
          fetch-depth: 0
          # This separate storage checkout pushes trace commits using its scoped deploy key.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Push profile to storage repo
        if: ${{ steps.run.outputs.trace != '' }}
        id: push
        env:
          MATRIX_CONFIG_RUNNER: ${{ matrix.config.runner }}
          MATRIX_CONFIG_EXP_NAME: ${{ matrix.config['exp-name'] }}
          MATRIX_EP: ${{ matrix.config.ep || 1 }}
          TRACE_LOCAL: ${{ steps.run.outputs.trace }}
        shell: bash
        run: |
          set -eo pipefail

          dest_dir="storage/profiles/${GITHUB_SHA}/${MATRIX_CONFIG_RUNNER}/${FRAMEWORK}/${MATRIX_CONFIG_EXP_NAME}_${PRECISION}_tp${TP}_pp${PP_SIZE}_dcp${DCP_SIZE}_pcp${PCP_SIZE}_ep${MATRIX_EP}_conc${CONC}"
          mkdir -p "$dest_dir"
          cp "$TRACE_LOCAL" "$dest_dir/trace.json.gz"

          pushd storage >/dev/null
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Add profile: ${GITHUB_SHA} ${MATRIX_CONFIG_EXP_NAME} tp${TP} pp${PP_SIZE} dcp${DCP_SIZE} pcp${PCP_SIZE} ep${MATRIX_EP} conc${CONC}" || echo "Nothing to commit"
          git push
          STORAGE_SHA="$(git rev-parse HEAD)"
          popd >/dev/null

          export RAW_URL="https://raw.githubusercontent.com/SemiAnalysisAI/InferenceX-trace-storage/${STORAGE_SHA}/profiles/${GITHUB_SHA}/${MATRIX_CONFIG_RUNNER}/${FRAMEWORK}/${MATRIX_CONFIG_EXP_NAME}_${PRECISION}_tp${TP}_pp${PP_SIZE}_dcp${DCP_SIZE}_pcp${PCP_SIZE}_ep${MATRIX_EP}_conc${CONC}/trace.json.gz"
          export TITLE="${MATRIX_CONFIG_EXP_NAME}_${PRECISION}_tp${TP}_pp${PP_SIZE}_dcp${DCP_SIZE}_pcp${PCP_SIZE}_ep${MATRIX_EP}_conc${CONC}"

          enc_src="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["RAW_URL"], safe=""))')"
          enc_title="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["TITLE"], safe=""))')"

          relay="${PERFETTO_RELAY_URL%/}"
          RELAY_URL="${relay}/?src=${enc_src}&title=${enc_title}"

          echo "raw_url=$RAW_URL" >> "$GITHUB_OUTPUT"
          echo "relay_url=$RELAY_URL" >> "$GITHUB_OUTPUT"

      - name: Print Perfetto link (relay)
        if: ${{ steps.push.outputs.relay_url != '' }}
        env:
          RELAY_URL: ${{ steps.push.outputs.relay_url }}
          RAW_URL: ${{ steps.push.outputs.raw_url }}
        shell: bash
        run: |
          set -eo pipefail
          echo "RAW trace URL: $RAW_URL"
          echo "Perfetto Relay URL: $RELAY_URL"
          printf "\n**Perfetto (Relay):** %s\n" "$RELAY_URL" >> "$GITHUB_STEP_SUMMARY"
