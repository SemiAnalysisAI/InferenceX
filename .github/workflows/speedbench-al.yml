name: B300 native job 2746 state (no GPU)
run-name: pr3088-native2746-state-${{ github.run_id }}
'on':
  workflow_dispatch:
    inputs:
      runner:
        description: Existing B300 CI route
        type: string
        default: b300
      model-prefix:
        description: Priority scope
        type: string
        default: kimik3
      ref:
        description: Reviewed diagnostic SHA
        type: string
        required: true
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        clean: true
        persist-credentials: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
    - id: score
      env:
        RUNNER: ${{ inputs.runner }}
        MODEL_PREFIX: ${{ inputs.model-prefix }}
      run: |
        entry=$(jq -cn \
          --arg runner "$RUNNER" \
          --arg model_prefix "$MODEL_PREFIX" \
          '[{
            runner: $runner,
            framework: "vllm",
            "model-prefix": $model_prefix,
            precision: "fp4",
            "spec-decoding": "mtp"
          }]')
        scored=$(printf '%s' "$entry" |
          uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
            python -m infx.workflows.ci_priority \
            --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}")
        echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
        echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"
  collect-al:
    needs: setup
    runs-on: |-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(inputs.runner),
            toJSON('nodes:1'),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},"nodes:1",{1},{2}]',
            toJSON(inputs.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0},"nodes:1"]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 5
    name: p${{ needs.setup.outputs.priority }} | B300 no-GPU native 2746 state
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.sha }}
        clean: true
        persist-credentials: false
    - name: Read native 2746 and existing runtime identity
      shell: bash
      run: SQUASH_FILE="$HOME/squash/vllm_vllm-openai_nightly-dev-x86_64-cu13-3696c77.sqsh" timeout --signal=TERM --kill-after=5s
        90s bash diagnostics/pr3088-hang/native2746-state.sh "$RUNNER_TEMP/pr3088-native2746-state"
    - name: Preserve native state evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr3088-native2746-state-${{ github.run_id }}
        path: ${{ runner.temp }}/pr3088-native2746-state/
        if-no-files-found: error
