name: SpeedBench AL Collection

# Push-button (workflow_dispatch) collection of a SPEED-Bench acceptance-length
# (AL) matrix: thinking_on/off x MTP levels, for the given model (defaults to
# DeepSeek-V4-Pro). Produces the golden reference consumed by the
# synthetic-acceptance framework and (optionally) opens a PR committing the
# measured matrix to golden_al_distribution/ with its source run URL.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted GPU runner label (B300)"
        required: false
        type: string
        default: 'b300'
      model:
        description: "HF model id (basename must be in launcher STAGED_MODELS for pre-staged local weights)"
        required: false
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Pro'
      model-prefix:
        description: "Model prefix; drives launcher MODEL_PATH resolution, exp name, collector script, and artifact names"
        required: false
        type: string
        default: 'dsv4'
      image:
        description: "vLLM container image"
        required: false
        type: string
        default: 'vllm/vllm-openai:v0.21.0'
      mtp-list:
        description: "Space-separated MTP levels (num_speculative_tokens)"
        required: false
        type: string
        default: '1 2 3 4 5 6 7 8'
      thinking-modes:
        description: "Space-separated thinking modes to collect"
        required: false
        type: string
        default: 'off on'
      category:
        description: "SPEED-Bench category"
        required: false
        type: string
        default: 'coding'
      output-len:
        description: "Per-request output length"
        required: false
        type: string
        default: '4096'
      thinking-kwargs:
        description: "chat_template_kwargs JSON for thinking-on cells (match golden config)"
        required: false
        type: string
        default: '{"thinking": true, "reasoning_effort": "high"}'
      salloc-time:
        description: "Slurm allocation minutes (16 server starts ~ several hours)"
        required: false
        type: string
        default: '480'
      open-pr:
        description: "Open a PR committing the measured matrix to golden_al_distribution/ (default off: artifact-only, paste values in manually)"
        required: false
        type: boolean
        default: false
      golden-yaml-name:
        description: "Filename to commit under golden_al_distribution/ (e.g. qwen3.8next_mtp.yaml). Defaults to <model-prefix>_<spec-decoding>.yaml"
        required: false
        type: string
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
  HF_HUB_CACHE: '/mnt/hf_hub_cache/'
  # Drive the single-node path in runners/launch_b300-dsxe.sh. MODEL is the HF id;
  # its basename (e.g. DeepSeek-V4-Pro) must be in the launcher's STAGED_MODELS so
  # the launcher resolves MODEL_PATH to the pre-staged local weights and mounts
  # them. The collector serves from MODEL_PATH (see SERVE_MODEL), so no download.
  MODEL: ${{ inputs.model }}
  MODEL_PREFIX: ${{ inputs.model-prefix }}
  PRECISION: fp4
  FRAMEWORK: vllm
  EXP_NAME: ${{ inputs.model-prefix }}_speedbench
  IMAGE: ${{ inputs.image }}
  TP: '8'
  EP_SIZE: '1'
  DP_ATTENTION: 'false'
  SPEC_DECODING: mtp
  # Run the AL-matrix collector instead of the auto-selected throughput script.
  BENCH_SCRIPT_OVERRIDE: benchmarks/single_node/speedbench/${{ inputs.model-prefix }}_fp4_b300_vllm.sh
  SALLOC_TIME_LIMIT: ${{ inputs.salloc-time }}
  # Matrix-collector tunables (propagated into the container via srun --export=ALL).
  MTP_LIST: ${{ inputs.mtp-list }}
  THINKING_MODES: ${{ inputs.thinking-modes }}
  CATEGORY: ${{ inputs.category }}
  SPEEDBENCH_OUTPUT_LEN: ${{ inputs.output-len }}
  CHAT_TEMPLATE_KWARGS_ON: ${{ inputs.thinking-kwargs }}
  OUT_YAML: /workspace/speedbench-reference-al.yaml
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { clean: true, persist-credentials: false }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - id: score
        env:
          RUNNER: ${{ inputs.runner }}
          MODEL_PREFIX: ${{ inputs.model-prefix }}
        run: |
          entry=$(jq -cn \
            --arg runner "$RUNNER" \
            --arg model_prefix "$MODEL_PREFIX" \
            '[{
              runner: $runner,
              framework: "vllm",
              "model-prefix": $model_prefix,
              precision: "fp4",
              "spec-decoding": "mtp"
            }]')
          scored=$(printf '%s' "$entry" |
            uv run --no-project --with pyyaml --python 3.12 \
              utils/ci_priority.py \
              --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}")
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"

  collect-al:
    needs: setup
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(inputs.runner),
            toJSON('nodes:1'),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},{1},{2}]',
            toJSON(inputs.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0}]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 600
    name: "p${{ needs.setup.outputs.priority }} | SpeedBench AL matrix | ${{ inputs.category }} | mtp=[${{ inputs.mtp-list }}] | thinking=[${{ inputs.thinking-modes }}]"
    steps:
      - name: Resource cleanup (pre-run)
        run: &resource-cleanup |
          # Cleanup Docker resources
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "[Docker] Cleaning up resources ..."
            docker ps -aq | xargs -r docker rm -f
            docker network prune -f
            while [ -n "$(docker ps -aq)" ]; do
              docker ps -a
              sleep 5
            done
          fi

          # Cleanup SLURM resources
          if command -v squeue >/dev/null 2>&1; then
            echo "[Slurm] Cleaning up jobs with name: ${{ runner.name }} ..."
            scancel --name="${{ runner.name }}" || true
            while [ -n "$(squeue --name='${{ runner.name }}' --noheader --format='%i')" ]; do
              squeue --name="${{ runner.name }}"
              sleep 5
            done
          fi

          # Cleanup AL-matrix outputs from a prior job on this runner so a stale
          # matrix from a previous run is never picked up as this job's output.
          rm -rf "${{ github.workspace }}/speedbench_results" 2>/dev/null || true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          clean: true
          submodules: true

      - name: Cleanup stale outputs (pre-run)
        run: |
          rm -f speedbench-reference-al.yaml || true
          rm -f gpu_metrics.csv || true
          rm -rf speed_bench_data || true

      - name: Collect AL matrix
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          bash ./runners/launch_${RUNNER_NAME%%_*}.sh

          if [ ! -f "speedbench-reference-al.yaml" ]; then
            echo "AL collection failed: speedbench-reference-al.yaml not produced." >&2
            exit 1
          fi
          echo "### SpeedBench AL matrix" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          cat speedbench-reference-al.yaml >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AL matrix artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speedbench-reference-al-${{ inputs.model-prefix }}
          path: speedbench-reference-al.yaml
          if-no-files-found: warn

      - name: Open PR committing golden AL matrix
        if: ${{ inputs.open-pr && success() }}
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          # Resolve the canonical golden_al_distribution/ filename. The naming
          # convention is <model-prefix>_<method>.yaml (e.g. qwen3.8next_mtp.yaml,
          # kimik2.5_eagle3.yaml); allow an explicit override for non-standard
          # suffixes such as the dspark probabilistic-sample curves.
          METHOD="${{ env.SPEC_DECODING }}"
          GOLDEN_YAML_NAME="${{ inputs.golden-yaml-name }}"
          if [ -z "$GOLDEN_YAML_NAME" ]; then
            GOLDEN_YAML_NAME="${{ inputs.model-prefix }}_${METHOD}.yaml"
          fi
          GOLDEN_PATH="golden_al_distribution/${GOLDEN_YAML_NAME}"

          if [ ! -f "golden_al_distribution/README.md" ]; then
            echo "CRITICAL: golden_al_distribution/ not found on this ref — cannot commit the matrix." >&2
            exit 1
          fi

          # The collector emits the metadata header (dataset, sampling, model).
          # Prepend the source-run URL line so the committed YAML matches the
          # canonical shape of the other golden curves and is auditable.
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "# Source GitHub Actions run: ${RUN_URL}"
            cat speedbench-reference-al.yaml
          } > "$GOLDEN_PATH"

          # Keep the README "Current golden curves" table in sync: replace the
          # row whose Golden YAML cell links to this file, or append a new row.
          # Display label: humanize the model prefix (qwen3.8next -> Qwen3.8-Flash-Next
          # is left to the dispatcher; here we use the model-prefix as a stable label).
          python3 - <<PYEOF
          import re, sys
          path = "golden_al_distribution/README.md"
          src = open(path).read()
          name = "${GOLDEN_YAML_NAME}"
          run_url = "${RUN_URL}"
          label = "${{ inputs.model-prefix }}"
          method = "${METHOD}".upper()
          row = f"| {label} | {method} | [\`{name}\`]({name}) | [{RUN_ID}]({run_url}) |\n".replace("{RUN_ID}", "${{ github.run_id }}")
          pattern = re.compile(r"^\|[^|]*\|[^|]*\|\s*\[\`" + re.escape(name) + r"\`\][^|]*\|[^|]*\|\s*$", re.M)
          if pattern.search(src):
              src = pattern.sub(row.rstrip(), src)
          else:
              # Insert before the "Primary references" section if present; else append.
              marker = "## Primary references"
              if marker in src:
                  src = src.replace(marker, row + "\n" + marker, 1)
              else:
                  if not src.endswith("\n"): src += "\n"
                  src += row
          open(path, "w").write(src)
          PYEOF

          BRANCH="speedbench-al/${{ inputs.model-prefix }}-auto-${{ github.run_id }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$BRANCH"
          git add "$GOLDEN_PATH" golden_al_distribution/README.md
          if git diff --cached --quiet; then
            echo "No change in golden AL matrix; skipping PR."
            exit 0
          fi
          git commit -m "Add golden AL distribution for ${{ inputs.model-prefix }} (auto, run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Add golden AL distribution for ${{ inputs.model-prefix }} (auto)" \
            --body "Auto-generated by the SpeedBench AL Collection workflow (run ${{ github.run_id }}).\n\nModel: \`${{ inputs.model }}\`\nCategory: \`${{ inputs.category }}\`\nMTP: \`${{ inputs.mtp-list }}\`\nThinking: \`${{ inputs.thinking-modes }}\`\noutput_len: \`${{ inputs.output-len }}\`\nGolden YAML: \`${GOLDEN_YAML_NAME}\`\nSource run: ${RUN_URL}\n\nThe measured matrix is committed to \`golden_al_distribution/\` with the source-run URL header and the README table is updated. Please review the measured values (and the per-request detailed results artifact) before merging." \
            --base main \
            --head "$BRANCH"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speedbench_server_logs-${{ inputs.model-prefix }}
          path: speedbench_results/server_*.log
          if-no-files-found: ignore

      # Per-request benchmark detail (vllm bench serve --save-detailed): includes
      # the model's response text per request, so the AL of each cell can be
      # audited for output correctness (sensible text + correct thinking mode).
      - name: Upload detailed benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speedbench_detailed_results-${{ inputs.model-prefix }}
          path: speedbench_results/speedbench_*
          if-no-files-found: ignore

      - name: Resource cleanup (post-run)
        if: always()
        run: *resource-cleanup
