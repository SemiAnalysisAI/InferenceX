name: Failed sweep retry CPU probe
run-name: Failed sweep retry CPU probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  baseline:
    name: Successful baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Record successful baseline execution
        shell: bash
        run: |
          printf 'BASELINE run=%s attempt=%s job=%s time=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$(date -u +%FT%TZ)"
  retry-matrix:
    name: Retry probe (${{ matrix.lane }})
    needs: baseline
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        lane: [fail, cancelled]
    uses: ./.github/workflows/speedbench-retry-probe-tmpl.yml
    with:
      lane: ${{ matrix.lane }}
