name: SpeedBench AL Collection
run-name: "Read native MTP collection progress"

# Push-button (workflow_dispatch) collection of a SPEED-Bench acceptance-length
# (AL) matrix: thinking_on/off x MTP levels, for the given model (defaults to
# DeepSeek-V4-Pro). Produces the golden reference consumed by the
# synthetic-acceptance framework and (optionally) opens a PR updating
# benchmarks/speedbench-reference-al.yaml.

# Independent collection requests use priority-scheduled runner slots.
on: # zizmor: ignore[concurrency-limits]
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted GPU runner label (B300)"
        required: false
        type: string
        default: 'b300'
      model:
        description: "HF model id (basename must be in launcher STAGED_MODELS for pre-staged local weights)"
        required: false
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Pro'
      model-prefix:
        description: "Model prefix; drives launcher MODEL_PATH resolution, exp name, collector script, and artifact names"
        required: false
        type: string
        default: 'dsv4'
      image:
        description: "vLLM container image"
        required: false
        type: string
        default: 'vllm/vllm-openai:v0.21.0'
      precision:
        description: "Target precision"
        type: string
        default: 'fp4'
      tp:
        description: "Tensor parallel size and allocated GPU count"
        type: string
        default: '8'
      collector-script:
        description: "Optional model-specific collector path"
        type: string
      model-revision:
        description: "Model checkpoint revision for revision-aware collectors"
        type: string
        default: 'main'
      speculative-config:
        description: "Real draft configuration; collector supplies num_speculative_tokens"
        type: string
        default: '{"method":"mtp"}'
      mtp-list:
        description: "Space-separated MTP levels (num_speculative_tokens)"
        required: false
        type: string
        default: '1 2 3 4 5 6 7 8'
      thinking-modes:
        description: "Space-separated thinking modes to collect"
        required: false
        type: string
        default: 'off on'
      category:
        description: "SPEED-Bench category"
        required: false
        type: string
        default: 'coding'
      output-len:
        description: "Per-request output length"
        required: false
        type: string
        default: '4096'
      thinking-kwargs:
        description: "chat_template_kwargs JSON for thinking-on cells (match golden config)"
        required: false
        type: string
        default: '{"thinking": true, "reasoning_effort": "high"}'
      salloc-time:
        description: "Slurm allocation minutes (16 server starts ~ several hours)"
        required: false
        type: string
        default: '480'
      open-pr:
        description: "Open a PR updating benchmarks/speedbench-reference-al.yaml (default off: artifact-only, paste values in manually)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string

permissions:
  contents: read

env:
  DRAFT_SAMPLE_METHOD: greedy
  PORT: '8888'
  INFMAX_CONTAINER_WORKSPACE: '/workspace'
  DSV41_MIN_CUDAGRAPH_CAPTURE_SIZE: '1'
  MODEL_DOWNLOAD_LOCK_TIMEOUT: '21600'
  ENROOT_IMPORT_TIME_LIMIT: '120'
  GPU_MONITOR_INTERVAL: '1'
  GPU_METRICS_CSV: 'gpu_metrics.csv'
  KEEP_LOGS: '0'
  IS_MULTINODE: 'false'
  EVAL_ONLY: 'false'
  RUN_EVAL: 'false'
  IS_AGENTIC: '0'
  REQUIRE_POWER: '0'
  SCENARIO_SUBDIR: fixed_seq_len/
  HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
  HF_HUB_CACHE: '/mnt/hf_hub_cache/'
  # Drive the single-node path in runners/launch_b300-dsxe.sh. MODEL is the HF id;
  # its basename (e.g. DeepSeek-V4-Pro) must be in the launcher's STAGED_MODELS so
  # the launcher resolves MODEL_PATH to the pre-staged local weights and mounts
  # them. The collector serves from MODEL_PATH (see SERVE_MODEL), so no download.
  MODEL: ${{ inputs.model }}
  MODEL_PATH: /mnt/hf_hub_cache/speedbench-${{ inputs.model-prefix }}-${{ inputs.precision }}
  MODEL_PREFIX: ${{ inputs.model-prefix }}
  PRECISION: ${{ inputs.precision }}
  FRAMEWORK: vllm
  EXP_NAME: ${{ inputs.model-prefix }}_speedbench
  IMAGE: ${{ inputs.image }}
  TP: ${{ inputs.tp }}
  EP_SIZE: '1'
  DP_ATTENTION: 'false'
  SPEC_DECODING: mtp
  # Run the AL-matrix collector instead of the auto-selected throughput script.
  BENCH_SCRIPT_OVERRIDE: ${{ inputs.collector-script || format('benchmarks/single_node/speedbench/{0}_fp4_b300_vllm.sh', inputs.model-prefix) }}
  MODEL_REVISION: ${{ inputs.model-revision }}
  SPEEDBENCH_SPECULATIVE_CONFIG: ${{ inputs.speculative-config }}
  SPEEDBENCH_CONCURRENCY: '64'
  SPEEDBENCH_MAX_MODEL_LEN: '16384'
  SPEEDBENCH_GPU_MEMORY_UTILIZATION: '0.90'
  SPEEDBENCH_SEED: '0'
  SPEEDBENCH_PREPARE_REVISION: 'bcf059af55c20a89f797724598f9908d126153e6'
  SALLOC_TIME_LIMIT: ${{ inputs.salloc-time }}
  # Matrix-collector tunables (propagated into the container via srun --export=ALL).
  MTP_LIST: ${{ inputs.mtp-list }}
  THINKING_MODES: ${{ inputs.thinking-modes }}
  CATEGORY: ${{ inputs.category }}
  SPEEDBENCH_OUTPUT_LEN: ${{ inputs.output-len }}
  CHAT_TEMPLATE_KWARGS_ON: ${{ inputs.thinking-kwargs }}
  OUT_YAML: /workspace/speedbench-reference-al.yaml
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: true, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: score
        env:
          RUNNER: ${{ inputs.runner }}
          MODEL_PREFIX: ${{ inputs.model-prefix }}
          TARGET_PRECISION: ${{ inputs.precision }}
        run: |
          entry=$(jq -cn \
            --arg runner "$RUNNER" \
            --arg model_prefix "$MODEL_PREFIX" \
            --arg precision "$TARGET_PRECISION" \
            '[{
              runner: $runner,
              framework: "vllm",
              "model-prefix": $model_prefix,
              precision: $precision,
              "spec-decoding": "mtp"
            }]')
          scored=$(printf '%s' "$entry" |
            uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
              python -m infx.workflows.ci_priority \
              --queue-namespace "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}")
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"

  collect-al:
    needs: setup
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        format(
          '["self-hosted",{0},{1},{2},{3}]',
          toJSON(inputs.runner),
          '"nodes:1"',
          toJSON(format(
            'ci-job-{0}-{1}',
            needs.setup.outputs.priority,
            needs.setup.outputs.queue-token
          )),
          toJSON(format('ci-attempt-{0}', github.run_attempt))
        ) ||
        format('[{0}]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 10
    name: Read collection progress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Read current allocations and logs
        env:
          OBSERVE_RUNNER_NAMES: 'h200-dgxc-slurm_00 h200-dgxc-slurm_02'
        run: |
          set -eo pipefail
          source benchmarks/benchmark_lib.sh --validation-only
          check_env_vars OBSERVE_RUNNER_NAMES
          for target in $OBSERVE_RUNNER_NAMES; do
            job_id=$(squeue --name="$target" --noheader --format='%i')
            if [[ ! "$job_id" =~ ^[0-9]+$ ]]; then
              echo "No unique active allocation for $target"
              continue
            fi
            echo "Reading $target allocation $job_id"
            timeout 45 srun --overlap --jobid="$job_id" --nodes=1 --ntasks=1 --exact bash -s <<'REMOTE'
          set -eo pipefail
          ps -eo pid,ppid,etime,args | grep -E 'vllm|hf download|prepare.py|qwen3.827b_vllm' | head -40 || true
          for pid in $(pgrep -f '^bash benchmarks/single_node/speedbench/qwen3.827b_vllm.sh$' || true); do
            proc_root="/proc/$pid/root"
            for log in "$proc_root"/tmp/inferencex-speedbench.*/results/*/server.log "$proc_root"/tmp/inferencex-speedbench.*/results/*/benchmark.log; do
              if [[ -f "$log" ]]; then
                echo "LOG $log"
                tail -35 "$log"
              fi
            done
            for model in "$proc_root"/mnt/hf_hub_cache/speedbench-qwen3.827b-*; do
              if [[ -d "$model" ]]; then du -sh "$model"; fi
            done
          done
          REMOTE
          done
