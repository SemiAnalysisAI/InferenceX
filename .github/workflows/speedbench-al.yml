name: B300 runtime diagnostic round 2
run-name: powerx3040-runtime-${{ github.run_id }}

# Push-button (workflow_dispatch) collection of a SPEED-Bench acceptance-length
# (AL) matrix: thinking_on/off x MTP levels, for the given model (defaults to
# DeepSeek-V4-Pro). Produces the golden reference consumed by the
# synthetic-acceptance framework and (optionally) opens a PR updating
# benchmarks/speedbench-reference-al.yaml.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted GPU runner label (B300)"
        required: false
        type: string
        default: 'b300'
      model:
        description: "HF model id (basename must be in launcher STAGED_MODELS for pre-staged local weights)"
        required: false
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Pro'
      model-prefix:
        description: "Model prefix; drives launcher MODEL_PATH resolution, exp name, collector script, and artifact names"
        required: false
        type: string
        default: 'dsv4'
      image:
        description: "vLLM container image"
        required: false
        type: string
        default: 'vllm/vllm-openai:v0.21.0'
      mtp-list:
        description: "Space-separated MTP levels (num_speculative_tokens)"
        required: false
        type: string
        default: '1 2 3 4 5 6 7 8'
      thinking-modes:
        description: "Space-separated thinking modes to collect"
        required: false
        type: string
        default: 'off on'
      category:
        description: "SPEED-Bench category"
        required: false
        type: string
        default: 'coding'
      output-len:
        description: "Per-request output length"
        required: false
        type: string
        default: '4096'
      thinking-kwargs:
        description: "chat_template_kwargs JSON for thinking-on cells (match golden config)"
        required: false
        type: string
        default: '{"thinking": true, "reasoning_effort": "high"}'
      salloc-time:
        description: "Slurm allocation minutes (16 server starts ~ several hours)"
        required: false
        type: string
        default: '480'
      open-pr:
        description: "Open a PR updating benchmarks/speedbench-reference-al.yaml (default off: artifact-only, paste values in manually)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
  HF_HUB_CACHE: '/mnt/hf_hub_cache/'
  # Drive the single-node path in runners/launch_b300-dsxe.sh. MODEL is the HF id;
  # its basename (e.g. DeepSeek-V4-Pro) must be in the launcher's STAGED_MODELS so
  # the launcher resolves MODEL_PATH to the pre-staged local weights and mounts
  # them. The collector serves from MODEL_PATH (see SERVE_MODEL), so no download.
  MODEL: ${{ inputs.model }}
  MODEL_PREFIX: ${{ inputs.model-prefix }}
  PRECISION: fp4
  FRAMEWORK: vllm
  EXP_NAME: ${{ inputs.model-prefix }}_speedbench
  IMAGE: ${{ inputs.image }}
  TP: '8'
  GPU_COUNT: '8'
  EP_SIZE: '1'
  DP_ATTENTION: 'false'
  SPEC_DECODING: mtp
  # Run the AL-matrix collector instead of the auto-selected throughput script.
  BENCH_SCRIPT_OVERRIDE: runners/b300_runtime_diagnostic.sh
  SALLOC_TIME_LIMIT: '15'
  # Matrix-collector tunables (propagated into the container via srun --export=ALL).
  MTP_LIST: ${{ inputs.mtp-list }}
  THINKING_MODES: ${{ inputs.thinking-modes }}
  CATEGORY: ${{ inputs.category }}
  SPEEDBENCH_OUTPUT_LEN: ${{ inputs.output-len }}
  CHAT_TEMPLATE_KWARGS_ON: ${{ inputs.thinking-kwargs }}
  OUT_YAML: /workspace/speedbench-reference-al.yaml
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: true, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: score
        env:
          RUNNER: ${{ inputs.runner }}
          MODEL_PREFIX: ${{ inputs.model-prefix }}
        run: |
          entry=$(jq -cn \
            --arg runner "$RUNNER" \
            --arg model_prefix "$MODEL_PREFIX" \
            '[{
              runner: $runner,
              framework: "vllm",
              "model-prefix": $model_prefix,
              precision: "fp4",
              "spec-decoding": "mtp"
            }]')
          scored=$(printf '%s' "$entry" |
            uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
              python -m infx.workflows.ci_priority \
              --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}")
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"

  collect-al:
    needs: setup
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(inputs.runner),
            toJSON('nodes:1'),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},"nodes:1",{1},{2}]',
            toJSON(inputs.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0},"nodes:1"]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 25
    name: "p${{ needs.setup.outputs.priority }} | SpeedBench AL matrix | ${{ inputs.category }} | mtp=[${{ inputs.mtp-list }}] | thinking=[${{ inputs.thinking-modes }}]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          clean: true
          persist-credentials: false
      - name: Recover resources and inspect cached runtime
        env:
          TASK_JOB_NAME: powerx3040-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/powerx3040"
          exec > >(tee "$RUNNER_TEMP/powerx3040/recovery.log") 2>&1
          date -u --iso-8601=seconds
          git rev-parse HEAD
          id
          # Prior task-owned job was cancelled before allocation. Never cancel
          # by shared runner/user identity or adopt another task's resources.
          sacct -j 2138,2168 --format=JobID,JobName,User,State,NodeList,Start,End,Elapsed,AllocTRES -P || true
          squeue --me --format='%i|%j|%T|%N|%L|%b'
          python3 runners/b300_recover_diagnostic.py
          if squeue --me --noheader --format='%j' | grep -Eq '^powerx3040-'; then
            echo 'Existing task diagnostic found; recover its receipt before allocating.'
            exit 1
          fi
          enroot list || true
          echo 'No saved task-owned named rootfs exists; prior single-node Pyxis entry was unnamed.'
          unsquashfs -s /data/home/sa-gha-runner/squash/vllm_vllm-openai_nightly-dev-x86_64-cu13-3696c77.sqsh
      - name: Run bounded runtime diagnostic
        env:
          TASK_JOB_NAME: powerx3040-${{ github.run_id }}
        run: |
          set -euo pipefail
          # Native Slurm time limit is enforced inside the launcher; this
          # timeout additionally bounds queue wait, without allocating twice.
          timeout --signal=TERM --kill-after=30s 1200 bash runners/launch_b300-dsxe.sh 2>&1 | tee "$RUNNER_TEMP/powerx3040/launcher.log"
      - name: Recover final task state and release only this diagnostic
        if: always()
        env:
          TASK_JOB_NAME: powerx3040-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/powerx3040"
          while read -r job; do
            [[ "$job" =~ ^[0-9]+$ ]] || continue
            scontrol show job "$job"
            scancel "$job"
          done < <(squeue --me --name="$TASK_JOB_NAME" --noheader --format='%i')
          sacct --name="$TASK_JOB_NAME" --starttime=now-1day --format=JobID,JobName,User,State,NodeList,Start,End,Elapsed,AllocTRES -P > "$RUNNER_TEMP/powerx3040/accounting.txt"
      - name: Upload runtime diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: powerx3040-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/powerx3040/
          if-no-files-found: error
