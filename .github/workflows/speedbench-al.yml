name: PR3055 AMD resource diagnostics
run-name: pr3055-amd-resource-diagnostic-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Existing AMD runner pool"
        type: choice
        options: ['cluster:mi355x-amds']
        default: 'cluster:mi355x-amds'
        required: true
      model-prefix:
        description: "Model used only by the existing CI priority scorer"
        type: string
        default: 'dsv4'
        required: true
      ref:
        description: "Exact diagnostic commit to inspect"
        type: string
        required: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: true, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: score
        env:
          RUNNER: ${{ inputs.runner }}
          MODEL_PREFIX: ${{ inputs.model-prefix }}
        run: |
          entry=$(jq -cn \
            --arg runner "$RUNNER" \
            --arg model_prefix "$MODEL_PREFIX" \
            '[{
              runner: $runner,
              framework: "sglang-disagg",
              "model-prefix": $model_prefix,
              precision: "fp4",
              "spec-decoding": "mtp"
            }]')
          scored=$(printf '%s' "$entry" |
            uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
              python -m infx.workflows.ci_priority \
              --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}")
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"

  collect-al:
    needs: setup
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(inputs.runner),
            toJSON('nodes:1'),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},{1},{2}]',
            toJSON(inputs.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0}]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 5
    name: "p${{ needs.setup.outputs.priority }} | PR3055 AMD read-only resource state"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          path: pr3055-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false
          submodules: false
      - name: Read known task accounting and node state
        env:
          DIAGNOSTIC_CHECKOUT: pr3055-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 "$DIAGNOSTIC_CHECKOUT/runners/pr3055_amd_resource_diagnostic.py" \
            --output "$RUNNER_TEMP/pr3055-resource-diagnostic"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr3055-amd-resource-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr3055-resource-diagnostic/
          if-no-files-found: error
          retention-days: 7
