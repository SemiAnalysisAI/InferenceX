name: B300 controller diagnostic round 2
run-name: powerx3040-controller-${{ github.run_id }}

# Push-button (workflow_dispatch) collection of a SPEED-Bench acceptance-length
# (AL) matrix: thinking_on/off x MTP levels, for the given model (defaults to
# DeepSeek-V4-Pro). Produces the golden reference consumed by the
# synthetic-acceptance framework and (optionally) opens a PR updating
# benchmarks/speedbench-reference-al.yaml.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted GPU runner label (B300)"
        required: false
        type: string
        default: 'b300'
      model:
        description: "HF model id (basename must be in launcher STAGED_MODELS for pre-staged local weights)"
        required: false
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Pro'
      model-prefix:
        description: "Model prefix; drives launcher MODEL_PATH resolution, exp name, collector script, and artifact names"
        required: false
        type: string
        default: 'dsv4'
      image:
        description: "vLLM container image"
        required: false
        type: string
        default: 'vllm/vllm-openai:v0.21.0'
      mtp-list:
        description: "Space-separated MTP levels (num_speculative_tokens)"
        required: false
        type: string
        default: '1 2 3 4 5 6 7 8'
      thinking-modes:
        description: "Space-separated thinking modes to collect"
        required: false
        type: string
        default: 'off on'
      category:
        description: "SPEED-Bench category"
        required: false
        type: string
        default: 'coding'
      output-len:
        description: "Per-request output length"
        required: false
        type: string
        default: '4096'
      thinking-kwargs:
        description: "chat_template_kwargs JSON for thinking-on cells (match golden config)"
        required: false
        type: string
        default: '{"thinking": true, "reasoning_effort": "high"}'
      salloc-time:
        description: "Slurm allocation minutes (16 server starts ~ several hours)"
        required: false
        type: string
        default: '480'
      open-pr:
        description: "Open a PR updating benchmarks/speedbench-reference-al.yaml (default off: artifact-only, paste values in manually)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
  HF_HUB_CACHE: '/mnt/hf_hub_cache/'
  # Drive the single-node path in runners/launch_b300-dsxe.sh. MODEL is the HF id;
  # its basename (e.g. DeepSeek-V4-Pro) must be in the launcher's STAGED_MODELS so
  # the launcher resolves MODEL_PATH to the pre-staged local weights and mounts
  # them. The collector serves from MODEL_PATH (see SERVE_MODEL), so no download.
  MODEL: ${{ inputs.model }}
  MODEL_PREFIX: ${{ inputs.model-prefix }}
  PRECISION: fp4
  FRAMEWORK: vllm
  EXP_NAME: ${{ inputs.model-prefix }}_speedbench
  IMAGE: ${{ inputs.image }}
  TP: '8'
  GPU_COUNT: '8'
  EP_SIZE: '1'
  DP_ATTENTION: 'false'
  SPEC_DECODING: mtp
  # Run the AL-matrix collector instead of the auto-selected throughput script.
  BENCH_SCRIPT_OVERRIDE: runners/b300_runtime_diagnostic.sh
  SALLOC_TIME_LIMIT: '15'
  # Matrix-collector tunables (propagated into the container via srun --export=ALL).
  MTP_LIST: ${{ inputs.mtp-list }}
  THINKING_MODES: ${{ inputs.thinking-modes }}
  CATEGORY: ${{ inputs.category }}
  SPEEDBENCH_OUTPUT_LEN: ${{ inputs.output-len }}
  CHAT_TEMPLATE_KWARGS_ON: ${{ inputs.thinking-kwargs }}
  OUT_YAML: /workspace/speedbench-reference-al.yaml
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: true, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: score
        env:
          RUNNER: ${{ inputs.runner }}
          MODEL_PREFIX: ${{ inputs.model-prefix }}
        run: |
          entry=$(jq -cn \
            --arg runner "$RUNNER" \
            --arg model_prefix "$MODEL_PREFIX" \
            '[{
              runner: $runner,
              framework: "vllm",
              "model-prefix": $model_prefix,
              precision: "fp4",
              "spec-decoding": "mtp"
            }]')
          scored=$(printf '%s' "$entry" |
            uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
              python -m infx.workflows.ci_priority \
              --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}")
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"

  collect-al:
    needs: setup
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(inputs.runner),
            toJSON('nodes:1'),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},"nodes:1",{1},{2}]',
            toJSON(inputs.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0},"nodes:1"]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 5
    name: "p${{ needs.setup.outputs.priority }} | B300 read-only Slurm failure diagnosis"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          clean: true
          persist-credentials: false
      - name: Inspect known job and node failures without allocating
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/powerx3040-controller"
          exec > >(tee "$RUNNER_TEMP/powerx3040-controller/controller.log") 2>&1
          date -u --iso-8601=seconds
          git rev-parse HEAD
          id
          sacct -X -j 2138,2168 --starttime=2026-09-12 --parsable2 --format=JobIDRaw,JobName%100,User,Submit,Eligible,Start,End,State,Reason,ExitCode,DerivedExitCode,ElapsedRaw,AllocTRES,ReqTRES,NodeList,Restarts
          sacct -j 2168 --starttime=2026-09-12 --long --parsable2
          scontrol show job 2168 || true
          scontrol show node dsxe-sa-b300-prd0-gpu-00
          sinfo -N -n dsxe-sa-b300-prd0-gpu-00 --format='%N|%T|%E'
          squeue --me --format='%i|%j|%T|%N|%L|%b'
          scontrol show config | grep -E '^[[:space:]]*(Prolog|Epilog|JobRequeue|SlurmctldLogFile|SlurmdLogFile|UnkillableStepTimeout|ReturnToService)[[:space:]=]'
          hostname
          scontrol show config | grep -E '^[[:space:]]*(SlurmctldHost|SlurmctldPort|SrunPortRange|MessageTimeout|CommunicationParameters|PrologSlurmctld|PrologFlags)[[:space:]=]'
          if [[ -r /var/log/slurm/slurmctld.log ]]; then
            grep -E '(^|[^0-9])(2138|2168)([^0-9]|$)' /var/log/slurm/slurmctld.log | tail -80
          else
            echo 'Configured controller log is not readable on this runner.'
          fi
          if command -v journalctl >/dev/null; then
            journalctl --no-pager -u slurmctld --since='2026-09-12 08:58:40' --until='2026-09-12 09:00:00' 2>&1 | grep -E '(2138|2168|[Pp]ermission|[Nn]o journal|[Nn]o entries)' || true
          fi
      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: powerx3040-controller-${{ github.run_id }}
          path: ${{ runner.temp }}/powerx3040-controller/
          if-no-files-found: error
