name: B300 one C40 hang diagnostic
run-name: pr3088-hang-c40-${{ github.run_id }}
'on':
  workflow_dispatch:
    inputs:
      runner:
        description: Existing B300 CI route
        type: string
        default: b300
      model-prefix:
        description: Priority scope
        type: string
        default: kimik3
      ref:
        description: Reviewed diagnostic SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        clean: true
        persist-credentials: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
    - id: score
      env:
        RUNNER: ${{ inputs.runner }}
        MODEL_PREFIX: ${{ inputs.model-prefix }}
      run: |
        entry=$(jq -cn \
          --arg runner "$RUNNER" \
          --arg model_prefix "$MODEL_PREFIX" \
          '[{
            runner: $runner,
            framework: "vllm",
            "model-prefix": $model_prefix,
            precision: "fp4",
            "spec-decoding": "mtp"
          }]')
        scored=$(printf '%s' "$entry" |
          uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
            python -m infx.workflows.ci_priority \
            --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}")
        echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
        echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"
  diagnose-c40:
    needs: setup
    uses: ./.github/workflows/benchmark-tmpl.yml
    with:
      runner: b300
      priority: ${{ needs.setup.outputs.priority }}
      queue-token: ${{ needs.setup.outputs.queue-token }}
      image: vllm/vllm-openai:nightly-dev-x86_64-cu13-3696c77
      model: moonshotai/Kimi-K3
      model-prefix: kimik3
      precision: fp4
      framework: vllm
      exp-name: kimik3_tp8_conc40_kvdram-mooncake_spec-mtp
      recipe-fingerprint: 001768805016287806edac81d49413a62fc9944b32f72d82f0ce6f0b0f38b6db
      isl: '0'
      osl: '0'
      tp: '8'
      pp: '1'
      dcp-size: '8'
      pcp-size: '1'
      ep: '1'
      dp-attn: false
      max-model-len: '0'
      conc: '40'
      spec-decoding: mtp
      disagg: 'false'
      run-eval: false
      eval-only: false
      eval-framework: lm-eval
      eval-suite: ''
      scenario-type: agentic-coding
      kv-offloading: dram
      kv-offload-backend: mooncake
      kv-offload-backend-metadata: '{"name":"mooncake","version":"0.3.11.post1"}'
      total-cpu-dram-gb: '2249'
      duration: '3600'
      require-power: false
      agentx-fast: false
      ref: ${{ inputs.ref }}
      hang-stack-mode: faulthandler
    secrets: inherit
