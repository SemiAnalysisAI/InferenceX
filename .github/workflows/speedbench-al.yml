name: B300 PR3088 RDMA provider probe
run-name: pr3088-rdma-runtime-recovery-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted GPU runner label (B300)"
        required: false
        type: string
        default: 'b300'
      model:
        description: "HF model id (basename must be in launcher STAGED_MODELS for pre-staged local weights)"
        required: false
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Pro'
      model-prefix:
        description: "Model prefix; drives launcher MODEL_PATH resolution, exp name, collector script, and artifact names"
        required: false
        type: string
        default: 'dsv4'
      image:
        description: "vLLM container image"
        required: false
        type: string
        default: 'vllm/vllm-openai:v0.21.0'
      mtp-list:
        description: "Space-separated MTP levels (num_speculative_tokens)"
        required: false
        type: string
        default: '1 2 3 4 5 6 7 8'
      thinking-modes:
        description: "Space-separated thinking modes to collect"
        required: false
        type: string
        default: 'off on'
      category:
        description: "SPEED-Bench category"
        required: false
        type: string
        default: 'coding'
      output-len:
        description: "Per-request output length"
        required: false
        type: string
        default: '4096'
      thinking-kwargs:
        description: "chat_template_kwargs JSON for thinking-on cells (match golden config)"
        required: false
        type: string
        default: '{"thinking": true, "reasoning_effort": "high"}'
      salloc-time:
        description: "Slurm allocation minutes (16 server starts ~ several hours)"
        required: false
        type: string
        default: '480'
      open-pr:
        description: "Open a PR updating benchmarks/speedbench-reference-al.yaml (default off: artifact-only, paste values in manually)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref (branch/sha) to checkout"
        required: false
        type: string
      slurm-state-only:
        description: "Only report sinfo/squeue/sacct from the login node; submit no probe job"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The image the Kimi-K3 B300 recipe runs in (PR #3040 baseline), already imported.
  SQUASH_FILE: /data/home/sa-gha-runner/squash/vllm_vllm-openai_nightly-dev-x86_64-cu13-3696c77.sqsh
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/inferencex-pycache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.score.outputs.priority }}
      queue-token: ${{ steps.score.outputs.queue-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: true, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: score
        env:
          RUNNER: ${{ inputs.runner }}
          MODEL_PREFIX: ${{ inputs.model-prefix }}
        run: |
          entry=$(jq -cn \
            --arg runner "$RUNNER" \
            --arg model_prefix "$MODEL_PREFIX" \
            '[{
              runner: $runner,
              framework: "vllm",
              "model-prefix": $model_prefix,
              precision: "fp4",
              "spec-decoding": "mtp"
            }]')
          scored=$(printf '%s' "$entry" |
            uv run --no-project --exclude-newer PT12H --python 3.12 --with pyyaml \
              python -m infx.workflows.ci_priority \
              --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}")
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          echo "queue-token=$(jq -r '.[0]["queue-token"]' <<<"$scored")" >> "$GITHUB_OUTPUT"

  collect-al:
    needs: setup
    runs-on: >-
      ${{ fromJSON(
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        (
          vars.NODE_SLOT_SCHEDULER_ENABLED == 'true' &&
          format(
            '["self-hosted",{0},{1},{2},{3}]',
            toJSON(inputs.runner),
            toJSON('nodes:1'),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          ) ||
          format(
            '["self-hosted",{0},"nodes:1",{1},{2}]',
            toJSON(inputs.runner),
            toJSON(format(
              'ci-job-{0}-{1}',
              needs.setup.outputs.priority,
              needs.setup.outputs.queue-token
            )),
            toJSON(format('ci-attempt-{0}', github.run_attempt))
          )
        ) ||
        format('[{0},"nodes:1"]', toJSON(inputs.runner))
      ) }}
    timeout-minutes: 25
    name: "p${{ needs.setup.outputs.priority }} | B300 RDMA provider probe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          clean: true
          persist-credentials: false
      - name: Probe the RDMA provider ABI in the cached runtime
        env:
          TASK_JOB_NAME: pr3088-rdma-${{ github.run_id }}
          SLURM_STATE_ONLY: ${{ inputs.slurm-state-only }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr3088-rdma"
          mkdir -p "$out" "$GITHUB_WORKSPACE/diag"
          exec > >(tee "$out/probe.log") 2>&1
          date -u --iso-8601=seconds
          git rev-parse HEAD
          test -r "$SQUASH_FILE"
          sinfo -p batch_1 -N -o '%N|%T|%G|%E'
          squeue -p batch_1 -o '%i|%u|%j|%T|%M|%l|%N|%r'
          if [[ "$SLURM_STATE_ONLY" == 'true' ]]; then
            sacct -X -P --starttime=now-4hours \
              --format=JobID,JobName,User,State,ExitCode,Start,End,Elapsed,NodeList,Reason
            while read -r job; do
              scontrol show job "$job" || true
            done < <(squeue -p batch_1 -t PD --noheader --format='%i')
            exit 0
          fi
          # sbatch delivers the allocation without slurmctld calling back into
          # the login node; a queued salloc from here was killed (job 2549).
          jid=$(sbatch --parsable --job-name="$TASK_JOB_NAME" \
                --output="$GITHUB_WORKSPACE/diag/slurm-%j.out" \
                runners/b300_rdma_probe.sbatch)
          echo "$jid" > "$out/jobid"
          echo "sbatch job $jid"
          while squeue -j "$jid" --noheader 2>/dev/null | grep -q .; do
            squeue -j "$jid" --noheader -o '%T %N %r'
            sleep 15
          done
          sacct -j "$jid" -P --format=JobID,State,ExitCode,Elapsed,NodeList,Reason
          cat "$GITHUB_WORKSPACE/diag/slurm-$jid.out"
          cp "$GITHUB_WORKSPACE/diag/slurm-$jid.out" "$out/slurm-$jid.out"
          probe_status=$(sacct -X -n -P -j "$jid" --format=State,ExitCode)
          [[ "$probe_status" == 'COMPLETED|0:0' ]]
      - name: Release only this probe
        if: always()
        env:
          TASK_JOB_NAME: pr3088-rdma-${{ github.run_id }}
        run: |
          set -euo pipefail
          while read -r job; do
            [[ "$job" =~ ^[0-9]+$ ]] || continue
            scontrol show job "$job" || true
            scancel "$job"
          done < <(squeue --me --name="$TASK_JOB_NAME" --noheader --format='%i')
          sacct --name="$TASK_JOB_NAME" --starttime=now-1day -P \
            --format=JobID,JobName,State,ExitCode,NodeList,Start,End,Elapsed > "$RUNNER_TEMP/pr3088-rdma/accounting.txt" || true
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr3088-rdma-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/pr3088-rdma/
          if-no-files-found: error
