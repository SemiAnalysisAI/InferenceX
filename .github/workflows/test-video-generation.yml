name: Test video-generation runner

on:
  pull_request:
    paths: &video-generation-paths
      - 'experimental/video-generation/**'
      - '.github/workflows/test-video-generation.yml'
  push:
    paths: *video-generation-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: runner, specs and recorded fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experimental/video-generation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Test
        # The pinned runtime dependencies of pyproject.toml plus pytest; the package itself is not installed.
        run: >-
          uv run --no-project --python 3.12
          --with av==16.1.0 --with numpy==2.3.5 --with pyyaml==6.0.3 --with pytest==8.4.2
          python -m pytest -q
      - name: Lint and format
        # pyproject.toml scopes ruff: #3733's ported modules keep their state, #4243's files are excluded.
        run: |
          uvx ruff@0.17.1 check .
          uvx ruff@0.17.1 format --check .
