name: slurm-probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsmp-dimm-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    name: HSMP DIMM power probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: "cluster:mi300x-amd", partition: MI300X-UBUNTU}
          - {runner: "cluster:mi355x-amds", partition: compute}
    runs-on: ["self-hosted", "${{ matrix.runner }}"] # zizmor: ignore[self-hosted-runner] Temporary telemetry probe, manual dispatch only.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Per-DIMM HSMP power at idle and under memory load
        shell: bash
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          set -u
          export PROBE="$(cat .github/probe/hsmp_dimm.sh)"
          timeout 35m srun --partition="$PARTITION" --nodes=1 --exclusive --gres=gpu:8 --time=30 --job-name=hsmp-dimm-probe bash -c "$PROBE" | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g'
