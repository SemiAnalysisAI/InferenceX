name: slurm-probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glm53flash-h100-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Read-only H100 checkpoint inventory
    runs-on: ["self-hosted", "cluster:h100-dsxe"] # zizmor: ignore[self-hosted-runner] Temporary authorized read-only inventory, manual dispatch only.
    timeout-minutes: 5
    steps:
      - name: Inspect known model and cache roots
        shell: bash
        run: |
          timeout 90s python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          roots = [
              Path("/data/models"),
              Path("/models"),
              Path("/data/home/sa-gha-runner/gharunners/hf-hub-cache"),
          ]
          matches = 0
          visited = 0
          for root in roots:
              print(json.dumps({"root": str(root), "exists": root.exists(),
                                "directory": root.is_dir(), "readable": os.access(root, os.R_OK)}))
              if not root.is_dir():
                  continue
              queue = collections.deque([(root, 0)])
              while queue and visited < 2000 and matches < 80:
                  path, depth = queue.popleft()
                  visited += 1
                  normalized = "".join(c for c in str(path).lower() if c.isalnum())
                  matched = "glm53flash" in normalized
                  if matched:
                      matches += 1
                      print(json.dumps({"matching_directory": str(path)}))
                      config = path / "config.json"
                      if config.is_file() and config.stat().st_size < 1_000_000:
                          try:
                              data = json.loads(config.read_text())
                              quant = data.get("quantization_config", {})
                              print(json.dumps({
                                  "config": str(config),
                                  "architectures": data.get("architectures"),
                                  "model_type": data.get("model_type"),
                                  "max_position_embeddings": data.get("max_position_embeddings"),
                                  "num_hidden_layers": data.get("num_hidden_layers"),
                                  "quant_method": quant.get("quant_method"),
                                  "index_exists": (path / "model.safetensors.index.json").is_file(),
                              }))
                          except (OSError, ValueError) as exc:
                              print(json.dumps({"config": str(config), "error_type": type(exc).__name__}))
                  if depth >= 5:
                      continue
                  try:
                      with os.scandir(path) as entries:
                          for index, entry in enumerate(entries):
                              if index >= 500:
                                  print(json.dumps({"truncated_directory": str(path)}))
                                  break
                              if entry.is_dir(follow_symlinks=False):
                                  queue.append((Path(entry.path), depth + 1))
                              elif entry.is_symlink() and "glm53flash" in "".join(
                                  c for c in entry.name.lower() if c.isalnum()
                              ):
                                  print(json.dumps({"matching_symlink": entry.path,
                                                    "target_exists": Path(entry.path).exists(),
                                                    "target": os.readlink(entry.path)}))
                  except OSError as exc:
                      print(json.dumps({"path": str(path), "error_type": type(exc).__name__}))
          print(json.dumps({"visited_directories": visited, "matching_directories": matches,
                            "limit_reached": visited >= 2000 or matches >= 80}))
          PY
