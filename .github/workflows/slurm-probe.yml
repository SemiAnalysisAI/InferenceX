name: slurm-probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runner label to probe"
        default: "cluster:mi355x-amds"

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner || 'cluster:mi355x-amds' }}
    timeout-minutes: 8
    steps:
      - name: Inspect possible ownerless MI355X allocations
        shell: bash
        run: |
          set +e

          echo "runner=$RUNNER_NAME host=$(hostname -f 2>/dev/null || hostname) utc=$(date -u +%FT%TZ)"
          squeue -w mia1-p01-g11,mia1-p01-g15,mia1-p01-g16,mia1-p01-g18,mia1-p01-g19 \
            -o "%.10i %.28j %.16u %.2t %.12M %.12l %.4D %.30R"

          for host in mia1-p01-g11 mia1-p01-g15 mia1-p01-g16 mia1-p01-g18 mia1-p01-g19; do
            echo
            echo "========== ${host} =========="
            scontrol show node "$host" | grep -E \
              "NodeName=|State=|CfgTRES=|AllocTRES=|RealMemory=|FreeMem=|Reason="

            timeout 60 ssh -o BatchMode=yes -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no "$host" 'bash -s' <<'REMOTE'
          set +e
          hostname -f 2>/dev/null || hostname
          date -u +%FT%TZ
          id

          echo "--- unprivileged ROCm view ---"
          timeout 20 rocm-smi --showmeminfo vram --showuse --showpids 2>&1

          echo "--- noninteractive sudo availability ---"
          sudo -n true
          echo "sudo_rc=$?"

          echo "--- privileged ROCm view ---"
          timeout 20 sudo -n rocm-smi --showmeminfo vram --showuse --showpids 2>&1

          echo "--- privileged /dev/kfd holders ---"
          timeout 20 sudo -n fuser -v /dev/kfd 2>&1

          echo "--- privileged /dev/dri render holders ---"
          timeout 20 sudo -n fuser -v /dev/dri/renderD* 2>&1

          echo "--- KFD process registry ---"
          timeout 20 sudo -n find /sys/class/kfd/kfd/proc -maxdepth 2 \
            -type f -printf '%p\n' 2>&1 | head -n 240

          echo "--- high-memory and accelerator processes ---"
          sudo -n ps -eo user:24,pid,ppid,stat,rss,vsz,lstart,etime,comm --sort=-rss | \
            awk 'NR == 1 || NR <= 45 || $4 ~ /^Z/ || $NF ~ /python|vllm|ray|sglang|aiperf|lmcache/'

          echo "--- Slurm-tracked PIDs ---"
          scontrol listpids 2>&1 | head -n 240

          echo "--- cgroup of aiperf zombie parent when present ---"
          for pid in $(pgrep -f 'aiperf' | head -n 8); do
            ps -p "$pid" -o user:24,pid,ppid,stat,lstart,etime,comm
            sed -n '1,20p' "/proc/$pid/cgroup" 2>/dev/null
          done

          echo "--- kernel GPU/OOM events since first failed run ---"
          sudo -n journalctl -k --since '2026-09-07 01:00:00 UTC' --no-pager 2>&1 | \
            grep -Ei 'oom|out of memory|amdgpu|xgmi|ras|gpu reset|process.*killed' | tail -n 160
          REMOTE
            echo "ssh_rc=$?"
          done
