name: slurm-probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runner label to probe"
        default: "cluster:mi355x-amds"

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner || 'cluster:mi355x-amds' }}
    timeout-minutes: 8
    steps:
      - name: Inspect MI355X GPU holders and Slurm ownership
        shell: bash
        run: |
          set +e

          echo "runner=$RUNNER_NAME host=$(hostname -f 2>/dev/null || hostname) utc=$(date -u +%FT%TZ)"
          echo "=== cluster allocations for target nodes ==="
          squeue -w mia1-p01-g11,mia1-p01-g15,mia1-p01-g18,mia1-p01-g19 \
            -o "%.10i %.28j %.16u %.2t %.12M %.12l %.4D %.30R"

          for host in mia1-p01-g11 mia1-p01-g15 mia1-p01-g18 mia1-p01-g19; do
            echo
            echo "========== ${host} =========="
            echo "--- Slurm node state ---"
            scontrol show node "$host" | grep -E \
              "NodeName=|State=|CfgTRES=|AllocTRES=|RealMemory=|FreeMem=|Reason="

            timeout 45 ssh -o BatchMode=yes -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no "$host" 'bash -s' <<'REMOTE'
          set +e
          hostname -f 2>/dev/null || hostname
          date -u +%FT%TZ
          uptime

          echo "--- host memory ---"
          free -h

          echo "--- GPU memory and utilization ---"
          if command -v rocm-smi >/dev/null 2>&1; then
            timeout 20 rocm-smi --showmeminfo vram --showuse --showpids
          elif [ -x /opt/rocm/bin/rocm-smi ]; then
            timeout 20 /opt/rocm/bin/rocm-smi --showmeminfo vram --showuse --showpids
          else
            echo "rocm-smi unavailable"
          fi

          echo "--- /dev/kfd holders with Slurm cgroups ---"
          kfd_pids=$(sudo -n fuser /dev/kfd 2>/dev/null || fuser /dev/kfd 2>/dev/null)
          if [ -z "$kfd_pids" ]; then
            echo "no visible /dev/kfd holders"
          else
            for pid in $kfd_pids; do
              ps -p "$pid" -o user:24,pid,ppid,stat,lstart,etime,comm
              sed -n '1,20p' "/proc/$pid/cgroup" 2>/dev/null
            done
          fi

          echo "--- Slurm-tracked PIDs ---"
          scontrol listpids 2>&1 | head -n 200

          echo "--- relevant and zombie processes ---"
          ps -eo user:24,pid,ppid,stat,lstart,etime,comm | awk \
            'NR == 1 || $4 ~ /^Z/ || $NF ~ /python|vllm|ray|sglang|docker|containerd|enroot|slurmstepd|lmcache/'

          echo "--- running containers ---"
          if command -v docker >/dev/null 2>&1; then
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Image}}' 2>&1
            docker stats --no-stream --format \
              'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' 2>&1
          else
            echo "docker unavailable"
          fi

          echo "--- kernel GPU/OOM events since first failed run ---"
          journalctl -k --since '2026-09-07 01:00:00 UTC' --no-pager 2>&1 | \
            grep -Ei 'oom|out of memory|amdgpu|xgmi|ras|gpu reset|process.*killed' | tail -n 120
          REMOTE
            echo "ssh_rc=$?"
          done
