name: Test CollectiveX

# The sweep exercises the benchmark on real hardware, but nothing ran CollectiveX's own
# unit tests, so the oracle contracts they pin were unverified on every PR. Torch is
# installed CPU-only: the torch-dependent tests are combine-oracle arithmetic checks that
# never touch a device, and without it they skip silently rather than fail.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'experimental/CollectiveX/**'
      - '.github/workflows/test-collectivex.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Prepare CPU test environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/collectivex-venv"
          # Route only PyTorch packages to the CPU index. Its mirrors of other
          # packages lack upload timestamps, so resolve those from PyPI.
          uv pip install --python "$RUNNER_TEMP/collectivex-venv/bin/python" \
            --exclude-newer PT12H --torch-backend cpu torch packaging
          echo "$RUNNER_TEMP/collectivex-venv/bin" >> "$GITHUB_PATH"

      # Every skip in this suite is torch-gated, so a missing torch turns the oracle
      # checks into silent passes. Fail here instead, where the cause is obvious.
      # packaging is not skip-gated at all — without it the FlashInfer combine-model
      # tests ERROR, so name it here too rather than debugging it from a traceback.
      - name: Verify torch and packaging are importable
        run: python -c "import torch, packaging; assert torch.version.cuda is None and torch.version.hip is None; print(torch.__version__)"

      - name: Run unit tests
        run: |
          cd experimental/CollectiveX
          python -m unittest discover -s tests -p "test_*.py" -v
