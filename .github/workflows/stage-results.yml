name: Stage PR Results

run-name: Stage results for PR #${{ github.event.issue.number }}

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] runs trusted default-branch code; stage_results.py requires write access before using FRONTEND_PAT
    types: [created]

permissions: {}

concurrency:
  group: stage-results-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Authorize and dispatch staging
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/stage-results') ||
       startsWith(github.event.comment.body, '/use'))
    runs-on: ubuntu-latest
    permissions:
      actions: read # Validate the source workflow run and its artifacts
      contents: read # Resolve pull-request commits
      issues: read # Read labels and label-history timeline events
      pull-requests: write # Post staging status as github-actions rather than a PAT user
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python project
        uses: $/.github/actions/setup-python-project

      - name: Authorize request and resolve source run
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project "$INFERENCEX_PYTHON_PROJECT" --locked python -m infx.workflows.stage_results

      - name: Acknowledge staging request
        if: steps.request.outputs.run-id != ''
        id: acknowledge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ steps.request.outputs.run-id }}
          RUN_URL: ${{ steps.request.outputs.run-url }}
          REQUESTED_BY: ${{ steps.request.outputs.requested-by }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = `@${process.env.REQUESTED_BY} staging [run ${process.env.RUN_ID}](${process.env.RUN_URL}). Existing staged runs will be preserved; a completion link will be posted here.`;
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setOutput('comment-id', String(comment.data.id));

      - name: Dispatch the app repository's staging workflow
        if: steps.request.outputs.run-id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ steps.request.outputs.run-id }}
          RUN_ATTEMPT: ${{ steps.request.outputs.run-attempt }}
          RUN_DATE: ${{ steps.request.outputs.run-date }}
          REQUESTED_BY: ${{ steps.request.outputs.requested-by }}
          COMMENT_ID: ${{ steps.acknowledge.outputs.comment-id }}
          APP_REPO: ${{ vars.APP_REPO || 'SemiAnalysisAI/InferenceX-app' }}
        with:
          github-token: ${{ secrets.FRONTEND_PAT }} # zizmor: ignore[secrets-outside-env]
          script: |
            const [owner, repo] = process.env.APP_REPO.split('/');
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'stage-results',
              client_payload: {
                'source-repository': `${context.repo.owner}/${context.repo.repo}`,
                'pr-number': String(context.issue.number),
                'run-id': process.env.RUN_ID,
                'run-attempt': process.env.RUN_ATTEMPT,
                'run-date': process.env.RUN_DATE,
                'requested-by': process.env.REQUESTED_BY,
                'comment-id': process.env.COMMENT_ID,
              },
            });
