name: Test H3 Video Harness

on:
  pull_request:
    paths: &h3-video-paths
      - 'experimental/video-generation/**'
      - 'inferencex-e2e/benchmarks/h3/**'
      - 'inferencex-e2e/infx/results/power/**'
      - '.github/workflows/test-h3-spec.yml'
  push:
    paths: *h3-video-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: H3 harness, spec loader and hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Test the harness, spec loader and hashes
        working-directory: experimental/video-generation
        env:
          PYTHONPATH: ${{ github.workspace }}/inferencex-e2e
        run: >-
          uv run --no-project --python 3.12
          --with 'av==16.1.0' --with 'numpy==2.3.5'
          --with 'pyyaml>=6,<7' --with 'pytest>=8,<9'
          python -m pytest -q
      - name: Lint and format
        # The infx config never lints tests/, so assert (S101) is allowed there.
        # These standalone modules have no package, so INP001 does not apply.
        run: |
          uvx ruff@0.14.0 check --config inferencex-e2e/infx/ruff.toml --ignore INP001 \
            experimental/video-generation/specs/h3_spec.py
          uvx ruff@0.14.0 check --config inferencex-e2e/infx/ruff.toml --ignore INP001,S101 \
            experimental/video-generation/tests/test_h3_spec.py
          uvx ruff@0.14.0 format --check --config inferencex-e2e/infx/ruff.toml \
            experimental/video-generation/specs/h3_spec.py experimental/video-generation/tests/test_h3_spec.py
