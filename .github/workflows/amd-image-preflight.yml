name: AMD exporter image preflight

on:
  push:
    branches: [fix/amd-dme-e2e-launch]
    paths: [.github/workflows/amd-image-preflight.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Download the pinned upstream build artifact.

concurrency:
  group: amd-image-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    name: Prepare official exporter squash without GPU allocation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_NAME: device-metrics-exporter-v1.5.4-10.2.0a20261001.tar.gz
      ARCHIVE_SHA256: 0ba397bc31abc1c538e24f8d7264fb421cc5fb8dd59b2e1c493a8efec404c2ba
      IMAGE_REF: rocm/device-metrics-exporter:10.2.0a20261001
      IMAGE_CONFIG_ID: sha256:aa151c70573fd5d3f94538c73adac6b235f052bb7dc9a8681ad2bfd0a8417929
      ENROOT_PACKAGE: enroot_4.2.0-1_amd64.deb
      ENROOT_PACKAGE_SHA256: 50bfcf8336bfe1a5d19481081d7800ae80300a27795595757f7d20957e079a62
    steps:
      - name: Checkout validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download official AMD exporter image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: ROCm/device-metrics-exporter
          run-id: 36867107435
          name: build-dme-10.2.0a20261001
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/amd-exporter-image

      - name: Verify and convert image without starting the container
        env:
          IMAGE_DIR: ${{ runner.temp }}/amd-exporter-image
          OUTPUT_DIR: ${{ runner.temp }}/amd-exporter-squash
        run: |
          set -eo pipefail
          source inferencex-e2e/benchmarks/benchmark_lib.sh --validation-only
          check_env_vars IMAGE_DIR OUTPUT_DIR ARCHIVE_NAME ARCHIVE_SHA256 IMAGE_REF IMAGE_CONFIG_ID \
            ENROOT_PACKAGE ENROOT_PACKAGE_SHA256 GITHUB_REPOSITORY GITHUB_RUN_ID GITHUB_RUN_ATTEMPT GITHUB_SHA

          printf '%s  %s\n' "$ARCHIVE_SHA256" "$IMAGE_DIR/$ARCHIVE_NAME" | sha256sum --check -
          curl --fail --location --output "$IMAGE_DIR/$ENROOT_PACKAGE" \
            "https://github.com/NVIDIA/enroot/releases/download/v4.2.0/$ENROOT_PACKAGE"
          printf '%s  %s\n' "$ENROOT_PACKAGE_SHA256" "$IMAGE_DIR/$ENROOT_PACKAGE" | sha256sum --check -
          sudo apt-get update
          sudo apt-get install --yes "$IMAGE_DIR/$ENROOT_PACKAGE"

          docker image load --input "$IMAGE_DIR/$ARCHIVE_NAME"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')" = "$IMAGE_CONFIG_ID"
          mkdir -p "$OUTPUT_DIR"
          enroot import --output "$OUTPUT_DIR/amd-exporter.sqsh" "dockerd://$IMAGE_REF"
          unsquashfs -s "$OUTPUT_DIR/amd-exporter.sqsh"
          cd "$OUTPUT_DIR"
          sha256sum amd-exporter.sqsh > SHA256SUMS
          jq --null-input \
            --arg squash_sha256 "$(sha256sum amd-exporter.sqsh | cut -d ' ' -f 1)" \
            --arg enroot_version "$(enroot version)" \
            '{
              source_repository: "ROCm/device-metrics-exporter",
              source_sha: "9d0eb8c88af99f1dbe2914d803382092671456d9",
              source_run_id: 36867107435,
              source_artifact_id: 11169689175,
              source_artifact_name: "build-dme-10.2.0a20261001",
              archive: {name: env.ARCHIVE_NAME, sha256: env.ARCHIVE_SHA256},
              image: {
                loaded_tag: env.IMAGE_REF,
                config_digest: env.IMAGE_CONFIG_ID,
                archive_manifest_digest: "sha256:e97001490f7dcd93ae2f60ddbe40cd1413eed6af0bf5ff301190f419a40e3b7d",
                upstream_reported_registry_digest: "sha256:698a3da79b5e11223b4909804ddb47f93c71775cd9eca6db86b41a0a10a7894a"
              },
              squash: {name: "amd-exporter.sqsh", sha256: $squash_sha256},
              enroot: {version: $enroot_version, package_sha256: env.ENROOT_PACKAGE_SHA256},
              preparation: {
                repository: env.GITHUB_REPOSITORY,
                run_id: env.GITHUB_RUN_ID,
                run_attempt: env.GITHUB_RUN_ATTEMPT,
                workflow_sha: env.GITHUB_SHA
              }
            }' > provenance.json

      - name: Upload verified squash and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amd-dme-nightly-squash
          path: |
            ${{ runner.temp }}/amd-exporter-squash/amd-exporter.sqsh
            ${{ runner.temp }}/amd-exporter-squash/SHA256SUMS
            ${{ runner.temp }}/amd-exporter-squash/provenance.json
          if-no-files-found: error
          compression-level: 0
