name: H3 Video Smoke
run-name: H3 video smoke - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Prepared H3 hardware site"
        required: false
        type: choice
        options: [h200-dgxc, h100-dgxc, b200-nscale, mi355x-amds]
        default: h200-dgxc
      preflight-only:
        description: "Inspect the trusted runner identity and public SSH host keys without allocating GPUs"
        required: false
        type: boolean
        default: false
      stage-amd-model:
        description: "Stage frozen model files on AMD without allocating GPUs"
        required: false
        type: boolean
        default: false
      stage-amd-site:
        description: "Seal inspected AMD runtime and benchmark inputs without GPUs"
        required: false
        type: boolean
        default: false
      inspect-amd-node:
        description: "Inspect AMD node telemetry and cached images; at most 8 GPUs for 15 minutes"
        required: false
        type: boolean
        default: false
      prepare-amd-runtime:
        description: "Inspect a task-owned cached AMD runtime; at most 8 GPUs for 60 minutes"
        required: false
        type: boolean
        default: false
      site-config:
        description: "Pinned runner-local site JSON; empty uses the existing H200 configuration"
        required: false
        type: string
        default: ""
      inventory-run-id:
        description: "Reuse a successful hardware inventory for CPU-only export"
        required: false
        type: string
        default: ""
      source-run-ids:
        description: "One or two accepted H3 run IDs to reprocess; empty runs new generation"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      cluster:
        required: false
        type: string
        default: h200-dgxc
      preflight-only:
        required: false
        type: boolean
        default: false
      stage-amd-model:
        description: "Stage frozen model files on AMD without allocating GPUs"
        required: false
        type: boolean
        default: false
      stage-amd-site:
        description: "Seal inspected AMD runtime and benchmark inputs without GPUs"
        required: false
        type: boolean
        default: false
      inspect-amd-node:
        description: "Inspect AMD node telemetry and cached images; at most 8 GPUs for 15 minutes"
        required: false
        type: boolean
        default: false
      prepare-amd-runtime:
        description: "Inspect a task-owned cached AMD runtime; at most 8 GPUs for 60 minutes"
        required: false
        type: boolean
        default: false
      site-config:
        required: false
        type: string
        default: ""
      inventory-run-id:
        required: false
        type: string
        default: ""
      source-run-ids:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: h3-video-${{ github.repository }}${{ inputs.cluster != 'h200-dgxc' && format('-{0}', inputs.cluster) || '' }}${{ (inputs.inspect-amd-node || inputs.prepare-amd-runtime) && '-node-inventory' || inputs.preflight-only && '-preflight' || '' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      H3_SOURCE_SHA: ${{ github.sha }}
    outputs:
      priority: ${{ steps.queue.outputs.priority }}
      queue-token: ${{ steps.queue.outputs.queue-token }}
      gpu-model: ${{ steps.queue.outputs.gpu-model }}
    steps:
      - name: Authorize manual repository execution
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' ||
                context.repo.owner !== 'SemiAnalysisAI' || context.repo.repo !== 'InferenceX' ||
                !context.ref.startsWith('refs/heads/')) {
              throw new Error('H3 smoke requires manual dispatch of an InferenceX repository branch.');
            }
            for (const username of new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR])) {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error(username + ' must have write, maintain, or admin permission.');
              }
            }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Prepare native queue identity
        id: queue
        env:
          H3_SITE_CONFIG: ${{ inputs.site-config || vars.H3_SITE_CONFIG }}
          H3_CLUSTER: ${{ inputs.cluster }}
          H3_PREFLIGHT_ONLY: ${{ inputs.preflight-only }}
          H3_STAGE_AMD_MODEL: ${{ inputs.stage-amd-model }}
          H3_STAGE_AMD_SITE: ${{ inputs.stage-amd-site }}
          H3_INSPECT_AMD_NODE: ${{ inputs.inspect-amd-node }}
          H3_PREPARE_AMD_RUNTIME: ${{ inputs.prepare-amd-runtime }}
          PRIORITY_ENABLED: ${{ vars.PRIORITY_SCHEDULER_ENABLED }}
          NODE_SLOTS_ENABLED: ${{ vars.NODE_SLOT_SCHEDULER_ENABLED }}
          H3_SOURCE_RUN_IDS: ${{ inputs.source-run-ids }}
          H3_INVENTORY_RUN_ID: ${{ inputs.inventory-run-id }}
        run: |
          set -euo pipefail
          preparations=0
          for selected in "$H3_PREFLIGHT_ONLY" "$H3_STAGE_AMD_MODEL" "$H3_STAGE_AMD_SITE" "$H3_INSPECT_AMD_NODE" "$H3_PREPARE_AMD_RUNTIME"; do
            if [[ "$selected" == true ]]; then preparations=$((preparations + 1)); fi
          done
          [[ "$preparations" -le 1 ]] || { echo 'Select one H3 preparation operation.' >&2; exit 1; }
          case "$H3_CLUSTER" in
            h200-dgxc) echo 'gpu-model=H200' >> "$GITHUB_OUTPUT" ;;
            h100-dgxc) echo 'gpu-model=H100' >> "$GITHUB_OUTPUT" ;;
            b200-nscale) echo 'gpu-model=B200' >> "$GITHUB_OUTPUT" ;;
            mi355x-amds)
              [[ "$H3_PREFLIGHT_ONLY" == true || ( "$H3_STAGE_AMD_MODEL" == true || "$H3_STAGE_AMD_SITE" == true ) || "$H3_INSPECT_AMD_NODE" == true || "$H3_PREPARE_AMD_RUNTIME" == true ]] || { echo 'AMD H3 execution is not implemented.' >&2; exit 1; }
              echo 'gpu-model=MI355X' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unsupported H3 hardware site.' >&2; exit 1 ;;
          esac
          if [[ ( "$H3_INSPECT_AMD_NODE" == true || "$H3_PREPARE_AMD_RUNTIME" == true ) && ( "$H3_CLUSTER" != mi355x-amds || "$H3_PREFLIGHT_ONLY" == true || ( "$H3_STAGE_AMD_MODEL" == true || "$H3_STAGE_AMD_SITE" == true ) || -n "$H3_SOURCE_RUN_IDS" || -n "$H3_INVENTORY_RUN_ID" ) ]]; then
            echo 'AMD node inspection must be a separate operation on mi355x-amds.' >&2
            exit 1
          fi
          if [[ ( "$H3_STAGE_AMD_MODEL" == true || "$H3_STAGE_AMD_SITE" == true ) && ( "$H3_CLUSTER" != mi355x-amds || "$H3_PREFLIGHT_ONLY" == true || -n "$H3_INVENTORY_RUN_ID" || ! "$H3_SOURCE_RUN_IDS" =~ ^[1-9][0-9]{0,19}$ ) ]]; then
            echo 'AMD model staging requires exactly one accepted source run and no other operation.' >&2
            exit 1
          fi
          if [[ "$H3_PREFLIGHT_ONLY" == true && ( -n "$H3_SOURCE_RUN_IDS" || -n "$H3_INVENTORY_RUN_ID" ) ]]; then
            echo 'Site preflight cannot also reprocess benchmark evidence.' >&2
            exit 1
          fi
          if [[ "$H3_CLUSTER" != h200-dgxc && "$H3_STAGE_AMD_MODEL" != true && "$H3_STAGE_AMD_SITE" != true && ( -n "$H3_SOURCE_RUN_IDS" || -n "$H3_INVENTORY_RUN_ID" ) ]]; then
            echo 'Historical inventory reuse remains specific to the H200 inventory contract.' >&2
            exit 1
          fi
          if [[ -n "$H3_INVENTORY_RUN_ID" && ( -z "$H3_SOURCE_RUN_IDS" || ! "$H3_INVENTORY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ) ]]; then
            echo 'Hardware reuse needs one inventory run ID and explicit source executions.' >&2
            exit 1
          fi
          [[ "$H3_PREFLIGHT_ONLY" == true || ( "$H3_STAGE_AMD_MODEL" == true || "$H3_STAGE_AMD_SITE" == true ) || "$H3_INSPECT_AMD_NODE" == true || "$H3_PREPARE_AMD_RUNTIME" == true || "$H3_SITE_CONFIG" = /* ]] || { echo 'Set H3_SITE_CONFIG to the reviewed runner-local JSON path.' >&2; exit 1; }
          if [[ -n "$H3_SOURCE_RUN_IDS" && ! "$H3_SOURCE_RUN_IDS" =~ ^[1-9][0-9]{0,19}(,[1-9][0-9]{0,19})?$ ]]; then
            echo 'Expected one or two comma-separated source run IDs.' >&2
            exit 1
          fi
          if [[ "$PRIORITY_ENABLED" == true && "$NODE_SLOTS_ENABLED" != true ]]; then
            echo 'H3 priority scheduling requires node-slot admission for nodes:1.' >&2
            exit 1
          fi
          scored=$(jq -nc --arg runner "cluster:$H3_CLUSTER" '[{runner:$runner,framework:"sglang","node-count":1}]' |
            uv run --no-project --with pyyaml --python 3.12 utils/ci_priority.py)
          echo "priority=$(jq -r '.[0].priority' <<<"$scored")" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib
          import os
          identity = f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}:h3-video"
          token = hashlib.sha256(identity.encode()).hexdigest()[:32]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"queue-token={token}\n")
          PY

  smoke:
    needs: prepare
    outputs:
      mode: ${{ steps.execute.outputs.mode }}
    if: ${{ inputs.inventory-run-id == '' }}
    name: p${{ needs.prepare.outputs.priority }} | ${{ inputs.preflight-only && format('H3 {0} site preflight', needs.prepare.outputs.gpu-model) || inputs.stage-amd-site && 'H3 AMD site preparation (no GPU)' || inputs.stage-amd-model && 'H3 AMD model preparation (no GPU)' || inputs.prepare-amd-runtime && 'H3 AMD runtime preparation' || inputs.inspect-amd-node && 'H3 AMD node inventory' || inputs.source-run-ids != '' && 'H3 H200 hardware inventory' || format('H3 video {0} smoke', needs.prepare.outputs.gpu-model) }}
    runs-on: >-
      ${{ fromJSON(
        (inputs.preflight-only || inputs.stage-amd-model || inputs.stage-amd-site) && format('["self-hosted","cluster:{0}"]', inputs.cluster) ||
        vars.PRIORITY_SCHEDULER_ENABLED == 'true' &&
        format('["self-hosted","cluster:{2}","nodes:1",{0},{1}]',
          toJSON(format('ci-job-{0}-{1}', needs.prepare.outputs.priority, needs.prepare.outputs.queue-token)),
          toJSON(format('ci-attempt-{0}', github.run_attempt)), inputs.cluster) ||
        format('["cluster:{0}"]', inputs.cluster)
      ) }}
    timeout-minutes: ${{ inputs.preflight-only && 5 || inputs.stage-amd-site && 10 || inputs.stage-amd-model && 45 || inputs.prepare-amd-runtime && 70 || inputs.inspect-amd-node && 20 || 255 }}
    env:
      H3_SITE_CONFIG: ${{ inputs.site-config || vars.H3_SITE_CONFIG }}
      H3_CLUSTER: ${{ inputs.cluster }}
      H3_SOURCE_SHA: ${{ github.sha }}
      H3_REPOSITORY: ${{ github.repository }}
      H3_RUN_ID: ${{ github.run_id }}
      H3_RUN_ATTEMPT: ${{ github.run_attempt }}
      H3_WORKFLOW_REF: ${{ github.workflow_ref }}
      H3_WORKFLOW_SHA: ${{ github.workflow_sha }}
      H3_ACTOR: ${{ github.actor }}
      H3_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    defaults:
      run:
        working-directory: h3-video-source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: h3-video-source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Inspect trusted runner identity without GPU allocation
        if: ${{ inputs.preflight-only }}
        run: >-
          python3 experimental/video-generation/site_preflight.py
          --output "$RUNNER_TEMP/h3-video-$H3_RUN_ID-$H3_RUN_ATTEMPT"
      - name: Stage the accepted frozen model on AMD without GPUs
        if: ${{ inputs.stage-amd-model }}
        env:
          GH_TOKEN: ${{ github.token }}
          H3_SOURCE_RUN_IDS: ${{ inputs.source-run-ids }}
        run: |
          export PYTHONPATH="$PWD"
          python3 experimental/video-generation/stage_model_ci.py \
            --source-run-id "$H3_SOURCE_RUN_IDS" \
            --workspace /it-share/data/wenyao-minimax-h3/work \
            --output "$RUNNER_TEMP/h3-video-$H3_RUN_ID-$H3_RUN_ATTEMPT"
      - name: Seal the inspected AMD runtime and frozen C1 inputs without GPUs
        if: ${{ inputs.stage-amd-site }}
        env:
          GH_TOKEN: ${{ github.token }}
          H3_SOURCE_RUN_IDS: ${{ inputs.source-run-ids }}
        run: |
          export PYTHONPATH="$PWD"
          python3 experimental/video-generation/stage_amd_site.py \
            --source-run-id "$H3_SOURCE_RUN_IDS" \
            --output "$RUNNER_TEMP/h3-video-$H3_RUN_ID-$H3_RUN_ATTEMPT"
      - name: Inspect AMD device identities and cached runtime candidates
        if: ${{ inputs.inspect-amd-node || inputs.prepare-amd-runtime }}
        run: >-
          python3 experimental/video-generation/inspect_amd_node.py
          --workspace /it-share/data/wenyao-minimax-h3/work
          ${{ inputs.prepare-amd-runtime && '--prepare-runtime' || '' }}
          --output "$RUNNER_TEMP/h3-video-$H3_RUN_ID-$H3_RUN_ATTEMPT"
      - name: Execute configured H3 smoke
        id: execute
        if: ${{ inputs.source-run-ids == '' && !inputs.preflight-only && !inputs.stage-amd-model && !inputs.stage-amd-site && !inputs.inspect-amd-node && !inputs.prepare-amd-runtime }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'experimental/video-generation')
          from ci import DEFAULT_SITE, validate_config
          with open(os.environ['H3_SITE_CONFIG']) as stream:
              config = validate_config(json.load(stream))
          if config.get('site', DEFAULT_SITE)['cluster'] != os.environ['H3_CLUSTER']:
              raise ValueError('Prepared site does not match the selected CI hardware cluster')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('mode=' + config['mode'] + '\n')
          PY
          python3 experimental/video-generation/ci.py \
            --config "$H3_SITE_CONFIG" \
            --output "$RUNNER_TEMP/h3-video-$H3_RUN_ID-$H3_RUN_ATTEMPT"
      - name: Inspect current H200 hardware and power configuration
        if: ${{ inputs.source-run-ids != '' && !inputs.preflight-only && !inputs.stage-amd-model && !inputs.stage-amd-site && !inputs.inspect-amd-node && !inputs.prepare-amd-runtime }}
        env:
          GH_TOKEN: ${{ github.token }}
          H3_SOURCE_RUN_IDS: ${{ inputs.source-run-ids }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          python3 experimental/video-generation/inventory_ci.py \
            --config "$H3_SITE_CONFIG" \
            --source-run-ids "$H3_SOURCE_RUN_IDS" \
            --output "$RUNNER_TEMP/h3-video-$H3_RUN_ID-$H3_RUN_ATTEMPT"
      - name: Preserve H3 evidence, including incomplete attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.preflight-only && 'h3-site-preflight' || inputs.stage-amd-site && 'h3-amd-site-preparation' || inputs.stage-amd-model && 'h3-model-preparation' || inputs.prepare-amd-runtime && 'h3-amd-runtime-preparation' || inputs.inspect-amd-node && 'h3-amd-node-inventory' || inputs.source-run-ids != '' && 'h3-hardware' || 'h3-video' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h3-video-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  export:
    needs: [prepare, smoke]
    if: ${{ always() && !inputs.preflight-only && !inputs.stage-amd-model && !inputs.stage-amd-site && !inputs.inspect-amd-node && !inputs.prepare-amd-runtime && needs.prepare.result == 'success' && needs.smoke.outputs.mode != 'serving-smoke' && (needs.smoke.result == 'success' || (inputs.inventory-run-id != '' && needs.smoke.result == 'skipped')) }}
    name: Verify and export retained H3 results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      H3_SOURCE_RUN_IDS: ${{ inputs.source-run-ids || github.run_id }}
      H3_REUSE: ${{ inputs.source-run-ids != '' }}
      H3_INVENTORY_RUN_ID: ${{ inputs.inventory-run-id || github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify original execution and publish versioned measurements
        run: |
          set -euo pipefail
          hardware_args=()
          if [[ "$H3_REUSE" == true ]]; then hardware_args=(--hardware-run-id "$H3_INVENTORY_RUN_ID"); fi
          uv run --no-project --python 3.12 --with 'av==16.1.0' --with 'numpy==2.3.5' \
            python experimental/video-generation/export_ci.py \
            --source-run-ids "$H3_SOURCE_RUN_IDS" "${hardware_args[@]}" \
            --output "$RUNNER_TEMP/h3-results"
      - name: Preserve exported results and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h3-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h3-results/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
