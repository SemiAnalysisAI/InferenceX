name: Recover Reused Ingest

on:
    workflow_dispatch:
        inputs:
            source-run-id:
                description: Source PR sweep run ID containing benchmark artifacts
                required: true
                type: string
            merge-run-id:
                description: Main publication run ID containing changelog metadata
                required: true
                type: string

permissions: {}

concurrency:
  group: recover-ingest-${{ inputs.source-run-id }}-${{ inputs.merge-run-id }}
  cancel-in-progress: false

jobs:
    trigger-agentic-ingest:
        name: trigger-agentic-ingest
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read # Verify issuer workflow attempts and download accepted receipt artifacts.
        steps:
            - name: Checkout trusted receipt resolver
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ github.workflow_sha }}
                persist-credentials: false
            - name: Set up uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
            - name: Resolve accepted immutable publication
              id: receipt
              env:
                GH_TOKEN: ${{ github.token }}
                SOURCE_RUN_ID: ${{ inputs.source-run-id }}
                MERGE_RUN_ID: ${{ inputs.merge-run-id }}
                INFX_RECEIPT_ISSUER_SHAS: ${{ vars.INFX_RECEIPT_ISSUER_SHAS }}
                INFX_RECEIPT_ISSUER_WORKFLOW: ${{ vars.INFX_RECEIPT_ISSUER_WORKFLOW }}
              run: uv run --locked python -m infx.workflows.receipt_transport --publication-required
            - name: Trigger agentic database ingest
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                SOURCE_RUN_ID: ${{ inputs.source-run-id }}
                MERGE_RUN_ID: ${{ inputs.merge-run-id }}
                RECEIPT_TRANSPORT: ${{ steps.receipt.outputs.payload }}
              with:
                # Cross-repository dispatch credential for maintainer-triggered ingest recovery.
                github-token: ${{ secrets.FRONTEND_PAT }} # zizmor: ignore[secrets-outside-env]
                script: |
                  await github.rest.repos.createDispatchEvent({
                    owner: "SemiAnalysisAI",
                    repo: "InferenceX-app",
                    event_type: "ingest-agentic-results",
                    client_payload: {
                      ...JSON.parse(process.env.RECEIPT_TRANSPORT),
                      "source-run-id": process.env.SOURCE_RUN_ID,
                      "merge-run-id": process.env.MERGE_RUN_ID,
                      "database-target": "production"
                    }
                  });
