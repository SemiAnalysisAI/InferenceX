name: Upload artifact with retries
description: >-
    Upload an artifact, retrying after 10 and 30 seconds. Only the third failed attempt fails
    the step.

inputs:
    name:
        description: Artifact name
        required: true
    path:
        description: Files to upload, one pattern per line
        required: true
    if-no-files-found:
        description: warn, error, or ignore when no file matches
        required: false
        default: warn

runs:
    using: composite
    steps:
        - id: first
          if: always()
          continue-on-error: true
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
              name: ${{ inputs.name }}
              path: ${{ inputs.path }}
              if-no-files-found: ${{ inputs.if-no-files-found }}

        - if: always() && steps.first.outcome == 'failure'
          shell: bash
          run: sleep 10

        - id: second
          if: always() && steps.first.outcome == 'failure'
          continue-on-error: true
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
              overwrite: true
              name: ${{ inputs.name }}
              path: ${{ inputs.path }}
              if-no-files-found: ${{ inputs.if-no-files-found }}

        - if: always() && steps.second.outcome == 'failure'
          shell: bash
          run: sleep 30

        - if: always() && steps.second.outcome == 'failure'
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
              overwrite: true
              name: ${{ inputs.name }}
              path: ${{ inputs.path }}
              if-no-files-found: ${{ inputs.if-no-files-found }}
