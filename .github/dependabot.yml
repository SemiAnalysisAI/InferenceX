version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    github-actions:
      patterns:
        - "*"
    security:
      applies-to: security-updates
      patterns: ["*"]
  cooldown:
    default-days: 7
- package-ecosystem: "uv"
  directory: "/inferencex-e2e"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 0
  groups:
    security:
      applies-to: security-updates
      patterns: ["*"]
  cooldown:
    default-days: 7
