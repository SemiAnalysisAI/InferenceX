# Facility power: PUE by system cooling mode, and the one-GPU example model.

pue:
  provenance: facility-pue
  air: 1.3
  liquid: 1.1

# The example model reports one GPU plus non_gpu_ratio x its watts as all other IT power.
example:
  non_gpu_ratio: 0.5
  gpu:
    name: GPU
    provenance:
      profile_id: gpu-input
      version: '1'
      kind: input
      source: gpu_level_power_per_gpu argument
      input_boundary: GPU electrical power, excluding other IT components
  non_gpu:
    name: Estimated non-GPU IT power
    provenance: example
