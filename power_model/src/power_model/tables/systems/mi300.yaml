# SPDX-License-Identifier: GPL-3.0-only
# One MI300X chassis on an AMD eight-way UBB.
# DIMM inventory measured on a Supermicro AS-8125GS-TNMR2 host.
id: mi300
family: hgx-chassis
name: MI300HGXSystemChassis
provenance: explicit-component-input
cooling: air
gpu_count: 8
board:
  name: MI300UBB
  provenance: amd-8way-ubb
  gpu_tdp_w: 750
  parts:
    - {part: pcie5-x16-retimer, count: 8}
host:
  - {part: x86-cpu, count: 2}
  - {part: thor2-nic, count: 8}
  - {part: ddr5-dimm, count: 16, vars: {capacity_gb: 96}}
  - {part: nvme-drive, count: 10}
  - {part: pex89144-pcie-switch, count: 4}
  - {part: system-side-400g-transceiver, count: 8}
psu:
  name: MI300PSUEfficiency
  provenance: amd_oam-psu
  efficiency: titanium
  installed: 6
  load_sharing: 6
  redundant_capacity: 3
  capacity_w: 3000.0
  system_max_w: 9000.0
  redundancy: "N+N / 3+3"
fans: normalized
network:
  gear: generic-512t-ethernet
  per_system: 0.1875
  details: {topology: two-tier, switches_per_chassis: 0.1875}
