# SPDX-License-Identifier: GPL-3.0-only
# Provenance profiles, keyed by profile_id and referenced by id from the other tables.
# kind is input | assumed | measured | estimated (power_model.base.Provenance).
amd-8way-ubb:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: AMD UBB; excludes chassis PCIe switches, host components, fans, and losses
  assumptions:
  - MI300, MI325, and MI355 boards each contain eight GPUs at the supplied GPU-level power.
  - Eight PCIe 5.0 x16 retimers at 12 W each; non-GPU board power totals 96 W.

amd_oam-psu:
  version: '1'
  kind: estimated
  source: HGX PSU model baseline
  input-boundary: Chassis AC-to-DC PSU conversion loss; DC load includes fans, excludes PUE
  assumptions:
  - Efficiency and capacity are modeling assumptions, not measured chassis profiles.
  - All HGX families use the same Titanium-class efficiency curve, with system-specific PSU counts,
    load sharing, and capacity limits.

b200-hgx-board:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: HGX board; excludes chassis PCIe switches, host components, fans, and losses
  assumptions:
  - Eight B200 GPUs at the supplied GPU-level power.
  - Two Blackwell HGX NVSwitches at 200 W each, rated at 28.8 Tbit/s per switch.
  - Eight PCIe 5.0 x16 retimers at 12 W each; non-GPU board power totals 496 W.

b200-psu:
  version: '1'
  kind: estimated
  source: HGX PSU model baseline
  input-boundary: Chassis AC-to-DC PSU conversion loss; DC load includes fans, excludes PUE
  assumptions:
  - Efficiency and capacity are modeling assumptions, not measured chassis profiles.
  - All HGX families use the same Titanium-class efficiency curve, with system-specific PSU counts,
    load sharing, and capacity limits.

b300-hgx-board:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: HGX board including NICs; excludes other host components, fans, and losses
  assumptions:
  - Eight B300 GPUs at the supplied GPU-level power.
  - Two Blackwell HGX NVSwitches at 200 W and 28.8 Tbit/s each.
  - 'Eight board-mounted ConnectX-8 NICs: 30 W idle or 50 W active per card.'
  - No PCIe retimers, chassis-level NICs, or chassis PCIe switches in this B300 inventory.

b300-psu:
  version: '1'
  kind: estimated
  source: HGX PSU model baseline
  input-boundary: Chassis AC-to-DC PSU conversion loss; DC load includes fans, excludes PUE
  assumptions:
  - Efficiency and capacity are modeling assumptions, not measured chassis profiles.
  - All HGX families use the same Titanium-class efficiency curve, with system-specific PSU counts,
    load sharing, and capacity limits.

bianca-board:
  version: '2'
  kind: estimated
  source: User-specified two-GPU / one-Grace / 512 GB board inventory
  input-boundary: Modeled GPU, CPU and memory loads downstream of the compute-tray converter
  assumptions:
  - GPU input includes local GPU module regulation but excludes tray DC/DC loss.
  - One 48 V-class converter belongs to the compute tray; no per-Grace converter.
  - No separate board-level regulation loss is added to this selected inventory.
  - 512 GB memory is one pool, not power per DIMM or SOCAMM module.

blackwell-hgx-nvswitch:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One Blackwell HGX NVSwitch
  assumptions:
  - Power is 200 W per switch.
  - Bandwidth is 28.8 Tbit/s per switch.

broadcom-pex89144:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One chassis-owned Broadcom PEX89144 PCIe switch; excludes UBB and fans
  assumptions:
  - PCIe 5.0 with 144 lanes.
  - Always active at 45 W per switch.
  - Four switches per Hopper, MI300, MI325, MI355, and B200 HGX chassis.

compute-tray-48v-converter:
  version: '2'
  kind: estimated
  source: User-specified single tray converter with shared engineering loss curve
  input-boundary: 48 V-class compute-tray bus to all modeled tray loads; loss only
  assumptions:
  - One converter per compute tray supplies both Bianca boards and tray auxiliaries.
  - 8 kW capacity and 25 W enabled no-load loss are provisional whole-unit values.
  - Assumed 94/96/96.7/96% efficiency at 10/20/50/100% output.
  - This is an estimated aggregate curve, not a converter internal-module BoM.
  - Converter loss is assigned to air cooling for the initial comparison.

connectx7-state-power:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One scale-out NIC; excludes separately modeled transceivers and switches
  assumptions:
  - Idle power is 15 W per card.
  - Power when using scale-out networking is 25 W per card.

connectx8-state-power:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One scale-out NIC; excludes separately modeled transceivers and switches
  assumptions:
  - Idle power is 30 W per card.
  - Power when using scale-out networking is 50 W per card.

ddr5-dimm-offload:
  version: '2'
  kind: estimated
  source: BMC Power_Memory calibration on an MI325X (Quanta) host
  input-boundary: One DDR5 system-memory DIMM; excludes CPU and fan power
  assumptions:
  - 'Power is 2.75 W per DIMM in both states: the 58-61 W node total over 24 DIMMs, idle and serving,
    plus a 10% margin.'
  - 'CPU offloading leaves it unchanged: Qwen3.5 HiCache with up to 81% of reused prefix tokens from
    host DRAM (about 1.3 GB/s) stayed within 1 W of idle.'
  - Host-GPU copies add about 0.21 W per GB/s read and 0.26 W per GB/s written per node, so offload
    traffic of a few GB/s is negligible.
  - Measured on 96 GB DDR5-6000 RDIMMs with 2x EPYC 9655; other DIMMs and hosts reuse it.
  - The sensor's electrical boundary is undocumented and not validated against wall power.
  - The model workload_state determines CPU offloading and the state of all DDR5 DIMMs.

epyc-embedded-3151:
  version: '1'
  kind: assumed
  source: User-specified 45 W operating budget
  input-boundary: One management CPU electrical budget after tray DC/DC; excludes memory
  assumptions:
  - The 45 W TDP is used as a fixed intermediate-rail operating budget in this model.
  - Local CPU regulation is treated as included in this provisional budget.

example:
  version: '1'
  kind: assumed
  source: User-specified 1.5 IT multiplier
  input-boundary: All non-GPU IT power, including networking
  assumptions:
  - Non-GPU IT power is 0.5 times GPU power.

explicit-component-input:
  version: '1'
  kind: input
  source: Caller-supplied component power
  input-boundary: Component electrical input; excludes separately modeled components

facility-pue:
  version: '1'
  kind: assumed
  source: Project facility PUE policy
  input-boundary: Facility overhead applied to modeled IT power; independent of equipment fans
  assumptions:
  - Air-cooled systems use PUE 1.3; liquid-cooled systems use PUE 1.1.

generic-51.2t-ethernet-switch:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: External switch ASIC plus switch-side optics power budget; excludes PUE
  assumptions:
  - Generic Ethernet switch bandwidth is 51.2 Tbit/s.
  - The ASIC uses 539 W idle or 900 W active, excluding separately modeled optics.
  - 64 always-powered 800G SR8 optics use the shared 15 W per-optic assumption.
  - Use the specified ASIC-plus-optics budget as external IT power; no HGX fan/PSU model applies.

gpu-input:
  version: '1'
  kind: input
  source: gpu_level_power_per_gpu argument
  input-boundary: GPU electrical power, excluding board and host overhead

grace-512gb-lpddr5x:
  version: '1'
  kind: estimated
  source: https://docs.nvidia.com/dccpu/grace-perf-tuning-guide/power-thermals.html
  input-boundary: Entire 512 GB pool attached to one Grace CPU; excludes regulator losses
  assumptions:
  - Published 512 GB / 3200 MHz coefficients; bandwidth is total DRAM GB/s.
  - Model domain is 0 to 384 GB/s; workload bandwidths are estimates.
  - Use on GB300 is provisional pending qualification of its memory configuration.

grace-cpu-socket-input:
  version: '1'
  kind: measured
  source: cpu_measured_power_per_socket argument
  input-boundary: One Grace CPU without its LPDDR5X memory pool
  assumptions:
  - Replaces modeled GraceCPU power; LPDDR5X remains modeled.

grace-socket-input:
  version: '1'
  kind: measured
  source: cpu_and_dram_measured_power_per_socket argument; ACPI Grace Power Socket average per socket
  input-boundary: One Grace socket as reported by the ACPI Grace Power Socket sensor
  assumptions:
  - 'Covers CPU and SysIO rails, LPDDR5X and socket regulator loss: inferred from NVIDIA''s socket-total
    statement and a ~42 W GB300 remainder above CPU plus SysIO.'
  - GB200 firmware that reported the extra regulator rail only in module power under-reports.
  - DCGM field 1130 is the CPU rail alone and is not a valid input.
  - Replaces modeled GraceCPU and LPDDR5XMemory; no Grace-side loss is added.
  - Assumed downstream of the compute-tray DC/DC converter, which stays modeled.
  - Tray air takes only the modeled LPDDR5X share; the rest, including regulator loss, is cold-plate
    heat. Routing all ~42 W to air would add up to ~0.5 kW of rack IT power.

grace-workload-baseline:
  version: '2'
  kind: estimated
  source: Provisional calibration from ACPI Grace Power Socket telemetry on GB200 and GB300
  input-boundary: 'One Grace socket less modeled LPDDR5X: CPU and SysIO rails plus socket regulator
    loss; excludes tray conversion losses'
  assumptions:
  - Fixed sequence / agentic / offloading CPU power is 95 / 90 / 85 W.
  - 'Each value is a measured socket-total midpoint less modeled LPDDR5X at the state bandwidth: 100
    W fixed-seq 8k/1k, 95 W AgentX offload off, 102 W AgentX offload on.'
  - Socket total therefore matches the measured socket input when telemetry is absent.
  - CPU plus SysIO rails alone read about 50-64 W; the ~40 W remainder is LPDDR5X and regulator loss.
  - Corresponding physical LPDDR traffic is 25 / 50 / 250 GB/s per Grace CPU; these bandwidths are
    estimates, which is why offloading CPU power is lowest.
  - Load moves socket power by about 8-12 W; offload on vs off is not isolated.
  - AgentX offload-off covers GB300 at concurrency 1-4 only.

hgx-idle-nvme:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One NVMe drive
  assumptions:
  - Idle is the only supported state.
  - Idle power is 5 W per drive.

hopper-hgx-board:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: HGX board; excludes host components, fans, and conversion losses
  assumptions:
  - Eight GPUs at the supplied GPU-level power.
  - Four Hopper HGX NVSwitches and eight PCIe 5.0 x16 retimers.

hopper-hgx-nvswitch:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One Hopper HGX NVSwitch
  assumptions:
  - Power is 100 W per switch.
  - Bandwidth is 12.8 Tbit/s per switch.

hopper-psu:
  version: '1'
  kind: estimated
  source: HGX PSU model baseline
  input-boundary: Chassis AC-to-DC PSU conversion loss; DC load includes fans, excludes PUE
  assumptions:
  - Efficiency and capacity are modeling assumptions, not measured chassis profiles.
  - All HGX families use the same Titanium-class efficiency curve, with system-specific PSU counts,
    load sharing, and capacity limits.

normalized-hgx-fans:
  version: '1'
  kind: assumed
  source: User-specified GPU TDPs and shared cooling-policy assumptions
  input-boundary: Chassis fan DC watts from pre-fan component DC load; excludes PSU loss and PUE
  assumptions:
  - Default GPU TDP per device is the board's gpu_tdp_w.
  - 'Design heat is GPU count times GPU TDP plus the highest modeled non-GPU power: CPU offloading
    and active scale-out networking, including board NICs and optional extras.'
  - All default HGX systems share 22-80% PWM and load-to-PWM exponent 1.0.
  - 'Fan watts at design heat use one shared ratio: 1100 * 0.8**3 / 9500, approximately 5.93%; the
    effective nameplate is derived from that ratio.'
  - This is a shared comparison baseline, not a measured chassis fan profile.

nvl72-compute-tray:
  version: '2'
  kind: estimated
  source: User-specified tray inventory and shared engineering thermal profile
  input-boundary: One compute-tray 48 V-class bus input; excludes rack AC/DC and PUE
  assumptions:
  - Two Bianca boards, four NICs and optics, eight NVMe drives and eight fan modules.
  - One 48 V-class converter serves the complete tray; 8 kW sizing is provisional.
  - CPU/GPU chip heat goes to liquid; memory, NICs, optics, drives and losses go to air.
  - 500 W air-load fan anchor is shared by GB200 and GB300; OEM coverage may differ.
  - Additional OEM DPUs, BMCs and boot devices outside this selected BoM are not modeled.

nvl72-nvswitch-tray:
  version: '1'
  kind: estimated
  source: User inventory with provisional fan and converter assembly
  input-boundary: One switch-tray rack-bus input, before rack AC/DC
  assumptions:
  - Two liquid-cooled switch electrical budgets plus one 45 W management CPU.
  - Four representative fan modules and a 250 W air-heat anchor are provisional.
  - Management CPU and tray converter heat are air cooled.
  - Switch local regulation is included in its electrical budget; management CPU 45 W is treated as
    an intermediate-rail budget for this tray profile.
  - Unspecified management DRAM, storage and other auxiliaries are outside this BoM.

nvl72-rack:
  version: '2'
  kind: estimated
  source: Selected NVL72 project BoM
  input-boundary: Rack AC input including tray conversion and power shelves; excludes PUE
  assumptions:
  - 18 compute trays, 9 switch trays, 72 GPUs, 36 Grace CPUs and 36 memory pools.
  - This is an estimated selected-inventory profile, not a complete measured OEM rack.
  - Fan and tray-converter curves are provisional shared assumptions.
  - Each compute tray has one converter; Bianca boards have no separate conversion stage.
  - Rack management switches and unspecified OEM auxiliary equipment are outside scope.

nvl72-titanium-shelves:
  version: '1'
  kind: estimated
  source: Shared Titanium assumption; NVIDIA and Vertiv 33 kW shelf specifications
  input-boundary: Rack AC/DC conversion loss plus shelf fans and controls; excludes PUE
  assumptions:
  - Eight shelves, six 5500 W supplies each; four shelves of redundant capacity.
  - All 48 supplies share load normally; active shelf count can model a feed failure.
  - The shared project Titanium curve is an assumption, not measured NVL72 efficiency.
  - One representative fan per PSU and 10 W controls per active shelf are provisional.
  - Auxiliary wattages are referred to the shelf output, including auxiliary rail conversion.
  - Unpowered shelves are off; energized standby policies require another profile.

pcie5-x16-retimer:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One PCIe 5.0 x16 retimer
  assumptions:
  - Power is 12 W per retimer.

pollara-state-power:
  version: '2'
  kind: estimated
  source: nicctl total_power_drawn calibration on an MI355X host
  input-boundary: One scale-out NIC; excludes separately modeled transceivers and switches
  assumptions:
  - 'Power is 34.5 W per card in both states: total_power_drawn averaged 38.65 W during a DeepSeek-R1
    InferenceX run, plus a 10% margin, minus the separately modeled 8 W transceiver.'
  - total_power_drawn includes the QSFP-400G-DR4 transceiver.
  - 'InferenceX prefill/decode runs on two MI355X nodes with KV cache over Pollara read the same as
    idle: DeepSeek-R1 at about 1 Gbit/s per NIC, and AgentX Kimi-K3 at 3.5 Gbit/s per NIC with 38.4-39.4
    W per card.'
  - Synthetic RDMA at full 400 Gbit/s line rate both ways reads 42.6 W, within the margin.

qm9700-ndr-infiniband-switch:
  version: '1'
  kind: estimated
  source: User-specified QM9700 fabric; existing project Quantum power assumptions
  input-boundary: External switch AC power budget including switch-side optics; excludes PUE
  assumptions:
  - QM9700 NDR InfiniBand switch bandwidth is 25.6 Tbit/s, with 32 OSFP cages.
  - Reuses the project Quantum box budget of 600 W idle / 783 W active, excluding optics.
  - These state watts are a proxy, not QM9700 measurements or NVIDIA typical-load ratings.
  - 32 always-powered 800G SR8 optics use the shared 15 W per-optic assumption.
  - Box power includes cooling and conversion; do not apply rack or HGX PSU models.

qm9790-ndr-infiniband-switch:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: External switch AC power budget including switch-side optics; excludes PUE
  assumptions:
  - QM9790 NDR InfiniBand switch bandwidth is 25.6 Tbit/s.
  - The switch box uses 600 W idle or 783 W active, excluding separately modeled optics.
  - 32 always-powered 800G SR8 optics use the shared 15 W per-optic assumption.
  - The box budget includes its cooling and conversion losses; do not add HGX fan/PSU models.

rack-48v-converter:
  version: '1'
  kind: estimated
  source: Engineering curve informed by Infineon REF-IBC-1600W-GAN peak efficiency
  input-boundary: 48 V-class tray bus to intermediate rails; loss only
  assumptions:
  - One 1600 W converter with 5 W enabled no-load loss.
  - Assumed 94/96/96.7/96% efficiency at 10/20/50/100% output.
  - Only the reference design peak informs this curve; these are not NVL72 measurements.
  - All converter losses are assigned to air cooling for the initial comparison.

rack-air-cooling:
  version: '1'
  kind: estimated
  source: Engineering fan policy; Sanyo Denki 9CRH0412P5J001 rated input reference
  input-boundary: Complete fan module DC input, including both rotors where applicable
  assumptions:
  - 30.24 W module is a representative part, not a verified OEM fan SKU.
  - Linear air-heat-to-speed policy, 40-80% RPM and cubic electrical-power approximation.
  - Speed fraction is not PWM duty; thermal anchors and fan counts are assumptions.

rack-blackwell-nvswitch:
  version: '1'
  kind: estimated
  source: Project Blackwell NVSwitch budget
  input-boundary: One rack NVSwitch electrical load downstream of tray conversion
  assumptions:
  - 28.8 Tbit/s; 200 W borrowed provisionally from the HGX switch assumption.
  - Always powered; external scale-out state does not disable NVLink.
  - Local switch regulation is included in this provisional electrical budget.

switch-side-800g-sr8-transceiver:
  version: '1'
  kind: assumed
  source: User-specified model baseline; shared 800G optics power assumption
  input-boundary: One switch-side optical transceiver; excludes system-side optics
  assumptions:
  - 15 W per 800G SR8 optic, always powered in both switch states.

system-side-400g-transceiver:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One system-side optical transceiver; excludes NIC and switch-side optics
  assumptions:
  - Power is 8 W per 400 Gbit/s transceiver.
  - One transceiver per scale-out NIC, including board-mounted NICs.
  - Always powered, including when scale-out networking is off.

system-side-800g-transceiver:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One system-side optical transceiver; excludes NIC and switch-side optics
  assumptions:
  - Power is 15 W per 800 Gbit/s transceiver.
  - One transceiver per scale-out NIC, including board-mounted NICs.
  - Always powered, including when scale-out networking is off.

thor2-state-power:
  version: '1'
  kind: assumed
  source: User-specified model baseline
  input-boundary: One scale-out NIC; excludes separately modeled transceivers and switches
  assumptions:
  - Idle power is 20 W per card.
  - Power when using scale-out networking is 30 W per card.

titanium-psu-curve:
  version: '1'
  kind: estimated
  source: Shared project Titanium-class PSU efficiency assumption
  input-boundary: AC-to-DC efficiency versus output load fraction of one PSU or PSU bank
  assumptions:
  - Shared by every HGX chassis PSU bank and the NVL72 power-shelf supplies.
  - A modeling assumption, not a measured chassis or shelf efficiency profile.

two-tier-scale-out-allocation:
  version: '1'
  kind: assumed
  source: User-specified two-tier scale-out topology
  input-boundary: Share of the external scale-out switches allocated to one chassis or rack
  assumptions:
  - Switches per system are user-specified allocations of a two-tier fabric, not measured topologies.

x86-cpu-and-dram-socket-input:
  version: '1'
  kind: measured
  source: cpu_and_dram_measured_power_per_socket argument
  input-boundary: One x86 CPU and its attached DDR5 DIMMs, per socket
  assumptions:
  - Replaces modeled X86CPU and DDR5DIMM power.

x86-cpu-socket-input:
  version: '1'
  kind: measured
  source: cpu_measured_power_per_socket argument; RAPL package-N energy averaged over the window,
    per socket
  input-boundary: One x86 CPU package as reported by RAPL; excludes DIMMs
  assumptions:
  - Replaces the modeled X86CPU only.
  - DDR5 DIMMs stay modeled. AMD EPYC RAPL has no DRAM domain; package power excludes DIMMs.
  - Sits downstream of the PSU, so PSU loss and fan draw respond.
  - Fan sizing keeps the modeled design-state CPU.
  - AMD Zen RAPL is not validated against wall power. Schöne et al. (TU Dresden, 2021) found Zen 2
    RAPL inaccurate, so treat the value as measured with that caveat.

x86-cpu-state:
  version: '2'
  kind: estimated
  source: Provisional RAPL package-power calibration on AMD EPYC hosts
  input-boundary: One x86 CPU package; excludes separately modeled DIMMs and fans
  assumptions:
  - Idle power is 80 W per CPU; idle is not yet calibrated.
  - 'FixedSeqLen power is 165 W per CPU: 8k/1k on 2x EPYC 9655, 162-172 W across c4-c64.'
  - 'Agentic power is 180 W per CPU, or 195 W with CPU offloading enabled: TP8 c16 on 2x EPYC 9354,
    179 / 193 W window means on different nodes.'
  - Package power varies by about 6% across concurrency, so one value per state is used.
  - The offload step is not isolated from node-to-node variation.
  - Calibrated on AMD EPYC only; Intel Xeon hosts are not yet measured.
  - AMD Zen RAPL is not validated against wall power.
