# SPDX-License-Identifier: GPL-3.0-only
# Leaf components: one electrical load per unit, counted by the boards, hosts and switches
# that list them. name is the output component name. A part has either a fixed power_w,
# or states_w selected by state_by:
#   scale_out    "active" with scale-out networking, else "idle"
#   cpu_offload  "active" for agentic-cpu-offloading, else "idle"
#   workload     workload_states maps the workload to a state label
# category groups the part for presentation and decides which host parts a measured CPU
# input replaces. A details value "$x" is filled at evaluation: $state, $power_w, $<state>_w,
# or a variable supplied by the referencing entry's vars.

hopper-hgx-nvswitch:
  name: HopperHGXNVSwitch
  category: nvswitch
  provenance: hopper-hgx-nvswitch
  power_w: 100.0
  details: {bandwidth_tbps: 12.8, per_switch_power_w: $power_w}

blackwell-hgx-nvswitch:
  name: BlackwellHGXNVSwitch
  category: nvswitch
  provenance: blackwell-hgx-nvswitch
  power_w: 200.0
  details: {bandwidth_tbps: 28.8, per_switch_power_w: $power_w}

pcie5-x16-retimer:
  name: PCIe5x16Retimer
  category: other
  provenance: pcie5-x16-retimer
  power_w: 12.0
  details: {pcie_generation: 5, lane_count: 16, per_retimer_power_w: $power_w}

connectx7-nic:
  name: ConnectX7NICCard
  category: nic
  provenance: connectx7-state-power
  state_by: scale_out
  states_w: {active: 25.0, idle: 15.0}
  details: {state: $state, bandwidth_gbps: 400, active_power_w: $active_w, idle_power_w: $idle_w}

connectx8-nic:
  name: ConnectX8NICCard
  category: nic
  provenance: connectx8-state-power
  state_by: scale_out
  states_w: {active: 50.0, idle: 30.0}
  details: {state: $state, bandwidth_gbps: 800, active_power_w: $active_w, idle_power_w: $idle_w}

thor2-nic:
  name: Thor2NICCard
  category: nic
  provenance: thor2-state-power
  state_by: scale_out
  states_w: {active: 30.0, idle: 20.0}
  details: {state: $state, bandwidth_gbps: 400, active_power_w: $active_w, idle_power_w: $idle_w}

pollara-nic:
  name: PollaraNICCard
  category: nic
  provenance: pollara-state-power
  state_by: scale_out
  states_w: {active: 34.5, idle: 34.5}
  details: {state: $state, bandwidth_gbps: 400, active_power_w: $active_w, idle_power_w: $idle_w}

x86-cpu:
  name: X86CPU
  category: cpu
  provenance: x86-cpu-state
  state_by: workload
  workload_states:
    idle: Idle
    fixed-seq-len: FixedSeqLen
    agentic: Agentic
    agentic-cpu-offloading: AgenticOffloadingOn
  states_w: {Idle: 80.0, FixedSeqLen: 165.0, Agentic: 180.0, AgenticOffloadingOn: 195.0}
  details: {architecture: x86, state: $state, per_cpu_power_w: $power_w}

ddr5-dimm:
  name: DDR5DIMM
  category: memory
  provenance: ddr5-dimm-offload
  state_by: cpu_offload
  states_w: {idle: 2.75, active: 2.75}
  details:
    memory_type: DDR5
    state: $state
    capacity_gb_per_dimm: $capacity_gb
    per_dimm_power_w: $power_w
    idle_power_w: $idle_w
    active_power_w: $active_w

nvme-drive:
  name: NVMeDrive
  category: storage
  provenance: hgx-idle-nvme
  power_w: 5.0
