# DeepSeek-V4-Pro-0813 (DSpark) FP4 B200, aggregated TP8, 1 node.
# DSpark speculative decoding: 5 tokens. No Mooncake (single-node TP8).
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-disc
    type: file-discovery
    parameters:
      path: /tmp/endpoints.yaml
      watchFile: false

  - type: prefill-filter
  - type: queue-scorer
  - type: kv-cache-utilization-scorer
  - type: active-request-scorer
  - type: prefix-cache-scorer

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: prefill-filter
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: prefix-cache-scorer
        weight: 3

dataLayer:
  discovery:
    pluginRef: file-disc

prefill:
  tp: 8
  # Must be explicit false: server.sh defaults enable-expert-parallel to true.
  enable-expert-parallel: false
  extra-args: >-
    --kv-cache-dtype fp8
    --gpu-memory-utilization 0.92
    --max-model-len 9280
    --max-num-seqs 32
    --max-num-batched-tokens 8192
    --max-cudagraph-capture-size 32
    --block-size 256
    --tokenizer-mode deepseek_v4
    --disable-custom-all-reduce
    --enable-cumem-allocator
    --no-disable-hybrid-kv-cache-manager
    --no-enable-flashinfer-autotune
    --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}
    --speculative-config {"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"FLASHINFER_MLA_SPARSE_DSV4","enable_adaptive_verification":true}
    --attention-config {"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}
  env:
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
    VLLM_DSV4_MEGA_FP8_COMBINE: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "1024"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"  # TP8 intra-node allreduce; DEP8 recipe uses "1"
    VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: "auto"
    NCCL_P2P_LEVEL: "NVL"

slurm:
  time_limit: "08:00:00"
