# DeepSeek-V4-Pro-0813 (DSpark) FP4 GB200, aggregated TP8, 2 nodes.
# DSpark speculative decoding: 5 tokens. No Mooncake (two-node TP8).
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-disc
    type: file-discovery
    parameters:
      path: /tmp/endpoints.yaml
      watchFile: false

  - type: active-request-scorer
  - type: queue-scorer
  - type: weighted-random-picker

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: weighted-random-picker

dataLayer:
  discovery:
    pluginRef: file-disc

prefill:
  tp: 8
  # Must be explicit false: server.sh defaults enable-expert-parallel to true.
  enable-expert-parallel: false
  extra-args: >-
    --kv-cache-dtype fp8
    --gpu-memory-utilization 0.85
    --max-num-batched-tokens 8192
    --block-size 256
    --tokenizer-mode deepseek_v4
    --tool-call-parser deepseek_v4
    --enable-auto-tool-choice
    --reasoning-parser deepseek_v4
    --disable-custom-all-reduce
    --enable-cumem-allocator
    --no-disable-hybrid-kv-cache-manager
    --no-enable-flashinfer-autotune
    --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}
    --speculative-config {"method":"dspark","num_speculative_tokens":5,"enable_adaptive_verification":false,"draft_sample_method":"probabilistic","attention_backend":"FLASHINFER_MLA_SPARSE_DSV4"}
    --attention-config {"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}
  env:
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
    VLLM_DSV4_MEGA_FP8_COMBINE: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "1024"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"
    VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: "auto"
    NCCL_P2P_LEVEL: "NVL"
    TORCH_SYMMMEM: NVSHMEM
    DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
    UCX_TLS: cuda_copy,cuda_ipc,tcp
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"

slurm:
  time_limit: "08:00:00"
