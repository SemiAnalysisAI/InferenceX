# DeepSeek-V4-Pro-0813 (DSpark) FP4 GB200, aggregated DEP8, 2 nodes.
# DSpark speculative decoding: 5 tokens. No Mooncake.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-disc
    type: file-discovery
    parameters:
      path: /tmp/endpoints.yaml
      watchFile: false

  - type: inflight-load-producer
  - type: approx-prefix-cache-producer
    parameters:
      autoTune: false
      blockSizeTokens: 256
      maxPrefixTokensToMatch: 1048576
      maxPrefixBlocksToMatch: 4096
      lruCapacityPerServer: 5858
  - type: prefix-cache-affinity-filter
    parameters:
      peakPrefillThroughput: 20000
      maxTTFTPenaltyMs: 30000
  - type: prefix-cache-scorer
  - type: token-load-scorer
    parameters:
      queueThresholdTokens: 1499703
  - type: active-request-scorer
  - type: queue-scorer
  - type: max-score-picker

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: prefix-cache-scorer
        weight: 6
      - pluginRef: token-load-scorer
        weight: 3
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 3
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    pluginRef: file-disc

prefill:
  tp: 1
  enable-expert-parallel: true
  extra-args: >-
    --kv-cache-dtype fp8
    --gpu-memory-utilization 0.88
    --max-num-batched-tokens 8192
    --block-size 256
    --tokenizer-mode deepseek_v4
    --tool-call-parser deepseek_v4
    --enable-auto-tool-choice
    --reasoning-parser deepseek_v4
    --moe-backend deep_gemm_mega_moe
    --enable-ep-weight-filter
    --enable-cumem-allocator
    --no-disable-hybrid-kv-cache-manager
    --no-enable-flashinfer-autotune
    --numa-bind
    --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}
    --speculative-config {"method":"dspark","num_speculative_tokens":5,"enable_adaptive_verification":false,"draft_sample_method":"probabilistic","attention_backend":"FLASHINFER_MLA_SPARSE_DSV4"}
    --attention-config {"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}
  env:
    PYTHONHASHSEED: "0"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
    VLLM_DSV4_MEGA_FP8_COMBINE: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
    VLLM_USE_DEEP_GEMM: "1"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    TORCH_SYMMMEM: NVSHMEM
    DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
    NVSHMEM_REMOTE_TRANSPORT: "none"
    NVSHMEM_IB_ENABLE_IBGDA: "false"
    NVSHMEM_CUMEM_HANDLE_TYPE: FABRIC
    NVSHMEM_DISABLE_CUDA_VMM: "0"
    UCX_TLS: cuda_copy,cuda_ipc,rc,tcp
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    UCX_MEMTYPE_CACHE: "n"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    NCCL_P2P_LEVEL: NVL

slurm:
  time_limit: "08:00:00"
