# srt-slurm recipes for dsv4/trtllm/gb300-fp4/agentx: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsv4/trtllm/gb300-fp4/agentx/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: deepseek-ai/DeepSeek-V4-Pro
    container: nvcr.io#nvidia/tensorrt-llm/release:1.3.0rc24
    precision: fp4
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4-Pro
    container:
      image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24
    frameworks:
      tensorrt_llm: 1.3.0rc24
  dynamo:
    install: true
    source:
      git: https://github.com/cquil11/dynamo.git
      rev: 2cbbdc863c336c2cfffa2a3668e2a6661801b259
    request_plane: tcp
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine:
    type: trtllm
    publish_events_and_metrics: false
  roles:
    prefill:
      env:
        OMP_NUM_THREADS: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_DEFAULT_THINKING_MODE: disabled
        MIMALLOC_ARENA_RESERVE: '0'
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        CUDA_SCALE_LAUNCH_QUEUES: 4x
      args:
        attention_dp_config:
          kv_cache_routing_conversation_affinity: true
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_timeout_ms: 600000
          transceiver_runtime: PYTHON
        cuda_graph_config: null
        custom_tokenizer: deepseek_v4
        disable_overlap_scheduler: false
        enable_attention_dp: true
        enable_chunked_prefill: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: true
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.8
          host_cache_size: 193273528320
          pool_ratio:
            - 0.55
            - 0.22
            - 0.23
          tokens_per_block: 128
          block_reuse_config:
            policy: per_conversation
            max_num_turns: 5
        max_seq_len: 990016
        moe_config:
          backend: TRTLLM
        pipeline_parallel_size: 1
        print_iter_log: true
        enable_iter_perf_stats: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
        speculative_config:
          decoding_type: MTP
          max_draft_len: 3
    decode:
      env:
        OMP_NUM_THREADS: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_DEFAULT_THINKING_MODE: disabled
        MIMALLOC_ARENA_RESERVE: '0'
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
      args:
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_timeout_ms: 600000
          transceiver_runtime: PYTHON
        cuda_graph_config:
          enable_padding: true
        custom_tokenizer: deepseek_v4
        kv_cache_config:
          avg_seq_len: 200000
          dtype: fp8
          enable_block_reuse: false
          event_buffer_max_size: 0
          host_cache_size: 0
          tokens_per_block: 128
        max_seq_len: 996595
        moe_config:
          use_low_precision_moe_combine: true
        num_postprocess_workers: 4
        pipeline_parallel_size: 1
        print_iter_log: true
        enable_iter_perf_stats: true
        return_perf_metrics: false
        sparse_attention_config:
          algorithm: deepseek_v4
          enable_heuristic_topk: true
        speculative_config:
          decoding_type: MTP
          max_draft_len: 3
        stream_interval: 20
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Pro
      MODEL_PREFIX: dsv4
      FRAMEWORK: dynamo-trt
      PRECISION: fp4
      DURATION: '3600'
      KV_OFFLOADING: dram
      ETCD_LEASE_TTL: '120'
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
      DYN_TOKENIZER: fastokens
      DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
    args:
      router-mode: kv
      no-kv-events: true
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
    placement:
      node: first_decode
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Pro
      MODEL_PREFIX: dsv4
      FRAMEWORK: dynamo-trt
      PRECISION: fp4
      DURATION: '3600'
      KV_OFFLOADING: dram
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      IS_MULTINODE: 'true'
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '14400'
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      SERVED_MODEL_NAME: DeepSeek-V4-Pro
    placement:
      node: last_decode

