schema: 2
name: dsv4-vllm-disagg-gb200-p8-d8-c384-dspark6-agentic
model:
  path: deepseek-v4-pro
  container: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-20ebb28
  precision: fp4
identity:
  model:
    repo: deepseek-ai/DeepSeek-V4-Pro-DSpark
  container:
    image: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-20ebb28
  frameworks:
    dynamo: 1.3.0.dev20260720
dynamo:
  install: true
  source:
    wheel: 1.3.0.dev20260720
slurm:
  time_limit: '3:00:00'
health_check:
  max_attempts: 540
  interval_seconds: 10
resources:
  gpu_type: gb200
  gpus_per_node: 4
  het_jobs: false
  spread_workers: false
services:
- name: etcd
  type: etcd
  placement:
    node: infra
- name: nats
  type: nats
  placement:
    node: infra
  options:
    max_payload_mb: 32
- name: mooncake-master
  type: mooncake-master
  options:
    store_config:
      metadata_server: P2PHANDSHAKE
      global_segment_size: 140GB
      local_buffer_size: 4GB
      protocol: rdma
      device_name: mlx5_0,mlx5_1,mlx5_2,mlx5_3
      mode: embedded
      enable_offload: false
environment:
  PYTHONHASHSEED: '0'
  EVAL_MAX_MODEL_LEN: '1048576'
  WITH_NVIDIA_PEERMEM: '0'
  NCCL_NET_GDR_C2C: '1'
  NCCL_IB_SL: '1'
  NCCL_IB_TIMEOUT: '20'
  NVSHMEM_REMOTE_TRANSPORT: none
  NVSHMEM_ENABLE_NIC_PE_MAPPING: '1'
  NVSHMEM_HCA_PE_MAPPING: mlx5_0:1:1,mlx5_1:1:1,mlx5_2:1:1,mlx5_3:1:1
frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: random
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
    DYN_TCP_CHANNEL_BUFFER: '128'
    DYN_TCP_REQUEST_TIMEOUT: '60'
engine:
  type: vllm
  connector: null
  dp_launch_mode: per_node
roles:
  prefill:
    nodes: 2
    workers: 1
    gpus: 8
    env:
      HF_HUB_CACHE: /hf_hub_cache
      HUGGINGFACE_HUB_CACHE: /hf_hub_cache
      TRANSFORMERS_CACHE: /hf_hub_cache
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_RPC_TIMEOUT: '600000'
      VLLM_LOG_STATS_INTERVAL: '1'
      VLLM_V2_WARMUP_MAX_NUM_SEQS: '20'
      VLLM_SERVER_DEV_MODE: '1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
      VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
      UCX_MEMTYPE_CACHE: n
      UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
      UCX_TLS: rc,cuda_copy
      NCCL_CUMEM_ENABLE: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_NVLS_ENABLE: '1'
      NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
      VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
      VLLM_CONNECTOR_PREFETCH_DEPTH: '0'
      VLLM_DSV4_MEGA_FP8_COMBINE: '1'
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-gb200-dspark-prefill-{job_id}
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_STORE_CLIENT_METRIC: '1'
      MC_STORE_CLIENT_METRIC_INTERVAL: '5'
      MC_TE_METRIC: '0'
    args:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: deepseek-ai/DeepSeek-V4-Pro-DSpark
      kv-cache-dtype: fp8
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 8
      data-parallel-rpc-port: 13345
      enable-cumem-allocator: true
      enable-expert-parallel: true
      enable-ep-weight-filter: true
      max-model-len: 1048576
      max-num-seqs: 64
      max-num-batched-tokens: 8192
      long-prefill-token-threshold: 1024
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      block-size: 256
      max-cudagraph-capture-size: 448
      gpu-memory-utilization: 0.9
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: deepseek_v4
      attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
      speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      moe-backend: deep_gemm_amxf4_mega_moe
      numa-bind: true
      numa-bind-nodes:
      - 0
      - 0
      - 1
      - 1
      cudagraph-metrics: true
  decode:
    nodes: 2
    workers: 1
    gpus: 8
    env:
      HF_HUB_CACHE: /hf_hub_cache
      HUGGINGFACE_HUB_CACHE: /hf_hub_cache
      TRANSFORMERS_CACHE: /hf_hub_cache
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_RPC_TIMEOUT: '600000'
      VLLM_LOG_STATS_INTERVAL: '1'
      VLLM_V2_WARMUP_MAX_NUM_SEQS: '20'
      VLLM_SERVER_DEV_MODE: '1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
      VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
      UCX_MEMTYPE_CACHE: n
      UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
      UCX_TLS: rc,cuda_copy
      NCCL_CUMEM_ENABLE: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_NVLS_ENABLE: '1'
      NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
      VLLM_DSV4_MEGA_FP8_COMBINE: '1'
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-gb200-dspark-decode-{job_id}
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_STORE_CLIENT_METRIC: '1'
      MC_STORE_CLIENT_METRIC_INTERVAL: '5'
      MC_TE_METRIC: '0'
    args:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"load_async":true,"lookup_async":false,"enable_lookup":false,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: deepseek-ai/DeepSeek-V4-Pro-DSpark
      kv-cache-dtype: fp8
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 8
      data-parallel-rpc-port: 13345
      enable-cumem-allocator: true
      enable-expert-parallel: true
      enable-ep-weight-filter: true
      max-model-len: 1048576
      max-num-seqs: 96
      max-num-batched-tokens: 8864
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      block-size: 256
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0,"cudagraph_capture_sizes":[7,14,21,28,35,42,49,56,63,70,77,84,91,98,105,112,119,126,133,140,147,154,161,168,175,182,189,196,203,210,217,224,231,238,245,252,259,266,273,280,287,294,301,308,315,322,329,336,343,350,357,364,371,378,385,392,399,406,413,420,427,434,441,448,455,462,469,476,483,490,497,504,511,518,525,532,539,546,553,560,567,574,581,588,595,602,609,616,623,630,637,644,651,658,665,672]}'
      max-cudagraph-capture-size: 672
      gpu-memory-utilization: 0.9
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: deepseek_v4
      attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
      speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      moe-backend: deep_gemm_amxf4_mega_moe
      numa-bind: true
      numa-bind-nodes:
      - 0
      - 0
      - 1
      - 1
      prefill-schedule-interval: 16
      long-prefill-token-threshold: 512
      kv-cache-memory-bytes: 37580963840
      cudagraph-metrics: true
sbatch_directives:
  cpus-per-task: '144'
  mem: '0'
srun_options:
  container-remap-root: ''
  cpu-bind: none
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: '8000'
    IS_MULTINODE: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_DATASET_MMAP_CACHE_ENABLED: 'false'
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
