# srt-slurm recipes for dsv4/vllm/gb200-fp4/agentx: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsv4/vllm/gb200-fp4/agentx/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: deepseek-v4-pro
    precision: fp4
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4-Pro
    container: {}
    frameworks: {}
  dynamo:
    install: true
    source: {}
  setup_script: vllm-container-deps.sh
  environment: {}
  slurm:
    time_limit: '8:00:00'
  health_check:
    max_attempts: 2160
    interval_seconds: 10
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    args: {}
  engine:
    type: vllm
    connector: null
  roles: {}
  sbatch_directives: {}
  srun_options:
    container-remap-root: ''
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      IS_MULTINODE: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126

override_agg_dep8_mtp:
  name: dsv4-gb200-vllm-agentic-mtp-agg-dep8
  model:
    container: vllm/vllm-openai:nightly-3ee2df30337a301164c46ae444b76ee67e71c106
  identity:
    container:
      image: vllm/vllm-openai:nightly-3ee2df30337a301164c46ae444b76ee67e71c106
    frameworks:
      dynamo: 1.3.1
  dynamo:
    source:
      pypi: 1.3.1
  environment:
    ETCD_LEASE_TTL: '7200'
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
  frontend:
    args:
      router-mode: kv
      router-reset-states: true
      router-session-affinity-ttl-secs: 14400
      kv-cache-block-size: 256
  engine:
    dp_launch_mode: per_node
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        HF_HUB_CACHE: /hf_hub_cache
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
        VLLM_USE_NCCL_SYMM_MEM: '1'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
      args:
        kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        kv-cache-dtype: fp8
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-size: 8
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        moe-backend: deep_gemm_mega_moe
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        max-model-len: 1048576
        max-num-seqs: 256
        max-num-batched-tokens: 8192
        trust-remote-code: true
        block-size: 256
        compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
        speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
        gpu-memory-utilization: 0.9
        stream-interval: 10
        no-disable-hybrid-kv-cache-manager: true
        kv-cache-metrics: true
        tokenizer-mode: deepseek_v4
  sbatch_directives:
    cpus-per-task: '144'
    mem: '0'
  benchmark:
    env:
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# (benchmark.env.IS_MULTINODE) Keep aggregate workers in the multinode result schema so ingestion uses
# (benchmark.env.IS_MULTINODE) the zero decode-worker count instead of duplicating TP into P and D.
override_agg_tp8_c4_mtp3:
  name: svf-vllm-agg-gb200-tp8-c4-mtp2-agentic
  # GB200 AgentX aggregate topology: one TP8 worker spans two four-GPU
  # nodes and serves both prefill and decode at concurrency 4. Keep at least
  # 16 sequence slots and otherwise size the scheduler at 4x concurrency.
  model:
    container: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-426e59f
  identity:
    container:
      image: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-426e59f
    frameworks:
      dynamo: 1.2.1
  dynamo:
    source:
      wheel: 1.2.1
  environment:
    # The frontend shares Grace CPU capacity with the long TP8 cold start.
    ETCD_LEASE_TTL: '7200'
    DYNAMO_WHEEL_DIRS: /srtctl-wheels
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
    - name: mooncake-master
      type: mooncake-master
      options:
        store_config:
          metadata_server: P2PHANDSHAKE
          global_segment_size: 150GB
          local_buffer_size: 4GB
          protocol: rdma
          device_name: mlx5_0,mlx5_1,mlx5_2,mlx5_3
          mode: embedded
          enable_offload: false
  frontend:
    args:
      router-mode: kv
      router-reset-states: true
      router-temperature: 0.0
      router-queue-threshold: 65536
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      tokenizer: fastokens
  roles:
    agg:
      nodes: 2
      workers: 1
      gpus: 8
      env:
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        TRANSFORMERS_CACHE: /hf_hub_cache
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_V2_WARMUP_MAX_NUM_SEQS: '16'
        TILELANG_CLEANUP_TEMP_FILES: '1'
        VLLM_USE_NCCL_SYMM_MEM: '0'
        TORCH_SYMMMEM: NVSHMEM
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: auto
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
        VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: '1024'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
        NCCL_P2P_LEVEL: NVL
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_STORE_CLIENT_METRIC: '1'
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_TE_METRIC: '0'
        DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-gb200-agg-mtp2-{job_id}
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        kv-cache-dtype: fp8
        tensor-parallel-size: 8
        pipeline-parallel-size: 1
        disable-custom-all-reduce: true
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        max-model-len: 1048576
        max-num-seqs: 16
        max-num-batched-tokens: 8192
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64],"mode":0}'
        speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
        gpu-memory-utilization: 0.94
        stream-interval: 10
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: deepseek_v4
  sbatch_directives:
    cpus-per-task: '144'
    mem: '0'

