# srt-slurm recipes for dsv4/vllm/gb300-fp4/agentx: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsv4/vllm/gb300-fp4/agentx/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: deepseek-v4-pro
    precision: fp4
  dynamo:
    install: true
    source: {}
  setup_script: vllm-container-deps.sh
  slurm: {}
  health_check:
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  engine:
    type: vllm
    connector: null
  roles: {}
  sbatch_directives: {}
  srun_options:
    container-remap-root: ''
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      IS_MULTINODE: 'true'
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache

override_agg_tp4_mtp:
  name: svf-vllm-agg-gb300-tp4-mtp-agentic
  # GB300 AgentX aggregate topology: one TP4 worker occupies one four-GPU node
  # and serves both prefill and decode at concurrency 8. Size max-num-seqs at
  # 4x concurrency and expand the MTP CUDA-graph envelope to match.
  model:
    container: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-426e59f
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4-Pro
    container:
      image: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-426e59f
    frameworks:
      dynamo: 1.2.1
  dynamo:
    source:
      wheel: 1.2.1
  environment:
    DYNAMO_WHEEL_DIRS: /srtctl-wheels
    ETCD_LEASE_TTL: '7200'
  slurm:
    time_limit: '8:00:00'
  health_check:
    max_attempts: 2160
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
    - name: mooncake-master
      type: mooncake-master
      options:
        store_config:
          metadata_server: P2PHANDSHAKE
          global_segment_size: 150GB
          local_buffer_size: 4GB
          protocol: rdma
          device_name: mlx5_0,mlx5_1,mlx5_2,mlx5_3
          mode: embedded
          enable_offload: false
  frontend:
    args:
      router-mode: kv
      router-reset-states: true
      router-temperature: 0.0
      router-queue-threshold: 65536
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
      tokenizer: fastokens
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      env:
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        TRANSFORMERS_CACHE: /hf_hub_cache
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_V2_WARMUP_MAX_NUM_SEQS: '32'
        TILELANG_CLEANUP_TEMP_FILES: '1'
        VLLM_USE_NCCL_SYMM_MEM: '0'
        TORCH_SYMMMEM: NVSHMEM
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: auto
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
        VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: '1024'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
        NCCL_P2P_LEVEL: NVL
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_STORE_CLIENT_METRIC: '1'
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_TE_METRIC: '0'
        DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-gb300-agg-tp4-mtp-{job_id}
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        kv-cache-dtype: fp8
        tensor-parallel-size: 4
        pipeline-parallel-size: 1
        disable-custom-all-reduce: true
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        max-model-len: 1048576
        max-num-seqs: 32
        max-num-batched-tokens: 8192
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128],"mode":0}'
        speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
        gpu-memory-utilization: 0.94
        stream-interval: 10
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: deepseek_v4
  sbatch_directives:
    cpus-per-task: '72'
    mem: '0'
  benchmark:
    env:
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      # Avoid concurrent readers observing a mismatched mmap data/index pair.
      AIPERF_DATASET_MMAP_CACHE_ENABLED: 'false'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126

