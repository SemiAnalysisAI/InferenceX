      env:
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        TRANSFORMERS_CACHE: /hf_hub_cache
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_V2_WARMUP_MAX_NUM_SEQS: '16'
        TILELANG_CLEANUP_TEMP_FILES: '1'
        VLLM_USE_NCCL_SYMM_MEM: '0'
        TORCH_SYMMMEM: NVSHMEM
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: auto
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
        VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: '1024'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
        NCCL_P2P_LEVEL: NVL
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_STORE_CLIENT_METRIC: '1'
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_TE_METRIC: '0'
        DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-gb300-agg-mtp-{job_id}
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        kv-cache-dtype: fp8
        tensor-parallel-size: 8
        pipeline-parallel-size: 1
        disable-custom-all-reduce: true
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        max-model-len: 1048576
        max-num-seqs: 16
        max-num-batched-tokens: 8192
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64],"mode":0}'
        speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
        gpu-memory-utilization: 0.94
        stream-interval: 10
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: deepseek_v4
  sbatch_directives:
    cpus-per-task: '144'
    mem: '0'
  benchmark:
    # Keep aggregate workers in the multinode result schema so ingestion uses
    # the zero decode-worker count instead of duplicating TP into P and D.
    env:
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126

# Derived from PR #2302's DEP8/DEP32 c256 recipe.
# Halve the prefill/decode topology while preserving its conservative
# 4/16/16 decode limits and isolated JIT cache paths.
override_disagg_1p1d_dep4_dep16_c128_mtp:
  name: svf-vllm-disagg-gb300-1p1d-dep4-dep16-c128-mtp-agentic
  # GB300 AgentX MTP3 topology: one DEP4 prefill worker feeds one
  # DEP16 decode worker at concurrency 128. Decode consumes P/D KV through NIXL
  # and MooncakeStore but skips Mooncake prefix lookup to avoid CPU overhead.
  model:
    container: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-426e59f
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4-Pro
    container:
      image: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-426e59f
    frameworks:
      dynamo: 1.4.0
  dynamo:
    source:
      wheel: 1.4.0
  environment:
    # Mooncake prefix-block hashes must match across processes and nodes.
    PYTHONHASHSEED: '0'
  slurm:
    time_limit: '8:00:00'
  health_check:
    max_attempts: 2160
  resources:
    het_jobs: false
    spread_workers: false
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
    - name: mooncake-master
      type: mooncake-master
      options:
        store_config:
          metadata_server: P2PHANDSHAKE
          global_segment_size: 180GB
          local_buffer_size: 4GB
          protocol: rdma
          device_name: mlx5_0,mlx5_1,mlx5_2,mlx5_3
          mode: embedded
          enable_offload: false
  frontend:
    args:
      router-mode: random
      router-session-affinity-ttl-secs: 900
    env:
      DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
      DYN_TCP_CHANNEL_BUFFER: '128'
      DYN_TCP_REQUEST_TIMEOUT: '60'
  engine:
    dp_launch_mode: per_node
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env:
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        TRANSFORMERS_CACHE: /hf_hub_cache
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_V2_WARMUP_MAX_NUM_SEQS: '20'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
        VLLM_MOONCAKE_STORE_SEND_THREADS: '8'
        VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
        VLLM_CONNECTOR_PREFETCH_DEPTH: '8'
        VLLM_DSV4_MEGA_FP8_COMBINE: '1'
        DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-gb300-1p1d-dep8-prefill-c128-{job_id}
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_STORE_CLIENT_METRIC: '1'
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_TE_METRIC: '0'
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        safetensors-load-strategy: prefetch
        kv-cache-dtype: fp8
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-size: 4
        data-parallel-rpc-port: 13345
        enable-cumem-allocator: true
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        max-model-len: 1048576
        max-num-seqs: 256
        max-num-batched-tokens: 8192
        long-prefill-token-threshold: 1024
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        gpu-memory-utilization: 0.9
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: deepseek_v4
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
        moe-backend: deep_gemm_amxf4_mega_moe
        numa-bind: true
        numa-bind-nodes: [0, 0, 1, 1]
    decode:
      nodes: 4
      workers: 1
      gpus: 16
      env:
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        TRANSFORMERS_CACHE: /hf_hub_cache
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_RPC_TIMEOUT: '600000'
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_V2_WARMUP_MAX_NUM_SEQS: '20'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
        VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
        VLLM_DSV4_MEGA_FP8_COMBINE: '1'
        DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-gb300-1p1d-dep32-decode-c128-{job_id}
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
        MC_STORE_CLIENT_METRIC: '1'
        MC_STORE_CLIENT_METRIC_INTERVAL: '5'
        MC_TE_METRIC: '0'
      args:
        kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"load_async":true,"lookup_async":false,"enable_lookup":false,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        safetensors-load-strategy: prefetch
        kv-cache-dtype: fp8
        tensor-parallel-size: 1
        pipeline-parallel-size: 1
        data-parallel-size: 16
        data-parallel-rpc-port: 13345
        enable-cumem-allocator: true
        enable-expert-parallel: true
        enable-ep-weight-filter: true
        max-model-len: 1048576
        max-num-seqs: 4
        max-num-batched-tokens: 16
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        block-size: 256
        compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
        max-cudagraph-capture-size: 16
        gpu-memory-utilization: 0.9
        no-disable-hybrid-kv-cache-manager: true
        tokenizer-mode: deepseek_v4
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
        moe-backend: deep_gemm_amxf4_mega_moe
        numa-bind: true
        numa-bind-nodes: [0, 0, 1, 1]
  sbatch_directives:
    cpus-per-task: '72'
    mem: '0'
  benchmark:
    env:
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      # Avoid concurrent readers observing a mismatched mmap data/index pair.
      AIPERF_DATASET_MMAP_CACHE_ENABLED: 'false'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'

