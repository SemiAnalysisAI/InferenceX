schema: 2
name: "agg-h200-tp8-mtp-kvoffload"

# DeepSeek-V4-Pro-0813 AgentX aggregated TP8 serving on one 8xH200 node with
# DSpark K=6. The recipe is topology-invariant; configs/nvidia-master.yaml
# varies only concurrency to produce the latency/throughput Pareto curve.

model:
  path: "deepseek-v4-pro-0813"
  container: "dynamo-sglang"
  precision: "fp8"

identity:
  model:
    repo: "deepseek-ai/DeepSeek-V4-Pro-0813"
  container:
    image: "lmsysorg/sglang:nightly-dev-20260914-4358a161"

dynamo:
  install: true
  source:
    wheel: "1.5.0.dev20260910"

slurm:
  time_limit: "8:00:00"

health_check:
  max_attempts: 1440
  interval_seconds: 10

resources:
  gpu_type: "h200"
  gpus_per_node: 8
services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: nats
    type: nats
    placement:
      node: dedicated
    options:
      max_payload_mb: 32
frontend:
  type: dynamo
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Dynamo-Session-ID
  enable_multiple_frontends: true
  num_additional_frontends: 4
  env:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  args:
    router-mode: "kv"
    router-session-affinity-ttl-secs: "3600"
    active-decode-blocks-threshold: "None"
    active-prefill-tokens-threshold: "None"
    active-prefill-tokens-threshold-frac: "None"

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 8

    env:
      SGLANG_DEFAULT_THINKING: "1"
      SGLANG_DSV4_REASONING_EFFORT: high
      SGLANG_SIMULATE_ACC_LEN: "3.77"
      SGLANG_SIMULATE_ACC_METHOD: match-expected
      SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      HF_HUB_CACHE: /hf_hub_cache
      SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
      SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
      SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: "1"
      SGLANG_OPT_USE_ONLINE_COMPRESS: "0"
      SGLANG_OPT_USE_JIT_INDEXER_METADATA: "1"
      SGLANG_OPT_USE_JIT_NORM: "1"
      SGLANG_OPT_USE_TOPK_V2: "True"
      SGLANG_ENABLE_UNIFIED_RADIX_TREE: "1"

    args:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro-0813"
      enable-metrics: true
      trust-remote-code: true
      stream-interval: 50
      watchdog-timeout: 1000000
      mem-fraction-static: 0.88
      chunked-prefill-size: 4096
      moe-runner-backend: marlin
      disable-flashinfer-autotune: true
      swa-full-tokens-ratio: 0.1
      max-running-requests: 32
      cuda-graph-max-bs-decode: 32

      scheduler-recv-interval: 30
      tp-size: 8
      dp-size: 1
      ep-size: 1

      enable-hierarchical-cache: true
      hicache-ratio: 6
      hicache-write-policy: write_through
      hicache-io-backend: kernel

      speculative-algorithm: DSPARK
      speculative-dspark-block-size: 6
      speculative-num-steps: 1
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 7

srun_options:
  # The custom benchmark installs its isolated AIPerf environment at runtime.
  container-remap-root: ""

telemetry:
  enabled: true
  collect_interval_ms: 1000
  storage_subdir: power
  required: false
  startup_timeout_seconds: 120
  request_timeout_seconds: 2
  dcgm_exporter:
    container_image: dcgm-exporter
    port: 9401

benchmark:
  type: custom
  # Replaced with CONC_LIST by the launcher before submission.
  concurrencies: [1]
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: "8000"
    # Aggregated serving uses one TP8 worker for both prefill and decode.
    IS_MULTINODE: "true"
    TP: "8"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    # Fail the run loudly if the aggregate engine's sglang: metrics never reach
    # the AIPerf export, instead of publishing a trace artifact with no backend
    # series behind it.
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
