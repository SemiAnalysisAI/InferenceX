# #3188 serving contract. CI concurrency is resolved by infx/workflows/srt_slurm.py.
# Native variants keep engine defaults shared across the four sweep arms.
schema: 2
base:
  name: mi355x-dsv4-pro-0813-agentx
  model:
    path: DeepSeek-V4-Pro-0813
    container: lmsysorg/sglang-rocm:v0.5.19-rocm720-mi35x-20260913
    precision: fp4
  slurm:
    time_limit: "08:00:00"
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang-router
    enable_multiple_frontends: false
    args:
      policy: consistent_hashing
      dp-aware: true
      cache-threshold: 0.3
      balance-abs-threshold: 2
      balance-rel-threshold: 1.1
      disable-circuit-breaker: true
      health-failure-threshold: 100
      health-check-timeout-secs: 600
      health-check-interval-secs: 30
  engine: sglang
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 8
      env: &environment
        HF_HOME: /hf_hub_cache
        HF_HUB_CACHE: /hf_hub_cache/hub
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache/hub
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONUNBUFFERED: "1"
        PYTHONPATH: /sgl-workspace/aiter
        TORCH_NCCL_BLOCKING_WAIT: "1"
        NCCL_BLOCKING_WAIT: "1"
        NCCL_IB_HCA: rdma3,rdma0,rdma2,rdma1,rdma7,rdma4,rdma6,rdma5
        GLOO_SOCKET_IFNAME: eno0
        NCCL_SOCKET_IFNAME: eno0
        AITER_LOG_LEVEL: ERROR
        HSA_NO_SCRATCH_RECLAIM: "0"
        GPU_MAX_HW_QUEUES: "2"
        SGLANG_AITER_MLA_PERSIST: "0"
        SGLANG_ENABLE_UNIFIED_RADIX_TREE: "1"
        SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
        SGLANG_MORI_DISPATCH_DTYPE: auto
        SGLANG_MORI_DISPATCH_INTER_KERNEL_SWITCH_THRESHOLD: "4096"
        SGLANG_MORI_RECV_BOUND: "1"
        SGLANG_DEFAULT_THINKING: "1"
        SGLANG_DSV4_REASONING_EFFORT: high
        SGLANG_USE_AITER: "1"
        SGLANG_USE_ROCM700A: "0"
        SGLANG_HACK_FLASHMLA_BACKEND: unified_kv_triton
        SGLANG_OPT_USE_AITER_INDEXER: "true"
        SGLANG_OPT_FP8_WO_A_FUSED_INVROPE: "1"
        SGLANG_OPT_USE_AITER_BATCHED_GEMM: "1"
        AITER_BF16_FP8_MOE_BOUND: "0"
        TORCH_BLAS_PREFER_HIPBLASLT: "1"
        IBDEVICES: rdma3,rdma0,rdma2,rdma1,rdma7,rdma4,rdma6,rdma5
        MORI_RDMA_TC: "104"
        MORI_IO_TC: "104"
        MORI_IO_SQ_BACKOFF_TIMEOUT_US: "500000"
        MORI_IO_QP_MAX_SEND_WR: "32767"
        MORI_IO_QP_MAX_CQE: "32768"
        MORI_IO_QP_MAX_SGE: "2"
        MORI_IO_TC_DISABLE: "0"
        MORI_SHMEM_MODE: ISOLATION
        MORI_EP_LAUNCH_CONFIG_MODE: AUTO
        MORI_APP_LOG_LEVEL: WARNING
        SGLANG_MORI_COMBINE_DTYPE: auto
        SGLANG_MORI_QP_PER_TRANSFER: "4"
        SGLANG_MORI_NUM_WORKERS: "4"
        MORI_MAX_DISPATCH_TOKENS_PREFILL: "8192"
        MORI_MAX_DISPATCH_TOKENS_DECODE: "256"
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "16384"
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "3600"
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600"
        SGLANG_HEALTH_CHECK_TIMEOUT: "600"
        SGLANG_ENABLE_SPEC_V2: "1"
        SGLANG_ENABLE_OVERLAP_PLAN_STREAM: "0"
        SGLANG_LOG_MS: "true"
        SGLANG_DISAGGREGATION_NUM_PRE_ALLOCATE_REQS: "32"
        SGLANG_ROUTER_STDOUT_LOGS: "0"
      args: &server
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        tp-size: 8
        enable-deepseek-v4-fp4-indexer: true
        watchdog-timeout: 3600
        load-balance-method: round_robin
        kv-cache-dtype: fp8_e4m3
        attention-backend: dsv4
        page-size: 256
        swa-full-tokens-ratio: 0.1
        enforce-shared-experts-fusion: true
        tool-call-parser: deepseekv4
        reasoning-parser: deepseek-v4
        disaggregation-transfer-backend: mori
        disaggregation-ib-device: rdma3,rdma0,rdma2,rdma1,rdma7,rdma4,rdma6,rdma5
        tokenizer-worker-num: 8
        stream-interval: 20
        log-level: info
        log-level-http: error
        speculative-algorithm: DSPARK
        speculative-eagle-topk: 1
        speculative-dspark-block-size: 3
        speculative-num-steps: 1
        speculative-num-draft-tokens: 4
        context-length: 1048576
        enable-metrics: true
        mem-fraction-static: 0.86
        chunked-prefill-size: 16384
        disable-cuda-graph: true
    decode:
      nodes: 1
      workers: 1
      gpus: 8
      env:
        <<: *environment
        SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "128"
        SGLANG_SIMULATE_ACC_METHOD: match-expected
        SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
      args:
        <<: *server
        chunked-prefill-size:
        disable-cuda-graph: false
        # These fields are sized from the actual CI concurrency before apply.
        cuda-graph-bs-decode: []
  sbatch_directives:
    cpus-per-task: "128"
    mem: "0"
  srun_options:
    mem: "0"
    container-writable: ""
    container-remap-root: ""
  health_check:
    max_attempts: 720
    interval_seconds: 5
  benchmark:
    type: custom
    container_image: lmsysorg/sglang-rocm:v0.5.19-rocm720-mi35x-20260907
    command: |
      set -eo pipefail
      mkdir -p /infmax-workspace/LOGS/agentic
      export RESULT_DIR=/infmax-workspace/LOGS/agentic
      export AGENTIC_OUTPUT_DIR=/infmax-workspace
      exec bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      PORT: "8000"
      IS_MULTINODE: "true"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache/hub
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_VERBOSITY: error
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126

override_tp4:
  resources: {}
  roles:
    prefill:
      gpus: 4
      args:
        tp-size: 4
    decode:
      gpus: 4
      args:
        tp-size: 4

override_hicache:
  roles:
    prefill:
      args:
        enable-hierarchical-cache: true
        hicache-ratio: 2.5
        hicache-io-backend: direct
        hicache-mem-layout: page_first
        hicache-write-policy: write_through
        hicache-storage-prefetch-policy: best_effort

override_umbp:
  # The per-allocation /logs mount is shared by the service and prefill
  # containers. Its socket cannot collide with another job's UMBP instance.
  services:
    - name: umbp
      type: generic
      placement:
        node: prefill
      start: before_workers
      critical: true
      inherit_discovery_env: false
      command:
        - /sgl-workspace/mori/python/mori/umbp_standalone_server
        - unix:///logs/umbp.sock
      env:
        # Preserve the ROCm environment inherited by the original UMBP process.
        HSA_NO_SCRATCH_RECLAIM: "0"
        GPU_MAX_HW_QUEUES: "5"
        UMBP_DRAM_CAPACITY: "1500000000000"
        UMBP_DRAM_USE_HUGEPAGES: "0"
        UMBP_SSD_ENABLED: "0"
        MORI_UMBP_LOG_LEVEL: info
      preamble: |
        source /infmax-workspace/benchmarks/benchmark_lib.sh --validation-only
        check_env_vars UMBP_DRAM_CAPACITY
        host_gb=$(awk '/^MemTotal:/ {printf "%d", $2 / 1000000}' /proc/meminfo)
        if (( UMBP_DRAM_CAPACITY / 1000000000 > host_gb / 2 )); then
          echo "UMBP capacity exceeds half of host memory" >&2
          exit 1
        fi
        export LD_LIBRARY_PATH="/sgl-workspace/mori/python/mori:${LD_LIBRARY_PATH}"
      readiness:
        # Wait for GPU registration, not merely a listening gRPC socket.
        log:
          pattern: host memory registered for GPU access
        timeout_seconds: 5400
        interval_seconds: 1
  roles:
    prefill:
      env: &dp_environment
        GPU_MAX_HW_QUEUES: "5"
        SGLANG_SHARED_EXPERT_TP1: "1"
        SGLANG_DP_SHARED_EXPERT_LOCAL: "1"
        SGLANG_DP_USE_GATHERV: "1"
        SGLANG_DP_USE_REDUCE_SCATTER: "1"
        UMBP_STANDALONE_ADDRESS: unix:///logs/umbp.sock
      args:
        dp-size: 8
        enable-dp-attention: true
        enable-dp-lm-head: true
        enable-dp-attention-local-control-broadcast: true
        swa-full-tokens-ratio: 0.15
        mem-fraction-static: 0.92
        chunked-prefill-size: 65536
        enable-unified-cache-external-linker: true
        unified-cache-external-linker-backend: mori
        hicache-storage-backend-extra-config: "{}"
        enable-cache-report: true
    decode:
      env:
        <<: *dp_environment
        UMBP_STANDALONE_ADDRESS:
      args:
        dp-size: 8
        enable-dp-attention: true
        enable-dp-lm-head: true
        enable-dp-attention-local-control-broadcast: true
        swa-full-tokens-ratio: 0.15
        mem-fraction-static: 0.92
