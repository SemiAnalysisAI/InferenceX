# srt-slurm recipes for glm5.2/trtllm/gb300-fp4/agentx: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/glm5.2/trtllm/gb300-fp4/agentx/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: nvidia/GLM-5.2-NVFP4
    container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc26.dev202609040000
    precision: fp4
  dynamo:
    install: true
    source: {}
    request_plane: tcp
  health_check:
    max_attempts: 270
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine:
    type: trtllm
    publish_events_and_metrics: false
  roles:
    prefill:
      gpus: 4
      env:
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        TQDM_DISABLE: '1'
        HF_HUB_DISABLE_PROGRESS_BARS: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TRTLLM_FUSED_DSA_METADATA: '1'
        TRTLLM_DSA_INDEXER_BF16: '1'
        TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
        TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
        TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
        UCX_CUDA_IPC_ENABLE_MNNVL: y
        UCX_RNDV_SCHEME: put_zcopy
        TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
        TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
        DYN_TRTLLM_ENABLE_ATTENTION_DP: '1'
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_TOKENIZER: fastokens
        DYN_PUBLISH_KV_EVENTS: '0'
      args:
        attention_dp_config:
          enable_kv_cache_aware_routing: false
          kv_cache_routing_conversation_affinity: true
          kv_cache_routing_max_sessions: 65536
        cache_transceiver_config:
          backend: NIXL
          transceiver_runtime: PYTHON
          kv_cache_bounce_size_mb: 5120
          max_tokens_in_buffer: 1048576
          kv_transfer_timeout_ms: 600000
        cuda_graph_config: null
        enable_attention_dp: true
        enable_chunked_prefill: true
        trust_remote_code: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: true
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.75
          host_cache_size: 137438953472
          tokens_per_block: 64
        max_batch_size: 256
        max_num_tokens: 8192
        max_seq_len: 1048576
        moe_config:
          backend: CUTEDSL
        moe_expert_parallel_size: 4
        num_postprocess_workers: 8
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
        sparse_attention_config:
          algorithm: dsa
          enable_heuristic_topk: true
        speculative_config:
          decoding_type: MTP
        tensor_parallel_size: 4
    decode:
      env:
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        TQDM_DISABLE: '1'
        HF_HUB_DISABLE_PROGRESS_BARS: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TRTLLM_FUSED_DSA_METADATA: '1'
        TRTLLM_DSA_INDEXER_BF16: '1'
        TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
        TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
        TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
        UCX_CUDA_IPC_ENABLE_MNNVL: y
        UCX_RNDV_SCHEME: put_zcopy
        TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
        TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
        DYN_TRTLLM_ENABLE_ATTENTION_DP: '1'
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_TOKENIZER: fastokens
        DYN_PUBLISH_KV_EVENTS: '0'
      args:
        cache_transceiver_config:
          backend: NIXL
          transceiver_runtime: PYTHON
          kv_cache_bounce_size_mb: 5120
          max_tokens_in_buffer: 1048576
          kv_transfer_timeout_ms: 600000
        cuda_graph_config:
          enable_padding: true
        trust_remote_code: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
          event_buffer_max_size: 0
          tokens_per_block: 64
        max_num_tokens: 128
        max_seq_len: 1048576
        moe_config:
          use_low_precision_moe_combine: true
        num_postprocess_workers: 4
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: false
        sparse_attention_config:
          algorithm: dsa
          enable_heuristic_topk: true
          use_cute_dsl_paged_mqa_logits: true
        speculative_config:
          decoding_type: MTP
        stream_interval: 20
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      ETCD_LEASE_TTL: '120'
      DYN_ROUTER_QUEUE_THRESHOLD: None
      DYN_ROUTER_TEMPERATURE: '0'
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
      DYN_TOKENIZER: fastokens
      DYN_TCP_REQUEST_TIMEOUT: '30'
      DYN_LOG: warn
      DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
    args:
      router-mode: kv
      no-kv-events: true
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
    placement:
      node: head
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      IS_MULTINODE: 'true'
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '14400'
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES: '0'
      SERVED_MODEL_NAME: GLM-5.2-NVFP4
      MAX_MODEL_LEN: '1048576'
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      OPENAI_API_KEY: EMPTY
      KV_OFFLOADING: dram
    placement:
      node: dedicated

override_disagg_1p1d_tep8_c20_b5_mtp5:
  name: dynamo-disagg-gb300-1p1d-tep8-c20-b5-mtp5
  dynamo:
    source:
      git: https://github.com/cquil11/dynamo.git
      rev: 2cbbdc863c336c2cfffa2a3668e2a6661801b259
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        disable_overlap_scheduler: false
        enable_iter_perf_stats: true
        speculative_config:
          max_draft_len: 5
    decode:
      nodes: 2
      workers: 1
      gpus: 8
      args:
        cuda_graph_config:
          batch_sizes: [1, 2, 4, 5]
        enable_attention_dp: false
        kv_cache_config:
          free_gpu_memory_fraction: 0.8
        max_batch_size: 5
        moe_config:
          backend: TRTLLM
        moe_expert_parallel_size: 8
        enable_iter_perf_stats: true
        sparse_attention_config:
          use_cute_dsl_topk: true
        speculative_config:
          max_draft_len: 5
        tensor_parallel_size: 8
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization

