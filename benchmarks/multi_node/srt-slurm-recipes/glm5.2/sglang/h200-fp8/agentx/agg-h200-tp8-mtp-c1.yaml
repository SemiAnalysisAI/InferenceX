name: agg-h200-tp8-mtp-c1

# Aggregated TP8 GLM-5.2 AgentX topology on one 8-GPU H200 node. MTP uses the
# committed GLM-5.2 golden thinking-on acceptance length for three speculative
# steps, and max-running-requests is twice concurrency 1.

model:
  path: hf:zai-org/GLM-5.2-FP8
  container: lmsysorg/sglang:nightly-dev-20260914-4358a161
  precision: fp8

identity:
  model:
    repo: zai-org/GLM-5.2-FP8
    revision: f33c6dc501ee5a2c7e35155653b1b1abbc320951
  container:
    image: lmsysorg/sglang:nightly-dev-20260914-4358a161
  frameworks:
    dynamo: 1.5.0.dev20260913
    sglang: 4358a1617cad734fc37bf53d9e5c2092bd43d075

dynamo:
  # This nightly includes the matching Dynamo adapter. Reinstalling an older
  # wheel removes compatibility with this SGLang commit.
  install: false

resources:
  gpu_type: h200
  gpus_per_node: 8
  gpus_per_agg: 8
  agg_nodes: 1
  agg_workers: 1

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 64

frontend:
  type: dynamo
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Dynamo-Session-ID
  enable_multiple_frontends: true
  env:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: "3600"
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None

backend:
  type: sglang
  sglang_config:
    aggregated:
      served-model-name: zai-org/GLM-5.2-FP8
      trust-remote-code: true
      tool-call-parser: glm47
      reasoning-parser: glm45
      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 1
      enable-dp-attention: false
      kv-cache-dtype: fp8_e4m3
      dsa-decode-backend: flashmla_kv
      context-length: 1048576
      max-total-tokens: 1048576
      chunked-prefill-size: 8192
      max-prefill-tokens: 8192
      mem-fraction-static: 0.75
      max-running-requests: 2
      cuda-graph-max-bs-decode: 2
      page-size: 64
      enable-hierarchical-cache: true
      hicache-write-policy: write_back
      hicache-size: 135
      hicache-io-backend: direct
      speculative-algorithm: EAGLE
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      watchdog-timeout: 86400
      stream-interval: 60
      enable-metrics: true
      enable-cache-report: true
  aggregated_environment:
    HF_HOME: /hf_hub_cache
    HF_HUB_CACHE: /hf_hub_cache
    PIP_BREAK_SYSTEM_PACKAGES: "1"
    PYTHONUNBUFFERED: "1"
    SGLANG_OPT_USE_TOPK_V2: "1"
    SGLANG_TIMEOUT_KEEP_ALIVE: "900"
    SGLANG_ENABLE_THINKING: "1"
    SGLANG_REASONING_EFFORT: max
    SGLANG_ENABLE_UNIFIED_RADIX_TREE: "1"
    SGLANG_HICACHE_DEBUG_LOG: "1"
    SGLANG_HICACHE_DEBUG_SAMPLE_RATE: "16384"
    SGLANG_SIMULATE_ACC_LEN: "2.99"
    SGLANG_SIMULATE_ACC_METHOD: match-expected
    SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token

health_check:
  max_attempts: 1440
  interval_seconds: 10

telemetry:
  enabled: true
  collect_interval_ms: 1000
  storage_subdir: power
  required: true
  startup_timeout_seconds: 120
  request_timeout_seconds: 2
  collector_join_timeout_seconds: 12
  dcgm_exporter:
    container_image: dcgm-exporter
    port: 9401

benchmark:
  type: custom
  use_chat_template: true
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126

sbatch_directives:
  mem: "0"

srun_options:
  mem: "0"
  container-remap-root: ""
