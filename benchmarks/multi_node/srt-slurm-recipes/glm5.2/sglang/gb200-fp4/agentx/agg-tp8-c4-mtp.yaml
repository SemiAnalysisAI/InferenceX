schema: 2
name: agg-gb200-tp8-c4-mtp
model:
  path: glm-5.2-fp4
  container: "lmsysorg/sglang:v0.5.19-cu130@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9"
  precision: fp4
identity:
  model:
    repo: nvidia/GLM-5.2-NVFP4
    revision: aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa
  container:
    image: "lmsysorg/sglang:v0.5.19-cu130@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9"
  frameworks:
    dynamo: 1.5.0.dev20260917
    sglang: 0.5.19
resources:
  gpu_type: gb200
  gpus_per_node: 4
frontend:
  type: dynamo
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Dynamo-Session-ID
  enable_multiple_frontends: true
  env:
    PIP_BREAK_SYSTEM_PACKAGES: '1'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '3600'
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None
dynamo:
  install: true
  source:
    wheel: "1.5.0.dev20260917"
engine: sglang
roles:
  agg:
    nodes: 2
    workers: 1
    gpus: 8
    env:
      TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
      PYTHONUNBUFFERED: '1'
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      MC_TE_METRIC: 'true'
      MC_FORCE_MNNVL: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
      SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
      SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
      SGLANG_ENABLE_THINKING: '1'
      SGLANG_REASONING_EFFORT: max
      SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'
      SGLANG_HICACHE_DEBUG_LOG: '1'
      SGLANG_HICACHE_DEBUG_SAMPLE_RATE: '16384'
      SGLANG_MOE_NVFP4_DISPATCH: '1'
      SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '1'
      SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: '8'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    args:
      served-model-name: nvidia/GLM-5.2-NVFP4
      trust-remote-code: true
      quantization: modelopt_fp4
      kv-cache-dtype: fp8_e4m3
      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 1
      enable-dp-attention: false
      enable-dp-lm-head: false
      max-running-requests: 10
      cuda-graph-max-bs-decode: 10
      chunked-prefill-size: 8192
      max-prefill-tokens: 8192
      context-length: 1048576
      speculative-algorithm: EAGLE
      speculative-num-steps: 4
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 5
      dsa-prefill-backend: trtllm
      dsa-decode-backend: trtllm
      moe-runner-backend: flashinfer_trtllm
      fp4-gemm-backend: flashinfer_trtllm
      disable-shared-experts-fusion: true
      flashinfer-allreduce-fusion-backend: auto
      weight-loader-prefetch-checkpoints: true
      model-loader-extra-config: '{"enable_multithread_load": true}'
      mem-fraction-static: 0.8
      enable-hierarchical-cache: true
      hicache-write-policy: write_back
      hicache-size: 135
      hicache-io-backend: direct
      enable-metrics: true
health_check:
  max_attempts: 1440
  interval_seconds: 10
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: '8000'
    IS_MULTINODE: 'true'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
services:
  - name: etcd
    type: etcd
    placement:
      node: infra
  - name: nats
    type: nats
    placement:
      node: infra
    options:
      max_payload_mb: 64
sbatch_directives:
  mem: '0'
  cpus-per-task: '144'
srun_options:
  mem: '0'
  container-remap-root: ''
