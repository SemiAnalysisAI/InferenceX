schema: 2
name: "h100-fp8-1p1d-max-tp-mtp"

model:
  path: "dsr1-fp8"
  container: "lmsysorg/sglang:v0.5.8-cu130"
  precision: "fp8"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

dynamo:
  # Dynamo 0.8.0 was the default when this recipe was written; pin it explicitly.
  # Use NATS for a recipe prior to Dynamo commit 39d2a68.
  request_plane: "nats"

  source:
    pypi: "0.8.0"
frontend:
  nginx_container: nginx-sqsh

engine: sglang
roles:
  prefill:
    nodes: 2
    workers: 1
    env:
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_ENABLE_SPEC_V2: "1"

  # Decode-specific environment variables
    args:
      # Model configuration
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      watchdog-timeout: 1000000

      # Parallelism
      tp-size: 16
      dp-size: 1
      ep-size: 1
      enable-dp-attention: false

      # KV cache and attention
      attention-backend: "flashinfer"

      # Radix cache disabled
      disable-radix-cache: true

      # Prefill capacity
      max-running-requests: 2

      # Prefill-specific mode
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl

      # Memory and token limits
      mem-fraction-static: 0.6
      max-prefill-tokens: 2048
      chunked-prefill-size: 2048

      # Request handling
      load-balance-method: "round_robin"

      # MTP (Multi-Token Prediction)
      speculative-algorithm: "EAGLE"
      speculative-num-steps: 2
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 3

  decode:
    nodes: 2
    workers: 1
    env:
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_ENABLE_SPEC_V2: "1"

    args:
      # Model configuration
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      watchdog-timeout: 1000000

      # Parallelism
      tp-size: 16
      dp-size: 1
      ep-size: 1
      enable-dp-attention: false

      # KV cache and attention
      attention-backend: "flashinfer"

      # Other flags
      disable-radix-cache: true
      stream-interval: 1

      # Disagg
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl

      # Memory and token limits
      mem-fraction-static: 0.9
      max-running-requests: 128
      cuda-graph-max-bs: 128

      # MTP (Multi-Token Prediction)
      speculative-algorithm: "EAGLE"
      speculative-num-steps: 2
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 3

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/srt_fixed_sequence.sh
  env:
    TOKENIZER: /model
    ISL: '8192'
    OSL: '1024'

# Container setup plus loading the weights over NFS outlasts the 30-minute default.
health_check:
  max_attempts: 360
  interval_seconds: 10

# etcd and NATS are static binaries from /configs; run them in the small nginx
# image instead of a ~40 GB copy of the job image each on the head node. The
# first container step on an H100 node can still take minutes to set up.
services:
  - name: etcd
    type: etcd
    container: nginx-sqsh
    readiness:
      port: 2379
      timeout_seconds: 1200
  - name: nats
    type: nats
    container: nginx-sqsh
    readiness:
      port: 4222
      timeout_seconds: 1200

# SGLang fails when one TP rank finishes loading 480 s before another. Weights
# come over NFS and a node reused from an earlier run loads from page cache, so
# read them into every worker's cache first to even out the load.
host_setup:
  nodes: workers
  timeout_seconds: 3600
  commands:
    - find /mnt/nfs/lustre/models/dsr1-fp8 -name '*.safetensors' -print0 | xargs -0 -P 16 -n 1 cat > /dev/null
