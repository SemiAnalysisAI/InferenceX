# srt-slurm recipes for dsr1/sglang/b200-fp8/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsr1/sglang/b200-fp8/8k1k/variants.yaml:override_<name>.

schema: 2

base:
  dynamo:
    # Use NATS for a recipe prior to Dynamo commit 39d2a68.
    request_plane: nats
    source:
      pypi: 0.9.1
  model:
    path: dsr1-fp8
    container: dynamo-sglang
    precision: fp8
  resources:
    gpu_type: b200
    gpus_per_node: 8
  engine: sglang
  roles:
    prefill:
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        PYTHONUNBUFFERED: '1'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        MC_FORCE_MNNVL: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        CUDA_SCALE_LAUNCH_QUEUES: 4x
        SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2: '1'
      args:
        # Model configuration
        served-model-name: deepseek-ai/DeepSeek-R1
        trust-remote-code: true
        quantization: fp8
        # Disaggregation mode
        disaggregation-mode: prefill
        disaggregation-transfer-backend: nixl
        load-balance-method: round_robin
        # Memory and token limits
        mem-fraction-static: 0.6
        max-prefill-tokens: 8192
        chunked-prefill-size: 65536
        max-running-requests: 8
        context-length: 9600
        # Parallelism
        tensor-parallel-size: 8
        data-parallel-size: 8
        expert-parallel-size: 1
        enable-dp-attention: true
        enable-dp-lm-head: true
        # Attention
        attention-backend: trtllm_mla
        kv-cache-dtype: fp8_e4m3
        # MoE
        moe-runner-backend: flashinfer_trtllm
        moe-dense-tp-size: 1
        # Other flags
        stream-interval: 30
        watchdog-timeout: 1000000
        enable-flashinfer-allreduce-fusion: true
        disable-radix-cache: true
    decode:
      env:
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        PYTHONUNBUFFERED: '1'
        DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_DECODE_BOOTSTRAP_TIMEOUT: '1000'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        MC_FORCE_MNNVL: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        CUDA_SCALE_LAUNCH_QUEUES: 4x
        SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2: '1'
      args:
        # Model configuration
        served-model-name: deepseek-ai/DeepSeek-R1
        trust-remote-code: true
        quantization: fp8
        # Disaggregation mode
        disaggregation-mode: decode
        disaggregation-transfer-backend: nixl
        # Memory and token limits
        mem-fraction-static: 0.75
        context-length: 9600
        # Parallelism
        tensor-parallel-size: 8
        # Attention
        attention-backend: trtllm_mla
        kv-cache-dtype: fp8_e4m3
        # MoE
        moe-runner-backend: flashinfer_trtllm
        # Other flags
        stream-interval: 30
        watchdog-timeout: 1000000
        enable-flashinfer-allreduce-fusion: true
        disable-radix-cache: true
  health_check:
    interval_seconds: 10
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf

override_disagg_1p1d_p_tp8_dp8_d_tp8_ep8_dp8_b256_c160x288_mtp:
  name: b200-fp8-mtp-max-tpt-dep8-1p-2d
  roles:
    prefill:
      nodes: 1
      workers: 1
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
    decode:
      nodes: 1
      workers: 1
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
      args:
        max-running-requests: 256
        cuda-graph-max-bs: 32
        data-parallel-size: 8
        expert-parallel-size: 8
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-dense-tp-size: 1
        speculative-algorithm: EAGLE
        speculative-num-steps: 2
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 3
  health_check:
    max_attempts: 720
  benchmark:
    concurrencies: 160x288

