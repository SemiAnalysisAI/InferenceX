schema: 2
name: "bs8-1p6d-h200-fp8-mtp"

model:
  path: "dsr1"
  container: "lmsysorg/sglang:v0.5.19-cu130"
  precision: "fp8"

frontend:
  nginx_container: nginx

resources:
  gpu_type: "h200"
  gpus_per_node: 8

dynamo:
  # SGLang v0.5.19 removed sglang.srt.server_args_config_parser and sglang.srt.tracing,
  # which ai-dynamo releases through 1.4.2 import at worker startup. ai-dynamo
  # 1.5.0.dev20260910 pins sglang==0.5.19 and imports only modules in that release.
  # NATS request plane retained from the measured 0.8.0 configuration; Dynamo 1.5 still
  # accepts --request-plane nats.
  request_plane: "nats"

  source:
    wheel: "1.5.0.dev20260910"
engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    env:
      SGLANG_ENABLE_SPEC_V2: "1"
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"

  # Decode-specific environment variables
    args:
      # Model configuration
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      watchdog-timeout: 1000000

      # Parallelism
      tp-size: 8
      dp-size: 1
      ep-size: 1

      # KV cache and attention
      attention-backend: "flashinfer"

      # Radix cache disabled
      disable-radix-cache: true

      # Other flags
      # stream-interval: 50
      max-running-requests: 16


      # Prefill-specific mode
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl

      # Memory and token limits
      mem-fraction-static: 0.82
      max-prefill-tokens: 32768
      chunked-prefill-size: 32768

      # Request handling
      load-balance-method: "round_robin"


  decode:
    nodes: 6
    workers: 6
    env:
      SGLANG_ENABLE_SPEC_V2: "1"
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"

    args:
      # Model configuration
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      watchdog-timeout: 1000000

      # Parallelism
      tp-size: 8
      dp-size: 1
      ep-size: 1

      # KV cache and attention
      attention-backend: "flashinfer"

      # Other flags
      disable-radix-cache: true
      stream-interval: 10

      # Disagg
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl

      # Memory and token limits
      mem-fraction-static: 0.82
      max-running-requests: 16
      cuda-graph-max-bs: 16

      # MTP settings
      speculative-algorithm: "EAGLE"
      speculative-num-steps: 2
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 3

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "2x4x8x16x32"
  req_rate: "inf"
