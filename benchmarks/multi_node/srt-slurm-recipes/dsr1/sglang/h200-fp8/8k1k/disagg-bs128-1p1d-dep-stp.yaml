schema: 2
name: "bs128-1p1d-dep-h200-fp8"

model:
  path: "dsr1"
  container: "lmsysorg/sglang:v0.5.20-cu130"
  precision: "fp8"

frontend:
  nginx_container: nginx

resources:
  gpu_type: "h200"
  gpus_per_node: 8

dynamo:
  # ai-dynamo 0.8.0 imports sglang.srt.server_args_config_parser, which SGLang
  # v0.5.19+ moved under sglang.srt.utils, so it cannot start on v0.5.20-cu130.
  # Pin the staged 1.5.0.dev20260917 wheel (the ai-dynamo prerelease line the
  # v0.5.20-cu130 image was built with). The NATS request plane is unchanged.
  request_plane: "nats"

  source:
    wheel: "1.5.0.dev20260917"
engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    env:
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"

    args:
      # Model configuration
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true

      # Parallelism
      tp-size: 8
      dp-size: 1
      ep-size: 1

      # KV cache and attention
      attention-backend: "flashinfer"

      # Radix cache disabled
      disable-radix-cache: true

      # Other flags
      # stream-interval: 50
      watchdog-timeout: 1000000
      max-running-requests: 16


      # Prefill-specific mode
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl

      # Memory and token limits
      mem-fraction-static: 0.75
      max-prefill-tokens: 163840
      chunked-prefill-size: 163840

      # Request handling
      load-balance-method: "round_robin"


  decode:
    nodes: 1
    workers: 1
    env:
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"

    args:
      # Model configuration
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true

      # Parallelism
      tp-size: 8
      dp-size: 8
      ep-size: 8
      enable-dp-attention: true

      # KV cache and attention
      attention-backend: "flashinfer"

      # Other flags
      disable-radix-cache: true
      stream-interval: 10
      watchdog-timeout: 1000000

      # Disagg
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl

      # Memory and token limits
      mem-fraction-static: 0.88
      max-running-requests: 256
      cuda-graph-max-bs-decode: 256

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "64x128x256"
  req_rate: "inf"
