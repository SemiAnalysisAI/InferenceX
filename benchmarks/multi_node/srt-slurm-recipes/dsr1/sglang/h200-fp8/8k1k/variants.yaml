# srt-slurm recipes for dsr1/sglang/h200-fp8/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsr1/sglang/h200-fp8/8k1k/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: dsr1
    container: lmsysorg/sglang:v0.5.8.post1-cu130
    precision: fp8
  frontend:
    nginx_container: nginx
  resources:
    gpu_type: h200
    gpus_per_node: 8
  dynamo:
    # Dynamo 0.8.0 was the default when this recipe was written; pin it explicitly.
    # Use NATS for a recipe prior to Dynamo commit 39d2a68.
    request_plane: nats
    source:
      pypi: 0.8.0
  engine: sglang
  roles:
    prefill:
      env:
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
      # Memory and token limits
      args:
        # Model configuration
        served-model-name: deepseek-ai/DeepSeek-R1
        model-path: /model/
        skip-tokenizer-init: true
        trust-remote-code: true
        watchdog-timeout: 1000000
        # Parallelism
        tp-size: 8
        dp-size: 1
        ep-size: 1
        # KV cache and attention
        attention-backend: flashinfer
        # Radix cache disabled
        disable-radix-cache: true
        max-running-requests: 16
        # Prefill-specific mode
        disaggregation-bootstrap-port: 30001
        disaggregation-mode: prefill
        disaggregation-transfer-backend: nixl
        # Request handling
        load-balance-method: round_robin
    decode:
      env:
        SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
      # Memory and token limits
      args:
        # Model configuration
        served-model-name: deepseek-ai/DeepSeek-R1
        model-path: /model/
        skip-tokenizer-init: true
        trust-remote-code: true
        watchdog-timeout: 1000000
        # Parallelism
        tp-size: 8
        # KV cache and attention
        attention-backend: flashinfer
        # Other flags
        disable-radix-cache: true
        stream-interval: 10
        # Disagg
        disaggregation-bootstrap-port: 30001
        disaggregation-mode: decode
        disaggregation-transfer-backend: nixl
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf

override_disagg_bs128_1p1d_dep_mtp:
  name: bs128-1p1d-dep-h200-fp8-mtp
  roles:
    prefill:
      nodes: 1
      workers: 1
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
      # Decode-specific environment variables
      # Other flags
      # stream-interval: 50
      args:
        mem-fraction-static: 0.75
        max-prefill-tokens: 163840
        chunked-prefill-size: 163840
    decode:
      nodes: 1
      workers: 1
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
      args:
        dp-size: 8
        ep-size: 8
        enable-dp-attention: true
        mem-fraction-static: 0.85
        max-running-requests: 192
        cuda-graph-max-bs: 192
        # MTP settings
        speculative-algorithm: EAGLE
        speculative-num-steps: 2
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 3
  benchmark:
    concurrencies: 32x64x128x256x512

