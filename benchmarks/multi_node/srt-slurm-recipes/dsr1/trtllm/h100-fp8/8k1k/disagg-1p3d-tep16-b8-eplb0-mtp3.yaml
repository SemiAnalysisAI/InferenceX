schema: 2
name: h100_8k1k_ctx1dep16_gen3tep16_batch8_eplb0_mtp3
model:
  path: DeepSeek-R1-0528
  container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post3"
  precision: fp8
resources:
  gpu_type: h100
  gpus_per_node: 8
engine:
  type: trtllm
  # Dynamo builds before ai-dynamo/dynamo#12162 reject --publish-metrics.
  publish_metrics: false
roles:
  prefill:
    nodes: 2
    workers: 1
    env:
      UCX_CUDA_IPC_ENABLE_MNNVL: n
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      TLLM_LOG_LEVEL: INFO
      TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP: '1'
      TRTLLM_FORCE_ALLTOALL_METHOD: DeepEP
    args:
      max_batch_size: 1
      max_num_tokens: 8224
      max_seq_len: 8232
      tensor_parallel_size: 16
      moe_expert_parallel_size: 16
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config:
      disable_overlap_scheduler: true
      enable_chunked_prefill: false
      moe_config:
        backend: WIDEEP
        max_num_tokens: 16384
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.3
        dtype: fp8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 8256
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 3
  decode:
    nodes: 6
    workers: 3
    env:
      NCCL_NVLS_ENABLE: '0'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      TLLM_LOG_LEVEL: INFO
      UCX_CUDA_IPC_ENABLE_MNNVL: n
    args:
      tensor_parallel_size: 16
      moe_expert_parallel_size: 16
      enable_attention_dp: false
      enable_lm_head_tp_in_adp: false
      pipeline_parallel_size: 1
      max_batch_size: 8
      max_num_tokens: 256
      max_seq_len: 9256
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
          - 1
          - 2
          - 4
          - 8
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: fp8
      moe_config:
        backend: CUTLASS
        use_low_precision_moe_combine: true
      cache_transceiver_config:
        max_tokens_in_buffer: 8256
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 3
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/srt_fixed_sequence.sh
  env:
    MODEL: DeepSeek-R1-0528
    TOKENIZER: /model
    ISL: '8192'
    OSL: '1024'
frontend:
  type: dynamo
  enable_multiple_frontends: false
dynamo:
  install: false
  # The container tag identifies a pre-39d2a68 Dynamo release; the image is not digest-pinned.
  # Use NATS for a recipe prior to Dynamo commit 39d2a68.
  request_plane: "nats"

# The first container step on an H100 node spends ~8 minutes setting up the job
# image, and etcd/NATS are that first step; the 300s default times out.
services:
  - name: etcd
    type: etcd
    readiness:
      port: 2379
      timeout_seconds: 1200
  - name: nats
    type: nats
    readiness:
      port: 4222
      timeout_seconds: 1200
