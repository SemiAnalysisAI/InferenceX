# srt-slurm recipes for dsr1/trtllm/h200-fp8/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsr1/trtllm/h200-fp8/8k1k/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: dsr1
    container: nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post1
    precision: fp8
  sbatch_directives:
    cpus-per-gpu: '16'
  resources:
    gpu_type: h200
    gpus_per_node: 8
  engine: trtllm
  roles:
    prefill:
      env:
        UCX_TLS: rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
      args:
        # ISL/OSL: 8k/1k, TP=8 on H200
        backend: pytorch
        trust_remote_code: true
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        pipeline_parallel_size: 1
        enable_attention_dp: false
        enable_chunked_prefill: false
        max_batch_size: 2
        max_num_tokens: 16640
        max_seq_len: 8232
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.85
          dtype: fp8
        cache_transceiver_config:
          backend: UCX
          max_tokens_in_buffer: 32768
        moe_config:
          backend: CUTLASS
        cuda_graph_config: null
        disable_overlap_scheduler: true
        print_iter_log: true
        # Performance tuning
        stream_interval: 100
        num_postprocess_workers: 4
    decode:
      env:
        UCX_TLS: rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
      args:
        # ISL/OSL: 8k/1k, TP=8 on H200
        backend: pytorch
        trust_remote_code: true
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        pipeline_parallel_size: 1
        enable_chunked_prefill: false
        max_seq_len: 9256
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.85
          dtype: fp8
        cache_transceiver_config:
          backend: UCX
          max_tokens_in_buffer: 16384
        moe_config:
          backend: CUTLASS
          use_low_precision_moe_combine: true
        cuda_graph_config:
          enable_padding: true
        disable_overlap_scheduler: false
        print_iter_log: true
        # Performance tuning
        stream_interval: 100
        num_postprocess_workers: 4
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf
  frontend:
    type: dynamo
    # For some reason, the H200 cluster doesn't like nginx.
    enable_multiple_frontends: false
  dynamo:
    install: false
    # The container tag identifies a pre-39d2a68 Dynamo release; the image is not digest-pinned.
    # Use NATS for a recipe prior to Dynamo commit 39d2a68.
    request_plane: nats

override_disagg_1p1d_dep8_b256_eplb0_mtp0_c128:
  name: c128_ctx1_gen1_dep8_batch256_eplb0_mtp0
  roles:
    # Prefill Worker Config for Dynamo DSR1 (DEP mode)
    # Matches E2E standalone ctx_config.yaml
    prefill:
      nodes: 1
      workers: 1
    decode:
      nodes: 1
      workers: 1
      # Decode Worker Config for Dynamo DSR1 (DEP mode)
      # Matches E2E standalone gen_config.yaml (DEP c=128)
      args:
        enable_attention_dp: true
        max_batch_size: 256
        max_num_tokens: 256
        cuda_graph_config:
          batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
  benchmark:
    concurrencies: '128'

override_disagg_1p1d_dep8_b32_eplb0_mtp2_c64:
