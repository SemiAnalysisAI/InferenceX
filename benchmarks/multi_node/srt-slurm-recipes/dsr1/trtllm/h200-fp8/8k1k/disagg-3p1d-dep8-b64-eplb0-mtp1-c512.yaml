schema: 2
name: "c512_ctx3_gen1_dep8_batch64_eplb0_mtp1"

model:
  path: "dsr1"
  container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post1"
  precision: "fp8"

sbatch_directives:
  cpus-per-gpu: "16"

resources:
  gpu_type: "h200"
  gpus_per_node: 8

engine: trtllm
roles:
  prefill:
    nodes: 3
    workers: 3

    env:
      UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"
      TRTLLM_ENABLE_PDL: "1"
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      NCCL_GRAPH_MIXING_SUPPORT: "0"

    args:
      # Prefill Worker Config for Dynamo DSR1 (MTP mode)
      # ISL/OSL: 8k/1k, TP=8 on H200
      backend: pytorch
      trust_remote_code: true
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: false
      enable_chunked_prefill: false
      max_batch_size: 2
      max_num_tokens: 16640
      max_seq_len: 8232
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        dtype: fp8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 32768
      moe_config:
        backend: CUTLASS
      cuda_graph_config:
      disable_overlap_scheduler: true
      print_iter_log: true
      # Performance tuning
      stream_interval: 100
      num_postprocess_workers: 4
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 1
  decode:
    nodes: 1

    workers: 1
    env:
      UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"
      TRTLLM_ENABLE_PDL: "1"
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      NCCL_GRAPH_MIXING_SUPPORT: "0"

    args:
      # Decode Worker Config for Dynamo DSR1 (MTP c=512)
      # ISL/OSL: 8k/1k, TP=8 on H200
      backend: pytorch
      trust_remote_code: true
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: true
      enable_chunked_prefill: false
      max_batch_size: 64
      max_num_tokens: 256
      max_seq_len: 9256
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        dtype: fp8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 16384
      moe_config:
        backend: CUTLASS
        use_low_precision_moe_combine: true
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1, 2, 4, 8, 16, 32, 64]
      disable_overlap_scheduler: false
      print_iter_log: true
      # Performance tuning
      stream_interval: 100
      num_postprocess_workers: 4
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 1

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "512"
  req_rate: "inf"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false # For some reason, the H200 cluster doesn't like nginx.

dynamo:
  install: false
  # The container tag identifies a pre-39d2a68 Dynamo release; the image is not digest-pinned.
  # Use NATS for a recipe prior to Dynamo commit 39d2a68.
  request_plane: "nats"
