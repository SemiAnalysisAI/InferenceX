# srt-slurm recipes for dsr1/trtllm/gb300-fp4/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsr1/trtllm/gb300-fp4/8k1k/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: dsr1
    container: dynamo-trtllm
    precision: fp4
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine: trtllm
  roles:
    prefill:
      env:
        TLLM_OVERRIDE_LAYER_NUM: '61'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        TRTLLM_ENABLE_PDL: '1'
      args:
        max_batch_size: 2
        max_num_tokens: 16640
        max_seq_len: 8232
        tensor_parallel_size: 2
        moe_expert_parallel_size: 2
        enable_attention_dp: true
        pipeline_parallel_size: 1
        print_iter_log: true
        cuda_graph_config: null
        disable_overlap_scheduler: true
        moe_config:
          backend: TRTLLM
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.6
          dtype: fp8
        cache_transceiver_config:
          max_tokens_in_buffer: 16384
          backend: UCX
    decode:
      env:
        TLLM_OVERRIDE_LAYER_NUM: '61'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        TRTLLM_ENABLE_PDL: '1'
      args:
        pipeline_parallel_size: 1
        max_seq_len: 9256
        cuda_graph_config:
          enable_padding: true
        print_iter_log: true
        kv_cache_config:
          enable_block_reuse: false
          dtype: fp8
        moe_config:
          use_low_precision_moe_combine: true
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        cache_transceiver_config:
          max_tokens_in_buffer: 16384
          backend: UCX
        stream_interval: 100
        num_postprocess_workers: 4
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  dynamo:
    install: false
    # The unversioned container alias does not identify a Dynamo version or hash.
    # Use NATS for a recipe with an unverified Dynamo revision.
    request_plane: nats
  services:
    - name: etcd
      type: etcd
      placement:
        node: dedicated
    - name: nats
      type: nats
      placement:
        node: dedicated

override_disagg_10p1d_dep16_b32_eplb0_mtp3:
  name: ctx10_gen1_dep16_batch32_eplb0_mtp3
  roles:
    prefill:
      nodes: 5
      workers: 10
      args:
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
    decode:
      nodes: 4
      workers: 1
      args:
        tensor_parallel_size: 16
        moe_expert_parallel_size: 16
        enable_attention_dp: true
        enable_lm_head_tp_in_adp: true
        max_batch_size: 32
