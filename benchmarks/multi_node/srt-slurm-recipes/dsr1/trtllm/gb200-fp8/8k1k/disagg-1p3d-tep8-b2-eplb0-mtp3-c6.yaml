schema: 2
name: ctx1_gen3_tep8_batch2_eplb0_mtp3_6

model:
  path: "dsr1-fp8"
  container: "dynamo-trtllm"
  precision: "fp8"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4

engine: trtllm
roles:
  prefill:
    nodes: 2
    workers: 1
    gpus: 8

    env:
      TLLM_LOG_LEVEL: "INFO"
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      TRTLLM_ENABLE_PDL: "1"
      ENROOT_ALLOW_DEV: "yes"
      NCCL_GRAPH_MIXING_SUPPORT: "0"

    args:
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 16384
      cuda_graph_config:
      disable_overlap_scheduler: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.4
      max_batch_size: 2
      max_num_tokens: 16384
      max_seq_len: 8232
      moe_config:
        backend: DEEPGEMM
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      print_iter_log: true
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 3
      tensor_parallel_size: 8


  decode:
    nodes: 6
    workers: 3
    gpus: 8

    env:
      TLLM_LOG_LEVEL: "INFO"
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      TRTLLM_ENABLE_PDL: "1"
      ENROOT_ALLOW_DEV: "yes"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      TRTLLM_FORCE_COMM_METHOD: "NVLINK_TWO_SIDED"
      ENABLE_CONFIGURABLE_MOE: "1"

    args:
      allreduce_strategy: MNNVL
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 16384
      cuda_graph_config:
        batch_sizes:
          - 1
          - 2
          - 4
        enable_padding: true
      enable_attention_dp: false
      enable_lm_head_tp_in_adp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
      max_batch_size: 2
      max_num_tokens: 8
      max_seq_len: 9256
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      num_postprocess_workers: 4
      pipeline_parallel_size: 1
      print_iter_log: true
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 3
      stream_interval: 100
      tensor_parallel_size: 8


benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: ['6']
  req_rate: "inf"

frontend:
  type: "dynamo"
  nginx_container: "nginx-sqsh"


health_check:
  max_attempts: 360
  interval_seconds: 10

dynamo:
  install: false
  # The unversioned container alias does not identify a Dynamo version or hash.
  # Use NATS for a recipe with an unverified Dynamo revision.
  request_plane: "nats"
services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: nats
    type: nats
    placement:
      node: dedicated
