schema: 2
name: "ctx8_gen1_dep32_batch16_eplb0_mtp3"

model:
  path: "dsr1"
  container: "dynamo-trtllm"
  precision: "fp4"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4

engine: trtllm
roles:
  prefill:
    nodes: 8
    workers: 8

    env:
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      TRTLLM_ENABLE_PDL: "1"

    args:
      max_batch_size: 2
      max_num_tokens: 16640
      max_seq_len: 8232
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config:
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.6
        dtype: fp8
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 3

  decode:
    nodes: 8

    workers: 1
    env:
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      TRTLLM_ENABLE_PDL: "1"

    args:
      tensor_parallel_size: 32
      moe_expert_parallel_size: 32
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: true
      pipeline_parallel_size: 1
      max_batch_size: 16
      max_num_tokens: 64
      max_seq_len: 9256
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
          - 1
          - 2
          - 4
          - 8
          - 16
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.75
        dtype: fp8
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 3

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "666"
  req_rate: "inf"

frontend:
  type: "dynamo"
  nginx_container: "nginx-sqsh"

dynamo:
  install: false
  # The unversioned container alias does not identify a Dynamo version or hash.
  # Use NATS for a recipe with an unverified Dynamo revision.
  request_plane: "nats"

services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: nats
    type: nats
    placement:
      node: dedicated
