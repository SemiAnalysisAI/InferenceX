# srt-slurm recipes for dsr1/trtllm/b200-fp4/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/dsr1/trtllm/b200-fp4/8k1k/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: dsr1
    container: dynamo-trtllm
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  engine: trtllm
  roles:
    prefill:
      gpus: 4
      env:
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        OMPI_MCA_coll_ucc_enable: '0'
        TLLM_ALL_RANK_LOG: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        UCX_CUDA_IPC_ENABLE_MNNVL: n
        UCX_RNDV_SCHEME: put_zcopy
      args:
        max_batch_size: 2
        max_num_tokens: 16896
        max_seq_len: 8232
        tensor_parallel_size: 4
        moe_expert_parallel_size: 4
        enable_attention_dp: true
        pipeline_parallel_size: 1
        print_iter_log: true
        cuda_graph_config: null
        disable_overlap_scheduler: true
        moe_config:
          backend: TRTLLM
        kv_cache_config:
          enable_block_reuse: false
          free_gpu_memory_fraction: 0.75
          dtype: fp8
        cache_transceiver_config:
          max_tokens_in_buffer: 8448
          backend: UCX
    decode:
      env:
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        OMPI_MCA_coll_ucc_enable: '0'
        TLLM_ALL_RANK_LOG: '1'
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        UCX_CUDA_IPC_ENABLE_MNNVL: n
        UCX_RNDV_SCHEME: put_zcopy
      args:
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        pipeline_parallel_size: 1
        max_seq_len: 9256
        cuda_graph_config:
          enable_padding: true
        print_iter_log: true
        kv_cache_config:
          enable_block_reuse: false
          dtype: fp8
        moe_config:
          use_low_precision_moe_combine: true
        cache_transceiver_config:
          max_tokens_in_buffer: 8448
          backend: UCX
        stream_interval: 100
        num_postprocess_workers: 4
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf
  frontend:
    nginx_container: nginx-sqsh
    type: dynamo
  dynamo:
    install: false
    # The unversioned container alias does not identify a Dynamo version or hash.
    # Use NATS for a recipe with an unverified Dynamo revision.
    request_plane: nats

override_disagg_1p1d_dep8_b8_eplb0_mtp3:
  name: ctx1_gen1_dep8_batch8_eplb0_mtp3
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
    decode:
      nodes: 1
      workers: 1
      args:
        enable_attention_dp: true
        enable_lm_head_tp_in_adp: true
        max_batch_size: 8
        max_num_tokens: 32
        cuda_graph_config:
          batch_sizes: [1, 2, 4, 5, 6, 7, 8]
        kv_cache_config:
          free_gpu_memory_fraction: 0.8
        moe_config:
          backend: CUTLASS
        speculative_config:
          decoding_type: MTP
          num_nextn_predict_layers: 3
  benchmark:
    concurrencies: '90'

