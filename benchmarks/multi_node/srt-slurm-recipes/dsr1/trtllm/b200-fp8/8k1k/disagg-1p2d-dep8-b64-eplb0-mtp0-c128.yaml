schema: 2
name: ctx1_gen2_dep8_batch64_eplb0_mtp0_128

model:
  path: "dsr1-fp8"
  container: "dynamo-trtllm"
  precision: "fp8"

resources:
  gpu_type: "b200"
  gpus_per_node: 8

engine: trtllm
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 8

    env:
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      OMPI_MCA_coll_ucc_enable: "0"
      TLLM_ALL_RANK_LOG: "1"
      TLLM_LOG_LEVEL: "INFO"
      TLLM_OVERRIDE_LAYER_NUM: "61"
      TRTLLM_ENABLE_PDL: "1"
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      UCX_CUDA_IPC_ENABLE_MNNVL: "n"
      UCX_RNDV_SCHEME: "put_zcopy"

    args:
      allreduce_strategy: AUTO
      cache_transceiver_config:
        backend: DEFAULT
        max_tokens_in_buffer: 8320
      cuda_graph_config:
        enable_padding: false
      disable_overlap_scheduler: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.2
      max_batch_size: 1
      max_num_tokens: 8320
      max_seq_len: 8320
      moe_config:
        backend: TRTLLM
      moe_expert_parallel_size: 1
      pipeline_parallel_size: 1
      print_iter_log: true
      tensor_parallel_size: 8


  decode:
    nodes: 2
    workers: 2
    gpus: 8

    env:
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      OMPI_MCA_coll_ucc_enable: "0"
      TLLM_ALL_RANK_LOG: "1"
      TLLM_LOG_LEVEL: "INFO"
      TLLM_OVERRIDE_LAYER_NUM: "61"
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      UCX_CUDA_IPC_ENABLE_MNNVL: "n"
      UCX_RNDV_SCHEME: "put_zcopy"

    args:
      allreduce_strategy: AUTO
      cache_transceiver_config:
        backend: DEFAULT
        max_tokens_in_buffer: 8320
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 64
      disable_overlap_scheduler: false
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
      max_batch_size: 64
      max_num_tokens: 512
      max_seq_len: 9344
      moe_config:
        backend: TRTLLM
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      print_iter_log: true
      stream_interval: 20
      tensor_parallel_size: 8


benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: [128]
  req_rate: "inf"

frontend:
  type: "dynamo"

  enable_multiple_frontends: false


health_check:
  max_attempts: 360
  interval_seconds: 10

dynamo:
  # The unversioned container alias does not identify a Dynamo version or hash.
  # Use NATS for a recipe with an unverified Dynamo revision.
  request_plane: "nats"
  install: false
