name: "dsv4-b200-vllm-router-disagg-1p1d-dep8-mtp-agentic"

model:
  path: "deepseek-v4-pro"
  container: "vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-904e4ec"
  precision: "fp4"

setup_script: native-vllm-router-deps.sh

slurm:
  time_limit: "4:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "b200"
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 8
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 8

infra:
  etcd_nats_dedicated_node: false

frontend:
  type: vllm-router
  enable_multiple_frontends: false

backend:
  type: vllm
  connector: null
  dp_launch_mode: per_node
  prefill_environment: &vllm_environment
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_LOG_STATS_INTERVAL: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    # Match the known-green B200 DSV4 DEP communicator path. NCCL symmetric
    # memory fails while registering its local DP/EP communication window.
    VLLM_USE_NCCL_SYMM_MEM: "0"
    TORCH_SYMMMEM: "NVSHMEM"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "1024"
    VLLM_MAX_TOKENS_PER_EXPERT_FP4_MOE: "2048"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_TLS: "cuda_copy,rc"
    NCCL_P2P_LEVEL: "NVL"
  decode_environment: *vllm_environment
  vllm_config:
    prefill: &vllm_config
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 8
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      enable-ep-weight-filter: true
      attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
      max-model-len: 1048576
      max-num-seqs: 128
      max-num-batched-tokens: 8192
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      block-size: 256
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
      max-cudagraph-capture-size: 128
      speculative-config: '{"method":"mtp","num_speculative_tokens":3,"rejection_sample_method":"synthetic","synthetic_acceptance_length":2.99}'
      gpu-memory-utilization: 0.90
      stream-interval: 10
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: "deepseek_v4"
    decode: *vllm_config

sbatch_directives:
  cpus-per-task: "144"
  mem: "0"

srun_options:
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
