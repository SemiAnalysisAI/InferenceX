schema: 2
name: "minimax-m3-vllm-disagg-b300-4p2d-fp4-dep2-tep4-8k1k"

model:
  path: "nvidia/MiniMax-M3-NVFP4"
  container: "vllm/vllm-openai:vllm-minimax-m3-perf-x86_64-13.0.1-8b00f41"
  precision: "fp4"

resources:
  gpu_type: "b300"
  gpus_per_node: 8
dynamo:
  install: true
  source:
    pypi: 1.3.0.dev20260614

frontend:
  type: dynamo
  enable_multiple_frontends: false

engine:
  type: vllm
  connector:

roles:
  prefill:
    nodes: 1
    workers: 4
    gpus: 2
    env:
      VLLM_FLOAT32_MATMUL_PRECISION: high
      UCX_TLS: "cuda_copy,rc"

    args:
      no-enable-flashinfer-autotune: true
      tensor-parallel-size: 1
      data-parallel-size: 2
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      trust-remote-code: true
      no-enable-prefix-caching: true
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      attention-config: '{"backend": "FLASHINFER", "use_trtllm_attention": true, "indexer_kv_dtype": "fp8"}'
      kv-cache-dtype: fp8
      block-size: 128
      gpu-memory-utilization: 0.90
      max-model-len: 9472
      language-model-only: true
      stream-interval: 32
      max-cudagraph-capture-size: 2048
      max-num-batched-tokens: 16384

  decode:
    nodes: 1
    workers: 2
    gpus: 4

    env:
      VLLM_FLOAT32_MATMUL_PRECISION: high
      UCX_TLS: "cuda_copy,rc"

    args:
      no-enable-flashinfer-autotune: true
      tensor-parallel-size: 4
      enable-expert-parallel: true
      trust-remote-code: true
      no-enable-prefix-caching: true
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      attention-config: '{"backend": "FLASHINFER", "use_trtllm_attention": true, "indexer_kv_dtype": "fp8"}'
      kv-cache-dtype: fp8
      block-size: 128
      gpu-memory-utilization: 0.90
      max-model-len: 9472
      language-model-only: true
      stream-interval: 32
      max-num-seqs: 1024
      max-num-batched-tokens: 16384
      max-cudagraph-capture-size: 4096

health_check:
  max_attempts: 360
  interval_seconds: 10

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "4096"
  req_rate: "inf"
