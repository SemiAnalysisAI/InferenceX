# Kimi-K3 B300 disaggregated, agentic coding.
#
# Translated from the bia sweep config that measured this point:
#   DISAGG/kimi-k3-mxfp4-b300-disagg-1p1d-dcp8-dcp8-agentx-062126-c48-weigb300-ns4-gmu94.yml
# Engine flags, environment, Mooncake settings and vllm_config are that file
# verbatim. The InferenceX plumbing -- identity, benchmark, slurm, the idle-GPU
# reaper comment -- is taken from disagg-gb300-1p1d-dcp8-dcp8-dspark4-mooncake-agentic.yaml.
#
# Only these fields differ from the measured config, each because b300-nv is
# not bia:
#   device_name, UCX_NET_DEVICES -> the six rails read off this cluster
#   MC_GID_INDEX, UCX_TLS        -> set; b300-nv is RoCE (see below)
#   HF_HOME                      -> dropped; benchmark.env sets HF_HUB_CACHE
#   slurm.time_limit             -> 06:00:00 (see the note in the tool)
#   rejection_sample_method      -> block, so the eval verifies (see below)
#   global_segment_size          -> 281GB, matching the B300 arm on main
#   sbatch_directives.exclude    -> b300-018, which times out UCX/NIXL
#
# The rails are the part that needs saying. This fabric is rail-isolated: each
# rail is its own /24 and a QP only comes up when both ends sit on the same
# one. srtslurm writes a single store config for the whole job, so rails can
# only be named by index -- and the index is not stable here, because a down
# card shifts every index above it. Across the nodes inventoried, mlx5_0 is
# 172.16.192 everywhere except b300-012, and b300-003 swaps mlx5_3 with
# mlx5_9. Naming either put two nodes on different subnets under one name,
# which killed one earlier bring-up 36 minutes in. The six named below held on
# every node with a full inventory, and kimik3-b300-nic-topology.sh re-checks
# each one's GID subnet at startup so an uninventoried node fails in seconds
# instead of running to a bad number.

name: kimi-k3-vllm-disagg-b300-1p1d-dcp8-dcp8-dspark4-mooncake-c48-agentic
model:
  path: moonshotai/Kimi-K3
  container: vllm/vllm-openai:nightly-dev-x86_64-cu13-3696c77
  precision: fp4
dynamo:
  hash: ba83080ecd31c1ce918559e576d3c5bc9e092ff1
  install: true
slurm:
  time_limit: 06:00:00
health_check:
  max_attempts: 720
  interval_seconds: 10
resources:
  gpu_type: b300
  gpus_per_node: 8
  prefill_nodes: 1
  decode_nodes: 1
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 8
  gpus_per_decode: 8
infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32
frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: least-loaded
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
    DYN_TOKENIZER_CACHE_BYTES: '8589934592'
backend:
  type: vllm
  connector: null
  dp_launch_mode: per_node
  kv_events_config:
    prefill: true
  mooncake_kv_store:
    master_extra_args:
    - --default_kv_lease_ttl=60000
    - --eviction_high_watermark_ratio=0.95
    - --eviction_ratio=0.10
    store_config:
      metadata_server: P2PHANDSHAKE
      global_segment_size: 281GB
      local_buffer_size: 4GB
      protocol: rdma
      device_name: mlx5_4,mlx5_8,mlx5_10,mlx5_16,mlx5_20,mlx5_22
      mode: embedded
      enable_offload: false
  prefill_environment:
    VLLM_USE_DIRECT_DCP_A2A: '1'
    VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
    VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
    VLLM_ALLREDUCE_USE_FLASHINFER: '1'
    VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: '0'
    DYN_REQUEST_PLANE: tcp
    ETCD_LEASE_TTL: '600'
    VLLM_ENGINE_READY_TIMEOUT_S: '3600'
    VLLM_RPC_TIMEOUT: '600000'
    TILELANG_CLEANUP_TEMP_FILES: '1'
    VLLM_USE_NCCL_SYMM_MEM: '0'
    NCCL_CUMEM_ENABLE: '1'
    NCCL_MNNVL_ENABLE: '0'
    NCCL_NVLS_ENABLE: '1'
    VLLM_SERVER_DEV_MODE: '1'
    VLLM_USE_V2_MODEL_RUNNER: '1'
    VLLM_USE_RUST_FRONTEND: '1'
    VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
    MC_SLICE_SIZE: '1048576'
    VLLM_CONNECTOR_PREFETCH_DEPTH: '8'
    VLLM_CONNECTOR_PREFETCH_KV_CAP: '0.65'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
    NCCL_P2P_LEVEL: NVL
    MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
    WITH_NVIDIA_PEERMEM: '0'
    NCCL_NET_PLUGIN: none
    UCX_MEMTYPE_CACHE: n
    UCX_MEMTYPE_REG_WHOLE: n
    UCX_RCACHE_MAX_UNRELEASED: '1024'
    UCX_TCP_AF_PRIO: inet
    VLLM_SSM_CONV_STATE_LAYOUT: DS
    UCX_NET_DEVICES: mlx5_4:1,mlx5_8:1,mlx5_10:1,mlx5_16:1,mlx5_20:1,mlx5_22:1
    DG_JIT_CACHE_DIR: /tmp/dg-cache-kimi-k3-gb300-pd-dspark-mooncake-{job_id}
    PYTHONHASHSEED: '42'
    PYTHONNOUSERSITE: '1'
    PYTHONUNBUFFERED: '1'
    TORCH_CUDA_ARCH_LIST: '10.0'
    MC_STORE_CLIENT_METRIC: '1'
    MC_STORE_CLIENT_METRIC_INTERVAL: '5'
    MC_TE_METRIC: '0'
    MC_GID_INDEX: '3'
    UCX_TLS: rc,cuda_copy,cuda_ipc,sm,self
  decode_environment:
    VLLM_USE_DIRECT_DCP_A2A: '1'
    VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
    VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
    VLLM_ALLREDUCE_USE_FLASHINFER: '1'
    VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: '0'
    DYN_REQUEST_PLANE: tcp
    ETCD_LEASE_TTL: '600'
    VLLM_ENGINE_READY_TIMEOUT_S: '3600'
    VLLM_RPC_TIMEOUT: '600000'
    TILELANG_CLEANUP_TEMP_FILES: '1'
    VLLM_USE_NCCL_SYMM_MEM: '0'
    NCCL_CUMEM_ENABLE: '1'
    NCCL_MNNVL_ENABLE: '0'
    NCCL_NVLS_ENABLE: '1'
    VLLM_SERVER_DEV_MODE: '1'
    VLLM_USE_V2_MODEL_RUNNER: '1'
    VLLM_USE_RUST_FRONTEND: '1'
    VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
    MC_SLICE_SIZE: '1048576'
    VLLM_CONNECTOR_PREFETCH_DEPTH: '8'
    VLLM_CONNECTOR_PREFETCH_KV_CAP: '0.65'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
    NCCL_P2P_LEVEL: NVL
    MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
    WITH_NVIDIA_PEERMEM: '0'
    NCCL_NET_PLUGIN: none
    UCX_MEMTYPE_CACHE: n
    UCX_MEMTYPE_REG_WHOLE: n
    UCX_RCACHE_MAX_UNRELEASED: '1024'
    UCX_TCP_AF_PRIO: inet
    VLLM_SSM_CONV_STATE_LAYOUT: DS
    DG_JIT_CACHE_DIR: /tmp/dg-cache-kimi-k3-gb300-pd-dspark-mooncake-{job_id}
    PYTHONHASHSEED: '42'
    PYTHONNOUSERSITE: '1'
    PYTHONUNBUFFERED: '1'
    TORCH_CUDA_ARCH_LIST: '10.0'
    MC_STORE_CLIENT_METRIC: '1'
    MC_STORE_CLIENT_METRIC_INTERVAL: '5'
    MC_TE_METRIC: '0'
    MC_GID_INDEX: '3'
    UCX_TLS: rc,cuda_copy,cuda_ipc,sm,self
  vllm_config:
    prefill:
      no-enable-flashinfer-autotune: true
      enable-logging-iteration-details: true
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: moonshotai/Kimi-K3
      prefix-match-unit: 128
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      gpu-memory-utilization: 0.94
      tensor-parallel-size: 8
      decode-context-parallel-size: 8
      dcp-comm-backend: a2a
      enable-cumem-allocator: true
      trust-remote-code: true
      max-cudagraph-capture-size: 512
      stream-interval: 10
      language-model-only: true
      attention-backend: TOKENSPEED_MLA
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"rejection_sample_method":"block"}'
      enable-prefix-caching: true
    decode:
      no-enable-flashinfer-autotune: true
      enable-logging-iteration-details: true
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: moonshotai/Kimi-K3
      prefix-match-unit: 128
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      gpu-memory-utilization: 0.94
      tensor-parallel-size: 8
      decode-context-parallel-size: 8
      dcp-comm-backend: a2a
      enable-cumem-allocator: true
      trust-remote-code: true
      max-cudagraph-capture-size: 512
      stream-interval: 10
      language-model-only: true
      attention-backend: TOKENSPEED_MLA
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"rejection_sample_method":"block"}'
      enable-prefix-caching: true
sbatch_directives:
  cpus-per-task: '72'
  mem: '0'
  comment: '''{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very large model will take extra loading time."}}'''
  exclude: b300-018
srun_options:
  mem: '0'
  container-remap-root: ''
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: '8000'
    IS_MULTINODE: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '14400'
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
identity:
  model:
    repo: moonshotai/Kimi-K3
  container:
    image: vllm/vllm-openai:nightly-dev-x86_64-cu13-3696c77
  frameworks:
    dynamo: ba83080ecd31c1ce918559e576d3c5bc9e092ff1
