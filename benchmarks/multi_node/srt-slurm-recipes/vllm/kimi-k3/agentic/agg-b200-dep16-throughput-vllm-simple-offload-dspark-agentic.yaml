name: "kimik3-vllm-agg-b200-dep16-simple-offload-dspark-agentic"

# Official multi_node_dep profile with SimpleCPUOffloadConnector. Each of the
# 16 DP ranks reserves the official 220 GiB host-KV pool. Eight ranks consume
# 1.72 TiB on each B200 node, below the runner's configured host-DRAM budget.
# https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=b200&nodes=2&strategy=multi_node_dep
model:
  path: "kimik3"
  container: "vllm/vllm-openai:kimi-k3"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:kimi-k3"
  frameworks:
    dynamo: "1.3.0"

dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true

setup_script: kimik3-dspark-config-compat.sh

environment:
  ETCD_LEASE_TTL: "7200"

slurm:
  time_limit: "8:00:00"

health_check:
  interval_seconds: 10
  max_attempts: 720

resources:
  gpu_type: "b200"
  gpus_per_node: 8
  agg_nodes: 2
  agg_workers: 1
  gpus_per_agg: 16

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    dyn-chat-processor: "dynamo"
    router-mode: "kv"
    router-kv-events: true
    router-temperature: "0"
    router-min-initial-workers: 2
    kv-cache-block-size: 64

backend:
  type: vllm
  connector: null
  dp_launch_mode: per_node
  aggregated_environment:
    VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_LOG_STATS_INTERVAL: "1"
    NCCL_CUMEM_ENABLE: "1"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_10:1,mlx5_11:1"
    HF_HUB_CACHE: "/hf_hub_cache"
    HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
  vllm_config:
    aggregated:
      served-model-name: "moonshotai/Kimi-K3"
      data-parallel-size: 16
      enable-expert-parallel: true
      trust-remote-code: true
      load-format: fastsafetensors
      moe-backend: deep_gemm_mega_moe
      all2all-backend: deepep_v2
      gpu-memory-utilization: 0.90
      no-enable-flashinfer-autotune: true
      max-model-len: 1048576
      kv-cache-dtype: fp8
      attention-config: '{"use_prefill_query_quantization":true,"mla_prefill_backend":"TRTLLM_RAGGED"}'
      enable-prefix-caching: true
      enable-auto-tool-choice: true
      dyn-tool-call-parser: kimi_k3
      reasoning-parser: kimi_k3
      dyn-reasoning-parser: kimi_k3
      language-model-only: true
      block-size: 64
      max-num-seqs: 32
      max-num-batched-tokens: 8192
      speculative-config: '{"model":"/tmp/Kimi-K3-DSpark","num_speculative_tokens":7,"method":"dspark","attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.84}'
      kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":236223201280,"lazy_offload":false}}'

sbatch_directives:
  cpus-per-task: "144"
  mem: "0"

srun_options:
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    AIPERF_TRACE_IDLE_GAP_CAP_SECONDS: "300"
    AIPERF_LIVE_FAILED_REQUEST_THRESHOLD: "0.25"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    AGENTIC_WARMUP_GRACE_PERIOD: "3600"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
