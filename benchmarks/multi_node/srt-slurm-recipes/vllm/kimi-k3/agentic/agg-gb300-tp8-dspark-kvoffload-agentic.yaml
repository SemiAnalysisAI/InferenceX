# Kimi-K3 GB300 AgentX aggregate with native CPU KV offload: one TP8 worker spans
# two four-GPU nodes and serves both prefill and decode, with the in-process
# SimpleCPUOffloadConnector holding evicted KV blocks in host DRAM. Mirrors the
# baseline agg recipe (agg-gb300-tp8-agentic.yaml) plus the native-offload wiring.
name: "kimi-vllm-agg-gb300-tp8-dspark-kvoffload-agentic"

model:
  # Alias resolved to the checkpoint path via the launcher-generated models.yaml
  # (SRT_SLURM_MODEL_PREFIX=kimi-k3 -> MODEL_PATH=/scratch/models/Kimi-K3).
  path: "kimi-k3"
  container: "vllm/vllm-openai:kimi-k3"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:kimi-k3"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

# Kimi-K3 support landed in dynamo commit ba83080 (dynamo-tokenizers 1.5.3,
# kimi_k3 tokenizer + chat processor), which predates a tagged release, so pin
# the commit and build from source.
dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true

setup_script: "vllm-container-deps.sh"

slurm:
  partition: "batch"
  time_limit: "04:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  agg_nodes: 2
  agg_workers: 1
  gpus_per_agg: 8

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "random"
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: vllm
  connector: null
  aggregated_environment:
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "120"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    # Disabled: the container's CUDA-graph capture path enters vLLM's
    # nccl_symm_mem_context without set_graph_pool_id, so capture asserts
    # "graph_pool_id is not set under graph capture". Off -> symm-mem context is
    # a no-op and capture proceeds. (Fixed in newer vLLM cuda_graph.py.)
    VLLM_USE_NCCL_SYMM_MEM: "0"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    TORCH_SYMMMEM: "NVSHMEM"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    # Use the simple in-process CPU KV-offload connector (SimpleCPUOffloadConnector)
    # instead of the full OffloadingConnector.
    VLLM_USE_SIMPLE_KV_OFFLOAD: "1"
    VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
    VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "1024"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_RCACHE_MAX_UNRELEASED: "1024"
    UCX_TLS: "cuda_copy,cuda_ipc,tcp"
    NCCL_P2P_LEVEL: NVL

  vllm_config:
    aggregated:
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      # Native CPU KV offload. kv-offloading-size is the TOTAL across all TP ranks
      # (docstring), so 120 GiB/GPU * 8 GPUs = 960. vLLM auto-sets the connector to
      # SimpleCPUOffloadConnector (VLLM_USE_SIMPLE_KV_OFFLOAD=1) and injects
      # cpu_bytes_to_use. Recompute KV on a failed offload load rather than
      # failing the request (no lazy_offload -> synchronous offload).
      kv-transfer-config: '{"kv_load_failure_policy":"recompute"}'
      kv-offloading-backend: native
      kv-offloading-size: 960
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-cumem-allocator: true
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
      max-cudagraph-capture-size: 128
      stream-interval: 10
      language-model-only: true
      attention-backend: "FLASHINFER_MLA"
      attention-config: '{"mla_prefill_backend": "FLASHINFER", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"FLASHINFER_MLA","method":"dspark","num_speculative_tokens":7,"rejection_sample_method":"synthetic","synthetic_acceptance_length":3.78}'
      max-num-seqs: 64
      enable-prefix-caching: true
      gpu-memory-utilization: 0.95

sbatch_directives:
  mem: "0"
  cpus-per-task: "72"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    AGENTIC_OUTPUT_DIR: /logs/agentic
    PORT: "8000"
    IS_MULTINODE: "false"
    TP: "8"
    EP_SIZE: "1"
    DP_ATTENTION: "false"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    MODEL: "moonshotai/Kimi-K3"
    MODEL_PATH: "/model"
    MODEL_PREFIX: "kimi-k3"
    FRAMEWORK: "dynamo-vllm"
    PRECISION: "fp4"
    CONC: "16"
    DURATION: "1800"
    RESULT_FILENAME: "kimi-k3_fp4_dynamo-vllm_aggtp8_dspark_kvoffload_c16"
    KV_OFFLOADING: "dram"
    KV_OFFLOAD_BACKEND: "native"
    KV_OFFLOAD_BACKEND_METADATA: '{"name": "native"}'
    TOTAL_CPU_DRAM_GB: "960"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
