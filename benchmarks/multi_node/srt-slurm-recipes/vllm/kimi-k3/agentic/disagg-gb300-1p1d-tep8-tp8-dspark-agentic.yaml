name: "kimi-k3-vllm-disagg-gb300-1p1d-tep8-tp8-dspark-agentic"

# DSpark counterpart to disagg-gb300-1p1d-tep8-tp8-agentic.yaml. Parallelism,
# memory policy, routing, and P/D transfer settings are identical so the
# speculative-decoding delta is directly comparable.
model:
  path: "kimi-k3"
  container: "vllm/vllm-openai:nightly-124154a8843d1f8e4d4e2d5d466e2d3ebc3716da"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:nightly-124154a8843d1f8e4d4e2d5d466e2d3ebc3716da"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true

setup_script: "vllm-container-deps.sh"

slurm:
  time_limit: "8:00:00"

health_check:
  max_attempts: 2160
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  het_jobs: false
  spread_workers: false
  prefill_nodes: 2
  decode_nodes: 2
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 8
  gpus_per_decode: 8

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "random"
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: vllm
  connector: null
  kv_events_config:
    prefill: true
  prefill_environment: &kimi_environment
    HF_HUB_CACHE: "/hf_hub_cache"
    HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
    TRANSFORMERS_CACHE: "/hf_hub_cache"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "600"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"
    # Kimi-K3's three-read KDA conv transfer requires DS layout. This pinned
    # nightly contains vLLM #49291, which adds DS align-state copies for
    # speculative prefix caching; the layout must match on P and D for NIXL.
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "0"
    NCCL_P2P_LEVEL: "NVL"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
    UCX_TLS: "rc,cuda_copy"
    DG_JIT_CACHE_DIR: "/tmp/dg-cache-kimi-k3-gb300-pd-dspark-{job_id}"
  decode_environment:
    <<: *kimi_environment

  vllm_config:
    prefill:
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-expert-parallel: true
      enable-cumem-allocator: true
      trust-remote-code: true
      language-model-only: true
      gpu-memory-utilization: 0.95
      moe-backend: "auto"
      # vLLM's NIXL P/D speculative-decode path loads the draft on prefill so
      # both workers register the same hybrid KDA/MLA cache topology. Prefix
      # reuse lives on prefill; the pinned nightly supports DS align-mode state
      # copies with speculative decoding.
      enable-prefix-caching: true
      max-model-len: 1048576
      max-num-batched-tokens: 16384
      no-disable-hybrid-kv-cache-manager: true
      no-enable-flashinfer-autotune: true
      enforce-eager: true
      stream-interval: 10
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
      # Prefill never drafts output tokens. K=1 is the minimal topology-only
      # config used by vLLM's NIXL P/D speculative-decoding integration test;
      # the measured decode worker below retains K=2 and synthetic AL 2.51.
      speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":1,"attention_backend":"FLASHINFER_MLA"}'
    decode:
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-cumem-allocator: true
      trust-remote-code: true
      language-model-only: true
      gpu-memory-utilization: 0.95
      moe-backend: "auto"
      # Match the upstream P/D recipe: decode receives external KV and does
      # not perform its own prefix lookup.
      no-enable-prefix-caching: true
      max-model-len: 1048576
      max-num-seqs: 32
      no-disable-hybrid-kv-cache-manager: true
      no-enable-flashinfer-autotune: true
      # With K=2, each sequence captures three target positions. Enumerating
      # 3..96 preserves one graph per decode batch up to max-num-seqs=32;
      # PR #2380 documents why an unscaled 1..32 ladder only covers 10 seqs.
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57,60,63,66,69,72,75,78,81,84,87,90,93,96]}'
      stream-interval: 10
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
      # PR #2380's fair AgentX policy: K=2, probabilistic drafting, and the
      # committed golden acceptance length 2.51 from the matching block-
      # verification SPEED-Bench curve. Synthetic acceptance controls draft
      # quality while retaining the real draft-model and verification costs.
      # P/D prefill loads the same draft topology at K=1 but does not draft
      # output tokens; this K=2 config is the measured decode policy.
      speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":2,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.51}'

sbatch_directives:
  cpus-per-task: "72"
  mem: "0"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
    # Inherit RESULT_FILENAME and leave AGENTIC_OUTPUT_DIR unset so the final
    # JSON is staged directly in /infmax-workspace for the workflow check.
