name: "kimi-k3-vllm-agg-gb200-dep16-throughput-agentic"

# Day-0 GB200 translation of the official throughput-oriented multi_node_dep
# profile. TP2 x DP8 gives EP16 across four four-GPU GB200 nodes. TP2 shards
# the dense weights so each DP rank has room for K3's default BF16 KV cache.
# https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb200&nodes=4&strategy=multi_node_dep

model:
  path: "kimi-k3"
  container: "vllm/vllm-openai:kimi-k3"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:kimi-k3"
  frameworks:
    dynamo: "1.3.0.dev20260618"

dynamo:
  install: true
  wheel: "1.3.0.dev20260618"

environment:
  DYNAMO_WHEEL_DIRS: "/srtctl-wheels"
  ETCD_LEASE_TTL: "7200"

setup_script: vllm-container-deps.sh

slurm:
  time_limit: "8:00:00"

health_check:
  max_attempts: 2160
  interval_seconds: 10

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  agg_nodes: 4
  agg_workers: 1
  gpus_per_agg: 16

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"
    router-reset-states: true

backend:
  type: vllm
  connector: null
  aggregated_environment:
    HF_HUB_CACHE: "/hf_hub_cache"
    HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
    TRANSFORMERS_CACHE: "/hf_hub_cache"
    VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_LOG_STATS_INTERVAL: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    UCX_MEMTYPE_CACHE: "n"
    UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
    UCX_TLS: "rc,cuda_copy"
    NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
    NCCL_P2P_LEVEL: "NVL"
    DG_JIT_CACHE_DIR: "/tmp/dg-cache-kimi-k3-gb200-dep16-{job_id}"
  vllm_config:
    aggregated:
      served-model-name: "moonshotai/Kimi-K3"
      tensor-parallel-size: 2
      pipeline-parallel-size: 1
      data-parallel-size: 8
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      trust-remote-code: true
      load-format: "fastsafetensors"
      moe-backend: "deep_gemm_mega_moe"
      all2all-backend: "flashinfer_nvlink_one_sided"
      gpu-memory-utilization: 0.95
      max-num-seqs: 128
      max-num-batched-tokens: 16384
      language-model-only: true
      no-enable-flashinfer-autotune: true

sbatch_directives:
  cpus-per-task: "144"
  mem: "0"

srun_options:
  container-remap-root: ""

benchmark:
  type: custom
  aiperf_server_metrics: true
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
