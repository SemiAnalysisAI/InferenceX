# Kimi-K3 GB300 AgentX disaggregated: TP8 prefill + TP8 decode, NO mooncake.
# P->D KV transfer over NixlConnector only. Mirrors the TP8 agg recipe for
# parallelism (pure tensor-parallel 8, no DEP); disagg-specific bits are the
# per-role kv-transfer-config and VLLM_SSM_CONV_STATE_LAYOUT=DS (required to
# transfer the GatedDeltaNet/Mamba conv state P->D). Each role is TP8 = 8 GPUs
# = 2 nodes (4 GPUs/node), 4 nodes total.
name: "kimi-vllm-disagg-gb300-tp8-tp8-agentic"

model:
  # Alias resolved to the checkpoint path via the launcher-generated models.yaml
  # (SRT_SLURM_MODEL_PREFIX=kimi-k3 -> MODEL_PATH=/scratch/models/Kimi-K3).
  path: "kimi-k3"
  container: "vllm/vllm-openai:kimi-k3"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:kimi-k3"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

# Kimi-K3 support landed in dynamo commit ba83080 (dynamo-tokenizers 1.5.3,
# kimi_k3 tokenizer + chat processor), which predates a tagged release, so pin
# the commit and build from source.
dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true

setup_script: "vllm-container-deps.sh"

slurm:
  partition: "batch"
  time_limit: "04:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  prefill_nodes: 2
  decode_nodes: 2
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 8
  gpus_per_decode: 8

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "random"
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: vllm
  connector: null
  kv_events_config:
    prefill: true
  # Same env as the TP8 agg recipe + the disagg-only Mamba conv-state layout.
  prefill_environment: &kimi_env
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    DYN_REQUEST_PLANE: "tcp"
    # Disagg-only: lay out the Mamba/GDN conv state in DeepSeek (DS) format so it
    # can be transferred prefill->decode. Without it the prefill worker fails
    # "3-read Mamba conv transfer requires DS conv state layout".
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    ETCD_LEASE_TTL: "600"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"
    TORCH_SYMMMEM: "NVSHMEM"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
    VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
    DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-agentx"
    VLLM_DSV4_MEGA_FP8_COMBINE: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "1024"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_RCACHE_MAX_UNRELEASED: "1024"
    UCX_TCP_AF_PRIO: "inet"
    NCCL_P2P_LEVEL: NVL
  decode_environment:
    <<: *kimi_env

  vllm_config:
    prefill:
      # No mooncake: single NixlConnector for the P->D KV handshake/transfer.
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-cumem-allocator: true
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      enforce-eager: true
      stream-interval: 10
      max-num-seqs: 64
      language-model-only: true
      attention-backend: "FLASHINFER_MLA"
      attention-config: '{"mla_prefill_backend": "FLASHINFER", "use_prefill_query_quantization": true}'
    decode:
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-cumem-allocator: true
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
      max-cudagraph-capture-size: 128
      stream-interval: 10
      max-num-seqs: 64
      language-model-only: true
      attention-backend: "FLASHINFER_MLA"
      attention-config: '{"mla_prefill_backend": "FLASHINFER", "use_prefill_query_quantization": true}'

sbatch_directives:
  mem: "0"
  cpus-per-task: "72"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    AGENTIC_OUTPUT_DIR: /logs/agentic
    PORT: "8000"
    IS_MULTINODE: "true"
    DISAGG: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    MODEL: "moonshotai/Kimi-K3"
    MODEL_PATH: "/model"
    MODEL_PREFIX: "kimi-k3"
    FRAMEWORK: "dynamo-vllm"
    PRECISION: "fp4"
    CONC: "16"
    DURATION: "1800"
    RESULT_FILENAME: "kimi-k3_fp4_dynamo-vllm_ptp8_dtp8_c16"
    # Per-role topology: GPUs = prefill_tp*workers + decode_tp*workers = 8 + 8 = 16.
    PREFILL_NUM_WORKERS: "1"
    PREFILL_TP: "8"
    PREFILL_EP: "1"
    PREFILL_DP_ATTENTION: "false"
    DECODE_NUM_WORKERS: "1"
    DECODE_TP: "8"
    DECODE_EP: "1"
    DECODE_DP_ATTENTION: "false"
    KV_OFFLOADING: "none"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
