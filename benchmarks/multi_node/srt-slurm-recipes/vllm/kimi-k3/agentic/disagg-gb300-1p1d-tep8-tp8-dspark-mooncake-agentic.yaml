name: "kimi-k3-vllm-disagg-gb300-1p1d-tep8-tp8-dspark-mooncake-agentic"

# Mooncake-offload counterpart to the passing Kimi-K3 GB300 DSpark profile.
# It follows the current recipes.vllm.ai nodes=4 / pd_cluster / decode_mode=tp /
# kv_store_distributed_mooncake profile: NIXL remains the direct P/D path and
# Mooncake adds a distributed embedded host-DRAM cache through MultiConnector.
model:
  path: "kimi-k3"
  container: "vllm/vllm-openai:kimi-k3"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:kimi-k3"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true

# Preserve the current Kimi image and apply the same V2 DS prefix-cache/NIXL
# patches as the no-offload arm, then install Mooncake's CUDA 13 worker runtime.
setup_script: "kimi-k3-v2-ds-prefix-cache-mooncake.sh"

slurm:
  time_limit: "8:00:00"

health_check:
  max_attempts: 2160
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  het_jobs: false
  spread_workers: false
  prefill_nodes: 2
  decode_nodes: 2
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 8
  gpus_per_decode: 8

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

environment:
  # Prefix block hashes must agree across every Mooncake client.
  PYTHONHASHSEED: "0"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "random"
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: vllm
  connector: null
  kv_events_config:
    prefill: true
  mooncake_kv_store:
    # srt-slurm launches the master before worker setup, so its container must
    # carry the CUDA 13-linked binary independently of the Kimi worker image.
    container: "kvcacheai/mooncake:0.3.12.post1-cuda13"
    store_config:
      metadata_server: "P2PHANDSHAKE"
      # Per GPU: four segments reserve 400 GB on each 4-GPU GB300 tray.
      global_segment_size: "100GB"
      local_buffer_size: "4GB"
      protocol: "rdma"
      device_name: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
      mode: "embedded"
      # Embedded mode is already the host-DRAM cache tier.
      enable_offload: false
  prefill_environment: &kimi_mooncake_environment
    HF_HUB_CACHE: "/hf_hub_cache"
    HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
    TRANSFORMERS_CACHE: "/hf_hub_cache"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "600"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"
    # Kimi-K3's three-read KDA conv transfer requires DS layout on both roles.
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "0"
    NCCL_P2P_LEVEL: "NVL"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
    UCX_TLS: "rc,cuda_copy"
    MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    MC_STORE_CLIENT_METRIC: "1"
    MC_STORE_CLIENT_METRIC_INTERVAL: "5"
    MC_TE_METRIC: "0"
    DG_JIT_CACHE_DIR: "/tmp/dg-cache-kimi-k3-gb300-pd-dspark-mooncake-{job_id}"
  decode_environment:
    <<: *kimi_mooncake_environment

  vllm_config:
    prefill:
      # Dynamo workers register as kv_both. NIXL carries the live P/D state;
      # Mooncake performs asynchronous distributed prefix lookup and storage.
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-expert-parallel: true
      enable-cumem-allocator: true
      trust-remote-code: true
      language-model-only: true
      # Match the passing arm's runtime workspace headroom.
      gpu-memory-utilization: 0.90
      moe-backend: "auto"
      enable-prefix-caching: true
      max-model-len: 1048576
      max-num-batched-tokens: 16384
      no-disable-hybrid-kv-cache-manager: true
      # MooncakeStoreConnector requires hybrid Mamba blocks to match the
      # attention cache block size before it can register Kimi's KDA state.
      mamba-cache-mode: "align"
      no-enable-flashinfer-autotune: true
      enforce-eager: true
      stream-interval: 10
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
      # Prefill loads the minimal matching draft/cache topology but never
      # drafts output tokens. Decode retains the measured K=2 policy below.
      speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":1,"attention_backend":"FLASHINFER_MLA"}'
    decode:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-cumem-allocator: true
      trust-remote-code: true
      language-model-only: true
      gpu-memory-utilization: 0.95
      moe-backend: "auto"
      # Decode receives external state and does not perform a local prefix lookup.
      no-enable-prefix-caching: true
      max-model-len: 1048576
      max-num-seqs: 32
      no-disable-hybrid-kv-cache-manager: true
      mamba-cache-mode: "align"
      no-enable-flashinfer-autotune: true
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57,60,63,66,69,72,75,78,81,84,87,90,93,96]}'
      stream-interval: 10
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
      # Fair AgentX policy from PR #2380.
      speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":2,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.51}'

sbatch_directives:
  cpus-per-task: "72"
  mem: "0"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
    # Inherit RESULT_FILENAME and stage aggregate JSON directly in workspace.
