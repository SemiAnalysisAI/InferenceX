name: "kimi-k3-vllm-disagg-gb300-1p1d-tep8-tp8-agentic"

# Kimi-K3 GB300 P/D profile aligned with the vLLM recipe generated by:
# https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb300&nodes=2&strategy=pd_cluster&decode_mode=tp
#
# The site's nodes=2 selection applies to each role because the estimated
# 1.68 TB checkpoint does not fit one 4xGB300 tray. One TEP8 prefill worker and
# one TP8 decode worker therefore consume two trays each (four trays / 16 GPUs
# total). Dynamo remains the orchestration layer here, so its session-aware
# router and kv_both NIXL contract replace the site's vllm-router and explicit
# producer/consumer roles; the engine parallelism and tuning match the site.
model:
  path: "kimi-k3"
  container: "vllm/vllm-openai:kimi-k3"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:kimi-k3"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

# Kimi-K3 tokenizer/chat-processor support landed after the latest tagged
# Dynamo release. This is the same commit that served the closed GB300 K3
# AgentX bring-up runs.
dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true

setup_script: "vllm-container-deps.sh"

slurm:
  time_limit: "8:00:00"

health_check:
  max_attempts: 2160
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  het_jobs: false
  spread_workers: false
  prefill_nodes: 2
  decode_nodes: 2
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 8
  gpus_per_decode: 8

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    # AgentX replays long multi-turn sessions. Preserve session affinity even
    # though the vLLM site's standalone router uses round-robin.
    router-mode: "random"
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: vllm
  connector: null
  kv_events_config:
    prefill: true
  prefill_environment: &kimi_environment
    HF_HUB_CACHE: "/hf_hub_cache"
    HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
    TRANSFORMERS_CACHE: "/hf_hub_cache"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "600"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "0"
    NCCL_P2P_LEVEL: "NVL"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
    UCX_TLS: "rc,cuda_copy"
    DG_JIT_CACHE_DIR: "/tmp/dg-cache-kimi-k3-gb300-pd-{job_id}"
  decode_environment:
    <<: *kimi_environment

  vllm_config:
    prefill:
      # Dynamo workers use kv_both for registration and routing. Keep the
      # official failure policy so a broken transfer fails instead of silently
      # recomputing on decode.
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-expert-parallel: true
      enable-cumem-allocator: true
      trust-remote-code: true
      language-model-only: true
      gpu-memory-utilization: 0.95
      moe-backend: "auto"
      enable-prefix-caching: true
      max-model-len: 1048576
      max-num-batched-tokens: 16384
      no-disable-hybrid-kv-cache-manager: true
      no-enable-flashinfer-autotune: true
      enforce-eager: true
      stream-interval: 10
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
    decode:
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      tokenizer-mode: "kimi_k3"
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      enable-cumem-allocator: true
      trust-remote-code: true
      language-model-only: true
      gpu-memory-utilization: 0.95
      moe-backend: "deep_gemm_mega_moe"
      no-enable-prefix-caching: true
      max-model-len: 1048576
      max-num-seqs: 32
      max-num-batched-tokens: 32
      no-disable-hybrid-kv-cache-manager: true
      no-enable-flashinfer-autotune: true
      data-parallel-hybrid-lb: true
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      stream-interval: 10
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'

sbatch_directives:
  cpus-per-task: "72"
  mem: "0"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
    # Deliberately do not set AGENTIC_OUTPUT_DIR or RESULT_FILENAME here.
    # The workflow values are inherited, and the aggregate is written directly
    # to /infmax-workspace. The closed GB300 branches overrode both values and
    # left successful aggregates under /logs, causing every Actions job to fail
    # its artifact check.
