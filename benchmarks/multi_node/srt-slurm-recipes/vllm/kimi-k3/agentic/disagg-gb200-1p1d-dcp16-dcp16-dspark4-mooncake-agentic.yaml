# GB200 translation of the Kimi-K3 DCP8 recipe validated in InferenceMAX.
# TP16/DCP16 spans four 4-GPU GB200 nodes per role. The 96 GB Mooncake
# segment, lazy safetensors loader, and explicit KV-cache budgets are the
# settings validated by the Lyris GB200 sweep.
name: "kimi-k3-vllm-disagg-gb200-1p1d-dcp16-dcp16-dspark4-mooncake-agentic"

model:
  # The GB200 launcher resolves this portable alias to the checkpoint staged
  # on every compute node.
  path: "kimi-k3"
  container: "vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-75c2eef"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
  container:
    image: "vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-75c2eef"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  prefill_nodes: 4
  decode_nodes: 4
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 16
  gpus_per_decode: 16
  het_jobs: false

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "random"
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: vllm
  connector: null
  dp_launch_mode: per_node
  kv_events_config:
    prefill: true
  mooncake_kv_store:
    store_config:
      metadata_server: "P2PHANDSHAKE"
      # 150 GB per local rank exceeds the GB200 node's host-memory budget.
      # Four 96 GB segments fit while retaining room for loaders and caches.
      global_segment_size: "96GB"
      local_buffer_size: "4GB"
      protocol: "rdma"
      device_name: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
      mode: "embedded"
      enable_offload: false
  prefill_environment: &kimi_env
    # Preserve the measured collective fallback with the rebuilt image.
    VLLM_USE_DIRECT_DCP_A2A: "0"
    VLLM_USE_DIRECT_DCP_Q_GATHER: "0"
    VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "600"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
    VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
    VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
    NCCL_P2P_LEVEL: "NVL"
    MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    WITH_NVIDIA_PEERMEM: "0"
    # Avoid loading NCCL's HPC-X UCX beside NIXL's UCX in one process.
    NCCL_NET_PLUGIN: "none"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_RCACHE_MAX_UNRELEASED: "1024"
    UCX_TCP_AF_PRIO: "inet"
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  decode_environment:
    <<: *kimi_env

  vllm_config:
    prefill:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "moonshotai/Kimi-K3"
      enable-prefix-caching: true
      prefix-match-unit: 128
      # fastsafetensors' GPU-staging path can transiently exhaust GB200 HBM.
      load-format: "safetensors"
      safetensors-load-strategy: "lazy"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 16
      decode-context-parallel-size: 16
      enable-cumem-allocator: true
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      max-cudagraph-capture-size: 512
      # Cap prefill scheduling below the available Mamba cache-block count.
      # The largest configured benchmark point is c48.
      max-num-seqs: 512
      stream-interval: 10
      max_num_batched_tokens: 16384
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      # Explicit budgets leave room for the TP16/DCP16 all-gather and graph
      # workspace on a 184 GiB GB200 GPU.
      kv-cache-memory: 10737418240
    decode:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "moonshotai/Kimi-K3"
      enable-prefix-caching: true
      prefix-match-unit: 128
      load-format: "safetensors"
      safetensors-load-strategy: "lazy"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 16
      decode-context-parallel-size: 16
      enable-cumem-allocator: true
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
      max-cudagraph-capture-size: 1024
      stream-interval: 10
      max-num-seqs: 256
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      kv-cache-memory: 15032385536

sbatch_directives:
  mem: "0"
  cpus-per-task: "144"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
    # Model, topology, concurrency, duration, offload metadata, and result
    # filename are inherited from the generated InferenceX matrix.
