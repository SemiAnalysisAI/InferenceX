# Source: https://github.com/sgl-project/sglang/blob/191172fa742f8837423ca4e4be4919ebb52f1b51/docs/cookbook/autoregressive/Qwen/Qwen3.5.mdx
# Separate TP4 GPU groups share one node. GPU qualification pending.
schema: 2
name: qwen3.5-b300-fp8-agentx-disagg-1p1d-tp4-tp4-colocated-c8
model:
  path: qwen3.5-fp8
  container: lmsysorg/sglang:nightly-dev-cu13-20260918-20518d85
  precision: fp8
dynamo:
  install: true
  source:
    rev: 805a77f053d807b0d8def5d27f674a6df0ed839e
slurm:
  time_limit: '8:00:00'
health_check:
  max_attempts: 1440
  interval_seconds: 10
resources:
  gpu_type: b300
  gpus_per_node: 8
frontend:
  type: dynamo
  nginx_session_affinity: true
  env:
    PIP_BREAK_SYSTEM_PACKAGES: '1'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '3600'
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None
  nginx_session_affinity_header: X-Dynamo-Session-ID
engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      PYTHONUNBUFFERED: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      NCCL_NVLS_ENABLE: '1'
      SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
      SGLANG_ENABLE_SPEC_V2: '1'
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
      SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
      TORCH_CUDA_ARCH_LIST: '10.0'
      PYTHONNOUSERSITE: '1'
      SGL_ENABLE_JIT_DEEPGEMM: 'false'
      SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
    args:
      served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
      model-path: /model/
      trust-remote-code: true
      quantization: fp8
      kv-cache-dtype: fp8_e4m3
      tensor-parallel-size: 4
      expert-parallel-size: 1
      data-parallel-size: 1
      mamba-ssm-dtype: bfloat16
      attention-backend: trtllm_mha
      moe-runner-backend: flashinfer_trtllm
      linear-attn-prefill-backend: flashinfer
      linear-attn-decode-backend: flashinfer
      enable-symm-mem: true
      enable-cache-report: true
      enable-metrics: true
      context-length: 262144
      mem-fraction-static: 0.8
      chunked-prefill-size: 16384
      max-prefill-tokens: 16384
      page-size: 64
      reasoning-parser: qwen3
      tool-call-parser: qwen3_coder
      disaggregation-mode: prefill
      disaggregation-transfer-backend: mooncake
      watchdog-timeout: 3600
      disable-cuda-graph: true
      mamba-radix-cache-strategy: extra_buffer
      mamba-track-interval: 2048
      scheduler-recv-interval: 10
      stream-interval: 50
      max-running-requests: 16
  decode:
    nodes: colocate
    workers: 1
    gpus: 4
    env:
      PYTHONUNBUFFERED: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      NCCL_NVLS_ENABLE: '1'
      SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
      SGLANG_ENABLE_SPEC_V2: '1'
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
      SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
      TORCH_CUDA_ARCH_LIST: '10.0'
      PYTHONNOUSERSITE: '1'
      SGL_ENABLE_JIT_DEEPGEMM: 'false'
      SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
    args:
      served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
      model-path: /model/
      trust-remote-code: true
      quantization: fp8
      kv-cache-dtype: fp8_e4m3
      tensor-parallel-size: 4
      expert-parallel-size: 1
      data-parallel-size: 1
      mamba-ssm-dtype: bfloat16
      attention-backend: trtllm_mha
      moe-runner-backend: flashinfer_trtllm
      linear-attn-prefill-backend: flashinfer
      linear-attn-decode-backend: flashinfer
      enable-symm-mem: true
      enable-cache-report: true
      enable-metrics: true
      context-length: 262144
      mem-fraction-static: 0.8
      chunked-prefill-size: 16384
      max-prefill-tokens: 16384
      page-size: 64
      reasoning-parser: qwen3
      tool-call-parser: qwen3_coder
      disaggregation-mode: decode
      disaggregation-transfer-backend: mooncake
      watchdog-timeout: 3600
      mamba-radix-cache-strategy: no_buffer
      disable-radix-cache: true
      speculative-algorithm: NEXTN
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      scheduler-recv-interval: 10
      stream-interval: 50
      max-running-requests: 16
      cuda-graph-max-bs-decode: 8
sbatch_directives:
  mem: '0'
  cpus-per-task: '144'
srun_options:
  mem: '0'
  container-remap-root: ''
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: '8000'
    IS_MULTINODE: 'true'
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
