# Direct diagnostic aggregate control: 2 active GPUs; eight allocated.
# Native SRT plain SGLang frontend preserves baseline tokenizer settings.
# Strict board power covers active GPU indices only; allocation normalization is separate.
# Explicit unquantized original BF16 draft weights and BF16 draft KV.
# Equal BF16 target/draft KV is required by pinned NEXTN packed HiCache.
# HiCache 298 GB/rank is the combined target KV, draft KV and Mamba host budget.
schema: 2
name: qwen35-b300-agg-tp2-ep2-c32-mtp-bf16-draft-bf16-kv-h298
model:
  path: qwen3.5-fp8
  container: lmsysorg/sglang:nightly-dev-cu13-20260918-20518d85
  precision: fp8
identity:
  model:
    repo: Qwen/Qwen3.5-397B-A17B-FP8
    revision: ea5b4f81096f3901c91dea97f81324302495781d
  container:
    image: lmsysorg/sglang:nightly-dev-cu13-20260918-20518d85
  frameworks:
    sglang: 0.0.0.dev1+g20518d851
dynamo:
  install: false
slurm:
  time_limit: '4:00:00'
health_check:
  max_attempts: 1440
  interval_seconds: 10
resources:
  gpu_type: b300
  gpus_per_node: 8
frontend:
  type: sglang
  enable_multiple_frontends: false
engine: sglang
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 2
    env:
      PYTHONUNBUFFERED: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
      NCCL_NVLS_ENABLE: '1'
      SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
      TORCH_CUDA_ARCH_LIST: '10.0'
      PYTHONNOUSERSITE: '1'
      SGL_ENABLE_JIT_DEEPGEMM: 'false'
      SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
    args:
      served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
      model-path: /model/
      tokenizer-path: /model/
      trust-remote-code: true
      quantization: fp8
      kv-cache-dtype: bf16
      tensor-parallel-size: 2
      expert-parallel-size: 2
      data-parallel-size: 1
      mamba-ssm-dtype: bfloat16
      attention-backend: trtllm_mha
      moe-runner-backend: flashinfer_trtllm
      enable-symm-mem: true
      enable-cache-report: true
      enable-metrics: true
      context-length: 262144
      mem-fraction-static: 0.8
      chunked-prefill-size: 16384
      max-prefill-tokens: 16384
      reasoning-parser: qwen3
      tool-call-parser: qwen3_coder
      watchdog-timeout: 3600
      speculative-algorithm: NEXTN
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      speculative-draft-model-path: /draft-model
      speculative-draft-model-revision: 8472618112abcbd45acbcdc58436aff4233c23f7
      speculative-draft-kv-cache-dtype: bf16
      speculative-draft-model-quantization: unquant
      speculative-moe-runner-backend: flashinfer_trtllm
      scheduler-recv-interval: 10
      stream-interval: 50
      max-running-requests: 64
      cuda-graph-max-bs-decode: 32
      page-size: 64
      enable-hierarchical-cache: true
      hicache-size: 298
      hicache-io-backend: kernel
      hicache-mem-layout: page_first
      hicache-write-policy: write_through_selective
sbatch_directives:
  exclude: dsxe-sa-b300-prd0-gpu-11
  mem: '0'
  cpus-per-task: '144'
srun_options:
  mem: '0'
  container-remap-root: ''
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    SRT_MEASUREMENT_WINDOW_BENCHMARK_TYPE: custom
    SRT_MEASUREMENT_WINDOW_CONCURRENCIES: '32'
    SRT_MEASUREMENT_WINDOW_RESULT_ROOT: /logs
    PORT: '8000'
    IS_MULTINODE: 'true'
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'false'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
  concurrencies:
  - 32
telemetry:
  enabled: true
  collect_interval_ms: 1000
  storage_subdir: power
  required: true
  startup_timeout_seconds: 120
  request_timeout_seconds: 2
  dcgm_exporter:
    container_image: dcgm-exporter
    port: 9401
    command: dcgm-exporter --collect-interval=100 --address :{port} --devices g:0,1
container_mounts:
  /data/home/cjquilici/qwen35-bf16-draft-8472618: /draft-model
