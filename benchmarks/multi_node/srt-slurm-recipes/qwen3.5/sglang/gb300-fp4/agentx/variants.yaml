# srt-slurm recipes for qwen3.5/sglang/gb300-fp4/agentx: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/qwen3.5/sglang/gb300-fp4/agentx/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: qwen3.5-fp4
    precision: fp4
  slurm:
    time_limit: '8:00:00'
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: gb300
  frontend: {}
  engine: sglang
  roles: {}
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  srun_options:
    mem: '0'
    container-remap-root: ''
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

override_agg_tp2_c1_mtp_hicache_jid2530006:
  name: agg-gb300-tp2-c1-mtp-hicache-jid2530006
  model:
    container: dynamo-sglang
  resources:
    gpus_per_node: 2
  frontend:
    type: sglang-router
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 2
      env:
        NCCL_NVLS_ENABLE: '1'
        PYTHONNOUSERSITE: '1'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        SGL_ENABLE_JIT_DEEPGEMM: 'false'
        TORCH_CUDA_ARCH_LIST: '10.0'
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4
        enable-cache-report: true
        enable-metrics: true
        model-path: /model/
        trust-remote-code: true
        tensor-parallel-size: 2
        data-parallel-size: 1
        expert-parallel-size: 1
        enable-symm-mem: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        mamba-scheduler-strategy: extra_buffer
        mamba-track-interval: 8192
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        cuda-graph-max-bs: 80
        max-running-requests: 72
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        mem-fraction-static: 0.75
        max-mamba-cache-size: 360
        allow-auto-truncate: true
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        page-size: 64
        enable-hierarchical-cache: true
        hicache-ratio: 0.9
        hicache-io-backend: kernel
        hicache-mem-layout: page_first_direct
        hicache-write-policy: write_back
        mamba-max-states-per-path: 1
  benchmark:
    env:
      IS_MULTINODE: 'false'
      TP: '2'

