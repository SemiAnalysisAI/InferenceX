# srt-slurm recipes for qwen3.5/sglang/gb300-fp4/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/qwen3.5/sglang/gb300-fp4/8k1k/variants.yaml:override_<name>.
#
#

schema: 2

base:
  model:
    path: qwen3.5-fp4
    container: dynamo-sglang
    precision: fp4
  dynamo:
    source:
      pypi: 1.1.0
  frontend:
    type: dynamo
    enable_multiple_frontends: true
    num_additional_frontends: 2
    nginx_container: nginx
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine: sglang
  roles:
    prefill:
      env:
        NO_COLOR: '1'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        SGLANG_ENABLE_SPEC_V2: '1'
        PYTHONUNBUFFERED: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        MC_FORCE_MNNVL: '1'
        SGLANG_ENABLE_JIT_DEEPGEMM: 'true'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        FLASHINFER_DISABLE_VERSION_CHECK: '1'
        SGLANG_DG_CACHE_DIR: /configs/deepgemm-cache
        FLASHINFER_WORKSPACE_BASE: /configs/flashinfer-cache
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
        model-path: /model/
        trust-remote-code: true
        tensor-parallel-size: 4
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        mamba-scheduler-strategy: no_buffer
        mamba-ssm-dtype: bfloat16
        mamba-track-interval: 2048
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        linear-attn-decode-backend: flashinfer
        disaggregation-mode: prefill
        disable-radix-cache: true
        mem-fraction-static: 0.8
        max-total-tokens: 128000
        load-balance-method: round_robin
        page-size: 64
        watchdog-timeout: 1000000
        log-level: info
    decode:
      workers: 1
      env:
        NO_COLOR: '1'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
        SGLANG_ENABLE_SPEC_V2: '1'
        PYTHONUNBUFFERED: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        MC_FORCE_MNNVL: '1'
        MC_TE_METRIC: 'true'
        SGLANG_ENABLE_JIT_DEEPGEMM: 'true'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        FLASHINFER_DISABLE_VERSION_CHECK: '1'
        SGLANG_DG_CACHE_DIR: /configs/deepgemm-cache
        FLASHINFER_WORKSPACE_BASE: /configs/flashinfer-cache
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_DECODE_BOOTSTRAP_TIMEOUT: '1000'
        SGLANG_HACK_SEQ_BOOTSTRAP_ROOM: '1'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        SGLANG_HEALTH_CHECK_TIMEOUT: '1800'
        SGLANG_HEALTH_STARTING_OK: '1'
        SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
        model-path: /model/
        trust-remote-code: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        mamba-scheduler-strategy: no_buffer
        mamba-ssm-dtype: bfloat16
        mamba-track-interval: 128
        attention-backend: trtllm_mha
        linear-attn-decode-backend: flashinfer
        disaggregation-mode: decode
        disable-radix-cache: true
        mem-fraction-static: 0.8
        page-size: 64
        watchdog-timeout: 1000000
        decode-log-interval: 50
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf
    random_range_ratio: 0.8
  telemetry:
    enabled: true
    collect_interval_ms: 1000
    storage_subdir: power
    required: true
    startup_timeout_seconds: 120
    request_timeout_seconds: 2
    dcgm_exporter:
      container_image: dcgm-exporter
      port: 19401

# Qwen3.5-397B-A17B-NVFP4-V2 Disaggregated 1P1D: TP4 Prefill + TP4 Decode
# Pure tensor parallel, no expert parallel (STP)
# 8k1k sa-bench concurrency sweep on GB300
# Values taken from ni_experiment_config of the
# sa-qwen-3.5-8k1k-fp4-baseline-low-latency study, row
# qwen3.5-1p_tp4x1d_tp4-aligned-ccsweep (CSV pareto export 2026-06-05).
# (telemetry.dcgm_exporter.port) 9401 is already bound by the cluster-level exporter on im-gb300 nodes;
# (telemetry.dcgm_exporter.port) use a port outside that range.
override_disagg_1p1d_p_tp4_d_tp4_b128_c1x4x8x16x32x64x256_stp:
  name: gb300-fp4-qwen3.5_8k1k_lowlat_0
  roles:
    prefill:
      nodes: 1
      workers: 1
      args:
        data-parallel-size: 1
        expert-parallel-size: 1
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        fp4-gemm-backend: flashinfer_cutlass
        mm-attention-backend: triton_attn
        context-length: 9236
        max-running-requests: 128
        cuda-graph-max-bs: 4
        chunked-prefill-size: 32768
        max-prefill-tokens: 32768
        scheduler-recv-interval: 10
        stream-interval: 30
    decode:
      nodes: 1
      args:
        tensor-parallel-size: 4
        data-parallel-size: 1
        expert-parallel-size: 1
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        fp4-gemm-backend: flashinfer_cutlass
        mm-attention-backend: triton_attn
        moe-runner-backend: flashinfer_trtllm
        context-length: 9236
        max-total-tokens: 1500000
        max-mamba-cache-size: 256
        max-running-requests: 128
        cuda-graph-max-bs: 256
        chunked-prefill-size: 32768
        max-prefill-tokens: 32768
        scheduler-recv-interval: 10
        stream-interval: 30
  benchmark:
    concurrencies: 1x4x8x16x32x64x256

# Qwen3.5-397B-A17B-NVFP4-V2 Disaggregated 5P1D wide-EP
# Prefill: 5 workers @ TP4/DP4/EP4 with DP-attn (per-node, DEP4)
# Decode:  1 worker  @ TP16/DP16/EP16 with DP-attn + TBO (DEP16, 4 nodes)
# Total: 36 GB300 GPUs (5*4 + 4*4); 8k1k concurrency 1024/2048/3072.
# Values taken from ni_experiment_config of pareto row
# qwen3.5-dep16-fia2a-tbo-cc1024x2048x3072-dynamo-tot-nixl
# (sa-qwen-3.5-8k1k-fp4-baseline-mid-pareto study).
override_disagg_5p1d_p_tp4_ep4_dp4_d_tp16_ep16_dp16_b4096_c2048_stp:
  name: gb300-fp4-qwen3.5_8k1k_maxtpt_0
  roles:
    prefill:
      nodes: 5
      workers: 5
      env:
        SGLANG_FLASHINFER_FP4_GEMM_BACKEND: cutlass
        SGLANG_ENABLE_NIXL: '1'
      args:
        data-parallel-size: 4
        expert-parallel-size: 4
        chunked-prefill-size: 65536
        enable-dp-attention: true
        enable-dp-lm-head: true
        disaggregation-bootstrap-port: 31000
        disaggregation-transfer-backend: nixl
    decode:
      nodes: 4
      env:
        SGLANG_FLASHINFER_FP4_GEMM_BACKEND: cutlass
        SGLANG_MOE_NVFP4_DISPATCH: '1'
        SGLANG_CUTEDSL_MOE_NVFP4_DISPATCH: '1'
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '1'
        SGLANG_NCCL_ALL_GATHER_IN_OVERLAP_SCHEDULER_SYNC_BATCH: '1'
        SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: '1024'
        SGLANG_ENABLE_NIXL: '1'
      args:
        tensor-parallel-size: 16
        data-parallel-size: 16
        expert-parallel-size: 16
        moe-runner-backend: flashinfer_cutedsl
        max-total-tokens: 2200000
        max-mamba-cache-size: 4096
        max-running-requests: 4096
        chunked-prefill-size: 4096
        stream-interval: 50
        enable-dp-attention: true
        enable-dp-lm-head: true
        enable-two-batch-overlap: true
        disaggregation-bootstrap-port: 31000
        disaggregation-transfer-backend: nixl
        moe-a2a-backend: flashinfer
        disable-shared-experts-fusion: true
  benchmark:
    concurrencies: '2048'

