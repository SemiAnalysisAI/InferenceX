# srt-slurm recipes for qwen3.5/sglang/gb300-fp8/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/qwen3.5/sglang/gb300-fp8/8k1k/variants.yaml:override_<name>.

schema: 2

base:
  sbatch_directives:
    mem: '0'
  dynamo:
    install: true
    source: {}
  frontend:
    type: dynamo
    enable_multiple_frontends: true
    nginx_container: nginx
  model:
    path: qwen3.5-fp8
    precision: fp8
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine: sglang
  roles:
    prefill:
      env:
        SGLANG_JIT_DEEPGEMM_PRECOMPILE: '0'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '3600'
        TORCH_NCCL_WATCHDOG_TIMEOUT_SEC: '3600'
        TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '3600'
        PYTHONUNBUFFERED: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        MC_FORCE_MNNVL: '1'
        SGLANG_DG_CACHE_DIR: /configs/deepgemm-cache
        FLASHINFER_WORKSPACE_BASE: /configs/flashinfer-cache
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        model-path: /model/
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        trust-remote-code: true
        attention-backend: trtllm_mha
        mamba-ssm-dtype: bfloat16
        moe-runner-backend: flashinfer_trtllm
        disable-radix-cache: true
        disaggregation-mode: prefill
    decode:
      workers: 1
      env:
        SGLANG_JIT_DEEPGEMM_PRECOMPILE: '0'
        TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '3600'
        TORCH_NCCL_WATCHDOG_TIMEOUT_SEC: '3600'
        TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '3600'
        PYTHONUNBUFFERED: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        MC_FORCE_MNNVL: '1'
        MC_TE_METRIC: 'true'
        FLASHINFER_WORKSPACE_BASE: /configs/flashinfer-cache
        SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_DECODE_BOOTSTRAP_TIMEOUT: '1000'
        SGLANG_HACK_SEQ_BOOTSTRAP_ROOM: '1'
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
        SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
        SGLANG_HEALTH_STARTING_OK: '1'
        SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        model-path: /model/
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        trust-remote-code: true
        attention-backend: trtllm_mha
        mamba-ssm-dtype: bfloat16
        disable-radix-cache: true
        stream-interval: 50
        disaggregation-mode: decode
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf
    random_range_ratio: 0.8

# Qwen3.5 FP8 GB300 disaggregated MTP 1P1D TP4/TP4 configuration.
override_disagg_1p1d_p_tp4_d_tp4_b1024_c1x2x8_mtp:
  name: qwen3.5-fp8-gb300-mtp-8k1k-1p1d-tp4-tp4
  dynamo:
    source:
      rev: 46520ca59afe992fb5ef61b3197b2316f8df9b2b
  frontend:
    num_additional_frontends: 1
  model:
    container: lmsysorg/sglang:v0.5.14-cu130@sha256:5027e95bf6ec536856b1b52a91d1f35ff5c564ab83e8a94758a169ff09bb8df3
  roles:
    prefill:
      nodes: 1
      workers: 1
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
        NO_COLOR: '1'
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        SGLANG_HEALTH_STARTING_OK: '1'
        SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
      args:
        tensor-parallel-size: 4
        mamba-scheduler-strategy: no_buffer
        mamba-track-interval: 2048
        max-running-requests: 1024
        mem-fraction-static: 0.8
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        context-length: 16384
        cuda-graph-max-bs: 1024
        decode-log-interval: 1
        stream-interval: 50
    decode:
      nodes: 1
      env:
        SGLANG_ENABLE_SPEC_V2: '1'
        NO_COLOR: '1'
        SGLANG_DG_CACHE_DIR: /configs/deepgemm-cache
        SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
        SGLANG_HEALTH_CHECK_TIMEOUT: '1800'
      args:
        tensor-parallel-size: 4
        mamba-scheduler-strategy: no_buffer
        mamba-track-interval: 128
        max-mamba-cache-size: 1024
        moe-runner-backend: flashinfer_trtllm
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        max-running-requests: 1024
        mem-fraction-static: 0.8
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        context-length: 16384
        cuda-graph-max-bs: 1024
        decode-log-interval: 1
  benchmark:
    concurrencies: 1x2x8
    use_chat_template: true
  telemetry:
    enabled: true
    collect_interval_ms: 1000
    storage_subdir: power
    required: true
    startup_timeout_seconds: 120
    request_timeout_seconds: 2
    dcgm_exporter:
      container_image: dcgm-exporter
      port: 19401

