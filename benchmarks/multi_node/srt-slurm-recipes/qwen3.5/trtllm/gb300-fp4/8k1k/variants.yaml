# srt-slurm recipes for qwen3.5/trtllm/gb300-fp4/8k1k: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/qwen3.5/trtllm/gb300-fp4/8k1k/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: qwen3.5-fp4
    container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24
    precision: fp4
  dynamo:
    install: true
    source:
      wheel: 1.4.0.dev20260807
  identity:
    container:
      image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24
  slurm:
    time_limit: 04:00:00
  health_check:
    max_attempts: 540
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  roles:
    prefill:
      env:
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
      args:
        cache_transceiver_config:
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 16384
        cuda_graph_config: null
        disable_overlap_scheduler: true
        enable_attention_dp: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
        max_num_tokens: 16896
        max_seq_len: 8448
        moe_config:
          backend: CUTEDSL
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        trust_remote_code: true
    decode:
      env:
        TLLM_LOG_LEVEL: INFO
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        TRTLLM_ENABLE_PDL: '1'
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        MIMALLOC_PURGE_DELAY: '0'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
      args:
        cache_transceiver_config:
          kv_transfer_timeout_ms: 600000
          max_tokens_in_buffer: 16384
        cuda_graph_config:
          enable_padding: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
        max_seq_len: 9472
        moe_config:
          use_low_precision_moe_combine: true
        num_postprocess_workers: 4
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        stream_interval: 100
        trust_remote_code: true
  frontend:
    type: dynamo
    env:
      ETCD_LEASE_TTL: '120'
      DYN_TOKENIZER: fastokens
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf
    num_prompts_mult: 16

