# srt-slurm recipes for qwen3.5/trtllm/gb300-fp4/agentx: shared settings in base, one override per
# benchmark configuration. Select one with
# CONFIG_FILE=recipes/qwen3.5/trtllm/gb300-fp4/agentx/variants.yaml:override_<name>.

schema: 2

base:
  model:
    path: qwen3.5-fp4
    container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24
    precision: fp4
  dynamo:
    install: true
    source:
      git: https://github.com/cquil11/dynamo.git
      rev: 2cbbdc863c336c2cfffa2a3668e2a6661801b259
  identity:
    model:
      repo: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
    container:
      image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24
    frameworks:
      tensorrt_llm: 1.3.0rc24
  slurm:
    time_limit: 04:00:00
  health_check:
    max_attempts: 540
    interval_seconds: 10
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  engine:
    type: trtllm
    publish_events_and_metrics: false
  roles:
    prefill:
      env:
        CUDA_SCALE_LAUNCH_QUEUES: 4x
        MIMALLOC_ARENA_RESERVE: '0'
        MIMALLOC_PURGE_DELAY: ''
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TLLM_LOG_LEVEL: INFO
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_TRTLLM_SERVED_MODEL_NAME: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
      args:
        attention_dp_config:
          kv_cache_routing_conversation_affinity: true
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_sender_future_timeout_ms: 20
          kv_transfer_timeout_ms: 600000
          transceiver_runtime: PYTHON
        cuda_graph_config: null
        disable_overlap_scheduler: false
        enable_chunked_prefill: true
        enable_iter_perf_stats: true
        enable_iter_req_stats: false
        kv_cache_config:
          block_reuse_config:
            max_num_turns: 3
            policy: per_conversation
          dtype: fp8
          enable_block_reuse: true
          event_buffer_max_size: 0
          free_gpu_memory_fraction: 0.8
          host_cache_size: 137438953472
          mamba_state_config:
            additional_snapshot_offsets_from_end:
              - 2
            periodic_snapshot_interval: 0
          pool_ratio:
            - 0.8
            - 0.2
          tokens_per_block: 64
          use_kv_cache_manager_v2: true
        max_batch_size: 64
        max_seq_len: 262144
        moe_config:
          backend: CUTEDSL
        num_serve_frontends: 8
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
        torch_compile_config:
          enable_fullgraph: true
          enable_piecewise_cuda_graph: true
        trust_remote_code: true
    decode:
      env:
        MIMALLOC_ARENA_RESERVE: '0'
        MIMALLOC_PURGE_DELAY: ''
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        TLLM_LOG_LEVEL: INFO
        TRTLLM_ENABLE_PDL: '1'
        TRTLLM_PINNED_WEIGHT_STAGING: '1'
        TRTLLM_SERVER_DISABLE_GC: '1'
        TRTLLM_WORKER_DISABLE_GC: '1'
        UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
        DYN_ENGINE_CONV_AFFINITY: '1'
        DYN_TRTLLM_SERVED_MODEL_NAME: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
      args:
        cache_transceiver_config:
          backend: NIXL
          kv_transfer_sender_future_timeout_ms: 20
          kv_transfer_timeout_ms: 600000
          transceiver_runtime: PYTHON
        cuda_graph_config:
          enable_padding: true
        enable_iter_perf_stats: true
        enable_iter_req_stats: false
        kv_cache_config:
          avg_seq_len: 102150
          dtype: fp8
          enable_block_reuse: false
          event_buffer_max_size: 0
          host_cache_size: 137438953472
          tokens_per_block: 64
          use_kv_cache_manager_v2: true
        max_seq_len: 262148
        moe_config:
          backend: CUTEDSL
          use_low_precision_moe_combine: true
        num_postprocess_workers: 4
        num_serve_frontends: 4
        nvfp4_gemm_config:
          allowed_backends:
            - cutlass
            - cublaslt
            - cutedsl
            - cuda_core
        pipeline_parallel_size: 1
        print_iter_log: true
        return_perf_metrics: false
        scheduler_config:
          capacity_scheduler_policy: GUARANTEED_NO_EVICT
        speculative_config:
          decoding_type: MTP
        stream_interval: 20
        trust_remote_code: true
  frontend:
    type: dynamo
    enable_multiple_frontends: false
    env:
      ETCD_LEASE_TTL: '120'
      DYN_TOKENIZER_CACHE: '1'
      DYN_TOKENIZER_CACHE_BYTES: '8000000000'
      DYN_TOKENIZER: fastokens
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: '14400'
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      IS_MULTINODE: 'true'
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
      AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
      HF_HUB_CACHE: /hf_hub_cache
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      SERVED_MODEL_NAME: Qwen3.5-397B-A17B-NVFP4-V2

override_disagg_1p1d_dep1_tep2_c44_b8_mtp_kvoffload:
  name: disagg-gb300-1p1d-dep1-tep2-c44-b8-mtp-kvoffload
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 1
      env:
        TRT_LLM_DISABLE_LOAD_WEIGHTS_IN_PARALLEL: '1'
      args:
        enable_attention_dp: true
        max_num_tokens: 8192
        moe_expert_parallel_size: 1
        tensor_parallel_size: 1
        torch_compile_config:
          capture_num_tokens: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
    decode:
      nodes: 1
      workers: 1
      gpus: 2
      env:
        TRT_LLM_DISABLE_LOAD_WEIGHTS_IN_PARALLEL: '1'
      args:
        cuda_graph_config:
          batch_sizes: [1, 2, 4, 8]
        enable_attention_dp: false
        enable_lm_head_tp_in_adp: false
        kv_cache_config:
          free_gpu_memory_fraction: 0.85
        max_batch_size: 8
        max_num_tokens: 56
        moe_expert_parallel_size: 2
        speculative_config:
          max_draft_len: 6
        tensor_parallel_size: 2

