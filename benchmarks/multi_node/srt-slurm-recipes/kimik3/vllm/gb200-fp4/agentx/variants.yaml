override_agg_dep16_vllm_simple_offload:
  name: kimi-k3-vllm-agg-gb200-dep16-throughput-vllm-simple-offload-agentic
  # High-concurrency host-DRAM KV-offload variant of the official throughput-
  # oriented multi_node_dep profile. TP4 x DP4 gives EP16 across four four-GPU
  # GB200 nodes. Each TP rank receives a 128 GiB CPU KV pool (512 GiB per node).
  # https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb200&nodes=4&strategy=multi_node_dep
  model:
    container: vllm/vllm-openai:kimi-k3
  identity:
    container:
      image: vllm/vllm-openai:kimi-k3
    frameworks:
      dynamo: 1.3.0
  dynamo:
    install: true
    source:
      rev: ba83080ecd31c1ce918559e576d3c5bc9e092ff1
  slurm:
    time_limit: '12:00:00'
  health_check:
    max_attempts: 2160
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
  frontend:
    type: dynamo
    args:
      # Use vLLM's Kimi K3 parser so OpenAI responses expose structured
      # tool_calls instead of raw XTML in message.content.
      dyn-chat-processor: vllm
      trust-remote-code: true
      tool-call-parser: kimi_k3
      reasoning-parser: kimi_k3
      enable-auto-tool-choice: true
      router-mode: kv
      router-kv-events: true
      router-temperature: '0'
      router-min-initial-workers: 1
      kv-cache-block-size: 64
  roles:
    agg:
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        PYTHONHASHSEED: '42'
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        TRANSFORMERS_CACHE: /hf_hub_cache
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: mnnvl
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
        NCCL_P2P_LEVEL: NVL
        NVIDIA_GDRCOPY: '1'
        PYTORCH_ALLOC_CONF: expandable_segments:True
        DG_JIT_CACHE_DIR: /tmp/dg-cache-kimi-k3-gb200-dep16-offload-{job_id}
      args:
        tensor-parallel-size: 4
        # The largest offload point is c384 / DP4 = 96 sequences per engine.
        # Capture even sequence counts: all configured DP4 steady-state batch
        # sizes are exact hits, while odd loads pad by at most one sequence.
        max-num-seqs: 96
        max-num-batched-tokens: 16384
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        # FlashInfer's larger TP4 MoE representation leaves too little transient
        # HBM for fastsafetensors' GPU-staging path when DSpark is loaded.
        load-format: safetensors
        safetensors-load-strategy: lazy
        # DeepGEMM mega-MoE grid barriers time out under DSpark MRV2 with the
        # one-sided all-to-all worker; use the supported Kimi K3 FlashInfer path.
        moe-backend: flashinfer_trtllm
        attention-backend: FLASHINFER_MLA
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":2,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":549755813888,"cpu_bytes_to_use_per_rank":137438953472,"lazy_offload":false}}'
        pipeline-parallel-size: 1
        data-parallel-size: 4
        data-parallel-rpc-port: 13345
        enable-expert-parallel: true
        kda-prefill-backend: flashkda
        kernel-config: '{"enable_cutedsl_warmup":true}'
        all2all-backend: flashinfer_nvlink_one_sided
        gpu-memory-utilization: 0.94
        compilation-config: '{"cudagraph_mode":"PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168,174,180,186,192,198,204,210,216,222,228,234,240,246,252,258,264,270,276,282,288]}'
        block-size: 64
        disable-custom-all-reduce: true
        scheduler-cls: vllm.v1.core.sched.async_scheduler.AsyncScheduler
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  benchmark:
    env:
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '14400'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'
  setup_script: kimik3-dspark-config-compat.sh
  environment:
    ETCD_LEASE_TTL: '7200'

