override_agg_tp16_latency:
  name: kimi-k3-vllm-agg-gb200-tp16-latency-agentic
  # Day-0 GB200 translation of the official latency-oriented multi_node_tp
  # profile. TP16 spans four GB200 nodes and uses the official FP8 KV cache.
  # https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb200&nodes=4&strategy=multi_node_tp
  model:
    container: vllm/vllm-openai:kimi-k3
  identity:
    container:
      image: vllm/vllm-openai:kimi-k3
    frameworks:
      dynamo: 1.3.0
  dynamo:
    install: true
    source:
      rev: ba83080ecd31c1ce918559e576d3c5bc9e092ff1
  slurm:
    time_limit: '8:00:00'
  health_check:
    max_attempts: 2160
  services:
    - name: etcd
      type: etcd
      placement:
        node: infra
    - name: nats
      type: nats
      placement:
        node: infra
      options:
        max_payload_mb: 32
  frontend:
    type: dynamo
    args:
      # Use vLLM's Kimi K3 parser so OpenAI responses expose structured
      # tool_calls instead of raw XTML in message.content.
      dyn-chat-processor: vllm
      trust-remote-code: true
      tool-call-parser: kimi_k3
      reasoning-parser: kimi_k3
      enable-auto-tool-choice: true
      router-mode: kv
      router-kv-events: true
      router-temperature: '0'
      router-min-initial-workers: 1
      kv-cache-block-size: 64
  roles:
    agg:
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        HF_HUB_CACHE: /hf_hub_cache
        HUGGINGFACE_HUB_CACHE: /hf_hub_cache
        TRANSFORMERS_CACHE: /hf_hub_cache
        VLLM_LOG_STATS_INTERVAL: '1'
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: mnnvl
        NCCL_CUMEM_ENABLE: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_NVLS_ENABLE: '1'
        UCX_MEMTYPE_CACHE: n
        UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
        UCX_TLS: rc,cuda_copy
        NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
        NCCL_P2P_LEVEL: NVL
        NVIDIA_GDRCOPY: '1'
        PYTORCH_ALLOC_CONF: expandable_segments:True
        DG_JIT_CACHE_DIR: /tmp/dg-cache-kimi-k3-gb200-tp16-{job_id}
      args:
        tensor-parallel-size: 16
        max-num-seqs: 8
        max-num-batched-tokens: 8192
        dyn-tool-call-parser: kimi_k3
        dyn-reasoning-parser: kimi_k3
        load-format: fastsafetensors
        safetensors-load-strategy: lazy
        moe-backend: flashinfer_trtllm
        attention-backend: FLASHINFER_MLA
        speculative-config: '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":2,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
        pipeline-parallel-size: 1
        kda-prefill-backend: flashkda
        kernel-config: '{"enable_cutedsl_warmup":true}'
        gpu-memory-utilization: 0.92
        compilation-config: '{"cudagraph_capture_sizes":[3,6,9,12,15,18,21,24],"pass_config":{"fuse_allreduce_rms":false}}'
        block-size: 64
        disable-custom-all-reduce: true
        scheduler-cls: vllm.v1.core.sched.async_scheduler.AsyncScheduler
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  benchmark:
    env:
      AIPERF_LIVE_FAILED_REQUEST_THRESHOLD: '0.25'
      AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '14400'
  setup_script: kimik3-dspark-config-compat.sh
  environment:
    ETCD_LEASE_TTL: '7200'

override_agg_tp8pp2_mooncake_c16:
  name: kimik3-vllm-agg-gb200-tp8pp2-mooncake-c16-agentic
  model:
    container: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-728d3ad
  identity:
    container:
      image: vllm/vllm-openai:nightly-dev-arm64-cu13.0.1-728d3ad
