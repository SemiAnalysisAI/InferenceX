schema: 2
name: kimi-k3-vllm-agg-b300-dcp8-nospec-mooncake-c70-agentic
model:
  path: moonshotai/Kimi-K3
  container: vllm/vllm-openai:nightly-0961bbae2894d574be790d219651824eb199318e
  precision: fp4
resources:
  gpu_type: b300
  gpus_per_node: 8
services:
- name: etcd
  type: etcd
  placement:
    node: infra
- name: nats
  type: nats
  placement:
    node: infra
  options:
    max_payload_mb: 32
- name: mooncake-master
  type: mooncake-master
  args:
  - --default_kv_lease_ttl=60000
  - --eviction_high_watermark_ratio=0.95
  - --eviction_ratio=0.10
  options:
    store_config:
      metadata_server: P2PHANDSHAKE
      global_segment_size: 190GB
      local_buffer_size: 4GB
      protocol: efa
      mode: embedded
      enable_offload: false
frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    dyn-chat-processor: vllm
    trust-remote-code: true
    tool-call-parser: kimi_k3
    reasoning-parser: kimi_k3
    enable-auto-tool-choice: true
    router-mode: least-loaded
    router-session-affinity-ttl-secs: 900
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
    DYN_TOKENIZER_CACHE_BYTES: '8589934592'
engine:
  type: vllm
  connector: null
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 8
    env:
      VLLM_ALLREDUCE_USE_FLASHINFER: '1'
      VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: '1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_USE_DIRECT_DCP_A2A: '1'
      VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
      VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_RPC_TIMEOUT: '600000'
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
      PYTHONNOUSERSITE: '1'
      TORCH_CUDA_ARCH_LIST: '10.0'
      PYTHONHASHSEED: '42'
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
      MC_STORE_MEMCPY: '1'
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_SLICE_SIZE: '1048576'
      MC_WORKERS_PER_CTX: '4'
      WITH_NVIDIA_PEERMEM: '0'
      VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      GLIBC_TUNABLES: glibc.malloc.hugetlb=1
      LD_LIBRARY_PATH: /opt/libfabric/lib
    args:
      served-model-name: moonshotai/Kimi-K3
      tensor-parallel-size: 8
      decode-context-parallel-size: 8
      dcp-comm-backend: a2a
      gpu-memory-utilization: 0.94
      max-num-batched-tokens: 16384
      trust-remote-code: true
      language-model-only: true
      load-format: fastsafetensors
      moe-backend: auto
      enable-prefix-caching: true
      prefix-match-unit: 128
      kv-cache-dtype: fp8
      stream-interval: 10
      attention-backend: TOKENSPEED_MLA
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
      max-cudagraph-capture-size: 1024
      kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"compact_group_io":true,"max_load_batch_keys":2,"enable_offload":false}}'
      enable-flashinfer-autotune: true
health_check:
  max_attempts: 720
  interval_seconds: 10
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    AIPERF_TRACE_IDLE_GAP_CAP_SECONDS: '300'
    AIPERF_LIVE_FAILED_REQUEST_THRESHOLD: '0.25'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
    AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
    RESULT_DIR: /logs/agentic
    PORT: '8000'
    IS_MULTINODE: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
  client_placement: head
  concurrencies:
  - 70
dynamo:
  install: true
  source:
    rev: ba83080ecd31c1ce918559e576d3c5bc9e092ff1
identity:
  model:
    repo: moonshotai/Kimi-K3
  container:
    image: vllm/vllm-openai:nightly-0961bbae2894d574be790d219651824eb199318e
  frameworks:
    dynamo: ba83080ecd31c1ce918559e576d3c5bc9e092ff1
slurm:
  time_limit: 06:00:00
sbatch_directives:
  mem: '0'
  cpus-per-task: '72'
  comment: '''{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very large model will take extra loading time."}}'''
srun_options:
  mem: '0'
  container-remap-root: ''
setup_script: kimik3-b300-efa-setup.sh
