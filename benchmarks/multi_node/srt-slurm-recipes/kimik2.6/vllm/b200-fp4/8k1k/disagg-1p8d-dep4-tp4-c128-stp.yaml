schema: 2
name: kimi-k2.6-vllm-disagg-b200-1p8d-dep4-tp4-c128
model:
  path: kimi-k2.6-nvfp4
  container: vllm/vllm-openai:v0.25.1
  precision: fp4
dynamo:
  install: true
  source:
    wheel: 1.3.0.dev20260721
resources:
  gpu_type: b200
  gpus_per_node: 8
services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: nats
    type: nats
    placement:
      node: dedicated

frontend:
  type: dynamo
  enable_multiple_frontends: false
engine:
  type: vllm
  connector:
  dp_launch_mode: per_gpu
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      PYTHONUNBUFFERED: '1'
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
      VLLM_USE_FLASHINFER_MOE_FP4: '1'
      VLLM_USE_NCCL_SYMM_MEM: '0'
      NCCL_CUMEM_ENABLE: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
      NCCL_WATCHDOG_TIMEOUT: '1800'
      TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '1800'
      TORCH_CUDA_ARCH_LIST: '10.0'
      PYTHONNOUSERSITE: '1'
      UCX_MEMTYPE_CACHE: n
      UCX_MEMTYPE_REG_WHOLE: n
      UCX_CUDA_IPC_ENABLE_MNNVL: n
      UCX_MAX_RMA_RAILS: '1'
      UCX_MAX_RNDV_RAILS: '1'
      UCX_RNDV_SCHEME: put_zcopy
    args:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both", "engine_id": "kimi-k26-prefill-dep4"}'
      served-model-name: nvidia/Kimi-K2.6-NVFP4
      kv-cache-dtype: fp8
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 4
      data-parallel-rpc-port: 13346
      enable-expert-parallel: true
      max-model-len: 10240
      max-num-seqs: 2048
      enforce-eager: true
      compilation-config: '{"custom_ops":["+quant_fp8","+rms_norm","+rotary_embedding"],"pass_config":{"fuse_attn_quant":true,"fuse_allreduce_rms":true}}'
      max-num-batched-tokens: 8192
      safetensors-load-strategy: prefetch
      trust-remote-code: true
      no-enable-prefix-caching: true
      no-enable-flashinfer-autotune: true
      attention-backend: FLASHINFER_MLA
      block-size: 128
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED"}'
      gpu-memory-utilization: 0.94
  decode:
    nodes: 4
    workers: 8
    gpus: 4
    env:
      PYTHONUNBUFFERED: '1'
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
      VLLM_USE_FLASHINFER_MOE_FP4: '1'
      VLLM_USE_NCCL_SYMM_MEM: '0'
      NCCL_CUMEM_ENABLE: '1'
      NCCL_WATCHDOG_TIMEOUT: '1800'
      TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '1800'
      TORCH_CUDA_ARCH_LIST: '10.0'
      PYTHONNOUSERSITE: '1'
      UCX_MEMTYPE_CACHE: n
      UCX_MEMTYPE_REG_WHOLE: n
      UCX_CUDA_IPC_ENABLE_MNNVL: n
      UCX_MAX_RMA_RAILS: '1'
      UCX_MAX_RNDV_RAILS: '1'
      UCX_RNDV_SCHEME: put_zcopy
    args:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      served-model-name: nvidia/Kimi-K2.6-NVFP4
      kv-cache-dtype: fp8
      tensor-parallel-size: 4
      pipeline-parallel-size: 1
      max-model-len: 9216
      max-num-seqs: 2048
      max-num-batched-tokens: 8192
      safetensors-load-strategy: prefetch
      trust-remote-code: true
      no-enable-prefix-caching: true
      no-enable-flashinfer-autotune: true
      async-scheduling: true
      attention-backend: FLASHINFER_MLA
      block-size: 128
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","custom_ops":["+quant_fp8","+rms_norm","+rotary_embedding"],"pass_config":{"fuse_attn_quant":true,"fuse_allreduce_rms":true}}'
      gpu-memory-utilization: 0.93
      stream-interval: 50
      max-cudagraph-capture-size: 2048
benchmark:
  type: sa-bench
  isl: 8192
  osl: 1024
  concurrencies: '128'
  req_rate: inf
  use_chat_template: true

telemetry:
  enabled: true
  collect_interval_ms: 1000
  storage_subdir: power
  required: true
  startup_timeout_seconds: 120
  request_timeout_seconds: 2
  dcgm_exporter:
    container_image: dcgm-exporter
    port: 9401
