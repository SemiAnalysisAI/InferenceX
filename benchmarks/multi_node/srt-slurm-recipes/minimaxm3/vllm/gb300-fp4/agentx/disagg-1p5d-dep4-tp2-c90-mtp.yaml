schema: 2
name: minimax-m3-gb300-1p-dep4-5d-tp2-c90
setup_script: minimaxm3-mooncake/setup-disagg.sh
host_setup:
  commands:
  - numactl --hardware
  - test -n "${SLURM_JOB_ID:-}" && test ! -L "/tmp/srt-fdx-${SLURM_JOB_ID}" && install -d -m 700 "/tmp/srt-fdx-${SLURM_JOB_ID}"
  nodes: all
container_mounts:
  /tmp/srt-fdx-{job_id}: /srt-ipc
dynamo:
  install: true
  source:
    wheel: 1.5.0.dev20260914
  request_plane: tcp
services:
- name: etcd
  type: etcd
  placement:
    node: infra
- name: nats
  type: nats
  placement:
    node: infra
  options:
    max_payload_mb: 32
- name: mooncake-master
  type: mooncake-master
  options:
    device_names_by_gpu:
    - mlx5_0
    - mlx5_1
    - mlx5_2
    - mlx5_3
    store_config:
      metadata_server: P2PHANDSHAKE
      global_segment_size: 170GB
      local_buffer_size: 4GB
      protocol: rdma
      device_name: mlx5_0,mlx5_1,mlx5_2,mlx5_3
      mode: embedded
      enable_offload: true
frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 4
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Dynamo-Session-ID
  args:
    router-mode: least-loaded
  env:
    DYN_TOKENIZER: fastokens
    DYN_TOKENIZER_CACHE_BYTES: '8589934592'
    DYN_TCP_CONNECT_TIMEOUT: '120'
model:
  path: nvidia/MiniMax-M3-NVFP4
  container: vllm/vllm-openai:nightly-0bfc7a15d095fe83ecc82b50561a93c177fece2d@sha256:ac75d722e093a1d6b1515fdb0d9cff692225e47e8bcbaf614a1a220d302fa116
  precision: fp4
identity:
  model:
    repo: nvidia/MiniMax-M3-NVFP4
  container:
    image: vllm/vllm-openai:nightly-0bfc7a15d095fe83ecc82b50561a93c177fece2d@sha256:ac75d722e093a1d6b1515fdb0d9cff692225e47e8bcbaf614a1a220d302fa116
  frameworks:
    dynamo: 1.5.0.dev20260914
resources:
  gpu_type: gb300
  gpus_per_node: 4
  spread_workers: false
engine:
  type: vllm
  connector: null
  dp_launch_mode: per_gpu
  set_cuda_visible_devices: true
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      DYN_TCP_CONNECT_TIMEOUT: '120'
      VLLM_FLOAT32_MATMUL_PRECISION: high
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
      VLLM_USE_NCCL_SYMM_MEM: '0'
      VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
      VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
      UCX_MEMTYPE_CACHE: n
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      UCX_MODULE_DIR: /usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx
      UCX_TLS: ^cuda_ipc,gdr_copy
      UCX_RNDV_PIPELINE_ERROR_HANDLING: y
      UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
      NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
      NCCL_CUMEM_ENABLE: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_NVLS_ENABLE: '1'
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_STORE_CLIENT_METRIC: '1'
      MC_STORE_CLIENT_METRIC_INTERVAL: '5'
      MC_TE_METRIC: '1'
      TMPDIR: /srt-ipc
      HF_HUB_CACHE: /hf_hub_cache
      HUGGINGFACE_HUB_CACHE: /hf_hub_cache
    args:
      numa-bind: true
      served-model-name: nvidia/MiniMax-M3-NVFP4
      tensor-parallel-size: 1
      data-parallel-size: 4
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      all2all-backend: flashinfer_nvlink_one_sided
      kv-cache-dtype: fp8
      block-size: 512
      trust-remote-code: true
      enable-prefix-caching: true
      language-model-only: true
      no-enable-flashinfer-autotune: true
      reasoning-parser: minimax_m3
      dyn-tool-call-parser: minimax_m3
      dyn-reasoning-parser: minimax_m3
      dyn-default-thinking-mode: enabled
      max-cudagraph-capture-size: 512
      max-num-batched-tokens: 16384
      stream-interval: 20
      gpu-memory-utilization: 0.9
      attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}'
      speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASHINFER"}'
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config":{"backends":["UCX"],"num_threads":8}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"lookup_async":false}}]}}'
      enable-cumem-allocator: true
  decode:
    nodes: 3
    workers: 5
    gpus: 2
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      DYN_TCP_CONNECT_TIMEOUT: '120'
      VLLM_FLOAT32_MATMUL_PRECISION: high
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
      VLLM_USE_NCCL_SYMM_MEM: '0'
      VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
      VLLM_MOONCAKE_LOAD_RECV_THREADS: '20'
      UCX_MEMTYPE_CACHE: n
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      UCX_MODULE_DIR: /usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx
      UCX_TLS: ^cuda_ipc,gdr_copy
      UCX_RNDV_PIPELINE_ERROR_HANDLING: y
      UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1
      NCCL_IB_HCA: mlx5_0,mlx5_1,mlx5_2,mlx5_3
      NCCL_CUMEM_ENABLE: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_NVLS_ENABLE: '1'
      MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
      MC_STORE_CLIENT_METRIC: '1'
      MC_STORE_CLIENT_METRIC_INTERVAL: '5'
      MC_TE_METRIC: '1'
      TMPDIR: /srt-ipc
      HF_HUB_CACHE: /hf_hub_cache
      HUGGINGFACE_HUB_CACHE: /hf_hub_cache
    args:
      max-num-seqs: 2
      numa-bind: true
      served-model-name: nvidia/MiniMax-M3-NVFP4
      tensor-parallel-size: 2
      enable-expert-parallel: false
      kv-cache-dtype: fp8
      block-size: 512
      trust-remote-code: true
      enable-prefix-caching: true
      language-model-only: true
      no-enable-flashinfer-autotune: true
      reasoning-parser: minimax_m3
      dyn-tool-call-parser: minimax_m3
      dyn-reasoning-parser: minimax_m3
      dyn-default-thinking-mode: enabled
      max-cudagraph-capture-size: 512
      max-num-batched-tokens: 16384
      stream-interval: 20
      gpu-memory-utilization: 0.9
      attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8","minimax_m3_msa_decode_backend":"cutlass"}'
      speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASHINFER"}'
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config":{"backends":["UCX"],"num_threads":8}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"enable_lookup":false}}]}}'
      enable-cumem-allocator: true
benchmark:
  type: custom
  use_chat_template: true
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    ENABLE_AGENTX_POWER: '0'
    AIPERF_EXTRA_INPUTS: thinking:true
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
    AIPERF_SERVER_METRICS_COLLECTION_INTERVAL: '1.0'
    AIPERF_WARMUP_REQUESTS_PER_LANE: '10'
    AIPERF_TRACE_IDLE_GAP_CAP_SECONDS: '300'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AGENTIC_WARMUP_GRACE_PERIOD: '1800'
    AIPERF_DRAIN_TIMEOUT_SECONDS: '1800'
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: '8000'
    IS_MULTINODE: 'true'
    DISAGG: 'true'
    HF_HUB_CACHE: /hf_hub_cache
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
observability:
  tachometer:
    enabled: false
telemetry:
  enabled: false
health_check:
  max_attempts: 2160
  interval_seconds: 10
sbatch_directives:
  cpus-per-task: '144'
  mem: '0'
srun_options:
  container-remap-root: ''
  cpu-bind: cores
slurm:
  time_limit: '8:00:00'
environment:
  PYTHONHASHSEED: '0'
  WITH_NVIDIA_PEERMEM: '0'
