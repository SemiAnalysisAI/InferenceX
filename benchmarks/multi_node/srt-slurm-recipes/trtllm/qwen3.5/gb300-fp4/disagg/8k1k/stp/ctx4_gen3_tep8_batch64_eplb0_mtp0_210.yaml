name: disagg-gb300-4p3d-dep1-tep8-c210-stp
model:
  path: qwen3.5-fp4
  container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24
  precision: fp4

dynamo:
  install: true
  wheel: 1.4.0.dev20260807

identity:
  container:
    image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24
  frameworks:
    tensorrt_llm: 1.3.0rc24
slurm:
  time_limit: 04:00:00
health_check:
  max_attempts: 540
  interval_seconds: 10
resources:
  gpu_type: gb300
  gpus_per_node: 4
  prefill_nodes: 1
  prefill_workers: 4
  gpus_per_prefill: 1
  decode_nodes: 6
  decode_workers: 3
  gpus_per_decode: 8
backend:
  type: trtllm
  sequential_node_start: 2
  prefill_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    MIMALLOC_PURGE_DELAY: '0'
    TRT_LLM_DISABLE_LOAD_WEIGHTS_IN_PARALLEL: '1'
    CTX_LOAD_STAGGER_S: '180'
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
  decode_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    MIMALLOC_PURGE_DELAY: '0'
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
  trtllm_config:
    prefill:
      cache_transceiver_config:
        backend: UCX
        kv_transfer_timeout_ms: 600000
        max_tokens_in_buffer: 16384
      cuda_graph_config: null
      disable_overlap_scheduler: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
      max_batch_size: 32
      max_num_tokens: 16896
      max_seq_len: 8448
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 1
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      tensor_parallel_size: 1
      trust_remote_code: true
    decode:
      cache_transceiver_config:
        backend: UCX
        kv_transfer_timeout_ms: 600000
        max_tokens_in_buffer: 16384
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 40
        - 48
        - 56
        - 64
        enable_padding: true
      enable_attention_dp: false
      enable_lm_head_tp_in_adp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
      max_batch_size: 64
      max_num_tokens: 64
      max_seq_len: 9472
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      num_postprocess_workers: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      stream_interval: 100
      tensor_parallel_size: 8
      trust_remote_code: true
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_TOKENIZER: "fastokens"

benchmark:
  type: sa-bench
  isl: 8192
  osl: 1024
  concurrencies:
  - 210
  req_rate: inf
  num_prompts_mult: 16
