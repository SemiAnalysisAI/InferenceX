name: disagg-b200-8k1k-5p1d-dep8-dep8-b256-eplb384-mtp0
model:
  path: deepseek-v4-pro
  container: dynamo-trtllm
  precision: fp4
dynamo:
  install: true
  wheel: "1.4.0.dev20260807"
  request_plane: tcp
resources:
  gpu_type: b200
  prefill_nodes: 5
  prefill_workers: 5
  gpus_per_prefill: 8
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 8
  gpus_per_node: 8
backend:
  type: trtllm
  prefill_environment:
    DYN_DEFAULT_THINKING_MODE: disabled
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    MIMALLOC_PURGE_DELAY: '0'
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TLLM_PROFILE_LOG_RANKS: all
    UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
    NIXL_PLUGIN_DIR: /opt/nvidia/nvda_nixl/lib/x86_64-linux-gnu/plugins
  decode_environment:
    DYN_DEFAULT_THINKING_MODE: disabled
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    MIMALLOC_PURGE_DELAY: '0'
    TLLM_PROFILE_LOG_RANKS: all
    UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
    NIXL_PLUGIN_DIR: /opt/nvidia/nvda_nixl/lib/x86_64-linux-gnu/plugins
  trtllm_config:
    prefill:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
      disable_overlap_scheduler: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.5
        tokens_per_block: 128
      max_batch_size: 2
      max_num_tokens: 8192
      max_seq_len: 8232
      moe_config:
        backend: TRTLLM
        load_balancer: /configs/moe_load_balancer_ctx_ep4_384.yaml
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      print_iter_log: true
      tensor_parallel_size: 8
    decode:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 40
        - 48
        - 56
        - 64
        - 72
        - 80
        - 88
        - 96
        - 104
        - 112
        - 120
        - 128
        - 136
        - 144
        - 152
        - 160
        - 168
        - 176
        - 184
        - 192
        - 200
        - 208
        - 216
        - 224
        - 232
        - 240
        - 248
        - 256
        enable_padding: true
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
        tokens_per_block: 128
      max_batch_size: 256
      max_num_tokens: 256
      max_seq_len: 9256
      moe_config:
        backend: MEGAMOE_DEEPGEMM
        load_balancer: /configs/moe_load_balancer_gen_ep8_slots384.yaml
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      num_postprocess_workers: 4
      pipeline_parallel_size: 1
      print_iter_log: true
      stream_interval: 100
      tensor_parallel_size: 8
benchmark:
  type: sa-bench
  isl: 8192
  osl: 1024
  concurrencies: "2150"
  req_rate: inf
  random_range_ratio: 0.8
  use_chat_template: false
  custom_tokenizer: "sa_bench_tokenizers.sglang_deepseek_v4.SGLangDeepseekV4Tokenizer"
frontend:
  type: dynamo
  enable_multiple_frontends: true
  env:
    ETCD_LEASE_TTL: '120'
    DYN_TOKENIZER: "fastokens"
health_check:
  max_attempts: 540
  interval_seconds: 10
environment:
  TRTLLM_SERVER_DISABLE_GC: '1'
