name: "b200-glm51-tilert-agentic-disagg-1p1d-tp8-mtp"

model:
  path: "hf:zai-org/GLM-5.1-FP8"
  container: "tilert-decode"
  precision: "fp8"

identity:
  model:
    repo: "zai-org/GLM-5.1-FP8"
  container:
    image: "ghcr.io/tile-ai/tilert:0.1.5"
  frameworks:
    tilert: "0.1.5.post3"
    vllm: "0.26.0"
    nixl: "1.3.1"

dynamo:
  install: false

setup_script: tilert_setup.sh

slurm:
  time_limit: "04:00:00"

resources:
  gpu_type: "b200"
  gpus_per_node: 8
  prefill_nodes: 1
  decode_nodes: 1
  prefill_workers: 1
  decode_workers: 1
  gpus_per_prefill: 8
  gpus_per_decode: 8

frontend:
  type: tilert-router
  enable_multiple_frontends: false
  env:
    TILERT_ROLE: router
  args:
    parser: none
    queue-timeout: 1800

backend:
  type: tilert
  prefill_container: "tilert-prefill"
  model_profile: "glm5"
  weight_model_type: "glm-5"
  weights_dir: "/data/home/sa-shared/gharunners/tilert-cache/glm5.1-fp8-8shard"
  max_seq_len: 202752
  kv_cache_dtype: "fp8"
  prefill_kv_cache_dtype: "fp8_ds_mla"
  transport: nixl
  with_mtp: true
  speculative_tokens: 1
  prefill_environment: &common_environment
    HF_HOME: "/hf_hub_cache"
    HF_HUB_CACHE: "/hf_hub_cache/hub"
    HUGGINGFACE_HUB_CACHE: "/hf_hub_cache/hub"
    PYTHONUNBUFFERED: "1"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
  decode_environment:
    <<: *common_environment
  tilert_config:
    prefill:
      enforce-eager: true
      trust-remote-code: true
      gpu-memory-utilization: 0.75

srun_options:
  container-writable: ""
  container-remap-root: ""

health_check:
  max_attempts: 720
  interval_seconds: 5

benchmark:
  type: custom
  command: |
    set -euo pipefail
    mkdir -p /infmax-workspace/LOGS/agentic
    export RESULT_DIR=/infmax-workspace/LOGS/agentic
    export AGENTIC_OUTPUT_DIR=/infmax-workspace
    exec bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    PORT: "8000"
    IS_MULTINODE: "true"
    MAX_MODEL_LEN: "202752"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache/hub"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
