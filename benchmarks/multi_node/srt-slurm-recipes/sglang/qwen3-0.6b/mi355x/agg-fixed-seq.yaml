# Minimal MI355X aggregate validation. It exercises native SGLang Router and
# one aggregate SGLang worker; this is orchestration validation, not tuning.

name: "mi355x-sglang-qwen3-0.6b-agg-fixed-seq"

model:
  path: "hf:Qwen/Qwen3-0.6B"
  container: "sglang-rocm-v0.5.17-mi35x"
  precision: "fp16"

identity:
  model:
    repo: "Qwen/Qwen3-0.6B"
  container:
    image: "lmsysorg/sglang-rocm:v0.5.17-rocm720-mi35x-20260809"
  frameworks:
    sglang: "0.5.17.dev20260809+g7120f3ee13"
    sglang-router: "0.3.2"

slurm:
  time_limit: "00:30:00"

resources:
  gpu_type: "mi355x"
  gpus_per_node: 1
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 1

frontend:
  type: sglang
  enable_multiple_frontends: false
  args:
    policy: round_robin

backend:
  type: sglang
  aggregated_environment:
    HF_HOME: "/hf_hub_cache"
    HF_HUB_CACHE: "/hf_hub_cache/hub"
    HUGGINGFACE_HUB_CACHE: "/hf_hub_cache/hub"
    PYTHONUNBUFFERED: "1"
  sglang_config:
    aggregated:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.50
      context-length: 2048
      max-running-requests: 8
      disable-cuda-graph: true
      enable-metrics: true

srun_options:
  container-writable: ""
  container-remap-root: ""
  mem: "0"

health_check:
  max_attempts: 180
  interval_seconds: 5

benchmark:
  type: custom
  command: |
    set -euo pipefail
    result_root="/results/${SLURM_JOB_ID}"
    mkdir -p "${result_root}/fixed-seq"
    trap 'tar -C /logs -czf "'"${result_root}"'/runtime-logs.tar.gz" . 2>/dev/null || true' EXIT
    for concurrency in 1 4; do
      python3 /infmax-workspace/utils/bench_serving/benchmark_serving.py \
      --backend openai-chat \
      --base-url "http://${SRT_FRONTEND_HOST}:${SRT_FRONTEND_PORT}" \
      --endpoint /v1/chat/completions \
      --model Qwen/Qwen3-0.6B \
      --tokenizer Qwen/Qwen3-0.6B \
      --dataset-name random \
      --random-input-len 128 \
      --random-output-len 32 \
      --random-range-ratio 1.0 \
      --random-num-workers 1 \
      --num-warmups "${concurrency}" \
      --num-prompts "$((concurrency * 4))" \
      --max-concurrency "${concurrency}" \
      --request-rate inf \
      --ignore-eos \
      --disable-tqdm \
      --save-result \
      --result-dir "${result_root}/fixed-seq" \
      --result-filename "qwen3-0.6b-agg-isl128-osl32-c${concurrency}.json";
    done
  env:
    HF_HOME: /hf_hub_cache
    HF_HUB_CACHE: /hf_hub_cache/hub
    HUGGINGFACE_HUB_CACHE: /hf_hub_cache/hub
