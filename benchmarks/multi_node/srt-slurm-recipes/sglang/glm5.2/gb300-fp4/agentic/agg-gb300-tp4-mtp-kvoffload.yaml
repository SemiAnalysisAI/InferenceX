name: "agg-gb300-tp4-mtp-kvoffload"

# GLM-5.2 NVFP4 agentic-coding SGLang AGGREGATED recipe on GB300
# (single aggregated worker, TP4, EAGLE/MTP + hierarchical-cache DRAM KV
# offload). One GB300 node; the whole 433 GB NVFP4 checkpoint fits in TP4.
#
# Purpose: the high-interactivity end of the Pareto curve. The disagg arms in
# this directory start at conc 8 and jump to 256, leaving the knee unsampled;
# this arm contributes conc 1/4/8/16 on 4 GPUs. Mirrors the arm the DSv4-Pro
# GB300 agentic family uses for the same purpose
# (../deepseek-v4/agentic/agg-gb300-tp4-mtp-kvoffload.yaml, run 29385297092 --
# which is why that reference curve has 9 points where our disagg-only set had 5).
#
# Note on allocations: agentic_srt.sh can sweep a whole CONC_LIST against one
# engine bring-up, and run 29385297092 did exactly that (one artifact,
# conc1x4x8x16), because MAX_MULTINODE_AGENTIC_CONCURRENCIES_PER_ALLOCATION was
# 4 back then. #2170 lowered it to 1, so today each concurrency gets its own
# allocation and its own model load. Same four curve points, four bring-ups.
#
# Concurrency is NOT a recipe field: agentic_srt.sh reads CONC_LIST/CONC
# exported from the master-config conc-list.
#
# Model identity, quantization, DSA/MoE backends, parsers, MTP and hicache
# tuning are GLM-5.2's, taken from the validated
# benchmarks/single_node/agentic/glm5.2_fp4_b300_sglang.sh and this directory's
# disagg recipes -- NOT DSv4's (no megamoe/mxfp4, no SWA knobs, no simulated
# acceptance length: this measures real EAGLE MTP).

model:
  path: "glm-5.2-fp4"
  container: "dynamo-sglang"
  precision: "fp4"

dynamo:
  install: true
  # >= 1.2.1 required: older dynamo minijinja rejects GLM-5.2's chat-template
  # `.0` dot-index. 1.3.0.dev1 matches the disagg recipes in this directory.
  wheel: "1.3.0.dev1"

slurm:
  time_limit: "8:00:00"

health_check:
  max_attempts: 1440
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 4

infra:
  # Dedicated etcd/nats node — under the dynamo router + multiple frontends the
  # infra services need their own node.
  etcd_nats_dedicated_node: true
  # cc-traces prompts (~125K tokens) serialize to ~2.8MB; the 1 MiB NATS
  # default drops them. 32 MiB matches the disagg recipes.
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Correlation-ID
  enable_multiple_frontends: true
  num_additional_frontends: 4
  env:
    DYN_ROUTER_TEMPERATURE: "10000000"
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  args:
    router-mode: "kv"
    router-reset-states: true
    active-decode-blocks-threshold: "None"
    active-prefill-tokens-threshold: "None"
    active-prefill-tokens-threshold-frac: "None"

backend:
  type: sglang

  aggregated_environment:
    # AIPerf keeps a 300s client-side keep-alive pool; uvicorn's default 5s
    # closes sockets mid-session -> ECONNRESET kills the agentic warmup.
    SGLANG_TIMEOUT_KEEP_ALIVE: "900"
    PIP_BREAK_SYSTEM_PACKAGES: '1'
    PYTHONUNBUFFERED: '1'
    SGLANG_DG_CACHE_DIR: /configs/deepgemm_cache
    SGLANG_JIT_DEEPGEMM_PRECOMPILE: '1'
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
    NCCL_MNNVL_ENABLE: '1'
    NCCL_CUMEM_ENABLE: '1'
    NCCL_TIMEOUT: '100000'
    NCCL_MNNVL_UUID_QUERY_TIMEOUT: '100000'
    DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
    DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
    SGLANG_REQUEST_STATE_WAIT_TIMEOUT: '60'
    # Required for the hierarchical-cache KV offload path.
    SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'

  sglang_config:
    aggregated:
      host: 0.0.0.0
      # MUST equal the `model:` field of the nvidia-master.yaml config-key:
      # benchmark_lib.sh sends `--model $MODEL` from it, and the dynamo
      # frontend only registers this name. A mismatch is not a startup
      # error -- the engine goes healthy and every benchmark request then
      # 404s "Model not found", which AIPerf reports as a terminal warmup
      # failure (run 30202683710).
      served-model-name: nvidia/GLM-5.2-NVFP4
      model-path: /model/
      trust-remote-code: true
      quantization: modelopt_fp4
      kv-cache-dtype: fp8_e4m3
      watchdog-timeout: 86400
      stream-interval: 60
      # GLM-5.2 tool-call / reasoning parsers (required for agentic tool calls)
      tool-call-parser: glm47
      reasoning-parser: glm45
      # Parallelism: plain TP4, no attention-DP, no EP -> no MoE all-to-all, so
      # the bf16 MTP/nextn layer (hf_quant_config excludes model.layers.78*)
      # takes the triton runner with a2a "none", which is registered. No
      # speculative-moe-* override needed here, unlike the wide-EP decode.
      dp-size: 1
      tp-size: 4
      ep-size: 1
      # NVFP4 MoE runner (a2a none). Also what `auto` resolves to on Blackwell.
      moe-runner-backend: flashinfer_trtllm
      # DSA / GEMM backends (GLM-5.2)
      nsa-decode-backend: trtllm
      nsa-prefill-backend: trtllm
      fp4-gemm-backend: flashinfer_cutlass
      mem-fraction-static: 0.85
      # dp-size 1, so this is the per-rank budget directly (no DP split).
      chunked-prefill-size: 8192
      max-prefill-tokens: 8192
      # Sized for the top of this arm's conc-list (16); agentic concurrency
      # counts session trees, so allow subagent fan-out past CONC.
      max-running-requests: 128
      cuda-graph-max-bs: 64
      model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
      # MTP (EAGLE, GLM-5.2 built-in nextn head) — real, not simulated.
      speculative-algorithm: EAGLE
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      # Hierarchical-cache DRAM KV offload. ratio 0.75 is the validated GLM-5.2
      # ceiling: GLM-5.2 is DSA/MLA-family so every rank holds complete per-token
      # KV, and a larger host pool OOM-kills the node (run 29678598595). Same
      # values as the disagg recipes here, NOT DSv4's ratio 6 / write_through /
      # kernel.
      enable-hierarchical-cache: true
      hicache-write-policy: write_back
      hicache-ratio: 0.75
      hicache-io-backend: direct
      hicache-mem-layout: page_first_direct

sbatch_directives:
  mem: "0"
  cpus-per-task: "144"

srun_options:
  mem: "0"
  # gb300-nv: pyxis maps the calling user into the container as a non-root uid;
  # agentic_srt.sh's apt-get install git step needs EUID 0. srt-slurm renders
  # empty-string values as flag-only srun args.
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: "8000"
    # Aggregated: one worker serves both prefill and decode, so GPU accounting
    # is the single-worker form num_gpus = TP, not the disagg prefill+decode
    # sum. Forces the single-node code path in process_agentic_result.py, which
    # would otherwise divide throughput by prefill_gpus + decode_gpus. TP must
    # match sglang_config tp-size.
    IS_MULTINODE: "false"
    TP: "4"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "1"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
