name: "disagg-h200-2p2d-pcp8-tp8-dp8-mtp"

# Refresh of the 2P2D topology from Actions run 30133535261 with EAGLE MTP.
# The released SGLang image does not combine MTP with HiSparse, so decode KV
# cache remains GPU-resident. MTP uses the committed GLM-5.2 golden thinking-on
# acceptance length for three speculative steps.

model:
  path: "hf:zai-org/GLM-5.2-FP8"
  container: "lmsysorg/sglang:v0.5.16-cu130"
  precision: "fp8"

dynamo:
  install: true
  wheel: "1.3.0.dev1"

slurm:
  time_limit: "8:00:00"

resources:
  gpu_type: h200
  gpus_per_node: 8
  prefill_nodes: 2
  decode_nodes: 2
  prefill_workers: 2
  decode_workers: 2
  gpus_per_prefill: 8
  gpus_per_decode: 8

infra:
  etcd_nats_dedicated_node: true
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Correlation-ID
  env:
    DYN_ROUTER_TEMPERATURE: "10000000"
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  args:
    # Parse GLM tool tags at the Dynamo frontend so non-stream OpenAI
    # responses expose message.tool_calls instead of raw tagged content.
    dyn-chat-processor: sglang
    tool-call-parser: glm47
    reasoning-parser: glm45
    router-mode: "kv"
    router-reset-states: true
    active-decode-blocks-threshold: "None"
    active-prefill-tokens-threshold: "None"
    active-prefill-tokens-threshold-frac: "None"

backend:
  type: sglang
  prefill_environment:
    HF_HOME: "/hf_hub_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    PIP_BREAK_SYSTEM_PACKAGES: "1"
    PYTHONUNBUFFERED: "1"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_OPT_USE_TOPK_V2: "1"
    SGLANG_TIMEOUT_KEEP_ALIVE: "900"
  decode_environment:
    HF_HOME: "/hf_hub_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    PIP_BREAK_SYSTEM_PACKAGES: "1"
    PYTHONUNBUFFERED: "1"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_OPT_USE_TOPK_V2: "1"
    SGLANG_TIMEOUT_KEEP_ALIVE: "900"
    SGLANG_SIMULATE_ACC_LEN: "2.99"
    SGLANG_SIMULATE_ACC_METHOD: "match-expected"
    SGLANG_SIMULATE_ACC_TOKEN_MODE: "real-draft-token"

  sglang_config:
    prefill:
      host: 0.0.0.0
      model-path: /model/
      served-model-name: zai-org/GLM-5.2-FP8
      trust-remote-code: true
      tool-call-parser: glm47
      reasoning-parser: glm45
      tp-size: 8
      ep-size: 1
      attn-cp-size: 8
      enable-prefill-cp: true
      cp-strategy: interleave
      enable-dsa-cache-layer-split: true
      disaggregation-transfer-backend: mooncake
      disaggregation-mode: prefill
      kv-cache-dtype: fp8_e4m3
      context-length: 1048576
      max-total-tokens: 1048576
      chunked-prefill-size: 32768
      mem-fraction-static: 0.85
      max-running-requests: 32
      speculative-algorithm: EAGLE
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      watchdog-timeout: 86400
      stream-interval: 60
      enable-metrics: true
      enable-cache-report: true

    decode:
      host: 0.0.0.0
      model-path: /model/
      served-model-name: zai-org/GLM-5.2-FP8
      trust-remote-code: true
      tool-call-parser: glm47
      reasoning-parser: glm45
      tp-size: 8
      dp-size: 8
      ep-size: 1
      enable-dp-attention: true
      disaggregation-transfer-backend: mooncake
      disaggregation-mode: decode
      kv-cache-dtype: fp8_e4m3
      dsa-decode-backend: flashmla_kv
      context-length: 1048576
      max-total-tokens: 1048576
      mem-fraction-static: 0.85
      max-running-requests: 200
      page-size: 64
      disable-radix-cache: true
      speculative-algorithm: EAGLE
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      watchdog-timeout: 86400
      stream-interval: 60
      enable-metrics: true
      enable-cache-report: true

sbatch_directives:
  mem: "0"

srun_options:
  mem: "0"
  container-remap-root: ""

telemetry:
  enabled: true
  provider: dcgm-power
  default_frequency: 1.0
  storage_subdir: power
  required: true
  startup_timeout_seconds: 120
  request_timeout_seconds: 2
  collector_join_timeout_seconds: 10
  dcgm_exporter:
    container_image: dcgm-exporter
    port: 9401

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
