schema: 2
name: "disagg-b200-1p1d-tp8-tp8-c1"


model:
  path: "deepseek-v4-pro"
  container: "lmsysorg/sglang:nightly-dev-cu13-20260821-f825d729"
  precision: "fp4"

dynamo:
  install: true

  source:
    rev: "86f84b9486905c2bfaa4b756c9fa39f04ecf5ebd"
sbatch_directives:
  cpus-per-task: "144"
  mem: "0"

resources:
  gpu_type: "b200"
  gpus_per_node: 8
health_check:
  max_attempts: 240

frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 8

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 8
    env:
      PYTHONUNBUFFERED: "1"
      SGLANG_RADIX_FORCE_MISS: "1"
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_DEFAULT_THINKING: "1"
      SGLANG_DSV4_REASONING_EFFORT: "max"
      SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"

    args:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      disable-radix-cache: true

      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl

      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 1

      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true

      mem-fraction-static: 0.90
      max-running-requests: 1024
      cuda-graph-max-bs: 512
      chunked-prefill-size: 65536

  decode:
    nodes: 1
    workers: 1
    gpus: 8

    env:
      PYTHONUNBUFFERED: "1"
      SGLANG_RADIX_FORCE_MISS: "1"
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_DEFAULT_THINKING: "1"
      SGLANG_DSV4_REASONING_EFFORT: "max"
      SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"

    args:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      disable-radix-cache: true

      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl

      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 1

      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true

      mem-fraction-static: 0.9
      max-running-requests: 1024
      cuda-graph-max-bs: 512
      swa-full-tokens-ratio: 0.1
      context-length: 16384

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "1"
  req_rate: "inf"
  use_chat_template: false

telemetry:
  enabled: true
  collect_interval_ms: 1000
  storage_subdir: power
  required: true
  startup_timeout_seconds: 120
  request_timeout_seconds: 2
  dcgm_exporter:
    container_image: dcgm-exporter
    port: 9401
