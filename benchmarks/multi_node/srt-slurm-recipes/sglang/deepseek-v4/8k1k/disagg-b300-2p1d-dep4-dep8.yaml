name: "disagg-b300-2p1d-dep4-dep8"

model:
  path: "deepseek-v4-pro"
  container: "lmsysorg/sglang:nightly-dev-cu13-20260721-8905cbd4"
  precision: "fp4"

dynamo:
  hash: "41882ae9b07232eed4850fb1daf8c958abb2556a"
  install: true

sbatch_directives:
  cpus-per-task: "144"
  mem: "0"

resources:
  gpu_type: "b300"
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 2
  gpus_per_prefill: 4
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 8

frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 8
  env:
  args:
    router-mode: "kv"
    router-kv-overlap-score-weight: 0
    router-queue-threshold: 64
    router-temperature: 0.5
    no-kv-events: true

backend:
  type: sglang

  prefill_environment:
    PYTHONUNBUFFERED: "1"
    SGLANG_RADIX_FORCE_MISS: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DEFAULT_THINKING: "1"
    SGLANG_DSV4_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "8192"
    SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_FP4_ACTS: "1"
    SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_MXF4_KIND: "1"
    SGLANG_OPT_USE_ONLINE_COMPRESS: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    MC_FORCE_MNNVL: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"
    UCX_TLS: "cuda_copy,rc"
    DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
    SGLANG_LOG_FORWARD_ITERS: "1"
    SGLANG_LOG_MS: "1"
    SGLANG_REQUEST_STATE_WAIT_TIMEOUT: "60"

  decode_environment:
    PYTHONUNBUFFERED: "1"
    SGLANG_RADIX_FORCE_MISS: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DEFAULT_THINKING: "1"
    SGLANG_DSV4_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "1280"
    SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_FP4_ACTS: "1"
    SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_MXF4_KIND: "1"
    SGLANG_OPT_USE_ONLINE_COMPRESS: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: "8"
    MC_FORCE_MNNVL: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"
    UCX_TLS: "cuda_copy,rc"
    DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
    SGLANG_LOG_FORWARD_ITERS: "1"
    SGLANG_LOG_MS: "1"
    SGLANG_REQUEST_STATE_WAIT_TIMEOUT: "60"

  sglang_config:
    prefill:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      trust-remote-code: true
      watchdog-timeout: 86400
      skip-tokenizer-init: true
      stream-interval: 60

      tensor-parallel-size: 4
      data-parallel-size: 4
      expert-parallel-size: 4

      enable-dp-attention: true
      moe-a2a-backend: "megamoe"
      moe-dense-tp-size: 1

      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl
      enable-dp-lm-head: true

      mem-fraction-static: 0.90
      max-running-requests: 512
      cuda-graph-max-bs: 512
      chunked-prefill-size: 32768

    decode:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      trust-remote-code: true
      watchdog-timeout: 86400
      skip-tokenizer-init: true
      stream-interval: 60

      moe-a2a-backend: "megamoe"
      moe-dense-tp-size: 1

      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl
      disaggregation-decode-polling-interval: 8

      mem-fraction-static: 0.94
      swa-full-tokens-ratio: 0.20
      context-length: 9216
      tensor-parallel-size: 8
      data-parallel-size: 8
      expert-parallel-size: 8
      enable-dp-attention: true
      enable-dp-lm-head: true
      max-running-requests: 18432
      cuda-graph-max-bs: 1280

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "768"
  req_rate: "inf"
  use_chat_template: false
  custom_tokenizer: "sa_bench_tokenizers.sglang_deepseek_v4.SGLangDeepseekV4Tokenizer"
