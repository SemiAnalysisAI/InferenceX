name: "dsv4-b200-sgl-router-disagg-1p1d-dep8-mtp-agentic"

model:
  path: "deepseek-v4-pro"
  container: "lmsysorg/sglang:v0.5.16-cu130"
  precision: "fp4"

setup_script: native-sgl-router-deps.sh

slurm:
  time_limit: "4:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "b200"
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 8
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 8

infra:
  etcd_nats_dedicated_node: false

frontend:
  type: sgl-router
  enable_multiple_frontends: false
  env:
    PIP_BREAK_SYSTEM_PACKAGES: "1"

backend:
  type: sglang
  prefill_environment: &sglang_environment
    PIP_BREAK_SYSTEM_PACKAGES: "1"
    PYTHONUNBUFFERED: "1"
    SGLANG_DEFAULT_THINKING: "1"
    SGLANG_DSV4_REASONING_EFFORT: "high"
    SGLANG_SIMULATE_ACC_LEN: "2.99"
    SGLANG_SIMULATE_ACC_METHOD: "match-expected"
    SGLANG_SIMULATE_ACC_TOKEN_MODE: "real-draft-token"
    SGLANG_JIT_DEEPGEMM_PRECOMPILE: "1"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
    SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: "1"
    SGLANG_OPT_USE_JIT_INDEXER_METADATA: "1"
    SGLANG_OPT_USE_JIT_NORM: "1"
    SGLANG_OPT_USE_TOPK_V2: "True"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
  decode_environment: *sglang_environment
  sglang_config:
    prefill: &sglang_config
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      enable-metrics: true
      enable-cache-report: true
      trust-remote-code: true
      tool-call-parser: "deepseekv4"
      disaggregation-transfer-backend: "nixl"
      watchdog-timeout: 1800
      stream-interval: 10
      mem-fraction-static: 0.90
      chunked-prefill-size: 8192
      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true
      max-running-requests: 256
      cuda-graph-max-bs: 256
      scheduler-recv-interval: 30
      dp-size: 8
      tp-size: 1
      ep-size: 8
      enable-dp-attention: true
      enable-dp-lm-head: true
      speculative-algorithm: "EAGLE"
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
    decode: *sglang_config

sbatch_directives:
  cpus-per-task: "144"
  mem: "0"

srun_options:
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
