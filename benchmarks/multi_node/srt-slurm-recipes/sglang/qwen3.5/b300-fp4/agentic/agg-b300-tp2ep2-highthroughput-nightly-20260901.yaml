name: agg-b300-tp2ep2-highthroughput-nightly-20260901
model:
  path: qwen3.5-fp4
  container: lmsysorg/sglang:nightly-dev-cu13-20260901-07c8f729
  precision: fp4
slurm:
  time_limit: '08:00:00'
identity:
  model: { repo: nvidia/Qwen3.5-397B-A17B-NVFP4 }
  container: { image: lmsysorg/sglang:nightly-dev-cu13-20260901-07c8f729 }
  frameworks: { sglang: nightly-dev-cu13-20260901-07c8f729 }
health_check:
  max_attempts: 1440
  interval_seconds: 10
resources:
  gpu_type: b300
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 2
infra:
  nats_max_payload_mb: 8
frontend:
  type: sglang
  enable_multiple_frontends: false
backend:
  type: sglang
  aggregated_environment:
    SGLANG_TRTLLM_MHA_DECODE_SEQ_LEN_SPLITS: '2'
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    NO_COLOR: '1'
    PYTHONUNBUFFERED: '1'
    PIP_BREAK_SYSTEM_PACKAGES: '1'
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
    NCCL_MNNVL_ENABLE: '1'
    NCCL_CUMEM_ENABLE: '1'
    NCCL_NVLS_ENABLE: '0'
    MC_FORCE_MNNVL: '1'
    NVSHMEM_REMOTE_TRANSPORT: none
    MC_TE_METRIC: 'true'
    SGLANG_ENABLE_SPEC_V2: '1'
    SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
    SGLANG_ENABLE_JIT_DEEPGEMM: 'false'
    SGLANG_FLASHINFER_FP4_GEMM_BACKEND: cutlass
    SGLANG_MOE_NVFP4_DISPATCH: '1'
    SGLANG_CUTEDSL_MOE_NVFP4_DISPATCH: '1'
    SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '1'
    SGLANG_NCCL_ALL_GATHER_IN_OVERLAP_SCHEDULER_SYNC_BATCH: '1'
    FLASHINFER_DISABLE_VERSION_CHECK: '1'
    SGLANG_DG_CACHE_DIR: /tmp/agentx-pareto-v2/b300-tp2ep2-highthroughput/deepgemm-cache
    FLASHINFER_WORKSPACE_BASE: /tmp/agentx-pareto-v2/b300-tp2ep2-highthroughput/flashinfer-cache
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
    SGLANG_HEALTH_CHECK_TIMEOUT: '1800'
    SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
    SGLANG_CACHE_DIR: /tmp/agentx-pareto-v2/b300-tp2ep2-highthroughput/sglang-cache
    SGLANG_FLASHINFER_AUTOTUNE_CACHE: '1'
    SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: '1'
    SGLANG_SCHEDULER_SKIP_ALL_GATHER: '1'
  sglang_config:
    aggregated:
      served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4
      enable-cache-report: true
      model-path: /model/
      trust-remote-code: true
      quantization: modelopt_fp4
      kv-cache-dtype: fp8_e4m3
      tensor-parallel-size: 2
      pipeline-parallel-size: 1
      data-parallel-size: 1
      expert-parallel-size: 2
      enable-dp-attention: false
      enable-dp-lm-head: false
      enable-symm-mem: false
      mamba-ssm-dtype: bfloat16
      mamba-radix-cache-strategy: extra_buffer
      mamba-track-interval: 1048576
      mamba-max-states-per-path: 1
      max-mamba-cache-size: 512
      context-length: 262144
      page-size: 64
      attention-backend: trtllm_mha
      moe-runner-backend: flashinfer_cutedsl
      linear-attn-prefill-backend: flashinfer
      speculative-algorithm: NEXTN
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      speculative-moe-runner-backend: flashinfer_trtllm
      enable-linear-replayssm-spec: true
      linear-replayssm-cache-len: 8
      mem-fraction-static: 0.85
      max-prefill-tokens: 16384
      chunked-prefill-size: 16384
      max-running-requests: 224
      cuda-graph-max-bs: 224
      tokenizer-worker-num: 6
      stream-interval: 50
      scheduler-recv-interval: 10
      allow-auto-truncate: true
      enable-hierarchical-cache: true
      hicache-ratio: 1.8
      hicache-io-backend: kernel
      hicache-mem-layout: page_first_direct
      hicache-write-policy: write_back
      watchdog-timeout: 1000000
      enable-metrics: true
      enable-dynamic-chunking: false
      weight-loader-drop-cache-after-load: true
sbatch_directives:
  mem: '0'
  cpus-per-task: '144'
srun_options:
  mem: '0'
  container-remap-root: ''
benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    PORT: '8000'
    IS_MULTINODE: 'false'
    TP: '2'
    WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
