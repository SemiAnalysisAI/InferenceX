# V2 mixed quantization uses the CuteDSL MoE path at this saturated wide-EP point.
# Topology and serving knobs are pinned for reproducibility.
name: qwen35-v2-gb200-c5120-7p1d-dep4-dep16-mtp2-cap2048
dynamo:
  install: false
frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 2
  nginx_container: nginx
  args:
    enforce-disagg: true
model:
  path: qwen3.5-fp4
  container: lmsysorg/sglang:nightly-dev-cu13-20260709-074bb928
  precision: fp4
resources:
  gpu_type: gb200
  gpus_per_node: 4
  prefill_nodes: 7
  decode_nodes: 4
  prefill_workers: 7
  decode_workers: 1
backend:
  type: sglang
  prefill_environment:
    NO_COLOR: '1'
    PYTHONUNBUFFERED: '1'
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '3600'
    TORCH_NCCL_WATCHDOG_TIMEOUT_SEC: '3600'
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '3600'
    NCCL_MNNVL_ENABLE: '1'
    NCCL_NVLS_ENABLE: '0'
    NCCL_CUMEM_ENABLE: '1'
    MC_FORCE_MNNVL: '1'
    SGLANG_ENABLE_SPEC_V2: '1'
    SGLANG_DG_CACHE_DIR: /configs/deepgemm-cache
    FLASHINFER_WORKSPACE_BASE: /configs/flashinfer-cache
    SGLANG_ENABLE_JIT_DEEPGEMM: 'true'
    SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
    FLASHINFER_DISABLE_VERSION_CHECK: '1'
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
    SGLANG_HEALTH_CHECK_TIMEOUT: '3600'
    SGLANG_HEALTH_STARTING_OK: '1'
    SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
  decode_environment:
    NO_COLOR: '1'
    PYTHONUNBUFFERED: '1'
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '3600'
    TORCH_NCCL_WATCHDOG_TIMEOUT_SEC: '3600'
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '3600'
    NCCL_MNNVL_ENABLE: '1'
    NCCL_NVLS_ENABLE: '0'
    NCCL_CUMEM_ENABLE: '1'
    MC_FORCE_MNNVL: '1'
    MC_TE_METRIC: 'true'
    SGLANG_ENABLE_SPEC_V2: '1'
    SGLANG_DG_CACHE_DIR: /configs/deepgemm-cache
    FLASHINFER_WORKSPACE_BASE: /configs/flashinfer-cache
    SGLANG_ENABLE_JIT_DEEPGEMM: 'true'
    SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
    FLASHINFER_DISABLE_VERSION_CHECK: '1'
    SGLANG_MOE_NVFP4_DISPATCH: '1'
    SGLANG_FLASHINFER_NUM_MAX_DISPATCH_TOKENS_PER_RANK: '1024'
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
    SGLANG_DECODE_BOOTSTRAP_TIMEOUT: '1000'
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
    SGLANG_HEALTH_CHECK_TIMEOUT: '3600'
    SGLANG_HEALTH_STARTING_OK: '1'
    SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
  sglang_config:
    prefill:
      served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
      model-path: /model
      trust-remote-code: true
      reasoning-parser: qwen3
      tool-call-parser: qwen3_coder
      quantization: modelopt_mixed
      fp4-gemm-backend: flashinfer_cutlass
      kv-cache-dtype: fp8_e4m3
      tensor-parallel-size: 4
      data-parallel-size: 4
      expert-parallel-size: 4
      enable-dp-attention: true
      enable-dp-lm-head: true
      mamba-scheduler-strategy: no_buffer
      mamba-ssm-dtype: bfloat16
      mamba-track-interval: 2048
      attention-backend: trtllm_mha
      mm-attention-backend: triton_attn
      moe-runner-backend: flashinfer_trtllm
      linear-attn-decode-backend: flashinfer
      disaggregation-mode: prefill
      disaggregation-transfer-backend: mooncake
      disable-radix-cache: true
      mem-fraction-static: 0.8
      context-length: 9236
      max-total-tokens: 128000
      max-running-requests: 128
      cuda-graph-max-bs: 4
      chunked-prefill-size: 65536
      max-prefill-tokens: 65536
      scheduler-recv-interval: 1
      stream-interval: 50
      load-balance-method: round_robin
      page-size: 64
      watchdog-timeout: 1000000
      log-level: info
    decode:
      served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
      model-path: /model
      trust-remote-code: true
      reasoning-parser: qwen3
      tool-call-parser: qwen3_coder
      quantization: modelopt_mixed
      fp4-gemm-backend: flashinfer_cutlass
      kv-cache-dtype: fp8_e4m3
      tensor-parallel-size: 16
      data-parallel-size: 16
      expert-parallel-size: 16
      enable-dp-attention: true
      enable-dp-lm-head: true
      mamba-scheduler-strategy: no_buffer
      mamba-ssm-dtype: bfloat16
      mamba-track-interval: 128
      attention-backend: trtllm_mha
      mm-attention-backend: triton_attn
      moe-a2a-backend: flashinfer
      moe-runner-backend: flashinfer_cutedsl
      speculative-moe-a2a-backend: none
      speculative-moe-runner-backend: flashinfer_trtllm
      disable-shared-experts-fusion: true
      linear-attn-decode-backend: flashinfer
      speculative-algorithm: NEXTN
      speculative-num-steps: 2
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 3
      disaggregation-mode: decode
      disaggregation-transfer-backend: mooncake
      disable-radix-cache: true
      cuda-graph-max-bs: 256
      mem-fraction-static: 0.8
      context-length: 9236
      max-total-tokens: 2200000
      max-mamba-cache-size: 2048
      max-running-requests: 2048
      chunked-prefill-size: 4096
      max-prefill-tokens: 32768
      scheduler-recv-interval: 1
      stream-interval: 50
      page-size: 64
      watchdog-timeout: 1000000
      decode-log-interval: 50
health_check:
  max_attempts: 360
  interval_seconds: 10
benchmark:
  type: sa-bench
  isl: 8192
  osl: 1024
  concurrencies: '5120'
  req_rate: inf
  random_range_ratio: 0.8
  num_prompts_mult: 10
  num_warmup_mult: 2
  use_chat_template: true
