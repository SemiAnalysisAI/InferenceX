# Model-specific SGLang server configurations for disaggregated inference.
#
# Each top-level key is a MODEL_NAME value (must match the directory name under MODEL_DIR).
#
# To add a new model: add a new top-level entry following the same schema.
# No script changes are required.
#
# Schema:
#   <model-name>:
#     base_flags: str          # Common flags for both prefill and decode
#     mtp_flags: str           # Appended to decode when DECODE_MTP_SIZE > 0
#     dp_flags: str            # Appended when DP attention is enabled (prefill or decode)
#     ep_flags: str            # Appended when EP is enabled. EP-specific MoE knobs only
#                              # (a2a backend, deepep mode, ep-dispatch algorithm). With
#                              # ep=1 these are dropped so the MoE runs tensor-parallel (TP).
#     prefill:
#       mem_fraction_static: float
#       disable_radix_cache: bool
#       dp:                              # Config when data-parallel attention is enabled
#         max_running_requests: int
#         chunked_prefill_size: str      # Can be integer or bash arithmetic expression
#         cuda_graph_bs: str             # Space-separated values
#       no_dp:                           # Config when data-parallel attention is disabled
#         max_running_requests: int
#         chunked_prefill_size: int
#         cuda_graph_bs_range: str       # "start-end" expanded via seq
#     decode:
#       mem_fraction_static: float
#       dp:
#         max_running_requests: int
#         chunked_prefill_size: str
#         cuda_graph_bs_range: str
#       ep_only:                         # Config when EP is enabled but DP is disabled
#         max_running_requests: int
#         chunked_prefill_size: int
#         cuda_graph_bs_range: str
#       no_dp:
#         max_running_requests: int
#         chunked_prefill_size: int
#         cuda_graph_bs_range: str

DeepSeek-V4-Pro-AgentX: &DeepSeek-V4-Pro-AgentX
  base_flags: "--enable-deepseek-v4-fp4-indexer --watchdog-timeout 3600 --load-balance-method round_robin --kv-cache-dtype fp8_e4m3 --attention-backend dsv4 --page-size 256 --swa-full-tokens-ratio 0.1 --enforce-shared-experts-fusion --tool-call-parser deepseekv4 --reasoning-parser deepseek-v4 --disaggregation-transfer-backend mori --tokenizer-worker-num 8 --stream-interval 20 --log-level info --log-level-http error"
  # --enable-dp-lm-head is required by SGLang for DSpark under DP attention; it
  # is harmless for the EAGLE/MTP arms, so it stays unconditional here rather
  # than needing a second DP flag string.
  dp_flags: "--enable-dp-attention --enable-dp-lm-head --swa-full-tokens-ratio 0.15 --enable-dp-attention-local-control-broadcast"
  ep_flags: "--ep-dispatch-algorithm fake --moe-a2a-backend mori --deepep-mode normal"
  mtp_flags: "--speculative-algorithm EAGLE --speculative-eagle-topk 1"
  # DSpark draft head, selected when the sweep sets spec-decoding: draft_model.
  # Kept alongside mtp_flags rather than replacing it, so recipes that stay on
  # spec-decoding: mtp keep the EAGLE arm untouched. The -0813 checkpoint
  # bundles the draft head (dspark_block_size / dspark_markov_rank /
  # dspark_target_layer_ids in config.json), so --speculative-draft-model-path
  # defaults to --model-path and no separate draft checkpoint is needed.
  # server_sglang.sh appends the block size and the verify window from
  # DECODE_MTP_SIZE (= gamma); unlike EAGLE, num-steps is pinned to 1.
  dspark_flags: "--speculative-algorithm DSPARK --speculative-eagle-topk 1"
  prefill:
    disable_radix_cache: false
    disable_cuda_graph: true
    dp:
      # Scales with the sweep's own concurrency (2x headroom) rather than a
      # fixed cap;
      mem_fraction_static: 0.92
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      chunked_prefill_size: "8192 * PREFILL_TP_SIZE"
      context_length: 1048576
      enable_two_batch_overlap: false
    no_dp:
      mem_fraction_static: 0.86
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      chunked_prefill_size: "16384"
      context_length: 1048576
  decode:
    disagg_decode_enable_radix_cache: false
    dp:
      mem_fraction_static: 0.92
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      cuda_graph_bs_range: "1-BENCH_MAX_CONC_VALUE/4"
    no_dp:
      mem_fraction_static: 0.86
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      cuda_graph_bs_range: "1-BENCH_MAX_CONC_VALUE*2"

# Pro-0813 serves the PD path with DSPARK (spec-decoding: draft_model), which
# measured clean across c4-c256; the EAGLE 3-1-4 arm remains available through
# spec-decoding: mtp. Synthetic acceptance is checkpoint-specific in
# server_sglang.sh and does not depend on which of the two runs: thinking-on,
# draft lengths 1-8 are wired from golden_al_distribution/dsv4-pro-0813-dspark.yaml.
DeepSeek-V4-Pro-0813-AgentX: *DeepSeek-V4-Pro-AgentX
