DeepSeek-V4-Pro-AgentX: &DeepSeek-V4-Pro-AgentX
  base_flags: "--enable-deepseek-v4-fp4-indexer --watchdog-timeout 3600 --load-balance-method round_robin --kv-cache-dtype fp8_e4m3 --attention-backend dsv4 --page-size 256 --swa-full-tokens-ratio 0.1 --tool-call-parser deepseekv4 --reasoning-parser deepseek-v4 --disaggregation-transfer-backend mori --log-level info --log-level-http error"
  # --enforce-shared-experts-fusion and dp_flags' --disable-shared-experts-fusion
  # are documented by sglang as mutually exclusive (server_args.py), so each lives
  # in its own bucket (no_dp_flags / dp_flags) rather than both riding on the
  # command line at once relying on DeepseekV4ForCausalLM's internal check order.
  no_dp_flags: "--enforce-shared-experts-fusion"
  dp_flags: "--enable-dp-attention --enforce-shared-experts-fusion --swa-full-tokens-ratio 0.15 --enable-dp-attention-local-control-broadcast --tokenizer-worker-num 8 --stream-interval 20 --prefill-decode-interval 10"
  ep_flags: "--ep-dispatch-algorithm fake --moe-a2a-backend mori --deepep-mode normal"
  mtp_flags: "--speculative-algorithm EAGLE --speculative-eagle-topk 1"
  prefill:
    disable_radix_cache: false
    disable_cuda_graph: true
    dp:
      # Scales with the sweep's own concurrency (2x headroom) rather than a
      # fixed cap;
      mem_fraction_static: 0.92
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      chunked_prefill_size: "8192 * PREFILL_TP_SIZE"
      context_length: 1048576
      enable_two_batch_overlap: false
    no_dp:
      mem_fraction_static: 0.86
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      chunked_prefill_size: "16384"
      context_length: 1048576
  decode:
    prefill_round_robin_balance: true
    disagg_decode_enable_radix_cache: false
    dp:
      mem_fraction_static: 0.92
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      cuda_graph_bs_range: "1-BENCH_MAX_CONC_VALUE/4"
    no_dp:
      mem_fraction_static: 0.86
      max_running_requests: "BENCH_MAX_CONC_VALUE*2"
      cuda_graph_bs_range: "1-BENCH_MAX_CONC_VALUE*2"

# Alias for the -0813 dated checkpoint: same serving flags/behavior as the base
# DeepSeek-V4-Pro AgentX recipe (native EAGLE/MTP), just a different staged
# checkpoint. Not to be confused with the DSpark-specific recipes elsewhere,
# which use spec-decoding: draft_model and DSpark CLI flags instead.
DeepSeek-V4-Pro-0813-AgentX: *DeepSeek-V4-Pro-AgentX

DeepSeek-V4-Pro-DI: &DeepSeek-V4-Pro-DI
  base_flags: "--decode-log-interval 100 --log-level info --watchdog-timeout 3600 --load-balance-method round_robin --kv-cache-dtype fp8_e4m3 --attention-backend dsv4 --page-size 256 --swa-full-tokens-ratio 0.1 --disable-shared-experts-fusion --tool-call-parser deepseekv4 --reasoning-parser deepseek-v4 --disaggregation-transfer-backend mori"
  # DeepSeek-V4 built-in MTP: load via the EAGLE spec path with eagle-topk 1 (a single
  # MTP chain). NOT NEXTN -- the V3/R1 NEXTN loader crashes the dsv4 decode server at
  # init on the V4 architecture. Mirrors the sglang dsv4 recipes
  # (srt-slurm-recipes/sglang/deepseek-v4/*: EAGLE + eagle-topk 1, in-checkpoint draft,
  # no draft-model-path). Consumed by build_server_config only when DECODE_MTP_SIZE > 0
  # (spec-decoding: mtp); a no-op for the spec-none base scenario (DECODE_MTP_SIZE=0).
  # build_server_config appends --speculative-num-steps/--speculative-num-draft-tokens
  # from DECODE_MTP_SIZE.
  mtp_flags: "--speculative-algorithm EAGLE --speculative-eagle-topk 1"
  dp_flags: "--enable-dp-attention --moe-dense-tp-size 1 --enable-dp-lm-head"
  ep_flags: "--ep-dispatch-algorithm fake --moe-a2a-backend mori --deepep-mode normal"
  prefill:
    mem_fraction_static: 0.8
    disable_radix_cache: true
    disable_cuda_graph: true
    dp:
      max_running_requests: 1024
      chunked_prefill_size: 131072
      context_length: 9217
      max_total_tokens: 2097152
    no_dp:
      max_running_requests: 128
      chunked_prefill_size: 131072
      context_length: 9217
      max_total_tokens: 2097152
  decode:
    mem_fraction_static: 0.85
    prefill_round_robin_balance: true
    dp:
      max_running_requests: 1024
      cuda_graph_bs_range: "1-128"
    no_dp:
      max_running_requests: 128
      cuda_graph_bs_range: "1-128"

# Alias for the -0813 dated checkpoint: same serving flags/behavior as the base
# DeepSeek-V4-Pro DI recipe (native EAGLE/MTP), just a different staged
# checkpoint. See the AgentX alias above for details.
DeepSeek-V4-Pro-0813-DI: *DeepSeek-V4-Pro-DI
