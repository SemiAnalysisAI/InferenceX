# Model-specific ATOM server configurations for disaggregated inference.
#
# Each top-level key is a MODEL_NAME value (must match the directory name under MODEL_DIR).
#
# To add a new model: add a new top-level entry following the same schema.
# No script changes are required.
#
# Schema:
#   <model-name>:
#     env:          str  # Space-separated KEY=VALUE pairs exported unconditionally
#     tp_dp_flags:  str  # Shared TP+DPA flags (fallback when prefill/decode-specific keys are absent)
#     prefill_tp_dp_flags: str  # TP+DPA flags for prefill only (overrides tp_dp_flags)
#     decode_tp_dp_flags:  str  # TP+DPA flags for decode only (overrides tp_dp_flags)
#     tp_dp_env:    str  # Space-separated KEY=VALUE pairs exported only in TP+DPA mode
#     ep_dp_flags:  str  # Shared EP+DPA flags (fallback when prefill/decode-specific keys are absent)
#     prefill_ep_dp_flags: str  # EP+DPA flags for prefill only (overrides ep_dp_flags)
#     decode_ep_dp_flags:  str  # EP+DPA flags for decode only (overrides ep_dp_flags)
#     ep_dp_env:    str  # Space-separated KEY=VALUE pairs exported only in EP+DPA mode
#     mtp_flags:    str  # Flags passed to SPEC_ARGS before $DECODE_MTP_SIZE (e.g. "--method mtp --num-speculative-tokens")
#     kv_cache_flags: str  # Full --kv_cache_dtype flag string (e.g. "--kv_cache_dtype fp8", or "" for none)
#     online_quant_config: str  # JSON string passed to --online_quant_config (used when DPA is disabled)
#     online_quant_dpa_config: str  # JSON string passed to --online_quant_config when DPA is enabled (falls back to online_quant_config)
#     block_size:   str  # --block-size value (overrides server_atom.sh default of 16)
#     mem_frac_static: str  # --gpu-memory-utilization value (overrides default of 0.85)
#     max_model_len: str  # --max-model-len value (overrides default of unset)
#     max_num_seqs:  str  # --max-num-seqs value (overrides default of 256)
#     max_num_batched_tokens: str  # --max-num-batched-tokens value (overrides default of unset)
#     scheduler_delay_factor: str  # --scheduler-delay-factor value (overrides default of unset)
#   Agentic-only (applied by server_atom.sh only when IS_AGENTIC=1):
#     attn_prefill_chunk_size: str  # --attn-prefill-chunk-size value (unset = omit)
#     state_checkpoint_interval_tokens: str  # --state-checkpoint-interval-tokens value (unset = omit)
#     level: str  # --level value (unset = omit)
#     spec_decode_acceptance_length: str  # --spec-decode-acceptance-length (synthetic AL on throughput runs; unset = omit)

# Agentic (AgentX trace-replay) variant of DeepSeek-V4-Pro on ATOM PD. Resolved
# by job.slurm/server_atom.sh as '<MODEL_NAME>-AgentX' when IS_AGENTIC=1. Differs
# from the throughput entry above per ATOM recipes/DeepSeek-V4-Agentic-PD-Max.md:
# prefix caching (server_atom.sh IS_AGENTIC branch), FP8 KV/index cache, TBO on
# prefill only, agentic prefill-chunk / state-checkpoint / level knobs, and MTP
# with synthetic acceptance on throughput runs.
DeepSeek-V4-Pro-AgentX: &DeepSeek-V4-Pro-AgentX
  # Rail-isolated RDMA: matched rails replace dest-device affinity. Omit
  # ATOM_MOONCAKE_MATCHED_RAILS if every default P/D HCA pair is mutually
  # reachable on the fabric.
  env: "ATOM_MOE_GU_ITLV=1 AITER_BF16_FP8_MOE_BOUND=0 MC_GID_INDEX=1 ATOM_MOONCAKE_MATCHED_RAILS=auto NCCL_IB_DISABLE=1 ATOM_DISABLE_MMAP=true ATOM_PREFIX_CACHE_POLICY=lru ATOM_PREFIX_CACHE_PROTECTED_RATIO=0.5"
  kv_cache_flags: "--kv_cache_dtype fp8 --index-cache-dtype fp4"
  # DP-attention tiers (conc 64+): TBO is prefill-only per the recipe.
  tp_dp_flags: "--enable-dp-attention"
  prefill_tp_dp_flags: "--enable-dp-attention --enable-tbo"
  decode_tp_dp_flags: "--enable-dp-attention"
  ep_dp_flags: "--enable-expert-parallel --enable-dp-attention"
  prefill_ep_dp_flags: "--enable-expert-parallel --enable-dp-attention --enable-tbo"
  decode_ep_dp_flags: "--enable-expert-parallel --enable-dp-attention"
  # Shared DP env for the agentic DP-attention tiers (prefill and decode). Under
  # --dp-aware the cache-aware router sends explicit P/D rank hints that take
  # priority over engine-local session affinity and load balancing, so
  # ATOM_DP_SESSION_AFFINITY and ATOM_DP_LB_REQ_EQUIV are not needed on this
  # routing path (recipe). Cross-DP prefill coalescing (ATOM_ENABLE_PREFILL_DELAYER=0)
  # is off on both roles per the recipe.
  tp_dp_env: "ATOM_NUMA_BIND=1 ATOM_DP_MASTER_PORT=29510 ATOM_DP_BASE_PORT=29610 ATOM_ENABLE_PREFILL_DELAYER=0"
  ep_dp_env: "ATOM_NUMA_BIND=1 ATOM_DP_MASTER_PORT=29510 ATOM_DP_BASE_PORT=29610 ATOM_ENABLE_PREFILL_DELAYER=0"
  # Prefill-only DP env: the recipe sets GPU_MAX_HW_QUEUES=5 on the DP-attention
  # prefill node and leaves decode unset. server_atom.sh applies this on prefill
  # nodes only.
  prefill_dp_env: "GPU_MAX_HW_QUEUES=5"
  mtp_flags: "--method dspark --num-speculative-tokens"
  # config.py forces block-size 256 for V4 (lcm(4,128)); 16 is ignored/misleading.
  block_size: "256"
  mem_frac_static: "0.9"
  max_num_batched_tokens: "16384"
  # Agentic-only server knobs consumed by server_atom.sh IS_AGENTIC branch.
  attn_prefill_chunk_size: "16384"
  state_checkpoint_interval_tokens: "8192"
  level: "3"
  spec_decode_acceptance_length: "3.01"

# The PD-Max recipe runs DSpark, which needs the draft head bundled in the
# -0813 config.json. Same alias split as models.yaml on the SGLang side.
DeepSeek-V4-Pro-0813-AgentX: *DeepSeek-V4-Pro-AgentX
