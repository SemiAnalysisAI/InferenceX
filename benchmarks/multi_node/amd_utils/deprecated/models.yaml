# Historical server registry entries; excluded from active server lookup.

GLM-5-FP8:
  base_flags: "--decode-log-interval 1000 --log-level warning --watchdog-timeout 3600 --load-balance-method round_robin --disaggregation-transfer-backend mori --tool-call-parser glm47 --reasoning-parser glm45 --model-loader-extra-config '{\\\"enable_multithread_load\\\": true, \\\"num_threads\\\": 8}'"
  mtp_flags: ""
  dp_flags: "--enable-dp-attention --moe-dense-tp-size 1 --enable-dp-lm-head"
  ep_flags: "--moe-a2a-backend mori"
  prefill:
    mem_fraction_static: 0.8
    disable_radix_cache: true
    dp:
      max_running_requests: 24
      chunked_prefill_size: "MORI_MAX_DISPATCH_TOKENS_PREFILL * PREFILL_TP_SIZE"
      cuda_graph_bs: "1 2 3"
    no_dp:
      max_running_requests: 128
      chunked_prefill_size: 262144
      cuda_graph_bs_range: "1-128"
  decode:
    mem_fraction_static: 0.85
    dp:
      max_running_requests: 4096
      chunked_prefill_size: "MORI_MAX_DISPATCH_TOKENS_DECODE * DECODE_TP_SIZE"
      cuda_graph_bs_range: "1-160"
    ep_only:
      max_running_requests: 256
      chunked_prefill_size: 262144
      cuda_graph_bs_range: "1-256"
    no_dp:
      max_running_requests: 128
      chunked_prefill_size: 262144
      cuda_graph_bs_range: "1-128"


DeepSeek-V4-Pro-DI:
  base_flags: "--decode-log-interval 100 --log-level info --watchdog-timeout 3600 --load-balance-method round_robin --kv-cache-dtype fp8_e4m3 --attention-backend dsv4 --page-size 256 --swa-full-tokens-ratio 0.1 --disable-shared-experts-fusion --tool-call-parser deepseekv4 --reasoning-parser deepseek-v4 --disaggregation-transfer-backend mori"
  # DeepSeek-V4 built-in MTP: load via the EAGLE spec path with eagle-topk 1 (a single
  # MTP chain). NOT NEXTN -- the V3/R1 NEXTN loader crashes the dsv4 decode server at
  # init on the V4 architecture. Mirrors the sglang dsv4 recipes
  # (srt-slurm-recipes/dsv4/sglang/*: EAGLE + eagle-topk 1, in-checkpoint draft,
  # no draft-model-path). Consumed by build_server_config only when DECODE_MTP_SIZE > 0
  # (spec-decoding: mtp); a no-op for the spec-none base scenario (DECODE_MTP_SIZE=0).
  # build_server_config appends --speculative-num-steps/--speculative-num-draft-tokens
  # from DECODE_MTP_SIZE.
  mtp_flags: "--speculative-algorithm EAGLE --speculative-eagle-topk 1"
  dp_flags: "--enable-dp-attention --moe-dense-tp-size 1 --enable-dp-lm-head"
  ep_flags: "--ep-dispatch-algorithm fake --moe-a2a-backend mori --deepep-mode normal"
  prefill:
    mem_fraction_static: 0.8
    disable_radix_cache: true
    disable_cuda_graph: true
    dp:
      max_running_requests: 1024
      chunked_prefill_size: 131072
      context_length: 9217
      max_total_tokens: 2097152
    no_dp:
      max_running_requests: 128
      chunked_prefill_size: 131072
      context_length: 9217
      max_total_tokens: 2097152
  decode:
    mem_fraction_static: 0.85
    dp:
      max_running_requests: 1024
      cuda_graph_bs_range: "1-128"
    no_dp:
      max_running_requests: 128
      cuda_graph_bs_range: "1-128"
