# MiniMax-M3 MXFP8 AgentX on MI325X with vLLM EAGLE3 (GQA draft). The KV cache
# is GPU-resident.
base:
  schema: 2
  name: minimaxm3-fp8-mi325x-vllm-agentic
  model:
    path: hf:MiniMaxAI/MiniMax-M3-MXFP8
    container: vllm/vllm-openai-rocm:v0.27.1
    precision: fp8
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: MiniMaxAI/MiniMax-M3-MXFP8
        tensor-parallel-size: 8
        gpu-memory-utilization: 0.90
        kv-cache-dtype: fp8
        block-size: 128
        language-model-only: true
        attention-backend: TRITON_ATTN
        enable-prefix-caching: true
        enable-chunked-prefill: true
        max-num-batched-tokens: 32768
        # Three-token EAGLE3; throughput runs replace verification with the
        # golden acceptance length.
        speculative-config: '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3-GQA", "num_speculative_tokens": 3, "attention_backend": "TRITON_ATTN"}'
        tool-call-parser: minimax_m3
        reasoning-parser: minimax_m3
        enable-auto-tool-choice: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        trust-remote-code: true
        stream-interval: 20
      env:
        PYTHONNOUSERSITE: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
        VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: MiniMaxAI/MiniMax-M3-MXFP8
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'

# One variant per point. Admission is 2x CONC.
override_tp8_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
  benchmark:
    env:
      CONC: '1'

override_tp8_c2:
  roles:
    agg:
      args:
        max-num-seqs: 4
  benchmark:
    env:
      CONC: '2'

override_tp8_c4:
  roles:
    agg:
      args:
        max-num-seqs: 8
  benchmark:
    env:
      CONC: '4'

override_tp8_c8:
  roles:
    agg:
      args:
        max-num-seqs: 16
  benchmark:
    env:
      CONC: '8'

override_tp8_c10:
  roles:
    agg:
      args:
        max-num-seqs: 20
  benchmark:
    env:
      CONC: '10'

override_tp8_c12:
  roles:
    agg:
      args:
        max-num-seqs: 24
  benchmark:
    env:
      CONC: '12'

override_tp8_c14:
  roles:
    agg:
      args:
        max-num-seqs: 28
  benchmark:
    env:
      CONC: '14'

override_tp8_c16:
  roles:
    agg:
      args:
        max-num-seqs: 32
  benchmark:
    env:
      CONC: '16'

override_tp8_c18:
  roles:
    agg:
      args:
        max-num-seqs: 36
  benchmark:
    env:
      CONC: '18'
