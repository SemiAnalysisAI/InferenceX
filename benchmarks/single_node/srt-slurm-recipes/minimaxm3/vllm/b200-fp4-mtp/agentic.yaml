override_tp4_c15_dram:
  setup_script: vllm-simple-kv-offload.sh
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":1161788653568,"lazy_offload":true}}'
      env:
        VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
  benchmark:
    env:
      CONC: '15'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1082'

