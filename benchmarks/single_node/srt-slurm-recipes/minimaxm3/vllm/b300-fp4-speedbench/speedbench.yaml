# MiniMax-M3 B300 vLLM SPEED-Bench AL matrix (EAGLE3, MHA draft head).
#
# External draft model: Inferact/MiniMax-M3-EAGLE3. The EAGLE3 head is MHA
# and must use FLASH_ATTN (FlashInfer only supports page size 128 through its
# trtllm-gen kernel, which needs GQA/MQA); the target keeps its default
# FlashInfer backend. --block-size 128 is mandatory for the MSA sparse/index
# cache. --language-model-only frees the vision encoder VRAM (text-only
# benchmark). The staged MiniMax-M3 weights are unquantized BF16, so no
# quantization-specific flags (--moe-backend marlin, --kv-cache-dtype fp8)
# apply.
#
# Official MiniMax-M3 sampling: temperature 1.0, top_p 0.95, top_k 40.
# Thinking toggles via the thinking_mode chat_template key.
base:
  schema: 2
  name: minimaxm3-fp4-b300-vllm-speedbench
  model:
    path: hf:MiniMax/MiniMax-M3
    container: vllm/vllm-openai:nightly-dev-x86_64-cu13-af03963
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
    # Bind GPUs via CUDA_VISIBLE_DEVICES for image compatibility.
    set_visible_devices: true
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: MiniMax/MiniMax-M3
        tensor-parallel-size: 8
        data-parallel-size: 1
        pipeline-parallel-size: 1
        block-size: 128
        language-model-only: true
        max-cudagraph-capture-size: 2048
        trust-remote-code: true
        no-enable-prefix-caching: true
        gpu-memory-utilization: 0.90
        max-model-len: 16384
        max-num-batched-tokens: 16384
        stream-interval: 30
      env:
        VLLM_FLOAT32_MATMUL_PRECISION: high
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_speedbench.sh
    env:
      MODEL: MiniMax/MiniMax-M3
      SPEC_DECODING: mtp
      TEMPERATURE: '1.0'
      TOP_P: '0.95'
      TOP_K: '40'
      CHAT_TEMPLATE_KWARGS_OFF: '{"thinking_mode": "disabled"}'
      SPEEDBENCH_TRUST_REMOTE_CODE: '1'
      APPLY_CHAT_TEMPLATE_KWARGS_SHIM: '1'

zip_override_mtp:
  roles:
    agg:
      args:
        speculative-config:
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":1,"attention_backend":"FLASH_ATTN"}'
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":2,"attention_backend":"FLASH_ATTN"}'
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN"}'
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":4,"attention_backend":"FLASH_ATTN"}'
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":5,"attention_backend":"FLASH_ATTN"}'
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":6,"attention_backend":"FLASH_ATTN"}'
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":7,"attention_backend":"FLASH_ATTN"}'
          - '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3","num_speculative_tokens":8,"attention_backend":"FLASH_ATTN"}'
