        "${pip_install[@]}" --no-cache-dir --no-deps --force-reinstall mooncake-transfer-engine-cuda13==0.3.11.post1
      args:
        - '--eviction_high_watermark_ratio=0.80'
        - '--eviction_ratio=0.10'
      options:
        store_config:
          mode: embedded
          metadata_server: P2PHANDSHAKE
