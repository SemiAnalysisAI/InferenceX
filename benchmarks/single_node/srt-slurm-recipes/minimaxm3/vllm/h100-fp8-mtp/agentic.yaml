# MiniMax-M3 MXFP8 AgentX on H100 with vLLM EAGLE3 (the GQA draft head) and
# optional Mooncake DRAM KV offload. 26 GiB of weights per GPU live in host memory.
base:
  schema: 2
  name: minimaxm3-fp8-h100-vllm-agentic
  model:
    path: hf:MiniMaxAI/MiniMax-M3-MXFP8
    container: vllm/vllm-openai:v0.27.1
    precision: fp8
  resources:
    gpu_type: h100
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  # Lazy loads of the 31 shards from shared NFS ran at ~105 s/shard, past the
  # script's 3600 s, so both windows are two hours.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: MiniMaxAI/MiniMax-M3-MXFP8
        tensor-parallel-size: 8
        data-parallel-size: 1
        gpu-memory-utilization: 0.90
        cpu-offload-gb: 26
        attention-backend: TRITON_ATTN
        safetensors-load-strategy: lazy
        kv-cache-dtype: fp8
        block-size: 128
        language-model-only: true
        enable-prefix-caching: true
        enable-prompt-tokens-details: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        # Three-token EAGLE3 with the GQA draft head. Throughput runs switch to
        # synthetic rejection at the golden acceptance length.
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN"}'
        tool-call-parser: minimax_m3
        reasoning-parser: minimax_m3
        enable-auto-tool-choice: true
        trust-remote-code: true
      env:
        PYTHONNOUSERSITE: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: MiniMaxAI/MiniMax-M3-MXFP8
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126

# One variant per point. The scheduler batch is 2x CONC and graph capture covers
# it at four tokens per sequence (three drafts).
override_tp8_c1:
  roles:
    agg:
      args:
        max-num-seqs: 2
        max-cudagraph-capture-size: 8
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: none

override_tp8_c2:
  roles:
    agg:
      args:
        max-num-seqs: 4
        max-cudagraph-capture-size: 16
  benchmark:
    env:
      CONC: '2'
      KV_OFFLOADING: none

override_tp8_c3:
  roles:
    agg:
      args:
        max-num-seqs: 6
        max-cudagraph-capture-size: 24
  benchmark:
    env:
      CONC: '3'
      KV_OFFLOADING: none

override_tp8_c4:
  roles:
    agg:
      args:
        max-num-seqs: 8
        max-cudagraph-capture-size: 32
  benchmark:
    env:
      CONC: '4'
      KV_OFFLOADING: none

override_tp8_c5:
  roles:
    agg:
      args:
        max-num-seqs: 10
        max-cudagraph-capture-size: 40
  benchmark:
    env:
      CONC: '5'
      KV_OFFLOADING: none

# DRAM points offload KV to an embedded Mooncake store. Per rank: the host budget
# (1731 GB = 1612 GiB) less the 414 GiB checkpoint page cache, over TP8, less the
# 26 GiB CPU weight offload and the 4 GiB local buffer = 119 GB.
override_tp8_c6_dram:
  # The worker's Mooncake client and the master run the same pinned release.
  setup_script: vllm-mooncake-0.3.11.sh
  services:
    - name: mooncake-master
      type: mooncake-master
      # The in-container install outlasts the default 120 s readiness window.
      readiness:
        port: 8700
        timeout_seconds: 900
      preamble: >-
        pip_install=(python3 -m pip install);
        python3 -m pip install --help 2>/dev/null | grep -q -- --break-system-packages && pip_install+=(--break-system-packages);
        "${pip_install[@]}" --no-cache-dir --no-deps --force-reinstall mooncake-transfer-engine-cuda13==0.3.11.post1
      args:
        - '--eviction_high_watermark_ratio=0.80'
        - '--eviction_ratio=0.10'
      options:
        store_config:
          mode: embedded
          metadata_server: P2PHANDSHAKE
          global_segment_size: 119GB
          local_buffer_size: 4GB
          protocol: rdma
          device_name: ''
          enable_offload: false
  roles:
    agg:
      args:
        max-num-seqs: 12
        max-cudagraph-capture-size: 48
        kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true}}'
      env:
        PYTHONHASHSEED: '0'
        MC_SLICE_SIZE: '1048576'
        MC_WORKERS_PER_CTX: '4'
        MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
  benchmark:
    env:
      CONC: '6'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1731'

