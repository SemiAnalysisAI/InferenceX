override_tp8_c20:
  roles:
    agg:
      args:
        max-running-requests: 40
        cuda-graph-max-bs-decode: 64
        swa-prefix-tails: 640
  benchmark:
    env:
      CONC: '20'

# DP8 attention: the shipped MoE DSpark worker requires attn_tp=1. SGLang divides
# the engine-wide 4096-token chunk by DP (512 tokens/rank). The DP-aware router
# hashes AIPerf's per-session correlation ID so prefixes stay on one rank.
override_dp8_c4:
  frontend:
    type: sglang-router
    args:
      policy: consistent_hashing
      request-id-headers: x-correlation-id
      dp-aware: true
      connect-timeout-secs: 900
      request-timeout-secs: 14400
      disable-health-check: true
      disable-retries: true
  roles:
    agg:
      args:
        data-parallel-size: 8
        enable-dp-attention: true
        enable-dp-lm-head: true
        max-running-requests: 8
        cuda-graph-max-bs-decode: 64
        swa-prefix-tails: 64
  benchmark:
    env:
      CONC: '4'
      AIPERF_HTTP_X_SMG_ROUTING_KEY_FROM_CORRELATION_ID: 'true'

override_dp8_c8:
  frontend:
    type: sglang-router
    args:
      policy: consistent_hashing
      request-id-headers: x-correlation-id
      dp-aware: true
      connect-timeout-secs: 900
      request-timeout-secs: 14400
      disable-health-check: true
      disable-retries: true
  roles:
    agg:
      args:
        data-parallel-size: 8
        enable-dp-attention: true
        enable-dp-lm-head: true
