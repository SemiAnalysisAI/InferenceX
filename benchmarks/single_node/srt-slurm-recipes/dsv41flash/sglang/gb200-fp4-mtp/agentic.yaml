# DeepSeek-V4.1-Flash AgentX on GB200 with SGLang native DSpark. The KV cache
# is GPU-resident.
base:
  schema: 2
  name: dsv41flash-fp4-gb200-sglang-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: lmsysorg/sglang:nightly-dev-cu13-20260923-06008c17@sha256:5921361fcf358cdde4df1968c941c14157f418613b099ad7f3e5aeed6427ae15
    precision: fp4
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        trust-remote-code: true
        # DSpark is the checkpoint's bundled draft; the block size is its only knob.
        speculative-algorithm: DSPARK
        speculative-dspark-block-size: 5
        reasoning-parser: auto
        tool-call-parser: auto
        # Draft passes under long-context load outlast the 1800 s default watchdog.
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # AgentX measures thinking on, the regime of the golden acceptance curve.
        SGLANG_DEFAULT_THINKING: '1'
        SGLANG_DSV41_REASONING_EFFORT: high
        # Row-sharded host Engram tables free HBM for the 1M-context working set.
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
        SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. TP4: static fraction 0.70, 4096-token prefill chunks,
# 64-request graph batch. TP2 needs 0.92, 2048-token chunks, a 16-request graph
# batch and expandable segments to fit. Admission is 2x CONC, capped at the graph
# batch. SWA prefix tails are 64x CONC (TP2 128x), capped at 1024. Decode
# interleaving applies to TP2 and c16. Saturation points get a longer warmup drain.
override_tp4_c1: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 64, cuda-graph-max-bs-decode: 64, max-running-requests: 2}}}, benchmark: {env: {CONC: '1', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp4_c2: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 128, cuda-graph-max-bs-decode: 64, max-running-requests: 4}}}, benchmark: {env: {CONC: '2', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp4_c4: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 256, cuda-graph-max-bs-decode: 64, max-running-requests: 8}}}, benchmark: {env: {CONC: '4', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp4_c8: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 512, cuda-graph-max-bs-decode: 64, max-running-requests: 16}}}, benchmark: {env: {CONC: '8', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp4_c16: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 1024, cuda-graph-max-bs-decode: 64, max-running-requests: 32, prefill-decode-interval: 16}}}, benchmark: {env: {CONC: '16', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp4_c32: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 1024, cuda-graph-max-bs-decode: 64, max-running-requests: 64}}}, benchmark: {env: {CONC: '32', AGENTIC_WARMUP_GRACE_PERIOD: '3600'}}}
override_tp4_c64: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 1024, cuda-graph-max-bs-decode: 64, max-running-requests: 64}}}, benchmark: {env: {CONC: '64', AGENTIC_WARMUP_GRACE_PERIOD: '3600'}}}
override_tp4_c128: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, mem-fraction-static: 0.7, chunked-prefill-size: 4096, swa-prefix-tails: 1024, cuda-graph-max-bs-decode: 64, max-running-requests: 64}}}, benchmark: {env: {CONC: '128', AGENTIC_WARMUP_GRACE_PERIOD: '3600'}}}
override_tp2_c1: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, mem-fraction-static: 0.92, chunked-prefill-size: 2048, swa-prefix-tails: 128, cuda-graph-max-bs-decode: 16, max-running-requests: 2, prefill-decode-interval: 16}, env: {PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'}}}, benchmark: {env: {CONC: '1', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp2_c2: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, mem-fraction-static: 0.92, chunked-prefill-size: 2048, swa-prefix-tails: 256, cuda-graph-max-bs-decode: 16, max-running-requests: 4, prefill-decode-interval: 16}, env: {PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'}}}, benchmark: {env: {CONC: '2', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp2_c4: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, mem-fraction-static: 0.92, chunked-prefill-size: 2048, swa-prefix-tails: 512, cuda-graph-max-bs-decode: 16, max-running-requests: 8, prefill-decode-interval: 16}, env: {PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'}}}, benchmark: {env: {CONC: '4', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
override_tp2_c8: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, mem-fraction-static: 0.92, chunked-prefill-size: 2048, swa-prefix-tails: 1024, cuda-graph-max-bs-decode: 16, max-running-requests: 16, prefill-decode-interval: 16}, env: {PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'}}}, benchmark: {env: {CONC: '8', AGENTIC_WARMUP_GRACE_PERIOD: '1800'}}}
