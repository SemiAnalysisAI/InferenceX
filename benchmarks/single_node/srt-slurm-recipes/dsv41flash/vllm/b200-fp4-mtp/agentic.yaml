# DeepSeek-V4.1-Flash AgentX on B200 with vLLM native DSpark
# (https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash). Engram weights use
# UVA DRAM; the KV cache is GPU-resident.
base:
  schema: 2
  name: dsv41flash-fp4-b200-vllm-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: vllm/vllm-openai:nightly-cd10ed6f9f6b37a8ace9cf380007e66fe12ec0c3
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        engram-config: '{"cpu_offload":true}'
        # Five-token DSpark with probabilistic drafting. Throughput runs replace
        # block rejection with the golden acceptance length.
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
        max-model-len: 1048576
        disable-uvicorn-access-log: true
      env:
        VLLM_USE_RUST_FRONTEND: '1'
        PYTHONUNBUFFERED: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. Graph capture starts at 64 tokens and doubles until it
# covers CONC x (1 + 5 drafts), up to 2048. TP2 leaves ~145 GiB of weights per
# rank, so it caps batched tokens at 4096 (the indexer's 1M-wide logits buffer),
# bounds the scheduler at 2x CONC within [16, 256] (FlashInfer autotune fails
# below 16) and stops capturing above 512 tokens.
override_tp4_c1: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 64}}}, benchmark: {env: {CONC: '1'}}}
override_tp4_c2: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 64}}}, benchmark: {env: {CONC: '2'}}}
override_tp4_c4: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 64}}}, benchmark: {env: {CONC: '4'}}}
override_tp4_c8: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 64}}}, benchmark: {env: {CONC: '8'}}}
override_tp4_c16: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 128}}}, benchmark: {env: {CONC: '16'}}}
override_tp4_c32: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 256}}}, benchmark: {env: {CONC: '32'}}}
override_tp4_c64: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 512}}}, benchmark: {env: {CONC: '64'}}}
override_tp4_c128: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, max-cudagraph-capture-size: 1024}}}, benchmark: {env: {CONC: '128'}}}
override_tp2_c1: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 64, max-num-batched-tokens: 4096, max-num-seqs: 16}}}, benchmark: {env: {CONC: '1'}}}
override_tp2_c2: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 64, max-num-batched-tokens: 4096, max-num-seqs: 16}}}, benchmark: {env: {CONC: '2'}}}
override_tp2_c4: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 64, max-num-batched-tokens: 4096, max-num-seqs: 16}}}, benchmark: {env: {CONC: '4'}}}
override_tp2_c8: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 64, max-num-batched-tokens: 4096, max-num-seqs: 16}}}, benchmark: {env: {CONC: '8'}}}
override_tp2_c16: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 128, max-num-batched-tokens: 4096, max-num-seqs: 32}}}, benchmark: {env: {CONC: '16'}}}
override_tp2_c32: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 256, max-num-batched-tokens: 4096, max-num-seqs: 64}}}, benchmark: {env: {CONC: '32'}}}
override_tp2_c64: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 512, max-num-batched-tokens: 4096, max-num-seqs: 128}}}, benchmark: {env: {CONC: '64'}}}
override_tp2_c128: {roles: {agg: {gpus: 2, args: {tensor-parallel-size: 2, max-cudagraph-capture-size: 512, max-num-batched-tokens: 4096, max-num-seqs: 256}}}, benchmark: {env: {CONC: '128'}}}
