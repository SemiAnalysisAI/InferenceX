base:
  schema: 2
  name: dsr1-fp8-b200-trt-8k1k
  model:
    path: hf:deepseek-ai/DeepSeek-R1-0528
    container: nvcr.io#nvidia/tensorrt-llm/release:1.3.0rc14
    precision: fp8
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: trtllm_serve
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: trtllm
    served_model_name: deepseek-ai/DeepSeek-R1-0528
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        cuda_graph_config:
          enable_padding: true
        enable_attention_dp: false
        print_iter_log: true
        kv_cache_config:
          dtype: fp8
          enable_block_reuse: false
        stream_interval: 10
        moe_config:
          backend: TRTLLM
        trust_remote_code: true
        backend: pytorch
        max_seq_len: 9472
        moe_expert_parallel_size: 1
        pipeline_parallel_size: 1
        enable_iter_perf_stats: false
        return_perf_metrics: false
      env:
        TLLM_OVERRIDE_LAYER_NUM: '61'
      # The pinned native launcher needs this CLI flag as well as engine metadata.
      extra_args: [--served_model_name, deepseek-ai/DeepSeek-R1-0528]
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: deepseek-ai/DeepSeek-R1-0528
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'false'
zip_override_tp8_ep1_graphs:
  roles:
    agg:
      args:
        cuda_graph_config:
          max_batch_size: [64, 128, 256]
        kv_cache_config:
          free_gpu_memory_fraction: 0.8
        torch_compile_config:
          capture_num_tokens: [[1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 768, 1024, 1280, 1536, 1792, 2048,
              2304, 2560, 2816, 3072, 3328, 3584, 3840, 4096, 4352, 4608, 4864, 5120, 5376, 5632, 5888,
              6144, 6400, 6656, 6912, 7168, 7424, 7680, 7936, 8192, 8320], [1, 2, 4, 8, 16, 32, 64, 128,
              256, 512, 768, 1024, 1280, 1536, 1792, 2048, 2304, 2560, 2816, 3072, 3328, 3584, 3840, 4096,
              4352, 4608, 4864, 5120, 5376, 5632, 5888, 6144, 6400, 6656, 6912, 7168, 7424, 7680, 7936,
              8192, 8384], [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 768, 1024, 1280, 1536, 1792, 2048,
              2304, 2560, 2816, 3072, 3328, 3584, 3840, 4096, 4352, 4608, 4864, 5120, 5376, 5632, 5888,
              6144, 6400, 6656, 6912, 7168, 7424, 7680, 7936, 8192, 8448, 8512]]
          enable_piecewise_cuda_graph: true
        max_num_tokens: [8320, 8384, 8512]
        tensor_parallel_size: 8
  benchmark:
    env:
      CONC: ['64', '128', '256']
zip_override_tp4_ep1:
  roles:
    agg:
      args:
        cuda_graph_config:
          max_batch_size: [8, 16, 32]
        kv_cache_config:
          free_gpu_memory_fraction: 0.75
        max_num_tokens: 8320
        tensor_parallel_size: 4
      gpus: 4
  benchmark:
    env:
      CONC: ['8', '16', '32']
zip_override_tp8_ep1:
  roles:
    agg:
      args:
        cuda_graph_config:
          max_batch_size: [4, 8]
        kv_cache_config:
          free_gpu_memory_fraction: 0.8
        max_num_tokens: 8320
        tensor_parallel_size: 8
  benchmark:
    env:
      CONC: ['4', '8']
