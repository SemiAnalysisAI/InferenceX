# Serving settings from dsr1_fp8_mi355x_atom_mtp.sh.
base:
  schema: 2
  name: dsr1-fp8-mi355x-atom-mtp-8k1k
  model:
    path: hf:deepseek-ai/DeepSeek-R1-0528
    container: rocm/atom:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0_atom0.1.3
    precision: fp8
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: atom
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: atom
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        method: mtp
        num-speculative-tokens: 3
        kv_cache_dtype: fp8
        no-enable_prefix_caching: true
      env:
        OMP_NUM_THREADS: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: deepseek-ai/DeepSeek-R1-0528
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'true'
zip_override_concurrency:
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
