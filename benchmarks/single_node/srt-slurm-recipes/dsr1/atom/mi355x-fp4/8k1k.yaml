# Serving settings from dsr1_fp4_mi355x_atom.sh.
base:
  schema: 2
  name: dsr1-fp4-mi355x-atom-8k1k
  model:
    path: hf:amd/DeepSeek-R1-0528-MXFP4-Preview
    container: rocm/atom:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.10.0_atom20260511
    precision: fp4
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: atom
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: atom
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        kv_cache_dtype: fp8
        max-model-len: 10240
        block-size: 16
      env:
        OMP_NUM_THREADS: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: amd/DeepSeek-R1-0528-MXFP4-Preview
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'false'
zip_override_tp4_ep1:
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
zip_override_tp8_ep1:
  roles:
    agg:
      gpus: 8
  benchmark:
    env:
      CONC: ['4']
