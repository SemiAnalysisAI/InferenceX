# Serving settings from dsr1_fp4_b300.sh.
base:
  schema: 2
  name: dsr1-fp4-b300-sglang-8k1k
  model:
    path: hf:nvidia/DeepSeek-R1-0528-FP4-V2
    container: lmsysorg/sglang:v0.5.12-cu130
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 4
      args:
        served-model-name: nvidia/DeepSeek-R1-0528-FP4-V2
        trust-remote-code: true
        tensor-parallel-size: 4
        data-parallel-size: 1
        cuda-graph-max-bs: 256
        max-running-requests: 256
        mem-fraction-static: 0.85
        kv-cache-dtype: fp8_e4m3
        chunked-prefill-size: 16384
        expert-parallel-size: 4
        quantization: modelopt_fp4
        enable-flashinfer-allreduce-fusion: true
        scheduler-recv-interval: 10
        enable-symm-mem: true
        disable-radix-cache: true
        attention-backend: trtllm_mla
        moe-runner-backend: flashinfer_trtllm
        stream-interval: 10
        enable-metrics: false
      env:
        PYTHONNOUSERSITE: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: nvidia/DeepSeek-R1-0528-FP4-V2
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'false'
zip_override_tp4_ep4:
  roles:
    agg:
      args:
        scheduler-recv-interval: [10, 10, 10, 10, 30, 30, 30, 30]
  benchmark:
    env:
      CONC: ['1', '2', '4', '8', '16', '32', '64', '128']
zip_override_tp8_ep8:
  roles:
    agg:
      gpus: 8
      args:
        expert-parallel-size: 8
        scheduler-recv-interval: [10, 10, 10, 10, 30]
        tensor-parallel-size: 8
  benchmark:
    env:
      CONC: ['1', '2', '4', '8', '16']
