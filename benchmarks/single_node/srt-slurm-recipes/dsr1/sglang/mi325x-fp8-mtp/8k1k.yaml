base:
  schema: 2
  name: dsr1-fp8-mi325x-sglang-mtp-8k1k
  model:
    path: hf:deepseek-ai/DeepSeek-R1-0528
    container: lmsysorg/sglang:v0.5.20-rocm720-mi30x@sha256:4abecde156b531809c7f597e501930ea2023deb2c822b69f92efb66f3fdada86
    precision: fp8
  resources:
    gpu_type: mi325x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 1
        mem-fraction-static: 0.8
        cuda-graph-max-bs-decode: 128
        chunked-prefill-size: 131072
        num-continuous-decode-steps: 4
        max-prefill-tokens: 131072
        kv-cache-dtype: fp8_e4m3
        attention-backend: aiter
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        disable-radix-cache: true
        data-parallel-size: 1
        served-model-name: deepseek-ai/DeepSeek-R1-0528
        enable-metrics: false
      env:
        SGLANG_USE_AITER: '1'
        SGLANG_AITER_MLA_PERSIST: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: deepseek-ai/DeepSeek-R1-0528
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'true'
zip_override_concurrency:
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64']
