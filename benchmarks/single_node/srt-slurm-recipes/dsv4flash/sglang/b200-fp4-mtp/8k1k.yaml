base:
  schema: 2
  name: dsv4flash-fp4-b200-sglang-mtp-8k1k
  model:
    path: hf:deepseek-ai/DeepSeek-V4-Flash
    container: lmsysorg/sglang:nightly-dev-cu13-20260925-8ca82118@sha256:baea7ec5ea86412ce59837f17011028b940f9777fa15129254de02bd6a842559
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 2
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Flash
        trust-remote-code: true
        tensor-parallel-size: 2
        data-parallel-size: 1
        expert-parallel-size: 1
        moe-runner-backend: flashinfer_mxfp4
        disable-flashinfer-autotune: true
        disable-radix-cache: true
        mem-fraction-static: 0.85
        swa-full-tokens-ratio: 0.1
        chunked-prefill-size: 8192
        context-length: 9236
        reasoning-parser: deepseek-v4
        tool-call-parser: deepseekv4
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        watchdog-timeout: 3600
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh --dsv4
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'true'

zip_override_tp2:
  roles:
    agg:
      args:
        max-running-requests: [1, 2, 4, 8, 16, 32, 64, 128]
        cuda-graph-max-bs-decode: [1, 2, 4, 8, 16, 32, 64, 128]
  benchmark:
    env:
      CONC: ['1', '2', '4', '8', '16', '32', '64', '128']
