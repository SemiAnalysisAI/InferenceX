# Serving settings from qwen3.5_fp4_b200_trt.sh.
base:
  schema: 2
  name: qwen3.5-fp4-b200-trt-8k1k
  model:
    path: hf:nvidia/Qwen3.5-397B-A17B-NVFP4
    container: nvcr.io#nvidia/tensorrt-llm/release:1.3.0rc18
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: trtllm_serve
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: trtllm
    served_model_name: nvidia/Qwen3.5-397B-A17B-NVFP4
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 2
      args:
        backend: pytorch
        print_iter_log: true
        enable_layerwise_nvtx_marker: false
        disable_overlap_scheduler: false
        enable_iter_perf_stats: true
        enable_chunked_prefill: false
        stream_interval: 20
        num_postprocess_workers: 4
        scheduler_config:
          capacity_scheduler_policy: MAX_UTILIZATION
          context_chunking_policy: FIRST_COME_FIRST_SERVED
        kv_cache_config:
          free_gpu_memory_fraction: 0.9
          enable_block_reuse: false
          dtype: fp8
        cuda_graph_config:
          enable_padding: true
        moe_config:
          use_low_precision_moe_combine: true
        trust_remote_code: true
        max_seq_len: 9472
        max_num_tokens: 32768
        pipeline_parallel_size: 1
        return_perf_metrics: false
      # The pinned native launcher needs this CLI flag as well as engine metadata.
      extra_args: [--served_model_name, nvidia/Qwen3.5-397B-A17B-NVFP4]
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: nvidia/Qwen3.5-397B-A17B-NVFP4
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'false'
zip_override_tp2_ep1:
  roles:
    agg:
      args:
        enable_attention_dp: false
        cuda_graph_config:
          max_batch_size: 256
        moe_config:
          backend: TRTLLM
        batch_wait_timeout_iters: 50
        batch_wait_max_tokens_ratio: 0.45
        max_batch_size: 256
        tensor_parallel_size: 2
        moe_expert_parallel_size: 1
  benchmark:
    env:
      CONC: ['4', '16']
zip_override_tp4_ep1:
  roles:
    agg:
      args:
        enable_attention_dp: false
        cuda_graph_config:
          max_batch_size: 512
        moe_config:
          backend: TRTLLM
        batch_wait_timeout_iters: 50
        batch_wait_max_tokens_ratio: 0.45
        max_batch_size: 512
        tensor_parallel_size: 4
        moe_expert_parallel_size: 1
      gpus: 4
  benchmark:
    env:
      CONC: ['4']
zip_override_tp2_ep2:
  roles:
    agg:
      args:
        enable_attention_dp: false
        cuda_graph_config:
          max_batch_size: [256, 32]
        moe_config:
          backend: TRTLLM
        batch_wait_timeout_iters: 50
        batch_wait_max_tokens_ratio: 0.45
        max_batch_size: [256, 32]
        tensor_parallel_size: 2
        moe_expert_parallel_size: 2
  benchmark:
    env:
      CONC: ['8', '32']
zip_override_tp8_ep8:
  roles:
    agg:
      args:
        enable_attention_dp: false
        cuda_graph_config:
          max_batch_size: 512
        moe_config:
          backend: TRTLLM
        batch_wait_timeout_iters: 50
        batch_wait_max_tokens_ratio: 0.45
        max_batch_size: 512
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
      gpus: 8
  benchmark:
    env:
      CONC: ['4']
zip_override_tp4_ep4_dpa:
  roles:
    agg:
      args:
        enable_attention_dp: true
        cuda_graph_config:
          max_batch_size: 256
        moe_config:
          backend: CUTEDSL
        attention_dp_config:
          enable_balance: true
          batching_wait_iters: 10
          timeout_iters: 500
        max_batch_size: 256
        tensor_parallel_size: 4
        moe_expert_parallel_size: 4
      gpus: 4
  benchmark:
    env:
      CONC: ['1024']
zip_override_tp8_ep8_dpa:
  roles:
    agg:
      args:
        enable_attention_dp: true
        cuda_graph_config:
          max_batch_size: 128
        moe_config:
          backend: CUTEDSL
        attention_dp_config:
          enable_balance: true
          batching_wait_iters: 10
          timeout_iters: 500
        max_batch_size: 128
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
      gpus: 8
  benchmark:
    env:
      CONC: ['256', '512', '1024']
