# Qwen3.5-397B-A17B FP8 AgentX on B200 with SGLang native NEXTN MTP. The KV
# cache is GPU-resident or extends to host DRAM through HiCache.
base:
  schema: 2
  name: qwen3.5-fp8-b200-sglang-agentic
  model:
    path: hf:Qwen/Qwen3.5-397B-A17B-FP8
    container: lmsysorg/sglang:nightly-dev-cu13-20260914-4358a161
    precision: fp8
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        trust-remote-code: true
        data-parallel-size: 1
        expert-parallel-size: 1
        enable-symm-mem: true
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        # Parallel tokenization keeps 256k warmups within the client timeout.
        tokenizer-worker-num: 6
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        enable-metrics: true
        enable-cache-report: true
      env:
        TORCH_CUDA_ARCH_LIST: '10.0'
        PYTHONNOUSERSITE: '1'
        NCCL_NVLS_ENABLE: '1'
        SGL_ENABLE_JIT_DEEPGEMM: 'false'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: Qwen/Qwen3.5-397B-A17B-FP8
      # 256k-capped corpus, within this model's context.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. Admission is 2x CONC and the decode graph batch is
# CONC, capped at 64. HiCache sizes each of the target KV and Mamba host pools
# per rank with a 1 GB/rank alignment reserve and the 1/15 NEXTN draft pool:
# (DRAM - TP) * 15 / TP / 31 GB.
override_tp8_c1: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, max-running-requests: 2, cuda-graph-max-bs-decode: 1}}}, benchmark: {env: {CONC: '1', KV_OFFLOADING: none}}}
