# Serving settings from qwen3.5_fp8_h100.sh.
base:
  schema: 2
  name: qwen3.5-fp8-h100-sglang-8k1k
  model:
    path: hf:Qwen/Qwen3.5-397B-A17B-FP8
    container: lmsysorg/sglang:v0.5.14-cu130
    precision: fp8
  resources:
    gpu_type: h100
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        tensor-parallel-size: 8
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        enable-flashinfer-allreduce-fusion: true
        max-running-requests: 256
        chunked-prefill-size: 16384
        decode-log-interval: 1
        mem-fraction-static: 0.8
        cuda-graph-max-bs: 1
        context-length: 9236
        kv-cache-dtype: fp8_e4m3
        quantization: fp8
        attention-backend: flashinfer
        stream-interval: 50
        tokenizer-worker-num: 6
        mamba-ssm-dtype: bfloat16
        disable-radix-cache: true
        enable-symm-mem: true
        trust-remote-code: true
        scheduler-recv-interval: 2
        data-parallel-size: 1
        expert-parallel-size: 1
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        enable-metrics: false
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh
    env:
      MODEL: Qwen/Qwen3.5-397B-A17B-FP8
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'false'
zip_override_tp8_ep1:
  roles:
    agg:
      args:
        cuda-graph-max-bs: [1, 2, 4, 8]
        scheduler-recv-interval: [2, 2, 2, 60]
  benchmark:
    env:
      CONC: ['1', '2', '4', '8']
zip_override_tp8_ep8:
  roles:
    agg:
      args:
        cuda-graph-max-bs: [16, 32, 64, 128, 256]
        expert-parallel-size: 8
        scheduler-recv-interval: [30, 1200, 600, 1920, 1920]
  benchmark:
    env:
      CONC: ['16', '32', '64', '128', '256']
