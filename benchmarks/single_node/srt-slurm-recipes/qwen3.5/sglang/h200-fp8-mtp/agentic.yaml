# Qwen3.5 FP8 AgentX on H200 with SGLang EAGLE MTP; attention is flashinfer
# (trtllm_mha is Blackwell-only).
base:
  schema: 2
  name: qwen3.5-fp8-h200-sglang-agentic
  model:
    path: hf:Qwen/Qwen3.5-397B-A17B-FP8
    container: lmsysorg/sglang:v0.5.19-cu130@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    precision: fp8
  resources:
    gpu_type: h200
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        trust-remote-code: true
        tensor-parallel-size: 8
        data-parallel-size: 1
        expert-parallel-size: 8
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: flashinfer
        enable-flashinfer-allreduce-fusion: true
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        enable-metrics: true
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_ENABLE_SPEC_V2: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: Qwen/Qwen3.5-397B-A17B-FP8
      # 256k-capped with-subagents corpus: the unfiltered corpus has requests up
      # to ~1M tokens, beyond this model's TP8 context.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_with_subagents_256k

override_gpu_kv:
  benchmark:
    env:
      KV_OFFLOADING: none
# HiCache extends RadixAttention. Hybrid GDN/Mamba allocates one KV and one
# Mamba host pool per rank: 1234 GB / TP8 / 2 pools = 77 GB each.
override_hicache:
  roles:
    agg:
      args:
        page-size: 64
        enable-hierarchical-cache: true
        hicache-size: 77
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_through_selective
  benchmark:
    env:
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1234'
