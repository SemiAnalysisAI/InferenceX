# Qwen3.5-397B-A17B NVFP4 AgentX on B300 with SGLang native NEXTN MTP.
base:
  schema: 2
  name: qwen3.5-fp4-b300-sglang-agentic
  model:
    path: hf:nvidia/Qwen3.5-397B-A17B-NVFP4
    container: lmsysorg/sglang:nightly-dev-cu13-20260925-8ca82118
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: nvidia/Qwen3.5-397B-A17B-NVFP4
        trust-remote-code: true
        data-parallel-size: 1
        enable-symm-mem: true
        quantization: modelopt_fp4
        fp4-gemm-backend: flashinfer_cutlass
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-path: nvidia/Qwen3.5-397B-A17B-NVFP4
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        enable-metrics: true
        enable-cache-report: true
      env:
        TORCH_CUDA_ARCH_LIST: '10.0'
        PYTHONNOUSERSITE: '1'
        NCCL_NVLS_ENABLE: '1'
        SGL_ENABLE_JIT_DEEPGEMM: 'false'
        SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
        # Outlast AIPerf's 300 s client connection pool.
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: nvidia/Qwen3.5-397B-A17B-NVFP4
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      # 256k-capped corpus, within this model's context.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k

# One variant per point. Admission is 2x CONC and the graph batch is CONC,
# capped at 64. TP4 tokenizes with six workers to keep 256k warmups inside the
# client timeout; TP2 keeps SGLang's single tokenizer, which avoids a startup
# race with HiCache shared-memory initialization. HiCache sizes the target KV
# and Mamba host pools independently, and the NEXTN draft adds 1/15 of the
# target: (599 GB - 1 GB/rank) * 15 / TP2 / 31 = 144 GB per pool.
override_tp4_c1:
  roles:
    agg:
      gpus: 4
      args:
        tensor-parallel-size: 4
        expert-parallel-size: 1
        tokenizer-worker-num: 6
        max-running-requests: 2
        cuda-graph-max-bs-decode: 1
  benchmark:
    env:
      CONC: '1'
      KV_OFFLOADING: 'none'

