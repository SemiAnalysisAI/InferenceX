base:
  schema: 2
  name: qwen3.5-fp4-mi355x-atom-8k1k
  model:
    path: hf:amd/Qwen3.5-397B-A17B-MXFP4
    container: rocm/atom:rocm7.2.2_ubuntu24.04_py3.12_pytorch_release_2.10.0_atom0.1.2.post
    precision: fp4
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: atom
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: atom
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 2
      args:
        kv_cache_dtype: fp8
        max-model-len: 10240
        gpu-memory-utilization: 0.9
        trust-remote-code: true
      env:
        OMP_NUM_THREADS: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_fixed_sequence.sh --trust-remote-code
    env:
      MODEL: amd/Qwen3.5-397B-A17B-MXFP4
      ISL: '8192'
      OSL: '1024'
      RANDOM_RANGE_RATIO: '0.8'
      USE_CHAT_TEMPLATE: 'false'
zip_override_tp2_ep1:
  benchmark:
    env:
      CONC: ['4', '8', '16', '32', '64', '128', '256']
zip_override_tp4_ep1:
  roles:
    agg:
      gpus: 4
  benchmark:
    env:
      CONC: ['4', '8', '16']
