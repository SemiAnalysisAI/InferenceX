# Kimi-K3 B300 vLLM SPEED-Bench AL matrix (DSpark, probabilistic draft + block verify).
#
# Identical to kimik3 except draft_sample_method=probabilistic and
# rejection_sample_method=block in speculative-config.  This matches the
# kimik3_fp4_b300_vllm_probabilistic_sample_method_block_rejection_sample_method.sh
# collector and the kimik3_dspark_probabilistic_sample_method_block_rejection_sample_method
# golden curve.
base:
  schema: 2
  name: kimik3prob-fp4-b300-vllm-speedbench
  model:
    path: hf:moonshotai/Kimi-K3
    container: vllm/vllm-openai:nightly-dev-x86_64-cu13-3696c77
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
    # Bind GPUs via CUDA_VISIBLE_DEVICES for image compatibility.
    set_visible_devices: true
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: moonshotai/Kimi-K3
        tensor-parallel-size: 8
        data-parallel-size: 1
        pipeline-parallel-size: 1
        trust-remote-code: true
        load-format: fastsafetensors
        moe-backend: auto
        enable-prefix-caching: true
        kv-cache-dtype: fp8
        reasoning-parser: kimi_k3
        tool-call-parser: kimi_k3
        enable-auto-tool-choice: true
        gpu-memory-utilization: 0.90
        max-num-seqs: 512
        max-model-len: 16384
        max-cudagraph-capture-size: 256
        attention-config: '{"mla_prefill_backend":"FLASHINFER","use_prefill_query_quantization":true}'
      env:
        NCCL_DMABUF_ENABLE: '0'
        VLLM_ALLREDUCE_USE_FLASHINFER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/single_node/srt_speedbench.sh
    env:
      MODEL: moonshotai/Kimi-K3
      SPEC_DECODING: mtp
      TEMPERATURE_ON: '1.0'
      TEMPERATURE_OFF: '0.6'
      TOP_P: '0.95'
      CHAT_TEMPLATE_KWARGS_OFF: '{"thinking": false}'
      SPEEDBENCH_TRUST_REMOTE_CODE: '1'
      APPLY_CHAT_TEMPLATE_KWARGS_SHIM: '1'
      SPEEDBENCH_CONCURRENCY: '64'

zip_override_mtp:
  roles:
    agg:
      args:
        speculative-config:
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":1,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":2,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":3,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":4,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":5,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":6,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":8,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
