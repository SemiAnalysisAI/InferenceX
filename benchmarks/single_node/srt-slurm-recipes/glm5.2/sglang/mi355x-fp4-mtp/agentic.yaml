# GLM-5.2 FP4 AgentX on MI355X with SGLang EAGLE MTP.
base:
  schema: 2
  name: glm5.2-fp4-mi355x-sglang-agentic
  model:
    path: hf:amd/GLM-5.2-MXFP4
    container: lmsysorg/sglang-rocm:v0.5.20-rocm720-mi35x-20260923
    precision: fp4
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: amd/GLM-5.2-MXFP4
        trust-remote-code: true
        kv-cache-dtype: fp8_e4m3
        dsa-prefill-backend: triton
        dsa-decode-backend: triton
        # GLM-5.2 emits GLM-4.7-style tool calls; glm45 keeps hybrid thinking
        # in reasoning_content.
        tool-call-parser: glm47
        reasoning-parser: glm45
        # 32k chunks interleave decode between prefill chunks and keep per-chunk
        # activation headroom low enough for 0.85.
        chunked-prefill-size: 32768
        mem-fraction-static: 0.85
        speculative-algorithm: EAGLE
        speculative-num-steps: 5
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 6
        watchdog-timeout: 1800
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        # Outlast AIPerf's pooled connections past Uvicorn's keep-alive.
        SGLANG_TIMEOUT_KEEP_ALIVE: '900'
        # The DSA indexer uses the precompiled HIP Top-K op.
        SGLANG_OPT_USE_TOPK_V2: 'false'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: amd/GLM-5.2-MXFP4
      # Warmup can leave bytes unacknowledged past AIPerf's 30 s default.
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'

# One variant per point. Admission is 2x CONC; the decode graph batch follows it
# up to 64. The TP4 HiCache tier is 180 GB per rank.
override_tp4_c4_hicache: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, expert-parallel-size: 4, max-running-requests: 8, cuda-graph-max-bs-decode: 8, enable-hierarchical-cache: true, hicache-size: 180, hicache-write-policy: write_through}}}, benchmark: {env: {CONC: '4', KV_OFFLOADING: dram}}}
override_tp4_c8_hicache: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, expert-parallel-size: 4, max-running-requests: 16, cuda-graph-max-bs-decode: 16, enable-hierarchical-cache: true, hicache-size: 180, hicache-write-policy: write_through}}}, benchmark: {env: {CONC: '8', KV_OFFLOADING: dram}}}
override_tp4_c10_hicache: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, expert-parallel-size: 4, max-running-requests: 20, cuda-graph-max-bs-decode: 20, enable-hierarchical-cache: true, hicache-size: 180, hicache-write-policy: write_through}}}, benchmark: {env: {CONC: '10', KV_OFFLOADING: dram}}}
override_tp4_c12_hicache: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, expert-parallel-size: 4, max-running-requests: 24, cuda-graph-max-bs-decode: 24, enable-hierarchical-cache: true, hicache-size: 180, hicache-write-policy: write_through}}}, benchmark: {env: {CONC: '12', KV_OFFLOADING: dram}}}
override_tp4_c14_hicache: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, expert-parallel-size: 4, max-running-requests: 28, cuda-graph-max-bs-decode: 28, enable-hierarchical-cache: true, hicache-size: 180, hicache-write-policy: write_through}}}, benchmark: {env: {CONC: '14', KV_OFFLOADING: dram}}}
override_tp4_c16_hicache: {roles: {agg: {gpus: 4, args: {tensor-parallel-size: 4, expert-parallel-size: 4, max-running-requests: 32, cuda-graph-max-bs-decode: 32, enable-hierarchical-cache: true, hicache-size: 180, hicache-write-policy: write_through}}}, benchmark: {env: {CONC: '16', KV_OFFLOADING: dram}}}
override_tp8_c1: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, expert-parallel-size: 1, max-running-requests: 2, cuda-graph-max-bs-decode: 2}}}, benchmark: {env: {CONC: '1', KV_OFFLOADING: none}}}
override_tp8_c2: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, expert-parallel-size: 1, max-running-requests: 4, cuda-graph-max-bs-decode: 4}}}, benchmark: {env: {CONC: '2', KV_OFFLOADING: none}}}
override_tp8_c4: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, expert-parallel-size: 1, max-running-requests: 8, cuda-graph-max-bs-decode: 8}}}, benchmark: {env: {CONC: '4', KV_OFFLOADING: none}}}
