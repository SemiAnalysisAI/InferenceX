# DeepSeek-V4-Pro AgentX on B300 with vLLM native MTP (three draft tokens).
# TP8 and TP4 c8 are GPU-resident; TP4 c16, DEP4 and DEP8 offload KV to host
# DRAM through SimpleCPUOffloadConnector.
base:
  schema: 2
  name: dsv4-fp4-b300-vllm-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4-Pro
    container: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-426e59f
    precision: fp4
  resources:
    gpu_type: b300
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 360
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        trust-remote-code: true
        no-enable-flashinfer-autotune: true
        no-disable-hybrid-kv-cache-manager: true
        kv-cache-dtype: fp8
        block-size: 256
        max-model-len: 1048576
        attention-config: '{"use_fp4_indexer_cache":true,"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true}'
        # Throughput runs switch to synthetic rejection at the golden acceptance length.
        speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
        disable-uvicorn-access-log: true
        tokenizer-mode: deepseek_v4
        tool-call-parser: deepseek_v4
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v4
      env:
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
        VLLM_DSV4_MEGA_FP8_COMBINE: '1'
        NCCL_NVLS_ENABLE: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        TORCH_CUDA_ARCH_LIST: '10.0'
        PYTHONNOUSERSITE: '1'
        VLLM_FLOAT32_MATMUL_PRECISION: high
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Pro
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. Decode graphs capture every batch of up to
# max-num-seqs sequences in tokens (1 target + 3 drafts each). TP points admit
# 2x CONC with the FlashInfer all-reduce; DEP points run one data-parallel rank
# per GPU behind a consistent-hash vLLM Router (turns of one conversation share
# a rank), admit 2x CONC across the ranks with MegaMoE experts, and keep eager
# offload so block hashes agree across ranks. DEP8 takes a larger prefill
# budget and more memory headroom. DRAM points split TOTAL_CPU_DRAM_GB GB
# across the ranks.
override_tp8_c1: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, data-parallel-size: 1, disable-custom-all-reduce: true, gpu-memory-utilization: 0.95, max-num-seqs: 2, compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8],"mode":0}'}, env: {VLLM_ALLREDUCE_USE_FLASHINFER: '1', VLLM_FLASHINFER_ALLREDUCE_BACKEND: 'auto'}}}, benchmark: {env: {CONC: '1', KV_OFFLOADING: none}}}
override_tp8_c4: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, data-parallel-size: 1, disable-custom-all-reduce: true, gpu-memory-utilization: 0.95, max-num-seqs: 8, compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32],"mode":0}'}, env: {VLLM_ALLREDUCE_USE_FLASHINFER: '1', VLLM_FLASHINFER_ALLREDUCE_BACKEND: 'auto'}}}, benchmark: {env: {CONC: '4', KV_OFFLOADING: none}}}
