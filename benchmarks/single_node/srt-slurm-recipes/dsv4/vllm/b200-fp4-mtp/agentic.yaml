# DeepSeek-V4-Pro-0813 AgentX on B200 with vLLM native DSpark (six draft
# tokens). TP8 keeps the KV cache GPU-resident; DEP8 offloads it to host DRAM
# through SimpleCPUOffloadConnector.
base:
  schema: 2
  name: dsv4-fp4-b200-vllm-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4-Pro-0813
    container: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-591bb95
    precision: fp4
  resources:
    gpu_type: b200
    gpus_per_node: 8
  frontend:
    type: vllm
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: vllm
    connector: null
  # The engine may take the full VLLM_ENGINE_READY_TIMEOUT_S to become ready.
  health_check:
    interval_seconds: 10
    max_attempts: 720
  roles:
    agg:
      nodes: 1
      workers: 1
      args:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro-0813
        trust-remote-code: true
        kv-cache-dtype: fp8
        block-size: 256
        max-model-len: 1048576
        gpu-memory-utilization: 0.90
        numa-bind: true
        enable-cumem-allocator: true
        no-enable-flashinfer-autotune: true
        tokenizer-mode: deepseek_v4
        tool-call-parser: deepseek_v4
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v4
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
        # Throughput runs switch to synthetic rejection at the golden acceptance length.
        speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}'
        no-disable-hybrid-kv-cache-manager: true
        disable-uvicorn-access-log: true
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_USE_RUST_FRONTEND: '1'
        VLLM_DSV4_MEGA_FP8_COMBINE: '1'
        VLLM_RPC_TIMEOUT: '600000'
        TORCH_CUDA_ARCH_LIST: '10.0'
        PYTHONNOUSERSITE: '1'
        VLLM_FLOAT32_MATMUL_PRECISION: high
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Pro-0813
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'

# One variant per point. Graphs capture every decode batch of up to
# max-num-seqs sequences in tokens (1 target + 6 drafts each). TP8 admits CONC
# with a fixed 50 GiB KV cache, and also captures piecewise mixed batches of
# 100-500 tokens. DEP8 runs one data-parallel rank per GPU behind a
# consistent-hash vLLM Router (turns of one conversation share a rank), admits
# 2x CONC across the ranks with MegaMoE experts, reserves verification slots
# beyond an 8192-token prefill budget, and splits TOTAL_CPU_DRAM_GB GB of eager
# offload across the ranks; c160 and c192 shrink the per-rank KV cache.
override_tp8_c1: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, data-parallel-size: 1, max-num-batched-tokens: 16384, kv-cache-memory-bytes: 53687091200, max-num-seqs: 1, compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[7,100,200,300,400,500]}'}}}, benchmark: {env: {CONC: '1', KV_OFFLOADING: none}}}
override_tp8_c4: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, data-parallel-size: 1, max-num-batched-tokens: 16384, kv-cache-memory-bytes: 53687091200, max-num-seqs: 4, compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[7,14,21,28,100,200,300,400,500]}'}}}, benchmark: {env: {CONC: '4', KV_OFFLOADING: none}}}
override_tp8_c6: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, data-parallel-size: 1, max-num-batched-tokens: 16384, kv-cache-memory-bytes: 53687091200, max-num-seqs: 6, compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[7,14,21,28,35,42,100,200,300,400,500]}'}}}, benchmark: {env: {CONC: '6', KV_OFFLOADING: none}}}
override_tp8_c10: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, data-parallel-size: 1, max-num-batched-tokens: 16384, kv-cache-memory-bytes: 53687091200, max-num-seqs: 10, compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[7,14,21,28,35,42,49,56,63,70,100,200,300,400,500]}'}}}, benchmark: {env: {CONC: '10', KV_OFFLOADING: none}}}
override_tp8_c14: {roles: {agg: {gpus: 8, args: {tensor-parallel-size: 8, data-parallel-size: 1, max-num-batched-tokens: 16384, kv-cache-memory-bytes: 53687091200, max-num-seqs: 14, compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[7,14,21,28,35,42,49,56,63,70,77,84,91,98,100,200,300,400,500]}'}}}, benchmark: {env: {CONC: '14', KV_OFFLOADING: none}}}
