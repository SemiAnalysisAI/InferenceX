agentx-offload-none:
  experiment: agentx-offload
  image: vllm/vllm-openai:nightly-dee37d89115db4c94a820a79a78a7828e141c910
  model: nvidia/MiniMax-M3-NVFP4
  model-prefix: minimaxm3
  runner: cluster:b200-nscale
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.683
      search-space:
      - tp: 4
        spec-decoding: mtp
        kv-offloading: none
        conc-list: [1, 4, 8, 16, 32, 64, 128, 256, 320, 384, 448, 480, 512, 1024, 4096, 8192, 16384]

