target-version = "py312"
line-length = 100

[lint]
select = ["ALL"]
ignore = [
    "D", "DOC", "CPY", "TD", "FIX", "W505", "RUF002", "RUF003",
    "E501", "W191", "E111", "E114", "E117", "Q", "COM812", "COM819",
    "ANN401",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "EM", "TRY003", "TRY004", "TRY300", "TRY301",
    "FBT", "PLW2901", "T201", "PLC0414", "PLC0415", "PTH123",
    "TC001", "TC003", "S603", "S607",
    "PTH110", "PTH118", "PTH122", "PTH207", "FURB162",
]

allowed-confusables = ["×", "，", "：", "；"]

[lint.per-file-ignores]
# The GB200/GB300 srt-slurm runners execute these modules with the runner's
# system python3, which unsets VIRTUAL_ENV and can predate 3.11, so UP017's
# datetime.UTC would make them fail to import before they do any work.
"**/results/agentic/power_adapter.py" = ["UP017"]
"**/results/power/single_node.py" = ["UP017"]

[lint.isort]
known-first-party = ["infx"]
combine-as-imports = true

[lint.flake8-bugbear]
extend-immutable-calls = ["infx.matrix.generate.FullSweepOptions", "infx.workflows.ci_priority.PriorityContext"]

[format]
quote-style = "double"
docstring-code-format = true
