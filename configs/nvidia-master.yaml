          tp: 4
          ep: 1
          dp-attn: false

      # Mid curve (6 prefill nodes, 12 decode nodes)
      - spec-decoding: "none"
        conc-list: [ 512, 2048, 4096 ]
        prefill:
          num-worker: 6
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/gb300-fp4/8k1k/mid_curve.yaml"
        decode:
          num-worker: 1
          tp: 48
          ep: 48
          dp-attn: true

      # Max throughput (10 prefill nodes, 8 decode nodes)
      - spec-decoding: "none"
        conc-list: [ 2048 ]
        prefill:
          num-worker: 10
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/gb300-fp4/8k1k/max_tpt.yaml"
        decode:
          num-worker: 1
          tp: 32
          ep: 32
          dp-attn: true

