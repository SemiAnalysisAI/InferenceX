kimik3-fp4-b300-vllm-agentic-dspark:
  # TP8 x DCP8 with Mooncake as the external KV tier. The recipe drafts with
  # DSpark level 7 at conc <= 8 and stops above it; synthetic acceptance is
  # pinned to the committed golden AL 3.84 (golden_al_distribution/
  # kimik3_dspark_probabilistic_sample_method_block_rejection_sample_method.yaml),
  # and EVAL_ONLY switches to real block verification.
  #
  # The image carries the Kimi-K3 DCP, DSpark-under-DCP and Mooncake-hybrid
  # changes (vllm-project/vllm agentx-k3 @ 5894fdf).
  image: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-5894fdf
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:b300-nv
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    # Agentic-coding only: no fixed-seq-len (1k1k / 8k1k) arms for this recipe.
    agentic-coding:
      # Sizes the Mooncake segment: this resolves to total-cpu-dram-gb, which
      # the recipe divides across the 8 TP ranks.
    - dram-utilization: 0.75
      search-space:
      # TP8-only: a ~1.5 TB MXFP4 checkpoint does not fit below 8 GPUs.
      # One entry for every arm: the recipe drafts at DSpark 7 up to conc 8,
      # DSpark 3 at conc 16, and not at all above. Keep the concurrencies
      # disjoint across arms so exp-names stay unique.
      - { tp: 8, ep: 1, dcp-size: 8, spec-decoding: mtp, kv-offloading: dram, kv-offload-backend: { name: mooncake, version: "0.3.11.post1" }, conc-list: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 70] }

