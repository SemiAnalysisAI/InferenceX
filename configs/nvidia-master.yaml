          tp: 8
          ep: 1
          dp-attn: false
      # STP: High throughput DEP (1 prefill, 1 decode, dp-attention)
      - spec-decoding: "none"
        conc-list: [64, 128, 256]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/h200/8k1k/bs128-1p1d-dep.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
