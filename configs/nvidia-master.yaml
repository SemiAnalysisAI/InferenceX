# Day-0 Kimi K3 AgentX coverage on GB200. The three aggregate srt-slurm
# profiles mirror the serving strategies synthesized by the official recipe:
#   latency:    multi-node TP16       (4 GB200 nodes / 16 GPUs)
#   balanced:   multi-node TEP16      (4 GB200 nodes / 16 GPUs)
#   throughput: multi-node TP4 x DP4  (4 GB200 nodes / EP16)
# All profiles enable Kimi K3 DSpark level 2 at the committed golden AL 2.51.
# `spec-decoding: mtp` is the existing matrix label used for speculative
# decoding methods; the checked-in recipes select DSpark explicitly.
# https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb200
kimik3-fp4-gb200-dynamo-vllm-agentic:
  image: vllm/vllm-openai:kimi-k3
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:gb200-nv
  precision: fp4
  framework: dynamo-vllm
  router: { name: dynamo-router, version: "1.3.0" }
  multinode: true
  disagg: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.61
      search-space:
      # Latency oriented: multi_node_tp strategy, TP16 across four GB200
      # nodes.
      # https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb200&nodes=4&strategy=multi_node_tp
      - spec-decoding: mtp
        conc-list: [1, 2, 4, 8]
        num-nodes: 4
        worker:
          num-worker: 1
          tp: 16
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/kimi-k3/agentic/agg-gb200-tp16-latency-agentic.yaml"
      # Balanced: multi_node_tep strategy, TEP16 across four GB200 nodes.
      # https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb200&nodes=4&strategy=multi_node_tep
      - spec-decoding: mtp
        conc-list: [8, 16, 24, 32]
        num-nodes: 4
        worker:
          num-worker: 1
          tp: 16
          ep: 16
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/kimi-k3/agentic/agg-gb200-tep16-balanced-agentic.yaml"
      # Throughput oriented: official multi_node_dep strategy, DEP16 across
      # four GB200 nodes (TP4 x DP4 = EP16, one local DP rank per node).
      # The recipe allows up to 3600s for full-context saturation warmup to drain.
      # https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=gb200&nodes=4&strategy=multi_node_dep
      - spec-decoding: mtp
        conc-list: [32, 64, 96, 128, 192, 256]
        num-nodes: 4
        worker:
          num-worker: 1
          tp: 4
          ep: 16
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/kimi-k3/agentic/agg-gb200-dep16-throughput-agentic.yaml"
      # High-concurrency DEP16 with vLLM Simple CPU KV offloading. c384
      # exercises 384 of the 393 AgentX trajectories and remains below the
      # aggregate max-num-seqs capacity of 512 (128 per DP rank).
      - spec-decoding: mtp
        kv-offloading: dram
        kv-offload-backend: { name: vllm-simple, version: "13c59a3" }
        conc-list: [128, 192, 256, 384]
        num-nodes: 4
        worker:
          num-worker: 1
          tp: 4
          ep: 16
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/kimi-k3/agentic/agg-gb200-dep16-throughput-vllm-simple-offload-agentic.yaml"
