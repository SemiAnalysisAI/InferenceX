  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: h200
  precision: fp8
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, ep: 1, dp-attn: false, conc-start: 1, conc-end: 256, spec-decoding: mtp }
      - { tp: 8, ep: 8, dp-attn: true, conc-start: 1, conc-end: 256, spec-decoding: mtp }

# DeepSeek-V4-Pro H200 single-node with SGLang (Marlin FP8, TP-only).
# Pinned to the h200-dgxc-slurm runner pool because the deepseek-v4-hopper
# image needs the /ix mount layout that only launch_h200-dgxc-slurm.sh sets up.

# DeepSeek-V4-Pro AgentX on one aggregated TP8 H200 worker. Keep the serving
# topology fixed and sweep only concurrency to produce the Pareto curve.
dsv4-fp8-h200-dynamo-sglang-agentic-agg:
  image: lmsysorg/sglang:nightly-dev-cu13-20260720-b3570a45
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: cluster:h200-dgxc
  precision: fp8
  framework: dynamo-sglang
  router: { name: dynamo-router, version: "1.3.0.dev20260718" }
  multinode: true
  disagg: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.80
      search-space:
      - spec-decoding: mtp
        conc-list: [1, 2, 4, 8, 16]
        kv-offloading: dram
        kv-offload-backend: { name: hicache }
        num-nodes: 1
        worker:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/agentic/agg-h200-tp8-mtp-kvoffload.yaml"
# MTP variant of dsv4-fp8-h200-sglang. Mirrors the non-MTP recipe (same image,
# runner pool, search space) and adds EAGLE speculative decoding via
# --speculative-algorithm EAGLE with the (3,1,4) chain matching dsv4-fp4-b300-sglang-mtp.
dsv4-fp8-h200-sglang:
  image: lmsysorg/sglang:deepseek-v4-hopper@sha256:1bf5d508ab110cc0fe1659a5f21d1be02a7f0d7ca8f58cea7e7f4e11f6ae208f
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: h200-dgxc
  precision: fp8
  framework: sglang
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, ep: 1, conc-start: 1, conc-end: 1 }
      - { tp: 8, ep: 1, conc-start: 4, conc-end: 64 }

# MTP variant of dsv4-fp8-h200-sglang. Mirrors the non-MTP recipe (same image,
# runner pool, search space) and adds EAGLE speculative decoding via
# --speculative-algorithm EAGLE with the (3,1,4) chain matching dsv4-fp4-b300-sglang-mtp.
dsv4-fp8-h200-sglang-mtp:
  image: lmsysorg/sglang:deepseek-v4-hopper@sha256:1bf5d508ab110cc0fe1659a5f21d1be02a7f0d7ca8f58cea7e7f4e11f6ae208f
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: h200-dgxc
  precision: fp8
  framework: sglang
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, ep: 1, conc-start: 1, conc-end: 1, spec-decoding: mtp }
      - { tp: 8, ep: 1, conc-start: 4, conc-end: 64, spec-decoding: mtp }

  # DeepSeek-V4-Pro B300 single-node aggregate recipe from the submitted B300
  # pareto sweep. The single-node schema has no explicit data-parallel-size
  # field, so dp-attn=true is used as the existing vLLM script switch for DP4
  # layouts on 4 allocated GPUs.
dsv4-fp4-b300-vllm:
  image: vllm/vllm-openai:v0.25.0
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: cluster:b300-nv
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 4, conc-start: 1, conc-end: 64 }
      - { tp: 8, conc-start: 1, conc-end: 4 }
      - { tp: 4, ep: 4, dp-attn: true, conc-start: 256, conc-end: 512 }
      - { tp: 8, ep: 8, dp-attn: true, conc-start: 2048, conc-end: 2048 }

dsv4-fp4-b300-vllm-agentic-mtp:
  image: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-426e59f
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: cluster:b300-nv
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.95
      search-space:
      # TP8 GPU-resident + MTP (num_speculative_tokens=3)
      - { tp: 8, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 4] }
      # TP4 GPU-resident + MTP (num_speculative_tokens=3)
      - { tp: 4, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 2, 4, 6, 8] }
      # TP4 SimpleCPU + MTP (num_speculative_tokens=3)
      - { tp: 4, kv-offloading: dram, kv-offload-backend: { name: vllm-simple }, spec-decoding: mtp, conc-list: [16] }
      # DEP4 SimpleCPU + MTP (num_speculative_tokens=3)
      - { tp: 4, ep: 4, dp-attn: true, kv-offloading: dram, kv-offload-backend: { name: vllm-simple }, spec-decoding: mtp, conc-list: [48, 64], router: { name: vllm-router, version: "0.1.14" } }
      # DEP8 SimpleCPU + MTP (num_speculative_tokens=3)
      - { tp: 8, ep: 8, dp-attn: true, kv-offloading: dram, kv-offload-backend: { name: vllm-simple }, spec-decoding: mtp, conc-list: [128, 256, 384, 512, 576], router: { name: vllm-router, version: "0.1.14" } }

