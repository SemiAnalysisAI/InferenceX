# Read-mode rescan at conc 1 / 8 / 12, with the CPU tier sized per concurrency.
#
# Why per-concurrency: the tier requirement is not flat. At conc8 the curve is
# already saturated at dram-utilization 0.50 (1,499 GB) - 0.80 measured
# identically, tier hit 76.1% vs 75.8% and TTFT p90 6,912 vs 6,920 ms - so more
# is wasted host memory. At conc12 the same 0.50 is not enough:
#
#   metric (3,600s, tier 1,499 GB)      conc8      conc12
#   GPU prefix hit                      56.6%      35.4%
#   CPU tier hit, of GPU misses         75.8%      80.8%
#   tokens recomputed                   12.56M     17.55M
#   prefill duty cycle                  43.7%      65.6%
#   TTFT p90 / p99 (ms)                 6,920 /    34,060 /
#                                       34,947     94,961
#
# More lanes evict GPU prefixes faster (56.6% -> 35.4%), pushing far more
# traffic onto the CPU tier: 91.6M queried tokens against conc8's 52.0M. The
# tier still catches 80.8% of that, but the 19.2% it misses is 17.55M tokens of
# recompute, which is what puts the engine at a 65.6% duty cycle and the tail at
# p90 34s. 0.70 gives conc12 2,100 GB to work the same lever that fixed conc8.
#
# conc1 keeps kv-offloading: none, exactly as the master recipe has it, so it
# stays the no-tier reference point.
#
# Scratch sweep. Delete before opening a PR.

kimik3-read-rescan-c1-8-12:
  image: vllm/vllm-openai-rocm:nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm-disagg
  router: { name: vllm-router, version: "nightly-20260809-d2ba586" }
  kv-p2p-transfer: mori
  multinode: true
  disagg: true
  scenarios:
    agentic-coding:
    - dram-utilization: 0.50
      search-space:
      - spec-decoding: mtp
        kv-offloading: none
        conc-list: [1]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "MORIIO_READ_MODE=true"
          - "MORI_WAITALL_BUILD=0"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=2"
      - spec-decoding: mtp
        kv-offloading: dram
        kv-offload-backend: { name: vllm-simple }
        conc-list: [8]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "MORIIO_READ_MODE=true"
          - "MORI_WAITALL_BUILD=0"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=2"

    - dram-utilization: 0.70
      search-space:
      - spec-decoding: mtp
        kv-offloading: dram
        kv-offload-backend: { name: vllm-simple }
        conc-list: [12]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "MORIIO_READ_MODE=true"
          - "MORI_WAITALL_BUILD=0"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=2"
