# Read-mode rescan at conc1 / conc4.
#
# conc1 keeps kv-offloading: none as the no-tier reference point. conc4 uses
# dram-utilization 0.50, which resolves to a 1,499 GB CPU tier.
#
# Scratch sweep. Delete before opening a PR.

kimik3-read-rescan-c1-c4:
  image: vllm/vllm-openai-rocm:nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm-disagg
  router: { name: vllm-router, version: "nightly-20260809-d2ba586" }
  kv-p2p-transfer: mori
  multinode: true
  disagg: true
  scenarios:
    agentic-coding:
    - dram-utilization: 0.50
      search-space:
      - spec-decoding: mtp
        kv-offloading: none
        conc-list: [1]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "MORIIO_READ_MODE=true"
          - "MORI_WAITALL_BUILD=0"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=2"
      - spec-decoding: mtp
        kv-offloading: dram
        kv-offload-backend: { name: vllm-simple }
        conc-list: [4]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "MORIIO_READ_MODE=true"
          - "MORI_WAITALL_BUILD=0"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=2"

