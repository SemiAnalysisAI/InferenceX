kimik3-fp4-mi355x-vllm-agentic-mtp-asm-fp8-k3-c4:
  # c4 on its own, retried under MNS_PIN=16.
  #
  # c4 has failed 3/3 (runs 30987878388, 31015053833, 31071548896; nodes g10,
  # g10, g12), always the same way: hipErrorIllegalAddress in
  # KimiGDNLinearAttention._forward:478 (the spec-branch causal_conv1d_update)
  # while capturing FULL cudagraph 2 of 2. Every rank then dies, the srun job
