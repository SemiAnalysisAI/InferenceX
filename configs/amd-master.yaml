# Kimi-K3 MXFP4 agentic-coding benchmark on MI355X via ATOM with DSpark
# speculative decoding. Acceptance is pinned to the committed golden curve in
# golden_al_distribution/kimik3_dspark_probabilistic_sample_method_block_rejection_sample_method.yaml
# at both draft lengths used here: 7 draft tokens -> AL 3.84 at concurrency 1 and 4,
# 3 draft tokens -> AL 3.00 at concurrency 14 and 16.
# Companion to kimik3-fp4-mi355x-vllm-agentic-mtp: same checkpoint, same runner.
# TP8 only -- the 1.56 TB MXFP4 checkpoint is ~195 GB/GPU and TP4 cannot load,
# which is also why there is no DP-attention arm.
# Three serving bands, tracking the ATOM recipe:
#   interactive (1, 4)        the latency floor, GPU-resident, dcp 1.
#   mid         (14, 16)      decode is KV-bandwidth-bound over 100k+ token
#                             contexts, so dcp-size 8 shards the KV read across
#                             all 8 GPUs and the LMCache DRAM tier backs the
#                             paged KV.
#   throughput  (48, 56, 72)  same shape, no draft model.
# Two utilization blocks because the per-rank LMCache pool differs, and the
# launcher divides the aggregate budget by TP:
#   0.343 -> 1028 GB aggregate -> 128 GB/rank (conc 14 through 48).
#   0.513 -> 1538 GB aggregate -> 192 GB/rank (conc 56 and 72), where the
#            wider in-flight window needs the deeper pool to keep the paged KV
#            resident.
kimik3-fp4-mi355x-atom-agentic-mtp:
  image: rocm/atom-dev:ubuntu24.04_py3.12_pytorch_release_2.10.0_kimi_k3_agentic_0911
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:mi355x-amds
  precision: fp4
  framework: atom
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.343
      search-space:
      - { tp: 8, kv-offloading: none, conc-list: [1, 4], spec-decoding: mtp }
      - { tp: 8, dcp-size: 8, kv-offloading: dram, kv-offload-backend: { name: lmcache, version: "0.4.5" }, conc-list: [14, 16, 48], spec-decoding: mtp }
    - dram-utilization: 0.513
      search-space:
      - { tp: 8, dcp-size: 8, kv-offloading: dram, kv-offload-backend: { name: lmcache, version: "0.4.5" }, conc-list: [56, 72], spec-decoding: mtp }

minimaxm3-fp4-mi355x-atom-agentic-mtp:
  image: rocm/atom-dev:nightly_202609171455
  model: amd/MiniMax-M3-MXFP4
  model-prefix: minimaxm3
  runner: cluster:mi355x-amds
  precision: fp4
  framework: atom
  multinode: false
  scenarios:
    agentic-coding:
    # 0.687 targets ~256 GB/rank on the dram-offload arms: LMCACHE_MAX_LOCAL_CPU_SIZE
    # = TOTAL_CPU_DRAM_GB / TP = node_DRAM * dram-utilization / 8 (TP-independent).
    - dram-utilization: 0.687
      search-space:
      - { tp: 4, kv-offloading: none, conc-list: [1, 2, 4, 5, 8, 10, 12, 15, 20, 24, 28, 32], spec-decoding: mtp }
      - { tp: 2, kv-offloading: none, conc-list: [1, 2], spec-decoding: mtp }
      - { tp: 2, kv-offloading: dram, kv-offload-backend: { name: lmcache, version: "0.5.5rc3+rocm7.2.4" }, conc-list: [20, 25, 30], spec-decoding: mtp }
