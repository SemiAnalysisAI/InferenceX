dsr1-fp8-mi355x-sglang-disagg:
  # Pure TP variants retain SGLang's dense-TP default; dense TP1 is DP-attention-only.
  image: lmsysorg/sglang-rocm:v0.5.17-rocm720-mi35x-20260809
  model: deepseek-ai/DeepSeek-R1-0528
