          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=3"

      # 1P2D TP8
      - spec-decoding: "mtp"
        conc-list: [ 2, 4, 8, 16, 32 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 2
          tp: 8
          ep: 1
          dp-attn: false
