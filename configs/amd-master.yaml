          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      - spec-decoding: "none"
        conc-list: [4, 8, 16, 32, 64, 128, 256]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/dsr1/mi355x/fp8-disagg-fixed-seq.yaml:override_stp_1p2d_tp8"
        decode:
          num-worker: 2
          tp: 8
          ep: 1
          dp-attn: false
      - spec-decoding: "none"
        conc-list: [1, 2, 4, 8, 16, 32, 64]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/dsr1/mi355x/fp8-disagg-fixed-seq.yaml:override_stp_1p1d_tp4_tp8"
