# GLM-5.2 FP4 agentic-coding benchmark on MI355X via SGLang with MTP speculative
# decoding. Two arms:
# (1) TP4/EP4 with HiCache KV offloading to DRAM at concurrency [4, 8, 10, 12, 14, 16];
#     serves the high-concurrency, throughput-dominant regime.
# (2) TP8/EP1 without KV offloading, concurrency sweep [1, 2, 4];
#     EP=1 eliminates the MoE all-to-all collective, reducing ITL at low-to-mid
#     concurrency; GPU-resident KV keeps latency independent of DRAM bandwidth.
#     c4 intentionally overlaps both arms to compare the topology crossover.
# SA selects the Pareto-optimal arm per concurrency point.
glm5.2-fp4-mi355x-sglang-agentic-mtp:
  image: lmsysorg/sglang-rocm:v0.5.20-rocm720-mi35x-20260923
  model: amd/GLM-5.2-MXFP4
  model-prefix: glm5.2
  runner: cluster:mi355x-amds
  precision: fp4
  framework: sglang
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.85
      search-space:
      - { tp: 4, ep: 4, kv-offloading: dram, kv-offload-backend: { name: hicache }, conc-list: [4, 8, 10, 12, 14, 16], spec-decoding: mtp }
      - { tp: 8, ep: 1, kv-offloading: none, conc-list: [1, 2, 4], spec-decoding: mtp }

# GLM-5.2 FP8 agentic-coding benchmark on MI355X via SGLang with MTP speculative
# decoding: the FP8 precision sibling of glm5.2-fp4-mi355x-sglang-agentic-mtp,
# serving the upstream zai-org/GLM-5.2-FP8 checkpoint (~756 GB block-FP8).
# Same EAGLE shape as the MXFP4 sibling (num-steps 5, 6 draft tokens) with
# acceptance pinned to the golden AL 3.61 (glm5.2_mtp.yaml, thinking_on, K=5,
# measured on glm-5.2-fp8). TP8-only: ~94.5 GB/rank of weights leaves a ~150
# GB/rank fp8 KV pool at --mem-fraction-static 0.85; TP4 would leave ~56 GB/rank
# and is not attempted on day zero (the MI325X FP8 sibling is TP8-only too).
# Two arms, steps of at least 2 and a hard stop at 16:
# (1) TP8/EP1 without KV offloading, conc [1, 2, 4, 10] -- mirrors the MXFP4
#     sibling's TP8 arm exactly; GPU-resident KV keeps latency independent of
#     DRAM bandwidth.
# (2) TP8/EP1 with HiCache KV offloading to DRAM, conc [8, 12, 16] -- the
#     throughput-dominant regime where the working set outgrows the device pool.
# SA selects the Pareto-optimal arm per concurrency point.
glm5.2-fp8-mi355x-sglang-agentic-mtp:
  image: lmsysorg/sglang-rocm:v0.5.19-rocm720-mi35x-20260917
  model: zai-org/GLM-5.2-FP8
  model-prefix: glm5.2
  runner: cluster:mi355x-amds
  precision: fp8
  framework: sglang
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.8
      search-space:
      - { tp: 8, ep: 1, kv-offloading: none, conc-list: [1, 2, 4, 10], spec-decoding: mtp }
      - { tp: 8, ep: 1, kv-offloading: dram, kv-offload-backend: { name: hicache }, conc-list: [8, 12, 16], spec-decoding: mtp }
# GLM-5.2 FP4 agentic-coding benchmark on MI355X via ATOM with MTP speculative
# decoding, matching the standalone recipe (ROCm/ATOM PR 2345). Small
# concurrency (C2-C10) is TP4-only on the GPU prefix cache with no KV offload;
# large concurrency (C16-C48) adds DCP4 to shard the decode KV and keeps the
# LMCache DRAM offload. The script resolves the draft depth and forced golden AL
# per concurrency point (K5/3.61 for C2-C8, K4/3.33 for C10-C40, K3/2.99 for
# C48). The TP8 arm stays GPU-resident with no KV offload.
glm5.2-fp4-mi355x-atom-agentic-mtp:
  image: rocm/atom-dev:nightly_202609211553
  model: amd/GLM-5.2-MXFP4
  model-prefix: glm5.2
  runner: cluster:mi355x-amds
  precision: fp4
  framework: atom
  multinode: false
  scenarios:
    agentic-coding:
    # dram-utilization 0.171 -> TOTAL_CPU_DRAM_GB=256 per TP4 rank (recipe's
    # LMCACHE_MAX_LOCAL_CPU_SIZE=256): min(3095781,2861022)MiB*0.171*4/8 = 256.
    # Only the DCP4 arm offloads; the other two are GPU-resident.
    - dram-utilization: 0.171
      search-space:
       - { tp: 4, kv-offloading: none, conc-list: [2, 4, 8, 10], spec-decoding: mtp }
       - { tp: 4, dcp-size: 4, kv-offloading: dram, kv-offload-backend: { name: lmcache, version: "0.4.5" }, conc-list: [16, 24, 32, 40, 48], spec-decoding: mtp }
       - { tp: 8, kv-offloading: none, conc-list: [1, 2, 4], spec-decoding: mtp }

dsv4-fp4-mi355x-sglang-agentic-mtp:
