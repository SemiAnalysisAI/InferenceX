        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
          - "LOAD_FORMAT=dummy"
          - "IX_AIPERF_TOKENIZER=moonshotai/Kimi-K3"
          - "VLLM_PATCH_46240=1"
          - "VLLM_K3_FORK_REF=yichaozhu/moriio-k3-dspark"
          - "HF_HUB_CACHE=/models/.cache/huggingface/hub"
          - "INFERENCEX_MOONCAKE_MAX_TRANSFER_BATCH_KEYS=32"
          - "MC_WORKERS_PER_CTX=4"
        decode:
