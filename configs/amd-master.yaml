# Upstream ROCm nightly rather than the deepseekv41-flash-0909 release tag: that
# tag predates vllm-project/vllm#56503, which moves the mHC delayed pre block off
# the eager Torch reference and onto AITER. MI355X run 34710937012 passed the
# full concurrency 1-32 sweep and eval-only concurrency 32.
# TP=2 joins TP=4, and both extend to concurrency 128. TP=2 became feasible on
# this SKU once the Engram tables moved to host memory: they cost 47.2 GiB of
# device memory per rank, which is what previously forced four GPUs per server.
# Two GPUs per server doubles the servers per node and is the layout that
# decides whether DSv4.1-Flash is throughput- or interactivity-bound here.
dsv41flash-fp4-mi355x-vllm-agentic-dspark:
  # ROCm 10.0 nightly channel, shared with kimik3-fp4-mi355x-vllm-agentic-mtp.
  image: vllm/vllm-openai-rocm:nightly-rocm100-29468dde8b515031dc6d4d9d06bf0a2fa0442098
  model: deepseek-ai/DeepSeek-V4.1-Flash
  model-prefix: dsv41flash
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.60
      search-space:
      # The recipe only changes the memory split where a point ran short of KV:
      # TP=4 offloads the engram tables at c128, and the prefill chunk shrinks at
      # TP=2 c64, TP=4 c128 and TP=2 c128. Every point is measured here rather
      # than combined from the earlier run: the image move leaves concurrency
      # 1-32 measured only on the superseded nightly-eed1f3d0 pin.
      - { tp: 4, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 2, 4, 8, 16, 32, 64, 128] }
      - { tp: 2, kv-offloading: none, spec-decoding: mtp, conc-list: [1, 2, 4, 8, 16, 32, 64, 128] }

# Speculative decoding on an agentic scenario must run with simulated
# synthetic acceptance at the committed golden AL for this model, thinking mode
# and draft length (docs/PR_REVIEW_CHECKLIST.md), and a submission may not
# substitute its own target. Nothing about that target is written here:
# AGENTS.md forbids hard-coding an acceptance length in a master config, so
# server_tilert.sh reads golden_al_distribution/glm5.3_mtp.yaml at launch and
# fails the run if the curve or the draft length is missing.
# The curve is consumed in the same units as every other framework here, and
# AgentX replays run with thinking on.
#
# NOTE FOR REVIEWERS: that curve is GLM-5.2's, copied because no SPEED-Bench run
# on GLM-5.3 exists and the two share a base. It is committed as provisional and
# labelled as such in the file. Flagging it rather than letting it read as a
# measured 5.3 curve -- please say if you would rather see a measured curve, a
# non-MTP agentic entry, or a waiver.
glm5.3-fp8-mi355x-tilert-agentic:
  image: ghcr.io/tile-ai/tilert-rocm-decode:0.1.6
  model: zai-org/GLM-5.3
  model-prefix: glm5.3
  runner: cluster:mi355x-amds
  precision: fp8
  framework: tilert
  router: { name: tilert-pd-router, version: "0.1.6.post2" }
  multinode: true
  disagg: true
  kv-p2p-transfer: mooncake
  scenarios:
    agentic-coding:
    - search-space:
      - spec-decoding: "mtp"
        conc-list: [1]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_IMAGE=ghcr.io/tile-ai/tilert-rocm-prefill:0.1.6"
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "TILERT_EXTRA_ENV=GLM5_AR_N=2"

