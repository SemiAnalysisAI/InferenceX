          - "DECODE_NODES=2"
          - "DECODE_MTP_SIZE=3"

      # 1P2D TP8
      - spec-decoding: "mtp"
        conc-list: [ 64, 128, 256 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 2
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "DECODE_MTP_SIZE=2"

      # 1*DEP8 + 1*DEP8
      - spec-decoding: "mtp"
        conc-list: [ 128, 512 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=1"

      # 1*DEP8 + 1*DEP8
      - spec-decoding: "mtp"
        conc-list: [ 64, 256 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=1"

      # 2*DEP8 + 1*DEP8
      - spec-decoding: "mtp"
        conc-list: [ 1024, 2048, 4096 ]
        prefill:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=2"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=1"

