  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # Each matrix row selects one resolved topology from the shared
      # srt-slurm recipe. The recipe owns the complete concurrency sweep in a
      # single allocation so model initialization is paid once per topology.
      - spec-decoding: "none"
        conc-list: [1024, 2048]
        prefill:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/dsr1/mi355x/fp8-disagg-fixed-seq.yaml:override_stp_2p1d_dep8"
