      # Low-latency baseline: 1p1d-tp4-tp4. 2 nodes.
      - spec-decoding: "mtp"
        conc-list: [1]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/gb300-fp4/8k1k/disagg-1p1d-p-tp4-d-tp4-b8-c1-mtp.yaml"
