  model: MiniMaxAI/MiniMax-M3-MXFP8
  model-prefix: minimaxm3
  runner: gb300-nv
  precision: fp8
  framework: dynamo-vllm
  router: { name: dynamo-router, version: "1.3.0.dev20260614" }
  kv-p2p-transfer: nixl
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      # 1p1d DEP2+DEP4, 2n: conc 8192
      - conc-list: [8192]
        prefill:
          num-worker: 1
          tp: 2
          ep: 2
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/minimaxm3/vllm/gb300-fp8/1k1k/disagg-1p1d-dep2-dep4-stp.yaml"
        decode:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true

      # 1p2d DEP2+TEP8, 5n: conc 4,16,64,128,256
      - conc-list: [4, 16, 64, 128, 256]
        prefill:
          num-worker: 1
          tp: 2
          ep: 2
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/minimaxm3/vllm/gb300-fp8/1k1k/disagg-1p2d-dep2-tep8-stp.yaml"
        decode:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: false

      # 2p2d DEP2+TEP8, 5n: conc 32
      - conc-list: [32]
        prefill:
          num-worker: 2
          tp: 2
          ep: 2
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/minimaxm3/vllm/gb300-fp8/1k1k/disagg-2p2d-dep2-tep8-stp.yaml"
        decode:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: false

      # 2p3d DEP2+DEP4, 4n: conc 8192
      - conc-list: [8192]
        prefill:
          num-worker: 2
          tp: 2
          ep: 2
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/minimaxm3/vllm/gb300-fp8/1k1k/disagg-2p3d-dep2-dep4-stp.yaml"
        decode:
          num-worker: 3
          tp: 4
          ep: 4
          dp-attn: true

      # 2p4d DEP2+DEP4, 5n: conc 8192
      - conc-list: [8192]
        prefill:
          num-worker: 2
          tp: 2
          ep: 2
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/minimaxm3/vllm/gb300-fp8/1k1k/disagg-2p4d-dep2-dep4-stp.yaml"
        decode:
          num-worker: 4
          tp: 4
          ep: 4
          dp-attn: true

      # 4p2d DEP2+DEP8, 6n: conc 1024,4096
      - conc-list: [1024, 4096]
        prefill:
          num-worker: 4
          tp: 2
          ep: 2
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/minimaxm3/vllm/gb300-fp8/1k1k/disagg-4p2d-dep2-dep8-stp.yaml"
        decode:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: true

