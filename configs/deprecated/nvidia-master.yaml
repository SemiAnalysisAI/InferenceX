# cores on Blackwell. M3 support has not shipped in a stable vLLM release;
# the dedicated vllm/vllm-openai:minimax-m3-0618-x86_64-cu130 image is built
# from the m3_release branch (vllm-project/vllm#45381). --block-size 128 is mandatory (MSA
# sparse/index cache alignment). Weights are NOT SRE-staged; b300 falls back
# to writable /data/models (see launch_b300-nv.sh MODEL_PATH split).
minimaxm3-fp8-b300-vllm:
  image: vllm/vllm-openai:nightly-4080263bb2c5d10deac17aaeb88e0823bc35bca9
  model: MiniMaxAI/MiniMax-M3-MXFP8
  model-prefix: minimaxm3
  runner: b300
  precision: fp8
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, conc-start: 1, conc-end: 64 }
      - { tp: 8, ep: 8, conc-start: 1, conc-end: 512 }
      - { tp: 4, conc-start: 1, conc-end: 128 }
      - { tp: 4, ep: 4, conc-start: 64, conc-end: 256 }
      - { tp: 4, ep: 4, dp-attn: true, conc-start: 64, conc-end: 128 }
      - { tp: 8, ep: 8, dp-attn: true, conc-start: 128, conc-end: 512 }

# MiniMax-M3 NVFP4 (nvidia/MiniMax-M3-NVFP4) B300 single-node vLLM — FP4 variant
# of minimaxm3-fp8-b300-vllm. MiniMax-M3 modelopt NVFP4 support (vllm-project/vllm
# PR #46380) is baked into the perf container image, so no runtime patch is
# needed. --block-size 128 is mandatory (MSA sparse/index cache);
# weights are pre-staged read-only at /scratch/models/MiniMax-M3-NVFP4 (added to
# the STAGED_MODELS allow-list in launch_b300-nv.sh).
minimaxm3-fp4-b300-vllm:
  image: vllm/vllm-openai:nightly-5e35a6f4f9bbc217c599692157ca985c894373f7
  model: nvidia/MiniMax-M3-NVFP4
  model-prefix: minimaxm3
  runner: b300
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, conc-start: 1, conc-end: 2 }
      - { tp: 4, conc-start: 1, conc-end: 2 }
      - { tp: 2, conc-start: 4, conc-end: 256 }
      - { tp: 2, ep: 2, dp-attn: true, conc-start: 512, conc-end: 512 }

# EAGLE3 speculative-decoding (spec-decoding: mtp) variant of MiniMax-M3 NVFP4
# (nvidia/MiniMax-M3-NVFP4) B300 single-node vLLM, pairing the target with the
# Inferact/MiniMax-M3-EAGLE3 draft head (3 speculative tokens). MiniMax-M3
# modelopt NVFP4 support (vllm-project/vllm PR #46380) is baked into the perf
# container image, so no runtime patch is needed; prompts are routed through the
# chat template. Target weights are pre-staged read-only at
# /scratch/models/MiniMax-M3-NVFP4 (added to the STAGED_MODELS allow-list in
# launch_b300-nv.sh); the EAGLE3 draft is downloaded to the writable models dir.
minimaxm3-fp4-b300-vllm-mtp:
  image: vllm/vllm-openai:nightly-4080263bb2c5d10deac17aaeb88e0823bc35bca9
  model: nvidia/MiniMax-M3-NVFP4
  model-prefix: minimaxm3
  runner: b300
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 2, conc-list: [1, 2, 4, 8, 16, 32, 128, 256], spec-decoding: mtp }
      - { tp: 2, ep: 2, conc-list: [1, 2, 4, 8, 32, 64, 128], spec-decoding: mtp }
      - { tp: 2, ep: 2, dp-attn: true, conc-list: [128], spec-decoding: mtp }
      - { tp: 4, conc-list: [1, 2, 4, 8], spec-decoding: mtp }
      - { tp: 4, ep: 4, conc-list: [1, 2, 4, 8], spec-decoding: mtp }
      - { tp: 8, conc-list: [1, 2, 4, 8], spec-decoding: mtp }

