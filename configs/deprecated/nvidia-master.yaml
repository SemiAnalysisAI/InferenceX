  model-prefix: minimaxm3
  runner: h100
  precision: fp8
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, conc-start: 1, conc-end: 64, spec-decoding: mtp }
      - { tp: 8, ep: 8, conc-start: 128, conc-end: 256, spec-decoding: mtp }

