# DSV4 B300 disaggregated dynamo-sglang MTP configuration.
# Each search-space entry maps one-to-one to a checked-in srt-slurm recipe under
# recipes/sglang/deepseek-v4/8k1k/. Runs on the b300 pool via
# runners/launch_b300-nv.sh. Prefill workers are TP4/DEP4 (two workers per
# 8-GPU B300 node); decode is DEP8 (one full node) except the TP4 topologies.
# EAGLE draft depth is tapered down as concurrency grows
# (3 steps / 4 draft tokens -> 2/3 at 6p1d -> 1/2 at 8p1d).
dsv4-fp4-b300-dynamo-sglang-mtp:
  image: lmsysorg/sglang:nightly-dev-cu13-20260721-8905cbd4
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: b300
  precision: fp4
  framework: dynamo-sglang
  kv-p2p-transfer: nixl
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # 1p1d-tp4-tp4 (pure TP, no dp-attn). 2 nodes (1P + 1D).
      - spec-decoding: "mtp"
        conc-list: [1]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-1p1d-tp4-tp4-mtp.yaml"
        decode:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
      # Scale-out: 1x DEP4 prefill + 6x TP4 decode. 4 nodes (1P + 3D).
      - spec-decoding: "mtp"
        conc-list: [8, 32, 64]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-1p6d-dep4-tp4-mtp.yaml"
        decode:
          num-worker: 6
          tp: 4
          ep: 1
          dp-attn: false
      # 1p1d-dep4-dep8: 1x DEP4 prefill + DEP8 decode. 2 nodes (1P + 1D).
      - spec-decoding: "mtp"
        conc-list: [256]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-1p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # 1p2d-dep4-dep8: 1x DEP4 prefill + 2x DEP8 decode. 3 nodes (1P + 2D).
      - spec-decoding: "mtp"
        conc-list: [256]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-1p2d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: true
      # 2p1d-dep4-dep8: 2x DEP4 prefill + DEP8 decode. 2 nodes (1P + 1D).
      - spec-decoding: "mtp"
        conc-list: [512]
        prefill:
          num-worker: 2
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-2p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # 4p1d-dep4-dep8: 4x DEP4 prefill + DEP8 decode. 3 nodes (2P + 1D).
      - spec-decoding: "mtp"
        conc-list: [1024]
        prefill:
          num-worker: 4
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-4p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # 6p1d-dep4-dep8: 6x DEP4 prefill + DEP8 decode. 4 nodes (3P + 1D).
      - spec-decoding: "mtp"
        conc-list: [2048]
        prefill:
          num-worker: 6
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-6p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # 8p1d-dep4-dep8. 5 nodes (4P + 1D).
      - spec-decoding: "mtp"
        conc-list: [3072]
        prefill:
          num-worker: 8
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/b300-fp4/8k1k/disagg-8p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true

