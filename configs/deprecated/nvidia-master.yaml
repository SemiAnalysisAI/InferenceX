          - "CONFIG_FILE=recipes/dsv4/sglang/gb300-fp4/8k1k/disagg-1p1d-p-tp4-ep4-dp4-d-tp16-ep16-dp16-b3072-c256-mtp.yaml"
        decode:
          num-worker: 1
          tp: 16
          ep: 16
          dp-attn: true
      # Mid curve 2p1d-dep4-dep8. 4 nodes.
      - spec-decoding: "mtp"
        conc-list: [512]
        prefill:
          num-worker: 2
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/gb300-fp4/8k1k/disagg-2p1d-p-tp4-ep4-dp4-d-tp8-ep8-dp8-b3072-c512-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # Mid curve 4p1d-dep4-dep8. 6 nodes.
