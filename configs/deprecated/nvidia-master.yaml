          - "DECODE_GPU_MEM_FRACTION=0.9"

  # P: 1xTP1   D:3xDEP4
      - spec-decoding: "none"
        conc-list: [ 3072 ]
        prefill:
          num-worker: 1
          tp: 1
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
