        conc-list: [256]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/dsv4/sglang/gb300-fp4/8k1k/disagg-1p1d-p-tp4-ep4-dp4-d-tp8-ep8-dp8-b3072-c256-mtp.yaml"
