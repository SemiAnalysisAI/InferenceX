# Deprecated AMD configurations; historical reference only.
# Active configs live in configs/amd-master.yaml.
# Colliding historical 1k1k keys have a -deprecated-1k1k suffix;
# their original keys are recorded in comments. Preserve each archived version.

# Archive source: amd-1k1k-master.yaml
# Deprecated 1k1k fixed-sequence entries archived from amd-master.yaml.
# Removed from the active master config so sweep generation no longer selects them.

dsr1-fp4-mi355x-sglang:
  image: lmsysorg/sglang:v0.5.12-rocm700-mi35x
  model: amd/DeepSeek-R1-0528-MXFP4-Preview
  model-prefix: dsr1
  runner: mi355x
  precision: fp4
  framework: sglang
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      - { tp: 4, conc-start: 4, conc-end: 64 }
      - { tp: 8, conc-start: 4, conc-end: 64 }

