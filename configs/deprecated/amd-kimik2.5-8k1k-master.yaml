kimik2.5-fp4-mi355x-atom-disagg:
  image: rocm/atom:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0_atomesh_202607121715
  model: amd/Kimi-K2.5-MXFP4
  model-prefix: kimik2.5
  runner: mi355x-disagg
  precision: fp4
  framework: atom-disagg
  kv-p2p-transfer: mooncake
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
      # 1P(tp4)1D(tp4)
    - isl: 8192
      osl: 1024
      search-space:
      - spec-decoding: "none"
        conc-list: [ 16, 32, 64, 128, 256 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
      # 1P(tp4)2D(tp8)
    - isl: 8192
      osl: 1024
      search-space:
      - spec-decoding: "none"
        conc-list: [ 1, 2, 4, 8, 16 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 2
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"

kimik2.5-fp4-mi355x-vllm-disagg:
  image: vllm/vllm-openai-rocm:nightly-2afa3f7e950264bb179d030c23a1ed1f46558fd9
  model: amd/Kimi-K2.5-MXFP4
  model-prefix: kimik2.5
  runner: mi355x-disagg
  precision: fp4
  framework: vllm-disagg
  router: { name: vllm-router, version: "0.1.14" }
  kv-p2p-transfer: moriio
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    # All workers TP4 (real-weight sweep: TP8 decode is no better than TP4).
    # Split across P/D topologies: 1D is stable at low conc; the high-conc tail
    # runs on 2D so decode load is spread across two engines.
    - isl: 8192
      osl: 1024
      search-space:
      # 1P(TP4) 1D(TP4) = 2 nodes. Low concurrency only.
      - spec-decoding: "none"
        conc-list: [ 1, 2, 4 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
      # 1P(TP4) 2D(TP4) = 3 nodes. High concurrency (decode KV/load spread over 2D).
      - spec-decoding: "none"
        conc-list: [ 8, 16, 32, 64, 128, 256, 512 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
