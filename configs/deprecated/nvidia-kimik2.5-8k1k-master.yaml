# Deprecated Kimi-K2.5/2.6/2.7-Code Single-turn 8k1k entries archived from
# nvidia-master.yaml. Deprecated after Thursday, August 6, 2026 (see the
# Deprecation Notice in MODELS.md). Combined with the agentic-coding
# deprecation of August 3, 2026, this leaves kimik2.5 with no active scenario:
# the model is fully retired after August 6, 2026.
# Removed from the active master config so sweep generation no longer selects them.

kimik2.5-int4-b200-vllm:
  image: vllm/vllm-openai:v0.25.0
  model: moonshotai/Kimi-K2.5
  model-prefix: kimik2.5
  runner: b200
  precision: int4
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, conc-start: 4, conc-end: 64 }

kimik2.5-int4-b300-vllm:
  image: vllm/vllm-openai:v0.25.0
  model: moonshotai/Kimi-K2.5
  model-prefix: kimik2.5
  runner: b300
  precision: int4
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, conc-start: 4, conc-end: 64 }
      - { tp: 4, ep: 1, conc-start: 4, conc-end: 64 }

