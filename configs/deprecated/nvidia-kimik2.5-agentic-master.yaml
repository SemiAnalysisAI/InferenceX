# Left behind by #2493: this key stayed in nvidia-master.yaml while its script
# moved to benchmarks/single_node/agentic/deprecated/, so the config pointed at
# a path that no longer existed. Archived here with its siblings.
kimik2.5-int4-h100-vllm:
  image: vllm/vllm-openai:v0.22.0
  model: moonshotai/Kimi-K2.5
  model-prefix: kimik2.5
  runner: cluster:h100-dgxc
  precision: int4
  framework: vllm
  multinode: false
  scenarios:
    # H100 has 80 GB HBM per GPU (smallest in this set); the KV cliff arrives
    # early. Sweep saturates conc=20 to keep total HBM headroom.
    agentic-coding:
    - dram-utilization: 0.80
      search-space:
      - { tp: 8, kv-offloading: none, conc-list: [1, 2, 4, 8, 12, 16, 20] }
      - { tp: 8, kv-offloading: dram, kv-offload-backend: { name: vllm-simple }, conc-list: [1, 2, 4, 8, 12, 16, 20] }
