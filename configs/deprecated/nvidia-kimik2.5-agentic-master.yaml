  model: Kimi-K2.6-NVFP4
  model-prefix: kimik2.5
  runner: cluster:b300-nv
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.80
      search-space:
