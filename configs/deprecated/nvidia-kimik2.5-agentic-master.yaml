# Deprecated Kimi-K2.5/2.6/2.7-Code agentic-coding entries archived from
# nvidia-master.yaml. Deprecated after Monday, August 3, 2026 (see the
# Deprecation Notice in MODELS.md). Single-turn 8k1k stays active until
# August 6, 2026.
# Removed from the active master config so sweep generation no longer selects them.


kimik2.5-int4-b200-vllm-agentic:
  image: vllm/vllm-openai:v0.22.0
  model: moonshotai/Kimi-K2.5
  model-prefix: kimik2.5
  runner: cluster:b200-dgxc
  precision: int4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.80
      search-space:
      - { tp: 8, kv-offloading: none, conc-list: [1, 2, 4, 8, 16, 32] }
      - { tp: 8, kv-offloading: dram, kv-offload-backend: { name: vllm-simple }, conc-list: [32, 64, 96, 128] }

