# Deprecated MiniMax M2.5/M2.7 entries archived from amd-master.yaml.
# Removed from the active master config so sweep generation no longer selects them.


minimaxm2.5-fp8-mi355x-vllm:
  image: vllm/vllm-openai-rocm:v0.22.0
  model: MiniMaxAI/MiniMax-M2.5
  model-prefix: minimaxm2.5
  runner: mi355x
  precision: fp8
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      - { tp: 2, ep: 2, conc-start: 2, conc-end: 512 }
      - { tp: 4, ep: 4, conc-start: 4, conc-end: 256 }
      - { tp: 8, ep: 8, conc-start: 2, conc-end: 2 }
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 2, ep: 2, conc-start: 2, conc-end: 256 }
      - { tp: 4, ep: 4, conc-start: 4, conc-end: 512 }
      - { tp: 8, ep: 8, conc-start: 2, conc-end: 2 }

