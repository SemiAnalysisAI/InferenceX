dsv4-fp4-b200-dynamo-vllm:
  image: vllm/vllm-openai:v0.23.0
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: cluster:b200-nscale
  precision: fp4
  framework: dynamo-vllm
  router: { name: dynamo-router, version: "1.2.0.dev20260426" }
  kv-p2p-transfer: nixl
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # B200 adaptation of the DSV4 GB200 vLLM disagg recipes. Each worker
      # maps to one full 8-GPU B200 node.
      - conc-list: [1]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-b200-low-latency-c1.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
      - conc-list: [32, 128]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-b200-low-latency-c32-c128.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
      - conc-list: [64]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-b200-low-latency-c64.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
      - conc-list: [256]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-b200-low-middle-c256.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      - conc-list: [512]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-b200-low-middle-c512.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true

dsv4-fp4-gb200-dynamo-vllm:
  image: vllm/vllm-openai:v0.25.1
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: gb200
  precision: fp4
  framework: dynamo-vllm
  router: { name: dynamo-router, version: "1.2.0.dev20260426" }
  kv-p2p-transfer: nixl
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # Validated 8k/1k points mirrored from NVIDIA/srt-slurm
      # aflowers/vllm-gb200-v0.20.0 history. conc-list values match each
      # recipe's benchmark.concurrencies.

      # Low latency: 1 prefill (DEP=8) + 1 decode (TP=8). 5 nodes total with
      # a dedicated NATS/etcd infra node.
      - conc-list: [1]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-gb200-low-latency.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false

      # Low-middle curve: 1 prefill (DEP=8) + 4 decode (TP=8). 11 nodes total
      # with a dedicated NATS/etcd infra node.
      - conc-list: [256, 512]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-gb200-low-middle-curve.yaml"
        decode:
          num-worker: 4
          tp: 8
          ep: 1
          dp-attn: false

      # MegaMOE mid curve: 1 prefill (DEP=8) + 1 decode (DEP=8). 5 nodes
      # total with a dedicated NATS/etcd infra node.
      - conc-list: [256, 512, 1024]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-gb200-mid-curve-megamoe.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true

      # MegaMOE high throughput: 2 prefill (DEP=8 each) + 1 decode (DEP=8).
      # 7 nodes total with a dedicated NATS/etcd infra node.
      - conc-list: [4096]
        prefill:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-gb200-high-tpt-megamoe.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true

      # MegaMOE max throughput: 3 prefill (DEP=8 each) + 1 decode (DEP=8).
      # 9 nodes total with a dedicated NATS/etcd infra node.
      - conc-list: [4096]
        prefill:
          num-worker: 3
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/vllm/deepseek-v4/8k1k/disagg-gb200-max-tpt-megamoe.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true

