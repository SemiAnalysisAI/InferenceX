# Deprecated Kimi-K2.6 Single-turn 8k1k entry archived from nvidia-master.yaml.
# The August 6, 2026 retirement covered Kimi-K2.5/2.6/2.7-Code, but the
# separate kimik2.6 prefix was missed. Archived on September 17, 2026.
# Keep the referenced srt-slurm recipes and launcher support for historical use.

kimik2.6-fp4-b200-dynamo-vllm:
  image: vllm/vllm-openai:v0.25.1
  model: nvidia/Kimi-K2.6-NVFP4
  model-prefix: kimik2.6
  runner: cluster:b200-nscale
  precision: fp4
  framework: dynamo-vllm
  router: { name: dynamo-router, version: "1.3.0.dev20260721" }
  kv-p2p-transfer: nixl
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - conc-list: [1]
        prefill:
          num-worker: 1
          tp: 1
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/kimik2.6/vllm/b200-fp4/8k1k/disagg-1p1d-dep8-tp8-c1-stp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
      - conc-list: [32]
        prefill:
          num-worker: 1
          tp: 1
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/kimik2.6/vllm/b200-fp4/8k1k/disagg-1p8d-dep4-tp4-c32-stp.yaml"
        decode:
          num-worker: 8
          tp: 4
          ep: 1
          dp-attn: false
      - conc-list: [128]
        prefill:
          num-worker: 1
          tp: 1
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/kimik2.6/vllm/b200-fp4/8k1k/disagg-1p8d-dep4-tp4-c128-stp.yaml"
        decode:
          num-worker: 8
          tp: 4
          ep: 1
          dp-attn: false
      - conc-list: [512]
        prefill:
          num-worker: 1
          tp: 1
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/kimik2.6/vllm/b200-fp4/8k1k/disagg-1p4d-dep4-tp4-c512-stp.yaml"
        decode:
          num-worker: 4
          tp: 4
          ep: 1
          dp-attn: false
      - conc-list: [2048]
        prefill:
          num-worker: 1
          tp: 1
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/kimik2.6/vllm/b200-fp4/8k1k/disagg-1p1d-dep8-dep8-c2048-stp.yaml"
        decode:
          num-worker: 1
          tp: 1
          ep: 8
          dp-attn: true
      - conc-list: [8192]
        prefill:
          num-worker: 2
          tp: 1
          ep: 8
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/kimik2.6/vllm/b200-fp4/8k1k/disagg-2p1d-dep8-dep8-c8192-stp.yaml"
        decode:
          num-worker: 1
          tp: 1
          ep: 8
          dp-attn: true
