# Focused config: DSR1-0528 MXFP4-v2 disagg (P/D) MTP, MI355X, 8k1k, conc-64 ONLY.
# FIX-IMAGE run for issue #27194 conc-64 A/B: same regime as the upstream baseline
# (1*DEP8 + 1*DEP8, MTP3, MoRI dispatch buffer 32) but with the aiter mla_reduce_v1
# NaN/empty-split guard baked in (image tag ...-aiter-mla-nanguard-gd4b8ce0c).
dsr1-fp4-mi355x-sglang-disagg-8k1k-mtp:
  image: rocm/sgl-dev:v0.5.16-rocm720-mi35x-20260727-aiter-mla-nanguard-gd4b8ce0c
  model: amd/DeepSeek-R1-0528-MXFP4-v2
  model-prefix: dsr1
  runner: mi355x-disagg
  precision: fp4
  framework: sglang-disagg
  router: { name: sglang-router, version: "0.3.2" }
  kv-p2p-transfer: mori
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - spec-decoding: "mtp"
        conc-list: [ 64 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=3"
