# Focused config: DSR1-0528 MXFP4 + MTP, single-node MI355X sglang, conc-64 eval.
# Used to run the conc-64 gsm8k eval CI against a pinned image (issue #27194 repro).
# Only the MTP entry (model amd/DeepSeek-R1-0528-MXFP4) — matches the investigated config.
dsr1-fp4-mi355x-sglang-mtp:
  image: lmsysorg/sglang-rocm:v0.5.16-rocm720-mi35x-20260727
  model: amd/DeepSeek-R1-0528-MXFP4
  model-prefix: dsr1
  runner: mi355x
  precision: fp4
  framework: sglang
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, ep: 1, conc-start: 4, conc-end: 64, spec-decoding: mtp }
