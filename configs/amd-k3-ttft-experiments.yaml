# Supply side, the blunt version: two prefill nodes instead of one.
#
# Nothing else on the list changes the service rate itself. At 8,692 tok/s
# against an offered 10,407 tok/s, a second prefill worker takes the duty cycle
# from ~120% to ~60% and the queue should collapse even if recompute volume
# never moves. It also doubles the GPU KV pool available for prefixes, which the
# 0.96 experiment showed cannot be bought any other way.
#
# Costs a third node. If the tail improves here and nowhere else, the honest
# conclusion is that 1P1D is simply under-provisioned for this corpus rather
# than misconfigured.
kimik3-ttft-exp-2p1d:
