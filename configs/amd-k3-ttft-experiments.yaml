# Is the PD split itself costing prefix reuse? Single node, same conc, same
# corpus, and dram-utilization deliberately set to 0.50 rather than the
# published single-node 0.40 so the CPU tier is 1499 GB on both sides and the
# only difference left is the topology.
#
# The hypothesis this tests: in 1P1D the model's output tokens are generated on
# the decode engine, so their KV exists only there. The next turn's prompt is
# old prompt + model output + new tool result, and prefix caching is strictly
# sequential, so the prefill engine's match dies at the output segment and
# everything after it - including the fresh tool result - is recomputed. One
# engine holding both should match straight through.
#
# Read it on vllm:prefix_cache_hits / prefix_cache_queries, not on TTFT: a
# single node also has no KV transfer and a different decode story, so TTFT is
# not comparable but the prefill hit rate is.
kimik3-ttft-exp-singlenode-c8:
  image: vllm/vllm-openai-rocm:nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.50
      search-space:
      - tp: 8
        ep: 1
        kv-offloading: dram
        kv-offload-backend: { name: vllm-simple }
        conc-list: [8]
        spec-decoding: mtp
