# Opt-in native SRT pilot. Production coverage remains in nvidia-master.yaml.
dsr1-fp8-h200-sglang:
  image: lmsysorg/sglang:v0.5.12-cu130
  model: deepseek-ai/DeepSeek-R1-0528
  model-prefix: dsr1
  runner: cluster:h200-dgxc
  precision: fp8
  framework: sglang
  multinode: false
  scenarios:
    fixed-seq-len:
      - isl: 8192
        osl: 1024
        search-space:
          - tp: 8
            conc-list: [4]
            srt-recipe: benchmarks/single_node/srt-slurm-recipes/dsr1/sglang/h200-fp8/8k1k.yaml:base
