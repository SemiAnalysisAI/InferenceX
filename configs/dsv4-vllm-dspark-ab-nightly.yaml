# DSV4 MI355X AgentX c128 A/B on the latest ROCm nightly available on
# 2026-09-23. Both arms use the same image, checkpoint, DP8 attention topology,
# expert TP8 topology, router, KV policy, and server recipe.
# Image digest: sha256:d5da8f963f0571a171f6817cc108bc2371a39528a11aeba5a00cb78177fcb4e5

dsv4-fp4-mi355x-vllm-agentic-mtp-nightly-ab:
  image: vllm/vllm-openai-rocm:nightly-e9757321527ca1ecd514c07c1418dd2c53da3d19
  model: deepseek-ai/DeepSeek-V4-Pro-0813
  model-prefix: dsv4
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.60
      search-space:
      - { tp: 8, ep: 1, dp-attn: true, kv-offloading: none, spec-decoding: mtp, conc-list: [128], router: { name: vllm-router, version: "0.1.14" } }

dsv4-fp4-mi355x-vllm-agentic-dspark-nightly-ab:
  image: vllm/vllm-openai-rocm:nightly-e9757321527ca1ecd514c07c1418dd2c53da3d19
  model: deepseek-ai/DeepSeek-V4-Pro-0813
  model-prefix: dsv4
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.60
      search-space:
      # draft_model is the existing InferenceX matrix label for DSpark-style
      # speculative decoders; the shared script maps it to vLLM method=dspark.
      - { tp: 8, ep: 1, dp-attn: true, kv-offloading: none, spec-decoding: draft_model, conc-list: [128], router: { name: vllm-router, version: "0.1.14" } }
